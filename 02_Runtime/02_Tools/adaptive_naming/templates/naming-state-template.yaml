schema_version: "0.2.2"

job:
  id: null
  target_type: null
  target_description: null
  long_term_scope: null
  audience: []
  contexts: []
  languages: []
  success_definition: []
  hard_constraints: []
  avoid: []
  required_reality_checks: []

constraint_registry:
  confirmed_hard_constraints: []
  # Example:
  # - id: HC001
  #   statement: null
  #   source_type: owner_explicit | task_source | legal | technical
  #   source_ref: null
  #   confirmed_at: null
  #   notes: []

  owner_preferences: []
  # Preferences influence convergence but are not hard constraints unless explicitly promoted by the Owner.

  controller_search_variables: []
  # Example:
  # - id: SV001
  #   name: word_count
  #   current_value: single_or_multiword_open
  #   allowed_values: [single_token, multiword, both]
  #   rationale: null
  #   owner_approval_required_to_change: false

  assumptions: []
  # - id: A001
  #   statement: null
  #   source_ref: null
  #   confidence: low | medium | high
  #   may_be_hard_constraint: false
  #   status: provisional | retracted | confirmed

brief:
  semantic_core: []
  desired_character: []
  communication_targets: []
  abstraction_preference: null
  architecture_requirements: []
  pronunciation_requirements: []
  spelling_requirements: []

owner_preference:
  stage_weight: low
  stable_signals: []
  provisional_signals: []
  observations: []

quality_dimensions:
  active:
    - distinctiveness
    - pronounceability
    - spelling_burden
    - memorability
    - semantic_fit
    - semantic_room
    - target_scale_fit
    - longevity
    - symbolic_compression
    - cross_context_use
    - architecture_extensibility
  optional: []
  notes: []

map:
  initial_landscape_summary: null
  regions: []
  # Example region object:
  # - id: region-001
  #   label: null
  #   semantic_basis: []
  #   construction_families: []
  #   prior_crowding: unknown
  #   observed_crowding: unknown
  #   quality_potential: unknown
  #   evidence: []
  #   status: unexplored | exploring | promising | crowded | low-yield | paused
  #   notes: []

search_control:
  # exploration | exploitation
  mode: exploration
  mode_rationale: null

  semantic_coverage: []
  # Example:
  # - region_id: region-001
  #   label: null
  #   sampling_level: none | low | medium | high
  #   recent_candidate_count: 0
  #   strong_candidate_count: 0
  #   notes: []

  family_concentration:
    morphological: []
    semantic: []
    construction: []
    # Example item:
    # - family_id: null
    #   recent_candidate_ids: []
    #   promising_candidate_ids: []
    #   concentration: low | medium | high
    #   interpretation: null

  incumbent_isolation:
    comparison_only_candidate_ids: []
    leaked_candidate_ids: []
    notes: []

  generation_isolation:
    # isolated_runtime | fresh_context | best_effort_same_context | none | unknown
    level: unknown
    runtime_identity: null
    historical_context_may_have_seen_controller_only_exclusions: unknown
    evidence: []
    claim_policy: >-
      Only isolated_runtime/fresh_context with supporting evidence may claim the Generator did not see hidden information.
      best_effort_same_context may only claim that the current brief did not re-expose it.
    notes: []

  controller_only_exclusions:
    incumbent_candidate_ids: []
    cooled_family_ids: []
    survivor_pattern_ids: []
    owner_reaction_subject_ids: []
    other: []
    # These are for Controller/post-generation filtering; do not enumerate them in the Generator brief by default.

  cooldowns: []
  # Task-local only; never infer a permanent Skill blacklist from one job.
  # - family_id: null
  #   family_type: morphological | semantic | construction
  #   reason: null
  #   applies_until: null

  reality_feedback_quarantine:
    enabled_in_exploration: true
    same_batch_feedback_to_generator: prohibited
    notes: []

  strategy_fidelity_checks: []
  # - round_id: null
  #   declared_target: null
  #   actual_output_summary: null
  #   faithful: true
  #   diagnosis: null

  constraint_integrity_checks: []
  # - round_id: null
  #   candidate_constraint: null
  #   provenance_found: false
  #   classification: confirmed_hard_constraint | owner_preference | controller_search_variable | assumption
  #   drift_detected: false
  #   action: null

  generator_brief:
    id: null
    search_mode: exploration
    positive_objectives: []
    positive_search_zones: []
    positive_construction_targets: []
    quality_targets: []
    hard_constraints_only: []
    hard_constraint_source_refs: []
    question_to_answer: null
    negative_examples_included: false
    controller_only_exclusions_exposed: false
    omitted_context_categories:
      - incumbent_names
      - cooled_family_tokens
      - reality_survivor_shapes
      - owner_reactions_to_incumbents
    notes: []

  post_generation_filter:
    enabled: true
    check_cooled_families: true
    check_incumbent_similarity: true
    check_strategy_fidelity: true
    check_other_controller_only_exclusions: true
    last_round_id: null
    generated_count: 0
    blocked_count: 0
    blocked_candidate_ids: []
    violation_types: []
    high_hit_rate: false
    notes: []

execution:
  autonomous_microcycles: true
  # Internal microcycles do not require a user "continue" after each one.
  preferred_batch_size:
    broad_exploration: 6-10
    focused_or_exploitation: 3-5
    validation: 0

  owner_interaction_gate:
    last_checked_at: null
    proposed_question: null
    # true_boundary_change | final_subjective_choice | missing_goal_fact | search_strategy | reversible_architecture_expansion | none
    classification: none
    confirmed_constraint_ids_affected: []
    missing_fact: null
    reversible_without_owner: true
    parallel_exploration_possible: false
    decision: continue_autonomously
    rationale: null

  pause_only_when:
    - source_backed_owner_boundary_decision_required
    - final_subjective_choice_required
    - missing_goal_fact_cannot_be_recovered
    - irreducible_blocker
    - budget_or_time_boundary
  current_budget_or_time_boundary: null

construction_strategies:
  tried: []
  # Example:
  # - id: doubled_letters
  #   region_ids: []
  #   attempts: 0
  #   quality_signal: unknown
  #   feasibility_signal: unknown
  #   recurring_risks: []
  #   notes: []
  new_discoveries: []

candidates: []
# Candidate example:
# - id: N001
#   name: null
#   active: true
#   role: active | comparison_only | held | retired | finalist
#   generation_use: allowed | prohibited_as_template_or_semantic_anchor
#   region_id: null
#   secondary_region_ids: []
#   semantic_family_ids: []
#   morphological_family_ids: []
#   construction_strategy: null
#   generation_rationale: null
#   provenance:
#     round: null
#     source: null
#     generation_brief_id: null
#     generation_isolation_level: unknown
#   quality:
#     distinctiveness: null
#     pronounceability: null
#     spelling_burden: null
#     memorability: null
#     semantic_fit: null
#     semantic_room: null
#     target_scale_fit: null
#     longevity: null
#     symbolic_compression: null
#     cross_context_use: null
#     architecture_extensibility: null
#     optional: {}
#     rationale: []
#   pareto:
#     dominated: false
#     dominated_by: []
#     dimensions: []
#   reality:
#     collision:
#       observation: unverified
#       confidence: null
#       evidence: []
#     domains: []
#     trademark_oriented_risk:
#       observation: unverified
#       evidence: []
#     namespaces: []
#   owner_signal:
#     observation: unseen | pull | neutral | repel
#     confidence: null
#     notes: []
#   diagnosis: []
#   retirement:
#     retired: false
#     reason: null
#     learning_preserved: true

rounds: []
# - id: RND-001
#   action: audit_constraints | generate | post_generation_filter | evaluate_quality | verify_reality | diagnose | check_search_integrity | change_strategy
#   search_mode: exploration | exploitation
#   generated_count: 0
#   generation_brief_id: null
#   generation_isolation_level: unknown
#   findings: []
#   integrity_check:
#     semantic_coverage_checked: false
#     family_concentration_checked: false
#     incumbent_anchoring_checked: false
#     negative_constraint_priming_checked: false
#     isolation_claim_checked: false
#     constraint_drift_checked: false
#     owner_interaction_gate_checked: false
#     post_generation_filter_checked: false
#     survivorship_feedback_checked: false
#     strategy_fidelity_checked: false
#   post_generation_filter:
#     blocked_count: 0
#     violation_types: []
#   next_action: null

observations: []
# - id: O001
#   timestamp: null
#   scope: candidate | batch | region | strategy | search_integrity | owner | reality | constraint
#   subject_ids: []
#   observation: null
#   evidence: []

diagnostics: []
# - id: D001
#   triggered_by: []
#   level: candidate | batch | region | search_integrity | strategy | constraint
#   diagnosis_type: null
#   statement: null
#   confidence: low | medium | high
#   counterevidence: []
#   proposed_state_change: null

experience_candidates: []
# Only for potentially cross-task lessons; do not auto-promote to Skill.
# - id: E001
#   observation: null
#   scope: task_local | potentially_general
#   supporting_evidence: []
#   supporting_jobs: []
#   counterexamples: []
#   confidence: low | medium | high
#   possible_generalization: null
#   proposed_change: null

current_state:
  strongest_candidates: []
  promising_candidates: []
  held_candidates: []
  finalists: []
  pareto_front: []
  current_region_ids: []
  search_mode: exploration
  generation_isolation_level: unknown
  biggest_unknown: null
  blockers: []
  information_gain: unknown
  search_integrity_status: unknown
  constraint_integrity_status: unknown
  owner_review_needed_now: false

next_action:
  action: null
  target: null
  rationale: null
  triggered_by: []
  expected_information_gain: null
  search_mode: null
  requires_owner: false
  owner_gate_classification: none
  affected_confirmed_constraint_ids: []

stop:
  status: continue
  # continue | finalist_ready | owner_decision | blocked | budget_stop | true_boundary_pause
  reason: null
  unresolved: []