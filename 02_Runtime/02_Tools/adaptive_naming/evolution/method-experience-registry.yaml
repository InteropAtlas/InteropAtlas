schema_version: "0.1"
registry: adaptive-naming-method-experience
purpose: >-
  Cross-task evidence store for method evolution. Per-job experience candidates enter here before
  they can become stable naming-method rules. This registry is Controller/evolution-layer context,
  not Generator context.

promotion_policy:
  cross_task_default:
    minimum_independent_jobs: 2
    require_counterevidence_check: true
    require_regression: true
  severe_control_defect_exception:
    allowed: true
    requirements:
      - real_task_evidence
      - reproducible_or_mechanistically_clear_failure
      - explicit_control_layer_cause
      - regression_case_added_or_updated
      - rollback_or_supersede_path
  prohibited_shortcuts:
    - promote_because_one_candidate_won
    - promote_because_domain_was_available
    - promote_owner_one_off_preference_as_general_quality_rule
    - feed_registry_survivor_shapes_to_generator

experiences:
  - experience_id: EXP-001
    observation: A thin or undocumented reality search can create false-negative feasibility claims.
    proposed_generalization: Reality-negative claims require a minimum auditable query contract and freshness rule.
    mechanism: search incompleteness was mistaken for negative evidence
    source_jobs: [organization-naming-411]
    supporting_evidence:
      - RND-056 apparent survivors were invalidated by stronger recheck in RND-057
      - Reality Screening Contract v0.3.3 added
      - REG-016 regression passed in live review
    counterevidence: []
    confidence: high
    scope: potentially_general
    status: provisional_rule
    promoted_under: severe_control_defect_exception
    introduced_in_version: 0.3.3
    rollback_target: 0.3.2

  - experience_id: EXP-002
    observation: Internal search-path choices can be mistakenly escalated into Owner boundaries.
    proposed_generalization: Owner decides true goals/boundaries; Controller decides reversible search strategy and method schedule.
    mechanism: controller uncertainty was misclassified as owner decision need
    source_jobs: [organization-naming-411]
    supporting_evidence:
      - v36 A/B/AB/C pause later reclassified as search_strategy
      - REG-001 and REG-002 regression coverage
    counterevidence: []
    confidence: high
    scope: potentially_general
    status: provisional_rule
    promoted_under: severe_control_defect_exception
    introduced_in_version: 0.2.2
    rollback_target: 0.2.1

  - experience_id: EXP-003
    observation: Long negative exclusion lists can prime the Generator toward the very families being avoided.
    proposed_generalization: Keep exclusions Controller-only and use positive Generation Briefs plus post-generation filtering.
    mechanism: negative constraint priming and same-context contamination
    source_jobs: [organization-naming-411]
    supporting_evidence:
      - mode-collapse reset around historical incumbent/family patterns
      - REG-003 isolation honesty and current controller-only exclusion policy
    counterevidence: []
    confidence: medium_high
    scope: potentially_general
    status: provisional_rule
    promoted_under: severe_control_defect_exception
    introduced_in_version: 0.2.1
    rollback_target: 0.2.0

  - experience_id: EXP-004
    observation: Verifiable etymological grounding improves provenance honesty but does not necessarily reduce namespace crowding.
    proposed_generalization: Semantic grounding should remain an objective/strategy option rather than a universal construction requirement.
    mechanism: familiar morphemes plus familiar brand morphology remain heavily occupied
    source_jobs: [organization-naming-411]
    supporting_evidence:
      - RND-058 grounded-root probe
    counterevidence: []
    confidence: medium
    scope: task_supported
    status: observed

  - experience_id: EXP-005
    observation: Slightly longer and less templated forms may improve namespace yield while increasing spelling-recovery and surname/fantasy risk.
    proposed_generalization: Length/structural distance is a search variable with counter-pressure, not a global preference.
    mechanism: greater string/phonotactic distance reduces exact collisions but weakens familiar recovery cues
    source_jobs: [organization-naming-411]
    supporting_evidence:
      - RND-060 and RND-061
    counterevidence: []
    confidence: medium
    scope: task_supported
    status: observed

  - experience_id: EXP-006
    observation: Changing workflow pattern can produce new diagnostic evidence even when construction operators and candidate outcome do not improve immediately.
    proposed_generalization: Workflow patterns should be scheduled separately from construction operators when the current unknown concerns how evidence is generated rather than how a string is formed.
    mechanism: divergence-burst and creative-linguistic-parallel changed search breadth and evidence separation without requiring a new word-formation family
    source_jobs: [organization-naming-411]
    supporting_evidence:
      - RND-062 divergence_burst interrupted repetitive micro-probe cadence and reopened architecture coverage
      - RND-063 creative_linguistic_parallel separated recoverability failures from reality collisions before domain work
      - REG-017 workflow-vs-operator and REG-021 cadence-adaptation cover the intended behavior
    counterevidence:
      - both live patterns have so far produced no Owner-ready finalist, so outcome advantage is not established
    confidence: medium_high
    scope: potentially_general
    status: observed

  - experience_id: EXP-007
    observation: An explicit search landscape can expose a two-pole frontier and identify under-sampled identity architectures that are not visible when only operator statistics are tracked.
    proposed_generalization: Keep a lightweight region map that separates intrinsic quality yield, reality crowding, sampling status and information gain; use it to choose the next workflow without feeding survivor shapes to Generator context.
    mechanism: RND-064 consolidated historical evidence into distinct region pressures and revealed two under-sampled architecture hypotheses between crowded natural identities and harder-to-recover invented identities
    source_jobs: [organization-naming-411]
    supporting_evidence:
      - RND-063 explicitly identified the natural-English vs higher-distance pressure frontier
      - RND-064 white_space_mapping converted that frontier into attributable region hypotheses and a category-parallel next action
    counterevidence:
      - no controlled probe has yet shown that the newly identified regions improve finalist yield
      - evidence is still from one Naming Job
    confidence: medium
    scope: potentially_general
    status: observed

  - experience_id: EXP-008
    observation: A Controller can vary semantic regions and workflows while still exposing the Owner to a narrow surface-form family, leaving morphotype preference unknown until late convergence.
    proposed_generalization: >-
      When naming-form preference is genuinely unknown and could change search allocation, explicitly track Owner-visible morphotype coverage and run a bounded preference probe before deep convergence. The probe may use mature real-world brand names as low-cost reference anchors, task-specific generated examples, or a hybrid; the stable method should specify the diagnostic goal and bias controls rather than freeze a brand list or questionnaire.
    mechanism: word-count/construction variables were treated mainly as Controller search variables, so semantic diversity was mistaken for sufficient identity-form diversity
    source_jobs: [organization-naming-411]
    supporting_evidence:
      - RND-074 through RND-080 produced semantically distinct finalists but most Owner-visible forms still relied on ordinary-English phrase/compound structures
      - Owner explicitly reported that this did not reveal preference across major naming-form classes
      - existing toolbox already contained lexical, phrase, blend, root-derived, coinage, sound-first and transformation operators, indicating a scheduling/feedback gap rather than missing tools
      - Owner proposed structured contrast questions using mature brand names where useful to discover broad form preference without spending generation budget unnecessarily
    counterevidence:
      - early fixed-form questionnaires can prematurely narrow creativity
      - famous brands carry success halo, category familiarity, visual identity and company-reputation confounds that can be mistaken for preference for the name form itself
      - one Naming Job does not establish the best timing, sample count or contrast design
    confidence: high_for_gap_medium_for_general_rule
    scope: potentially_general
    status: method_hypothesis_input

  - experience_id: EXP-009
    observation: >-
      Repeated positive Owner feedback can cause the Controller to reproduce the surface morphology of the liked candidate instead of learning the latent reasons for preference, even when the stable Skill already prohibits direct finalist-template use.
    proposed_generalization: >-
      Positive references should be abstracted into latent virtues versus surface morphology before feedback changes exploration, and Owner-visible batches should undergo a batch-level generalization/diversity audit before exposure.
    mechanism: >-
      In #411 the Controller correctly learned that semantic density and mature brandability mattered, but then overused Merosophy-adjacent classical roots, learned suffixes, and similar construction grammar. Candidate-level explanations differed while batch-level morphology remained homogeneous.
    source_jobs: [organization-naming-411]
    supporting_evidence:
      - INC-MORPHOTYPE-COLLAPSE-002 showed earlier semantic diversity with narrow visible naming architecture
      - RND-129 showed that smoother coined names did not beat Merosophy, implying the positive signal was not merely phonetic smoothness
      - INC-MORPHOTYPE-OVERFIT-003 / RND-130 showed a second collapse after Merosophy became the reference leader
      - Owner independently detected the batch-level similarity despite existing anti-template and anti-collapse Skill rules
      - organization-naming-411-process-review-v0.1.md documents the full process and proposed controls
    counterevidence:
      - evidence is still from one Naming Job and one Owner
      - some deliberate bounded exploitation should legitimately reuse morphology when explicitly declared and tested
      - a homogeneous batch can be valid when the current question intentionally compares within one construction family
    confidence: high_for_failure_medium_high_for_general_control
    scope: potentially_general
    status: method_hypothesis_input

method_hypotheses:
  - hypothesis_id: HYP-001
    claim: Adaptive Naming should schedule workflow patterns separately from construction operators.
    changes:
      - add_workflow_pattern_scheduler
      - retain_operator_scheduler
    expected_benefit: preserve useful professional-method mechanisms without executing full fixed agency SOPs
    known_risk: orchestration complexity and over-modularization
    supporting_experience_ids: [EXP-006]
    supporting_prior_art:
      - G1 creative_linguistic_parallel
      - G2 territory_and_divergence
      - G3 white_space_mapping
      - G6 architecture_stress
      - G7 feedback_refinement
      - G8 online_observe_update
    counterevidence:
      - current evidence is from one Naming Job and does not yet establish better finalist yield
    regression_cases: [REG-017-workflow-vs-operator, REG-021-search-cadence-adaptation]
    status: testing
    introduced_in_version: 0.4.0
    rollback_target: 0.3.3

  - hypothesis_id: HYP-002
    claim: Cross-task method evolution should be evidence-gated and separate from per-job adaptive state.
    changes:
      - add_cross_task_registry
      - add_promotion_contract
      - preserve_generator_quarantine
    expected_benefit: enable cumulative method learning without turning one-off task outcomes into unstable global rules
    known_risk: registry maintenance overhead
    supporting_experience_ids: [EXP-001, EXP-002, EXP-003]
    counterevidence:
      - only one real Naming Job is currently represented; cross-task promotion behavior remains untested
    regression_cases: [REG-018-method-evolution-gating]
    status: testing
    introduced_in_version: 0.4.0
    rollback_target: 0.3.3

  - hypothesis_id: HYP-003
    claim: Search Landscape should remain a first-class state object combining G3-style prior mapping with G8-style online updates.
    changes:
      - keep_region_level_sampling_state
      - separate_quality_yield_from_reality_crowding
      - schedule_under_sampled_high_information_regions
    expected_benefit: prevent repeated local operator switching from masquerading as broad search and make the next exploration target attributable
    known_risk: false precision if sparse historical evidence is over-interpreted as a reliable map
    supporting_experience_ids: [EXP-007]
    supporting_prior_art:
      - G3 competitive_taxonomy_white_space
      - G8 region_state_online_update
    counterevidence:
      - current white-space regions are hypotheses, not availability facts
      - no cross-task replication yet
    regression_cases: [REG-019-search-landscape-quality-reality-separation]
    status: testing
    introduced_in_version: 0.4.0
    rollback_target: 0.3.3

  - hypothesis_id: HYP-004
    claim: >-
      Adaptive Naming should distinguish semantic/search diversity from Owner-visible morphotype diversity and explicitly reduce morphotype-preference uncertainty before deep convergence when that preference can materially change the search.
    proposed_mechanism:
      trigger: morphotype_preference_unknown_and_search_allocation_sensitive
      action: bounded_owner_morphotype_preference_probe
      sample_sources: [mature_brand_reference_examples, task_specific_generated_examples, hybrid]
      design_principles:
        - compare broad identity forms rather than individual famous brands as winners
        - use several contrast questions or balanced anchor sets instead of one exemplar per class where bias risk is high
        - ask for relative attraction, rejection and reasons; do not force a single favorite class
        - separate surface-form preference from semantic meaning, industry association, logo quality and familiarity when possible
        - treat result as budget-allocation evidence, not hard constraint or universal quality score
        - keep exact brand/example lists outside the stable Skill so Controller can adapt them to language, market and Owner familiarity
      stop_condition: enough signal exists to reallocate exploration budget without collapsing creative diversity
    changes:
      - track_owner_visible_morphotype_coverage
      - add_morphotype_preference_unknown_trigger
      - add_optional_morphotype_preference_probe
      - allow_reference_brand_or_generated_anchor_sets
      - feed_category_level_owner_signal_to_budgeting_not_as_generation_template
    expected_benefit: discover whether the Owner tends toward lexical, phrase, blend, derived, coinage, non-English, acronymic, symbolic or other identity forms before spending most search budget inside one surface family
    known_risk: questionnaire rigidity, brand halo/familiarity bias, premature preference lock-in, and overfitting one Owner reaction
    supporting_experience_ids: [EXP-008]
    counterevidence:
      - timing, sample construction and minimum representative coverage are not yet validated across a second real Naming Job
    regression_cases: []
    status: testing_needs_regression
    introduced_in_version: null
    rollback_target: null

  - hypothesis_id: HYP-005
    claim: >-
      Adaptive Naming should treat positive-reference learning as a generalization problem: extract latent reasons for success separately from surface morphology, then audit Owner-visible batches for hidden family concentration before exposure.
    proposed_mechanism:
      trigger: positive_owner_signal_or_reference_candidate_begins_to_affect_search
      steps:
        - decompose_positive_reference_into_latent_virtues_and_surface_properties
        - allow_latent_virtues_to_update_general_exploration
        - keep_surface_properties_nonbinding_unless_independently_supported_or_explicitly_exploited
        - classify_batch_candidates_by_construction_architecture_material_source_phonology_orthography_and_reference_distance
        - run_batch_generalization_audit_before_owner_exposure
        - block_or_reset_batch_when_surface_similarity_is_high_without_an_explicit_bounded_exploitation_hypothesis
      batch_result_classes:
        - candidate_quality_pass_batch_generalization_pass
        - candidate_quality_pass_batch_diversity_fail
        - high_information_with_intentional_family_focus
        - reset_required
      temporary_regression_scaffold:
        - do_not_hardcode_five_classes_as_universal_rule
        - do_not_hardcode_max_two_per_class_as_universal_rule
        - use_these_thresholds_only_as_411_regression_fixtures_until_cross_task_evidence
    changes:
      - add_positive_reference_abstraction
      - add_batch_level_quality_object
      - add_batch_generalization_diversity_audit
      - track_reference_distance_separately_from_owner_fit
      - extend_owner_review_cadence_as_adaptive_state
    expected_benefit: >-
      Prevent the Controller from mistaking the visible form of a successful candidate for the cause of its success, reduce repeated Owner-detected morphotype collapse, and improve preference learning without forcing creative monoculture.
    known_risk: >-
      Over-policing similarity could suppress legitimate focused exploitation, coherent naming systems, or useful within-family comparisons; the audit must therefore distinguish broad exploration from explicit bounded exploitation.
    supporting_experience_ids: [EXP-009, EXP-008]
    counterevidence:
      - cross-task replication is not yet available
      - no regression has yet demonstrated improved finalist yield
    proposed_regression_cases:
      - positive_reference_followed_by_surface_clones_should_fail_generalization_audit
      - semantic_diversity_with_shared_morphology_should_fail_batch_diversity
      - explicit_bounded_exploitation_may_pass_with_documented_family_focus
      - pronunciation_optimization_should_not_erase_semantic_substance
      - direct_domain_availability_should_not_rescue_weak_intrinsic_names
    regression_cases: []
    status: testing_needs_regression
    introduced_in_version: null
    rollback_target: null
