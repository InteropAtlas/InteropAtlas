id: rfc3339_profiles_iso8601
source:
  type: standard
  id: rfc3339
relation: extends
target:
  type: standard
  id: iso_8601_1_2019
notes_zh:
  - RFC 3339 自身明确说明它是 ISO 8601 的 Internet profile（互联网配置文件），并使用 ISO 8601 扩展格式的兼容子集。
  - 当前 relation 类型中尚无 profile_of；暂时使用 extends 作为近似表达，后续应评估是否需要新增更准确的 relation 类型。
