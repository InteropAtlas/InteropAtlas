conditions_zh: JSON-LD 是 RDF 的一种序列化/交换表示，但其 JSON 表面结构不等同于 RDF 抽象数据模型本身。
conditions_en: JSON-LD is a serialization and exchange representation for RDF; its JSON surface syntax is not itself the RDF abstract data model.
