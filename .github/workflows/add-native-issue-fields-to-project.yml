name: Add Native Issue Fields to Project

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-native-issue-fields-to-project.yml'

permissions:
  contents: read

jobs:
  add:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
      ORG: InteropAtlas
      PROJECT_NUMBER: 2
    steps:
      - name: Add Work Type and Waiting For to Project
        run: |
          set -euo pipefail

          add_field() {
            local id="$1" name="$2"
            if gh api -H 'X-GitHub-Api-Version: 2026-03-10'               "orgs/$ORG/projectsV2/$PROJECT_NUMBER/fields"               --jq --arg name "$name" '.[]? | select(.name==$name) | .name' 2>/dev/null | grep -Fx "$name" >/dev/null; then
              echo "FIELD_ALREADY_PRESENT=$name"
              return 0
            fi

            gh api --method POST               -H 'X-GitHub-Api-Version: 2026-03-10'               "orgs/$ORG/projectsV2/$PROJECT_NUMBER/fields"               -F issue_field_id="$id"               -f name="$name"               -f data_type="single_select" >/dev/null
            echo "FIELD_ADDED=$name"
          }

          add_field 47375155 "Work Type"
          add_field 47375196 "Waiting For"

          FIELDS="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' "orgs/$ORG/projectsV2/$PROJECT_NUMBER/fields")"
          echo "WORK_TYPE_PROJECT_FIELD=$(jq -c '.[]? | select(.name=="Work Type")' <<<"$FIELDS")"
          echo "WAITING_FOR_PROJECT_FIELD=$(jq -c '.[]? | select(.name=="Waiting For")' <<<"$FIELDS")"
          test -n "$(jq -r '.[]? | select(.name=="Work Type") | .id' <<<"$FIELDS" | head -n1)"
          test -n "$(jq -r '.[]? | select(.name=="Waiting For") | .id' <<<"$FIELDS" | head -n1)"
