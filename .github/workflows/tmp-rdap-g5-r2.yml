name: tmp-rdap-g5-r2
on:
  push:
    branches: [tmp-rdap-g5-r2]
permissions:
  contents: read
jobs:
  rdap:
    runs-on: ubuntu-latest
    steps:
      - name: Query PIR RDAP
        shell: bash
        run: |
          set -u
          endpoint="https://rdap.publicinterestregistry.org/rdap/domain"
          names=(sidecommon morrowkind elsemark onefield simea polyside openother novara commonodd turnshare asteron othergood reverin sharedelse morrowset commondifferent varena sonderway oneother noverin)
          for n in "${names[@]}"; do
            code=$(curl -sS -o /tmp/rdap.json -w '%{http_code}' "$endpoint/$n.org" || true)
            echo "$n.org $code"
          done
