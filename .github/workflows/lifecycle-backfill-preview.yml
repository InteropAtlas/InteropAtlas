name: Lifecycle Backfill Preview

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r 02_Runtime/01_Engine/requirements.txt
      - name: Inventory and reconstruct Canonical Object metadata in isolated workspace
        run: |
          rm -rf build/backfill-bundle
          mkdir -p build/backfill-bundle
          BACKFILLED_AT="$(TZ=Asia/Shanghai date '+%Y-%m-%dT%H:%M:%S+08:00')"
          python 02_Runtime/02_Tools/lifecycle_provenance_backfill.py \
            --root . \
            --baseline 38b0c80813db5e59757cbec0ac79cc3fd079161f \
            --cutoff 2026-09-02T10:28:00+08:00 \
            --backfilled-at "$BACKFILLED_AT" \
            --scope objects \
            --apply \
            --bundle-dir build/backfill-bundle \
            --report build/lifecycle-backfill-report.json
          python 02_Runtime/02_Tools/normalize_backfill_yaml_scalars.py '01_State/01_Objects/*.yaml'
          python 02_Runtime/02_Tools/normalize_backfill_yaml_scalars.py 'build/backfill-bundle/01_State/01_Objects/*.yaml'
      - name: Validate candidate repository
        run: |
          python 02_Runtime/01_Engine/test_repository_layout.py
          python 02_Runtime/01_Engine/test_v0_schemas.py
          python 02_Runtime/01_Engine/test_relation_model.py
          python 02_Runtime/01_Engine/machine_review.py --root . --json build/machine-review.json --markdown build/machine-review.md
          python 02_Runtime/01_Engine/graph_index.py --root . > build/graph-index.json
          python - <<'PY'
          import json
          machine = json.load(open('build/machine-review.json'))
          graph = json.load(open('build/graph-index.json'))
          assert machine['summary']['errors'] == 0, machine
          assert graph.get('reference_issues') == [], graph.get('reference_issues')
          print(machine['summary'])
          print('graph reference_issues:', graph.get('reference_issues'))
          PY
      - name: Upload inventory and preview reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-backfill-preview
          path: |
            build/backfill-bundle
            build/lifecycle-backfill-report.json
            build/machine-review.json
            build/machine-review.md
            build/graph-index.json
