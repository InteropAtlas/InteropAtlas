name: Issue Portfolio Legacy Field Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue-portfolio-legacy-field-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
      PROJECT_OWNER_ID: O_kgDOEzyTWQ
      PROJECT_TITLE: InteropAtlas — Issue Portfolio

    steps:
      - name: Remove retired Project mirror fields
        run: |
          set -euo pipefail

          PROJECTS="$(gh api graphql -f query='query($owner: ID!) {
            node(id:$owner) {
              ... on Organization {
                projectsV2(first:100) { nodes { id number title } }
              }
            }
          }' -F owner="$PROJECT_OWNER_ID")"

          PROJECT_ID="$(jq -r --arg title "$PROJECT_TITLE" '.data.node.projectsV2.nodes[]? | select(.title==$title) | .id' <<<"$PROJECTS" | head -n1)"
          PROJECT_NUMBER="$(jq -r --arg title "$PROJECT_TITLE" '.data.node.projectsV2.nodes[]? | select(.title==$title) | .number' <<<"$PROJECTS" | head -n1)"
          test -n "$PROJECT_ID"

          fields_json() {
            gh api graphql -f query='query($project: ID!) {
              node(id:$project) {
                ... on ProjectV2 {
                  fields(first:100) {
                    nodes {
                      __typename
                      ... on ProjectV2FieldCommon { id name dataType }
                      ... on ProjectV2SingleSelectField { options { id name } }
                    }
                  }
                }
              }
            }' -F project="$PROJECT_ID"
          }

          BEFORE="$(fields_json)"
          echo "PROJECT_NUMBER=$PROJECT_NUMBER"
          echo "BEFORE_FIELDS=$(jq -c '.data.node.fields.nodes' <<<"$BEFORE")"

          for name in Lifecycle Area Priority; do
            FIELD_ID="$(jq -r --arg name "$name" '.data.node.fields.nodes[]? | select(.name==$name) | .id' <<<"$BEFORE" | head -n1)"
            if [ -n "$FIELD_ID" ]; then
              gh api graphql -f query='mutation($field: ID!) {
                deleteProjectV2Field(input:{fieldId:$field}) {
                  projectV2Field { ... on ProjectV2FieldCommon { id name } }
                }
              }' -F field="$FIELD_ID"
              echo "DELETED_FIELD=$name"
            else
              echo "FIELD_ALREADY_ABSENT=$name"
            fi
          done

          AFTER="$(fields_json)"
          echo "AFTER_FIELDS=$(jq -c '.data.node.fields.nodes' <<<"$AFTER")"

          legacy="$(jq -r '[.data.node.fields.nodes[]? | select(.name=="Lifecycle" or .name=="Area" or .name=="Priority") | .name] | join("|")' <<<"$AFTER")"
          attention="$(jq -r '[.data.node.fields.nodes[]? | select(.name=="Attention") | .options[].name] | sort | join("|")' <<<"$AFTER")"
          task_type="$(jq -r '[.data.node.fields.nodes[]? | select(.name=="Task Type") | .options[].name] | sort | join("|")' <<<"$AFTER")"

          echo "LEGACY_FIELDS_AFTER=$legacy"
          echo "ATTENTION_OPTIONS_AFTER=$attention"
          echo "TASK_TYPE_OPTIONS_AFTER=$task_type"

          test -z "$legacy"
          test "$attention" = "Focus|Inbox"
          test "$task_type" = "Evolution|Knowledge|Perspective"
