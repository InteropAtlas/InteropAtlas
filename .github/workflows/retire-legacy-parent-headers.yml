name: Retire Legacy Parent Headers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-legacy-parent-headers.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Remove legacy Parent headers from open Issues
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" > /tmp/pages.json

          python - <<'PY'
          import json, os, re, subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          pages = json.load(open("/tmp/pages.json"))
          issues = [x for page in pages for x in page if "pull_request" not in x]
          changed = 0
          removed = 0

          for issue in issues:
              number = issue["number"]
              body = issue.get("body") or ""
              lines = body.splitlines()
              out = []
              touched = False

              for line in lines:
                  if re.match(r"^Parent:\s*.*$", line):
                      touched = True
                      removed += 1
                      continue
                  out.append(line)

              if not touched:
                  continue

              new_body = "\n".join(out)
              if body.endswith("\n"):
                  new_body += "\n"

              payload = json.dumps({"body": new_body}, ensure_ascii=False).encode()
              subprocess.run(
                  ["gh","api","--method","PATCH",f"repos/{repo}/issues/{number}","--input","-"],
                  input=payload, check=True, stdout=subprocess.DEVNULL
              )
              print(f"UPDATED #{number}")
              changed += 1

          print(f"SUMMARY open_issues={len(issues)} changed={changed} parent_headers_removed={removed}")
          PY
