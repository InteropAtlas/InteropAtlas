name: SELECT-408-001 v94 fixed-pool selection only
on:
  push:
    branches: [feat/adaptive-naming-skill-v0.1]
    paths: [.github/workflows/naming-selection-v94-once.yml]
permissions:
  contents: write
concurrency:
  group: select-408-001
  cancel-in-progress: false
jobs:
  verify-and-select:
    if: github.repository == 'InteropAtlas/InteropAtlas' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      P: 03_Evolution/01_Research/03_Tests/naming-evidence-pilot/model-aware
      LLAMA_REV: 56381e407c0ccfb3a6f71e668a27a901001d22ce
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python -m pip install PyYAML==6.0.2
      - name: Verify exact integration and old/new policy boundaries
        id: validation
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/select408-evidence"
          mkdir -p "$O"
          python .github/maintenance/v94-apply.py > "$O/integration-manifest.json"
          git diff --check
          python "$P/test_selection_policy.py" --output "$O/selection-tests.json" 2>&1 | tee "$O/selection-tests.log"
          python "$P/test_workflow.py" --output "$O/workflow-tests.json" 2>&1 | tee "$O/workflow-tests.log"
          python "$P/test_format_adapter.py" --output "$O/format-tests.json"
          python "$P/test_protocol.py" --output "$O/protocol-tests.json"
          python "$P/test_local_runner.py" --output "$O/transport-tests.json"
          git show "036568195c8996aff710fe75e87982d571ff6d43:$P/test_workflow.py" > "$P/test_workflow_legacy.py"
          set +e
          python "$P/test_workflow_legacy.py" --output "$O/legacy-expectation-on-new-policy.json" > "$O/legacy-expectation-on-new-policy.log" 2>&1
          CODE=$?
          set -e
          rm "$P/test_workflow_legacy.py"
          test "$CODE" = 1
          git worktree add --detach "$RUNNER_TEMP/v93-baseline" 036568195c8996aff710fe75e87982d571ff6d43
          python "$RUNNER_TEMP/v93-baseline/$P/test_workflow.py" --output "$O/frozen-v93-workflow-tests.json"
          python - <<'PY'
          import json,os,pathlib,sys
          p=pathlib.Path(os.environ['P']);sys.path.insert(0,str(p))
          import protocol as core,format_adapter as f,selection_policy as s
          o=pathlib.Path(os.environ['RUNNER_TEMP'])/'select408-evidence'
          prior=json.loads((o/'legacy-expectation-on-new-policy.json').read_text())
          assert prior['passed']==19 and prior['total']==20
          e=json.loads((p/'real-pilot-003/results/evidence.json').read_text())['files']
          for v in e.values():assert core.digest(v['content'].encode())==v['sha256']
          prefix='model/cell-3-simple-411922/'
          raw=e[prefix+'calls/r1audit/output.txt']['content'].encode()
          q=json.loads(json.loads(e[prefix+'steps/r1audit/input.json']['content'])['task']['question'])
          norm,audit=f.normalize(raw,q)
          assert json.loads(norm)['reviews']==json.loads(raw)['output_contract']['reviews']
          projection=[]
          for cell in ['cell-1-redesign-411921','cell-2-simple-411921']:
              result=json.loads(e['model/'+cell+'/round-1.json']['content'])
              projection.append({'cell':cell,'old_retained_ids':result['intrinsic_shortlist_ids'],'new_resource_queues':s.resource_queues(result)})
          core.write_new(o/'existing-evidence-replay.json',{'kind':'deterministic_projection_not_new_model_decisions','raw_sha256':core.digest(raw),'normalization':audit,'original_experiment_rescored':False,'queues':projection})
          PY
      - name: Prepare exact model and bounded selection plan
        id: setup
        shell: bash
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/select408-runtime"
          mkdir -p "$R"
          curl --fail --location --max-time 120 "https://codeload.github.com/ggml-org/llama.cpp/tar.gz/$LLAMA_REV" -o "$R/llama.tar.gz"
          tar -xzf "$R/llama.tar.gz" -C "$R"
          cmake -S "$R/llama.cpp-$LLAMA_REV" -B "$R/build" -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build "$R/build" --target llama-server -j 4
          python "$P/selection-pilot/run.py" prepare --output "$RUNNER_TEMP/select408-evidence/model" --runtime "$R"
      - name: Execute four selection requests, no name generation
        id: selection
        shell: bash
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/select408-runtime"
          "$R/build/bin/llama-server" -m "$R/model.gguf" --host 127.0.0.1 --port 8081 -c 8192 -t 4 -tb 4 -np 1 -b 512 -ub 128 --alias SELECT-408-001-Qwen4B > "$RUNNER_TEMP/select408-evidence/model/server.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          python - <<'PY'
          import urllib.request,time
          for _ in range(90):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8081/health',timeout=2) as r:
                      if r.status==200:break
              except Exception:time.sleep(1)
          else:raise RuntimeError('model_server_not_ready')
          PY
          python -u "$P/selection-pilot/run.py" execute --output "$RUNNER_TEMP/select408-evidence/model"
      - name: Preserve tested code and run evidence on current descendant only
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION: ${{ steps.validation.outcome }}
          SETUP: ${{ steps.setup.outcome }}
          SELECTION: ${{ steps.selection.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess,time,urllib.request,urllib.error,yaml
          p=pathlib.Path(os.environ['P']);o=pathlib.Path(os.environ['RUNNER_TEMP'])/'select408-evidence'
          source=os.environ['GITHUB_SHA'];repo='InteropAtlas/InteropAtlas';branch='feat/adaptive-naming-skill-v0.1'
          def api(path,method='GET',body=None):
              q=urllib.request.Request('https://api.github.com/repos/'+repo+path,method=method,data=json.dumps(body,ensure_ascii=False).encode() if body is not None else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(q,timeout=60) as r:return json.load(r)
          files={};size=0
          for path in sorted(o.rglob('*')) if o.exists() else []:
              if not path.is_file():continue
              raw=path.read_bytes();size+=len(raw);assert size<5_000_000
              files[str(path.relative_to(o))]={'sha256':hashlib.sha256(raw).hexdigest(),'content':raw.decode('utf-8')}
          summary=json.loads((o/'model/summary.json').read_text()) if (o/'model/summary.json').exists() else None
          result={'run_id':os.environ['GITHUB_RUN_ID'],'source_commit':source,'validation':os.environ['VALIDATION'],'setup':os.environ['SETUP'],'selection':os.environ['SELECTION'],'files':files,'new_names':0,'model_requests_with_saved_intent':len(list(o.glob('model/request-*/intent.json'))),'paid_api_calls':0,'independent_review':False}
          home=str(p/'selection-pilot/results')
          entries=[{'path':home+'/evidence.json','mode':'100644','type':'blob','content':json.dumps(result,ensure_ascii=False,indent=2)+'\n'}]
          if summary:entries.append({'path':home+'/summary.json','mode':'100644','type':'blob','content':json.dumps(summary,ensure_ascii=False,indent=2)+'\n'})
          code_names=['workflow.py','test_workflow.py','SKILL.md','README.md']
          statepath=p.parent.parent/'organization-naming-411-state.yaml'
          # Resolve state from the repository's known directory, not by a guessed parent count.
          statepath=pathlib.Path('03_Evolution/01_Research/03_Tests/organization-naming-411-state.yaml')
          if os.environ['VALIDATION']=='success':
              entries += [{'path':str(p/name),'mode':'100644','type':'blob','content':(p/name).read_text()} for name in code_names]
              original=statepath.read_text();old=yaml.safe_load(original);assert old['task']['snapshot_version']==93
              text=original.replace('  snapshot_version: 93\n','  snapshot_version: 94\n',1)
              block='next_action:\n  action: review_fixed_pool_selection_results_before_further_method_changes\n  rationale: >-\n    v94已接入简单默认、生成者意图/风险边界、优先待定分流与完整包装兼容。\n    检查SELECT-408-001已保存结果及剩余语义问题，不新增名称，不把决定改变当质量改善。\n  requires_owner: false_for_bounded_method_research_no_paid_or_ia_generation\n\n'
              text,n=re.subn(r'^next_action:\n.*?(?=^stop:)',block,text,flags=re.M|re.S);assert n==1
              details={'version':'0.2.0-experimental','authority_ref':'https://github.com/InteropAtlas/InteropAtlas/issues/408#issuecomment-5647290998','baseline_commit':'036568195c8996aff710fe75e87982d571ff6d43','implementation':'naming-evidence-pilot/model-aware/selection_policy.py','default_method_for_new_sessions':'simple','old_results_unchanged':True,'experiment':'SELECT-408-001','run_id':os.environ['GITHUB_RUN_ID'],'model_requests_with_saved_intent':result['model_requests_with_saved_intent'],'completed_selection_requests':sum(v['status']=='selection_complete_not_clearance' for v in summary['results']) if summary else 0,'new_names':0,'paid_api_calls':0,'ia_generation':False,'stable_promotion':False,'semantic_validation':'development_only_not_independent_quality_proof','evidence':'naming-evidence-pilot/model-aware/selection-pilot/results/evidence.json'}
              text+='\n# v94 selection-only revision; old trials and their historical counts remain unchanged.\nselection_revision:\n'+''.join('  '+line+'\n' for line in json.dumps(details,ensure_ascii=False,indent=2).splitlines())
              new=yaml.safe_load(text)
              for k in old:
                  if k not in ('task','next_action'):assert old[k]==new[k],k
              assert new['task']==dict(old['task'],snapshot_version=94)
              entries.append({'path':str(statepath),'mode':'100644','type':'blob','content':text})
          for attempt in range(3):
              current=api('/git/ref/heads/'+branch)['object']['sha']
              if current!=source:
                  cmp=api('/compare/'+source+'...'+current)
                  assert cmp['merge_base_commit']['sha']==source and cmp['status']=='ahead'
              if os.environ['VALIDATION']=='success':
                  for path in [str(p/n) for n in code_names]+[str(statepath)]:
                      expected=subprocess.check_output(['git','rev-parse',source+':'+path],text=True).strip()
                      assert api('/contents/'+path+'?ref='+current)['sha']==expected,'Concurrent edit to integration target: '+path
              try:
                  api('/contents/'+home+'/evidence.json?ref='+current)
                  raise RuntimeError('Result destination already exists; do not overwrite')
              except urllib.error.HTTPError as e:
                  if e.code!=404:raise
              tree=api('/git/trees','POST',{'base_tree':api('/git/commits/'+current)['tree']['sha'],'tree':entries})['sha']
              commit=api('/git/commits','POST',{'message':'feat(#408,#411): deliver v94 selection boundary with real fixed-pool evidence\n\nNo new names, paid inference, historical rescore, independent-review claim or stable promotion. Preserve raw model outputs and original instructions.','tree':tree,'parents':[current]})['sha']
              if api('/git/ref/heads/'+branch)['object']['sha']!=current:continue
              try:api('/git/refs/heads/'+branch,'PATCH',{'sha':commit,'force':False});break
              except urllib.error.HTTPError as e:
                  if e.code not in (409,422) or attempt==2:raise
          else:raise RuntimeError('Concurrent writes exhausted publication attempts')
          print(json.dumps({'commit':commit,'run_id':os.environ['GITHUB_RUN_ID'],'files_saved':len(files),'requests':result['model_requests_with_saved_intent'],'validation':os.environ['VALIDATION'],'selection':os.environ['SELECTION']},ensure_ascii=False))
          PY
