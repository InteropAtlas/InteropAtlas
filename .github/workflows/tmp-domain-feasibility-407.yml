name: Temporary domain feasibility #407
on:
  push:
    branches:
      - tmp/domain-feasibility-407
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Query authoritative RDAP for .org and .com
        shell: python
        run: |
          import csv, json, time, urllib.request, urllib.error

          names = json.loads(r'''["accretion", "across", "afterglow", "afterimage", "afterlight", "afterward", "again", "agora", "alinea", "allways", "altera", "alteron", "alterra", "among", "another", "anotherworld", "apera", "apert", "aperture", "apta", "arcade", "arcen", "archipelago", "arclet", "arden", "around", "assembly", "aster", "atlasworks", "atium", "aural", "aven", "avenor", "avora", "avero", "axiom", "baseworks", "beacon", "bearing", "bearingworks", "becoming", "between", "beyond", "brio", "cadence", "canopy", "carryforward", "cartography", "circulation", "cirra", "civicfield", "coforma", "common", "commonbase", "commonbearing", "commonbridge", "commoncurrent", "commoner", "commonfield", "commonflow", "commonfold", "commonground", "commonhouse", "commonia", "commoninstrument", "commonkind", "commonlight", "commonly", "commonmap", "commonnext", "commonnova", "commonpoint", "commonrise", "commons", "commonsense", "commonside", "commonsignal", "commonsource", "commonthread", "commontools", "commonways", "commonwell", "commonworks", "communa", "comuna", "compasshouse", "conduit", "conduitworks", "confluence", "constellation", "continuance", "continuing", "continuum", "converge", "coordinate", "coordinateworks", "coVantage", "coVera", "counterpart", "counterpoint", "courtyard", "covista", "cresta", "crosscurrent", "crossform", "crosslight", "crosspoint", "crossroads", "crosswind", "crosswise", "current", "currenthouse", "currentworks", "daybreak", "dialogue", "differenthere", "discoveryengine", "drift", "echora", "echra", "elara", "elseform", "elsewhere", "elsewise", "emergence", "emergent", "emeria", "ephemeris", "equinox", "estuary", "everfield", "everground", "everline", "evernew", "everreturn", "everward", "everwell", "everworks", "exchangehouse", "facet", "faceta", "facetly", "facetwise", "farcompass", "farfield", "farshore", "fathom", "faultline", "field", "fieldhouse", "fieldnote", "fieldwork", "fieldworks", "flock", "flowhouse", "flowline", "fluxa", "folding", "folio", "footnote", "forma", "formant", "forum", "foundry", "futurearchive", "gathering", "glasshouse", "glassworks", "graft", "gridline", "ground", "groundline", "groundwell", "guidefield", "handeddown", "harbor", "harbormaster", "headspring", "headwater", "headwaters", "helix", "horizon", "ideaecology", "imprint", "inheritance", "inheritanceengine", "instrument", "interfold", "interform", "interplay", "intera", "interpretationlayer", "interpretive", "interpreter", "kaleidoscope", "keystone", "kindred", "knowledgegarden", "knowledgeport", "landmark", "lantern", "lattice", "lentia", "lensmaker", "lighthouse", "liora", "livingarchive", "longmemory", "longnow", "longview", "lookout", "loom", "lucent", "lumae", "lumen", "many", "manybearings", "manyborne", "manyfold", "manylight", "manyone", "manytongues", "manyward", "manyways", "manywise", "making", "margin", "meld", "memorycommons", "memoryfield", "meral", "meridian", "meridianworks", "merea", "mindshift", "morrow", "mosaic", "murmur", "murmuration", "mycelium", "new", "newcommon", "newcycle", "newform", "newground", "newlight", "newward", "newways", "nextbridge", "nextcommons", "nextform", "nextshore", "nextview", "nexel", "nodal", "northline", "northmark", "northwindow", "novara", "novista", "observatory", "onda", "omnia", "openbase", "openbridge", "opencompass", "opencountry", "opendoor", "openedge", "openfacet", "openfield", "openfold", "openform", "openframe", "openhouse", "openkind", "openledger", "openroot", "opensourcewell", "openvantage", "openward", "openways", "openwindow", "orbel", "orbit", "orbis", "oriel", "orienta", "orientworks", "oriva", "orvia", "othervell", "otherform", "otherlens", "otherlight", "others", "otherwell", "otherwise", "overtone", "ovara", "ovia", "palimpsest", "parable", "parallax", "passing", "passageworks", "persia", "persiva", "persova", "perspect", "perspecta", "perspective", "plural", "pluralis", "plurality", "pluralworld", "plur", "pluria", "poietia", "pollination", "polyform", "portico", "possible", "prism", "prisma", "prismal", "prismark", "priva", "public", "publicinstrument", "publicmemory", "publicthread", "publictoolkit", "publicworks", "radian", "reference", "referencepoint", "referenceworks", "reentry", "refract", "refracta", "refraction", "reframe", "reframing", "relationworks", "relay", "relayarchive", "relayhouse", "relaywell", "reloa", "resonance", "return", "returnline", "returnwell", "returnworks", "revia", "rillo", "rill", "rifra", "ripple", "riven", "rivulet", "rootfield", "rootline", "rootstock", "rootworks", "roundtrip", "rova", "rove", "rovia", "secondlight", "secondreading", "secondvoice", "sediment", "seedbank", "seedhouse", "seeing", "serein", "shared", "sharedcoordinates", "sharedhorizon", "sharedmemory", "sharedraft", "sharedsignal", "sharelight", "sharewell", "sightline", "signalworks", "signalfire", "signalgarden", "signpost", "sivra", "solae", "sourcefield", "sourceground", "sourcehouse", "sourcewell", "sourceworks", "spindle", "springfield", "springwell", "stillmoving", "strata", "tangent", "tella", "tern", "terva", "thecommon", "threshold", "thresholdhouse", "through", "tidehouse", "tidemark", "together", "trailhead", "transitwell", "trell", "trellis", "truebearing", "turnform", "turningpoint", "turnstile", "turnwise", "typeset", "uncommon", "understory", "undertow", "unfold", "unknowncountry", "vantor", "vantage", "vantagea", "varia", "variae", "veer", "velae", "vellum", "veria", "vernacular", "versa", "versant", "versed", "versia", "vesper", "vetra", "veylen", "veylo", "veyna", "veyon", "veyra", "viewborne", "viewfinder", "viewframe", "viewkind", "viewnext", "viewora", "viewpoint", "viewrise", "viewshift", "viewwell", "viora", "vistae", "vistaflow", "vistara", "weather", "wayfound", "wayline", "waymark", "waymarkworks", "wayshare", "wayside", "wayswell", "waystation", "wayfinder", "wellspring", "worldbase", "worldbook", "worldbridge", "worldframe", "worldhouse", "worldincommon", "worldlet", "worldroot", "worldshift", "worldview", "worldward", "worldweave", "worldwell", "worldwise", "worldworks", "worlds", "zenith"]''')

          endpoints = {
              "org": "https://rdap.publicinterestregistry.org/rdap/domain/{domain}",
              "com": "https://rdap.verisign.com/com/v1/domain/{domain}",
          }

          def check(domain, tld):
              url = endpoints[tld].format(domain=domain)
              headers = {
                  "User-Agent": "InteropAtlas-naming-feasibility/1.0 (+https://github.com/InteropAtlas/InteropAtlas/issues/407)",
                  "Accept": "application/rdap+json, application/json",
              }
              last = None
              for attempt in range(5):
                  req = urllib.request.Request(url, headers=headers)
                  try:
                      with urllib.request.urlopen(req, timeout=20) as r:
                          status = r.status
                          if status == 200:
                              return "registered", status, url
                          last = f"http_{status}"
                  except urllib.error.HTTPError as e:
                      if e.code == 404:
                          return "available", 404, url
                      if e.code in (408, 425, 429, 500, 502, 503, 504):
                          last = f"http_{e.code}"
                          time.sleep(0.5 * (2 ** attempt))
                          continue
                      return "error", e.code, url
                  except Exception as e:
                      last = type(e).__name__
                      time.sleep(0.5 * (2 ** attempt))
              return "error", last, url

          rows = []
          for i, name in enumerate(names, 1):
              org_domain = name + ".org"
              org_state, org_code, org_url = check(org_domain, "org")
              com_state, com_code, com_url = ("not_checked", "", "")
              if org_state == "available":
                  com_domain = name + ".com"
                  com_state, com_code, com_url = check(com_domain, "com")
              rows.append({
                  "name": name,
                  "org": org_state,
                  "org_code": org_code,
                  "org_rdap": org_url,
                  "com": com_state,
                  "com_code": com_code,
                  "com_rdap": com_url,
              })
              print(f"{i:03d}/{len(names)} {name}: .org={org_state}; .com={com_state}", flush=True)
              time.sleep(0.08)

          with open("domain-feasibility-407.csv", "w", newline="", encoding="utf-8") as f:
              w = csv.DictWriter(f, fieldnames=rows[0].keys())
              w.writeheader()
              w.writerows(rows)

          org_available = [r for r in rows if r["org"] == "available"]
          org_registered = [r for r in rows if r["org"] == "registered"]
          errors = [r for r in rows if r["org"] == "error"]
          com_available = [r for r in org_available if r["com"] == "available"]
          com_registered = [r for r in org_available if r["com"] == "registered"]

          summary = {
              "total": len(rows),
              "org_available": len(org_available),
              "org_registered": len(org_registered),
              "org_errors": len(errors),
              "org_survivors_com_available": len(com_available),
              "org_survivors_com_registered": len(com_registered),
              "org_available_names": [r["name"] for r in org_available],
              "org_and_com_available_names": [r["name"] for r in com_available],
              "org_errors_names": [r["name"] for r in errors],
          }
          with open("domain-feasibility-407-summary.json", "w", encoding="utf-8") as f:
              json.dump(summary, f, ensure_ascii=False, indent=2)
          print("SUMMARY_JSON=" + json.dumps(summary, ensure_ascii=False), flush=True)

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: domain-feasibility-407
          path: |
            domain-feasibility-407.csv
            domain-feasibility-407-summary.json
          retention-days: 1
