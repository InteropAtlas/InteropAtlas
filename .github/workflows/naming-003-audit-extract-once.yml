name: REAL-408-003 deterministic audit extraction only
on:
  push:
    branches: [feat/adaptive-naming-skill-v0.1]
    paths: [.github/workflows/naming-003-audit-extract-once.yml]
permissions:
  contents: write
jobs:
  extract:
    if: github.repository == 'InteropAtlas/InteropAtlas' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      A: 03_Evolution/01_Research/03_Tests/naming-evidence-pilot/model-aware/real-pilot-003/audit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify and extract existing evidence twice without inference
        run: |
          python "$A/extract.py" --source "$A/../results/evidence.json" --output "$RUNNER_TEMP/audit003"
          python "$A/extract.py" --source "$A/../results/evidence.json" --output "$RUNNER_TEMP/audit003"
      - name: Save reproducible projections only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,pathlib,urllib.request
          base='https://api.github.com/repos/InteropAtlas/InteropAtlas';branch='feat/adaptive-naming-skill-v0.1'
          def api(path,method='GET',data=None):
              request=urllib.request.Request(base+path,method=method,data=None if data is None else json.dumps(data,ensure_ascii=False).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          head=api('/git/ref/heads/'+branch)['object']['sha']
          assert head==os.environ['GITHUB_SHA'],'Branch changed; projections can be recomputed, never overwrite'
          tree=api('/git/commits/'+head)['tree']['sha']
          entries=[]
          for name in ('packets.json','data.json'):
              path=pathlib.Path(os.environ['RUNNER_TEMP'])/'audit003'/name
              entries.append({'path':os.environ['A']+'/'+name,'mode':'100644','type':'blob','content':path.read_text()})
          newtree=api('/git/trees','POST',{'base_tree':tree,'tree':entries})['sha']
          commit=api('/git/commits','POST',{'tree':newtree,'parents':[head],'message':'research(#408): save verified 003 anonymous packet and per-stage audit data\n\nDeterministic extraction of existing evidence only. No new model execution, no scoring, no independent-blindness claim, no changes to original outcomes.'})['sha']
          assert api('/git/ref/heads/'+branch)['object']['sha']==head
          api('/git/refs/heads/'+branch,'PATCH',{'sha':commit,'force':False})
          print(json.dumps({'commit':commit,'run_id':os.environ['GITHUB_RUN_ID'],'new_model_calls':0}))
          PY
