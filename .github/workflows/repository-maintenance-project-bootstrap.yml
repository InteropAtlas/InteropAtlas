name: Repository Maintenance Project Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repository-maintenance-project-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
      PROJECT_OWNER_ID: O_kgDOEzyTWQ
      PROJECT_TITLE: InteropAtlas — 仓库长期维护

    steps:
      - name: Find maintenance project
        run: |
          set -euo pipefail
          JSON="$(gh api graphql -f query='query($owner: ID!) {
            node(id: $owner) {
              ... on Organization {
                projectsV2(first: 100) { nodes { id number title } }
              }
            }
          }' -F owner="$PROJECT_OWNER_ID")"

          PROJECT_ID="$(jq -r --arg title "$PROJECT_TITLE" '.data.node.projectsV2.nodes[]? | select(.title==$title) | .id' <<<"$JSON" | head -n1)"
          if [ -z "$PROJECT_ID" ]; then
            echo "Project already absent."
            echo "PROJECT_ID=" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

      - name: Delete maintenance project
        if: ${{ env.PROJECT_ID != '' }}
        run: |
          set -euo pipefail
          gh api graphql -f query='mutation($project: ID!) {
            deleteProjectV2(input:{projectId:$project}) { projectV2 { id } }
          }' -F project="$PROJECT_ID" >/dev/null

      - name: Verify project removed
        run: |
          set -euo pipefail
          JSON="$(gh api graphql -f query='query($owner: ID!) {
            node(id: $owner) {
              ... on Organization {
                projectsV2(first: 100) { nodes { id number title } }
              }
            }
          }' -F owner="$PROJECT_OWNER_ID")"

          if jq -e --arg title "$PROJECT_TITLE" '.data.node.projectsV2.nodes[]? | select(.title==$title)' <<<"$JSON" >/dev/null; then
            echo "ERROR: maintenance project still exists"
            exit 1
          fi
          echo "Maintenance project removed."
