name: SEM-408-003 candidate-specific Gemma review
on:
  push:
    branches: [feat/adaptive-naming-skill-v0.1]
    paths: [.github/workflows/naming-semantic-review-v96c-once.yml]
permissions:
  contents: write
concurrency:
  group: sem-408-003
  cancel-in-progress: false
jobs:
  semantic-review:
    if: github.repository == 'InteropAtlas/InteropAtlas' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      P: 03_Evolution/01_Research/03_Tests/naming-evidence-pilot/model-aware
      LLAMA_REV: 56381e407c0ccfb3a6f71e668a27a901001d22ce
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify task-packaging retry boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,pathlib,json
          p=pathlib.Path('03_Evolution/01_Research/03_Tests/naming-evidence-pilot/model-aware')
          def load(n,path):
              s=importlib.util.spec_from_file_location(n,path);m=importlib.util.module_from_spec(s);s.loader.exec_module(m);return m
          one=load('one',p/'semantic-review-pilot/run.py');two=load('two',p/'semantic-review-pilot-002/run.py');three=load('three',p/'semantic-review-pilot-003/run.py')
          brief,rows,h=one.source_material()
          assert len(rows)==6 and rows[0]=={'id':'C001','name':'Scribble'}
          assert three.iface.SCHEMA==two.SCHEMA
          assert three.base.MODEL_REPO==one.MODEL_REPO and three.base.SEED==one.SEED and three.base.MAX_OUTPUT==one.MAX_OUTPUT
          prompt=three.task_text(brief,rows[0])
          for forbidden in ('grounded reason','3 concise observations','output_contract','Qwen','priority_ids','creator_intent'):
              assert forbidden not in prompt
          assert rows[0]['name'] in prompt
          print(json.dumps({'boundary':'ok','candidates':len(rows),'source_sha256':h}))
          PY
      - name: Compile pinned runtime and prepare same Gemma reviewer
        shell: bash
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/sem408-runtime"; O="$RUNNER_TEMP/sem408-evidence"; mkdir -p "$R"
          curl --fail --location --max-time 120 "https://codeload.github.com/ggml-org/llama.cpp/tar.gz/$LLAMA_REV" -o "$R/llama.tar.gz"
          tar -xzf "$R/llama.tar.gz" -C "$R"
          cmake -S "$R/llama.cpp-$LLAMA_REV" -B "$R/build" -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build "$R/build" --target llama-server -j 4
          python "$P/semantic-review-pilot-003/run.py" prepare --output "$O/model" --runtime "$R"
      - name: Execute canary then remaining blind single-candidate reviews
        shell: bash
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/sem408-runtime"; O="$RUNNER_TEMP/sem408-evidence"
          "$R/build/bin/llama-server" -m "$R/model.gguf" --host 127.0.0.1 --port 8084 -c 8192 -t 4 -tb 4 -np 1 -b 512 -ub 128 --alias SEM-408-003-Gemma4B > "$O/model/server.log" 2>&1 &
          PID=$!; trap 'kill "$PID" 2>/dev/null || true' EXIT
          python - <<'PY'
          import urllib.request,time
          for _ in range(90):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8084/health',timeout=2) as r:
                      if r.status==200:break
              except Exception:time.sleep(1)
          else:raise RuntimeError('model_server_not_ready')
          PY
          python -u "$P/semantic-review-pilot-003/run.py" execute --output "$O/model"
      - name: Preserve complete evidence without rescoring prior trials
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request,urllib.error
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'sem408-evidence'; repo='InteropAtlas/InteropAtlas'; branch='feat/adaptive-naming-skill-v0.1'; source=os.environ['GITHUB_SHA']
          def api(path,method='GET',body=None):
              q=urllib.request.Request('https://api.github.com/repos/'+repo+path,method=method,data=json.dumps(body,ensure_ascii=False).encode() if body is not None else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(q,timeout=60) as r:return json.load(r)
          files={};total=0
          for path in sorted(root.rglob('*')) if root.exists() else []:
              if not path.is_file():continue
              raw=path.read_bytes();total+=len(raw);assert total<5_000_000
              files[str(path.relative_to(root))]={'sha256':hashlib.sha256(raw).hexdigest(),'content':raw.decode('utf-8')}
          summary=json.loads((root/'model/summary.json').read_text()) if (root/'model/summary.json').exists() else None
          home='03_Evolution/01_Research/03_Tests/naming-evidence-pilot/model-aware/semantic-review-pilot-003/results'
          evidence={'run_id':os.environ['GITHUB_RUN_ID'],'source_commit':source,'new_names':0,'paid_api_calls':0,'quality_ground_truth':None,'files':files}
          entries=[{'path':home+'/evidence.json','mode':'100644','type':'blob','content':json.dumps(evidence,ensure_ascii=False,indent=2)+'\n'}]
          if summary:entries.append({'path':home+'/summary.json','mode':'100644','type':'blob','content':json.dumps(summary,ensure_ascii=False,indent=2)+'\n'})
          current=api('/git/ref/heads/'+branch)['object']['sha'];assert current==source,'branch changed during frozen run'
          tree=api('/git/trees','POST',{'base_tree':api('/git/commits/'+current)['tree']['sha'],'tree':entries})['sha']
          commit=api('/git/commits','POST',{'message':'evidence(#408): preserve SEM-408-003 reviewer packaging trial\n\nNo new names, prior rescore, semantic-truth claim, paid inference, IA generation or method promotion.','tree':tree,'parents':[current]})['sha']
          api('/git/refs/heads/'+branch,'PATCH',{'sha':commit,'force':False})
          print(json.dumps({'commit':commit,'files':len(files),'bytes':total,'summary':summary},ensure_ascii=False))
          PY
