name: SEM-408-002 reviewer interface-only retry
on:
  push:
    branches: [feat/adaptive-naming-skill-v0.1]
    paths: [.github/workflows/naming-semantic-review-v96b-once.yml]
permissions:
  contents: write
concurrency:
  group: sem-408-002
  cancel-in-progress: false
jobs:
  semantic-review:
    if: github.repository == 'InteropAtlas/InteropAtlas' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      P: 03_Evolution/01_Research/03_Tests/naming-evidence-pilot/model-aware
      LLAMA_REV: 56381e407c0ccfb3a6f71e668a27a901001d22ce
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify interface-only retry boundary
        id: validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$P/semantic-review-pilot-002/run.py"
          git diff --exit-code c59dfe295faa0ebd7868a80d0dd6a070845182c9 -- "$P/semantic-review-pilot/run.py" "$P/real-pilot-003/results/evidence.json"
          python - <<'PY'
          import importlib.util,pathlib
          p=pathlib.Path('03_Evolution/01_Research/03_Tests/naming-evidence-pilot/model-aware/semantic-review-pilot-002/run.py')
          spec=importlib.util.spec_from_file_location('retry',p);m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          assert m.base.MODEL_REPO=='ggml-org/gemma-3-4b-it-GGUF'
          assert m.base.MODEL_FILE=='gemma-3-4b-it-Q4_K_M.gguf'
          assert m.base.SEED==63001 and m.base.MAX_OUTPUT==900
          assert m.SCHEMA['additionalProperties'] is False
          assert 'Do not summarize' in m.SYSTEM
          PY
      - name: Compile pinned runtime and prepare same Gemma reviewer
        id: setup
        shell: bash
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/sem408002-runtime";O="$RUNNER_TEMP/sem408002-evidence/model"
          mkdir -p "$R"
          curl --fail --location --max-time 120 "https://codeload.github.com/ggml-org/llama.cpp/tar.gz/$LLAMA_REV" -o "$R/llama.tar.gz"
          tar -xzf "$R/llama.tar.gz" -C "$R"
          cmake -S "$R/llama.cpp-$LLAMA_REV" -B "$R/build" -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build "$R/build" --target llama-server -j 4
          python "$P/semantic-review-pilot-002/run.py" prepare --output "$O" --runtime "$R"
      - name: Execute six blind single-candidate reviews with constrained JSON
        id: review
        shell: bash
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/sem408002-runtime";O="$RUNNER_TEMP/sem408002-evidence/model"
          "$R/build/bin/llama-server" -m "$R/model.gguf" --host 127.0.0.1 --port 8083 -c 8192 -t 4 -tb 4 -np 1 -b 512 -ub 128 --alias SEM-408-002-Gemma4B > "$O/server.log" 2>&1 &
          PID=$!;trap 'kill "$PID" 2>/dev/null || true' EXIT
          python - <<'PY'
          import urllib.request,time
          for _ in range(90):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8083/health',timeout=2) as r:
                      if r.status==200:break
              except Exception:time.sleep(1)
          else:raise RuntimeError('review_model_server_not_ready')
          PY
          python -u "$P/semantic-review-pilot-002/run.py" execute --output "$O"
      - name: Preserve complete evidence without rescoring SEM-408-001
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION: ${{ steps.validation.outcome }}
          SETUP: ${{ steps.setup.outcome }}
          REVIEW: ${{ steps.review.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request,urllib.error
          repo='InteropAtlas/InteropAtlas';branch='feat/adaptive-naming-skill-v0.1';source=os.environ['GITHUB_SHA'];base='https://api.github.com/repos/'+repo
          def api(path,method='GET',body=None):
              q=urllib.request.Request(base+path,method=method,data=json.dumps(body,ensure_ascii=False).encode() if body is not None else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(q,timeout=60) as r:return json.load(r)
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'sem408002-evidence';files={};size=0
          for path in sorted(root.rglob('*')) if root.exists() else []:
              if not path.is_file() or path.name=='model.gguf':continue
              raw=path.read_bytes();size+=len(raw);assert size<8_000_000
              files[str(path.relative_to(root))]={'sha256':hashlib.sha256(raw).hexdigest(),'content':raw.decode('utf-8')}
          summary=json.loads((root/'model/summary.json').read_text()) if (root/'model/summary.json').exists() else None
          result={'run_id':os.environ['GITHUB_RUN_ID'],'source_commit':source,'validation':os.environ['VALIDATION'],'setup':os.environ['SETUP'],'review':os.environ['REVIEW'],'new_names':0,'paid_api_calls':0,'quality_ground_truth':None,'SEM_408_001_rescored':False,'interface_change_only':True,'files':files}
          home='03_Evolution/01_Research/03_Tests/naming-evidence-pilot/model-aware/semantic-review-pilot-002/results'
          entries=[{'path':home+'/evidence.json','mode':'100644','type':'blob','content':json.dumps(result,ensure_ascii=False,indent=2)+'\n'}]
          if summary:entries.append({'path':home+'/summary.json','mode':'100644','type':'blob','content':json.dumps(summary,ensure_ascii=False,indent=2)+'\n'})
          for attempt in range(3):
              current=api('/git/ref/heads/'+branch)['object']['sha']
              if current!=source:
                  cmp=api('/compare/'+source+'...'+current);assert cmp['merge_base_commit']['sha']==source and cmp['status']=='ahead'
              try:api('/contents/'+home+'/evidence.json?ref='+current);raise RuntimeError('result_destination_exists')
              except urllib.error.HTTPError as e:
                  if e.code!=404:raise
              tree=api('/git/trees','POST',{'base_tree':api('/git/commits/'+current)['tree']['sha'],'tree':entries})['sha']
              commit=api('/git/commits','POST',{'message':'evidence(#408): preserve SEM-408-002 reviewer interface retry\n\nSame blind semantic task and Gemma reviewer as SEM-408-001; only explicit execution system instruction plus llama.cpp JSON schema constraint. Old failures remain blocked and unrescored.','tree':tree,'parents':[current]})['sha']
              if api('/git/ref/heads/'+branch)['object']['sha']!=current:continue
              try:api('/git/refs/heads/'+branch,'PATCH',{'sha':commit,'force':False});break
              except urllib.error.HTTPError as e:
                  if e.code not in (409,422) or attempt==2:raise
          else:raise RuntimeError('publication_concurrency_exhausted')
          print(json.dumps({'commit':commit,'run_id':os.environ['GITHUB_RUN_ID'],'files':len(files),'bytes':size,'review':os.environ['REVIEW']}))
          PY
