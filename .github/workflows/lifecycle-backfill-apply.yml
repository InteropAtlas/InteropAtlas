name: Lifecycle Backfill Apply Batch

on:
  push:
    branches:
      - backfill-89-lifecycle-provenance

permissions:
  contents: write

jobs:
  apply-latest-document-catchup:
    if: contains(github.event.head_commit.message, '[apply-docs-latest]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: backfill-89-lifecycle-provenance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r 02_Runtime/01_Engine/requirements.txt
      - name: Generate seven latest-main/sync-affected document candidates
        run: |
          rm -rf /tmp/ia-doc-latest
          mkdir -p /tmp/ia-doc-latest
          BACKFILLED_AT="$(TZ=Asia/Shanghai date '+%Y-%m-%dT%H:%M:%S+08:00')"
          python 02_Runtime/02_Tools/lifecycle_provenance_backfill.py \
            --root . \
            --baseline 35d82d1c03a7974df6b8675cedce7d956671fdf4 \
            --cutoff 2026-09-02T10:28:00+08:00 \
            --backfilled-at "$BACKFILLED_AT" \
            --scope documents \
            --apply \
            --bundle-dir /tmp/ia-doc-latest \
            --report /tmp/ia-doc-latest/report.json
          git reset --hard HEAD
          paths=(
            PROJECT_STATE.md
            02_Runtime/01_Engine/README.md
            03_Evolution/01_Research/gate-b-final-conformance-audit-2026-09-02.zh-CN.md
            03_Evolution/03_Change/human-route-renderer-boundary-v0.1.zh-CN.md
            03_Evolution/03_Change/reference-implementation-phase-v0.1.zh-CN.md
            docs/human-interface-profiles-v0.1.zh-CN.md
            docs/human-interface-search-contract-v0.1.zh-CN.md
          )
          for path in "${paths[@]}"; do
            cp "/tmp/ia-doc-latest/$path" "$path"
          done
      - name: Validate catch-up and document coverage
        run: |
          python 02_Runtime/01_Engine/test_repository_layout.py
          python 02_Runtime/01_Engine/test_v0_schemas.py
          python 02_Runtime/01_Engine/test_relation_model.py
          mkdir -p build
          python 02_Runtime/01_Engine/machine_review.py --root . --json build/machine-review-doc-latest.json --markdown build/machine-review-doc-latest.md
          python 02_Runtime/01_Engine/graph_index.py --root . > build/graph-index-doc-latest.json
          python - <<'PY'
          import json
          from pathlib import Path

          machine = json.load(open('build/machine-review-doc-latest.json'))
          graph = json.load(open('build/graph-index-doc-latest.json'))
          assert machine['summary']['errors'] == 0, machine
          assert graph.get('reference_issues') == [], graph.get('reference_issues')

          paths = set()
          for path in Path('.').glob('*.md'):
              if path.is_file(): paths.add(path.as_posix())
          for base in [Path('docs'), Path('03_Evolution')]:
              for path in base.rglob('*.md'):
                  if path.is_file(): paths.add(path.as_posix())
          for base in [Path('01_State'), Path('02_Runtime')]:
              for path in base.rglob('README.md'):
                  if path.is_file(): paths.add(path.as_posix())
          pr = Path('.github/PULL_REQUEST_TEMPLATE.md')
          if pr.exists(): paths.add(pr.as_posix())

          missing = []
          for path in sorted(paths):
              text = Path(path).read_text(encoding='utf-8')
              if '<!-- InteropAtlas Document Metadata v0' not in text:
                  missing.append(path)
          print('document_count=', len(paths))
          print('document_metadata_missing=', missing)
          assert len(paths) == 94, len(paths)
          assert not missing, missing
          print('machine=', machine['summary'])
          PY
      - name: Commit validated document catch-up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            PROJECT_STATE.md \
            02_Runtime/01_Engine/README.md \
            03_Evolution/01_Research/gate-b-final-conformance-audit-2026-09-02.zh-CN.md \
            03_Evolution/03_Change/human-route-renderer-boundary-v0.1.zh-CN.md \
            03_Evolution/03_Change/reference-implementation-phase-v0.1.zh-CN.md \
            docs/human-interface-profiles-v0.1.zh-CN.md \
            docs/human-interface-search-contract-v0.1.zh-CN.md
          git diff --cached --check
          git commit -m 'docs: catch up latest-main lifecycle metadata (#90 #93)' \
            -m 'Initiator: Human — ff6962757' \
            -m 'Executor: Agent — OpenAI / ChatGPT / GPT-5.6 Sol' \
            -m 'Reviewer: Pending' \
            -m 'GitHub-Actor: github-actions[bot]'
          git push origin HEAD:backfill-89-lifecycle-provenance
