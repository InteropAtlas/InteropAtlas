name: v95 wire selector order crosscheck, no model calls
on:
  push:
    branches: [feat/adaptive-naming-skill-v0.1]
    paths: [.github/workflows/naming-v95-order-crosscheck-once.yml]
permissions:
  contents: write
concurrency:
  group: naming-v95-order-crosscheck
  cancel-in-progress: false
jobs:
  wire-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply exact deterministic migration
        run: |
          set -euo pipefail
          python .github/maintenance/v95-order-crosscheck.py
          git diff --check
      - name: Run bounded regression suite
        run: |
          set -euo pipefail
          P=03_Evolution/01_Research/03_Tests/naming-evidence-pilot/model-aware
          O="$RUNNER_TEMP/v95-tests"; mkdir -p "$O"
          python "$P/test_selection_policy.py" --output "$O/selection.json"
          python "$P/test_workflow.py" --output "$O/workflow.json"
          python "$P/test_format_adapter.py" --output "$O/format.json"
          python "$P/test_protocol.py" --output "$O/protocol.json"
          python "$P/test_local_runner.py" --output "$O/transport.json"
      - name: Replay observed same-seed order disagreement deterministically
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,sys
          p=pathlib.Path('03_Evolution/01_Research/03_Tests/naming-evidence-pilot/model-aware')
          sys.path.insert(0,str(p));import selection_policy as s
          data=json.loads((p/'selection-stability-pilot/results/summary.json').read_text())
          r1=next(v for v in data['results'] if v['request']==1)
          r3=next(v for v in data['results'] if v['request']==3)
          assert r1['seed']==r3['seed']==52001 and r1['order']=='original' and r3['order']=='reversed'
          ids=[v['id'] for v in r1['reviews']];pool=[{'id':i} for i in ids]
          q=s.order_crosschecked_queues(pool,r1['reviews'],r3['reviews'])
          assert q['priority_ids']==['C003','C006'],q
          assert q['hold_ids']==['C001','C002','C004','C005'],q
          assert q['not_pursued_ids']==[],q
          assert q['order_disagreement_ids']==['C001','C002','C004','C005'],q
          print(json.dumps(q,ensure_ascii=False,indent=2))
          PY
      - name: Commit tested experimental workflow and remove one-shot files
        run: |
          set -euo pipefail
          rm .github/maintenance/v95-order-crosscheck.py .github/workflows/naming-v95-order-crosscheck-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(#408): use same-seed order crosscheck for conservative selection queues' -m 'Wires the observed SELECT-408-002 order instability into the experimental workflow. Two order permutations must agree for priority/drop; disagreements remain hold. No model calls, semantic-truth claim, IA generation, stable promotion or merge.'
          git push origin HEAD:feat/adaptive-naming-skill-v0.1
