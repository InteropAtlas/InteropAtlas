name: Issue Project Metadata Sync

on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: issue-project-sync-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
      PROJECT_OWNER_ID: O_kgDOEzyTWQ
      PROJECT_TITLE: InteropAtlas — Issue Portfolio

    steps:
      - name: Verify token
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api user --jq '.login' >/dev/null

      - name: Find Project
        run: |
          set -euo pipefail
          JSON="$(gh api graphql -f query='query($owner: ID!) { node(id: $owner) { ... on Organization { projectsV2(first: 100) { nodes { id number title } } } } }' -F owner="$PROJECT_OWNER_ID")"
          PROJECT_ID="$(jq -r --arg title "$PROJECT_TITLE" '.data.node.projectsV2.nodes[]? | select(.title == $title) | .id' <<<"$JSON" | head -n1)"
          test -n "$PROJECT_ID"
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

      - name: Remove closed Issue from Project
        if: ${{ github.event_name == 'issues' && github.event.action == 'closed' }}
        env:
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
        run: |
          set -euo pipefail

          CURSOR=""
          ITEM_ID=""
          while :; do
            if [ -z "$CURSOR" ]; then
              PAGE="$(gh api graphql -f query='query($project: ID!) {
                node(id: $project) {
                  ... on ProjectV2 {
                    items(first: 100) {
                      pageInfo { hasNextPage endCursor }
                      nodes { id content { ... on Issue { id } } }
                    }
                  }
                }
              }' -F project="$PROJECT_ID")"
            else
              PAGE="$(gh api graphql -f query='query($project: ID!, $after: String!) {
                node(id: $project) {
                  ... on ProjectV2 {
                    items(first: 100, after: $after) {
                      pageInfo { hasNextPage endCursor }
                      nodes { id content { ... on Issue { id } } }
                    }
                  }
                }
              }' -F project="$PROJECT_ID" -f after="$CURSOR")"
            fi

            ITEM_ID="$(jq -r --arg issue "$ISSUE_NODE_ID" '.data.node.items.nodes[]? | select(.content.id==$issue) | .id' <<<"$PAGE" | head -n1)"
            [ -z "$ITEM_ID" ] || break

            HAS="$(jq -r '.data.node.items.pageInfo.hasNextPage' <<<"$PAGE")"
            [ "$HAS" = "true" ] || break
            CURSOR="$(jq -r '.data.node.items.pageInfo.endCursor' <<<"$PAGE")"
          done

          if [ -n "$ITEM_ID" ]; then
            gh api graphql -f query='mutation($project: ID!, $item: ID!) {
              deleteProjectV2Item(input: {projectId: $project, itemId: $item}) { deletedItemId }
            }' -F project="$PROJECT_ID" -F item="$ITEM_ID" >/dev/null
          fi

      - name: Sync current Issue
        if: ${{ github.event_name == 'issues' && github.event.action != 'closed' }}
        env:
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          ADD="$(gh api graphql -f query='mutation($project: ID!, $content: ID!) {
            addProjectV2ItemById(input: {projectId: $project, contentId: $content}) { item { id } }
          }' -F project="$PROJECT_ID" -F content="$ISSUE_NODE_ID")"
          ITEM_ID="$(jq -r '.data.addProjectV2ItemById.item.id // empty' <<<"$ADD")"
          test -n "$ITEM_ID"

          ISSUE="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER")"
          LABELS="$(jq -r '[.labels[].name] | join("|")' <<<"$ISSUE")"

          FIELDS="$(gh api graphql -f query='query($project: ID!) {
            node(id: $project) {
              ... on ProjectV2 {
                fields(first: 100) {
                  nodes {
                    ... on ProjectV2SingleSelectField {
                      id name options { id name }
                    }
                  }
                }
              }
            }
          }' -F project="$PROJECT_ID")"

          field_id() { jq -r --arg n "$1" '.data.node.fields.nodes[]? | select(.name==$n) | .id' <<<"$FIELDS" | head -n1; }
          option_id() { jq -r --arg f "$1" --arg o "$2" '.data.node.fields.nodes[]? | select(.name==$f) | .options[]? | select(.name==$o) | .id' <<<"$FIELDS" | head -n1; }

          LF="$(field_id Lifecycle)"; AF="$(field_id Area)"; PF="$(field_id Priority)"
          test -n "$LF"; test -n "$AF"; test -n "$PF"

          L=""; A=""; P=""
          case "|$LABELS|" in *"|lifecycle:research|"*) L="Research";; *"|lifecycle:active|"*) L="Active";; *"|lifecycle:backlog|"*) L="Backlog";; esac
          case "|$LABELS|" in *"|area:knowledge|"*) A="Knowledge";; *"|area:interface|"*) A="Interface";; *"|area:operations|"*) A="Operations";; esac
          case "|$LABELS|" in *"|priority:now|"*) P="Now";; *"|priority:soon|"*) P="Soon";; *"|priority:long-term|"*) P="Long-term";; *"|priority:someday|"*) P="Someday";; esac

          set_value() {
            local field_name="$1" field_id="$2" option_name="$3"
            [ -n "$option_name" ] || return 0
            local option
            option="$(option_id "$field_name" "$option_name")"
            test -n "$option"
            gh api graphql -f query='mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project,
                itemId: $item,
                fieldId: $field,
                value: {singleSelectOptionId: $option}
              }) { projectV2Item { id } }
            }' -F project="$PROJECT_ID" -F item="$ITEM_ID" -F field="$field_id" -f option="$option" >/dev/null
          }

          set_value Lifecycle "$LF" "$L"
          set_value Area "$AF" "$A"
          set_value Priority "$PF" "$P"

      - name: Manual full-sync guidance
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "Run 'Issue Portfolio Project Bootstrap' for a full resync."
