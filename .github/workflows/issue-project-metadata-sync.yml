name: Issue Project Metadata Sync

on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: issue-project-sync-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
      PROJECT_OWNER_ID: O_kgDOEzyTWQ
      PROJECT_TITLE: InteropAtlas — Issue Portfolio

    steps:
      - name: Verify token
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api user --jq '.login' >/dev/null

      - name: Find Project
        run: |
          set -euo pipefail
          JSON="$(gh api graphql -f query='query($owner: ID!) { node(id: $owner) { ... on Organization { projectsV2(first: 100) { nodes { id title } } } } }' -F owner="$PROJECT_OWNER_ID")"
          PROJECT_ID="$(jq -r --arg title "$PROJECT_TITLE" '.data.node.projectsV2.nodes[]? | select(.title==$title) | .id' <<<"$JSON" | head -n1)"
          test -n "$PROJECT_ID"
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

      - name: Resolve existing Project item
        if: ${{ github.event_name == 'issues' }}
        env:
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
        run: |
          set -euo pipefail
          CURSOR=""
          ITEM_ID=""
          while :; do
            if [ -z "$CURSOR" ]; then
              PAGE="$(gh api graphql -f query='query($project: ID!) {
                node(id:$project) {
                  ... on ProjectV2 {
                    items(first:100) {
                      pageInfo { hasNextPage endCursor }
                      nodes { id content { ... on Issue { id } } }
                    }
                  }
                }
              }' -F project="$PROJECT_ID")"
            else
              PAGE="$(gh api graphql -f query='query($project: ID!,$after:String!) {
                node(id:$project) {
                  ... on ProjectV2 {
                    items(first:100,after:$after) {
                      pageInfo { hasNextPage endCursor }
                      nodes { id content { ... on Issue { id } } }
                    }
                  }
                }
              }' -F project="$PROJECT_ID" -f after="$CURSOR")"
            fi

            ITEM_ID="$(jq -r --arg issue "$ISSUE_NODE_ID" '.data.node.items.nodes[]? | select(.content.id==$issue) | .id' <<<"$PAGE" | head -n1)"
            [ -z "$ITEM_ID" ] || break

            HAS="$(jq -r '.data.node.items.pageInfo.hasNextPage' <<<"$PAGE")"
            [ "$HAS" = "true" ] || break
            CURSOR="$(jq -r '.data.node.items.pageInfo.endCursor' <<<"$PAGE")"
          done

          if [ -z "$ITEM_ID" ]; then
            ADD="$(gh api graphql -f query='mutation($project: ID!, $content: ID!) {
              addProjectV2ItemById(input:{projectId:$project, contentId:$content}) { item { id } }
            }' -F project="$PROJECT_ID" -F content="$ISSUE_NODE_ID")"
            ITEM_ID="$(jq -r '.data.addProjectV2ItemById.item.id // empty' <<<"$ADD")"
            test -n "$ITEM_ID"
            sleep 3
          fi

          echo "ITEM_ID=$ITEM_ID" >> "$GITHUB_ENV"


      - name: Sync Labels to existing Project item
        if: ${{ github.event_name == 'issues' && env.ITEM_ID != '' }}
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          ISSUE="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER")"
          LABELS="$(jq -r '[.labels[].name] | join("|")' <<<"$ISSUE")"

          FIELDS="$(gh api graphql -f query='query($project: ID!) {
            node(id:$project) {
              ... on ProjectV2 {
                fields(first:100) {
                  nodes {
                    ... on ProjectV2SingleSelectField { id name options { id name } }
                  }
                }
              }
            }
          }' -F project="$PROJECT_ID")"

          field_id() { jq -r --arg n "$1" '.data.node.fields.nodes[]? | select(.name==$n) | .id' <<<"$FIELDS" | head -n1; }
          option_id() { jq -r --arg f "$1" --arg o "$2" '.data.node.fields.nodes[]? | select(.name==$f) | .options[]? | select(.name==$o) | .id' <<<"$FIELDS" | head -n1; }

          ATF="$(field_id Attention)"; TF="$(field_id "Task Type")"; SF="$(field_id Status)"
          test -n "$ATF"; test -n "$TF"; test -n "$SF"

          AT=""; T=""; S=""
          STATE="$(jq -r '.state' <<<"$ISSUE")"
          case "|$LABELS|" in *"|attention:focus|"*) AT="Focus";; *"|attention:inbox|"*) AT="Inbox";; esac
          if [ "$STATE" = "closed" ]; then S="Done"; elif [ "$AT" = "Focus" ]; then S="In Progress"; elif [ "$AT" = "Inbox" ]; then S="Todo"; fi
          case "|$LABELS|" in *"|type:knowledge|"*) T="Knowledge";; *"|type:perspective|"*) T="Perspective";; *"|type:evolution|"*) T="Evolution";; esac

          set_value() {
            local field_name="$1" field_id="$2" option_name="$3"
            [ -n "$option_name" ] || return 0
            local option
            option="$(option_id "$field_name" "$option_name")"
            test -n "$option"
            gh api graphql -f query='mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(input:{
                projectId:$project,itemId:$item,fieldId:$field,
                value:{singleSelectOptionId:$option}
              }) { projectV2Item { id } }
            }' -F project="$PROJECT_ID" -F item="$ITEM_ID" -F field="$field_id" -f option="$option" >/dev/null
          }

          set_value Attention "$ATF" "$AT"
          set_value "Task Type" "$TF" "$T"
          set_value Status "$SF" "$S"

      - name: Manual note
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "Open and closed Issues remain in Issue Portfolio."
          echo "Existing Project items continue to sync normally."
          echo "Native Status mapping: Inbox -> Todo, Focus -> In Progress, Closed -> Done."
