name: Temporary Knowledge Link Migration

on:
  push:
    branches:
      - chore/knowledge-attention-hierarchy

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/knowledge-attention-hierarchy
          fetch-depth: 0
      - name: Replace migrated knowledge links
        shell: python
        run: |
          from pathlib import Path
          replacements = {
              '/docs/02_System/01_Knowledge/knowledge-object-classification-specification.zh-CN.md': '/docs/02_System/01_Knowledge/01_Model/knowledge-object-classification-specification.zh-CN.md',
              '/docs/02_System/01_Knowledge/knowledge-workspace-design-principles.zh-CN.md': '/docs/02_System/01_Knowledge/02_Workspace/knowledge-workspace-design-principles.zh-CN.md',
              '/docs/02_System/01_Knowledge/public-commons-and-personal-knowledge-space.zh-CN.md': '/docs/02_System/01_Knowledge/02_Workspace/public-commons-and-personal-knowledge-space.zh-CN.md',
              '/docs/02_System/01_Knowledge/provenance-traceability-profile.zh-CN.md': '/docs/02_System/01_Knowledge/03_Provenance/provenance-traceability-profile.zh-CN.md',
          }
          for path in Path('.').rglob('*.md'):
              text = path.read_text(encoding='utf-8')
              new = text
              for old, replacement in replacements.items():
                  new = new.replace(old, replacement)
              if new != text:
                  path.write_text(new, encoding='utf-8')
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.md' docs README.md AGENTS.md PROJECT_STATE.md CONTRIBUTING.md 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: fix knowledge references after reorg"
          git push origin HEAD:chore/knowledge-attention-hierarchy
