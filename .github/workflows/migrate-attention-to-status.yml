name: Migrate Attention to Native Status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-attention-to-status.yml'

permissions:
  contents: read
  issues: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
      PROJECT_OWNER_ID: O_kgDOEzyTWQ
      PROJECT_TITLE: InteropAtlas — Issue Portfolio

    steps:
      - name: Map Attention and Issue state into native Project Status
        run: |
          set -euo pipefail

          PROJECTS="$(gh api graphql -f query='query($owner: ID!) {
            node(id:$owner) {
              ... on Organization {
                projectsV2(first:100) { nodes { id number title } }
              }
            }
          }' -F owner="$PROJECT_OWNER_ID")"
          PROJECT_ID="$(jq -r --arg title "$PROJECT_TITLE" '.data.node.projectsV2.nodes[]? | select(.title==$title) | .id' <<<"$PROJECTS" | head -n1)"
          test -n "$PROJECT_ID"

          FIELDS="$(gh api graphql -f query='query($project: ID!) {
            node(id:$project) {
              ... on ProjectV2 {
                fields(first:100) {
                  nodes {
                    ... on ProjectV2SingleSelectField {
                      id name options { id name }
                    }
                  }
                }
              }
            }
          }' -F project="$PROJECT_ID")"

          STATUS_FIELD="$(jq -r '.data.node.fields.nodes[]? | select(.name=="Status") | .id' <<<"$FIELDS" | head -n1)"
          TODO_ID="$(jq -r '.data.node.fields.nodes[]? | select(.name=="Status") | .options[]? | select(.name=="Todo") | .id' <<<"$FIELDS" | head -n1)"
          INPROGRESS_ID="$(jq -r '.data.node.fields.nodes[]? | select(.name=="Status") | .options[]? | select(.name=="In Progress") | .id' <<<"$FIELDS" | head -n1)"
          DONE_ID="$(jq -r '.data.node.fields.nodes[]? | select(.name=="Status") | .options[]? | select(.name=="Done") | .id' <<<"$FIELDS" | head -n1)"

          test -n "$STATUS_FIELD"; test -n "$TODO_ID"; test -n "$INPROGRESS_ID"; test -n "$DONE_ID"

          set_status() {
            local item="$1" option="$2"
            gh api graphql -f query='mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(input:{
                projectId:$project,itemId:$item,fieldId:$field,
                value:{singleSelectOptionId:$option}
              }) { projectV2Item { id } }
            }' -F project="$PROJECT_ID" -F item="$item" -F field="$STATUS_FIELD" -f option="$option" >/dev/null
          }

          cursor=""
          total=0; todo=0; progress=0; done=0; unclassified=0
          while :; do
            if [ -z "$cursor" ]; then
              PAGE="$(gh api graphql -f query='query($project: ID!) {
                node(id:$project) {
                  ... on ProjectV2 {
                    items(first:100) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        content {
                          ... on Issue {
                            number state
                            labels(first:50) { nodes { name } }
                          }
                        }
                      }
                    }
                  }
                }
              }' -F project="$PROJECT_ID")"
            else
              PAGE="$(gh api graphql -f query='query($project: ID!, $after: String!) {
                node(id:$project) {
                  ... on ProjectV2 {
                    items(first:100, after:$after) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        content {
                          ... on Issue {
                            number state
                            labels(first:50) { nodes { name } }
                          }
                        }
                      }
                    }
                  }
                }
              }' -F project="$PROJECT_ID" -f after="$cursor")"
            fi

            while IFS= read -r ROW; do
              [ -n "$ROW" ] || continue
              total=$((total+1))
              ITEM="$(jq -r '.id' <<<"$ROW")"
              STATE="$(jq -r '.content.state' <<<"$ROW")"
              LABELS="$(jq -r '[.content.labels.nodes[].name] | join("|")' <<<"$ROW")"

              if [ "$STATE" = "CLOSED" ]; then
                set_status "$ITEM" "$DONE_ID"
                done=$((done+1))
              elif [[ "|$LABELS|" == *"|attention:focus|"* ]]; then
                set_status "$ITEM" "$INPROGRESS_ID"
                progress=$((progress+1))
              elif [[ "|$LABELS|" == *"|attention:inbox|"* ]]; then
                set_status "$ITEM" "$TODO_ID"
                todo=$((todo+1))
              else
                unclassified=$((unclassified+1))
                echo "UNCLASSIFIED_ISSUE=$(jq -r '.content.number' <<<"$ROW")"
              fi
            done < <(jq -c '.data.node.items.nodes[]? | select(.content != null)' <<<"$PAGE")

            has_next="$(jq -r '.data.node.items.pageInfo.hasNextPage' <<<"$PAGE")"
            [ "$has_next" = "true" ] || break
            cursor="$(jq -r '.data.node.items.pageInfo.endCursor' <<<"$PAGE")"
          done

          echo "TOTAL=$total"
          echo "TODO=$todo"
          echo "IN_PROGRESS=$progress"
          echo "DONE=$done"
          echo "UNCLASSIFIED=$unclassified"
          test "$unclassified" -eq 0

          # Verify actual stored Status values.
          cursor=""
          mismatch=0
          while :; do
            if [ -z "$cursor" ]; then
              PAGE="$(gh api graphql -f query='query($project: ID!) {
                node(id:$project) {
                  ... on ProjectV2 {
                    items(first:100) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        content {
                          ... on Issue { number state labels(first:50){nodes{name}} }
                        }
                        fieldValues(first:50) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name
                              field { ... on ProjectV2FieldCommon { name } }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }' -F project="$PROJECT_ID")"
            else
              PAGE="$(gh api graphql -f query='query($project: ID!, $after: String!) {
                node(id:$project) {
                  ... on ProjectV2 {
                    items(first:100, after:$after) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        content {
                          ... on Issue { number state labels(first:50){nodes{name}} }
                        }
                        fieldValues(first:50) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name
                              field { ... on ProjectV2FieldCommon { name } }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }' -F project="$PROJECT_ID" -f after="$cursor")"
            fi

            while IFS= read -r ROW; do
              [ -n "$ROW" ] || continue
              STATE="$(jq -r '.content.state' <<<"$ROW")"
              LABELS="$(jq -r '[.content.labels.nodes[].name] | join("|")' <<<"$ROW")"
              ACTUAL="$(jq -r '[.fieldValues.nodes[]? | select(.field.name=="Status") | .name][0] // ""' <<<"$ROW")"
              EXPECTED=""
              if [ "$STATE" = "CLOSED" ]; then EXPECTED="Done"
              elif [[ "|$LABELS|" == *"|attention:focus|"* ]]; then EXPECTED="In Progress"
              elif [[ "|$LABELS|" == *"|attention:inbox|"* ]]; then EXPECTED="Todo"
              fi
              if [ "$ACTUAL" != "$EXPECTED" ]; then
                mismatch=$((mismatch+1))
                echo "MISMATCH #$(jq -r '.content.number' <<<"$ROW") expected=$EXPECTED actual=$ACTUAL"
              fi
            done < <(jq -c '.data.node.items.nodes[]? | select(.content != null)' <<<"$PAGE")

            has_next="$(jq -r '.data.node.items.pageInfo.hasNextPage' <<<"$PAGE")"
            [ "$has_next" = "true" ] || break
            cursor="$(jq -r '.data.node.items.pageInfo.endCursor' <<<"$PAGE")"
          done

          echo "STATUS_MISMATCHES=$mismatch"
          test "$mismatch" -eq 0
