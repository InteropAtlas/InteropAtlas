name: Issue Native Relation Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue-native-relation-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
      REPO: InteropAtlas/InteropAtlas

    steps:
      - name: Migrate curated Parent relations to sub-issues
        run: |
          set -euo pipefail
          cat > /tmp/pairs.tsv <<'EOF'
          146	167
          150	172
          150	173
          150	202
          172	203
          149	206
          177	215
          216	217
          221	222
          150	223
          146	224
          146	225
          146	226
          146	227
          146	228
          146	229
          146	230
          146	231
          177	244
          247	248
          146	249
          146	250
          150	251
          173	252
          146	253
          214	257
          167	259
          150	260
          150	261
          151	262
          181	263
          181	264
          247	265
          232	266
          232	267
          213	268
          147	271
          147	272
          151	273
          151	274
          151	275
          150	276
          131	277
          146	278
          278	279
          146	280
          146	281
          149	283
          211	285
          226	288
          226	289
          204	290
          225	291
          253	293
          173	295
          295	296
          268	297
          241	298
          241	299
          173	300
          150	301
          212	303
          304	305
          305	306
          306	307
          201	308
          201	309
          201	310
          201	311
          201	312
          256	313
          256	314
          203	315
          309	316
          316	317
          318	319
          319	320
          212	321
          237	322
          240	323
          241	324
          176	325
          211	326
          145	327
          282	328
          152	329
          152	330
          146	331
          224	332
          202	333
          333	334
          202	335
          176	336
          176	337
          238	339
          145	340
          340	341
          181	342
          341	343
          344	345
          225	346
          329	347
          282	348
          146	349
          251	350
          211	351
          249	353
          358	359
          358	360
          232	363
          275	365
          247	366
          247	368
          407	408
          407	411
          EOF

          migrated=0
          already=0
          skipped_closed=0
          failed=0

          while IFS=$'\t' read -r parent child; do
            [ -n "$parent" ] || continue

            parent_json="$(gh api "repos/$REPO/issues/$parent")"
            child_json="$(gh api "repos/$REPO/issues/$child")"
            parent_state="$(jq -r '.state' <<<"$parent_json")"
            child_state="$(jq -r '.state' <<<"$child_json")"

            if [ "$parent_state" != "open" ] || [ "$child_state" != "open" ]; then
              echo "SKIP_CLOSED parent=#$parent($parent_state) child=#$child($child_state)"
              skipped_closed=$((skipped_closed+1))
              continue
            fi

            child_id="$(jq -r '.id' <<<"$child_json")"
            existing="$(gh api --paginate "repos/$REPO/issues/$parent/sub_issues?per_page=100" --jq '.[].number' 2>/dev/null || true)"
            if grep -qx "$child" <<<"$existing"; then
              echo "ALREADY_SUBISSUE parent=#$parent child=#$child"
              already=$((already+1))
              continue
            fi

            if gh api --method POST               -H "X-GitHub-Api-Version: 2022-11-28"               "repos/$REPO/issues/$parent/sub_issues"               -f sub_issue_id="$child_id" >/tmp/add.json 2>/tmp/add.err; then
              verify="$(gh api --paginate "repos/$REPO/issues/$parent/sub_issues?per_page=100" --jq '.[].number' 2>/dev/null || true)"
              if grep -qx "$child" <<<"$verify"; then
                echo "MIGRATED parent=#$parent child=#$child"
                migrated=$((migrated+1))
              else
                echo "VERIFY_FAILED parent=#$parent child=#$child"
                cat /tmp/add.json || true
                failed=$((failed+1))
              fi
            else
              echo "ADD_FAILED parent=#$parent child=#$child"
              cat /tmp/add.err || true
              failed=$((failed+1))
            fi
          done < /tmp/pairs.tsv

          echo "SUMMARY migrated=$migrated already=$already skipped_closed=$skipped_closed failed=$failed"
          test "$failed" -eq 0
