name: Maintenance 287 execute reviewed branch cleanup
on:
  push:
    branches: [maintenance/287-branch-pr-audit-20260911]
    paths: [.github/workflows/maintenance-287-cleanup.yml]
permissions:
  contents: write
  issues: write
  pull-requests: read
  actions: read
concurrency:
  group: maintenance-287-mutations
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Execute only frozen reviewed retirements; archive before any deletion
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: 0d7eb7e337a16ec1dfa4552f8f5f3cbe61297bfa
          EXPECTED_PR30_HEAD: 8483fcb37b59fa54ddfa19b90546a31994f88868
          EXPECTED_ARCHIVE_COMMIT: 0b18f51b77704728ab01d7ed758f12a8d8e30319
        run: python3 .github/maintenance/branch_pr_287.py cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-287-final-result
          path: maintenance-output/
          retention-days: 30
          if-no-files-found: error
