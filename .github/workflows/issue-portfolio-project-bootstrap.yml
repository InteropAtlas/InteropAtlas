name: Issue Portfolio Project Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue-portfolio-project-bootstrap.yml'

permissions:
  contents: read
  issues: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
      PROJECT_OWNER_ID: O_kgDOEzyTWQ
      REPOSITORY_ID: R_kgDOUIreng
      PROJECT_TITLE: InteropAtlas — Issue Portfolio
    steps:
      - name: Verify Projects token
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api user --jq '.login' >/dev/null

      - name: Find or create Project
        run: |
          set -euo pipefail
          JSON="$(gh api graphql -f query='query($owner: ID!) { node(id: $owner) { ... on Organization { projectsV2(first: 100) { nodes { id number title } } } } }' -F owner="$PROJECT_OWNER_ID")"
          PROJECT_ID="$(jq -r --arg title "$PROJECT_TITLE" '.data.node.projectsV2.nodes[]? | select(.title == $title) | .id' <<<"$JSON" | head -n1)"
          PROJECT_NUMBER="$(jq -r --arg title "$PROJECT_TITLE" '.data.node.projectsV2.nodes[]? | select(.title == $title) | .number' <<<"$JSON" | head -n1)"
          if [ -z "$PROJECT_ID" ]; then
            CREATED="$(gh api graphql -f query='mutation($owner: ID!, $repo: ID!, $title: String!) { createProjectV2(input: {ownerId: $owner, repositoryId: $repo, title: $title}) { projectV2 { id number title } } }' -F owner="$PROJECT_OWNER_ID" -F repo="$REPOSITORY_ID" -f title="$PROJECT_TITLE")"
            PROJECT_ID="$(jq -r '.data.createProjectV2.projectV2.id // empty' <<<"$CREATED")"
            PROJECT_NUMBER="$(jq -r '.data.createProjectV2.projectV2.number // empty' <<<"$CREATED")"
          fi
          test -n "$PROJECT_ID"
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "PROJECT_NUMBER=$PROJECT_NUMBER" >> "$GITHUB_ENV"

      - name: Ensure metadata fields (legacy; no-op)
        run: |
          set -euo pipefail
          echo 'Legacy Project metadata fields are no longer created; Issue Labels are the source of truth.'

      - name: Add all open Issues
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq '.[] | select(.pull_request == null) | .node_id' > /tmp/issues.txt
          ADDED=0
          while read -r ISSUE_ID; do
            [ -n "$ISSUE_ID" ] || continue
            if gh api graphql -f query='mutation($project: ID!, $content: ID!) { addProjectV2ItemById(input: {projectId: $project, contentId: $content}) { item { id } } }' -F project="$PROJECT_ID" -F content="$ISSUE_ID" >/dev/null 2>&1; then ADDED=$((ADDED+1)); fi
          done < /tmp/issues.txt
          echo "Processed open Issues; newly added or accepted mutations: $ADDED"

      - name: Remove duplicate Project metadata fields
        run: |
          set -euo pipefail
          FIELDS="$(gh api graphql -f query='query($project: ID!) { node(id: $project) { ... on ProjectV2 { fields(first: 100) { nodes { ... on ProjectV2Field { id name } ... on ProjectV2SingleSelectField { id name } } } } } }' -F project="$PROJECT_ID")"
          for NAME in "Lifecycle" "Area" "Priority" "Waiting on"; do
            ID="$(jq -r --arg name "$NAME" '.data.node.fields.nodes[]? | select(.name == $name) | .id' <<<"$FIELDS" | head -n1)"
            if [ -n "$ID" ]; then
              gh api graphql -f query='mutation($field: ID!) { deleteProjectV2Field(input: {fieldId: $field}) { projectV2Field { ... on ProjectV2Field { id } ... on ProjectV2SingleSelectField { id } } } }' -F field="$ID" >/dev/null
            fi
          done

      - name: Ensure label-filtered Saved Views
        env:
          API_VERSION: 2026-03-10
          ORG: InteropAtlas
        run: |
          set -euo pipefail
          BASE="/orgs/$ORG/projectsV2/$PROJECT_NUMBER/views"
          EXISTING="$(gh api -H "X-GitHub-Api-Version: $API_VERSION" "$BASE?per_page=100")"
          ensure_view() {
            local name="$1"; local filter="$2"
            if jq -e --arg name "$name" '(.value // .)[]? | select(.name == $name)' <<<"$EXISTING" >/dev/null; then
              echo "View exists: $name"; return 0
            fi
            jq -n --arg name "$name" --arg filter "$filter" '{name:$name,layout:"table",filter:$filter}' |
              gh api --method POST -H "X-GitHub-Api-Version: $API_VERSION" "$BASE" --input - >/dev/null
          }
          ensure_view "Current" 'is:issue is:open label:"lifecycle:active"'
          ensure_view "Research" 'is:issue is:open label:"lifecycle:research"'
          ensure_view "Near-term" 'is:issue is:open label:"priority:now","priority:soon"'
          ensure_view "Waiting" 'is:issue is:open label:"waiting:prerequisite","waiting:evidence","waiting:scale","waiting:owner"'
          ensure_view "Knowledge" 'is:issue is:open label:"area:knowledge"'
          ensure_view "Interface" 'is:issue is:open label:"area:interface"'
          ensure_view "Operations" 'is:issue is:open label:"area:operations"'

      - name: Summary
        run: |
          echo "Issue Portfolio Project: #$PROJECT_NUMBER"
          echo "Issue Labels are the metadata source of truth."
          echo "Project custom metadata fields are removed."
          echo "Saved views: Current / Research / Near-term / Waiting / Knowledge / Interface / Operations."
