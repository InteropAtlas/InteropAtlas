name: Issue Portfolio Project Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue-portfolio-project-bootstrap.yml'

permissions:
  contents: read
  issues: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
      PROJECT_OWNER_ID: O_kgDOEzyTWQ
      REPOSITORY_ID: R_kgDOUIreng
      PROJECT_TITLE: InteropAtlas — Issue Portfolio
      PROJECT_OWNER: InteropAtlas

    steps:
      - name: Verify Projects token
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api user --jq '.login' >/dev/null

      - name: Find or create Project
        run: |
          set -euo pipefail
          JSON="$(gh api graphql -f query='query($owner: ID!) { node(id: $owner) { ... on Organization { projectsV2(first: 100) { nodes { id number title } } } } }' -F owner="$PROJECT_OWNER_ID")"
          PROJECT_ID="$(jq -r --arg title "$PROJECT_TITLE" '.data.node.projectsV2.nodes[]? | select(.title == $title) | .id' <<<"$JSON" | head -n1)"
          PROJECT_NUMBER="$(jq -r --arg title "$PROJECT_TITLE" '.data.node.projectsV2.nodes[]? | select(.title == $title) | .number' <<<"$JSON" | head -n1)"
          if [ -z "$PROJECT_ID" ]; then
            CREATED="$(gh api graphql -f query='mutation($owner: ID!, $repo: ID!, $title: String!) { createProjectV2(input: {ownerId: $owner, repositoryId: $repo, title: $title}) { projectV2 { id number title } } }' -F owner="$PROJECT_OWNER_ID" -F repo="$REPOSITORY_ID" -f title="$PROJECT_TITLE")"
            PROJECT_ID="$(jq -r '.data.createProjectV2.projectV2.id // empty' <<<"$CREATED")"
            PROJECT_NUMBER="$(jq -r '.data.createProjectV2.projectV2.number // empty' <<<"$CREATED")"
          fi
          test -n "$PROJECT_ID"
          test -n "$PROJECT_NUMBER"
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "PROJECT_NUMBER=$PROJECT_NUMBER" >> "$GITHUB_ENV"

      - name: Add all open Issues
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq '.[] | select(.pull_request == null) | .html_url' > /tmp/issues.txt
          while read -r ISSUE_URL; do
            [ -n "$ISSUE_URL" ] || continue
            gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --url "$ISSUE_URL" >/dev/null 2>&1 || true
          done < /tmp/issues.txt

      - name: Ensure mirror fields for Board views
        run: |
          set -euo pipefail
          FIELDS="$(gh project field-list "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --format json)"

          ensure_field() {
            local name="$1"
            local options="$2"
            if jq -e --arg name "$name" '.fields[]? | select(.name == $name)' <<<"$FIELDS" >/dev/null; then
              echo "Field exists: $name"
            else
              gh project field-create "$PROJECT_NUMBER" --owner "$PROJECT_OWNER"                 --name "$name" --data-type SINGLE_SELECT --single-select-options "$options" >/dev/null
              echo "Created field: $name"
            fi
          }

          ensure_field "Lifecycle" "Research,Active,Backlog"
          ensure_field "Area" "Knowledge,Interface,Operations"
          ensure_field "Priority" "Now,Soon,Long-term,Someday"

      - name: Sync Labels to Project mirror fields
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100"             --jq '.[] | select(.pull_request == null) | [.html_url, ([.labels[].name] | join("|"))] | @tsv' > /tmp/issues.tsv

          while IFS=$'\t' read -r ISSUE_URL LABELS; do
            [ -n "$ISSUE_URL" ] || continue

            case "|$LABELS|" in
              *"|lifecycle:research|"*) LIFECYCLE="Research" ;;
              *"|lifecycle:active|"*) LIFECYCLE="Active" ;;
              *"|lifecycle:backlog|"*) LIFECYCLE="Backlog" ;;
              *) LIFECYCLE="" ;;
            esac

            case "|$LABELS|" in
              *"|area:knowledge|"*) AREA="Knowledge" ;;
              *"|area:interface|"*) AREA="Interface" ;;
              *"|area:operations|"*) AREA="Operations" ;;
              *) AREA="" ;;
            esac

            case "|$LABELS|" in
              *"|priority:now|"*) PRIORITY="Now" ;;
              *"|priority:soon|"*) PRIORITY="Soon" ;;
              *"|priority:long-term|"*) PRIORITY="Long-term" ;;
              *"|priority:someday|"*) PRIORITY="Someday" ;;
              *) PRIORITY="" ;;
            esac

            [ -z "$LIFECYCLE" ] || gh project item-edit "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --url "$ISSUE_URL" --field "Lifecycle" --value "$LIFECYCLE" >/dev/null
            [ -z "$AREA" ] || gh project item-edit "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --url "$ISSUE_URL" --field "Area" --value "$AREA" >/dev/null
            [ -z "$PRIORITY" ] || gh project item-edit "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --url "$ISSUE_URL" --field "Priority" --value "$PRIORITY" >/dev/null
          done < /tmp/issues.tsv

      - name: Summary
        run: |
          echo "Issue Portfolio Project: #$PROJECT_NUMBER"
          echo "Source of truth: Issue Labels."
          echo "Mirror fields: Lifecycle / Area / Priority."
          echo "Sync direction: Issue Labels -> Project fields."
          echo "Board views can now use these fields for columns/grouping/slicing."
