name: Issue Portfolio Project Bootstrap

# Closed Issues remain in Project history.
# Work Type / Waiting For are Organization Issue Fields on Issues.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue-portfolio-project-bootstrap.yml'

permissions:
  contents: read
  issues: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
      PROJECT_OWNER_ID: O_kgDOEzyTWQ
      PROJECT_TITLE: InteropAtlas — Issue Portfolio

    steps:
      - name: Find Project
        run: |
          set -euo pipefail
          JSON="$(gh api graphql -f query='query($owner: ID!) {
            node(id:$owner) {
              ... on Organization { projectsV2(first:100) { nodes { id number title } } }
            }
          }' -F owner="$PROJECT_OWNER_ID")"
          PROJECT_ID="$(jq -r --arg title "$PROJECT_TITLE" '.data.node.projectsV2.nodes[]? | select(.title==$title) | .id' <<<"$JSON" | head -n1)"
          PROJECT_NUMBER="$(jq -r --arg title "$PROJECT_TITLE" '.data.node.projectsV2.nodes[]? | select(.title==$title) | .number' <<<"$JSON" | head -n1)"
          test -n "$PROJECT_ID"; test -n "$PROJECT_NUMBER"
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "PROJECT_NUMBER=$PROJECT_NUMBER" >> "$GITHUB_ENV"

      - name: Add all Issues
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100"             --jq '.[] | select(.pull_request == null) | .node_id' > /tmp/issues.txt
          while read -r ISSUE_ID; do
            [ -n "$ISSUE_ID" ] || continue
            gh api graphql -f query='mutation($project: ID!, $content: ID!) {
              addProjectV2ItemById(input:{projectId:$project,contentId:$content}) { item { id } }
            }' -F project="$PROJECT_ID" -F content="$ISSUE_ID" >/dev/null 2>&1 || true
          done < /tmp/issues.txt

      - name: Fill only missing native Status values
        run: |
          set -euo pipefail
          FIELDS="$(gh api graphql -f query='query($project: ID!) {
            node(id:$project) {
              ... on ProjectV2 {
                fields(first:100) {
                  nodes {
                    ... on ProjectV2SingleSelectField { id name options { id name } }
                  }
                }
              }
            }
          }' -F project="$PROJECT_ID")"
          SF="$(jq -r '.data.node.fields.nodes[]? | select(.name=="Status") | .id' <<<"$FIELDS" | head -n1)"
          TODO="$(jq -r '.data.node.fields.nodes[]? | select(.name=="Status") | .options[]? | select(.name=="Todo") | .id' <<<"$FIELDS" | head -n1)"
          DONE="$(jq -r '.data.node.fields.nodes[]? | select(.name=="Status") | .options[]? | select(.name=="Done") | .id' <<<"$FIELDS" | head -n1)"
          test -n "$SF"; test -n "$TODO"; test -n "$DONE"

          set_value() {
            gh api graphql -f query='mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(input:{
                projectId:$project,itemId:$item,fieldId:$field,
                value:{singleSelectOptionId:$option}
              }) { projectV2Item { id } }
            }' -F project="$PROJECT_ID" -F item="$1" -F field="$SF" -f option="$2" >/dev/null
          }

          cursor=""
          while :; do
            if [ -z "$cursor" ]; then
              PAGE="$(gh api graphql -f query='query($project: ID!) {
                node(id:$project) {
                  ... on ProjectV2 {
                    items(first:100) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        content { ... on Issue { state } }
                        fieldValues(first:50) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name field { ... on ProjectV2FieldCommon { name } }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }' -F project="$PROJECT_ID")"
            else
              PAGE="$(gh api graphql -f query='query($project: ID!, $after: String!) {
                node(id:$project) {
                  ... on ProjectV2 {
                    items(first:100,after:$after) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        content { ... on Issue { state } }
                        fieldValues(first:50) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name field { ... on ProjectV2FieldCommon { name } }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }' -F project="$PROJECT_ID" -f after="$cursor")"
            fi

            while IFS= read -r ROW; do
              [ -n "$ROW" ] || continue
              CURRENT="$(jq -r '[.fieldValues.nodes[]? | select(.field.name=="Status") | .name][0] // ""' <<<"$ROW")"
              [ -z "$CURRENT" ] || continue
              ITEM="$(jq -r '.id' <<<"$ROW")"
              STATE="$(jq -r '.content.state' <<<"$ROW")"
              if [ "$STATE" = "CLOSED" ]; then set_value "$ITEM" "$DONE"; else set_value "$ITEM" "$TODO"; fi
            done < <(jq -c '.data.node.items.nodes[]? | select(.content != null)' <<<"$PAGE")

            HAS="$(jq -r '.data.node.items.pageInfo.hasNextPage' <<<"$PAGE")"
            [ "$HAS" = "true" ] || break
            cursor="$(jq -r '.data.node.items.pageInfo.endCursor' <<<"$PAGE")"
          done

      - name: Summary
        run: |
          echo "Issue Portfolio Project: #$PROJECT_NUMBER"
          echo "Native Status is preserved; only missing Status values are initialized."
          echo "Work Type / Waiting For are Organization Issue Fields."
