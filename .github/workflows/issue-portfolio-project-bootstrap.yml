name: Issue Portfolio Project Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue-portfolio-project-bootstrap.yml'

permissions:
  contents: read
  issues: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
      PROJECT_OWNER_ID: O_kgDOEzyTWQ
      REPOSITORY_ID: R_kgDOUIreng
      PROJECT_TITLE: InteropAtlas — Issue Portfolio

    steps:
      - name: Verify Projects token
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api user --jq '.login' >/dev/null

      - name: Find Project
        run: |
          set -euo pipefail
          JSON="$(gh api graphql -f query='query($owner: ID!) { node(id: $owner) { ... on Organization { projectsV2(first: 100) { nodes { id number title } } } } }' -F owner="$PROJECT_OWNER_ID")"
          PROJECT_ID="$(jq -r --arg title "$PROJECT_TITLE" '.data.node.projectsV2.nodes[]? | select(.title == $title) | .id' <<<"$JSON" | head -n1)"
          PROJECT_NUMBER="$(jq -r --arg title "$PROJECT_TITLE" '.data.node.projectsV2.nodes[]? | select(.title == $title) | .number' <<<"$JSON" | head -n1)"
          test -n "$PROJECT_ID"
          test -n "$PROJECT_NUMBER"
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "PROJECT_NUMBER=$PROJECT_NUMBER" >> "$GITHUB_ENV"

      - name: Add all open Issues
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq '.[] | select(.pull_request == null) | .node_id' > /tmp/issues.txt
          while read -r ISSUE_ID; do
            [ -n "$ISSUE_ID" ] || continue
            gh api graphql               -f query='mutation($project: ID!, $content: ID!) { addProjectV2ItemById(input: {projectId: $project, contentId: $content}) { item { id } } }'               -F project="$PROJECT_ID" -F content="$ISSUE_ID" >/dev/null 2>&1 || true
          done < /tmp/issues.txt

      - name: Ensure mirror fields
        run: |
          set -euo pipefail

          fields_json() {
            gh api graphql -f query='query($project: ID!) {
              node(id: $project) {
                ... on ProjectV2 {
                  fields(first: 100) {
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options { id name }
                      }
                    }
                  }
                }
              }
            }' -F project="$PROJECT_ID"
          }

          ensure_field() {
            local name="$1"
            local FIELDS
            FIELDS="$(fields_json)"
            if jq -e --arg name "$name" '.data.node.fields.nodes[]? | select(.name == $name)' <<<"$FIELDS" >/dev/null; then
              echo "Field exists: $name"
              return 0
            fi

            case "$name" in
              Lifecycle)
                gh api graphql -f query='mutation($project: ID!) {
                  createProjectV2Field(input: {
                    projectId: $project,
                    dataType: SINGLE_SELECT,
                    name: "Lifecycle",
                    singleSelectOptions: [
                      {name:"Research", color:PURPLE, description:"Open research question"},
                      {name:"Active", color:BLUE, description:"Currently activated bounded work"},
                      {name:"Backlog", color:GRAY, description:"Not currently activated"}
                    ]
                  }) { projectV2Field { ... on ProjectV2SingleSelectField { id name } } }
                }' -F project="$PROJECT_ID" >/dev/null
                ;;
              Area)
                gh api graphql -f query='mutation($project: ID!) {
                  createProjectV2Field(input: {
                    projectId: $project,
                    dataType: SINGLE_SELECT,
                    name: "Area",
                    singleSelectOptions: [
                      {name:"Knowledge", color:GREEN, description:"Knowledge/model/evidence"},
                      {name:"Interface", color:YELLOW, description:"Human/Agent access and interfaces"},
                      {name:"Operations", color:ORANGE, description:"Operations/governance/maintenance"}
                    ]
                  }) { projectV2Field { ... on ProjectV2SingleSelectField { id name } } }
                }' -F project="$PROJECT_ID" >/dev/null
                ;;
              Priority)
                gh api graphql -f query='mutation($project: ID!) {
                  createProjectV2Field(input: {
                    projectId: $project,
                    dataType: SINGLE_SELECT,
                    name: "Priority",
                    singleSelectOptions: [
                      {name:"Now", color:RED, description:"Needs attention now"},
                      {name:"Soon", color:ORANGE, description:"Near-term attention"},
                      {name:"Long-term", color:YELLOW, description:"Long-term attention"},
                      {name:"Someday", color:GRAY, description:"Someday / low-attention"}
                    ]
                  }) { projectV2Field { ... on ProjectV2SingleSelectField { id name } } }
                }' -F project="$PROJECT_ID" >/dev/null
                ;;
            esac
            echo "Created field: $name"
          }

          ensure_field Lifecycle
          ensure_field Area
          ensure_field Priority

      - name: Sync Labels to mirror fields
        run: |
          set -euo pipefail

          FIELDS="$(gh api graphql -f query='query($project: ID!) {
            node(id: $project) {
              ... on ProjectV2 {
                fields(first: 100) {
                  nodes {
                    ... on ProjectV2SingleSelectField {
                      id name options { id name }
                    }
                  }
                }
              }
            }
          }' -F project="$PROJECT_ID")"

          field_id() { jq -r --arg n "$1" '.data.node.fields.nodes[]? | select(.name==$n) | .id' <<<"$FIELDS" | head -n1; }
          option_id() { jq -r --arg f "$1" --arg o "$2" '.data.node.fields.nodes[]? | select(.name==$f) | .options[]? | select(.name==$o) | .id' <<<"$FIELDS" | head -n1; }

          LF="$(field_id Lifecycle)"; AF="$(field_id Area)"; PF="$(field_id Priority)"
          test -n "$LF"; test -n "$AF"; test -n "$PF"

          set_value() {
            local item="$1" field="$2" option="$3"
            [ -n "$option" ] || return 0
            gh api graphql -f query='mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project,
                itemId: $item,
                fieldId: $field,
                value: {singleSelectOptionId: $option}
              }) { projectV2Item { id } }
            }' -F project="$PROJECT_ID" -F item="$item" -F field="$field" -f option="$option" >/dev/null
          }

          cursor=""
          while :; do
            if [ -z "$cursor" ]; then
              PAGE="$(gh api graphql -f query='query($project: ID!) {
                node(id: $project) {
                  ... on ProjectV2 {
                    items(first: 100) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        content {
                          ... on Issue {
                            state
                            labels(first: 20) { nodes { name } }
                          }
                        }
                      }
                    }
                  }
                }
              }' -F project="$PROJECT_ID")"
            else
              PAGE="$(gh api graphql -f query='query($project: ID!, $after: String!) {
                node(id: $project) {
                  ... on ProjectV2 {
                    items(first: 100, after: $after) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        content {
                          ... on Issue {
                            state
                            labels(first: 20) { nodes { name } }
                          }
                        }
                      }
                    }
                  }
                }
              }' -F project="$PROJECT_ID" -f after="$cursor")"
            fi

            jq -c '.data.node.items.nodes[]? | select(.content.state=="OPEN")' <<<"$PAGE" |
            while read -r ROW; do
              ITEM="$(jq -r '.id' <<<"$ROW")"
              LABELS="$(jq -r '[.content.labels.nodes[].name] | join("|")' <<<"$ROW")"

              L=""; A=""; P=""
              case "|$LABELS|" in *"|lifecycle:research|"*) L="Research";; *"|lifecycle:active|"*) L="Active";; *"|lifecycle:backlog|"*) L="Backlog";; esac
              case "|$LABELS|" in *"|area:knowledge|"*) A="Knowledge";; *"|area:interface|"*) A="Interface";; *"|area:operations|"*) A="Operations";; esac
              case "|$LABELS|" in *"|priority:now|"*) P="Now";; *"|priority:soon|"*) P="Soon";; *"|priority:long-term|"*) P="Long-term";; *"|priority:someday|"*) P="Someday";; esac

              [ -z "$L" ] || set_value "$ITEM" "$LF" "$(option_id Lifecycle "$L")"
              [ -z "$A" ] || set_value "$ITEM" "$AF" "$(option_id Area "$A")"
              [ -z "$P" ] || set_value "$ITEM" "$PF" "$(option_id Priority "$P")"
            done

            HAS="$(jq -r '.data.node.items.pageInfo.hasNextPage' <<<"$PAGE")"
            [ "$HAS" = "true" ] || break
            cursor="$(jq -r '.data.node.items.pageInfo.endCursor' <<<"$PAGE")"
          done

      - name: Summary
        run: |
          echo "Issue Portfolio Project: #$PROJECT_NUMBER"
          echo "Issue Labels remain the source of truth."
          echo "Mirror fields: Lifecycle / Area / Priority."
          echo "Sync direction: Issue Labels -> Project fields."
