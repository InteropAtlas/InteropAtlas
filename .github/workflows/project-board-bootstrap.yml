name: Project Attention Board Bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/project-board-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
      ORG: InteropAtlas
      PROJECT_NUMBER: "2"

    steps:
      - name: Read project fields
        run: |
          set -euo pipefail
          gh api             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2026-03-10"             "/orgs/$ORG/projectsV2/$PROJECT_NUMBER/fields?per_page=100" > /tmp/fields.json
          cat /tmp/fields.json
          PRIORITY_ID="$(jq -r '(.value // .)[]? | select(.name=="Priority") | .id' /tmp/fields.json | head -n1)"
          test -n "$PRIORITY_ID"
          echo "PRIORITY_ID=$PRIORITY_ID" >> "$GITHUB_ENV"

      - name: Create attention board
        run: |
          set -euo pipefail
          jq -n             --arg name "Attention"             --arg filter "is:issue is:open"             --argjson priority "$PRIORITY_ID"             '{name:$name,layout:"board",filter:$filter,vertical_group_by:[$priority]}' > /tmp/view.json

          gh api             --method POST             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2026-03-10"             "/orgs/$ORG/projectsV2/$PROJECT_NUMBER/views"             --input /tmp/view.json > /tmp/created.json

          cat /tmp/created.json
          VIEW_NUMBER="$(jq -r '.value.number // .number' /tmp/created.json)"
          test -n "$VIEW_NUMBER"
          echo "VIEW_NUMBER=$VIEW_NUMBER" >> "$GITHUB_ENV"

      - name: Verify closed issue excluded
        run: |
          set -euo pipefail
          gh api             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2026-03-10"             "/orgs/$ORG/projectsV2/$PROJECT_NUMBER/views/$VIEW_NUMBER/items?per_page=100" > /tmp/items.json
          if jq -e '(.value // .)[]? | select(.content.number==129)' /tmp/items.json >/dev/null; then
            echo "ERROR: closed issue 129 is still visible"
            exit 1
          fi
          echo "Verified: closed issue 129 is excluded from Attention board."
