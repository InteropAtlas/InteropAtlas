name: REAL-408-003 evidence-persistence real CPU pilot
on:
  push:
    branches: [feat/adaptive-naming-skill-v0.1]
    paths: [.github/workflows/naming-real-pilot-003-once.yml]
permissions:
  contents: write
concurrency:
  group: real-408-003
  cancel-in-progress: false
jobs:
  real-model:
    if: github.repository == 'InteropAtlas/InteropAtlas' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      P: 03_Evolution/01_Research/03_Tests/naming-evidence-pilot/model-aware
      LLAMA_REV: 56381e407c0ccfb3a6f71e668a27a901001d22ce
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify 003 changes only experiment identity and persistence metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/real408003-evidence"
          python "$P/test_format_adapter.py" --output "$RUNNER_TEMP/real408003-evidence/format-tests.json"
          python "$P/test_workflow.py" --output "$RUNNER_TEMP/real408003-evidence/workflow-tests.json"
          python "$P/test_local_runner.py" --output "$RUNNER_TEMP/real408003-evidence/transport-tests.json"
          python "$P/test_protocol.py" --output "$RUNNER_TEMP/real408003-evidence/protocol-tests.json"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('03_Evolution/01_Research/03_Tests/naming-evidence-pilot/model-aware')
          assert hashlib.sha256((p/'format_adapter.py').read_bytes()).hexdigest()=='a2468c05c1ba92b00e1eb5f69b6bd2b923b1293954f3159a3d40e8abf04a7db5'
          src=(p/'real-pilot-003/run.py').read_text()
          assert 'evidence_persistence_strategy_outside_model_workflow' in src
          assert "BASE_RUN=HOME/'real-pilot-002/run.py'" in src
          PY
      - name: Compile pinned CPU runtime and verify exact weights
        id: setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/real408003-runtime"
          curl --fail --location --max-time 120 "https://codeload.github.com/ggml-org/llama.cpp/tar.gz/$LLAMA_REV" -o "$RUNNER_TEMP/real408003-runtime/llama.tar.gz"
          tar -xzf "$RUNNER_TEMP/real408003-runtime/llama.tar.gz" -C "$RUNNER_TEMP/real408003-runtime"
          S="$RUNNER_TEMP/real408003-runtime/llama.cpp-$LLAMA_REV"
          cmake -S "$S" -B "$S/build" -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build "$S/build" --target llama-server -j 4
          python "$P/real-pilot-003/run.py" setup --output "$RUNNER_TEMP/real408003-evidence/model" --runtime "$RUNNER_TEMP/real408003-runtime"
      - name: Execute frozen four-cell comparison
        id: pilot
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/real408003-evidence/model"
          BIN="$RUNNER_TEMP/real408003-runtime/llama.cpp-$LLAMA_REV/build/bin/llama-server"
          "$BIN" --version > "$OUT/runtime-version.txt" 2>&1
          "$BIN" -m "$RUNNER_TEMP/real408003-runtime/model.gguf" --host 127.0.0.1 --port 8081 -c 8192 -t 4 -tb 4 -np 1 -b 512 -ub 128 --alias REAL-408-003-Qwen4B > "$RUNNER_TEMP/real408003-server.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          python - <<'PY'
          import urllib.request,time,pathlib,os
          for _ in range(90):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8081/health',timeout=2) as response:
                      if response.status==200: break
              except Exception: time.sleep(1)
          else: raise RuntimeError('real_model_server_not_ready')
          with urllib.request.urlopen('http://127.0.0.1:8081/props',timeout=5) as response:
              (pathlib.Path(os.environ['RUNNER_TEMP'])/'real408003-evidence/model/server-props.json').write_bytes(response.read())
          PY
          python -u "$P/real-pilot-003/run.py" execute --output "$OUT"
      - name: Persist complete bounded evidence on verified current descendant head
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          PILOT_OUTCOME: ${{ steps.pilot.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,pathlib,hashlib,urllib.parse,urllib.request
          repo='InteropAtlas/InteropAtlas';branch='feat/adaptive-naming-skill-v0.1';base='https://api.github.com/repos/'+repo
          def api(path,method='GET',body=None):
              req=urllib.request.Request(base+path,method=method,data=json.dumps(body,ensure_ascii=False).encode() if body is not None else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as response:return json.load(response)
          source=os.environ['GITHUB_SHA']
          current=api('/git/ref/heads/'+branch)['object']['sha']
          if current!=source:
              cmp=api('/compare/'+source+'...'+current)
              assert cmp['merge_base_commit']['sha']==source and cmp['status']=='ahead','Branch no longer a clean descendant of experiment source'
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'real408003-evidence';files={};total=0
          for path in sorted(root.rglob('*')) if root.exists() else []:
              if not path.is_file() or path.name=='model.gguf':continue
              raw=path.read_bytes();total+=len(raw);assert total<10_000_000,'Evidence exceeds publication cap'
              files[str(path.relative_to(root))]={'sha256':hashlib.sha256(raw).hexdigest(),'content':raw.decode('utf-8')}
          outcome={'run_id':os.environ['GITHUB_RUN_ID'],'source_commit':source,'persistence_base_commit':current,'setup':os.environ['SETUP_OUTCOME'],'pilot':os.environ['PILOT_OUTCOME'],
                   'model_calls_are_real_not_mock':True,'user_machine_tested':False,'paid_inference_api_calls':0,
                   'REAL_408_002_rescored':False,'method_prompt_task_model_seed_budget_format_adapter':'identical_to_REAL_408_002',
                   'execution_change_only':'evidence_persistence_strategy','files':files}
          home=os.environ['P']+'/real-pilot-003/results/'
          entries=[{'path':home+'evidence.json','mode':'100644','type':'blob','content':json.dumps(outcome,ensure_ascii=False,indent=2)+'\n'}]
          for name in ('summary.json','identity.json','preregistered-plan.json','completed.json'):
              path=root/'model'/name
              if path.exists():entries.append({'path':home+name,'mode':'100644','type':'blob','content':path.read_text()})
          for name in ('format-tests.json','workflow-tests.json','transport-tests.json','protocol-tests.json'):
              path=root/name
              if path.exists():entries.append({'path':home+name,'mode':'100644','type':'blob','content':path.read_text()})
          tree=api('/git/trees','POST',{'base_tree':api('/git/commits/'+current)['tree']['sha'],'tree':entries})['sha']
          commit=api('/git/commits','POST',{'message':'evidence(#408): preserve REAL-408-003 same-condition rerun after 002 persistence failure\n\nMethod and model conditions remain identical to REAL-408-002. No answer repair, adoption, user-machine validation or method promotion.','tree':tree,'parents':[current]})['sha']
          assert api('/git/ref/heads/'+branch)['object']['sha']==current,'Concurrent change after persistence base selection; do not overwrite'
          api('/git/refs/heads/'+branch,'PATCH',{'sha':commit,'force':False})
          print(json.dumps({'evidence_commit':commit,'run_id':os.environ['GITHUB_RUN_ID'],'source_commit':source,'persistence_base_commit':current,'files':len(files),'bytes':total,'setup':os.environ['SETUP_OUTCOME'],'pilot':os.environ['PILOT_OUTCOME']}))
          PY
