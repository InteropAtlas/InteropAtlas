name: Publish Human-readable InteropAtlas

on:
  push:
    branches: [main]
    paths:
      - '01_State/**'
      - '02_Runtime/01_Engine/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install site dependencies
        run: pip install -r 02_Runtime/01_Engine/requirements.txt
      - name: Build semantic human-readable site
        run: |
          python 02_Runtime/01_Engine/render_site_semantic.py --root . --output build/site
          test -f build/site/objects/automated_build_deployment.html
          test -f build/site/objects/forgejo_actions.html
          test -f build/site/objects/yaml_1.2.2.html
          find build/site -maxdepth 2 -type f | sort
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
