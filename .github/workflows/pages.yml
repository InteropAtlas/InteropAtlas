name: Publish Human-readable InteropAtlas

on:
  push:
    branches: [main]
    paths:
      - 'standards/**'
      - 'capabilities/**'
      - 'implementations/**'
      - 'organizations/**'
      - 'scenarios/**'
      - 'relations/**'
      - 'maps/**'
      - 'engine/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install site dependencies
        run: pip install -r engine/requirements.txt
      - name: Build human-readable site
        run: |
          python engine/render_site.py --output build/site
          find build/site -maxdepth 2 -type f | sort
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
