name: REAL-408-003 audit aggregation and state reconciliation
on:
  push:
    branches: [feat/adaptive-naming-skill-v0.1]
    paths: [.github/workflows/naming-003-audit-finalize-once.yml]
permissions:
  contents: write
jobs:
  record:
    if: github.repository == 'InteropAtlas/InteropAtlas' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      A: 03_Evolution/01_Research/03_Tests/naming-evidence-pilot/model-aware/real-pilot-003/audit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python -m pip install PyYAML==6.0.2
      - name: Recompute all audit projections and verify unchanged naming inputs
        run: |
          set -euo pipefail
          python "$A/extract.py" --source "$A/../results/evidence.json" --output "$A"
          python "$A/summarize.py" --output "$RUNNER_TEMP/audit-metrics.json"
          python "$A/summarize.py" --output "$RUNNER_TEMP/audit-metrics.json"
          git diff --exit-code edde49b36c4fc39df0fa64c6959f9a01b75b2f09 -- 02_Runtime/02_Tools/adaptive_naming/ "$A/../results" "$A/../../workflow.py" "$A/../../protocol.py" "$A/../../format_adapter.py" "$A/../../experiment.json" "$A/../../development-tasks.json"
      - name: Publish measured arithmetic and v93 without rewriting original results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,pathlib,re,subprocess,urllib.request,yaml
          a=pathlib.Path(os.environ['A']);state=a.parents[3]/'organization-naming-411-state.yaml'
          assert str(state)=='03_Evolution/01_Research/03_Tests/organization-naming-411-state.yaml'
          raw=state.read_text();old=yaml.safe_load(raw)
          assert old['task']['snapshot_version']==92
          frozen=json.loads(subprocess.check_output(['git','show','20a93804c3d1fda7cb43f02d4a7d4474f9830b06:'+str(a/'assessment.json')]))
          current=json.loads((a/'assessment.json').read_text());assert current['surface']==frozen['surface']
          current['explanation_review']='completed_in_REPORT_section_2_1_author_assessment_not_independent_review'
          current['surface_freeze_commit']='20a93804c3d1fda7cb43f02d4a7d4474f9830b06'
          current['posthoc_aggregation']='metrics.json; no original model decisions or outcomes changed'
          updated=raw.replace('  snapshot_version: 92\n','  snapshot_version: 93\n',1)
          next_action='next_action:\n  action: narrow_selector_claim_boundary_and_priority_queue_using_existing_candidates\n  rationale: >-\n    REAL-408-003已完成既有材料知情审计；三路线生成收益微弱且评审敏感，不足以抵偿额外成本成为默认。\n    优先分开生成者猜测与事实、优先项与hold，并对完整多层包装做窄修复。使用同一候选池，不先开新生成轮。\n  requires_owner: false_for_bounded_method_research_no_paid_or_ia_generation\n\n'
          updated,n=re.subn(r'^next_action:\n.*?(?=^stop:)',next_action,updated,flags=re.M|re.S);assert n==1
          head,rest=updated.split('model_aware_rebuild:\n',1);m,tail=rest.split('standalone_workflow:\n',1)
          m=m.replace('status: actual_cpu_pilot_completed_interface_failures_method_benefit_unresolved','status: existing_003_material_audited_simple_default_recommended_not_promoted',1)
          m=m.replace('current_entry: naming-evidence-pilot/model-aware/README.md','current_entry: naming-evidence-pilot/model-aware/real-pilot-003/audit/REPORT.zh-CN.md',1)
          m=m.replace('    actual_model_runs: 4\n    actual_model_calls: 11\n','    actual_model_runs: 8\n    actual_model_calls: 28\n    count_scope: REAL_408_001_and_003_full_raw_capture_only\n    additional_log_only_REAL_408_002_calls: 19\n    latest_audit_ref: real_model_audit_003\n',1)
          tail=tail.replace('  real_model_runs: 4\n  actual_model_calls: 11\n','  real_model_runs: 8\n  actual_model_calls: 28\n  count_scope: REAL_408_001_and_003_full_raw_capture_only_002_19_calls_log_only\n  latest_audit_ref: real_model_audit_003\n',1)
          tail=tail.replace('  actual_semantic_review: not_performed\n','  actual_semantic_review: exploratory_author_audit_003_not_independent\n',1)
          updated=head+'model_aware_rebuild:\n'+m+'standalone_workflow:\n'+tail
          audit={'id':'REAL-408-003-AUDIT-01','status':'completed_exploratory_author_assessment_independent_review_pending',
            'source_commit':'edde49b36c4fc39df0fa64c6959f9a01b75b2f09','source_run':34700578647,
            'authority_ref':'https://github.com/InteropAtlas/InteropAtlas/issues/408#issuecomment-5647137409',
            'report':'naming-evidence-pilot/model-aware/real-pilot-003/audit/REPORT.zh-CN.md',
            'data':'naming-evidence-pilot/model-aware/real-pilot-003/audit/data.json',
            'assessment':'naming-evidence-pilot/model-aware/real-pilot-003/audit/assessment.json',
            'metrics':'naming-evidence-pilot/model-aware/real-pilot-003/audit/metrics.json',
            'verified_embedded_files':252,'candidate_occurrences':24,'unique_names':16,'explanation_variants':24,
            'new_model_execution_calls':0,'real_003_calls':17,'002_calls':19,'002_capture':'logs_only_full_workspace_not_preserved',
            'review_independence':'not_independent_author_preexposed','winner':'not_established',
            'development_default_recommendation':'simple_three_lenses_optional_runtime_not_changed',
            'correction':'003 review_coverage_incomplete actually has complete C005 review nested under output_contract; original blocked result not rescored',
            'ia_naming_resumed':False,'skill_changed':False,'stable_promotion':False,'independent_review':'not_performed'}
          updated+='\n# v93 current exploratory audit; prior experiment objects remain historical.\nreal_model_audit_003:\n'+''.join('  '+line+'\n' for line in json.dumps(audit,ensure_ascii=False,indent=2).splitlines())
          new=yaml.safe_load(updated)
          assert new['task']==dict(old['task'],snapshot_version=93)
          for key in old:
              if key not in ('task','next_action','model_aware_rebuild','standalone_workflow'):assert new[key]==old[key],key
          assert new['model_aware_rebuild']['authorization']==old['model_aware_rebuild']['authorization']
          assert new['model_aware_rebuild']['local_transport']==old['model_aware_rebuild']['local_transport']
          metrics=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'audit-metrics.json').read_text())
          assert metrics['new_inference_calls']==0 and metrics['coverage_error_correction']['complete_required_content_exists']
          base='https://api.github.com/repos/InteropAtlas/InteropAtlas';branch='feat/adaptive-naming-skill-v0.1'
          def api(path,method='GET',data=None):
              req=urllib.request.Request(base+path,method=method,data=None if data is None else json.dumps(data,ensure_ascii=False).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          expected=os.environ['GITHUB_SHA'];assert api('/git/ref/heads/'+branch)['object']['sha']==expected
          entries=[{'path':str(state),'mode':'100644','type':'blob','content':updated},
            {'path':str(a/'assessment.json'),'mode':'100644','type':'blob','content':json.dumps(current,ensure_ascii=False,indent=2)+'\n'},
            {'path':str(a/'metrics.json'),'mode':'100644','type':'blob','content':json.dumps(metrics,ensure_ascii=False,indent=2)+'\n'}]
          tree=api('/git/trees','POST',{'base_tree':api('/git/commits/'+expected)['tree']['sha'],'tree':entries})['sha']
          commit=api('/git/commits','POST',{'tree':tree,'parents':[expected],'message':'research(#408,#411): record v93 candidate audit and corrected envelope diagnosis\n\nPreserve frozen name assessments and original experiments. 24 occurrences/16 names, generation-only cost arithmetic, no quality winner, no independent-blind-review claim. No new inference, IA generation or stable promotion.'})['sha']
          assert api('/git/ref/heads/'+branch)['object']['sha']==expected
          api('/git/refs/heads/'+branch,'PATCH',{'sha':commit,'force':False})
          print(json.dumps({'commit':commit,'snapshot':93,'run_id':os.environ['GITHUB_RUN_ID'],'new_model_calls':0}))
          PY
