name: Native Issue Metadata Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-issue-metadata-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
      ORG: InteropAtlas
    steps:
      - name: Inspect organization Issue Types and Issue Fields
        run: |
          set -euo pipefail
          echo "ISSUE_TYPES=$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' "orgs/$ORG/issue-types")"
          echo "ISSUE_FIELDS=$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' "orgs/$ORG/issue-fields")"
          echo "REPO_TYPES=$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$GITHUB_REPOSITORY/issue-types")"
