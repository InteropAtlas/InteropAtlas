name: Retire Legacy Metadata Labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-legacy-metadata-labels.yml'

permissions:
  contents: read
  issues: write

jobs:
  retire:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
    steps:
      - name: Remove retired labels from all Issues
        run: |
          set -euo pipefail
          retired=(
            "attention:focus"
            "attention:inbox"
            "type:knowledge"
            "type:perspective"
            "type:evolution"
            "waiting:evidence"
            "waiting:scale"
            "waiting:owner"
          )

          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100"             --jq '.[] | select(.pull_request == null)' > /tmp/issues.jsonl

          removed=0
          while IFS= read -r ISSUE; do
            [ -n "$ISSUE" ] || continue
            n="$(jq -r '.number' <<<"$ISSUE")"
            labels="$(jq -r '[.labels[].name] | join("|")' <<<"$ISSUE")"
            for label in "${retired[@]}"; do
              if [[ "|$labels|" == *"|$label|"* ]]; then
                encoded="$(printf '%s' "$label" | jq -sRr @uri)"
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$n/labels/$encoded" >/dev/null
                removed=$((removed+1))
              fi
            done
          done < /tmp/issues.jsonl
          echo "REMOVED_LABEL_ASSIGNMENTS=$removed"

      - name: Verify no retired labels remain on Issues
        run: |
          set -euo pipefail
          retired_re='^(attention:(focus|inbox)|type:(knowledge|perspective|evolution)|waiting:(evidence|scale|owner))$'
          remaining=0

          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100"             --jq '.[] | select(.pull_request == null)' > /tmp/issues.jsonl

          while IFS= read -r ISSUE; do
            [ -n "$ISSUE" ] || continue
            n="$(jq -r '.number' <<<"$ISSUE")"
            while read -r label; do
              [ -n "$label" ] || continue
              if [[ "$label" =~ $retired_re ]]; then
                remaining=$((remaining+1))
                echo "RETIRED_LABEL_REMAINS #$n $label"
              fi
            done < <(jq -r '.labels[].name' <<<"$ISSUE")
          done < /tmp/issues.jsonl

          echo "RETIRED_LABEL_ASSIGNMENTS_REMAINING=$remaining"
          test "$remaining" -eq 0

      - name: Verify native Issue Fields still complete
        run: |
          set -euo pipefail
          total=0
          missing_work_type=0
          invalid_waiting=0

          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100"             --jq '.[] | select(.pull_request == null) | .number' > /tmp/numbers.txt

          while read -r n; do
            [ -n "$n" ] || continue
            total=$((total+1))
            VALUES="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$GITHUB_REPOSITORY/issues/$n/issue-field-values")"
            WT="$(jq -r '.[]? | select(.issue_field_name=="Work Type") | .single_select_option.name' <<<"$VALUES" | head -n1)"
            WF="$(jq -r '.[]? | select(.issue_field_name=="Waiting For") | .single_select_option.name' <<<"$VALUES" | head -n1)"
            if [ -z "$WT" ]; then
              missing_work_type=$((missing_work_type+1))
              echo "MISSING_WORK_TYPE #$n"
            fi
            if [ -n "$WF" ] && [ "$WF" != "Evidence" ] && [ "$WF" != "Scale" ] && [ "$WF" != "Owner" ]; then
              invalid_waiting=$((invalid_waiting+1))
              echo "INVALID_WAITING_FOR #$n value=$WF"
            fi
          done < /tmp/numbers.txt

          echo "TOTAL=$total"
          echo "MISSING_WORK_TYPE=$missing_work_type"
          echo "INVALID_WAITING_FOR=$invalid_waiting"
          test "$missing_work_type" -eq 0
          test "$invalid_waiting" -eq 0
