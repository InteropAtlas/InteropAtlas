name: Project Field Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/project-field-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
      PROJECT_OWNER_ID: O_kgDOEzyTWQ
      PROJECT_TITLE: InteropAtlas — Issue Portfolio
      ORG: InteropAtlas

    steps:
      - name: Verify native Issue fields and Project Status
        run: |
          set -euo pipefail

          ORG_FIELDS="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' "orgs/$ORG/issue-fields")"
          WORK_TYPE="$(jq -c '.[]? | select(.name=="Work Type")' <<<"$ORG_FIELDS")"
          WAITING_FOR="$(jq -c '.[]? | select(.name=="Waiting For")' <<<"$ORG_FIELDS")"

          test -n "$WORK_TYPE"
          test -n "$WAITING_FOR"
          test "$(jq -r '[.options[].name] | sort | join("|")' <<<"$WORK_TYPE")" = "Evolution|Knowledge|Perspective"
          test "$(jq -r '[.options[].name] | sort | join("|")' <<<"$WAITING_FOR")" = "Evidence|Owner|Scale"

          PROJECTS="$(gh api graphql -f query='query($owner: ID!) {
            node(id:$owner) {
              ... on Organization { projectsV2(first:100) { nodes { id number title } } }
            }
          }' -F owner="$PROJECT_OWNER_ID")"
          PROJECT_ID="$(jq -r --arg title "$PROJECT_TITLE" '.data.node.projectsV2.nodes[]? | select(.title==$title) | .id' <<<"$PROJECTS" | head -n1)"
          PROJECT_NUMBER="$(jq -r --arg title "$PROJECT_TITLE" '.data.node.projectsV2.nodes[]? | select(.title==$title) | .number' <<<"$PROJECTS" | head -n1)"
          test -n "$PROJECT_ID"; test -n "$PROJECT_NUMBER"

          DATA="$(gh api graphql -f query='query($project: ID!) {
            node(id:$project) {
              ... on ProjectV2 {
                fields(first:100) {
                  nodes {
                    __typename
                    ... on ProjectV2FieldCommon { id name dataType }
                    ... on ProjectV2SingleSelectField { options { id name } }
                  }
                }
                views(first:100, orderBy:{field:POSITION,direction:ASC}) {
                  nodes {
                    id number name layout filter
                    groupByFields(first:10){nodes{... on ProjectV2FieldCommon{id name dataType}}}
                    verticalGroupByFields(first:10){nodes{... on ProjectV2FieldCommon{id name dataType}}}
                  }
                }
              }
            }
          }' -F project="$PROJECT_ID")"

          echo "PROJECT_NUMBER=$PROJECT_NUMBER"
          echo "PROJECT_FIELDS=$(jq -c '.data.node.fields.nodes' <<<"$DATA")"
          echo "CURRENT_VIEWS=$(jq -c '.data.node.views.nodes' <<<"$DATA")"

          STATUS_OPTIONS="$(jq -r '[.data.node.fields.nodes[]? | select(.name=="Status") | .options[].name] | sort | join("|")' <<<"$DATA")"
          echo "STATUS_OPTIONS=$STATUS_OPTIONS"
          test "$STATUS_OPTIONS" = "Done|In Progress|Todo"

          BOARD="$(jq -c '.data.node.views.nodes[]? | select(.name=="Attention Board")' <<<"$DATA")"
          echo "MAIN_BOARD=$BOARD"
          BOARD_VERTICAL="$(jq -r '[.verticalGroupByFields.nodes[].name] | join("|")' <<<"$BOARD")"
          BOARD_GROUP="$(jq -r '[.groupByFields.nodes[].name] | join("|")' <<<"$BOARD")"
          echo "BOARD_VERTICAL_GROUP=$BOARD_VERTICAL"
          echo "BOARD_GROUP=$BOARD_GROUP"
          test "$BOARD_VERTICAL" = "Status"

          total=0
          missing_work_type=0
          invalid_waiting=0

          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100"             --jq '.[] | select(.pull_request == null) | .number' > /tmp/numbers.txt

          while read -r n; do
            [ -n "$n" ] || continue
            total=$((total+1))
            VALUES="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$GITHUB_REPOSITORY/issues/$n/issue-field-values")"
            WT="$(jq -r '.[]? | select(.issue_field_name=="Work Type") | .single_select_option.name' <<<"$VALUES" | head -n1)"
            WF="$(jq -r '.[]? | select(.issue_field_name=="Waiting For") | .single_select_option.name' <<<"$VALUES" | head -n1)"
            if [ -z "$WT" ]; then
              missing_work_type=$((missing_work_type+1))
              echo "MISSING_WORK_TYPE #$n"
            fi
            if [ -n "$WF" ] && [ "$WF" != "Evidence" ] && [ "$WF" != "Scale" ] && [ "$WF" != "Owner" ]; then
              invalid_waiting=$((invalid_waiting+1))
              echo "INVALID_WAITING_FOR #$n value=$WF"
            fi
          done < /tmp/numbers.txt

          echo "TOTAL_ISSUES=$total"
          echo "MISSING_WORK_TYPE=$missing_work_type"
          echo "INVALID_WAITING_FOR=$invalid_waiting"
          test "$missing_work_type" -eq 0
          test "$invalid_waiting" -eq 0
