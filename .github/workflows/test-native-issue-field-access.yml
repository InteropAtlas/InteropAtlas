name: Test Native Issue Field Access

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-native-issue-field-access.yml'

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
      ORG: InteropAtlas
    steps:
      - name: Read organization fields and set Work Type on 436
        run: |
          set -euo pipefail

          FIELDS="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' "orgs/$ORG/issue-fields")"
          echo "FIELDS=$FIELDS"

          WORK_TYPE_ID="$(jq -r '.[]? | select(.name=="Work Type") | .id' <<<"$FIELDS" | head -n1)"
          WAITING_FOR_ID="$(jq -r '.[]? | select(.name=="Waiting For") | .id' <<<"$FIELDS" | head -n1)"

          echo "WORK_TYPE_ID=$WORK_TYPE_ID"
          echo "WAITING_FOR_ID=$WAITING_FOR_ID"

          test -n "$WORK_TYPE_ID"
          test -n "$WAITING_FOR_ID"

          BEFORE="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' repos/$GITHUB_REPOSITORY/issues/436/issue-field-values)"
          echo "BEFORE=$BEFORE"

          gh api --method POST             -H 'X-GitHub-Api-Version: 2026-03-10'             repos/$GITHUB_REPOSITORY/issues/436/issue-field-values             --input - <<JSON
          {
            "issue_field_values": [
              {"field_id": $WORK_TYPE_ID, "value": "Evolution"}
            ]
          }
          JSON

          AFTER="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' repos/$GITHUB_REPOSITORY/issues/436/issue-field-values)"
          echo "AFTER=$AFTER"

          test "$(jq -r '.[]? | select(.issue_field_name=="Work Type") | .single_select_option.name' <<<"$AFTER")" = "Evolution"
