name: Project Index Main Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/project-index-recheck.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
      PROJECT_OWNER_ID: O_kgDOEzyTWQ
      PROJECT_TITLE: InteropAtlas — Issue Portfolio

    steps:
      - name: Verify target appears in main project
        run: |
          set -euo pipefail
          P="$(gh api graphql -f query='query($owner: ID!) {
            node(id:$owner) {
              ... on Organization {
                projectsV2(first:100) { nodes { id title } }
              }
            }
          }' -F owner="$PROJECT_OWNER_ID")"
          PROJECT_ID="$(jq -r --arg title "$PROJECT_TITLE" '.data.node.projectsV2.nodes[]? | select(.title==$title) | .id' <<<"$P" | head -n1)"
          test -n "$PROJECT_ID"

          CURSOR=""
          FOUND="false"
          TOTAL=0
          while :; do
            if [ -z "$CURSOR" ]; then
              PAGE="$(gh api graphql -f query='query($project: ID!) {
                node(id:$project) {
                  ... on ProjectV2 {
                    items(first:100) {
                      totalCount
                      pageInfo { hasNextPage endCursor }
                      nodes { id content { ... on Issue { number title state } } }
                    }
                  }
                }
              }' -F project="$PROJECT_ID")"
            else
              PAGE="$(gh api graphql -f query='query($project: ID!,$after:String!) {
                node(id:$project) {
                  ... on ProjectV2 {
                    items(first:100,after:$after) {
                      totalCount
                      pageInfo { hasNextPage endCursor }
                      nodes { id content { ... on Issue { number title state } } }
                    }
                  }
                }
              }' -F project="$PROJECT_ID" -f after="$CURSOR")"
            fi
            TOTAL="$(jq -r '.data.node.items.totalCount' <<<"$PAGE")"
            if jq -e '.data.node.items.nodes[]? | select(.content.number==435)' <<<"$PAGE" >/dev/null; then
              FOUND="true"
              jq -c '.data.node.items.nodes[] | select(.content.number==435)' <<<"$PAGE"
              break
            fi
            HAS="$(jq -r '.data.node.items.pageInfo.hasNextPage' <<<"$PAGE")"
            [ "$HAS" = "true" ] || break
            CURSOR="$(jq -r '.data.node.items.pageInfo.endCursor' <<<"$PAGE")"
          done
          echo "TOTAL=$TOTAL FOUND=$FOUND"
          test "$FOUND" = "true"
