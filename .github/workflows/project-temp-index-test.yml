name: Project Temp Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/project-temp-index-test.yml'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
      PROJECT_OWNER_ID: O_kgDOEzyTWQ
      TEST_TITLE: IA TEMP Project Index Test

    steps:
      - name: Find temporary project
        run: |
          set -euo pipefail
          JSON="$(gh api graphql -f query='query($owner: ID!) {
            node(id: $owner) {
              ... on Organization {
                projectsV2(first: 100) { nodes { id number title } }
              }
            }
          }' -F owner="$PROJECT_OWNER_ID")"

          PROJECT_ID="$(jq -r --arg title "$TEST_TITLE" '.data.node.projectsV2.nodes[]? | select(.title==$title) | .id' <<<"$JSON" | head -n1)"
          PROJECT_NUMBER="$(jq -r --arg title "$TEST_TITLE" '.data.node.projectsV2.nodes[]? | select(.title==$title) | .number' <<<"$JSON" | head -n1)"
          test -n "$PROJECT_ID"
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "PROJECT_NUMBER=$PROJECT_NUMBER" >> "$GITHUB_ENV"

      - name: Delete temporary project
        run: |
          set -euo pipefail
          gh api graphql -f query='mutation($project: ID!) {
            deleteProjectV2(input:{projectId:$project}) {
              projectV2 { id }
            }
          }' -F project="$PROJECT_ID" >/dev/null

      - name: Verify temporary project removed
        run: |
          set -euo pipefail
          JSON="$(gh api graphql -f query='query($owner: ID!) {
            node(id: $owner) {
              ... on Organization {
                projectsV2(first: 100) { nodes { id number title } }
              }
            }
          }' -F owner="$PROJECT_OWNER_ID")"

          if jq -e --arg title "$TEST_TITLE" '.data.node.projectsV2.nodes[]? | select(.title==$title)' <<<"$JSON" >/dev/null; then
            echo "ERROR: temporary project still exists"
            exit 1
          fi
          echo "Temporary project removed."
