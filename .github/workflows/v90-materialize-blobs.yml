name: V90 exact tested blob materialization
on:
  push:
    branches: [feat/adaptive-naming-skill-v0.1]
    paths: [.github/workflows/v90-materialize-blobs.yml]
permissions:
  contents: write
jobs:
  source-blobs-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact patch and create unattached blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request,zlib
          assert os.environ['GITHUB_REPOSITORY']=='InteropAtlas/InteropAtlas'
          assert os.environ['GITHUB_REF']=='refs/heads/feat/adaptive-naming-skill-v0.1'
          parts=['.github/maintenance/v90-transport.part'+i for i in ['1','2','3','4','5a','5b','5c']]
          raw=zlib.decompress(base64.b64decode(''.join(pathlib.Path(p).read_text().strip() for p in parts),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='0ab8f63affd1e41aab8cb750fdb4fd3f914dde8b151ca539d9542001aaf320fb'
          spec=json.loads(raw)
          assert spec['base_commit']=='47e60e6fc805d202829f40caea35bdde18e2409e'
          patch=spec['patch'].encode()
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          subprocess.run(['git','apply'],input=patch,check=True)
          results=[]
          for path,sha in spec['file_sha256'].items():
              data=pathlib.Path(path).read_bytes()
              assert hashlib.sha256(data).hexdigest()==sha,path
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              req=urllib.request.Request('https://api.github.com/repos/InteropAtlas/InteropAtlas/git/blobs',method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode())
              with urllib.request.urlopen(req,timeout=60) as response: result=json.load(response)
              assert result['sha']==expected
              results.append({'path':path,'sha':expected,'sha256':sha})
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'v90-blobs';out.mkdir()
          report={'kind':'unattached_blobs_only_no_tree_ref_or_workflow_update','head':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'files':results,'tested_by_run':34687623903,'tests_success_publication_failed_http403':True}
          (out/'blobs.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v90-exact-tested-blobs
          path: ${{ runner.temp }}/v90-blobs/
          retention-days: 30
