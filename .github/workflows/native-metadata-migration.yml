name: Native Metadata Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-metadata-migration.yml'

permissions:
  contents: read
  issues: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
      ORG: InteropAtlas
    steps:
      - name: Migrate labels into organization Issue Fields
        run: |
          set -euo pipefail

          FIELDS="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' "orgs/$ORG/issue-fields")"
          WORK_TYPE_ID="$(jq -r '.[]? | select(.name=="Work Type") | .id' <<<"$FIELDS" | head -n1)"
          WAITING_FOR_ID="$(jq -r '.[]? | select(.name=="Waiting For") | .id' <<<"$FIELDS" | head -n1)"
          test -n "$WORK_TYPE_ID"; test -n "$WAITING_FOR_ID"

          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100"             --jq '.[] | select(.pull_request == null)' > /tmp/issues.jsonl

          migrated=0
          while IFS= read -r ISSUE; do
            [ -n "$ISSUE" ] || continue
            n="$(jq -r '.number' <<<"$ISSUE")"
            labels="$(jq -r '[.labels[].name] | join("|")' <<<"$ISSUE")"

            wt=""
            wf=""
            case "|$labels|" in
              *"|type:knowledge|"*) wt="Knowledge" ;;
              *"|type:perspective|"*) wt="Perspective" ;;
              *"|type:evolution|"*) wt="Evolution" ;;
            esac

            case "|$labels|" in
              *"|waiting:evidence|"*) wf="Evidence" ;;
              *"|waiting:scale|"*) wf="Scale" ;;
              *"|waiting:owner|"*) wf="Owner" ;;
            esac

            payload="$(jq -n               --argjson wt_id "$WORK_TYPE_ID"               --argjson wf_id "$WAITING_FOR_ID"               --arg wt "$wt"               --arg wf "$wf" '
                {issue_field_values:
                  ([{field_id:$wt_id,value:$wt}]
                   + (if $wf != "" then [{field_id:$wf_id,value:$wf}] else [] end))
                }')"

            gh api --method POST               -H 'X-GitHub-Api-Version: 2026-03-10'               "repos/$GITHUB_REPOSITORY/issues/$n/issue-field-values"               --input - <<<"$payload" >/dev/null

            migrated=$((migrated+1))
          done < /tmp/issues.jsonl

          echo "MIGRATED=$migrated"

      - name: Verify all migrated values
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100"             --jq '.[] | select(.pull_request == null)' > /tmp/issues.jsonl

          total=0
          wt_mismatch=0
          wf_mismatch=0
          wf_should_be_empty_mismatch=0

          while IFS= read -r ISSUE; do
            [ -n "$ISSUE" ] || continue
            total=$((total+1))
            n="$(jq -r '.number' <<<"$ISSUE")"
            labels="$(jq -r '[.labels[].name] | join("|")' <<<"$ISSUE")"

            expected_wt=""
            expected_wf=""
            case "|$labels|" in
              *"|type:knowledge|"*) expected_wt="Knowledge" ;;
              *"|type:perspective|"*) expected_wt="Perspective" ;;
              *"|type:evolution|"*) expected_wt="Evolution" ;;
            esac
            case "|$labels|" in
              *"|waiting:evidence|"*) expected_wf="Evidence" ;;
              *"|waiting:scale|"*) expected_wf="Scale" ;;
              *"|waiting:owner|"*) expected_wf="Owner" ;;
            esac

            VALUES="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$GITHUB_REPOSITORY/issues/$n/issue-field-values")"
            actual_wt="$(jq -r '.[]? | select(.issue_field_name=="Work Type") | .single_select_option.name' <<<"$VALUES" | head -n1)"
            actual_wf="$(jq -r '.[]? | select(.issue_field_name=="Waiting For") | .single_select_option.name' <<<"$VALUES" | head -n1)"

            if [ "$actual_wt" != "$expected_wt" ]; then
              wt_mismatch=$((wt_mismatch+1))
              echo "WORK_TYPE_MISMATCH #$n expected=$expected_wt actual=$actual_wt"
            fi

            if [ -n "$expected_wf" ]; then
              if [ "$actual_wf" != "$expected_wf" ]; then
                wf_mismatch=$((wf_mismatch+1))
                echo "WAITING_FOR_MISMATCH #$n expected=$expected_wf actual=$actual_wf"
              fi
            else
              if [ -n "$actual_wf" ]; then
                wf_should_be_empty_mismatch=$((wf_should_be_empty_mismatch+1))
                echo "WAITING_FOR_UNEXPECTED #$n actual=$actual_wf"
              fi
            fi
          done < /tmp/issues.jsonl

          echo "TOTAL=$total"
          echo "WORK_TYPE_MISMATCHES=$wt_mismatch"
          echo "WAITING_FOR_MISMATCHES=$wf_mismatch"
          echo "WAITING_FOR_UNEXPECTED=$wf_should_be_empty_mismatch"

          test "$wt_mismatch" -eq 0
          test "$wf_mismatch" -eq 0
          test "$wf_should_be_empty_mismatch" -eq 0
