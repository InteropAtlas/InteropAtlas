name: Naming v87 bounded delivery
on:
  push:
    branches: [feat/adaptive-naming-skill-v0.1]
    paths: [.github/workflows/controls-v87-delivery.yml]
permissions:
  contents: write
concurrency:
  group: naming-v87-bounded-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install parser
        run: python -m pip install PyYAML==6.0.2
      - name: Verify exact payload, run controls, and write one guarded commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,subprocess,tempfile,urllib.request,urllib.parse
          R='InteropAtlas/InteropAtlas'; B='feat/adaptive-naming-skill-v0.1'
          BASE='fc84a477c805e828ce47666dbb5c3e0470c57324'
          MAIN='0d7eb7e337a16ec1dfa4552f8f5f3cbe61297bfa'
          HEAD=os.environ['GITHUB_SHA']; root=pathlib.Path.cwd()
          T='03_Evolution/01_Research/03_Tests'; P=T+'/naming-evidence-pilot'; S=T+'/organization-naming-411-state.yaml'
          O=pathlib.Path('/tmp/control-v87-delivery'); O.mkdir(exist_ok=True)
          assert os.environ['GITHUB_REPOSITORY']==R and os.environ['GITHUB_REF']=='refs/heads/'+B
          def api(path,method='GET',body=None):
              req=urllib.request.Request('https://api.github.com/repos/'+R+path,method=method,data=None if body is None else json.dumps(body,ensure_ascii=False).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=90) as response:return json.load(response)
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          def sha(data):return hashlib.sha256(data).hexdigest()
          def branch_head():return api('/git/ref/heads/'+urllib.parse.quote(B,safe=''))['object']['sha']
          def run(args,cwd=root,expected=0):
              p=subprocess.run(args,cwd=cwd,capture_output=True,text=True)
              print('COMMAND',args,'EXIT',p.returncode,flush=True)
              print(p.stdout[-12000:]);print(p.stderr[-6000:])
              assert p.returncode==expected
              return p.stdout
          assert branch_head()==HEAD
          assert api('/branches/main')['commit']['sha']==MAIN
          parts=['.github/maintenance/controls-v87.part'+str(i) for i in (1,2,3)]
          staging=set(parts+['.github/workflows/controls-v87-delivery.yml'])
          assert set(git('diff','--name-only',BASE,HEAD).splitlines())==staging
          strings=[pathlib.Path(p).read_text() for p in parts]
          assert len(strings[1])==8262 and strings[1].count('gm6FZnukaNr')==1
          strings[1]=strings[1].replace('gm6FZnukaNr','gm6FZnuKfkaNr')
          assert all(len(s)==8264 for s in strings)
          patch=gzip.decompress(base64.b64decode(''.join(strings),validate=True))
          assert sha(patch)=='49d59626fe7973be9109dadd93b83a04061ad0453ff9afc97538386c0059cdb4'
          patch_file=O/'delivery.patch';patch_file.write_bytes(patch)
          expected_files={P+'/control_gate.py',P+'/test_controls.py',P+'/control-cases.json',P+'/contract.md',S,T+'/organization-naming-411-process-review-v0.1.md'}
          run(['git','apply','--check','--index',str(patch_file)])
          run(['git','apply','--index',str(patch_file)])
          assert set(git('diff','--cached','--name-only').splitlines())==expected_files
          assert sha(pathlib.Path(S).read_bytes())=='aeabc64d7830d33236f5b6a1fd8d2ea29b248adedaa64678d8425e64566e16b1'
          run(['python',P+'/test_controls.py','--repository','.', '--output',str(O/'control-results.json')])
          run(['python',P+'/test_controls.py','--repository','.', '--output',str(O/'repeat-results.json')])
          assert (O/'control-results.json').read_bytes()==(O/'repeat-results.json').read_bytes()
          report=json.loads((O/'control-results.json').read_text())
          assert report['summary']['control_cases_passed']==28 and report['summary']['state_cases_passed']==12 and report['summary']['integration_checks_passed']==14
          assert report['summary']['false_holds_among_valid_cases']==0
          old=pathlib.Path('/tmp/control-v86-baseline')
          run(['git','worktree','add','--detach',str(old),BASE])
          original=O/'original';original.mkdir(exist_ok=True)
          run(['python',str(old/P/'test_evidence.py')],cwd=original)
          run(['python',str(old/P/'test_reconciliation.py'),'--repository',str(old),'--output',str(O/'historical-reconciliation.json')])
          historical=json.loads((O/'historical-reconciliation.json').read_text())
          assert historical['reconciliation_validation']['passed']==26 and not historical['capture_complete'] and len(historical['gaps'])==10
          result=run(['python',str(root/P/'validate_evidence.py'),str(root/P/'rnd130-reconstruction.json')],expected=2)
          (O/'historical-capture.json').write_text(result)
          result=run(['python',P+'/control_gate.py','state',S,'--previous',str(old/S),'--repository','.'])
          (O/'actual-state-check.json').write_text(result)
          check=json.loads(result);assert check['write_allowed'] and not check['generation_ready']
          run(['git','diff','--cached','--check'])
          run(['python','-m','py_compile',P+'/control_gate.py',P+'/test_controls.py'])
          report_path=P+'/control-results.json';pathlib.Path(report_path).write_bytes((O/'control-results.json').read_bytes())
          git('add',report_path);git('rm',*parts)
          changed=set(git('diff','--cached','--name-only').splitlines())
          assert changed==expected_files|{report_path}|set(parts)
          entries=[{'path':f,'mode':'100644','type':'blob','content':pathlib.Path(f).read_text()} for f in sorted(expected_files|{report_path})]
          entries += [{'path':f,'mode':'100644','type':'blob','sha':None} for f in parts]
          assert branch_head()==HEAD and api('/branches/main')['commit']['sha']==MAIN
          tree=api('/git/trees','POST',{'base_tree':git('rev-parse',HEAD+'^{tree}'),'tree':entries})['sha']
          commit=api('/git/commits','POST',{'message':'fix(#411): deliver v87 task-local preflight and verified control cases\n\nExecutor: OpenAI / ChatGPT / GPT-6 Astra Pro. Same-author deterministic checks, no independent semantic review. No new names, stable Skill promotion, or main mutation.','tree':tree,'parents':[HEAD]})['sha']
          assert branch_head()==HEAD
          api('/git/refs/heads/'+urllib.parse.quote(B,safe=''),'PATCH',{'sha':commit,'force':False})
          assert branch_head()==commit and api('/branches/main')['commit']['sha']==MAIN
          receipt={'repository':R,'baseline':BASE,'delivery_parent':HEAD,'delivery_commit':commit,'run_id':os.environ['GITHUB_RUN_ID'],'main_unchanged':MAIN,'patch_sha256':sha(patch),'control_report_sha256':sha((O/'control-results.json').read_bytes()),'control_summary':report['summary'],'historical_checks':26,'historical_capture_complete':False,'repeat_byte_identical':True,'changed_files':sorted(changed),'payload_parts_removed':True,'no_generation':True,'stable_skill_changed':False,'remaining':'Install read-only permanent CI and remove this one-shot workflow through the authorized connector.'}
          (O/'delivery-result.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(receipt,ensure_ascii=False,indent=2))
          pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('# v87 bounded delivery\n\n'+json.dumps(receipt,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: naming-v87-delivery-evidence
          path: /tmp/control-v87-delivery/
          retention-days: 30
          if-no-files-found: error
