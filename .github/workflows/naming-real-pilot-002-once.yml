# One-shot trigger for preregistered REAL-408-002; delete after evidence preservation.
name: REAL-408-002 lossless-format real CPU pilot
on:
  push:
    branches: [feat/adaptive-naming-skill-v0.1]
    paths: [.github/workflows/naming-real-pilot-002-once.yml]
permissions:
  contents: write
concurrency:
  group: real-408-002
  cancel-in-progress: false
jobs:
  real-model:
    if: github.repository == 'InteropAtlas/InteropAtlas' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      P: 03_Evolution/01_Research/03_Tests/naming-evidence-pilot/model-aware
      LLAMA_REV: 56381e407c0ccfb3a6f71e668a27a901001d22ce
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify bounded adapter and unchanged naming core
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/real408002-evidence"
          git diff --exit-code ff8e422bf52f614403926a1547f835903f35dae1 -- "$P/workflow.py" "$P/protocol.py" "$P/local_runner.py" "$P/experiment.json" "$P/development-tasks.json"
          python "$P/test_format_adapter.py" --output "$RUNNER_TEMP/real408002-evidence/format-tests.json"
          python "$P/test_workflow.py" --output "$RUNNER_TEMP/real408002-evidence/workflow-tests.json"
          python "$P/test_local_runner.py" --output "$RUNNER_TEMP/real408002-evidence/transport-tests.json"
          python "$P/test_protocol.py" --output "$RUNNER_TEMP/real408002-evidence/protocol-tests.json"
      - name: Compile pinned CPU runtime and verify exact weights
        id: setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/real408002-runtime"
          curl --fail --location --max-time 120 "https://codeload.github.com/ggml-org/llama.cpp/tar.gz/$LLAMA_REV" -o "$RUNNER_TEMP/real408002-runtime/llama.tar.gz"
          tar -xzf "$RUNNER_TEMP/real408002-runtime/llama.tar.gz" -C "$RUNNER_TEMP/real408002-runtime"
          S="$RUNNER_TEMP/real408002-runtime/llama.cpp-$LLAMA_REV"
          cmake -S "$S" -B "$S/build" -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build "$S/build" --target llama-server -j 4
          python "$P/real-pilot-002/run.py" setup --output "$RUNNER_TEMP/real408002-evidence/model" --runtime "$RUNNER_TEMP/real408002-runtime"
      - name: Execute frozen four-cell comparison
        id: pilot
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/real408002-evidence/model"
          BIN="$RUNNER_TEMP/real408002-runtime/llama.cpp-$LLAMA_REV/build/bin/llama-server"
          "$BIN" --version > "$OUT/runtime-version.txt" 2>&1
          "$BIN" -m "$RUNNER_TEMP/real408002-runtime/model.gguf" --host 127.0.0.1 --port 8081 -c 8192 -t 4 -tb 4 -np 1 -b 512 -ub 128 --alias REAL-408-002-Qwen4B > "$RUNNER_TEMP/real408002-server.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          python - <<'PY'
          import urllib.request,time,pathlib,os
          for _ in range(90):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8081/health',timeout=2) as response:
                      if response.status==200: break
              except Exception: time.sleep(1)
          else: raise RuntimeError('real_model_server_not_ready')
          with urllib.request.urlopen('http://127.0.0.1:8081/props',timeout=5) as response:
              (pathlib.Path(os.environ['RUNNER_TEMP'])/'real408002-evidence/model/server-props.json').write_bytes(response.read())
          PY
          python -u "$P/real-pilot-002/run.py" execute --output "$OUT"
      - name: Persist complete bounded evidence including failures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          PILOT_OUTCOME: ${{ steps.pilot.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,pathlib,hashlib,urllib.request
          repo='InteropAtlas/InteropAtlas';branch='feat/adaptive-naming-skill-v0.1';base='https://api.github.com/repos/'+repo
          def api(path,method='GET',body=None):
              req=urllib.request.Request(base+path,method=method,data=json.dumps(body,ensure_ascii=False).encode() if body is not None else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as response:return json.load(response)
          expected=os.environ['GITHUB_SHA'];assert api('/git/ref/heads/'+branch)['object']['sha']==expected,'Concurrent branch change; preserve runner logs only, do not overwrite'
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'real408002-evidence';files={};total=0
          for path in sorted(root.rglob('*')) if root.exists() else []:
              if not path.is_file() or path.name=='model.gguf':continue
              raw=path.read_bytes();total+=len(raw);assert total<10_000_000,'Evidence exceeds publication cap'
              files[str(path.relative_to(root))]={'sha256':hashlib.sha256(raw).hexdigest(),'content':raw.decode('utf-8')}
          outcome={'run_id':os.environ['GITHUB_RUN_ID'],'source_commit':expected,'setup':os.environ['SETUP_OUTCOME'],'pilot':os.environ['PILOT_OUTCOME'],
                   'model_calls_are_real_not_mock':True,'user_machine_tested':False,'paid_inference_api_calls':0,
                   'old_REAL_408_001_rescored':False,'normalization_is_shared_and_representation_only':True,'files':files}
          home=os.environ['P']+'/real-pilot-002/results/'
          entries=[{'path':home+'evidence.json','mode':'100644','type':'blob','content':json.dumps(outcome,ensure_ascii=False,indent=2)+'\n'}]
          for name in ('summary.json','identity.json','preregistered-plan.json','completed.json'):
              path=root/'model'/name
              if path.exists():entries.append({'path':home+name,'mode':'100644','type':'blob','content':path.read_text()})
          for name in ('format-tests.json','workflow-tests.json','transport-tests.json','protocol-tests.json'):
              path=root/name
              if path.exists():entries.append({'path':home+name,'mode':'100644','type':'blob','content':path.read_text()})
          tree=api('/git/trees','POST',{'base_tree':api('/git/commits/'+expected)['tree']['sha'],'tree':entries})['sha']
          commit=api('/git/commits','POST',{'message':'evidence(#408): preserve REAL-408-002 lossless-format real-model rerun\n\nNew calls only; REAL-408-001 remains unchanged. No answer repair, adoption, user-machine validation or method promotion.','tree':tree,'parents':[expected]})['sha']
          assert api('/git/ref/heads/'+branch)['object']['sha']==expected,'Concurrent branch change'
          api('/git/refs/heads/'+branch,'PATCH',{'sha':commit,'force':False})
          print(json.dumps({'evidence_commit':commit,'run_id':os.environ['GITHUB_RUN_ID'],'files':len(files),'bytes':total,'setup':os.environ['SETUP_OUTCOME'],'pilot':os.environ['PILOT_OUTCOME']}))
          PY
