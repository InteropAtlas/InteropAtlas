name: Project Board View Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/project-current-view-update.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
      PROJECT_OWNER_ID: O_kgDOEzyTWQ
      PROJECT_TITLE: InteropAtlas — Issue Portfolio

    steps:
      - name: Find board view
        run: |
          set -euo pipefail
          JSON="$(gh api graphql -f query='query($owner: ID!) {
            node(id: $owner) {
              ... on Organization {
                projectsV2(first: 100) {
                  nodes {
                    id
                    title
                    views(first: 100) {
                      nodes { id name filter layout }
                    }
                  }
                }
              }
            }
          }' -F owner="$PROJECT_OWNER_ID")"

          VIEW_ID="$(jq -r --arg title "$PROJECT_TITLE" '.data.node.projectsV2.nodes[]? | select(.title==$title) | .views.nodes[]? | select(.name=="View 10") | .id' <<<"$JSON" | head -n1)"
          test -n "$VIEW_ID"
          echo "VIEW_ID=$VIEW_ID" >> "$GITHUB_ENV"

      - name: Hide closed issues from attention board
        run: |
          set -euo pipefail
          gh api graphql -f query='mutation($view: ID!, $filter: String!) {
            updateProjectV2View(input: {viewId: $view, filter: $filter}) {
              projectV2View { id name filter }
            }
          }' -F view="$VIEW_ID" -f filter='is:issue is:open'           --jq '.data.updateProjectV2View.projectV2View'

      - name: Verify board filter
        run: |
          set -euo pipefail
          gh api graphql -f query='query($view: ID!) {
            node(id: $view) {
              ... on ProjectV2View { id name filter }
            }
          }' -F view="$VIEW_ID" --jq '.data.node'
