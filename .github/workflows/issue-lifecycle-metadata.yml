name: Issue Metadata Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue-lifecycle-metadata.yml'

permissions:
  issues: write
  contents: read

jobs:
  ensure-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure current IA issue metadata labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ensure_label() { gh label create "$1" --repo "$REPO" --color "$2" --description "$3" --force; }

          ensure_label 'attention:focus' 'B60205' 'Currently in project focus'
          ensure_label 'attention:inbox' 'D4C5F9' 'Open task retained outside current focus'

          ensure_label 'type:knowledge' '0E8A16' 'Knowledge accumulation / 01_State'
          ensure_label 'type:perspective' 'FBCA04' 'Knowledge perspectives and access / 02_Runtime'
          ensure_label 'type:evolution' '5319E7' 'System operations and self-evolution / 03_Evolution'

          ensure_label 'waiting:prerequisite' 'F9D0C4' 'Waiting on prerequisite work'
          ensure_label 'waiting:evidence' 'F9D0C4' 'Waiting on evidence or validation'
          ensure_label 'waiting:scale' 'F9D0C4' 'Waiting until scale/usage justifies work'
          ensure_label 'waiting:owner' 'F9D0C4' 'Waiting on owner decision or authorization'

          echo "Current model: Attention + Type + optional Waiting."
          echo "Legacy Lifecycle / Area / Priority labels are not deleted by this bootstrap."
