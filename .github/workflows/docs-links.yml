name: Validate Markdown Links

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/docs-links.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/workflows/docs-links.yml'
  workflow_dispatch:

jobs:
  local-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check repository-local Markdown links
        shell: python
        run: |
          import re
          import sys
          from pathlib import Path
          from urllib.parse import unquote

          root = Path('.').resolve()
          pattern = re.compile(r'(?<!!)\[[^\]]*\]\(([^)]+)\)')
          failures = []

          for source in sorted(root.rglob('*.md')):
              text = source.read_text(encoding='utf-8')
              for match in pattern.finditer(text):
                  raw = match.group(1).strip()
                  if not raw or raw.startswith(('#', 'http://', 'https://', 'mailto:')):
                      continue
                  target_text = raw.split('#', 1)[0].split('?', 1)[0].strip()
                  if not target_text:
                      continue
                  target_text = unquote(target_text)
                  target = (root / target_text.lstrip('/')) if target_text.startswith('/') else (source.parent / target_text)
                  if not target.exists():
                      failures.append((source.relative_to(root), raw, target.resolve()))

          if failures:
              print('Broken repository-local Markdown links:')
              for source, raw, target in failures:
                  print(f'- {source}: {raw} -> {target}')
              sys.exit(1)

          print('All repository-local Markdown links resolve.')

      - name: Check current docs do not use pre-migration locations
        shell: python
        run: |
          import re
          import sys
          from pathlib import Path

          moved = {
              # Research
              'foundation-work-package-a-completion-audit-2026-09-01.zh-CN.md': '../03_Evolution/01_Research/',
              'foundation-work-package-a-reference-intake-audit-2026-09-01.zh-CN.md': '../03_Evolution/01_Research/',
              'human-ai-open-collaboration-prior-art.zh-CN.md': '../03_Evolution/01_Research/',
              'human-interface-conformance-audit-2026-09-01.zh-CN.md': '../03_Evolution/01_Research/',
              'human-interface-reference-intake-audit-2026-09-01.zh-CN.md': '../03_Evolution/01_Research/',
              'human-interface-reference-map.zh-CN.md': '../03_Evolution/01_Research/',
              'human-interface-standards-baseline.zh-CN.md': '../03_Evolution/01_Research/',
              'prior-art-and-method-reference.zh-CN.md': '../03_Evolution/01_Research/',
              'repository-structure-prior-art-and-options-v0.1.zh-CN.md': '../03_Evolution/01_Research/',
              'route-alignment-audit-2026-09-01.zh-CN.md': '../03_Evolution/01_Research/',
              'work-package-a-reference-intake-audit-2026-09-01.zh-CN.md': '../03_Evolution/01_Research/',
              'work-package-a-verification-2026-09-01.zh-CN.md': '../03_Evolution/01_Research/',
              'work-package-b-pilot-audit-2026-09-01.zh-CN.md': '../03_Evolution/01_Research/',
              # Experiments
              'automated-build-deployment-open-alternative.zh-CN.md': '../03_Evolution/02_Experiments/',
              'engine-v0.1-bootstrap.zh-CN.md': '../03_Evolution/02_Experiments/',
              'engine-v0.1-coverage-baseline.zh-CN.md': '../03_Evolution/02_Experiments/',
              'human-ai-collaboration-v0-checklist.zh-CN.md': '../03_Evolution/02_Experiments/',
              'json-ld-fit-experiment.zh-CN.md': '../03_Evolution/02_Experiments/',
              'seed-experiment-01.zh-CN.md': '../03_Evolution/02_Experiments/',
              # Change
              'foundation-first-phase-v0.1.zh-CN.md': '../03_Evolution/03_Change/',
              'human-readable-route.zh-CN.md': '../03_Evolution/03_Change/',
              'machine-readable-maintainable-route.zh-CN.md': '../03_Evolution/03_Change/',
              'object-page-shell-v0.1-plan.zh-CN.md': '../03_Evolution/03_Change/',
              'open-collaboration-route-v0-notes.zh-CN.md': '../03_Evolution/03_Change/',
              'project-generated-methods-standards.zh-CN.md': '../03_Evolution/03_Change/',
              'repository-current-to-target-mapping-v0.1.zh-CN.md': '../03_Evolution/03_Change/',
              'repository-data-root-contract-v0.1.zh-CN.md': '../03_Evolution/03_Change/',
              'roadmap.zh-CN.md': '../03_Evolution/03_Change/',
              'visualization-direction.zh-CN.md': '../03_Evolution/03_Change/',
              'work-item-reference-seeding-v0.1.zh-CN.md': '../03_Evolution/03_Change/',
          }

          failures = []
          for source in sorted(Path('docs').rglob('*.md')):
              for number, line in enumerate(source.read_text(encoding='utf-8').splitlines(), 1):
                  for basename, expected_prefix in moved.items():
                      token = re.compile(r'(?<![A-Za-z0-9_.-])' + re.escape(basename) + r'(?![A-Za-z0-9_.-])')
                      if not token.search(line):
                          continue
                      expected = expected_prefix + basename
                      if expected not in line:
                          failures.append((source, number, basename, expected, line.strip()))

          if failures:
              print('Current docs still contain references that look like pre-migration locations:')
              for source, number, basename, expected, line in failures:
                  print(f'- {source}:{number}: {basename}')
                  print(f'  expected path: {expected}')
                  print(f'  line: {line}')
              sys.exit(1)

          print('Current docs reference migrated Evolution artifacts through their new paths.')
