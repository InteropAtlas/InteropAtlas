name: Project View Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/project-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
      PROJECT_OWNER_ID: O_kgDOEzyTWQ
      PROJECT_TITLE: InteropAtlas — Issue Portfolio

    steps:
      - name: Inspect saved views
        run: |
          set -euo pipefail
          gh api graphql -f query='query($owner: ID!) {
            node(id: $owner) {
              ... on Organization {
                projectsV2(first: 100) {
                  nodes {
                    title
                    views(first: 100) {
                      nodes {
                        id
                        name
                        filter
                        layout
                      }
                    }
                  }
                }
              }
            }
          }' -F owner="$PROJECT_OWNER_ID"           --jq '.data.node.projectsV2.nodes[] | select(.title=="InteropAtlas — Issue Portfolio") | .views.nodes[] | {id,name,filter,layout}'
