name: Project Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/project-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
      PROJECT_OWNER_ID: O_kgDOEzyTWQ

    steps:
      - name: Verify project list membership for target
        run: |
          set -euo pipefail
          PROJECTS="$(gh api graphql -f query='query($owner: ID!) {
            node(id: $owner) {
              ... on Organization {
                projectsV2(first: 100) { nodes { id number title } }
              }
            }
          }' -F owner="$PROJECT_OWNER_ID")"
          PROJECT_ID="$(jq -r '.data.node.projectsV2.nodes[] | select(.title=="InteropAtlas — Issue Portfolio") | .id' <<<"$PROJECTS" | head -n1)"
          test -n "$PROJECT_ID"

          CURSOR=""
          TOTAL=0
          FOUND="false"
          while :; do
            if [ -z "$CURSOR" ]; then
              PAGE="$(gh api graphql -f query='query($project: ID!) {
                node(id: $project) {
                  ... on ProjectV2 {
                    items(first: 100) {
                      totalCount
                      pageInfo { hasNextPage endCursor }
                      nodes { id content { ... on Issue { number title state } } }
                    }
                  }
                }
              }' -F project="$PROJECT_ID")"
            else
              PAGE="$(gh api graphql -f query='query($project: ID!, $after: String!) {
                node(id: $project) {
                  ... on ProjectV2 {
                    items(first: 100, after: $after) {
                      totalCount
                      pageInfo { hasNextPage endCursor }
                      nodes { id content { ... on Issue { number title state } } }
                    }
                  }
                }
              }' -F project="$PROJECT_ID" -f after="$CURSOR")"
            fi
            TOTAL="$(jq -r '.data.node.items.totalCount' <<<"$PAGE")"
            if jq -e '.data.node.items.nodes[]? | select(.content.number==435)' <<<"$PAGE" >/dev/null; then
              FOUND="true"
              jq -c '.data.node.items.nodes[] | select(.content.number==435)' <<<"$PAGE"
            fi
            HAS="$(jq -r '.data.node.items.pageInfo.hasNextPage' <<<"$PAGE")"
            [ "$HAS" = "true" ] || break
            CURSOR="$(jq -r '.data.node.items.pageInfo.endCursor' <<<"$PAGE")"
          done
          echo "TOTAL=$TOTAL FOUND=$FOUND"
          test "$FOUND" = "true"
