name: Project Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/project-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
      ITEM_ID: PVTI_lADOEzyTWc4BkX__zg8UiGs

    steps:
      - name: Inspect target item and fields
        run: |
          set -euo pipefail
          gh api graphql -f query='query($item: ID!) {
            node(id: $item) {
              ... on ProjectV2Item {
                id
                isArchived
                content {
                  ... on Issue {
                    number
                    title
                    state
                    labels(first:20){nodes{name}}
                  }
                }
                fieldValues(first: 50) {
                  nodes {
                    ... on ProjectV2ItemFieldSingleSelectValue {
                      name
                      field { ... on ProjectV2SingleSelectField { name } }
                    }
                    ... on ProjectV2ItemFieldTextValue {
                      text
                      field { ... on ProjectV2Field { name } }
                    }
                  }
                }
              }
            }
          }' -F item="$ITEM_ID"
