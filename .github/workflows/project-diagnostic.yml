name: Project REST Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/project-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
    steps:
      - name: Inspect target via REST list
        run: |
          set -euo pipefail
          gh api             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2026-03-10"             "/orgs/InteropAtlas/projectsV2/2/items?per_page=100&q=435"
