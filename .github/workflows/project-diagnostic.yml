name: Project Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/project-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
      PROJECT_OWNER_ID: O_kgDOEzyTWQ
    steps:
      - name: Diagnose Issue Portfolio membership
        run: |
          set -euo pipefail

          PROJECTS="$(gh api graphql -f query='query($owner: ID!) {
            node(id: $owner) {
              ... on Organization {
                projectsV2(first: 100) { nodes { id number title } }
              }
            }
          }' -F owner="$PROJECT_OWNER_ID")"

          jq -c '.data.node.projectsV2.nodes[] | select(.title=="InteropAtlas — Issue Portfolio")' <<<"$PROJECTS" |
          while read -r P; do
            PID="$(jq -r '.id' <<<"$P")"
            PNUM="$(jq -r '.number' <<<"$P")"
            echo "PROJECT number=$PNUM id=$PID"

            CURSOR=""
            FOUND="false"
            TOTAL=0
            while :; do
              if [ -z "$CURSOR" ]; then
                PAGE="$(gh api graphql -f query='query($project: ID!) {
                  node(id: $project) {
                    ... on ProjectV2 {
                      items(first: 100) {
                        pageInfo { hasNextPage endCursor }
                        nodes {
                          id
                          content { ... on Issue { number title state labels(first:20){nodes{name}} } }
                        }
                      }
                    }
                  }
                }' -F project="$PID")"
              else
                PAGE="$(gh api graphql -f query='query($project: ID!, $after: String!) {
                  node(id: $project) {
                    ... on ProjectV2 {
                      items(first: 100, after: $after) {
                        pageInfo { hasNextPage endCursor }
                        nodes {
                          id
                          content { ... on Issue { number title state labels(first:20){nodes{name}} } }
                        }
                      }
                    }
                  }
                }' -F project="$PID" -f after="$CURSOR")"
              fi

              COUNT="$(jq '.data.node.items.nodes|length' <<<"$PAGE")"
              TOTAL=$((TOTAL+COUNT))
              if jq -e '.data.node.items.nodes[]? | select(.content.number==435)' <<<"$PAGE" >/dev/null; then
                FOUND="true"
                jq -c '.data.node.items.nodes[] | select(.content.number==435) | {item_id:.id,number:.content.number,title:.content.title,state:.content.state,labels:[.content.labels.nodes[].name]}' <<<"$PAGE"
              fi

              HAS="$(jq -r '.data.node.items.pageInfo.hasNextPage' <<<"$PAGE")"
              [ "$HAS" = "true" ] || break
              CURSOR="$(jq -r '.data.node.items.pageInfo.endCursor' <<<"$PAGE")"
            done
            echo "TOTAL=$TOTAL CONTAINS_435=$FOUND"
          done
