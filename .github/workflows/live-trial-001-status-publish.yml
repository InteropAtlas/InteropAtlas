name: LIVE-411-001 bounded status publication
on:
  push:
    branches: [feat/adaptive-naming-skill-v0.1]
    paths: [.github/workflows/live-trial-001-status-publish.yml]
permissions:
  contents: write
concurrency:
  group: naming-live-trial-001-status
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python -m pip install PyYAML==6.0.2
      - name: Validate exact state transition and publish only state plus self-removal
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trial-status-receipt"
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys
          ROOT=pathlib.Path.cwd()
          REPO='InteropAtlas/InteropAtlas';BRANCH='feat/adaptive-naming-skill-v0.1'
          STATE='03_Evolution/01_Research/03_Tests/organization-naming-411-state.yaml'
          PILOT='03_Evolution/01_Research/03_Tests/naming-evidence-pilot'
          SELF='.github/workflows/live-trial-001-status-publish.yml'
          OUT=pathlib.Path(os.environ['RUNNER_TEMP'])/'trial-status-receipt'
          assert os.environ['GITHUB_REPOSITORY']==REPO and os.environ['GITHUB_REF']=='refs/heads/'+BRANCH
          def api(path,method='GET',body=None):
              cmd=['gh','api','repos/'+REPO+path,'--method',method]
              if body is not None:cmd+=['--input','-']
              raw=subprocess.check_output(cmd,input=json.dumps(body,ensure_ascii=False).encode() if body is not None else None)
              return json.loads(raw) if raw else {}
          head=api('/git/ref/heads/'+BRANCH)['object']['sha'];assert head==os.environ['GITHUB_SHA']
          main_before=api('/git/ref/heads/main')['object']['sha']
          old=(ROOT/STATE).read_bytes()
          assert hashlib.sha256(old).hexdigest()=='aeabc64d7830d33236f5b6a1fd8d2ea29b248adedaa64678d8425e64566e16b1'
          s=old.decode();assert s.count('snapshot_version: 87')==1
          s=s.replace('snapshot_version: 87','snapshot_version: 88',1)
          a=s.index('next_action:\n');b=s.index('\nstop:\n',a)
          s=s[:a]+'''next_action:
            action: resolve_trial_evidence_and_prepare_next_bounded_probe_under_existing_authority
            rationale: >-
              LIVE-411-001已实际完成生成8项、质量优先4项及现实初筛，0项达到展示条件；不把试行未出finalist当作整个命名任务完成。
              内部证据补查、复核和下一次有预算探测的技术准备沿用连续执行授权，不再要求Owner逐项发送继续。
              优先处理实际证据阻塞或调整下批材料，不回退为重复工程整修；付款、注册、最终采用和稳定晋升仍不在授权内。
            requires_owner: false_for_internal_work_final_adoption_and_spending_reserved
          '''+s[b:]
          s=s.replace('live_trial_plan:\n  status: prepared_not_started\n  permission: generation_remains_paused','''live_trial_plan:
            status: first_bounded_trial_executed_not_ready_for_exposure
            permission: scoped_trial_authority_recorded_general_pause_not_globally_removed
            authority_ref: https://github.com/InteropAtlas/InteropAtlas/issues/411#issuecomment-5643216469
            result_entry: naming-evidence-pilot/live-trial-001/result.md''',1)
          s+='''
          # v88：当次真实试行与历史审计层分开；此处不改写v87阶段的历史结论。
          live_validation:
            id: LIVE-411-001
            status: bounded_trial_complete_no_exposure_ready_candidate
            baseline_commit: 64d7896254c9a320c3632f55d41b5bb879f96cb8
            authority_ref: https://github.com/InteropAtlas/InteropAtlas/issues/411#issuecomment-5643216469
            authority_interpretation: 相邻对话要求连续执行，解析为本次有限真实试行；不是伪造Owner逐字解除全部暂停。
            artifacts_home: naming-evidence-pilot/live-trial-001/
            result: naming-evidence-pilot/live-trial-001/result.md
            verification: naming-evidence-pilot/live-trial-001/validation.json
            reproducible_record_builder: naming-evidence-pilot/live-trial-001/check_trial.py
            actual_generation_executed: true
            generated: 8
            intrinsic_prioritized: 4
            display_eligible: 0
            owner_candidate_review_invitation_count: 0
            runtime_isolation: best_effort_same_context
            independent_semantic_review: not_performed
            budget_extended_or_extra_names_generated: false
            active_historical_candidate_list_changed: false
            current_trial_candidate_registry: naming-evidence-pilot/live-trial-001/generated.json
            current_trial_dispositions: naming-evidence-pilot/live-trial-001/screening.json
            real_evidence_capture: 冻结计划、原始名称输出、先于查询的质量判断、实际搜索/注册商观察、完整阶段去留；网页只保留必要片段，非完整供应商日志。
            timing_limit: 初次查询仅保留日期与顺序；重查有执行者时钟起止区间，不回填供应商精确响应时刻。
            gate_disposition: review
            gate_errors: []
            remaining_gate_review: [screen_result_unresolved]
            capture_complete: false
            capture_limit: 校验器因现实筛查未解决而保持false；不等于缺失本次原始生成，也不等于过去缺口已填补。
            verification_run: 34671475110
            verification_head: 6c565caca7fe6e8f4f201878e1190938094996a0
            verification_artifact: 10290443155
            verification_artifact_sha256: 1213896f1c5d0415094041e99df730f70bbda7eb409ca5d9532d87341a4dc082
            repeat_record_and_checks_byte_identical: true
            counterfactual_checks: 已知撞名强行展示被block；未知结果伪改available仍review。仅反例拷贝，没有真实错误展示。
            overall_naming_task_complete: false
            stable_method_promoted: false
            purchase_registration_or_final_adoption_performed: false
            inherited_pause_scope: process_review/audit_recovery旧暂停字段用于一般无限生成与历史恢复就绪；本次有独立限定授权，不声称程序自动批准生成。
            remaining_substantive_barriers:
              - 一个名称的.com不可直接注册，未获得实际取得路径；索引未命中不是身份或商标许可。
              - 另有同名主体/产品及第三方商标申请线索，需要官方身份或商标证据，而不是让Owner凭猜测裁定。
              - 没有独立语义复核；单次未展示批次不能证明命名质量改善或用户判断成本下降。
          '''
          assert hashlib.sha256(s.encode()).hexdigest()=='3d2272f7c56fd8704521ce6359289a1f571ebddf7144ea7860bbfeaa30ff2bc8'
          sys.path.insert(0,str(ROOT/PILOT))
          from control_gate import guarded_write
          report=guarded_write(ROOT/STATE,old,s.encode(),ROOT);assert report['written']
          (OUT/'state-write.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          subprocess.check_call(['python',PILOT+'/live-trial-001/check_trial.py','--repository','.', '--output',str(OUT/'live-trial-001')])
          subprocess.check_call(['git','diff','--check'])
          assert api('/git/ref/heads/'+BRANCH)['object']['sha']==head
          parent=api('/git/commits/'+head)
          tree=api('/git/trees','POST',{'base_tree':parent['tree']['sha'],'tree':[{'path':STATE,'mode':'100644','type':'blob','content':s},{'path':SELF,'mode':'100644','type':'blob','sha':None}]})['sha']
          commit=api('/git/commits','POST',{'message':'docs(#411): publish v88 actual trial outcome; remove one-shot delivery workflow','tree':tree,'parents':[head]})['sha']
          assert api('/git/ref/heads/'+BRANCH)['object']['sha']==head
          api('/git/refs/heads/'+BRANCH,'PATCH',{'sha':commit,'force':False})
          assert api('/git/ref/heads/'+BRANCH)['object']['sha']==commit
          assert api('/git/ref/heads/main')['object']['sha']==main_before
          receipt={'commit':commit,'previous_head':head,'snapshot':88,'state_sha256':hashlib.sha256(s.encode()).hexdigest(),'main_unchanged':True,'one_shot_workflow_removed_in_same_tree':True,'trial_check_repeated':True,'scope':'only state file and one-shot workflow removal; no method promotion or new generation'}
          (OUT/'publication.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: live-trial-001-status-receipt
          path: ${{ runner.temp }}/trial-status-receipt/
          retention-days: 30
          if-no-files-found: error
