name: Retire Legacy Blocked By Headers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-legacy-blocked-by.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Rewrite legacy Blocked By headers as Waiting Condition
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" > /tmp/pages.json

          python - <<'PY'
          import json, os, re, subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          pages = json.load(open("/tmp/pages.json"))
          issues = [x for page in pages for x in page if "pull_request" not in x]
          changed = 0
          removed_empty = 0
          renamed = 0

          for issue in issues:
              number = issue["number"]
              body = issue.get("body") or ""
              lines = body.splitlines()
              out = []
              touched = False

              for line in lines:
                  m = re.match(r"^Blocked By:\s*(.*)$", line)
                  if not m:
                      out.append(line)
                      continue

                  value = m.group(1).strip()
                  touched = True
                  if value in {"", "—", "-"}:
                      removed_empty += 1
                      continue

                  out.append(f"Waiting Condition: {value}")
                  renamed += 1

              if not touched:
                  continue

              new_body = "\n".join(out)
              if body.endswith("\n"):
                  new_body += "\n"

              payload = json.dumps({"body": new_body}, ensure_ascii=False).encode()
              subprocess.run(
                  ["gh","api","--method","PATCH",f"repos/{repo}/issues/{number}","--input","-"],
                  input=payload, check=True, stdout=subprocess.DEVNULL
              )
              print(f"UPDATED #{number}")
              changed += 1

          print(f"SUMMARY open_issues={len(issues)} changed={changed} renamed={renamed} removed_empty={removed_empty}")
          PY
