name: Issue Hygiene Check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      issue_number:
        description: '只检查指定 Issue（留空则全量检查）'
        required: false
        type: number

permissions:
  issues: read
  contents: read

jobs:
  hygiene-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Issue Hygiene Checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_ISSUE: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          echo "## Issue Hygiene Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$TARGET_ISSUE" ]; then
            ISSUES=$(gh issue view "$TARGET_ISSUE" --repo "$REPO" --json number,title,labels,body,updatedAt,state --jq '[.]')
          else
            ISSUES=$(gh issue list --repo "$REPO" --state open --limit 500 --json number,title,labels,body,updatedAt)
          fi

          TOTAL=$(echo "$ISSUES" | jq 'length')
          echo "**Total open issues checked: $TOTAL**" >> "$GITHUB_STEP_SUMMARY"
          VIOLATIONS=0

          echo "### 1. Missing Lifecycle" >> "$GITHUB_STEP_SUMMARY"
          MISSING=$(echo "$ISSUES" | jq '[.[] | select([.labels[].name | select(startswith("lifecycle:"))] | length == 0)] | length')
          echo "Found: $MISSING" >> "$GITHUB_STEP_SUMMARY"
          echo "$ISSUES" | jq -r '.[] | select([.labels[].name | select(startswith("lifecycle:"))] | length == 0) | "- #\(.number) \(.title)"' >> "$GITHUB_STEP_SUMMARY"
          VIOLATIONS=$((VIOLATIONS + MISSING))
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### 2. Conflicting Lifecycle labels" >> "$GITHUB_STEP_SUMMARY"
          CONFLICT=$(echo "$ISSUES" | jq '[.[] | select([.labels[].name | select(startswith("lifecycle:"))] | length > 1)] | length')
          echo "Found: $CONFLICT" >> "$GITHUB_STEP_SUMMARY"
          echo "$ISSUES" | jq -r '.[] | select([.labels[].name | select(startswith("lifecycle:"))] | length > 1) | "- #\(.number) \(.title)"' >> "$GITHUB_STEP_SUMMARY"
          VIOLATIONS=$((VIOLATIONS + CONFLICT))
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### 3. Active > 14 days without update" >> "$GITHUB_STEP_SUMMARY"
          STALE_ACTIVE=$(echo "$ISSUES" | jq --arg cutoff "$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)" '[.[] | select(.labels | map(.name) | any(. == "lifecycle:active")) | select(.updatedAt < $cutoff)] | length')
          echo "Found: $STALE_ACTIVE" >> "$GITHUB_STEP_SUMMARY"
          echo "$ISSUES" | jq -r --arg cutoff "$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)" '.[] | select(.labels | map(.name) | any(. == "lifecycle:active")) | select(.updatedAt < $cutoff) | "- #\(.number) \(.title) (\(.updatedAt))"' >> "$GITHUB_STEP_SUMMARY"
          VIOLATIONS=$((VIOLATIONS + STALE_ACTIVE))
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### 4. Blocked metadata without explicit reason" >> "$GITHUB_STEP_SUMMARY"
          BLOCKED_NO_REASON=$(echo "$ISSUES" | jq '[.[] | select((.body // "") | test("Status:\\s*Blocked"; "i")) | select((.body // "") | test("Blocked By:\\s*(—|-|$)"; "i"))] | length')
          echo "Found: $BLOCKED_NO_REASON" >> "$GITHUB_STEP_SUMMARY"
          echo "$ISSUES" | jq -r '.[] | select((.body // "") | test("Status:\\s*Blocked"; "i")) | select((.body // "") | test("Blocked By:\\s*(—|-|$)"; "i")) | "- #\(.number) \(.title)"' >> "$GITHUB_STEP_SUMMARY"
          VIOLATIONS=$((VIOLATIONS + BLOCKED_NO_REASON))
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### 5. Long-stale open Issues (>90 days)" >> "$GITHUB_STEP_SUMMARY"
          STALE=$(echo "$ISSUES" | jq --arg cutoff "$(date -u -d '90 days ago' +%Y-%m-%dT%H:%M:%SZ)" '[.[] | select(.updatedAt < $cutoff)] | length')
          echo "Found: $STALE" >> "$GITHUB_STEP_SUMMARY"
          echo "$ISSUES" | jq -r --arg cutoff "$(date -u -d '90 days ago' +%Y-%m-%dT%H:%M:%SZ)" '.[] | select(.updatedAt < $cutoff) | "- #\(.number) \(.title) (\(.updatedAt))"' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### 6. Enrichment coverage (informational)" >> "$GITHUB_STEP_SUMMARY"
          for PREFIX in area: priority:; do
            COUNT=$(echo "$ISSUES" | jq --arg p "$PREFIX" '[.[] | select([.labels[].name | select(startswith($p))] | length == 0)] | length')
            echo "- Missing $PREFIX $COUNT" >> "$GITHUB_STEP_SUMMARY"
          done
          WAITING_COUNT=$(echo "$ISSUES" | jq '[.[] | select([.labels[].name | select(startswith("waiting:"))] | length > 0)] | length')
          echo "- Issues with optional waiting condition: $WAITING_COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "**Actionable lifecycle violations: $VIOLATIONS**" >> "$GITHUB_STEP_SUMMARY"
          echo "> This workflow reports only. Semantic activation, closure, and reprioritization remain Human/Agent review decisions." >> "$GITHUB_STEP_SUMMARY"

          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "::warning::$VIOLATIONS lifecycle hygiene violations found."
          fi
