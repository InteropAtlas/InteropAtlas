name: Issue Hygiene Check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      issue_number:
        description: '只检查指定 Issue（留空则全量检查）'
        required: false
        type: number

permissions:
  issues: read
  contents: read

jobs:
  hygiene-check:
    runs-on: ubuntu-latest
    steps:
      - name: Run Issue Hygiene Checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_ISSUE: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail

          if [ -n "${TARGET_ISSUE:-}" ]; then
            ISSUES="$(gh issue view "$TARGET_ISSUE" --repo "$REPO" --json number,title,labels,updatedAt,state --jq '[.]')"
          else
            ISSUES="$(gh issue list --repo "$REPO" --state open --limit 500 --json number,title,labels,updatedAt)"
          fi

          echo "## Issue Hygiene Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Total open issues checked: $(jq 'length' <<<"$ISSUES")**" >> "$GITHUB_STEP_SUMMARY"

          VIOLATIONS=0
          for PREFIX in attention: type:; do
            MISSING="$(jq --arg p "$PREFIX" '[.[] | select([.labels[].name | select(startswith($p))] | length == 0)] | length' <<<"$ISSUES")"
            CONFLICT="$(jq --arg p "$PREFIX" '[.[] | select([.labels[].name | select(startswith($p))] | length > 1)] | length' <<<"$ISSUES")"
            echo "### $PREFIX" >> "$GITHUB_STEP_SUMMARY"
            echo "- Missing: $MISSING" >> "$GITHUB_STEP_SUMMARY"
            echo "- Conflicting: $CONFLICT" >> "$GITHUB_STEP_SUMMARY"
            jq -r --arg p "$PREFIX" '.[] | select([.labels[].name | select(startswith($p))] | length == 0) | "- #\(.number) \(.title) — missing "+$p' <<<"$ISSUES" >> "$GITHUB_STEP_SUMMARY"
            jq -r --arg p "$PREFIX" '.[] | select([.labels[].name | select(startswith($p))] | length > 1) | "- #\(.number) \(.title) — conflicting "+$p' <<<"$ISSUES" >> "$GITHUB_STEP_SUMMARY"
            VIOLATIONS=$((VIOLATIONS + MISSING + CONFLICT))
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done

          WAITING_CONFLICT="$(jq '[.[] | select([.labels[].name | select(startswith("waiting:"))] | length > 1)] | length' <<<"$ISSUES")"
          WAITING_COUNT="$(jq '[.[] | select([.labels[].name | select(startswith("waiting:"))] | length > 0)] | length' <<<"$ISSUES")"
          echo "### Optional Waiting" >> "$GITHUB_STEP_SUMMARY"
          echo "- With waiting condition: $WAITING_COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Conflicting waiting labels: $WAITING_CONFLICT" >> "$GITHUB_STEP_SUMMARY"
          VIOLATIONS=$((VIOLATIONS + WAITING_CONFLICT))

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Actionable metadata violations: $VIOLATIONS**" >> "$GITHUB_STEP_SUMMARY"
          echo "> Attention / Type are the core metadata. Waiting is optional." >> "$GITHUB_STEP_SUMMARY"

          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "::warning::$VIOLATIONS metadata hygiene violations found."
          fi
