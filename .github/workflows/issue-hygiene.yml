name: Issue Hygiene Check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      issue_number:
        description: '只检查指定 Issue（留空则全量检查）'
        required: false
        type: number

permissions:
  issues: read
  contents: read

jobs:
  hygiene-check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
      REPO: ${{ github.repository }}
      TARGET_ISSUE: ${{ inputs.issue_number }}
    steps:
      - name: Check native Issue metadata
        run: |
          set -euo pipefail

          if [ -n "${TARGET_ISSUE:-}" ]; then
            printf '%s
' "$TARGET_ISSUE" > /tmp/numbers.txt
          else
            gh api --paginate "repos/$REPO/issues?state=open&per_page=100"               --jq '.[] | select(.pull_request == null) | .number' > /tmp/numbers.txt
          fi

          total=0
          missing_work_type=0
          invalid_waiting=0
          deprecated_labels=0
          prerequisite_waiting=0

          echo "## Issue Hygiene Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          while read -r n; do
            [ -n "$n" ] || continue
            total=$((total+1))

            ISSUE="$(gh api "repos/$REPO/issues/$n")"
            title="$(jq -r '.title' <<<"$ISSUE")"
            VALUES="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$REPO/issues/$n/issue-field-values")"

            WT="$(jq -r '.[]? | select(.issue_field_name=="Work Type") | .single_select_option.name' <<<"$VALUES" | head -n1)"
            WF="$(jq -r '.[]? | select(.issue_field_name=="Waiting For") | .single_select_option.name' <<<"$VALUES" | head -n1)"

            if [ -z "$WT" ]; then
              missing_work_type=$((missing_work_type+1))
              echo "- #$n $title — missing Work Type" >> "$GITHUB_STEP_SUMMARY"
            fi

            if [ -n "$WF" ] && [ "$WF" != "Evidence" ] && [ "$WF" != "Scale" ] && [ "$WF" != "Owner" ]; then
              invalid_waiting=$((invalid_waiting+1))
              echo "- #$n $title — invalid Waiting For: $WF" >> "$GITHUB_STEP_SUMMARY"
            fi

            while read -r label; do
              [ -n "$label" ] || continue
              case "$label" in
                attention:focus|attention:inbox|type:knowledge|type:perspective|type:evolution|waiting:evidence|waiting:scale|waiting:owner)
                  deprecated_labels=$((deprecated_labels+1))
                  echo "- #$n $title — deprecated label: $label" >> "$GITHUB_STEP_SUMMARY"
                  ;;
                waiting:prerequisite)
                  prerequisite_waiting=$((prerequisite_waiting+1))
                  ;;
              esac
            done < <(jq -r '.labels[].name' <<<"$ISSUE")
          done < /tmp/numbers.txt

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Open issues checked: $total**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Missing Work Type: $missing_work_type" >> "$GITHUB_STEP_SUMMARY"
          echo "- Invalid Waiting For: $invalid_waiting" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deprecated metadata label assignments: $deprecated_labels" >> "$GITHUB_STEP_SUMMARY"
          echo "- Remaining generic waiting:prerequisite assignments: $prerequisite_waiting" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Work Type is required. Waiting For is optional. Specific Issue prerequisites should use native Dependencies." >> "$GITHUB_STEP_SUMMARY"

          violations=$((missing_work_type + invalid_waiting + deprecated_labels))
          if [ "$violations" -gt 0 ]; then
            echo "::warning::$violations native metadata hygiene violations found."
          fi
