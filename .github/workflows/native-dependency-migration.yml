name: Native Dependency Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-dependency-migration.yml'

permissions:
  contents: read
  issues: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
    steps:
      - name: Verify high-confidence native dependencies
        run: |
          set -euo pipefail
          echo "REST_225=$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' repos/$GITHUB_REPOSITORY/issues/225/dependencies/blocked_by --jq 'map(.number)')"
          echo "REST_230=$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' repos/$GITHUB_REPOSITORY/issues/230/dependencies/blocked_by --jq 'map(.number)')"
          echo "REST_249=$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' repos/$GITHUB_REPOSITORY/issues/249/dependencies/blocked_by --jq 'map(.number)')"
