name: Temporary Experiment Link Migration

on:
  push:
    branches:
      - chore/experiment-attention-hierarchy

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/experiment-attention-hierarchy
          fetch-depth: 0
      - name: Replace migrated experiment link
        shell: python
        run: |
          from pathlib import Path
          path = Path('docs/02_System/02_Interface/02_Profiles/human-interface-accessibility-conformance-profile.zh-CN.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '/03_Evolution/02_Experiments/gate-b-minimal-human-task-walkthrough-2026-09-02.zh-CN.md',
              '/03_Evolution/02_Experiments/02_Pilots/gate-b-minimal-human-task-walkthrough-2026-09-02.zh-CN.md'
          )
          path.write_text(text, encoding='utf-8')
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: fix experiment references after reorg"
          git push origin HEAD:chore/experiment-attention-hierarchy
