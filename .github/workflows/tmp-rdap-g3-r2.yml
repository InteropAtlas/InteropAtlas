name: tmp-rdap-g3-r2
on:
  push:
    branches: [tmp-rdap-g3-r2]
permissions:
  contents: read
jobs:
  rdap:
    runs-on: ubuntu-latest
    steps:
      - name: Query PIR RDAP
        shell: bash
        run: |
          set -u
          endpoint="https://rdap.publicinterestregistry.org/rdap/domain"
          names=(waysidelantern thirdwindow borrowedlight fartable sideweather openhearth othershore secondlantern guestwindow turningfield manywindows riverdoor sameweather longtable elselantern commondoor thirdweather guestshore farwindow sidehearth)
          for n in "${names[@]}"; do
            code=$(curl -sS -o /tmp/rdap.json -w '%{http_code}' "$endpoint/$n.org" || true)
            echo "$n.org $code"
          done
