name: Issue Portfolio View Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue-portfolio-view-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
      PROJECT_OWNER_ID: O_kgDOEzyTWQ
      PROJECT_TITLE: InteropAtlas — Issue Portfolio
      PROJECT_ORG: InteropAtlas

    steps:
      - name: Migrate saved views to current governance
        run: |
          set -euo pipefail

          PROJECTS="$(gh api graphql -f query='query($owner: ID!) {
            node(id:$owner) {
              ... on Organization {
                projectsV2(first:100) { nodes { id number title } }
              }
            }
          }' -F owner="$PROJECT_OWNER_ID")"
          PROJECT_ID="$(jq -r --arg title "$PROJECT_TITLE" '.data.node.projectsV2.nodes[]? | select(.title==$title) | .id' <<<"$PROJECTS" | head -n1)"
          PROJECT_NUMBER="$(jq -r --arg title "$PROJECT_TITLE" '.data.node.projectsV2.nodes[]? | select(.title==$title) | .number' <<<"$PROJECTS" | head -n1)"
          test -n "$PROJECT_ID"
          test -n "$PROJECT_NUMBER"

          VIEWS="$(gh api graphql -f query='query($project: ID!) {
            node(id:$project) {
              ... on ProjectV2 {
                views(first:20) { nodes { id number name layout filter } }
              }
            }
          }' -F project="$PROJECT_ID")"
          echo "BEFORE_VIEWS=$VIEWS"

          update_view() {
            local old_name="$1" new_name="$2" new_filter="$3"
            local view_id
            view_id="$(jq -r --arg n "$old_name" '.data.node.views.nodes[]? | select(.name==$n) | .id' <<<"$VIEWS" | head -n1)"
            if [ -z "$view_id" ]; then
              echo "VIEW_NOT_FOUND=$old_name"
              return 0
            fi
            gh api graphql -f query='mutation($view: ID!, $name: String!, $filter: String!) {
              updateProjectV2View(input:{viewId:$view,name:$name,filter:$filter}) {
                projectV2View { id number name layout filter }
              }
            }' -F view="$view_id" -f name="$new_name" -f filter="$new_filter"
          }

          delete_view_by_name() {
            local name="$1"
            local view_id
            view_id="$(jq -r --arg n "$name" '.data.node.views.nodes[]? | select(.name==$n) | .id' <<<"$VIEWS" | head -n1)"
            if [ -z "$view_id" ]; then
              echo "VIEW_ALREADY_ABSENT=$name"
              return 0
            fi
            gh api graphql -f query='mutation($view: ID!) {
              deleteProjectV2View(input:{viewId:$view}) {
                projectV2View { id name }
              }
            }' -F view="$view_id"
          }

          update_view "Current" "Focus" 'label:"attention:focus"'
          update_view "Research" "Inbox" 'label:"attention:inbox"'
          update_view "Knowledge" "Knowledge" 'label:"type:knowledge"'
          update_view "Interface" "Perspective" 'label:"type:perspective"'
          update_view "Operations" "Evolution" 'label:"type:evolution"'
          update_view "Waiting" "Waiting" 'label:"waiting:prerequisite","waiting:evidence","waiting:scale","waiting:owner"'
          delete_view_by_name "Near-term"
          delete_view_by_name "View 10"
          delete_view_by_name "Attention Board"

          FIELDS_REST="$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "orgs/$PROJECT_ORG/projectsV2/$PROJECT_NUMBER/fields?per_page=100")"
          echo "FIELDS_REST=$FIELDS_REST"
          ATTENTION_DB_ID="$(jq -r '.[]? | select(.name=="Attention") | .id' <<<"$FIELDS_REST" | head -n1)"
          test -n "$ATTENTION_DB_ID"

          BOARD_PAYLOAD="$(jq -nc --arg name "Attention Board" --argjson attention "$ATTENTION_DB_ID" '{
            name:$name,
            layout:"board",
            filter:"is:issue is:open",
            vertical_group_by:[$attention]
          }')"

          gh api --method POST             -H "X-GitHub-Api-Version: 2026-03-10"             -H "Accept: application/vnd.github+json"             "orgs/$PROJECT_ORG/projectsV2/$PROJECT_NUMBER/views"             --input - <<<"$BOARD_PAYLOAD"

          AFTER="$(gh api graphql -f query='query($project: ID!) {
            node(id:$project) {
              ... on ProjectV2 {
                views(first:20) {
                  nodes {
                    id number name layout filter
                    groupByFields(first:10) {
                      nodes { ... on ProjectV2FieldCommon { id name dataType } }
                    }
                    verticalGroupByFields(first:10) {
                      nodes { ... on ProjectV2FieldCommon { id name dataType } }
                    }
                  }
                }
              }
            }
          }' -F project="$PROJECT_ID")"
          echo "AFTER_VIEWS=$AFTER"
