name: Maintenance 287 preserve reviewed history
on:
  push:
    branches: [maintenance/287-branch-pr-audit-20260911]
    paths: [.github/workflows/maintenance-287-preserve.yml]
permissions:
  contents: write
  issues: write
  pull-requests: read
  actions: read
concurrency:
  group: maintenance-287-mutations
  cancel-in-progress: false
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive frozen evidence and prepare two-file historical PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/maintenance/branch_pr_287.py prepare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-287-preservation-result
          path: maintenance-output/
          retention-days: 30
          if-no-files-found: error
