name: Attention Board Retain Completed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/attention-board-retain-completed.yml'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
      PROJECT_OWNER_ID: O_kgDOEzyTWQ
      PROJECT_TITLE: InteropAtlas — Issue Portfolio

    steps:
      - name: Include closed Issues in Attention Board
        run: |
          set -euo pipefail
          PROJECTS="$(gh api graphql -f query='query($owner: ID!) {
            node(id:$owner) {
              ... on Organization {
                projectsV2(first:100) { nodes { id title } }
              }
            }
          }' -F owner="$PROJECT_OWNER_ID")"
          PROJECT_ID="$(jq -r --arg title "$PROJECT_TITLE" '.data.node.projectsV2.nodes[]? | select(.title==$title) | .id' <<<"$PROJECTS" | head -n1)"
          test -n "$PROJECT_ID"

          VIEWS="$(gh api graphql -f query='query($project: ID!) {
            node(id:$project) {
              ... on ProjectV2 {
                views(first:100) {
                  nodes {
                    id name filter
                    groupByFields(first:10) { nodes { ... on ProjectV2FieldCommon { name } } }
                    verticalGroupByFields(first:10) { nodes { ... on ProjectV2FieldCommon { name } } }
                  }
                }
              }
            }
          }' -F project="$PROJECT_ID")"

          VIEW_ID="$(jq -r '.data.node.views.nodes[]? | select(.name=="Attention Board") | .id' <<<"$VIEWS" | head -n1)"
          test -n "$VIEW_ID"
          echo "BEFORE=$(jq -c '.data.node.views.nodes[]? | select(.name=="Attention Board")' <<<"$VIEWS")"

          gh api graphql -f query='mutation($view: ID!) {
            updateProjectV2View(input:{viewId:$view,filter:"is:issue"}) {
              projectV2View {
                id name filter
                groupByFields(first:10) { nodes { ... on ProjectV2FieldCommon { name } } }
                verticalGroupByFields(first:10) { nodes { ... on ProjectV2FieldCommon { name } } }
              }
            }
          }' -F view="$VIEW_ID"

          AFTER="$(gh api graphql -f query='query($project: ID!) {
            node(id:$project) {
              ... on ProjectV2 {
                views(first:100) {
                  nodes {
                    id name filter
                    groupByFields(first:10) { nodes { ... on ProjectV2FieldCommon { name } } }
                    verticalGroupByFields(first:10) { nodes { ... on ProjectV2FieldCommon { name } } }
                  }
                }
              }
            }
          }' -F project="$PROJECT_ID")"
          echo "AFTER=$(jq -c '.data.node.views.nodes[]? | select(.name=="Attention Board")' <<<"$AFTER")"
