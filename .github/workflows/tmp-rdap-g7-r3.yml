name: tmp-rdap-g7-r3
on:
  push:
    branches: [tmp-rdap-g7-r3]
permissions:
  contents: read
jobs:
  rdap:
    runs-on: ubuntu-latest
    steps:
      - name: Query PIR RDAP
        shell: bash
        run: |
          set -u
          endpoint="https://rdap.publicinterestregistry.org/rdap/domain"
          names=(farbetween kindafter commonturns elsebridge manywayside farsame anotherfield kindredturn otherlane morrowdoor manyafter publicelse goodother betweenkind turnneighbor sidefuture anotherturn manynear elsepath farinside)
          for n in "${names[@]}"; do
            code=$(curl -sS -o /tmp/rdap.json -w '%{http_code}' "$endpoint/$n.org" || true)
            echo "$n.org $code"
          done
