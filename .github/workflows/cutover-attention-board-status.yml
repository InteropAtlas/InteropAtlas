name: Cut Over Attention Board to Native Status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cutover-attention-board-status.yml'

permissions:
  contents: read

jobs:
  cutover:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IA_PROJECTS_TOKEN }}
      PROJECT_OWNER_ID: O_kgDOEzyTWQ
      PROJECT_TITLE: InteropAtlas — Issue Portfolio

    steps:
      - name: Preserve current view settings and switch only vertical grouping
        run: |
          set -euo pipefail

          PROJECTS="$(gh api graphql -f query='query($owner: ID!) {
            node(id:$owner) {
              ... on Organization {
                projectsV2(first:100) { nodes { id title } }
              }
            }
          }' -F owner="$PROJECT_OWNER_ID")"
          PROJECT_ID="$(jq -r --arg title "$PROJECT_TITLE" '.data.node.projectsV2.nodes[]? | select(.title==$title) | .id' <<<"$PROJECTS" | head -n1)"
          test -n "$PROJECT_ID"

          DATA="$(gh api graphql -f query='query($project: ID!) {
            node(id:$project) {
              ... on ProjectV2 {
                fields(first:100) {
                  nodes {
                    ... on ProjectV2FieldCommon { id name dataType }
                  }
                }
                views(first:100, orderBy:{field:POSITION,direction:ASC}) {
                  nodes {
                    id number name layout filter
                    groupByFields(first:10) { nodes { ... on ProjectV2FieldCommon { id name dataType } } }
                    verticalGroupByFields(first:10) { nodes { ... on ProjectV2FieldCommon { id name dataType } } }
                  }
                }
              }
            }
          }' -F project="$PROJECT_ID")"

          STATUS_FIELD="$(jq -r '.data.node.fields.nodes[]? | select(.name=="Status") | .id' <<<"$DATA" | head -n1)"
          VIEW_ID="$(jq -r '.data.node.views.nodes[]? | select(.name=="Attention Board") | .id' <<<"$DATA" | head -n1)"
          test -n "$STATUS_FIELD"; test -n "$VIEW_ID"

          echo "BEFORE=$(jq -c '.data.node.views.nodes[]? | select(.name=="Attention Board")' <<<"$DATA")"

          gh api graphql -f query='mutation($view: ID!, $field: ID!) {
            updateProjectV2View(input:{viewId:$view,verticalGroupByFieldId:$field}) {
              projectV2View {
                id name layout filter
                groupByFields(first:10){nodes{... on ProjectV2FieldCommon{name}}}
                verticalGroupByFields(first:10){nodes{... on ProjectV2FieldCommon{name}}}
              }
            }
          }' -F view="$VIEW_ID" -F field="$STATUS_FIELD"

          AFTER="$(gh api graphql -f query='query($project: ID!) {
            node(id:$project) {
              ... on ProjectV2 {
                views(first:100) {
                  nodes {
                    id name layout filter
                    groupByFields(first:10){nodes{... on ProjectV2FieldCommon{name}}}
                    verticalGroupByFields(first:10){nodes{... on ProjectV2FieldCommon{name}}}
                  }
                }
              }
            }
          }' -F project="$PROJECT_ID")"
          echo "AFTER=$(jq -c '.data.node.views.nodes[]? | select(.name=="Attention Board")' <<<"$AFTER")"
          test "$(jq -r '.data.node.views.nodes[]? | select(.name=="Attention Board") | .verticalGroupByFields.nodes[0].name' <<<"$AFTER")" = "Status"
