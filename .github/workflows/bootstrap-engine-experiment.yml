name: Bootstrap Engine Experiment

on:
  push:
    paths:
      - 'standards/**'
      - 'capabilities/**'
      - 'scenarios/**'
      - 'organizations/**'
      - 'implementations/**'
      - 'reference-projects/**'
      - 'gaps/**'
      - 'relations/**'
      - 'maps/**'
      - 'schemas/**'
      - 'engine/**'
      - '.github/workflows/bootstrap-engine-experiment.yml'
  pull_request:
    paths:
      - 'standards/**'
      - 'capabilities/**'
      - 'scenarios/**'
      - 'organizations/**'
      - 'implementations/**'
      - 'reference-projects/**'
      - 'gaps/**'
      - 'relations/**'
      - 'maps/**'
      - 'schemas/**'
      - 'engine/**'
      - '.github/workflows/bootstrap-engine-experiment.yml'
  workflow_dispatch:

jobs:
  executable-experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bootstrap dependency
        run: pip install -r engine/requirements.txt
      - name: Verify repository layout contract
        run: python engine/test_repository_layout.py
      - name: Report resolved graph health
        run: python engine/graph_index.py
      - name: Run deterministic supportability query
        run: python engine/bootstrap_query.py --capability automated_build_deployment
      - name: Render three human-readable object types
        run: |
          python engine/render_markdown.py forgejo_actions --output build/implementations/forgejo-actions.md
          python engine/render_markdown.py automated_build_deployment --output build/capabilities/automated-build-deployment.md
          python engine/render_markdown.py yaml_1.2.2 --output build/standards/yaml-1.2.2.md
          echo '=== Implementation ==='
          cat build/implementations/forgejo-actions.md
          echo '=== Capability ==='
          cat build/capabilities/automated-build-deployment.md
          echo '=== Standard ==='
          cat build/standards/yaml-1.2.2.md
