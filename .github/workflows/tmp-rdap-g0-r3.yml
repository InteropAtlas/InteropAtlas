name: tmp-rdap-g0-r3
on:
  push:
    branches: [tmp-rdap-g0-r3]
permissions:
  contents: read
jobs:
  rdap:
    runs-on: ubuntu-latest
    steps:
      - name: Query PIR RDAP
        shell: bash
        run: |
          set -u
          endpoint="https://rdap.publicinterestregistry.org/rdap/domain"
          names=(viremere gatherloom persiva commonflare novaren elsehaven facetmere orilume manyward returnel vantora worldmere relivane prismere newelse kinfold commonveil avenfold othermere novaloom)
          for n in "${names[@]}"; do
            code=$(curl -sS -o /tmp/rdap.json -w '%{http_code}' "$endpoint/$n.org" || true)
            echo "$n.org $code"
          done
