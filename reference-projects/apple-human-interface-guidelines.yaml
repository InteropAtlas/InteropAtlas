lessons_zh:
  - "Apple HIG 不是国际标准，而是覆盖 Apple 平台的产品级设计指南，结构上包含 Foundations、Patterns、Components、Inputs 与 Technologies。"
  - "2026 年重新明确的核心设计原则包括 Purpose、Agency、Responsibility、Familiarity、Flexibility、Simplicity、Craft 与 Delight；其中 Familiarity、Agency、Simplicity 与 IA 的可预测导航、可恢复操作和信息层级尤其相关。"
  - "Apple 强调沿用用户已经熟悉的平台行为、保持视觉和交互一致、提供明确反馈、让用户可撤销/恢复，并在复杂度和信息密度上优先保证清晰直接。"
  - "HIG 对工具栏、侧栏、菜单、搜索、列视图、焦点、键盘、无障碍、排版和图表都有组件级/模式级具体建议，适合用于 IA Human-readable Web 的产品级 Prior Art。"
lessons_en:
  - "Apple HIG is not an international standard; it is product-level design guidance for Apple platforms, organized around Foundations, Patterns, Components, Inputs, and Technologies."
  - "Its reintroduced 2026 design principles include Purpose, Agency, Responsibility, Familiarity, Flexibility, Simplicity, Craft, and Delight. Familiarity, Agency, and Simplicity are especially relevant to IA navigation, recoverability, and information hierarchy."
  - "Apple emphasizes familiar platform behavior, visual and interaction consistency, clear feedback, recoverable actions, and reducing unnecessary complexity."
  - "HIG includes concrete guidance for toolbars, sidebars, menus, search, column views, focus, keyboard input, accessibility, typography, and charts, making it strong product-level prior art for IA."
