description_zh: 一个持续更新的智能体标准全景项目，用于跟踪与 AI Agent（人工智能智能体）相关的 IETF 场所、工作项、BoF 和缺口。
description_en: A living landscape tracking venues, work items, BoFs, and gaps related to AI-agent and agentic standards in and around the IETF.
