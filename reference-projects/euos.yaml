id: euos
type: reference_project
name_zh: 欧洲 ICT 标准化观察站
name_en: European Observatory for ICT Standardisation
project_kind: observatory
description_zh: StandICT.eu 的欧洲 ICT 标准化观察站，持续汇集已发布和正在进行的 ICT 标准化活动，并通过标准全景与缺口分析报告覆盖多个 ICT 领域。
description_en: The European Observatory for ICT Standardisation (EUOS), an interactive repository and observatory covering published and ongoing ICT standardisation activities, landscapes, and gap analyses.
scope:
  - ict
  - european_standardisation
features:
  - standards_catalog
  - gap_analysis
  - search_navigation
  - community_governance
organization: StandICT.eu
machine_readable: unknown
last_verified: 2026-08-30
official_url: https://www.standict.eu/euos
lessons_zh:
  - 标准地图可以同时收录已发布标准与进行中的工作组、技术委员会和标准化活动。
  - 大范围标准全景需要稳定分类体系；EUOS 使用 ISO 的 ICS 标准分类体系作为交互地图基础。
  - 专家工作组产生的全景分析和缺口分析可以成为结构化地图的上游证据。
