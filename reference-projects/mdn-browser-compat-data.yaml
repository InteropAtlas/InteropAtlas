lessons_zh:
  - "把高频变化的兼容性事实作为机器可读数据集维护，并用独立 Schema 定义数据合同。"
  - "同一数据源被 MDN、IDE、浏览器工具和其他软件重复消费，体现了一个事实源、多种投影和消费者的价值。"
  - "适合作为 InteropAtlas 数据与 Schema 同仓、面向多消费者发布的成熟先例。"
lessons_en:
  - "Maintains frequently changing compatibility facts as machine-readable data governed by explicit schemas."
  - "A single dataset is consumed by MDN, IDEs, browser tooling, and other software, demonstrating one source with many projections and consumers."
  - "A mature precedent for keeping InteropAtlas data and schemas together while serving multiple consumers."
