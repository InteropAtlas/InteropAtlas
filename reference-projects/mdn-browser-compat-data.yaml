project_kind: other
scope:
  - machine-readable browser compatibility data
  - Web APIs and platform features
  - cross-browser compatibility
  - schema-governed data publication
features: [relationship_mapping, machine_readable_data, community_governance, search_navigation]
official_url: https://github.com/mdn/browser-compat-data
