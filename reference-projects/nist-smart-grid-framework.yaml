lessons_zh:
  - 将标准目录与具体通信场景结合，而不是孤立评价单个标准。
  - 将发现的缺口转化为有优先级、责任主体和行动计划的治理对象。
  - 将互操作测试与认证作为标准是否真正可组合的重要部分。
