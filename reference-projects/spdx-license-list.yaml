id: spdx_license_list
type: reference_project
name_zh: SPDX 许可证列表
name_en: SPDX License List
official_name: SPDX License List
project_kind: standards_catalog
scope:
  - standardized license identifiers
  - authoritative license source data
  - generated multi-format license data
  - machine-readable licensing metadata
features: [standards_catalog, machine_readable_data, relationship_mapping, community_governance]
official_url: https://github.com/spdx/license-list-XML
machine_readable: yes
last_verified: 2026-09-01
lessons_zh:
  - "把 authoritative source 与生成的 JSON、RDF、HTML、文本等消费格式明确分离，避免生成物成为第二事实源。"
  - "稳定标识、源数据、发布产物和生成工具可以拥有不同职责边界。"
  - "适合作为 InteropAtlas 'Canonical Source ≠ Generated Projection' 原则的成熟先例。"
lessons_en:
  - "Separates authoritative license source data from generated JSON, RDF, HTML, text, and other consumer formats."
  - "Demonstrates distinct responsibilities for stable identifiers, source data, generated distributions, and publishing tooling."
  - "A mature precedent for InteropAtlas' Canonical Source ≠ Generated Projection principle."
sources:
