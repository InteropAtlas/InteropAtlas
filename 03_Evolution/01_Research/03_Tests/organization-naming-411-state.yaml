task:
  issue: 411
  repository: InteropAtlas/InteropAtlas
  branch: feat/adaptive-naming-skill-v0.1
  mode: Adaptive Naming Fit Test
  status: in_progress
  snapshot_version: 40
  skill_version: 0.3.3

lineage:
  preservation_note: >-
    Naming Job 未重新初始化，G0–G8 benchmark 未恢复。完整历史候选与逐轮细节继续由 Git history 保留。
    snapshot v38 保存 RND-054–056；snapshot v39 保存 v0.3.3 reality false-negative reset、RND-057–059。
    本快照压缩 working history，记录 RND-060/061、Lumerand 压力测试与 v0.3.3 regression review。
  previous_snapshots:
    - {snapshot: 36, commit: 3348d1650e68404704b11097c10f0818c4adeae1}
    - {snapshot: 37, commit: 62a3d2508c73f32d8057a64b900e5d85a261804b}
    - {snapshot: 38, commit: c37f62548cac26aa5850aae368af3330af94a12d}
    - {snapshot: 39, commit: b4867dda2053ac4916acd8fe3b616fe8e22fdd7d}

constraint_registry:
  confirmed_hard_constraints:
    - {id: HC-ORG-SCALE, statement: 名称必须承载 InteropAtlas 上层长期 umbrella organization，而非锁死为单一项目、协议、地图、平台或行业。, source_type: owner_explicit, source_ref: organization-vision}
    - {id: HC-RECOVERABILITY, statement: 避免明显高误读、高听写分叉；名称需具备可接受的口语与拼写恢复性。, source_type: owner_explicit, source_ref: prior-owner-feedback}
    - {id: HC-ORG-DOMAIN, statement: 最终 finalist 的同名普通 .org 可注册性为硬门槛；早期创意质量阶段不以此淘汰。, source_type: owner_explicit, source_ref: issue-411-policy}
  owner_preferences:
    - {id: PREF-LOW-MISREAD, statement: 更偏好不容易误读的名称。}
  controller_search_variables:
    - {id: SV-WORD-COUNT, name: word_count, current_value: open, allowed_values: [single_token, multiword, both], owner_approval_required_to_change: false}
    - {id: SV-SEMANTIC-TRANSPARENCY, name: semantic_transparency, current_value: adaptive, allowed_values: [transparent, light, opaque_but_traceable, mixed], owner_approval_required_to_change: false}
    - {id: SV-NAME-LENGTH, name: name_length, current_value: adaptive_longer_than_prior_short_shells, owner_approval_required_to_change: false}
  assumptions: []

mission_value_model:
  source_refs: [organization-vision, issue-411-recovery]
  actors: [commons / public, individual, contributors / creators, projects / institutions]
  objects: [knowledge, perspective / interpretation, creation / discovery, shared public knowledge]
  transformations:
    - shared knowledge enables individual perspective
    - individual perspective enables creation / discovery
    - creation can return to the commons
    - returned knowledge supports another cycle
  relations_and_agency:
    - public knowledge is a shared resource while individuals retain interpretive agency and choice
    - commons and individual agency must coexist; plurality is not a proxy for agency
  temporal_or_causal_structure:
    - Commons → Perspective → Creation → Commons ↺ is a feedback cycle, not four parallel keywords
  value_claims:
    - {id: V-COMMONS, statement: knowledge should remain part of a shared commons, evidence_type: explicit, priority: core, confidence: high}
    - {id: V-AGENCY, statement: individuals should retain interpretive perspective and choice, evidence_type: explicit, priority: core, confidence: high}
    - {id: V-CREATION, statement: perspective should enable creation / discovery, evidence_type: structural, priority: high, confidence: high}
    - {id: V-RETURN, statement: creation can contribute back into shared knowledge, evidence_type: structural, priority: high, confidence: high}
  naming_implications:
    - {value_id: V-COMMONS, mode: indirect}
    - {value_id: V-AGENCY, mode: indirect}
    - {value_id: V-CREATION, mode: indirect}
    - {value_id: V-RETURN, mode: guardrail_only}
  integrity:
    value_flattening_detected: false
    mission_overcompression_detected: false
    value_proxy_collapse_detected: false
    value_score_smuggling_detected: false

name_job_model:
  primary_jobs:
    - form a durable independently recognizable umbrella-organization identity
    - support multiple projects / research / tools / education / publishing / public knowledge work
    - maintain acceptable spoken and written recoverability
    - leave enough semantic room for long-term brand meaning
  secondary_jobs:
    - establish a truthful connection to one or a few core values / structural relations when useful
    - carry enough memorability, institutional scale and creative energy
  non_jobs:
    - bare name does not need to encode the complete mission loop
    - bare name does not need to enumerate future activities
    - semantic/etymological grounding is not a mandatory construction rule
  tensions:
    - distinctiveness ↔ recoverability
    - semantic grounding ↔ ownable identity
    - institutional scale ↔ creative energy
  status: active

decision_criteria:
  items:
    - {id: C-SCALE, statement: long-term umbrella organization scale, role: gate, source_ref: HC-ORG-SCALE}
    - {id: C-RECOVERY, statement: low-to-acceptable pronunciation / dictation burden, role: optimize, source_ref: HC-RECOVERABILITY}
    - {id: C-DISTINCT, statement: independent proper-name identity, role: optimize, source_ref: name-job-model}
    - {id: C-VALUE, statement: no contradiction with Mission / Value Model and preferably a truthful connection, role: optimize, source_ref: mission-value-model}
    - {id: C-DOMAIN, statement: exact ordinary .org available for finalist, role: gate, source_ref: HC-ORG-DOMAIN}
    - {id: C-OWNER, statement: Owner long-term resonance, role: prefer, source_ref: owner-preference}
    - {id: C-TM, statement: formal trademark clearance, role: observe, source_ref: owner-deferred-policy}
  integrity: {role_confusion_detected: false, role_drift_detected: false}

optional_modules:
  territory_research:
    status: completed_for_current_trigger
    learning:
      - structural analogies are useful; literal territory vocabulary remained crowded
  communication_load_allocation: {status: inactive}
  decision_hygiene: {status: ready_on_trigger, trigger: high-value shortlist / Owner Exposure}
  temporal_evaluation: {status: inactive}
  validation_research: {status: inactive}
  naming_scope: {status: satisfied, object_role: standalone_umbrella_organization_brand}
  activation_governance: {status: deferred, trigger: finalist selected / rollout needed}

search_control:
  mode: exploration
  generation_isolation:
    level: best_effort_same_context
    runtime_identity: ChatGPT current conversation runtime
    historical_context_may_have_seen_controller_only_exclusions: true
    claim_policy: current brief may omit hidden material, but this runtime cannot claim it was never historically visible
  incumbent_isolation:
    comparison_only_candidate_ids: [N060]
  controller_only_exclusions:
    incumbent_candidate_ids: [N060]
    cooled_family_ids: [FAM-V34-01, FAM-RND046-01, FAM-RND051-01]
    owner_reaction_subject_ids: [N060]
    other: [N061_historical_hold_not_generation_seed, historical_reality_survivor_shapes]
  reality_feedback_quarantine:
    enabled_in_exploration: true
    same_batch_feedback_to_generator: prohibited
  post_generation_filter:
    enabled: true
    check_cooled_families: true
    check_incumbent_similarity: true
    check_strategy_fidelity: true
    check_other_controller_only_exclusions: true

reality_screening:
  method_ref: reality-screening-contract-v0.3.3
  status: active
  minimum_level_for_held_or_promising: 1
  freshness_recheck_before_owner_exposure: true
  false_negative_history_preserved: true
  query_classes:
    - bare_exact
    - company_organization
    - software_product_project
    - naming_job_adjacent_category
    - public_trademark_signal
    - near_name_and_recovery_branch_before_promotion

method_scheduler:
  policy: adaptive_portfolio
  active_strategies:
    - {strategy_id: longer_phonotactic_proper_name, family: controlled_coinage, status: boosted, rationale: longer forms show better namespace yield than short startup-like shells, but recoverability must remain strict}
    - {strategy_id: opaque_but_traceable_proper_name, family: controlled_coinage, status: active, rationale: preserve semantic room without mandatory etymology}
    - {strategy_id: sound_first, family: controlled_coinage, status: active_but_guarded, rationale: useful for identity space; avoid fantasy/person-name drift and short startup templates}
    - {strategy_id: morpheme_grounded_coinage, family: compositional_derived, status: deprioritized, rationale: grounding improves provenance but not namespace yield by itself}
    - {strategy_id: transformation_operator, family: transformation_operator, status: rescue_only, rationale: no current seed passes rescue trigger}
  diagnostics:
    scheduler_monoculture: false
    method_underuse: false
    territory_material_starvation: partially_resolved
    notes:
      - current scarce resource is a clean, recoverable, organization-scale identity rather than a clever etymology
      - longer form is a search variable, not an Owner boundary

transformation_rescue:
  active_branches: []
  rescue_overfit_detected: false
  seed_audit: {status: complete_current_pool, result: no_branch_opened}

candidates:
  - id: N060
    name: Plurifold
    role: comparison_only
    active: true
    generation_use: prohibited_as_template_or_semantic_anchor
    owner_signal: neutral
    reality_summary: historical screen only; freshness recheck required before future promotion

  - id: N086
    name: Lumerand
    role: held_internal
    active: true
    construction_strategy: longer_phonotactic_proper_name
    intrinsic:
      distinctiveness: high
      pronunciation: medium_good
      spelling_recovery: medium
      memorability: medium_good
      semantic_grounding: low
      semantic_room: high
      target_scale_fit: good
      architecture_fit: good
    architecture_test:
      - Lumerand Research
      - Lumerand Commons
      - Lumerand Tools
      - Lumerand / InteropAtlas
      - A project by Lumerand
    value_alignment: neutral_no_contradiction
    reality:
      screening:
        level: 1_plus_near_name_probe
        method_ref: reality-screening-contract-v0.3.3
        observed_at: 2026-09-11
        exact_result: no_material_active_exact_org_or_software_found_current_queries
        public_tm_signal: no_material_public_exact_signal_found_current_queries_not_formal_clearance
        near_name_result: yellow
        confidence: medium
      evidence_summary:
        - exact-name/company/software/research/public-TM query set did not surface a material active exact organization/software identity
        - near spelling Lumerant occurs as personal/surname usage
        - near spelling Lumirand occurs as a company/name and a micronation term; not strongly category-adjacent but relevant to dictation recovery
        - exact/near fictional and OCR noise exists and reduces search cleanliness
      domain:
        name: lumerand.org
        observation: available
        source: Namecheap bulk availability
        observed_at: 2026-09-11
        price_usd_observed: 8.48
      trademark_oriented_risk: public_signal_only_no_material_exact_found_formal_clearance_deferred
    diagnosis:
      - spelling_recovery_branch_risk
      - semantic_grounding_weak
      - surname_fantasy_identity_risk
    owner_exposure: not_ready

retired_recent_probes:
  - id: RND-061-NEW
    names: [Averandis, Talemere, Calidren, Orivane, Varenell, Navirent, Mirevane]
    summary: >-
      small longer-form independent probe; no candidate promoted. Failures included exact active business/software identities,
      one-letter highly adjacent IT identity, historical toxic/material trade-name association, cross-language adverse meaning,
      and recovery/near-name risk.
    evidence_summary:
      - Averandis was stopped on near-name screening because active Averantis Global Services is an IT/software business one-letter away
      - Orivane surfaced active software/product, business and live public trademark signals
      - Navirent is an active vehicle-rental business identity
      - Mirevane is an active ecommerce/store identity
      - Calidren surfaced historical use as an asbestos trade name/synonym and ambiguous prior web usage
      - Talemere has an established Kannada sense associated with boastful/proud behavior, creating unnecessary global semantic risk
      - Varenell is established as a surname and sits close to Varenelle, a prescription pharmaceutical name; recoverability/category association is weak

rounds:
  - id: RND-057-059
    action: reality_reset_grounding_and_short_form_search
    summary:
      - v0.3.3 hardened Reality Screening Contract after false negatives
      - truthful-root coinage improved provenance but remained namespace-crowded
      - short invented proper-name shells also showed heavy namespace saturation

  - id: RND-060
    action: longer_form_probe
    search_mode: exploration
    generated_count: small_probe
    findings:
      - slightly longer less-templated forms improved namespace yield somewhat
      - clean forms can drift toward surname/fantasy identity or weaker spoken recovery
      - Lumerand survived Level-1 screening and .org gate internally, but remained below Owner Exposure threshold
    next_action: stress_lumerand_and_run_one_independent_longer_form_microcycle

  - id: RND-061
    action: longer_form_microcycle_plus_regression_review
    search_mode: exploration
    generated_count: 7_new_internal_probes_plus_1_existing_stress_test
    selected_strategy_ids: [longer_phonotactic_proper_name, opaque_but_traceable_proper_name]
    findings:
      - no new candidate from the independent batch justified promotion
      - hardened reality screen caught both exact and near-name conflicts before domain checks
      - Lumerand remained materially cleaner than the new batch but has medium spelling-recovery / surname-fantasy risk
      - lumerand.org remained available on a fresh 2026-09-11 check
      - no new architecture/control defect appeared
      - naming difficulty is now primarily the search problem itself rather than an identified Skill-control failure
    integrity_check:
      reality_screen_contract_checked: true
      criteria_role_checked: true
      scheduler_monoculture_checked: true
      method_underuse_checked: true
      incumbent_anchoring_checked: true
      isolation_claim_checked: true
      owner_interaction_gate_checked: true
      progressive_disclosure_checked: true
      rescue_trigger_checked: true
    next_action: freeze_skill_baseline_continue_naming_search

observations:
  - id: O-R061-LENGTH
    scope: scheduler
    observation: longer forms modestly improve namespace yield but do not eliminate collision; recoverability and identity character become the counter-pressure
  - id: O-R061-REALITY
    scope: reality
    observation: the v0.3.3 Reality Screening Contract catches exact and one-letter/high-adjacency conflicts early enough to avoid misleading domain checks
  - id: O-R061-SKILL
    scope: method_fit
    observation: no new repeatable Controller defect appeared; remaining failures are candidate/search outcomes rather than evidence for further Skill expansion

diagnostics:
  - id: D-R061-01
    diagnosis_type: naming_search_frontier_not_method_failure
    statement: current bottleneck is locating a clean, recoverable, organization-scale identity; no new control-layer defect was found in RND-061
    confidence: high
    proposed_state_change: freeze_v0.3.3_fit_test_baseline_and_continue_search
  - id: D-R061-02
    diagnosis_type: lumerand_recoverability_risk
    statement: Lumerand is materially clean enough to keep internally but not strong enough for Owner Exposure because near-spelling recovery and surname/fantasy character remain unresolved
    confidence: medium_high

regression_review:
  file: 02_Runtime/02_Tools/adaptive_naming/evals/regression-review-v0.3.3-2026-09-11.md
  commit: dd9ca9d62402e1cda7ad2e8efeb67d2171865f66
  summary:
    exercised_pass: 13
    not_triggered_but_contract_present: 3
    fail: 0
  baseline_decision: freeze_v0.3.3_unless_new_repeatable_control_defect_appears

experience_candidates:
  - id: E-R057-REALITY-CONTRACT
    observation: negative reality claims need a minimum query contract and freshness rule; domain availability cannot substitute for identity screening
    scope: potentially_general
    confidence: high
    status: adopted_in_skill_v0.3.3
  - id: E-R061-LONGER-FORM
    observation: increasing phonotactic/structural distance can improve namespace yield, but recoverability and surname/fantasy identity risk must be measured separately
    scope: task_supported_not_yet_generalized
    confidence: medium
  - id: E-R061-NEAR-COLLISION
    observation: one-letter near identities in highly adjacent technology categories can invalidate an otherwise clean exact-name result before domain gating
    scope: potentially_general
    confidence: medium_high

execution:
  autonomous_microcycles: true
  module_policy: progressive_disclosure
  skill_change_policy: frozen_by_default_after_v0.3.3_regression_pass
  module_routing:
