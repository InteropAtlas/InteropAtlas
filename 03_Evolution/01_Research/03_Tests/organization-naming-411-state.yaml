search_landscape:
  initial_landscape_summary: >-
    Historical search shows a persistent frontier between highly recoverable natural/transparent identities that are heavily occupied,
    and higher-distance invented identities that gain namespace room but lose spelling recovery or drift toward surname/fantasy/SaaS character.
    White-space mapping therefore focuses on identity architecture between these poles rather than another undifferentiated word batch.
  prior_map_status: active_from_historical_evidence
  regions:
    - region_id: REG-LEXICAL-EXISTING
      semantic_position: [transparent, existing_concept]
      character_position: [natural, familiar]
      construction_position: [single_existing_word]
      collision_prior: high
      evidence_confidence: high
      quality_yield: medium_high
      reality_crowding: high
      information_gain: low
      sampling_status: sampled
      move_or_stay_rationale: historical existing-word probes repeatedly produced meaningful/recoverable names but strong exact/adjacent identities
    - region_id: REG-NATURAL-COMPOUND-PAIR
      semantic_position: [transparent_to_evocative]
      character_position: [recoverable, institutional_possible]
      construction_position: [english_compound, two_word_pair]
      collision_prior: high
      evidence_confidence: medium_high
      quality_yield: medium_high
      reality_crowding: high
      information_gain: medium
      sampling_status: sampled
      move_or_stay_rationale: RND-062/063 produced linguistically healthy forms but exact/adjacent identities were common; generic phrases also lacked proper-name distinctiveness
    - region_id: REG-GROUNDED-COINAGE
      semantic_position: [traceable, lightly_semantic]
      character_position: [proper_name]
      construction_position: [morpheme_grounded, derived, light_blend]
      collision_prior: high
      evidence_confidence: high
      quality_yield: medium_high
      reality_crowding: high
      information_gain: low
      sampling_status: sampled
      move_or_stay_rationale: truthful roots improved provenance but familiar morphemes and brand morphology were repeatedly independently reinvented
    - region_id: REG-SHORT-OPAQUE-COINED
      semantic_position: [opaque_to_light]
      character_position: [startup_like_risk]
      construction_position: [short_coinage, sound_first]
      collision_prior: medium_high
      evidence_confidence: medium_high
      quality_yield: mixed
      reality_crowding: high
      information_gain: low
      sampling_status: sampled
      move_or_stay_rationale: short invented shells remained crowded and often looked like software/startup names without enough organizational scale
    - region_id: REG-LONGER-PHONOTACTIC-PROPER
      semantic_position: [opaque_but_traceable_optional]
      character_position: [proper_name, surname_fantasy_risk]
      construction_position: [longer_coinage]
      collision_prior: medium
      evidence_confidence: medium
      quality_yield: medium
      reality_crowding: medium
      information_gain: medium
      sampling_status: sampled
      move_or_stay_rationale: namespace yield improved modestly, but spelling recovery and surname/fantasy identity became the dominant counter-pressure
    - region_id: REG-HYBRID-ANCHORED-PAIR
      semantic_position: [evocative, indirect_value_connection]
      character_position: [institutional_creative_balance]
      construction_position: [distinctive_modifier_plus_familiar_anchor, stable_two_part_identity]
      collision_prior: unknown
      evidence_confidence: medium_low
      quality_yield: low_medium
      reality_crowding: unknown
      information_gain: low_medium
      sampling_status: sampled_probe
      move_or_stay_rationale: RND-065 confirmed the anchor improves recovery, but all three probes weakened independent umbrella identity through generic institution/event/studio/field character before reality screening
    - region_id: REG-SEGMENTABLE-SEMI-OPAQUE
      semantic_position: [semantic_light, story_optional]
      character_position: [institutional_proper_name, non_fantasy_target]
      construction_position: [single_token_clear_segmentation, stable_orthography, non_latinate_shell]
      collision_prior: medium_high_preliminary
      evidence_confidence: low
      quality_yield: medium_high_preliminary
      reality_crowding: medium_high_preliminary
      information_gain: high
      sampling_status: sampled_probe_continue_guarded
      move_or_stay_rationale: RND-065 produced two intrinsically stronger and recoverable forms, but both top-slice candidates were decisively reality-blocked; one more small observe/update probe is justified before treating the region as exhausted
  semantic_coverage:
    - {value_id: V-COMMONS, status: sampled_indirectly}
    - {value_id: V-AGENCY, status: sampled_but_no_strong_clean_identity}
    - {value_id: V-CREATION, status: sampled_indirectly}
    - {value_id: V-RETURN, status: guardrail_only}
  online_updates:
    - {round: RND-062, update: broad architecture variety alone did not solve the frontier; reality crowding and intrinsic weakness remained distinct}
    - {round: RND-063, update: recoverable natural English region remains crowded; higher-distance region trades namespace space for recovery/identity-character risk}
    - {round: RND-064, update: two under-sampled architecture hypotheses identified between the dominant pressure fronts}
    - {round: RND-065, update: anchored-pair recovery benefit did not translate into independent umbrella identity; segmentable semi-opaque forms improved intrinsic identity but top-slice reality evidence was immediately crowded}
  integrity:
    survivor_shape_feedback_detected: false
    region_quality_reality_conflation_detected: false
    notes:
      - white-space hypotheses remain empirical search priors, not availability facts
      - raw reality survivor/failure shapes remain quarantined from Generator briefs

search_control:
  mode: exploration
  mode_rationale: no finalist exists; RND-065 narrowed the next high-information question to whether the segmentable region has any repeatable namespace yield beyond the first blocked top slice
  search_cadence:
    mode: micro_probe
    target_count: 3
    rationale: do not repeat the weaker anchored-pair branch; use one bounded segmentable observe/update probe before deciding whether to leave the region
    stop_condition: funnel first; stop the region if top intrinsic forms are again reality-blocked or if recoverability/scale deteriorates
  generation_isolation:
    level: best_effort_same_context
    runtime_identity: ChatGPT current conversation runtime
    historical_context_may_have_seen_controller_only_exclusions: true
    evidence:
      - current execution occurs in one persisted conversation context
      - no evidenced true isolated sub-agent or fresh Generator context is available in this runtime
    claim_policy: current brief may omit hidden material, but this runtime cannot claim it was never historically visible
  incumbent_isolation:
    comparison_only_candidate_ids: [N060]
  controller_only_exclusions:
    incumbent_candidate_ids: [N060]
    cooled_family_ids: [FAM-V34-01, FAM-RND046-01, FAM-RND051-01]
    owner_reaction_subject_ids: [N060]
    other: [N061_historical_hold_not_generation_seed, historical_reality_survivor_shapes]
  reality_feedback_quarantine:
    enabled_in_exploration: true
    same_batch_feedback_to_generator: prohibited
  post_generation_filter:
    enabled: true
    check_cooled_families: true
    check_incumbent_similarity: true
    check_strategy_fidelity: true
    check_other_controller_only_exclusions: true

