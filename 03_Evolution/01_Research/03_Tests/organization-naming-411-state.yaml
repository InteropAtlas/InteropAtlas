    Naming Job 未重新初始化，G0–G8 benchmark 未恢复。snapshot v38 及其全部 RND-054–056 working evidence 由
    commit c37f62548cac26aa5850aae368af3330af94a12d 保留。本快照记录 v0.3.3 Reality Screening Contract
    触发后的 reality false-negative 审计、grounded-root probe 与新的控制前沿。
  previous_snapshots:
    - {snapshot: 36, commit: 3348d1650e68404704b11097c10f0818c4adeae1}
    - {snapshot: 37, commit: 62a3d2508c73f32d8057a64b900e5d85a261804b}
    - {snapshot: 38, commit: c37f62548cac26aa5850aae368af3330af94a12d}

constraint_registry:
  confirmed_hard_constraints:
    - {id: HC-ORG-SCALE, statement: 名称必须承载 InteropAtlas 上层长期 umbrella organization，而非锁死为单一项目、协议、地图、平台或行业。, source_type: owner_explicit, source_ref: organization-vision}
    - {id: HC-RECOVERABILITY, statement: 避免明显高误读、高听写分叉；名称需具备可接受的口语与拼写恢复性。, source_type: owner_explicit, source_ref: prior-owner-feedback}
    - {id: HC-ORG-DOMAIN, statement: 最终 finalist 的同名普通 .org 可注册性为硬门槛；早期创意质量阶段不以此淘汰。, source_type: owner_explicit, source_ref: issue-411-policy}
  owner_preferences:
    - {id: PREF-LOW-MISREAD, statement: 更偏好不容易误读的名称。}
  controller_search_variables:
    - {id: SV-WORD-COUNT, name: word_count, current_value: open, allowed_values: [single_token, multiword, both], owner_approval_required_to_change: false}
    - {id: SV-SEMANTIC-TRANSPARENCY, name: semantic_transparency, current_value: adaptive, allowed_values: [transparent, light, opaque_but_traceable, mixed], owner_approval_required_to_change: false}
  assumptions: []

mission_value_model:
  source_refs: [organization-vision, issue-411-recovery]
  actors: [commons / public, individual, contributors / creators, projects / institutions]
  objects: [knowledge, perspective / interpretation, creation / discovery, shared public knowledge]
  transformations:
    - shared knowledge enables individual perspective
    - individual perspective enables creation / discovery
    - creation can return to the commons
    - returned knowledge supports another cycle
  relations_and_agency:
    - 公共知识属于共同体层面的共享资源；个人保有形成视角、解释与选择的自主性。
    - commons 与 individual agency 要同时保留，不能把“多人/多元”当成个人 agency 的替代。
  temporal_or_causal_structure:
    - Commons → Perspective → Creation → Commons ↺ is a feedback cycle, not four parallel keywords
  value_claims:
    - {id: V-COMMONS, statement: knowledge should remain part of a shared commons, evidence_type: explicit, value_type: end, priority: core, confidence: high}
    - {id: V-AGENCY, statement: individuals should retain interpretive perspective and choice, evidence_type: explicit, value_type: relation, priority: core, confidence: high}
    - {id: V-CREATION, statement: perspective should enable creation / discovery, evidence_type: structural, value_type: end, priority: high, confidence: high}
    - {id: V-RETURN, statement: creation can contribute back into shared knowledge, evidence_type: structural, value_type: procedural, priority: high, confidence: high}
    - {id: V-CONTINUITY, statement: the system should support durable renewal across cycles, evidence_type: structural, value_type: identity, priority: supporting, confidence: medium_high}
  value_relations:
    - {value_a: V-COMMONS, value_b: V-AGENCY, relation: balance}
    - {value_a: V-AGENCY, value_b: V-CREATION, relation: sequence}
    - {value_a: V-CREATION, value_b: V-RETURN, relation: sequence}
  naming_implications:
    - {value_id: V-COMMONS, mode: indirect}
    - {value_id: V-AGENCY, mode: indirect}
    - {value_id: V-CREATION, mode: indirect}
    - {value_id: V-RETURN, mode: guardrail_only}
    - {value_id: V-CONTINUITY, mode: optional_story}
  integrity:
    value_flattening_detected: false
    mission_overcompression_detected: false
    value_proxy_collapse_detected: false
    value_priority_invention_detected: false
    value_score_smuggling_detected: false

name_job_model:
  primary_jobs:
    - form a durable, independently recognizable umbrella-organization identity
    - support multiple projects / research / tools / education / publishing / public knowledge work
    - maintain acceptable spoken and written recoverability
    - leave enough semantic room for long-term brand meaning
  secondary_jobs:
    - establish a truthful connection to one or a few core values / structural relations when possible
    - carry enough memorability, institutional scale and creative energy
  non_jobs:
    - the bare name does not need to encode the full Commons → Perspective → Creation → Commons loop
    - the bare name does not need to enumerate future activities
    - the name alone does not carry the whole mission narrative
  tensions:
    - distinctiveness ↔ recoverability
    - semantic grounding ↔ ownable identity
    - institutional scale ↔ creative energy
  status: active

decision_criteria:
  items:
    - {id: C-SCALE, statement: long-term umbrella organization scale, role: gate, source_ref: HC-ORG-SCALE, confidence: high}
    - {id: C-RECOVERY, statement: low-to-acceptable pronunciation / dictation burden, role: optimize, source_ref: HC-RECOVERABILITY, confidence: high}
    - {id: C-DISTINCT, statement: independent proper-name identity, role: optimize, source_ref: name-job-model, confidence: high}
    - {id: C-VALUE, statement: no contradiction with Mission / Value Model and preferably a truthful connection, role: optimize, source_ref: mission-value-model, confidence: high}
    - {id: C-DOMAIN, statement: exact ordinary .org available for finalist, role: gate, source_ref: HC-ORG-DOMAIN, confidence: high}
    - {id: C-OWNER, statement: Owner long-term resonance, role: prefer, source_ref: owner-preference, confidence: medium}
    - {id: C-TM, statement: formal trademark-oriented clearance, role: observe, source_ref: owner-deferred-policy, confidence: high}
  integrity: {role_confusion_detected: false, role_drift_detected: false}

optional_modules:
  territory_research:
    status: completed_for_current_trigger
    trigger: RND-054 multi-method portfolio still collapsed toward common lexical/material pool
    learning:
      - structural analogies were more useful than literal source-domain vocabulary
      - direct territory tokens remained namespace-crowded
  communication_load_allocation: {status: inactive}
  decision_hygiene: {status: ready_on_trigger, trigger: high-value shortlist / Owner Exposure, independent_first_pass: true}
  temporal_evaluation: {status: inactive}
  validation_research: {status: inactive}
  naming_scope: {status: satisfied, object_role: standalone_umbrella_organization_brand}
  activation_governance: {status: deferred, trigger: finalist selected / rollout needed}

search_control:
  mode: exploration
  mode_rationale: >-
    v0.3.3 reality audit invalidated the apparent low-collision survivors from RND-056. Current task is no longer to stress-test those survivors;
    it is to improve identity distinctiveness under a hardened reality contract without drifting into random/empty branding or mission over-compression.
  generation_isolation:
    level: best_effort_same_context
    runtime_identity: ChatGPT current conversation runtime
    historical_context_may_have_seen_controller_only_exclusions: true
    claim_policy: current brief may omit controller-only exclusions, but this runtime cannot claim the model never saw them historically
  incumbent_isolation:
    comparison_only_candidate_ids: [N060]
  controller_only_exclusions:
    incumbent_candidate_ids: [N060]
    cooled_family_ids: [FAM-V34-01, FAM-RND046-01, FAM-RND051-01]
    owner_reaction_subject_ids: [N060]
    other: [N061_historical_hold_not_generation_seed, historical_reality_survivor_shapes]
  reality_feedback_quarantine:
    enabled_in_exploration: true
    same_batch_feedback_to_generator: prohibited
  post_generation_filter:
    enabled: true
    check_cooled_families: true
    check_incumbent_similarity: true
    check_strategy_fidelity: true
    check_other_controller_only_exclusions: true

reality_screening:
  method_ref: reality-screening-contract-v0.3.3
  last_audit_round: RND-057
  status: hardened_after_false_negative
  minimum_level_for_held_or_promising: 1
  freshness_recheck_before_owner_exposure: true
  false_negative_detected: true
  same_batch_survivors_rechecked: true

method_scheduler:
  policy: adaptive_portfolio
  active_strategies:
    - strategy_id: opaque_but_traceable_proper_name
      family: controlled_coinage
      status: active
      rationale: still useful, but promotion now requires hardened reality screening
    - strategy_id: sound_first
      family: controlled_coinage
      status: active
      rationale: identity space is larger, but short familiar startup-like phonotactics are proving crowded
    - strategy_id: morpheme_grounded_coinage
      family: compositional_derived
      status: deprioritized
      rationale: RND-058 showed that truthful roots plus familiar brand morphology can remain heavily occupied; grounding remains useful but not as a mandatory construction source
    - strategy_id: longer_phonotactic_proper_name
      family: controlled_coinage
      status: active
      rationale: test greater identity distance while preserving recoverability and organization scale
    - strategy_id: transformation_operator
      family: transformation_operator
      status: rescue_only
      rationale: no current seed passes rescue trigger criteria
  diagnostics:
    scheduler_monoculture: false
    method_underuse: false
    territory_material_starvation: partially_resolved
    notes:
      - semantic grounding is a secondary Name Job objective, not a gate; do not force every new name to encode mission or etymology
      - short pronounceable Latin-ish / startup-like forms themselves appear highly crowded and should not dominate the next portfolio

transformation_rescue:
  active_branches: []
  rescue_overfit_detected: false
  seed_audit:
    status: complete_current_pool
    result: no_branch_opened

