brief:
  object: InteropAtlas上层长期umbrella organization；可承载多个项目、研究、工具、公共知识工作与创造活动。
  semantic_core: [公共共同体的共享知识, 个人视角、解释与选择, 视角产生创造与发现, 创造回到公共知识并支持下一轮]
  architecture_requirements: ['[Name]', '[Name] Research', '[Name] Commons', '[Name] Tools', '[Name] / InteropAtlas', 'A project by [Name]']
  quality_requirements:
  - 低误读、低听写分叉；Owner明确偏好不要容易误读的名称
  - 与愿景关系可在一两句内自然说明，不靠虚构词源
  - 架构测试先判断呈现的组织身份类型，再判断语法是否可拼接
  - 长期母组织尺度，不被单一工作室、平台、材料、行业或项目锁定
  reality_constraints:
    finalist_domain_gate: 同名普通可注册.org为finalist硬门槛；不作为早期创意质量淘汰条件
    trademark_screening_current_policy: deferred_by_owner_for_now
    trademark_defer_interpretation: 跳过不等于通过；最终采用/注册动作前应恢复筛查。
current_status:
  strongest_candidates: []
  promising_candidates: []
  finalists: []
  owner_review_needed_now: false
  biggest_unknown: 下一轮能否在保持语义契合的同时，避免Pluralway暴露出的词界解析不稳、方法/路径导向过强和字面语法张力，并恢复长期母组织尺度。
  information_gain: Owner首次真实曝光给出负向结构性反馈。Pluralway意思没有偏离核心方向，但视觉/语音会先触发subway、always等既有词块，导致词界不知道如何断；way首先被读为道路/达成目标的方法，使名称偏方法导向且容易被简化为任何组织都可套用的“多元方法”；此外若 intended meaning 是 multiple ways，则正常英语需要 plural ways，使品牌Pluralway与叙事One commons, plural ways之间出现轻微字面语法错位。
