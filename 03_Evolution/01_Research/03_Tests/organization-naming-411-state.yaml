    role: owner_ready_provisional_pending_formal_tm
    active: true
    morphotype: established_concept_single_word
    intrinsic_case:
      - established word for multivoiced / multiple-voice or multiple-meaning expression
      - shorter and visually lighter than N128 while retaining conceptual depth
      - coherent single-word brand/organization form
      - semantically adjacent to plural perspectives without literal mission wording
    domain_status:
      com: available_for_registration_2026_09_11
      org: available_for_registration_2026_09_11
    reality_status: preliminary_pass_academic_usage_no_material_exact_commercial_identity_found
    trademark_status: preliminary_no_obvious_exact_signal_found_formal_clearance_pending
    risks:
      - may overemphasize voice/discourse relative to broader creation/knowledge mission
