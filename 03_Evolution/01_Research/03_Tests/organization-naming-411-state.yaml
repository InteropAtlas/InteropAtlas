schema_version: '0.4.0'

task:
  issue: 411
  repository: InteropAtlas/InteropAtlas
  branch: feat/adaptive-naming-skill-v0.1
  mode: Adaptive Naming Fit Test
  status: in_progress
  snapshot_version: 77
  skill_version: 0.4.0

lineage:
  preservation_note: >-
    Naming Job 未重新初始化，G0–G8 benchmark 未恢复。snapshot v76 记录 N129 Plurivocal 与 N130 Merosophy。
    Owner 随后明确：未来正式候选不再优先使用现成词，因商业母组织更重视商标可注册性与可保护性；主路线转为自造词/半自造专名，
    但要求有清晰语义骨架、自然读写，不接受随机 SaaS 音节串。Owner 对 N130 Merosophy 的反馈为：整体可以用、看起来没大问题，
    主要缺点是中国人念起来比较费劲。本快照据此提高跨语言可读性/发音恢复权重。

constraint_registry:
  confirmed_hard_constraints:
    - {id: HC-ORG-SCALE, statement: long-term umbrella organization scale, source_type: owner_explicit}
    - {id: HC-RECOVERABILITY, statement: avoid obvious high misread / dictation branching, source_type: owner_explicit}
    - id: HC-COM-DOMAIN
      statement: exact .com must be practically obtainable for the commercial umbrella organization; direct registration preferred, aftermarket purchase acceptable when realistic
      source_type: owner_explicit
      primary_domain: .com
    - id: HC-TM-REGISTRABILITY
      statement: finalist must have a good trademark-registration outlook for long-term commercial organization use
      source_type: owner_explicit
      priority_jurisdictions: [US, EU, CN, WIPO_Madrid]
    - {id: HC-ORG-SECONDARY, statement: .org is secondary and mainly intended for open-source/public-interest projects, source_type: owner_explicit}

owner_preferences:
  - {id: PREF-MEANING-FIRST, statement: meaningfulness and overall identity quality outrank shortness; longer names are acceptable when worthwhile, confidence: high}
  - {id: PREF-EXPRESSION-STABLE-MODERN, statement: stable, harmonious, reliable; youthfulness welcome when dependable, confidence: high}
  - {id: PREF-COMPACT-SPOKEN-RHYTHM, statement: shorter spoken effort is secondary overall, but excessive length/visual burden is a real negative; Multifinality felt acceptable while Transindividuality felt too long, confidence: high, priority: secondary_with_upper_bound_signal}
  - {id: PREF-RHYTHMIC-SYMMETRY, statement: balanced spoken structure is optional bonus, confidence: high}
  - {id: PREF-VISUAL-SYMMETRY-CYCLE, statement: visual symmetry/cycle echo is optional bonus, confidence: high}
  - {id: PREF-UNDERSTATED-CLEVERNESS, statement: restrained second-look reward attractive; showy gimmick not, confidence: high}
  - {id: PREF-MORPHOTYPE-OPENNESS, statement: preserve broad form diversity; no single naming architecture should dominate Owner-visible exploration absent evidence of preference, confidence: high}
  - {id: PREF-NONPERSONAL-BRAND-IDENTITY, statement: personal given-name reading is a soft negative, confidence: medium_high}
  - {id: PREF-CONCEPTUAL-BRANDABILITY, statement: established concept words may still be attractive as preference evidence, but formal candidate generation should now prioritize coined/semi-coined proprietary names, confidence: high}
  - id: PREF-CROSS-LANGUAGE-PRONOUNCEABILITY
    statement: >-
      Commercial names should be reasonably pronounceable by Chinese speakers from spelling and recoverable from hearing; Merosophy is acceptable overall but has noticeable Chinese-speaker pronunciation friction.
    source_type: owner_explicit_reaction
    confidence: high

search_control:
  mode: coined_semantic_brand_divergence
  generation_isolation:
    level: best_effort_same_context
    claim_policy: sanitized positive briefs only; no literal blindness claim
  finalist_template_use: prohibited
  reality_feedback_quarantine: {enabled: true, raw_failed_strings_to_generator: prohibited}
  early_creative_policy: >-
    Prioritize coined or semi-coined proprietary names with semantic backbone, natural orthography and cross-language pronounceability. Existing dictionary/concept words remain research material, not the dominant finalist source. .com, identity and trademark remain post-generation filters.

morphotype_portfolio:
  rule: no_single_form_class_should_dominate
  priority_classes:
    - semiopaque_root_derived_proper_name
    - semantically_motivated_fusion
    - coined_single_token_with_clear_morpheme_backbone
    - symbolic_or_structural_coinage
    - crosslanguage_root_fusion_with_high_pronounceability
  lower_priority_classes:
    - established_dictionary_or_concept_word
    - transparent_english_phrase
  evaluation_policy: >-
    Coined does not mean random. Every promoted coinage should have a coherent semantic rationale, strong recoverability, natural brand shape, and acceptable Chinese/English pronunciation burden.

rounds:
  - {id: RND-124, action: shorter_true_concept_and_semiopaque_search, result: two_materially_distinct_survivors}
  - id: RND-125
    action: owner_shifts_priority_to_proprietary_coinage
    result: coined_name_route_promoted
    findings:
      - Owner prefers not to rely on existing words because trademark registrability/protectability is a core commercial requirement
      - existing words are not globally forbidden but are deprioritized as primary finalist sources
      - coined/semi-coined names must retain semantic backbone and naturalness rather than become random SaaS syllables
  - id: RND-126
    action: owner_reaction_to_merosophy
    result: acceptable_with_cross_language_pronunciation_risk
    findings:
      - Owner says Merosophy looks acceptable and could be used
      - no major intrinsic objection was expressed
      - main negative is that Chinese speakers may find it relatively hard to pronounce
      - this supports adding cross-language pronounceability/recoverability as a meaningful evaluation weight

candidates:
  - id: N130
    name: Merosophy
    role: owner_positive_usable_with_pronunciation_risk
    active: true
    morphotype: semiopaque_root_derived_proper_name
    domain_status:
      com: available_for_registration_2026_09_11
      org: available_for_registration_2026_09_11
    reality_status: preliminary_pass_no_material_exact_identity_found
    trademark_status: preliminary_strong_ownability_signal_formal_clearance_pending
    owner_feedback: acceptable_usable_but_chinese_pronunciation_is_difficult
    strengths: [brand_like, proprietary, semantically_explainable, good_preliminary_ownability]
    risks: [cross_language_pronunciation_friction, semantic_backbone_not_self_evident, mild_philosophical_tone]
    generation_use: prohibited_as_template_or_seed
  - id: N129
    name: Plurivocal
    role: research_reference_deprioritized_existing_word
    active: false
    reason: existing_word_route_deprioritized_for_commercial_trademark_strategy
    generation_use: prohibited_as_template_or_seed
  - id: N127
    name: Multifinality
    role: preference_evidence_only_aftermarket_pending
    active: true
    owner_feedback: interesting_looks_good_feels_like_brand
    generation_use: prohibited_as_template_or_seed
  - id: N128
    name: Transindividuality
    role: owner_rejected_length
    active: false
    owner_feedback: too_long_not_liked
    generation_use: prohibited_as_template_or_seed

current_state:
  owner_positive_commercial_candidates: [N130]
  preference_evidence: [N127]
  owner_rejected: [N128]
  search_mode: coined_semantic_brand_divergence
  biggest_unknown: >-
    Can a proprietary coined/semi-coined name match or exceed Merosophy's brandability and ownability while being easier for Chinese speakers to pronounce and recover, without becoming semantically empty or SaaS-generic?
  blockers: []
  owner_review_needed_now: false

next_action:
  action: continue_semantic_coinage_with_cross_language_pronounceability
  rationale: >-
    Search for proprietary names with clear semantic construction, lower Chinese-speaker pronunciation friction, exact .com obtainability, and strong trademark prospects. Do not clone Merosophy's -sophy ending or its specific roots.
  requires_owner: false_for_continued_search

stop:
  status: continue
  reason: Owner accepted N130 conditionally and provided a useful new cross-language filter; further creation should continue autonomously
