  architecture_requirements:
  - '[Name]'
  - '[Name] Research'
  - '[Name] Commons'
  - '[Name] Tools'
  - '[Name] / InteropAtlas'
  - A project by [Name]
  communication_targets:
  - 让组织可辨识、可传播、可承载多项目；不要求裸名说明全部使命
  desired_character:
  - 长期、开放、有独立身份、允许未来赋义
  pronunciation_requirements:
  - 记录意向发音与可能歧义；区分Agent语言判断与真实听读测试
  semantic_core:
  - 公共共同体的共享知识
  - 个人视角、解释与选择
  - 视角产生创造与发现
  - 创造回到公共知识并支持下一轮
  spelling_requirements:
  - 记录听写恢复与视觉拼写负担，双写/改写不预先禁用
