  actors:
  - 公共知识共同体
  - 具有自身视角的个人
  - 创造者/贡献者
  - 可承载多项目的母组织
  objects:
  - 共享知识
  - 个人视角与解释
  - 创造/发现
  - 可回流和再利用的知识
  transformations:
  - 共享知识支持个人形成视角
  - 个人视角支持理解、选择与创造
  - 新创造可以回流公共知识
  - 公共积累支持下一轮理解与创造
  relations_and_agency:
  - 共享的是知识基础，不要求个人形成同一视角。
  - 公共知识与个人解释自主性需同时保留，不能把多人/多元代替个人能动性。
  temporal_or_causal_structure:
  - Commons → Perspective → Creation → Commons ↺；保留循环与转换关系，而非四个词的并列。
  desired_world:
  - 公共知识可积累与再利用；个人从中形成独立理解和创造，创造可继续贡献公共积累。
  anti_values_or_non_goals:
  - 不把母组织锁死为单一标准、协议、地图、产品或 InteropAtlas 本身。
  - 不要求名称逐字解释整个使命循环。
  value_claims:
  - id: V-COMMONS
    statement: 知识作为共享公共基础。
    source_ref: VISION
    evidence_type: explicit
    explicit_in: repository_document_not_verified_owner_quote
    priority: unknown
  - id: V-AGENCY
    statement: 个人保有自身视角和解释空间。
    source_ref: VISION
    evidence_type: explicit
    explicit_in: repository_document_not_verified_owner_quote
    priority: unknown
  - id: V-CREATION
    statement: 知识与个人视角支持创造/发现。
    source_ref: VISION
    evidence_type: structural
    priority: unknown
  - id: V-RETURN
    statement: 新创造可以回到公共积累。
    source_ref: VISION
    evidence_type: structural
    priority: unknown
  - id: V-CONTINUITY
    statement: 循环可支持长期积累和更新。
    source_ref: MODEL36
    evidence_type: derived
    priority: unknown
  value_relations:
  - V-COMMONS 与 V-AGENCY 并存，而非二选一。
  - V-AGENCY → V-CREATION → V-RETURN → 新一轮公共积累。
  naming_implications:
  - 价值模型是理解与对齐依据，不是必须拼接的词根池。
  - 完整使命由名称之外的叙事、说明与组织实践共同承载。
  value_coverage_status: unknown_current_no_sampling_metrics_reconstructed
  limits: 这是有来源的结构化重建；没有新定价值排序、政治/法律立场、知识许可或强制回馈义务。
