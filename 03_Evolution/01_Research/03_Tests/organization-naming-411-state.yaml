schema_version: '0.4.0'

task:
  issue: 411
  repository: InteropAtlas/InteropAtlas
  branch: feat/adaptive-naming-skill-v0.1
  mode: Adaptive Naming Fit Test
  status: in_progress
  snapshot_version: 62
  skill_version: 0.4.0

lineage:
  preservation_note: >-
    Naming Job 未重新初始化，G0–G8 benchmark 未恢复。snapshot v61 记录 expanded white-space search。
    本快照吸收 Owner 新反馈：shortness is a preference, not a requirement; semantic meaning and long-term identity quality outrank compactness.
    由此扩大到中等长度、意义更完整的 organization-scale constructions，并首次得到新的 Owner-ready survivor。
    完整历史、旧轮次和 reality evidence 继续由 Git history 与 Issue #411 保留。

constraint_registry:
  confirmed_hard_constraints:
    - {id: HC-ORG-SCALE, statement: long-term umbrella organization scale, source_type: owner_explicit}
    - {id: HC-RECOVERABILITY, statement: avoid obvious high misread / dictation branching, source_type: owner_explicit}
    - {id: HC-ORG-DOMAIN, statement: exact ordinary .org availability is a finalist hard gate but not an early creative filter, source_type: owner_explicit}
  owner_preferences:
    - {id: PREF-MEANING-FIRST, statement: meaningfulness and overall identity quality outrank shortness; longer names are acceptable when the meaning is worthwhile, source_type: owner_explicit, confidence: high}
    - {id: PREF-EXPRESSION-STABLE-MODERN, statement: stable, harmonious, reliable; youthfulness welcome when dependable, confidence: high}
    - {id: PREF-COMPACT-SPOKEN-RHYTHM, statement: shorter spoken effort remains preferred when natural, but no longer receives strong optimization pressure or acts as an implicit gate, confidence: high, priority: secondary}
    - {id: PREF-RHYTHMIC-SYMMETRY, statement: balanced spoken structure is an optional bonus, confidence: high}
    - {id: PREF-VISUAL-SYMMETRY-CYCLE, statement: visual symmetry / cycle echo is an optional bonus, confidence: high}
    - {id: PREF-UNDERSTATED-CLEVERNESS, statement: restrained second-look reward attractive; showy gimmick not, confidence: high}
    - {id: PREF-MORPHOTYPE-OPENNESS, statement: no broad form taboo observed; preserve form diversity, confidence: medium_high}
    - {id: PREF-NONPERSONAL-BRAND-IDENTITY, statement: personal given-name reading is a soft negative, confidence: medium_high}
    - {id: PREF-INITIAL-RCO, statement: R/C/O initial effect remains observational only, confidence: low_medium}

mission_value_model:
  core_structure: Commons -> Perspective -> Creation -> Commons
  structural_naming_implications:
    - cycle_or_return may be expressed semantically or structurally
    - restrained semantic double reading may express transformation/return
    - name need not encode complete mission

expression_profile:
  baseline: meaningful + stable-modern + easy-to-hold + organization-scale + recoverable + non-personal
  secondary_preferences: [compactness, rhythmic_balance]
  optional_bonuses: [visual_cycle_echo, understated_cleverness]
  anti_overfit: [do_not_force_shortness, do_not_force_RCO, do_not_force_palindrome, do_not_force_blend]

search_control:
  mode: meaning_first_form_diverse_generation
  search_cadence:
    mode: portfolio_batch
    target: materially expand Owner-ready choice space while preserving semantic depth and reality viability
  generation_isolation:
    level: best_effort_same_context
    claim_policy: sanitized positive briefs only; no literal blindness claim
  finalist_template_use: prohibited
  reality_feedback_quarantine: {enabled: true, raw_failed_strings_to_generator: prohibited}

rounds:
  - id: RND-101
    action: owner_shortness_relaxation_ingest
    result: search_window_expanded
    findings:
      - shortness remains positive but is subordinate to meaning
      - medium-length names may enter formal search when rhythm/recoverability remain acceptable
      - previous four-beat preference must not be treated as an implicit gate
  - id: RND-102
    action: meaning_first_semantic_double_reading_portfolio
    result: one_new_owner_ready_survivor
    findings:
      - longer search window produced several meaningful relational/semantic constructions with exact .org availability
      - most remain generic, weakly ownable, or semantically less distinctive
      - Common Refrain showed the strongest combined intrinsic + Owner-profile fit and survived preliminary public identity screening
  - id: RND-103
    action: common_refrain_preliminary_reality_screen
    result: provisional_pass
    evidence:
      exact_active_identity: no_material_exact_active_company_organization_project_or_software_found_in_current_public_web_search
      trademark_public_web_signal: no_material_exact_public_signal_found; not formal legal clearance
      domain:
        queried: commonrefrain.org
        observation: available
        source: Namecheap exact availability signal
        observed_at: 2026-09-11
        price_usd: 8.48
    risks:
      - Common Refrain is an ordinary English collocation meaning a recurring statement/phrase, so source-distinctiveness and trademark strength may be weaker than a coined proper name
      - common can also mean ordinary; refrain can also mean abstain/hold back
      - public web trademark screening is preliminary only

candidates:
  - {id: N096, name: Open Regard, role: finalist_baseline, active: true, generation_use: prohibited_as_template}
  - {id: N113, name: Public Singular, role: finalist_hold, active: true, generation_use: prohibited_as_template}
  - {id: N117, name: See Otherwise, role: finalist_owner_ready, active: true, generation_use: prohibited_as_template}
  - {id: N119, name: Elseground, role: finalist_owner_ready, active: true, generation_use: prohibited_as_template}
  - id: N121
    name: Common Refrain
    role: finalist_owner_ready_provisional
    active: true
    morphotype: semantic_double_reading_relational_phrase
    intrinsic_case:
      - Common directly touches shared/common knowledge without naming a specific product or standard
      - Refrain means a recurring line/chorus and naturally carries return/cycle imagery
      - the established phrase common refrain creates a restrained second-look double meaning rather than conspicuous wordplay
      - spoken shape is compact for a two-word name (roughly 2+2 syllabic rhythm) and balanced
      - organization-scale semantics remain broad enough for research, education, software, publishing and multiple projects
    owner_profile_fit:
      stable_modern: strong
      meaning_first: strong
      recoverability: strong
      rhythmic_balance: strong_bonus
      cycle_return_fit: strong_bonus
      understated_cleverness: strong_bonus
      personal_name_risk: low
    reality_status: preliminary_pass
    domain_status: commonrefrain.org_available_2026_09_11
    generation_use: prohibited_as_template
  - {id: N060, name: Plurifold, role: comparison_only, active: true, generation_use: prohibited_as_template_or_semantic_anchor}
  - {id: N086, name: Lumerand, role: held_internal, active: true, owner_exposure: not_ready}

method_evolution:
  registry_ref: 02_Runtime/02_Tools/adaptive_naming/evolution/method-experience-registry.yaml
  hypothesis_id: HYP-004
  stable_skill_rewrite_allowed_now: false
  latest_note: Owner preference calibration must remain revisable; explicit Owner feedback can lower a previously strong preference (compactness) without changing true hard constraints.

current_state:
  finalists: [N096, N113, N117, N119, N121]
  new_owner_ready_candidate: N121
  search_mode: meaning_first_form_diverse_generation
  biggest_unknown: Owner reaction to N121 and whether additional meaning-first medium-length architectures can produce peers with stronger source distinctiveness.
  blockers: []
  owner_review_needed_now: true

next_action:
  action: expose_N121_to_owner_and_continue_peer_search
  rationale: >-
    N121 materially expands the choice space and is the first post-preference-calibration candidate to survive intrinsic, recoverability, preliminary reality and exact .org checks.
    Owner reaction is now decision-relevant, but search should continue for peers because N121's ordinary-collocation nature may limit trademark/source distinctiveness.
  requires_owner: true_for_reaction_not_for_continued_internal_search

stop:
  status: owner_feedback_plus_continue
  unresolved:
    - N121 needs Owner reaction
    - stronger formal trademark clearance remains deferred
    - peer candidates with greater source distinctiveness are still desirable
    - true isolated generation runtime remains unavailable
