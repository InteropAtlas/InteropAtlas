constraint_registry:
  confirmed_hard_constraints:
    - {id: HC-ORG-SCALE, statement: long-term umbrella organization scale, source_type: owner_explicit}
    - {id: HC-RECOVERABILITY, statement: avoid obvious high misread / dictation branching, source_type: owner_explicit}
    - {id: HC-ORG-DOMAIN, statement: exact ordinary .org availability is a finalist hard gate but not an early creative filter, source_type: owner_explicit}
  owner_preferences:
    - {id: PREF-EXPRESSION-STABLE-MODERN, statement: stable, harmonious, reliable; youthfulness welcome when dependable, confidence: high}
    - {id: PREF-COMPACT-SPOKEN-RHYTHM, statement: short spoken effort preferred; ideal about 4 perceived beats and generally about 5 or fewer, confidence: high}
    - {id: PREF-RHYTHMIC-SYMMETRY, statement: balanced spoken chunks / stress / corresponding sound structure preferred, confidence: high}
    - {id: PREF-VISUAL-SYMMETRY-CYCLE, statement: visual symmetry or near-palindromic balance is a meaningful optional bonus, especially when it can echo cycle/return, confidence: high}
    - {id: PREF-UNDERSTATED-CLEVERNESS, statement: restrained semantic or structural trick / second-look reward is attractive; showy gimmick is not, confidence: high}
    - {id: PREF-MORPHOTYPE-OPENNESS, statement: no broad form taboo observed; preserve form diversity, confidence: medium_high}
    - {id: PREF-NONPERSONAL-BRAND-IDENTITY, statement: strong personal given-name reading reduces appeal, confidence: medium_high}
    - {id: PREF-INITIAL-RCO, statement: R/C/O initials may feel reassuring but remain observational only, confidence: low_medium, usage: observe_only_not_generation_rule}

mission_value_model:
  core_structure: Commons -> Perspective -> Creation -> Commons
  structural_naming_implications:
    - cycle_or_return_may_be_carried_by_visual_or_phonological_structure
    - subtle_semantic_compression_may_carry transformation / know-new style relations

neutral_probe_2:
  round_id: RND-089
  sample_status: preference_probe_only_not_candidates
  samples:
    - {id: A, name: Rovor, owner_reaction: positive, notes: symmetry noticed and considered interesting}
    - {id: B, name: Rovek, owner_reaction: positive, notes: has a wink-like feel; interesting}
    - {id: C, name: Nolon, owner_reaction: mildly_positive, notes: acceptable but no clear reason or strong pull}
    - {id: D, name: Norel, owner_reaction: acceptable_neutral, notes: can accept; no special feeling}
    - {id: E, name: Ovelo, owner_reaction: positive, notes: interesting}
    - {id: F, name: Ovelin, owner_reaction: neutral, notes: ordinary}
    - {id: G, name: Noven, owner_reaction: neutral, notes: ordinary}
    - {id: H, name: Teral, owner_reaction: slightly_above_neutral, notes: only a little better than average}
  findings:
    - symmetry produces positive pull when it also creates a distinctive but natural identity; Rovor outperforms flatter controls
    - symmetry alone is insufficient: Nolon remains only mildly positive
    - understated wink / second-look character is independently attractive when recoverability remains easy; Rovek confirms this direction
    - compactness remains baseline but does not by itself create pull
    - Ovelo outperforms Ovelin, suggesting visual/rhythmic compactness plus distinctive shape matters more than simple phonological smoothness
    - Owner preference cluster is now sufficiently calibrated to resume formal generation without another probe

expression_profile:
  status: calibrated_ready_for_generation
  desired_axes:
    stability: high
    harmony: high
    reliability: high
    modernity: medium_high
    compact_spoken_identity: high
    easy_memorability: high
    nonpersonal_brand_identity: high
    rhythmic_balance: high_optional_bonus
    visual_balance_or_cycle_echo: medium_high_optional_bonus
    understated_cleverness: medium_high_optional_bonus
    showiness_or_gimmick: low
  interpretation:
    - compact + brand-like + easy-to-hold identity is the baseline
    - symmetry and restrained cleverness are real positive bonuses, but only when natural
    - personal-name reading is a soft negative
    - no morphotype class should be closed; preserve meaningful form diversity
    - R/C/O initials remain too weak for intentional bias

search_control:
  mode: form_diverse_generation_reallocated
  search_cadence:
    mode: portfolio_batch
    target: 4_to_6 material_owner_ready_finalists with morphotype diversity
    stop_condition: new owner-ready candidate(s) materially expand the choice space, or sampled forms fail intrinsic/reality gates with low information gain
  generation_isolation:
    level: best_effort_same_context
    claim_policy: sanitized logical briefs only; no literal blindness claim
  finalist_template_use: prohibited
  reality_feedback_quarantine: {enabled_in_exploration: true, same_batch_feedback_to_generator: prohibited}

workflow_scheduler:
  active_patterns:
    - {pattern_id: category_parallel, status: active, question_to_answer: can distinct morphotypes produce compact stable-modern brand identities under the calibrated Owner profile?}
    - {pattern_id: creative_linguistic_parallel, status: active_support, question_to_answer: can cleverness/symmetry survive recoverability checks without collapsing creativity?}

method_scheduler:
  priority_morphotypes:
    - MT-LEXICAL-SINGLE
    - MT-BLEND
    - MT-ROOT-DERIVED
    - MT-OPAQUE-COINAGE
    - MT-NONENGLISH-LEXICAL
    - MT-TYPOGRAPHIC-SYMBOLIC
  preserve_minor_budget:
    - MT-PHRASE
    - MT-TRANSPARENT-COMPOUND
  task_local_preferences_not_templates:
    - compact_stable_modern
    - natural_symmetry
    - restrained_second_look_reward

