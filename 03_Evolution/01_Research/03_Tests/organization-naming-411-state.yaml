schema_version: '0.4.0'

task:
  issue: 411
  repository: InteropAtlas/InteropAtlas
  branch: feat/adaptive-naming-skill-v0.1
  mode: Adaptive Naming Fit Test
  status: in_progress
  snapshot_version: 81
  skill_version: 0.4.0

lineage:
  preservation_note: >-
    Naming Job 未重新初始化，G0–G8 benchmark 未恢复。snapshot v80 在试图提高语义密度时再次发生明显 morphotype collapse：
    多个候选围绕同一组古典词根与 mero-/noe-/poie- 等语源、相似抽象尾缀和 X+抽象后缀结构旋转。
    Owner 明确指出这一批整体过于相似，并判断 Controller 偷懒。该判断成立：这是对 Merosophy 正向信号的过拟合，而不是合理收敛。
    本快照将其记录为新的执行完整性事件，并强制下一轮做结构级 reset，而不是继续局部仿写。

constraint_registry:
  confirmed_hard_constraints:
    - {id: HC-ORG-SCALE, statement: long-term umbrella organization scale, source_type: owner_explicit}
    - {id: HC-RECOVERABILITY, statement: avoid obvious high misread / dictation branching, source_type: owner_explicit}
    - id: HC-COM-DOMAIN
      statement: exact .com must be practically obtainable for the commercial umbrella organization; direct registration preferred, aftermarket purchase acceptable when realistic
      source_type: owner_explicit
      primary_domain: .com
    - id: HC-TM-REGISTRABILITY
      statement: finalist must have a good trademark-registration outlook for long-term commercial organization use
      source_type: owner_explicit
      priority_jurisdictions: [US, EU, CN, WIPO_Madrid]
    - {id: HC-ORG-SECONDARY, statement: .org is secondary and mainly intended for open-source/public-interest projects, source_type: owner_explicit}

owner_preferences:
  - {id: PREF-MEANING-FIRST, statement: meaningfulness and overall identity quality outrank shortness; longer names are acceptable when worthwhile, confidence: high}
  - {id: PREF-EXPRESSION-STABLE-MODERN, statement: stable, harmonious, reliable; youthfulness welcome when dependable, confidence: high}
  - {id: PREF-COMPACT-SPOKEN-RHYTHM, statement: excessive visual/spoken burden is a real negative, but compactness cannot replace meaning, confidence: high}
  - {id: PREF-UNDERSTATED-CLEVERNESS, statement: restrained second-look reward attractive; showy gimmick not, confidence: high}
  - {id: PREF-MORPHOTYPE-OPENNESS, statement: preserve broad form diversity; no single naming architecture should dominate Owner-visible exploration absent evidence of preference, confidence: high}
  - {id: PREF-NONPERSONAL-BRAND-IDENTITY, statement: personal given-name reading is a soft negative, confidence: medium_high}
  - {id: PREF-CROSS-LANGUAGE-PRONOUNCEABILITY, statement: names should be reasonably pronounceable by Chinese speakers and recoverable from hearing, confidence: high}
  - {id: PREF-BATCHED-OWNER-REVIEW, statement: target 5-8 meaningful screened candidates per review turn when available, confidence: high}
  - {id: PREF-SEMANTIC-DENSITY-OVER-PHONETIC-SMOOTHNESS, statement: semantic structure and mature brand character outrank generic coined smoothness, confidence: high}

integrity_incidents:
  - {id: INC-SEMANTIC-ANCHOR-001, status: corrected_and_live_recovery_observed, classification: controller_runtime_fidelity_failure}
  - {id: INC-MORPHOTYPE-COLLAPSE-002, status: corrected_but_recurred_in_new_form, classification: workflow_scheduler_fidelity_failure}
  - id: INC-MORPHOTYPE-OVERFIT-003
    status: active_reset_required
    classification: controller_overfit_to_positive_reference
    trigger: Owner detected that snapshot v80 batch was structurally too similar
    mechanism: >-
      Controller treated Merosophy's positive signal as evidence for a classical-root-derived morphology rather than evidence for semantic density and mature brandability.
      Search then overused mero-/noe-/poie-like classical roots, abstract suffixes, and X+learned-ending forms.
    correction:
      - prohibit use of Merosophy morphology, classical-root feel, or specific morpheme family as a generation template
      - next batch must be partitioned by fundamentally different construction architectures before lexical realization
      - require at least five materially different construction classes in Owner-visible batch
      - cap any one construction class at two Owner-visible candidates
      - evaluate semantic depth independently within each class

search_control:
  mode: structural_diversity_reset
  generation_isolation:
    level: best_effort_same_context
    claim_policy: sanitized positive briefs only; no literal blindness claim
  finalist_template_use: prohibited
  reference_overfit_guard: enabled
  reality_feedback_quarantine: {enabled: true, raw_failed_strings_to_generator: prohibited}
  owner_visible_batch_target: 5_to_8
  temporary_controller_cooldowns:
    - classical_greek_or_latin_root_stack
    - mero_noe_poie_family_reuse
    - X_plus_abstract_learned_suffix
    - faux_academic_concept_word
  required_next_batch_architectures:
    - compact_semantic_fusion_without_classical_roots
    - structural_or_visual_coinage
    - transformed_everyday_morpheme_coinage
    - symbolic_or_process_based_proper_name
    - crosslanguage_but_nonclassical_fusion
    - sound_first_but_semantically_backfilled_name
    - optional_short_compound_single_token
  architecture_rule: at_least_five_materially_distinct_classes_owner_visible; max_two_per_class

rounds:
  - id: RND-130
    action: owner_detects_repeated_morphotype_collapse
    result: controller_overfit_confirmed
    findings:
      - Owner states the batch is overall very similar and calls out apparent laziness
      - diagnosis confirms structural overfitting to Merosophy rather than genuine search-space diversity
      - semantic explanations differed but visible construction architecture did not
      - next round requires architecture-first divergence before lexical generation

candidates:
  - id: N130
    name: Merosophy
    role: owner_positive_reference_leader
    active: true
    owner_feedback: strongest_current_coined_candidate_usable_but_chinese_pronunciation_is_difficult
    generation_use: prohibited_as_template_or_seed
  - {id: N135, name: Coemera, role: weak_positive_below_reference, active: true, owner_feedback: slightly_better_than_average_but_worse_than_Merosophy, generation_use: prohibited_as_template_or_seed}
  - {id: N127, name: Multifinality, role: preference_evidence_only, active: true, owner_feedback: interesting_looks_good_feels_like_brand, generation_use: prohibited_as_template_or_seed}

current_state:
  owner_positive_commercial_candidates: [N130]
  weak_positive_comparison: [N135]
  preference_evidence: [N127]
  search_mode: structural_diversity_reset
  biggest_unknown: >-
    Which fundamentally different coined-name architectures can preserve semantic density and mature brand character without inheriting Merosophy's learned/classical morphology?
  blockers: []
  owner_review_needed_now: false

next_action:
  action: architecture_first_divergence_then_large_batch_screen
  rationale: >-
    Do not generate another lexically varied but structurally homogeneous batch. First allocate independent construction architectures, then generate within each, apply intrinsic/pronunciation/domain/reality/TM screens, and expose only a mixed 5-8 candidate batch.
  requires_owner: false_for_continued_search

stop:
  status: continue
  reason: Owner identified a real controller fidelity defect; reset is defined and search should continue autonomously
