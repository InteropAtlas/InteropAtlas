job:
  audience:
  - 公共知识的使用者与贡献者
  - 研究者、工具构建者与创作者
  avoid:
  - 逐字拼出整个愿景
  - 以注册空闲代替质量
  - 把历史好感当当前可用性
  - 复活已停止benchmark或新建dry-run
  contexts:
  - 组织独立身份
  - 项目归属与署名
  - 研究与工具分支
  hard_constraints:
  - 组织层级，不绑定标准、协议、地图、atlas或当前单一项目
  - 可读、可说、可传播；不设未经确认的长度和音节数硬上限
  - 进入Owner候选展示前完成必要身份、域名、商标导向、近名与语言筛查
  - 同名.org为finalists硬门槛；早期创意评价不据此淘汰，失败候选保留学习
  - unknown/error不能作为available；不得有已知decisive Red而进入finalists
  id: organization-naming-411
  languages:
  - 暂以拉丁字母品牌名及中文解释开展探索；不限定构词材料必须来自英语
  long_term_scope: 长期承载多个项目、研究、工具、公共知识工作、创造与发现，不被现有技术或项目形态锁死。
  required_reality_checks:
  - exact/near-name身份碰撞
  - 目标域名机器证据
  - 商标导向检索：US、EU、CN、WIPO/Madrid；优先09、16、41、42及实际服务描述，资助次级
  - 近名混淆与语言检查
  - 必要namespace；GitHub组织handle先作为拟检查项，非已确认硬门槛
  success_definition:
  - 最终提供约2–3个完成必要现实筛查且Owner真正愿意采用的候选
  - 质量和可用性分别有证据与理由，Owner最终决定
  - 留下可恢复的Fit Test状态与方法反馈
  target_description: InteropAtlas 上层的长期母组织，不是 InteropAtlas 项目改名。
  target_type: umbrella_organization
map:
  initial_landscape_summary: 四个定向相邻样本显示多种名称形态与多项目架构可并存。样本是便利抽样，不是市场全景、拥挤度调查或成功因果证明。语义区域与构词策略为独立轴。
  landscape_samples:
  - assessment: 说明共同名称元素及项目分化可以共存；本任务不因此采用wiki字根或同一架构。
    id: L01
    name: Wikimedia Foundation
    object_type: 公共知识组织
    observation: 官方项目页列出Wikipedia、Wikimedia Commons、Wikidata等不同项目。
    relation: 公共知识与多项目相邻样本
    source: https://wikimediafoundation.org/what-we-do/wikimedia-projects/
  - assessment: 不直述整个使命的名称可以与较宽使命共存；不能把今天规模归因于名字。
    id: L02
    name: Mozilla
    object_type: 开放技术组织与项目体系
    observation: 使命同时涉及公共资源、个体自主与贡献创造；页面列多个产品和组织工作入口。
    relation: 公共底座与个人自主相邻样本
    source: https://www.mozilla.org/en-US/mission/
  - additional_source: https://www.inkandswitch.com/project/
    assessment: 两个具象名词的组合可处于研究机构语境；实验室不是母组织的等价尺度证据。
    id: L03
    name: Ink & Switch
    object_type: 独立研究实验室
    observation: 官网定位为探索思考工具的独立研究实验室，并有多个项目。
    relation: 个人思考与创造工具相邻样本
    source: https://www.inkandswitch.com/
  - assessment: 紧凑名称亦能承载持续支持项目的机构；不推断本名称词源或所有短词均适用。
    id: L04
    name: NLnet
    object_type: 开放技术资助基金会
    observation: 官网说明支持互联网技术研发，成果以自由开放源码发布。
    relation: 长期支持开放技术的机构相邻样本
    source: https://nlnet.nl/foundation/
  notes:
  - 三区是重叠、非穷尽的探索入口，可以交叉；名称不必逐字编码全部循环。
  - 下一轮优先R02是待验证的探索选择，不是已证实的历史覆盖缺口，不改变质量维度权重。
  regions:
  - construction_families:
    - 隐喻迁移
    - 复合词
    - 词根组合
    - 受控改写
    evidence:
    - L01
    - L04
    - S03
    id: R01
    label: 公共底座与共同世界
    notes:
    - 直接公共/知识语义可作为锚点；可能像数据库或公益口号是待测风险，不是观察结论。
    observed_crowding: unknown
    prior_crowding: unknown
    quality_potential: hypothesis
    semantic_basis:
    - 共享知识
    - 共同体
    - 承载与开放
    status: unexplored
  - construction_families:
    - 空间/动作/自然现象隐喻
    - 混成
    - 复合
    - 声音先行后建立语义关联
    evidence:
    - L02
    - L03
    - S03
    - O07
    - O08
    - O09
    - O10
    id: R02
    label: 个人视角与转化
    notes:
    - 下一批暂优先，理由是把个人视角明确纳入探索，并非已经证明质量或可用性领先。
    - 不锁定lens/prism等裸词；不把抽象新造词当作语义区域。
    - 首批三名语义锚定名和一名声音先行弱锚定名；本批相关身份密集，但区域整体拥挤度仍unknown。
    - 下一轮暂转非光学的个人能动性/转化隐喻；不放弃R02，不冻结为唯一方向。
    observed_crowding: unknown
    prior_crowding: unknown
    quality_potential: mixed_initial_evidence
    semantic_basis:
    - 同一世界的不同理解
    - 解释与折射
    - 个人能动性
    - 从看见到创造
    status: exploring
  - construction_families:
    - 动作/过程隐喻
    - 混成
    - 压缩
    - 前后缀
    - 完全新造
    evidence:
    - S01
    - S03
    id: R03
    label: 创造、回流与再生
    notes:
    - 历史return路线好感只属于Owner信号；不证明语义区域质量或现实宽裕。
    - 应防循环名称仅指物流/退款/回收的解释，但须逐候选查询。
    observed_crowding: unknown
    prior_crowding: unknown
    quality_potential: hypothesis
    semantic_basis:
    - 发现与新生
    - 创造贡献回公共世界
    - 循环但不只是返回过去
    status: unexplored
