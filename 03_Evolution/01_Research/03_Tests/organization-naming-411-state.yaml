constraint_registry:
  confirmed_hard_constraints:
  - id: HC-ORG-SCALE
    statement: 名称必须能够承载 InteropAtlas 上层长期 umbrella organization，而非锁死为单一项目、协议、地图、平台或行业。
    source_type: owner_explicit
    source_ref: organization-vision
  - id: HC-RECOVERABILITY
    statement: 避免明显高误读、高听写分叉；名称需具备可接受的口语与拼写恢复性。
    source_type: owner_explicit
    source_ref: prior-owner-feedback
  - id: HC-ORG-DOMAIN
    statement: 最终 finalist 的同名普通 .org 可注册性为硬门槛；早期创意质量阶段不以此淘汰。
    source_type: owner_explicit
    source_ref: issue-411-policy
  owner_preferences:
  - id: PREF-LOW-MISREAD
    statement: 更偏好不容易误读的名称。
  controller_search_variables:
  - id: SV-WORD-COUNT
    name: word_count
    current_value: open
    allowed_values: [single_token, multiword, both]
    rationale: 历史 single-token focus 无 Owner hard-constraint provenance；v0.2.2 已诊断为 search variable。
    owner_approval_required_to_change: false
  - id: SV-SEMANTIC-TRANSPARENCY
    name: semantic_transparency
    current_value: adaptive
    allowed_values: [transparent, light, opaque_but_traceable, mixed]
    owner_approval_required_to_change: false
  assumptions: []

mission_value_model:
  source_refs: [organization-vision, issue-411-recovery]
  actors:
  - commons / public
  - individual
  - contributors / creators
  - projects / institutions
  objects:
  - knowledge
  - perspective / interpretation
  - creation / discovery
  - shared public knowledge
  transformations:
  - shared knowledge enables individual perspective
  - individual perspective enables creation / discovery
  - creation can return to the commons
  - returned knowledge supports another cycle
  relations_and_agency:
  - 公共知识属于共同体层面的共享资源；个人保有形成视角、解释与选择的自主性。
  - commons 与 individual agency 是需要同时保留的关系，而不是“多人”替代“个人视角”。
  temporal_or_causal_structure:
  - Commons → Perspective → Creation → Commons ↺ 是循环 / 反馈结构，而非四个并列关键词。
  desired_world:
  - 公共知识持续积累且可被访问、理解和再利用。
  - 个体可以从共享知识形成自己的解释、选择与创造。
  - 新创造能够重新进入公共积累并支持下一轮。
  anti_values_or_non_goals:
  - 不把组织锁死成单一项目形式。
  - 不要求所有个人形成统一视角。
  value_claims:
  - {id: V-COMMONS, statement: knowledge should remain part of a shared commons, evidence_type: explicit, value_type: end, priority: core, confidence: high}
  - {id: V-AGENCY, statement: individuals should retain interpretive perspective and choice, evidence_type: explicit, value_type: relation, priority: core, confidence: high}
  - {id: V-CREATION, statement: perspective should enable creation / discovery, evidence_type: structural, value_type: end, priority: high, confidence: high}
  - {id: V-RETURN, statement: creation can contribute back into shared knowledge, evidence_type: structural, value_type: procedural, priority: high, confidence: high}
  - {id: V-CONTINUITY, statement: the system should support durable renewal across cycles, evidence_type: structural, value_type: identity, priority: supporting, confidence: medium_high}
  value_relations:
  - {value_a: V-COMMONS, value_b: V-AGENCY, relation: balance, rationale: shared knowledge and individual perspective must coexist}
  - {value_a: V-AGENCY, value_b: V-CREATION, relation: sequence, rationale: perspective enables creation}
  - {value_a: V-CREATION, value_b: V-RETURN, relation: sequence, rationale: creation may return to commons}
  naming_implications:
  - {value_id: V-COMMONS, mode: indirect, rationale: 可作为共同、开放、共享或结构隐喻，但不要求字面出现 commons}
  - {value_id: V-AGENCY, mode: indirect, rationale: 应防止 collective proxy 抹掉个体 agency；更适合通过视角、分化、解释、选择等结构表达}
  - {value_id: V-CREATION, mode: indirect, rationale: 可通过生成、展开、形成、发现等隐喻表达}
  - {value_id: V-RETURN, mode: guardrail_only, rationale: 不要求名字直接编码回流循环}
  - {value_id: V-CONTINUITY, mode: optional_story, rationale: 可支持长期组织气质但不是字面硬要求}
  value_coverage:
  - {value_id: V-COMMONS, sampling_level: medium, recent_strategy_ids: [institutional_pair_phrase, semantically_motivated_fusion], strong_candidate_ids: [], interpretation: 表面 shared/open proxy 容易生成，但需避免重新把 commons 简化成 collective token}
  - {value_id: V-AGENCY, sampling_level: medium, recent_strategy_ids: [adjacent_domain_metaphor, opaque_but_traceable_proper_name], strong_candidate_ids: [N062, N066], interpretation: interpretation/perspective 类材料有质量信号，但现实命名空间拥挤且部分术语偏学术}
  - {value_id: V-CREATION, sampling_level: medium, recent_strategy_ids: [adjacent_domain_metaphor, semantically_motivated_fusion], strong_candidate_ids: [N067], interpretation: enabling/growth metaphor有潜力，但显性词空间高度占用}
  - {value_id: V-RETURN, sampling_level: low, recent_strategy_ids: [], strong_candidate_ids: [], interpretation: 仍主要作为 guardrail；下一轮不要求字面表达}
  integrity:
    value_flattening_detected: false
    mission_overcompression_detected: false
    value_proxy_collapse_detected: false
    value_priority_invention_detected: false
    value_score_smuggling_detected: false

name_job_model:
  primary_jobs:
  - 形成可长期积累、可独立识别的母组织 proper identity。
  - 能承载多个独立项目、研究、工具、教育、出版与公共知识工作。
  - 在口语与书写中保持较稳定的恢复性。
  - 为长期品牌故事保留足够语义空间，而不锁死为当前 InteropAtlas 的单一形式。
  secondary_jobs:
  - 与一个或少数 core value / structural relation 建立真实但不必直白的联系。
  - 具有足够记忆性、机构感与创造能量。
  non_jobs:
  - 裸名不需要逐字解释完整 Commons → Perspective → Creation → Commons 循环。
  - 裸名不需要列举 research / education / tools / publishing 等业务。
  - 名称不需要独自承担全部 mission narrative。
  tensions:
  - distinctiveness ↔ recoverability
  - semantic transparency ↔ ownable identity
  - institutional scale ↔ creative energy
  success_evidence: []
  source_refs: [organization-vision, rnd-042-054-diagnostics]
  status: active

decision_criteria:
  items:
  - {id: C-SCALE, statement: 长期 umbrella organization scale, role: gate, source_ref: HC-ORG-SCALE, confidence: high}
  - {id: C-RECOVERY, statement: 低到可接受的发音 / 听写恢复负担, role: optimize, source_ref: HC-RECOVERABILITY, confidence: high}
  - {id: C-DISTINCT, statement: 独立 proper-name identity / distinctiveness, role: optimize, source_ref: name-job-model, confidence: high}
  - {id: C-VALUE, statement: 与 Mission / Value Model 不冲突并最好有真实连接, role: optimize, source_ref: mission-value-model, confidence: high}
  - {id: C-DOMAIN, statement: 同名普通 .org 最终可注册, role: gate, source_ref: HC-ORG-DOMAIN, confidence: high}
  - {id: C-OWNER, statement: Owner long-term resonance, role: prefer, source_ref: owner-preference, confidence: medium}
  - {id: C-TM, statement: 官方商标风险, role: observe, source_ref: owner-deferred-policy, confidence: high}
  integrity:
    role_confusion_detected: false
    role_drift_detected: false

optional_modules:
  communication_load_allocation:
    status: inactive
    trigger: activate only if name_overloading recurs
    name: []
    descriptor: []
    tagline: []
    mission_statement: []
    brand_architecture: []
    visual_identity: []
    organizational_practice: []
  territory_research:
    status: active
    trigger: multi-method RND-054 still collapsed toward common lexical/material pool and strong visible terms were reality-crowded
    activation_budget:
      unknown: Need richer, less obvious real-world conceptual material before another equivalent generation batch.
      decision: May change semantic/material territories supplied to Scheduler and Generator.
      cheaper_alternative: Another unresearched generation batch would likely repeat the same lexical pool; no cheaper action has comparable information value.
      stop_condition: Stop after a small material map yields several structurally distinct positive territories suitable for generation.
    active_territories:
    - printmaking / edition mechanics
    - textual annotation / critical reading
    - ecology / succession and boundary systems
    material_maps:
    - territory: printmaking / edition mechanics
      sources: [National Gallery of Australia printmaking glossary, Hauser & Wirth printmaking glossary, Print Center New York glossary]
      structural_material:
      - shared matrix can produce multiple impressions
      - variable editions preserve a common source while allowing deliberate difference
      - proof / state records development rather than a single frozen final form
      - registration aligns distinct elements without making them identical
    - territory: textual annotation / critical reading
      sources: [Getty AAT marginalia record, critical-edition terminology reference]
      structural_material:
      - a shared text can support independent annotations and readings
      - multiple witnesses / readings can coexist around a common work
      - apparatus preserves differences rather than erasing them
    - territory: ecology / succession and boundary systems
      sources: [US Forest Service ecology glossaries, USFS succession research]
      structural_material:
      - ecotones are transition zones between communities
      - succession is staged change where earlier conditions can enable later states
      - facilitation can let one community or stage support another without becoming identical to it
      - root / crown and cohort concepts separate shared system structure from individual growth
    selected_material_for_generation:
    - shared source → distinct realizations → retained as a larger edition / archive
    - shared work → independent readings / annotations → preserved differences
    - boundary / transition zone where distinct communities interact
    - successive enabling where one stage creates conditions for later creation
  decision_hygiene:
    status: ready_on_trigger
    trigger: activate for high-value shortlist / Owner Exposure or multi-reviewer comparison
    independent_first_pass: true
    reviewer_blindness_contracts: []
    anchoring_risks: []
  temporal_evaluation:
    status: inactive
    trigger: only for strong candidates whose main uncertainty is novelty / familiarity
    candidate_ids: []
  validation_research:
    status: inactive
    trigger: only when external respondent evidence would reduce a concrete uncertainty
    respondent_definition: null
    research_questions: []
    blindness_level: null
    admissible_inferences: []
    prohibited_inferences: []
    results: []
  naming_scope:
    status: satisfied
    trigger: null
    object_role: standalone_umbrella_organization_brand
    rationale: Issue #411 已明确为 InteropAtlas 上层长期母组织命名。
  activation_governance:
    status: deferred
    trigger: finalist selected / rollout needed
    migration: []
    rollout: []
    internal_adoption: []
    future_naming_policy: []

