current_state:
  direct_registration_com_survivors: [N096, N113, N126]
  aftermarket_pending: [N117, N119, N122, N123, N124, N125, N127]
  search_mode: commercial_brand_hard_gate_divergence
  biggest_unknown: >-
    Which strong names have an exact .com that is either directly registrable or realistically purchasable, while also retaining strong trademark registrability and Owner-level brand appeal?
  blockers: []
  owner_review_needed_now: false

next_action:
  action: trademark_strength_rescreen_direct_com_survivors_and_check_aftermarket_obtainability_for_high_value_registered_coms_then_continue_balanced_search
  due_diligence_for_new_finalists: [exact_com_registration_status, aftermarket_sale_or_broker_status_if_registered, price_or_quote_if_observable, active_use_conflict, US_TM_registrability_precheck, EU_TM_registrability_precheck, CN_TM_registrability_precheck, WIPO_Madrid_precheck, identity_collision_screen]
  rationale: >-
    Commercial adoption requires control of the exact .com, not necessarily an unregistered .com. Registered-but-obtainable domains remain viable, while active/nontransferable or economically unrealistic domains fail the gate.
  requires_owner: false_until_new_commercially_viable_owner_ready_survivor_exists

