lineage:
  preservation_note: >-
    Naming Job 未重新初始化，G0–G8 benchmark 未恢复。snapshot v81 记录 INC-MORPHOTYPE-OVERFIT-003。
    Owner 随后明确暂停继续生成名称，要求收集和整理本次生成全过程的数据/资料，判断哪些经验可用于改善 Adaptive Naming Skill。
    本快照因此把生成暂停，进入 method/process review。复盘文档位于
    03_Evolution/01_Research/03_Tests/organization-naming-411-process-review-v0.1.md。

constraint_registry:
  confirmed_hard_constraints:
    - {id: HC-ORG-SCALE, statement: long-term umbrella organization scale, source_type: owner_explicit}
    - {id: HC-RECOVERABILITY, statement: avoid obvious high misread / dictation branching, source_type: owner_explicit}
    - id: HC-COM-DOMAIN
      statement: exact .com must be practically obtainable for the commercial umbrella organization; direct registration preferred, aftermarket purchase acceptable when realistic
      source_type: owner_explicit
      primary_domain: .com
    - id: HC-TM-REGISTRABILITY
      statement: finalist must have a good trademark-registration outlook for long-term commercial organization use
      source_type: owner_explicit
      priority_jurisdictions: [US, EU, CN, WIPO_Madrid]
    - {id: HC-ORG-SECONDARY, statement: .org is secondary and mainly intended for open-source/public-interest projects, source_type: owner_explicit}

owner_preferences:
  - {id: PREF-MEANING-FIRST, statement: meaningfulness and overall identity quality outrank shortness; longer names are acceptable when worthwhile, confidence: high}
  - {id: PREF-EXPRESSION-STABLE-MODERN, statement: stable, harmonious, reliable; youthfulness welcome when dependable, confidence: high}
  - {id: PREF-COMPACT-SPOKEN-RHYTHM, statement: excessive visual/spoken burden is a real negative, but compactness cannot replace meaning, confidence: high}
  - {id: PREF-UNDERSTATED-CLEVERNESS, statement: restrained second-look reward attractive; showy gimmick not, confidence: high}
  - {id: PREF-MORPHOTYPE-OPENNESS, statement: preserve broad form diversity; no single naming architecture should dominate Owner-visible exploration absent evidence of preference, confidence: high}
  - {id: PREF-NONPERSONAL-BRAND-IDENTITY, statement: personal given-name reading is a soft negative, confidence: medium_high}
  - {id: PREF-CROSS-LANGUAGE-PRONOUNCEABILITY, statement: names should be reasonably pronounceable by Chinese speakers and recoverable from hearing, confidence: high}
  - {id: PREF-BATCHED-OWNER-REVIEW, statement: target 5-8 meaningful screened candidates per review turn when available, confidence: high}
  - {id: PREF-SEMANTIC-DENSITY-OVER-PHONETIC-SMOOTHNESS, statement: semantic structure and mature brand character outrank generic coined smoothness, confidence: high}

integrity_incidents:
  - {id: INC-SEMANTIC-ANCHOR-001, status: corrected_and_live_recovery_observed, classification: controller_runtime_fidelity_failure}
  - {id: INC-MORPHOTYPE-COLLAPSE-002, status: corrected_but_recurred_in_new_form, classification: workflow_scheduler_fidelity_failure}
  - id: INC-MORPHOTYPE-OVERFIT-003
    status: under_method_review
    classification: controller_overfit_to_positive_reference
    trigger: Owner detected that snapshot v80 batch was structurally too similar
    mechanism: >-
      Controller treated Merosophy's positive signal as evidence for a classical-root-derived morphology rather than evidence for semantic density and mature brandability.
      Search then overused mero-/noe-/poie-like classical roots, abstract suffixes, and X+learned-ending forms.
    method_review_implication: >-
      Current Skill already contains anti-collapse principles, but repeated Owner-detected failures suggest missing pre-exposure batch-level enforcement and positive-reference generalization controls.

process_review:
  status: active
  review_document: 03_Evolution/01_Research/03_Tests/organization-naming-411-process-review-v0.1.md
  generation_paused: true
  review_scope:
    - semantic_anchor_collapse
    - owner_visible_morphotype_collapse
    - reality_and_commercial_gate_effects
    - positive_reference_learning
    - coined_name_strategy
    - cross_language_pronounceability
    - owner_review_batching
    - positive_reference_overfit
  primary_findings:
    - current toolbox and diagnosis vocabulary are broadly sufficient; enforcement is the larger gap
    - positive feedback needs abstraction into latent virtues vs surface morphology before it informs exploration
    - candidate-level quality checks are insufficient; batch-level generalization/diversity audit is needed
    - semantic diversity does not prove morphological diversity
    - owner review cadence is itself an adaptive variable
    - commercial ownability should filter and allocate search budget without becoming a proxy for intrinsic name quality
    - cross-language pronounceability is important but should not outrank semantic substance by default
  proposed_method_hypothesis: positive_reference_abstraction_plus_batch_generalization_audit
  stable_skill_change_now: false
  reason_for_not_immediate_promotion: >-
    Mechanism is clear and repeated within #411, but cross-task evidence is still absent. Record as method-evolution evidence and add regression before stable promotion.

candidates:
