schema_version: '0.4.0'

task:
  issue: 411
  repository: InteropAtlas/InteropAtlas
  branch: feat/adaptive-naming-skill-v0.1
  mode: Adaptive Naming Fit Test
  status: in_progress
  snapshot_version: 47
  skill_version: 0.4.0

lineage:
  preservation_note: >-
    Naming Job 未重新初始化，G0–G8 benchmark 未恢复。snapshot v46 (commit 5898e8eeb9ae4a77977aa3825fce05666d0296a7)
    保存 RND-070–073 与首次 Owner Exposure。本快照记录 Owner 对 N096/N113 的真实反馈并重新打开探索；
    完整历史候选、现实证据和旧快照由 Git history 与 Issue #411 保留，不在本 compact continuation snapshot 重写。

constraint_registry:
  confirmed_hard_constraints:
    - {id: HC-ORG-SCALE, statement: long-term umbrella organization scale; not a single project/protocol/map/platform/industry, source_type: owner_explicit}
    - {id: HC-RECOVERABILITY, statement: avoid obvious high misread / dictation branching; acceptable spoken and spelling recovery, source_type: owner_explicit}
    - {id: HC-ORG-DOMAIN, statement: exact ordinary .org availability is a finalist hard gate but not an early creative filter, source_type: owner_explicit}
  owner_preferences:
    - {id: PREF-LOW-MISREAD, statement: lower misread burden preferred}
    - id: PREF-CHOICE-SPACE
      statement: Owner wants more credible ready-to-use choices even when one acceptable candidate already exists; minimum finalist count is not itself a stopping condition.
      source_type: owner_explicit
      observed_at: 2026-09-11

mission_value_model:
  core_structure: Commons -> Perspective -> Creation -> Commons
  value_claims: [V-COMMONS, V-AGENCY, V-CREATION, V-RETURN]

owner_feedback:
  - id: OF-N096-01
    candidate_id: N096
    signal: positive_usable_not_selected
    statement: Open Regard has no major problem, feels stable, is directly usable, and is not rejected; Owner wants more choices before selecting.
    implications: [retain_as_finalist_baseline, do_not_use_as_generation_template, continue_independent_exploration]
  - id: OF-N113-01
    candidate_id: N113
    signal: hold_explanation_required
    statement: Public Singular looks broadly acceptable but first-read meaning is unclear; Public can evoke public facilities/public-sector or noncommercial character, raising commercialization-fit concern; unusualness may improve recognition.
    implications: [retain_for_comparison, validate_first_read_semantics_and_commercial_tone_before_any_promotion, do_not_treat_internal_semantic_elegance_as_owner_comprehension]

search_control:
  mode: exploration_reopened_by_owner
  search_cadence: {mode: portfolio_batch, target_finalist_pool: 4_to_6, stop_condition: enough genuinely distinct ready-to-use choices or materially diminishing information gain}
  generation_isolation:
    level: best_effort_same_context
    runtime_identity: ChatGPT current conversation runtime
    historical_context_may_have_seen_controller_only_exclusions: true
    claim_policy: sanitized logical briefs only; no literal blindness claim
  controller_only_exclusions:
    finalist_candidate_ids: [N096, N113]
    comparison_only_candidate_ids: [N060]
    other: [historical_reality_survivor_shapes, historical_owner_reaction_subjects]
  finalist_template_use: prohibited
  reality_feedback_quarantine: {enabled_in_exploration: true, same_batch_feedback_to_generator: prohibited}
  post_generation_filter: {enabled: true, check_finalist_similarity: true, check_cooled_families: true, check_strategy_fidelity: true}

reality_screening:
  method_ref: reality-screening-contract-v0.3.3
  status: active
  freshness_recheck_before_owner_exposure: true
  domain_after_reality_pass_only: true

workflow_scheduler:
  policy: diagnosis_driven_pattern_portfolio
  active_patterns:
    - pattern_id: white_space_mapping
      status: active_next
      question_to_answer: >-
        Which materially different identity architectures can add ready-to-use choices without cloning Open Regard or Public Singular,
        while preserving low recovery burden and umbrella scale?
    - {pattern_id: category_parallel, status: eligible_after_remap}
  diagnostics: {workflow_monoculture: false, workflow_operator_confusion: false}

method_scheduler:
  policy: adaptive_operator_portfolio
  protected_from_imitation: [evocative_relational_phrase_survivor_shape_N096, tension_dyad_survivor_shape_N113]
  recent_deprioritized_regions: [title_style_institutional, concrete_metaphor_mononym, relational_adverb_mononym, immediate_phrase_family_exploitation, immediate_tension_dyad_family_exploitation]
  diagnostics: {scheduler_monoculture: false, method_underuse: false}

candidates:
  - id: N096
    name: Open Regard
    role: finalist_baseline
    active: true
    owner_signal: positive_usable_not_selected
    intrinsic: {pronunciation: high, spelling_recovery: high, distinctiveness: medium_high, semantic_room: high, target_scale_fit: good, architecture_fit: good}
    reality: {fresh_screen_2026_09_11: no_material_active_exact_identity_found, domain: openregard.org_available_2026_09_11, formal_tm_clearance: not_claimed}
    generation_use: prohibited_as_template
  - id: N113
    name: Public Singular
    role: finalist_hold
    active: true
    owner_signal: hold_explanation_required
    intrinsic: {pronunciation: high, spelling_recovery: high, distinctiveness: high, semantic_room: medium_high, target_scale_fit: good, architecture_fit: good}
    reality: {fresh_screen_2026_09_11: no_material_active_exact_identity_found, domain: publicsingular.org_available_2026_09_11, formal_tm_clearance: not_claimed}
    owner_risks: [first_read_semantic_decode_cost, public_sector_noncommercial_tone_concern]
    generation_use: prohibited_as_template
  - {id: N060, name: Plurifold, role: comparison_only, active: true, generation_use: prohibited_as_template_or_semantic_anchor}
  - {id: N086, name: Lumerand, role: held_internal, active: true, owner_exposure: not_ready}
  - {id: N061, role: held_historical, active: true, generation_use: prohibited_as_seed}

rounds:
  - id: RND-074
    action: owner_feedback_ingest_and_exploration_reopen
    generated_count: 0
    findings:
      - N096 is confirmed by Owner as directly usable and stable, but not selected because choice space is insufficient
      - N113 is not rejected, but its intended semantic tension is not self-evident on first read and Public raises commercialization-tone concern
      - the prior 2-3 finalist stop threshold was a minimum exposure trigger, not a sufficient final stopping condition for this Owner/task
      - next search should broaden high-quality choice space rather than optimize around either exposed finalist
    integrity_check: {owner_signal_not_reduced_to_like_dislike: true, finalists_not_used_as_generation_templates: true, no_owner_internal_route_delegation: true}

observations:
  - id: O-R074-CHOICE
    scope: owner_decision
    observation: an acceptable ready-to-use finalist can still leave insufficient decision choice space; stopping should depend on Owner sufficiency signal and marginal information gain, not finalist count alone
  - id: O-R074-FIRSTREAD
    scope: naming_quality
    observation: internally coherent semantic construction may still impose first-read decoding cost; semantic elegance and immediate comprehension must remain separate observations

diagnostics:
  - id: D-R074-01
    diagnosis_type: finalist_pool_insufficient_despite_usable_baseline
    statement: Owner accepts N096 as usable but explicitly requests more choices; reopen exploration while quarantining exposed finalist shapes from generation
    confidence: high
    proposed_state_change: white_space_remap_for_distinct_additional_finalists

experience_candidates:
  - id: E-R074-STOP-SUFFICIENCY
    observation: finalist-count threshold should not be treated as sufficient stopping evidence when Owner explicitly reports inadequate choice space
    scope: potentially_general
    confidence: medium
    status: experience_candidate_not_skill_rewrite
  - id: E-R074-FIRSTREAD
    observation: first-read semantic comprehension should be distinguished from post-explanation conceptual fit
    scope: potentially_general
    confidence: medium
    status: experience_candidate_not_skill_rewrite

experience_export:
  registry_ref: 02_Runtime/02_Tools/adaptive_naming/evolution/method-experience-registry.yaml
  direct_skill_rewrite_allowed: false
  rnd_074_method_level_export: pending_cross_task_or_repeat_evidence

current_state:
  finalists: [N096, N113]
  baseline_candidate_id: N096
  held_candidates: [N086, N061]
  search_mode: exploration_reopened_by_owner
  search_cadence_mode: portfolio_batch
  target_finalist_pool: 4_to_6
  generation_isolation_level: best_effort_same_context
  biggest_unknown: >-
    Can materially different naming architectures add several ready-to-use candidates that preserve Open Regard's low-friction usability while offering greater identity diversity, without copying either exposed finalist?
  blockers: []
  information_gain: high_for_broader_choice_space
  owner_review_needed_now: false

next_action:
  action: remap_and_run_distinct_portfolio_search
  target: add_independent_ready_to_use_candidates_without_finalist_imitation
  rationale: >-
    Owner explicitly wants more choice and regards N096 as usable rather than selected. Reopen exploration, protect N096/N113 from template feedback,
    remap materially different identity architectures, then use small parallel category probes. Apply intrinsic/linguistic funnel before hardened reality screening and .org gating.
  triggered_by: [D-R074-01]
  expected_information_gain: high
  selected_workflow_pattern_ids: [white_space_mapping, category_parallel]
  requires_owner: false
  owner_gate_classification: search_strategy

stop:
  status: continue
  reason: Owner explicitly requested more credible choices; current two-finalist set is not sufficient for final selection
  unresolved:
    - formal trademark legal clearance remains deferred and is not implied by public screening
    - true isolated generation runtime remains unavailable in this context
    - additional finalists must be materially independent rather than near-family variants of N096/N113
