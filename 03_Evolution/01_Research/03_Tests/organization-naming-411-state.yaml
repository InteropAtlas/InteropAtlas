lineage:
  preservation_note: >-
    Naming Job 未重新初始化，G0–G8 benchmark 未恢复。snapshot v53 (commit 1fd4de1d4c1431dd24a60881f4e2d65b257c92d3)
    保存 Owner 的 stable-modern / reliable-youth expression signal 与 R/C/O 低置信字母偏好。本 compact snapshot 新增声音长度与节奏对称偏好；
    完整历史候选、轮次与现实证据继续由 Git history 与 Issue #411 保留。

constraint_registry:
  confirmed_hard_constraints:
    - {id: HC-ORG-SCALE, statement: long-term umbrella organization scale; not a single project/protocol/map/platform/industry, source_type: owner_explicit}
    - {id: HC-RECOVERABILITY, statement: avoid obvious high misread / dictation branching; acceptable spoken and spelling recovery, source_type: owner_explicit}
    - {id: HC-ORG-DOMAIN, statement: exact ordinary .org availability is a finalist hard gate but not an early creative filter, source_type: owner_explicit}
  owner_preferences:
    - {id: PREF-LOW-MISREAD, statement: lower misread burden preferred, source_type: owner_explicit}
    - {id: PREF-CHOICE-SPACE, statement: Owner wants multiple credible ready-to-use choices, source_type: owner_explicit}
    - {id: PREF-MORPHOTYPE-OPENNESS, statement: no obvious broad morphotype taboo; do not infer equal preference, source_type: owner_observed, confidence: medium}
    - id: PREF-EXPRESSION-STABLE-MODERN
      statement: stable, harmonious and reliable identity character preferred; youthfulness/modernity welcome when dependable rather than flimsy or trend-chasing.
      shorthand: reliable_youth / stable_modern / harmonious_confidence
      source_type: owner_explicit_self_report
      confidence: medium_high
      stability: emerging
    - id: PREF-INITIAL-RCO
      statement: R/C/O initials often feel reassuring/stable to Owner, but this is not absolute and may be a surface correlate.
      source_type: owner_explicit_self_report
      confidence: low_medium
      usage: observe_only_not_generation_rule
    - id: PREF-COMPACT-SPOKEN-RHYTHM
      statement: >-
        Owner strongly prefers names that feel short when spoken. Using Owner-perceived articulation beats rather than strict linguistic syllable count,
        ideal total effort is about 4 beats; up to about 5 is preferred. The metric is perceptual and must not be falsely equated with formal syllable count.
      source_type: owner_explicit_self_report
      confidence: high
      stability: emerging_strong
      use: optimize_not_hard_gate_until_calibrated
    - id: PREF-RHYTHMIC-SYMMETRY
      statement: >-
        Owner likes a balanced/symmetrical spoken identity, evoking the compact parallel feel of “Wade Watts”: repeated or corresponding sound/letter structure,
        balanced chunks, similar stress/length, or other audible/visual symmetry. Exact alliteration is not required.
      source_type: owner_explicit_self_report
      confidence: high
      stability: emerging_strong
      use: optimize_not_template

mission_value_model:
  core_structure: Commons -> Perspective -> Creation -> Commons
  value_claims: [V-COMMONS, V-AGENCY, V-CREATION, V-RETURN]

owner_feedback:
  - {id: OF-N096-01, candidate_id: N096, signal: positive_usable_not_selected, statement: Open Regard stable and directly usable; retain baseline while expanding choice.}
  - {id: OF-N113-01, candidate_id: N113, signal: hold_explanation_required, statement: Public Singular broadly acceptable but first-read meaning unclear and Public may imply public-sector/noncommercial tone.}
  - {id: OF-N117-01, candidate_id: N117, signal: positive_with_form_cost, statement: See Otherwise semantically acceptable and young but feels too long/multipart.}
  - {id: OF-N119-01, candidate_id: N119, signal: positive_stable, statement: Elseground has no major semantic or visual problem and feels stable.}
  - id: OF-RHYTHM-01
    signal: owner_phonological_preference
    statement: >-
      Owner wants the full name to be compact in perceived spoken effort, preferably around four articulation beats and generally within about five,
      with a balanced/symmetrical feel. Owner illustrates the desired symmetry with the feeling of the name Wade Watts.
    interpretation:
      - compactness_is_spoken_not_just_character_count
      - owner_perceived_beats_must_be_distinguished_from_formal_syllables
      - rhythmic_or_structural_symmetry_may_contribute_to_stability_harmony
      - alliteration_is_one_possible_mechanism_not_a_requirement
      - existing finalist N117 length concern is consistent with this signal

expression_profile:
  status: activated
  desired_axes:
    stability: high
    harmony: high
    reliability: high
    modernity: medium_high
    youthfulness: allowed_positive_if_reliable
    compact_spoken_identity: high
    rhythmic_balance: high
    trendiness: low_if_it_reduces_trust
  phonological_preferences:
    owner_perceived_articulation_beats:
      ideal: about_4
      preferred_upper_range: about_5
      formal_status: perceptual_owner_metric_not_standard_syllable_count
    symmetry_examples:
      - balanced_chunk_lengths
      - repeated_or_corresponding_initial/final sounds
      - alliteration_when_natural
      - balanced_stress_pattern
      - visual_length_balance
    avoid_overfit:
      - do_not_force_R_C_O
      - do_not_force_alliteration
      - do_not_force_exact_four_beats_if_name_quality_suffers

preference_probe_design:
  status: ready_for_neutral_expression_rhythm_probe
  source: unfamiliar_neutral_non_candidate_examples
  objective: separate intrinsic stable-modern / compact-balanced preference from famous-brand halo and morphotype effects
  design:
    - include multiple morphotypes
    - contrast compact balanced vs similarly good but longer/asymmetric forms
    - contrast reliable-youth vs playful-fragile vs traditional-heavy expression
    - vary initials so R/C/O can be observed without enforcing them
    - keep probe samples out of candidate pool and Generator context
  interpretation:
    - preference signals rebalance search budget only
    - do not convert sample strings into templates

method_evolution:
  registry_ref: 02_Runtime/02_Tools/adaptive_naming/evolution/method-experience-registry.yaml
  morphotype_hypothesis_id: HYP-004
  note: latest evidence suggests preference discovery should include expression and phonological/rhythmic axes, not only construction morphotype; stable Skill rewrite still requires regression/counterevidence.
  stable_skill_rewrite_allowed_now: false

candidates:
  - {id: N096, name: Open Regard, role: finalist_baseline, active: true, generation_use: prohibited_as_template}
  - {id: N113, name: Public Singular, role: finalist_hold, active: true, generation_use: prohibited_as_template}
  - {id: N117, name: See Otherwise, role: finalist_owner_ready, active: true, generation_use: prohibited_as_template}
  - {id: N119, name: Elseground, role: finalist_owner_ready, active: true, generation_use: prohibited_as_template}
  - {id: N060, name: Plurifold, role: comparison_only, active: true, generation_use: prohibited_as_template_or_semantic_anchor}
  - {id: N086, name: Lumerand, role: held_internal, active: true, owner_exposure: not_ready}

rounds:
  - {id: RND-083, action: mature_brand_morphotype_reference_probe, generated_count: 0, result: no_clear_morphotype_taboo_brand_halo_high}
  - {id: RND-084, action: owner_expression_signal_ingest_and_probe_redesign, generated_count: 0, result: stable_modern_reliable_youth_signal}
  - id: RND-085
    action: owner_spoken_compactness_and_symmetry_signal_ingest
    generated_count: 0
    findings:
      - short spoken effort matters more than raw character count
      - Owner ideal is approximately four perceived articulation beats and prefers roughly five or fewer
      - Owner likes audible/visual symmetry and balanced naming chunks
      - this may mechanistically explain part of the stable/harmonious/reliable affective preference
      - formal linguistic syllable count alone is insufficient to model Owner perception

current_state:
  finalists: [N096, N113, N117, N119]
  baseline_candidate_id: N096
  search_mode: owner_expression_rhythm_probe
  search_cadence_mode: validation_only
  generation_isolation_level: best_effort_same_context
  biggest_unknown: Does Owner consistently prefer compact, rhythmically balanced, stable-modern identities when unfamiliar examples remove brand halo, and how strongly should this influence formal candidate search?
  blockers: []
  information_gain: high_from_neutral_expression_rhythm_probe
  owner_review_needed_now: true

next_action:
  action: run_neutral_expression_rhythm_plus_morphotype_probe
  target: calibrate_owner_compactness_symmetry_and_stable_modern_preference_before_more_formal_generation
  rationale: >-
    Owner has now provided a coherent cluster of affective and phonological preferences. A bounded unfamiliar non-candidate probe can test whether compactness/rhythmic symmetry and reliable-youth character persist without mature-brand halo, while preserving morphotype diversity.
  triggered_by: [OF-RHYTHM-01]
  expected_information_gain: high
  requires_owner: true
  owner_gate_classification: preference_discovery

stop:
  status: pause_for_neutral_expression_rhythm_probe
  reason: preference calibration now has higher decision value than generating more formal candidates immediately
  unresolved:
    - preference-beat metric is perceptual and still needs calibration
    - HYP-004/stable Skill revision requires regression/counterevidence
    - formal trademark legal clearance remains deferred
    - true isolated generation runtime remains unavailable
