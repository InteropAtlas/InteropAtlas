schema_version: '0.4.0'

task:
  issue: 411
  repository: InteropAtlas/InteropAtlas
  branch: feat/adaptive-naming-skill-v0.1
  mode: Adaptive Naming Fit Test
  status: in_progress
  snapshot_version: 63
  skill_version: 0.4.0

lineage:
  preservation_note: >-
    Naming Job 未重新初始化，G0–G8 benchmark 未恢复。snapshot v62 首次将 N121 Common Refrain 暴露给 Owner。
    Owner 立即发现 Common/Commons 语义反复出现。审计确认这是 runtime/controller fidelity failure：
    Mission/Value Model 中的字面 token Commons 被 meaning-first generation 重新当作高权重 lexical material，
    违反稳定 Skill 的 Value Model != Name Job 与 mission-not-keyword-compression 不变量。
    本快照执行 semantic-anchor reset；完整历史保留在 Git history / Issue #411。

constraint_registry:
  confirmed_hard_constraints:
    - {id: HC-ORG-SCALE, statement: long-term umbrella organization scale, source_type: owner_explicit}
    - {id: HC-RECOVERABILITY, statement: avoid obvious high misread / dictation branching, source_type: owner_explicit}
    - {id: HC-ORG-DOMAIN, statement: exact ordinary .org availability is a finalist hard gate but not an early creative filter, source_type: owner_explicit}
  owner_preferences:
    - {id: PREF-MEANING-FIRST, statement: meaningfulness and overall identity quality outrank shortness; longer names are acceptable when worthwhile, confidence: high}
    - {id: PREF-EXPRESSION-STABLE-MODERN, statement: stable, harmonious, reliable; youthfulness welcome when dependable, confidence: high}
    - {id: PREF-COMPACT-SPOKEN-RHYTHM, statement: shorter spoken effort is secondary preference only, confidence: high, priority: secondary}
    - {id: PREF-RHYTHMIC-SYMMETRY, statement: balanced spoken structure is optional bonus, confidence: high}
    - {id: PREF-VISUAL-SYMMETRY-CYCLE, statement: visual symmetry/cycle echo is optional bonus, confidence: high}
    - {id: PREF-UNDERSTATED-CLEVERNESS, statement: restrained second-look reward attractive; showy gimmick not, confidence: high}
    - {id: PREF-MORPHOTYPE-OPENNESS, statement: preserve form diversity, confidence: medium_high}
    - {id: PREF-NONPERSONAL-BRAND-IDENTITY, statement: personal given-name reading is a soft negative, confidence: medium_high}

mission_value_model:
  core_structure: Commons -> Perspective -> Creation -> Commons
  use_policy:
    semantic_structure_available_to_controller: true
    literal_tokens_available_as_generator_material: false
    note: >-
      Mission/value language informs relations, transformations, tensions, agency and desired-world structure.
      Literal words such as common/commons/perspective/creation/return must not become privileged generation vocabulary unless independently selected by a separate territory decision.

integrity_incident:
  id: INC-SEMANTIC-ANCHOR-001
  detected_by: owner
  trigger: repeated Common/Commons family and N121 Common Refrain exposure
  classification: controller_runtime_fidelity_failure
  stable_skill_defect: false
  mechanism: >-
    meaning-first search overexposed literal mission wording; Controller treated a Value Model token as lexical generation material.
    This caused semantic mode collapse even though construction morphotypes remained varied.
  violated_invariants:
    - mission_vision_not_reduced_to_keywords
    - value_model_not_equal_name_job
    - name_need_not_encode_complete_mission
    - positive_generation_brief_should_use_transformed_relational_material_not_literal_mission_tokens
  correction:
    - semantic_anchor_reset
    - quarantine_literal_mission_tokens_from_generator_context
    - represent mission as abstract relations/transformations only in generation briefs
    - require post_generation_check_for_literal_value_token_leakage
    - do_not_treat_N121_as_owner_ready_evidence

controller_only_quarantine:
  literal_value_tokens:
    - common
    - commons
    - perspective
    - creation
    - return
  policy: >-
    These tokens are not banned names and are not global negatives. They are temporarily Controller-only for generation-integrity recovery because they are contaminated anchors in this job.
    Do not show this negative list to Generator; instead provide a positive brief using abstract relational/identity targets.

expression_profile:
  baseline: meaningful + stable-modern + easy-to-hold + organization-scale + recoverable + non-personal
  secondary_preferences: [compactness, rhythmic_balance]
  optional_bonuses: [visual_cycle_echo, understated_cleverness]
  anti_overfit: [do_not_force_shortness, do_not_force_RCO, do_not_force_palindrome, do_not_force_blend]

search_control:
  mode: semantic_anchor_reset_then_divergence
  search_cadence:
    mode: divergence_burst
    target: restore semantic and lexical independence while preserving meaning-first quality
    stop_condition: at least one batch demonstrates material conceptual distance from literal mission vocabulary without losing organization-scale meaning
  generation_isolation:
    level: best_effort_same_context
    claim_policy: sanitized positive briefs only; no literal blindness claim
  finalist_template_use: prohibited
  reality_feedback_quarantine: {enabled: true, raw_failed_strings_to_generator: prohibited}

positive_generation_brief_contract:
  include:
    - long_term_umbrella_organization_scale
    - stable_modern_reliable_identity
    - meaningful_but_not_mission_literalization
    - abstract_relations_such_as transformation, reciprocity, reinterpretation, contribution, emergence, continuity
    - multiple morphotypes and medium_length_allowed
    - recoverability_and_long_term_identity_quality
  exclude_from_generator_context:
    - literal mission slogan
    - mission arrows / exact wording
    - current finalists
    - probe sample strings
    - quarantined literal value tokens
    - reality survivor/failure strings

rounds:
  - id: RND-104
    action: owner_detected_semantic_anchor_audit
    generated_count: 0
    result: integrity_failure_confirmed
    findings:
      - repeated Common/Commons was not evidence of Owner preference
      - meaning-first expansion accidentally increased literal mission-token salience
      - N121 emerged from contaminated lexical territory and cannot count as clean owner-ready evidence
      - stable Skill already contains the correct invariant; no stable Skill rewrite is justified
  - id: RND-105
    action: semantic_anchor_reset
    generated_count: 0
    result: generation_contract_sanitized

candidates:
  - {id: N096, name: Open Regard, role: finalist_baseline, active: true, generation_use: prohibited_as_template}
  - {id: N113, name: Public Singular, role: finalist_hold, active: true, generation_use: prohibited_as_template}
  - {id: N117, name: See Otherwise, role: finalist_owner_ready, active: true, generation_use: prohibited_as_template}
  - {id: N119, name: Elseground, role: finalist_owner_ready, active: true, generation_use: prohibited_as_template}
  - id: N121
    name: Common Refrain
    role: diagnostic_contaminated_not_owner_ready
    active: false
    reason: generated under literal mission-token anchoring; preserve only as integrity evidence
    generation_use: prohibited_as_template_or_seed
  - {id: N060, name: Plurifold, role: comparison_only, active: true, generation_use: prohibited_as_template_or_semantic_anchor}
  - {id: N086, name: Lumerand, role: held_internal, active: true, owner_exposure: not_ready}

method_evolution:
  registry_ref: 02_Runtime/02_Tools/adaptive_naming/evolution/method-experience-registry.yaml
  hypothesis_id: HYP-004
  stable_skill_rewrite_allowed_now: false
  latest_note: >-
    Current incident is an execution-fidelity failure against an existing stable invariant, not evidence that the Skill lacks Owner preference or Mission/Name-Job separation.
    A regression/check may later be added for literal mission-token leakage, but stable semantics do not need redesign now.

current_state:
  finalists: [N096, N113, N117, N119]
  search_mode: semantic_anchor_reset_then_divergence
  biggest_unknown: >-
    Can meaning-first generation retain depth while achieving genuine conceptual/lexical independence from literal mission vocabulary and current finalist families?
  blockers: []
  owner_review_needed_now: false
  information_gain: high_from_reset

next_action:
  action: run_semantically_sanitized_divergence_batch
  rationale: >-
    Restore exploration using abstract relational and identity goals rather than literal mission words. Preserve Owner preferences as evaluation weights, not lexical generation seeds.
  requires_owner: false_until_clean_owner_ready_survivor_exists

stop:
  status: continue
  reason: integrity issue is diagnosed and corrected; autonomous search can resume
  unresolved:
    - clean new owner-ready candidate still needed
    - formal trademark legal clearance remains deferred
    - true isolated generation runtime remains unavailable
