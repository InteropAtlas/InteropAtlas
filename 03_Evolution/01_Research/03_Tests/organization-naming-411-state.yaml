  selected_workflow_patterns: [category_parallel, divergence_burst, creative_linguistic_parallel]
  phrase_budget: minor_only_until_owner_visible_diversity_is_restored
  rationale: >-
    N127 materially expands Owner-visible form diversity and survives preliminary identity/domain checks. Continue parallel search because academic tone may be too strong and one clean systems term should not become the next template.
  requires_owner: true_for_N127_reaction_not_for_continued_internal_search

stop:
  status: owner_feedback_plus_continue
  reason: clean materially distinct peer exists; Owner reaction is decision-relevant while autonomous search remains open
  unresolved:
    - N127 Owner reaction needed
    - at least one more source-distinctive non-phrase peer remains desirable
    - formal trademark legal clearance remains deferred
    - true isolated generation runtime remains unavailable
