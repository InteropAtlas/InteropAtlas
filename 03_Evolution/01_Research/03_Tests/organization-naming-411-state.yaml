diagnostics:
- {id: D61, subject: N039, statement: '独立Reviewer已看到Plural Way空格歧义，但Owner真实曝光进一步发现subway/alway→always式内部词块会破坏canonical segmentation；这是新的候选级信息。', confidence: high}
- {id: D62, subject: N039, statement: '若plural作为形容词修饰单数way，Pluralway可理解为“一个多元/复合的方式”；若意图是“多种方式/多条路径”，自然英语是plural ways。因此品牌字面与One commons, plural ways叙事存在轻微语法语义张力。', confidence: high}
- {id: D63, subject: N039, statement: 'way的path/method读法不是抽象理论风险，而在Owner第一次曝光中成为主导解释，因此N039的母组织尺度不足已获得真实Owner信号。', confidence: high}
- {id: D64, statement: '下一轮不应把“禁用所有复合词/所有普通英语词”升级为普遍规则；应局部增加canonical segmentation和semantic-role narrowing压力测试，并暂避-way路线。', confidence: high}
next_action:
  action: change_strategy_and_generate
  target_count: 3-5
  rationale: 当前无promising候选；Pluralway提供了高信息量Owner反馈，需要换局部构词策略而不是继续同类transparent compound。
  strategy_delta:
  - 下一批暂避-way/-ways以及明显path/route/method导向的尾词。
  - 生成后、现实查询前增加canonical segmentation stress test：观察连写后是否自然触发其他高频词块、错误断句或品牌词界不稳定。
  - 对复合/混成词检查字面语法是否真的支持 intended meaning，尤其单复数和修饰关系；不靠品牌解释掩盖语法张力。
