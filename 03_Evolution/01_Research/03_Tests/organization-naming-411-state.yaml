lineage:
  preservation_note: >-
    Naming Job 未重新初始化，G0–G8 benchmark 未恢复。snapshot v55 保存 visual symmetry / cycle-fit 偏好。
    本快照新增 Owner 对“克制的巧劲 / 第二眼奖励”的明确偏好，并记录历史备选 Knewn 作为 Owner 自述的偏好证据，而不是恢复为 active candidate。
    仓库 code search 未找到 Knewn 的现存记录，因此不重建其旧现实筛查或旧结论；完整历史仍以 Git history / Issue #411 为准。

constraint_registry:
  confirmed_hard_constraints:
    - {id: HC-ORG-SCALE, statement: long-term umbrella organization scale; not a single project/protocol/map/platform/industry, source_type: owner_explicit}
    - {id: HC-RECOVERABILITY, statement: avoid obvious high misread / dictation branching; acceptable spoken and spelling recovery, source_type: owner_explicit}
    - {id: HC-ORG-DOMAIN, statement: exact ordinary .org availability is a finalist hard gate but not an early creative filter, source_type: owner_explicit}
  owner_preferences:
    - {id: PREF-LOW-MISREAD, statement: lower misread burden preferred, source_type: owner_explicit}
    - {id: PREF-CHOICE-SPACE, statement: Owner wants multiple credible ready-to-use choices, source_type: owner_explicit}
    - {id: PREF-MORPHOTYPE-OPENNESS, statement: no obvious broad morphotype taboo; do not infer equal preference, source_type: owner_observed, confidence: medium}
    - {id: PREF-EXPRESSION-STABLE-MODERN, statement: stable, harmonious and reliable identity character preferred; youthfulness/modernity welcome when dependable, shorthand: reliable_youth / stable_modern / harmonious_confidence, source_type: owner_explicit_self_report, confidence: medium_high}
    - {id: PREF-INITIAL-RCO, statement: R/C/O initials often feel reassuring/stable but are not absolute, source_type: owner_explicit_self_report, confidence: low_medium, usage: observe_only_not_generation_rule}
    - {id: PREF-COMPACT-SPOKEN-RHYTHM, statement: Owner prefers short perceived spoken effort; ideal about 4 articulation beats and generally about 5 or fewer, source_type: owner_explicit_self_report, confidence: high, use: optimize_not_hard_gate_until_calibrated}
    - {id: PREF-RHYTHMIC-SYMMETRY, statement: Owner likes balanced/symmetrical spoken identity; Wade Watts is the motivating feel, not a required template, source_type: owner_explicit_self_report, confidence: high, use: optimize_not_template}
    - {id: PREF-VISUAL-SYMMETRY-CYCLE, statement: Owner likes visual symmetry / near-palindromic balance and sees task-specific fit with the Commons -> Perspective -> Creation -> Commons cycle, source_type: owner_explicit_self_report, confidence: high, use: optimize_and_explore_not_gate}
    - id: PREF-UNDERSTATED-CLEVERNESS
      statement: >-
        Owner likes names with a restrained conceptual trick or semantic compression that rewards a second look, but dislikes cleverness that feels showy, gimmicky or self-conscious.
        Historical backup Knewn is cited positively because it fuses Know + New in a compact form; however its spoken/pronunciation recovery feels effortful, so cleverness must not override recoverability.
      source_type: owner_explicit_self_report
      confidence: high
      stability: emerging_strong
      use: optimize_and_explore_not_gate

mission_value_model:
  core_structure: Commons -> Perspective -> Creation -> Commons
  value_claims: [V-COMMONS, V-AGENCY, V-CREATION, V-RETURN]
  structural_naming_implication:
    cycle_or_return_can_optionally_be_expressed_by_name_structure_itself: true
    subtle_semantic_compression_can_optionally_express_relation_or_transformation: true

owner_feedback:
  - {id: OF-N096-01, candidate_id: N096, signal: positive_usable_not_selected, statement: Open Regard stable and directly usable; retain baseline while expanding choice.}
  - {id: OF-N113-01, candidate_id: N113, signal: hold_explanation_required, statement: Public Singular broadly acceptable but first-read meaning unclear and Public may imply public-sector/noncommercial tone.}
  - {id: OF-N117-01, candidate_id: N117, signal: positive_with_form_cost, statement: See Otherwise semantically acceptable and young but feels too long/multipart.}
  - {id: OF-N119-01, candidate_id: N119, signal: positive_stable, statement: Elseground has no major semantic or visual problem and feels stable.}
  - id: OF-CLEVERNESS-01
    signal: owner_expression_and_construction_preference
    statement: >-
      Owner says the desirable features do not need to coexist in every name, but simultaneous fit can create a strong positive reaction. Owner also cites Knewn (Know + New) as a past backup they still find interesting because of its compact conceptual trick, while noting that it is somewhat effortful to pronounce/read. Owner likes this kind of cleverness when understated, not flashy.
    interpretation:
      - preferences_are_composable_bonuses_not_joint_hard_requirements
      - second_look_reward_is_positive
      - semantic_compression_or_blend_can_be_attractive
      - understated_wit_preferred_over_gimmick
      - recoverability_remains_counterpressure
      - Knewn_is_preference_evidence_not_generation_template

expression_profile:
  status: activated
  desired_axes:
    stability: high
    harmony: high
    reliability: high
    modernity: medium_high
    youthfulness: allowed_positive_if_reliable
    compact_spoken_identity: high
    rhythmic_balance: high
    visual_balance: high
    understated_cleverness: medium_high
    second_look_reward: medium_high
    showiness_or_gimmick: low
    trendiness: low_if_it_reduces_trust
  structural_preferences:
    spoken_target: about_4_owner_perceived_beats_preferably_not_over_5
    visual_symmetry: optional_bonus
    semantic_compression: optional_bonus
    subtle_double_reading_or_blend: optional_bonus
    avoid_overfit:
      - do_not_force_exact_palindrome
      - do_not_force_R_C_O
      - do_not_force_alliteration
      - do_not_force_blends_or_wordplay
      - do_not_sacrifice_pronunciation_spelling_recovery_scale_or_reality_for_cleverness

preference_model_note:
  combination_policy: >-
    Owner explicitly says these preferences are not conjunctive requirements. Treat them as separable positive signals that may stack synergistically; a name can still be strong without satisfying all of them.
  synergy_examples:
    - compact_plus_balanced
    - stable_modern_plus_understated_cleverness
    - visual_cycle_structure_plus_semantic_fit
    - short_recoverable_plus_second_look_reward

preference_probe_design:
  status: ready_for_neutral_expression_rhythm_visual_cleverness_probe
  source: unfamiliar_neutral_non_candidate_examples
  objective: calibrate intrinsic stable-modern / compact-balanced / visual-symmetry / understated-cleverness preference without famous-brand halo
  design:
    - include multiple morphotypes
    - contrast compact balanced vs longer/asymmetric controls
    - include some subtle semantic tricks/blends and equally strong plain controls
    - separate cleverness from pronunciation difficulty where possible
    - include some visually symmetric/near-symmetric forms and asymmetric controls
    - contrast reliable-youth vs playful-fragile vs traditional-heavy expression
    - vary initials so R/C/O is observed rather than enforced
    - keep probe samples out of formal candidate pool and Generator context
  interpretation:
    - preference signals rebalance search budget only
    - stacked preference matches may receive task-local bonus, not universal quality bonus

method_evolution:
  registry_ref: 02_Runtime/02_Tools/adaptive_naming/evolution/method-experience-registry.yaml
  morphotype_hypothesis_id: HYP-004
  note: latest evidence suggests Owner preference discovery needs expression, spoken rhythm, visual structure and understated semantic cleverness; stable Skill rewrite still requires regression/counterevidence.
  stable_skill_rewrite_allowed_now: false

historical_owner_examples:
  - id: HX-KNEWN
    name: Knewn
    status: preference_evidence_only_not_active_candidate
    owner_reported_construction: Know + New
    owner_positive: compact conceptual cleverness / interesting fusion
    owner_negative: somewhat effortful to pronounce/read
    repository_record_lookup_2026_09_11: no_current_code_search_match_found
    generation_use: prohibited_as_template_or_seed

