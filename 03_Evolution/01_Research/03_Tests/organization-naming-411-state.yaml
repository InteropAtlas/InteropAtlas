  id: N039
  name: Pluralway
  active: true
  status: owner_exposure_ready_trademark_deferred
  pronunciation_hint: PLOOR-ul-way
  construction: plural + way
  intended_meaning: 公共知识不是为了产生唯一视角；不同个体可以形成不同视角、路径与创造，并将创造重新贡献给公共世界。
  compact_narrative: One commons, plural ways.
  provenance:
    round_origin: RND-017
    generation_role: primary_executor
    review_role: owner_relayed_blind_independent_reviewer
  quality:
    distinctiveness: 较强；组合有品牌轮廓，但plural根在目标领域拥挤
    pronounceability: 较好至强；通常可直接读出
    spelling_burden: 中；纯语音时自然可能恢复为Plural Way，属于空格归一化歧义，不是整体拼错
    memorability: 较强
    semantic_fit: 较强至强；最强连接plurality of perspectives / multiple paths
    semantic_room: 较强；不锁死research/standards/software/knowledge等具体业务
    target_scale_fit: 中至较强；plural足够大，但way稳定引入理念/方法/路径感，母组织尺度略降
    longevity: 较好
    symbolic_compression: 强
    cross_context_use: 较好
    architecture_extensibility: 较好
  independent_review:
    status: completed_blind
    overall: 合格以上；无淘汰级名称质量问题，值得进入Owner Exposure。
    strongest_point: plural带来的意义压缩能力，与“Knowledge belongs to the commons; perspective belongs to the individual.”有直接哲学连接。
    primary_risks:
    - 纯语音中Pluralway很自然被写成Plural Way；视觉体验优于纯语音体验。
    - way会把身份向philosophy/methodology/framework/movement/approach/path拉动，而不是天然institutional parent brand。
    - 名称强编码Perspective/multiplicity/paths，对Commons与Creation较间接，对回流Commons很弱；但Reviewer认为名称无需压缩完整循环。
  architecture_cases:
