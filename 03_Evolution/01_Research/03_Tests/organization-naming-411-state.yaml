schema_version: '0.4.0'

task:
  issue: 411
  repository: InteropAtlas/InteropAtlas
  branch: feat/adaptive-naming-skill-v0.1
  mode: Adaptive Naming Fit Test
  status: in_progress
  snapshot_version: 57
  skill_version: 0.4.0

lineage:
  preservation_note: >-
    Naming Job 未重新初始化，G0–G8 benchmark 未恢复。snapshot v56 保存 compactness / symmetry / stable-modern / understated-cleverness 偏好簇。
    本快照记录第一轮陌生中性样本 Owner 反应并对偏好强度做校准；完整历史、候选现实证据与旧轮次继续由 Git history / Issue #411 保留。

constraint_registry:
  confirmed_hard_constraints:
    - {id: HC-ORG-SCALE, statement: long-term umbrella organization scale, source_type: owner_explicit}
    - {id: HC-RECOVERABILITY, statement: avoid obvious high misread / dictation branching, source_type: owner_explicit}
    - {id: HC-ORG-DOMAIN, statement: exact ordinary .org availability is a finalist hard gate but not an early creative filter, source_type: owner_explicit}
  owner_preferences:
    - {id: PREF-EXPRESSION-STABLE-MODERN, statement: stable, harmonious, reliable; youthfulness welcome when dependable, confidence: high}
    - {id: PREF-COMPACT-SPOKEN-RHYTHM, statement: short spoken effort preferred; ideal about 4 perceived beats and generally about 5 or fewer, confidence: high}
    - {id: PREF-RHYTHMIC-SYMMETRY, statement: balanced spoken chunks / stress / corresponding sound structure preferred, confidence: high}
    - {id: PREF-VISUAL-SYMMETRY-CYCLE, statement: visual symmetry or near-palindromic balance is an optional strong bonus, especially when it can echo cycle/return, confidence: high}
    - {id: PREF-UNDERSTATED-CLEVERNESS, statement: restrained semantic trick / second-look reward is attractive; showy gimmick is not, confidence: high}
    - {id: PREF-MORPHOTYPE-OPENNESS, statement: no broad form taboo currently observed, confidence: medium_high}
    - {id: PREF-INITIAL-RCO, statement: R/C/O initials may feel reassuring but remain observational only, confidence: low_medium}
    - id: PREF-NONPERSONAL-BRAND-IDENTITY
      statement: names that read strongly as personal given names reduce appeal relative to equally compact brand-like forms.
      source_type: owner_observed
      confidence: medium
      stability: emerging
      use: prefer_not_gate

mission_value_model:
  core_structure: Commons -> Perspective -> Creation -> Commons
  structural_naming_implications:
    - cycle_or_return_may_be_carried_by_visual_or_phonological_structure
    - subtle_semantic_compression_may_carry transformation / know-new style relations

neutral_probe:
  round_id: RND-088
  sample_status: preference_probe_only_not_candidates
  samples:
    - {id: A, name: Coren, owner_reaction: acceptable, notes: reminded Owner of Intel Core}
    - {id: B, name: Ovaro, owner_reaction: positive, notes: stronger than A; interesting; not boring}
    - {id: C, name: Nolen, owner_reaction: positive, notes: stable; feels like a good name}
    - {id: D, name: Rova, owner_reaction: strong_positive, notes: interesting; simple; direct; memorable}
    - {id: E, name: Aroa, owner_reaction: positive, notes: simple; visually young; slightly less easy to read}
    - {id: F, name: Ceral, owner_reaction: neutral, notes: ordinary / weak pull}
    - {id: G, name: Nover, owner_reaction: positive, notes: acceptable}
    - {id: H, name: Orin, owner_reaction: strong_positive, notes: memorable; simple; easy to remember}
    - {id: I, name: Rilor, owner_reaction: mildly_positive, notes: simple; moderately memorable}
    - {id: J, name: Valeo, owner_reaction: neutral, notes: acceptable but weak pull}
    - {id: K, name: Civen, owner_reaction: neutral_negative, notes: feels like a person name}
    - {id: L, name: Evara, owner_reaction: neutral_negative, notes: feels like a person name}
  provisional_order_by_pull:
    strongest: [H, D, B]
    positive: [C, G, E]
    acceptable_mild: [A, I]
    neutral_or_weak: [F, J]
    reduced_by_person_name_reading: [K, L]
  findings:
    - unfamiliar neutral samples produced meaningful discrimination, unlike mature-brand anchors
    - compactness and easy memorability correlate with stronger pull in this batch
    - stable/brand-like forms outperform forms perceived as personal given names
    - Owner still tolerates substantial form variation; no single morphotype dominates
    - R/C/O initial hypothesis is not independently confirmed: strong pull includes O/R, but N-start Nolen also performs well and C-start examples are mixed
    - visual youthfulness can help but does not override read-aloud ease (Aroa)
    - external semantic association can affect reaction (Coren -> Intel Core)

expression_profile:
  status: calibrated_after_neutral_probe_1
  desired_axes:
    stability: high
    harmony: high
    reliability: high
    modernity: medium_high
    compact_spoken_identity: high
    easy_memorability: high
    rhythmic_balance: high
    visual_balance: high_optional_bonus
    understated_cleverness: medium_high_optional_bonus
    personal_given_name_reading: prefer_low
    showiness_or_gimmick: low
  interpretation:
    - strongest confirmed cross-sample signal is compact, brand-like, easy-to-hold identity
    - stable-modern remains supported
    - symmetry and cleverness remain bonuses requiring further controlled comparison
    - initials remain weak evidence only

method_evolution:
  registry_ref: 02_Runtime/02_Tools/adaptive_naming/evolution/method-experience-registry.yaml
  hypothesis_id: HYP-004
  latest_evidence: unfamiliar neutral probes discriminate preference better than famous mature-brand anchors; Owner preference discovery can materially improve search allocation without becoming a hard template.
  stable_skill_rewrite_allowed_now: false
  reason: current Skill already supports Owner preference / expression_profile / feedback_refinement; evidence concerns scheduling and probe design, still under method-hypothesis validation.

candidates:
  - {id: N096, name: Open Regard, role: finalist_baseline, active: true, generation_use: prohibited_as_template}
  - {id: N113, name: Public Singular, role: finalist_hold, active: true, generation_use: prohibited_as_template}
  - {id: N117, name: See Otherwise, role: finalist_owner_ready, active: true, generation_use: prohibited_as_template}
  - {id: N119, name: Elseground, role: finalist_owner_ready, active: true, generation_use: prohibited_as_template}
  - {id: N060, name: Plurifold, role: comparison_only, active: true, generation_use: prohibited_as_template_or_semantic_anchor}
  - {id: N086, name: Lumerand, role: held_internal, active: true, owner_exposure: not_ready}

current_state:
  finalists: [N096, N113, N117, N119]
  search_mode: owner_preference_probe_then_generation_reallocation
  biggest_unknown: >-
    Whether symmetry / understated cleverness provide additional pull beyond the now-confirmed compact-brand-like-stable signal, and how to use these preferences without collapsing formal search diversity.
  blockers: []
  owner_review_needed_now: false

next_action:
  action: run_targeted_neutral_probe_2_then_resume_form_diverse_generation
  target: isolate symmetry and understated-cleverness effects while holding compactness/recoverability roughly constant
  rationale: >-
    Probe 1 confirmed that unfamiliar samples reveal useful preference signal. A small second probe should test the two least-calibrated high-value bonuses (symmetry and subtle cleverness), then formal naming search should resume with a broad morphotype portfolio weighted toward compact, stable-modern, non-personal brand identity.
  requires_owner: true_for_probe_2_response

stop:
  status: continue_after_owner_probe_2
  unresolved:
    - symmetry effect strength
    - understated cleverness effect strength independent of recoverability
    - formal trademark legal clearance remains deferred
    - true isolated generation runtime remains unavailable
