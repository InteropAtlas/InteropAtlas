  due_diligence_for_new_finalists: [exact_com_registration_or_aftermarket_obtainability, active_use_conflict, US_TM_registrability_precheck, EU_TM_registrability_precheck, CN_TM_registrability_precheck, WIPO_Madrid_precheck, identity_collision_screen]
  rationale: >-
    Owner explicitly requested continued creation rather than domain-loop stalling. N128 is a useful new commercially plausible candidate but must not become a template; keep broad morphotype search active.
