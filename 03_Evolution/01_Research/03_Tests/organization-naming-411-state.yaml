      - explicit Search Landscape now separates quality yield from reality crowding
      - dominant frontier has two pressure poles: recoverable natural identities are crowded; higher-distance invented names weaken recovery/identity character
      - REG-HYBRID-ANCHORED-PAIR and REG-SEGMENTABLE-SEMI-OPAQUE are the highest-information under-sampled architecture hypotheses
      - next workflow should compare those hypotheses without blending them into one generator style
