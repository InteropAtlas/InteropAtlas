observations:
  - {id: O-R061-LENGTH, scope: scheduler, observation: longer forms modestly improve namespace yield but do not eliminate collision; recoverability and identity character become the counter-pressure}
  - {id: O-R061-REALITY, scope: reality, observation: the v0.3.3 Reality Screening Contract catches exact and one-letter/high-adjacency conflicts early enough to avoid misleading domain checks}
  - {id: O-R062-WORKFLOW, scope: workflow, observation: bounded divergence changes the evidence surface even without finalist yield; it prevented another equivalent micro-probe loop}
  - {id: O-R063-LINGUISTIC, scope: workflow, observation: linguistic engineering adds independent evidence because a name can be easy to recover yet reality-blocked, or reality-cleaner yet linguistically weak}
  - {id: O-R064-LANDSCAPE, scope: search_landscape, observation: the most useful current white-space question is identity architecture between crowded natural English names and harder-to-recover invented proper names}
  - {id: O-R065-PAIR, scope: search_landscape, observation: familiar anchors improved pronunciation/spelling recovery but did not automatically create a durable umbrella-organization identity}
  - {id: O-R065-SEGMENT, scope: search_landscape, observation: stable segmentation can improve intrinsic proper-name identity without surname/fantasy drift, but the first top slice still showed strong reality crowding}

