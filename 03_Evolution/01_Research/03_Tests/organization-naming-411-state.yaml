lineage:
  preservation_note: >-
    Naming Job 未重新初始化，G0–G8 benchmark 未恢复。snapshot v49 保存四个 Owner-visible finalists；snapshot v50 记录 Owner-visible morphotype coverage gap 与 HYP-004。
    本快照记录 Owner 对偏好探测机制的进一步建议：可用成熟品牌作为低成本对照样本，也可按需生成中性样本；稳定 Skill 不宜硬编码具体题库或品牌名单。
    完整历史候选、现实证据与旧轮次继续由 Git history 与 Issue #411 保留。

constraint_registry:
  confirmed_hard_constraints:
    - {id: HC-ORG-SCALE, statement: long-term umbrella organization scale; not a single project/protocol/map/platform/industry, source_type: owner_explicit}
    - {id: HC-RECOVERABILITY, statement: avoid obvious high misread / dictation branching; acceptable spoken and spelling recovery, source_type: owner_explicit}
    - {id: HC-ORG-DOMAIN, statement: exact ordinary .org availability is a finalist hard gate but not an early creative filter, source_type: owner_explicit}
  owner_preferences:
    - {id: PREF-LOW-MISREAD, statement: lower misread burden preferred}
    - {id: PREF-CHOICE-SPACE, statement: Owner wants more credible ready-to-use choices even when one acceptable candidate already exists, source_type: owner_explicit}
    - {id: PREF-SURPRISE-WITHOUT-LOWERING-BAR, statement: novelty may increase but intrinsic/reality/domain gates remain unchanged, source_type: owner_explicit}
    - {id: PREF-MORPHOTYPE-DISCOVERY, statement: Owner wants exposure to materially different name forms to discover broad category preference rather than constrain search to coinage or compounds, source_type: owner_explicit}

mission_value_model: {core_structure: Commons -> Perspective -> Creation -> Commons, value_claims: [V-COMMONS, V-AGENCY, V-CREATION, V-RETURN]}

owner_feedback:
  - {id: OF-N096-01, candidate_id: N096, signal: positive_usable_not_selected, statement: Open Regard stable and directly usable; retain baseline while expanding choice.}
  - {id: OF-N113-01, candidate_id: N113, signal: hold_explanation_required, statement: Public Singular broadly acceptable but first-read meaning unclear and Public may imply public-sector/noncommercial tone.}
  - {id: OF-N117-01, candidate_id: N117, signal: positive_with_form_cost, statement: See Otherwise feels younger and semantically acceptable but too long/multipart.}
  - {id: OF-N119-01, candidate_id: N119, signal: positive_stable, statement: Elseground has no major semantic or visual problem and feels stable, but another compound-like form does not reveal broad form preference.}
  - id: OF-MORPHOTYPE-PROBE-02
    signal: method_feedback
    statement: >-
      Owner proposes a structured series of contrast questions to explore naming-form preference. Mature established brand names can be used as low-cost vocabulary/examples to save generation resources; generated examples remain optional. Stable Skill need not encode detailed fixed questions, but future Skill revision should handle this carefully as a methodological design problem.
    implications:
      - design_optional_bounded_morphotype_preference_probe
      - prefer_reference_anchors_when_bias_can_be_controlled
      - use_generated_neutral_examples_when_reference_brand_halo_or_coverage_is_problematic
      - keep_specific_question_bank_outside_stable_skill

search_control:
  mode: morphotype_preference_probe
  search_cadence:
    mode: validation_only
    target: learn_owner_form_preference_before_more_generation
    stop_condition: enough category-level signal exists to reallocate search budget without hard-locking one form class
  generation_isolation: {level: best_effort_same_context, runtime_identity: ChatGPT current conversation runtime, claim_policy: sanitized logical briefs only; no literal blindness claim}
  finalist_template_use: prohibited
  reality_feedback_quarantine: {enabled_in_exploration: true, same_batch_feedback_to_generator: prohibited}

morphotype_landscape:
  purpose: distinguish semantic/search diversity from Owner-visible identity-form diversity
  classes:
    - {id: MT-LEXICAL-SINGLE, description: single existing word or semantic transfer, owner_visible_coverage: insufficient}
    - {id: MT-PHRASE, description: natural phrase/proposition, owner_visible_coverage: high, examples_current: [N096, N117]}
    - {id: MT-DYAD, description: two familiar words in deliberate relation/tension, owner_visible_coverage: medium, examples_current: [N113]}
    - {id: MT-TRANSPARENT-COMPOUND, description: fused or compounded full words, owner_visible_coverage: medium, examples_current: [N119]}
    - {id: MT-BLEND, description: clipped/blended source forms creating a new word, owner_visible_coverage: insufficient}
    - {id: MT-ROOT-DERIVED, description: classical/other-language root-derived proper name with verifiable provenance, owner_visible_coverage: insufficient}
    - {id: MT-OPAQUE-COINAGE, description: sound-first/low-semantic proper name with stable spelling and pronunciation, owner_visible_coverage: insufficient}
    - {id: MT-NONENGLISH-LEXICAL, description: intact/lightly adapted non-English lexical identity with global usability, owner_visible_coverage: insufficient}
    - {id: MT-ACRONYM-INITIAL, description: acronymic/initial/letter-number identity if independently brandable, owner_visible_coverage: insufficient}
    - {id: MT-TYPOGRAPHIC-SYMBOLIC, description: punctuation/segmentation/symbolic identity when orally recoverable/domain-compatible, owner_visible_coverage: insufficient}

preference_probe_design:
  status: active
  objective: learn broad form preference, not choose a winner or define universal quality
  source_policy:
    mature_brand_references: preferred_when_owner_is_familiar_and_form_can_be_separated_from_brand_reputation
    generated_neutral_examples: use_when_reference_examples_are_too_famous_biased_or_do_not_cover_needed_form
    hybrid: allowed
  question_style:
    - balanced contrasts across form axes
    - ask attraction/rejection plus brief reason, not only forced winner
    - repeat classes across more than one anchor where halo bias is plausible
    - include indifferent/both/neither responses
  bias_controls:
    - brand_success_halo
    - industry_association
    - logo_visual_identity
    - existing_company_reputation
    - semantic_content_confounded_with_surface_form
  interpretation:
    - infer category-level tendencies only
    - update exploration budget, not hard constraints
    - preserve minority exploration budget for surprise
  stable_skill_revision_note: specify trigger, objective, design constraints and interpretation; do not hardcode exact brand list or fixed questionnaire

method_evolution:
  registry_ref: 02_Runtime/02_Tools/adaptive_naming/evolution/method-experience-registry.yaml
  hypothesis_id: HYP-004
  latest_refinement: mature-brand or generated anchor sets may support bounded morphotype preference probes; exact exemplars remain adaptive runtime material
  stable_skill_rewrite_allowed_now: false
  promotion_requirements_remaining: [regression_case, counterevidence_review, preferably_second_real_naming_job_or_severe_defect_contract]

candidates:
  - {id: N096, name: Open Regard, role: finalist_baseline, active: true, generation_use: prohibited_as_template}
  - {id: N113, name: Public Singular, role: finalist_hold, active: true, generation_use: prohibited_as_template}
  - {id: N117, name: See Otherwise, role: finalist_owner_ready, active: true, generation_use: prohibited_as_template}
  - {id: N119, name: Elseground, role: finalist_owner_ready, active: true, generation_use: prohibited_as_template}
