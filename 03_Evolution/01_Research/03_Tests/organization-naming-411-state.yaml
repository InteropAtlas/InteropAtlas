schema_version: '0.4.0'

task:
  issue: 411
  repository: InteropAtlas/InteropAtlas
  branch: feat/adaptive-naming-skill-v0.1
  mode: Adaptive Naming Fit Test
  status: in_progress
  snapshot_version: 55
  skill_version: 0.4.0

lineage:
  preservation_note: >-
    Naming Job 未重新初始化，G0–G8 benchmark 未恢复。snapshot v54 保存 Owner 的 spoken compactness / rhythmic symmetry 偏好。
    本 compact snapshot 新增 visual symmetry / palindrome-like balance 偏好，并将其与 Commons -> Perspective -> Creation -> Commons 的循环愿景建立“可能的结构呼应”，
    但不升级为硬约束或强制回文规则。完整历史候选、轮次与现实证据继续由 Git history 与 Issue #411 保留。

constraint_registry:
  confirmed_hard_constraints:
    - {id: HC-ORG-SCALE, statement: long-term umbrella organization scale; not a single project/protocol/map/platform/industry, source_type: owner_explicit}
    - {id: HC-RECOVERABILITY, statement: avoid obvious high misread / dictation branching; acceptable spoken and spelling recovery, source_type: owner_explicit}
    - {id: HC-ORG-DOMAIN, statement: exact ordinary .org availability is a finalist hard gate but not an early creative filter, source_type: owner_explicit}
  owner_preferences:
    - {id: PREF-LOW-MISREAD, statement: lower misread burden preferred, source_type: owner_explicit}
    - {id: PREF-CHOICE-SPACE, statement: Owner wants multiple credible ready-to-use choices, source_type: owner_explicit}
    - {id: PREF-MORPHOTYPE-OPENNESS, statement: no obvious broad morphotype taboo; do not infer equal preference, source_type: owner_observed, confidence: medium}
    - {id: PREF-EXPRESSION-STABLE-MODERN, statement: stable, harmonious and reliable identity character preferred; youthfulness/modernity welcome when dependable, shorthand: reliable_youth / stable_modern / harmonious_confidence, source_type: owner_explicit_self_report, confidence: medium_high}
    - {id: PREF-INITIAL-RCO, statement: R/C/O initials often feel reassuring/stable but are not absolute, source_type: owner_explicit_self_report, confidence: low_medium, usage: observe_only_not_generation_rule}
    - id: PREF-COMPACT-SPOKEN-RHYTHM
      statement: Owner prefers short perceived spoken effort; ideal about 4 articulation beats and generally about 5 or fewer.
      source_type: owner_explicit_self_report
      confidence: high
      use: optimize_not_hard_gate_until_calibrated
    - id: PREF-RHYTHMIC-SYMMETRY
      statement: Owner likes balanced/symmetrical spoken identity: corresponding sounds/letters, balanced chunks, similar stress/length; Wade Watts is the motivating feel, not a required template.
      source_type: owner_explicit_self_report
      confidence: high
      use: optimize_not_template
    - id: PREF-VISUAL-SYMMETRY-CYCLE
      statement: >-
        Owner also finds visual symmetry attractive, citing SONOS-like near-palindromic balance. This is especially interesting because the organization vision contains a return/cycle structure.
        Treat visual symmetry, reversible-looking structure, repeated endpoints, mirrored letter-patterns or other balanced orthography as optional positive identity mechanisms, not mandatory construction rules.
      source_type: owner_explicit_self_report
      confidence: high
      stability: emerging_strong
      use: optimize_and_explore_not_gate

mission_value_model:
  core_structure: Commons -> Perspective -> Creation -> Commons
  value_claims: [V-COMMONS, V-AGENCY, V-CREATION, V-RETURN]
  structural_naming_implication:
    cycle_or_return_can_optionally_be_expressed_by_name_structure_itself: true
    note: semantic meaning and orthographic/phonological structure may independently or jointly carry the cycle motif

owner_feedback:
  - {id: OF-N096-01, candidate_id: N096, signal: positive_usable_not_selected, statement: Open Regard stable and directly usable; retain baseline while expanding choice.}
  - {id: OF-N113-01, candidate_id: N113, signal: hold_explanation_required, statement: Public Singular broadly acceptable but first-read meaning unclear and Public may imply public-sector/noncommercial tone.}
  - {id: OF-N117-01, candidate_id: N117, signal: positive_with_form_cost, statement: See Otherwise semantically acceptable and young but feels too long/multipart.}
  - {id: OF-N119-01, candidate_id: N119, signal: positive_stable, statement: Elseground has no major semantic or visual problem and feels stable.}
  - id: OF-VISUAL-SYMMETRY-01
    signal: owner_visual_structural_preference
    statement: >-
      Owner says visual symmetry can also be appealing, giving SONOS as the intuitive example. The appeal is increased by the fit with the organization's cyclic/return mission structure.
    interpretation:
      - visual_symmetry_may_be_intrinsically_preferred
      - cycle_fit_gives_it_additional_task_specific_relevance
      - exact_palindrome_is_not_required
      - do_not_force_sonos_like_shape_or_specific_letters
      - test visual_balance alongside spoken rhythm and reliable-youth expression

expression_profile:
  status: activated
  desired_axes:
    stability: high
    harmony: high
    reliability: high
    modernity: medium_high
    youthfulness: allowed_positive_if_reliable
    compact_spoken_identity: high
    rhythmic_balance: high
    visual_balance: high
    trendiness: low_if_it_reduces_trust
  structural_preferences:
    spoken_target: about_4_owner_perceived_beats_preferably_not_over_5
    visual_symmetry_examples:
      - palindrome_or_near_palindrome_when_natural
      - repeated_or_corresponding_endpoints
      - balanced_letter_mass_or_chunk_length
      - mirrored_or_returning_pattern
      - orthographic_shape_that_can_support_cycle_or_return_story
    avoid_overfit:
      - do_not_force_exact_palindrome
      - do_not_force_R_C_O
      - do_not_force_alliteration
      - do_not_sacrifice_meaning_recoverability_scale_or_reality_for_symmetry

preference_probe_design:
  status: ready_for_neutral_expression_rhythm_visual_probe
  source: unfamiliar_neutral_non_candidate_examples
  objective: calibrate intrinsic stable-modern / compact-balanced / visual-symmetry preference without famous-brand halo
  design:
    - include multiple morphotypes
    - contrast compact balanced vs longer/asymmetric forms
    - include some visually symmetric/near-symmetric forms and some equally strong asymmetric controls
    - contrast reliable-youth vs playful-fragile vs traditional-heavy expression
    - vary initials so R/C/O is observed rather than enforced
    - keep probe samples out of formal candidate pool and Generator context
  interpretation:
    - preference signals rebalance search budget only
    - cycle-compatible symmetry may receive a task-local exploration bonus, not a universal quality bonus

method_evolution:
  registry_ref: 02_Runtime/02_Tools/adaptive_naming/evolution/method-experience-registry.yaml
  morphotype_hypothesis_id: HYP-004
  note: latest evidence suggests preference discovery should include expression, phonological rhythm and orthographic structure; stable Skill rewrite still requires regression/counterevidence.
  stable_skill_rewrite_allowed_now: false

