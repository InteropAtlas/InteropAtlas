schema_version: '0.4.0'

task:
  issue: 411
  repository: InteropAtlas/InteropAtlas
  branch: feat/adaptive-naming-skill-v0.1
  mode: Adaptive Naming Fit Test
  status: in_progress
  snapshot_version: 60
  skill_version: 0.4.0

lineage:
  preservation_note: >-
    Naming Job 未重新初始化，G0–G8 benchmark 未恢复。snapshot v59 记录现代短造词 / SaaS-like 独立品牌词在 2025–2026 的高现实占用。
    本快照继续验证 lexical/non-English/classical-root 路线，发现多个看似更“真实词/概念词”的短名称同样被活跃软件、AI、技术或组织实体占用；
    该结果继续作为 region-level reality crowding 处理，而不是 Owner preference 或 intrinsic quality 失败。完整历史由 Git history 与 Issue #411 保留。

constraint_registry:
  confirmed_hard_constraints:
    - {id: HC-ORG-SCALE, statement: long-term umbrella organization scale, source_type: owner_explicit}
    - {id: HC-RECOVERABILITY, statement: avoid obvious high misread / dictation branching, source_type: owner_explicit}
    - {id: HC-ORG-DOMAIN, statement: exact ordinary .org availability is a finalist hard gate but not an early creative filter, source_type: owner_explicit}
  owner_preferences:
    - {id: PREF-EXPRESSION-STABLE-MODERN, statement: stable, harmonious, reliable; youthfulness welcome when dependable, confidence: high}
    - {id: PREF-COMPACT-SPOKEN-RHYTHM, statement: short spoken effort preferred; ideal about 4 perceived beats and generally about 5 or fewer, confidence: high}
    - {id: PREF-RHYTHMIC-SYMMETRY, statement: balanced spoken structure preferred as optional bonus, confidence: high}
    - {id: PREF-VISUAL-SYMMETRY-CYCLE, statement: visual symmetry / near-palindromic balance is an optional bonus with task-local cycle fit, confidence: high}
    - {id: PREF-UNDERSTATED-CLEVERNESS, statement: restrained second-look reward attractive; showy gimmick not, confidence: high}
    - {id: PREF-MORPHOTYPE-OPENNESS, statement: no broad form taboo observed; preserve form diversity, confidence: medium_high}
    - {id: PREF-NONPERSONAL-BRAND-IDENTITY, statement: personal given-name reading is a soft negative, confidence: medium_high}
    - {id: PREF-INITIAL-RCO, statement: R/C/O initial effect remains observational only, confidence: low_medium}

mission_value_model:
  core_structure: Commons -> Perspective -> Creation -> Commons
  structural_naming_implications:
    - cycle_or_return_may_be_carried_by visual / phonological structure
    - subtle semantic compression may carry transformation relations

expression_profile:
  status: calibrated_ready_for_generation
  baseline: compact + brand-like + easy-to-hold + stable-modern + non-personal
  optional_bonuses: [rhythmic_balance, visual_cycle_echo, understated_cleverness]
  anti_overfit: [do_not_force_RCO, do_not_force_palindrome, do_not_force_blend, do_not_force_four_beats]

search_control:
  mode: broad_whitespace_expansion_beyond_saas_and_classical_roots
  search_cadence:
    mode: portfolio_batch
    target: expand_owner_ready_choice_space_without_repeating_known_crowded_short-name regions
    stop_condition: one_or_more_materially_distinct_owner_ready_candidates_or_low_information_across_new_regions
  generation_isolation:
    level: best_effort_same_context
    claim_policy: sanitized positive briefs only; no literal blindness claim
  finalist_template_use: prohibited
  reality_feedback_quarantine: {enabled: true, raw_failed_strings_to_generator: prohibited}

search_landscape:
  regions:
    - id: REG-MODERN-SHORT-COINAGE
      intrinsic_quality_yield: high
      reality_crowding: very_high
      status: deprioritized_cooldown
    - id: REG-CLASSICAL-ROOT-SHORT
      intrinsic_quality_yield: medium_high
      reality_crowding: very_high
      latest_evidence: >-
        Origo, Ousia, Metaxy, Limen, Nodus, Nexum, Metis and similarly compact conceptual/root-derived identities have active adjacent software/AI/technology/organization uses.
      status: deprioritized_cooldown
    - id: REG-NONENGLISH-LEXICAL-LESS-OBVIOUS
      intrinsic_quality_yield: medium_high
      reality_crowding: high
      latest_evidence: >-
        Renga and Koru both show active software/technology identities despite culturally grounded lexical provenance.
      status: active_but_lower_weight
    - id: REG-LEXICAL-SINGLE-OBLIQUE
      description: uncommon existing words or semantic-transfer identities whose ordinary meaning is not a generic tech/AI concept
      sampling_status: under_sampled
      reality_crowding: unknown
      status: priority_active
    - id: REG-RELATIONAL-SHORT-PHRASE
      description: compact two-unit constructions with balanced rhythm, not SaaS coinage and not generic manifesto phrasing
      sampling_status: under_sampled_after_owner_profile
      reality_crowding: unknown
      status: priority_active
    - id: REG-METAPHOR-OBJECT-SINGLE
      description: concrete or quasi-concrete object/process metaphors with umbrella-scale semantic room
      sampling_status: under_sampled
      reality_crowding: unknown
      status: priority_active
    - id: REG-STRUCTURAL-SYMMETRY-NONSEED
      description: natural symmetry / mirrored structure discovered independently, not generated from probe strings
      sampling_status: under_sampled
      status: minor_active_probe

rounds:
  - id: RND-095
    action: non_saas_lexical_and_root_probe
    result: no_owner_ready_survivor
    findings:
      - Origo has multiple active technology/software identities including decentralized infrastructure, fintech, AI/PIM and digital-presence businesses
      - Noria has long-running industrial knowledge/training identity plus an active AI software firm
      - Metaxy is an active small-business operating-system / AI automation product
      - Renga is active CAD/software and fintech/enterprise IT identity
      - Ousia is active AI/consulting/NLP identity
      - Koru has active software/health-tech/task-management uses
      - Limen, Nodus, Nexum and Metis have highly adjacent AI/software/organizational identities
      - short real-word / classical-root / culturally grounded forms are not an easy escape hatch from 2026 namespace crowding
  - id: RND-096
    action: reality_informed_whitespace_expansion
    generated_count: 0
    findings:
      - do not continue local mutation inside classical-root or globally familiar non-English short words
      - next information gain is higher in oblique lexical transfer, compact relational constructions, and concrete/process metaphor identities
      - preserve Owner compact/stable-modern profile as quality weighting only

candidates:
  - {id: N096, name: Open Regard, role: finalist_baseline, active: true, generation_use: prohibited_as_template}
  - {id: N113, name: Public Singular, role: finalist_hold, active: true, generation_use: prohibited_as_template}
  - {id: N117, name: See Otherwise, role: finalist_owner_ready, active: true, generation_use: prohibited_as_template}
  - {id: N119, name: Elseground, role: finalist_owner_ready, active: true, generation_use: prohibited_as_template}
  - {id: N060, name: Plurifold, role: comparison_only, active: true, generation_use: prohibited_as_template_or_semantic_anchor}
  - {id: N086, name: Lumerand, role: held_internal, active: true, owner_exposure: not_ready}

method_evolution:
  registry_ref: 02_Runtime/02_Tools/adaptive_naming/evolution/method-experience-registry.yaml
  hypothesis_id: HYP-004
  stable_skill_rewrite_allowed_now: false
  latest_note: Owner preference calibration remains useful; reality evidence now forces a broader Search Landscape move rather than string-level mutation.

current_state:
  finalists: [N096, N113, N117, N119]
  search_mode: broad_whitespace_expansion_beyond_saas_and_classical_roots
  biggest_unknown: >-
    Whether oblique lexical transfer, compact relational constructions, or concrete/process metaphors can preserve compact stable-modern Owner fit while escaping the heavily occupied short-tech-name namespace.
  blockers: []
  owner_review_needed_now: false
  information_gain: high_from_new_region_shift

next_action:
  action: probe_oblique_lexical_relational_and_metaphor_regions
  selected_workflow_patterns: [white_space_mapping, category_parallel, creative_linguistic_parallel]
  priority_regions: [REG-LEXICAL-SINGLE-OBLIQUE, REG-RELATIONAL-SHORT-PHRASE, REG-METAPHOR-OBJECT-SINGLE]
  minor_region: REG-STRUCTURAL-SYMMETRY-NONSEED
  rationale: >-
    Modern coinage and classical/non-English short-word regions are both heavily occupied. Move to materially different identity architectures while preserving compactness, recoverability, reliability and umbrella scale.
  requires_owner: false_until_owner_ready_survivor_exists

stop:
  status: continue
  reason: no blocker; evidence supports another autonomous search-region shift rather than Owner intervention
  unresolved:
    - new owner-ready candidate still needed to materially expand current four-choice pool
    - formal trademark legal clearance remains deferred
    - true isolated generation runtime remains unavailable
