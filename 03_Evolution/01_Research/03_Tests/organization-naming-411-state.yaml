      - greater raw variety did not by itself solve the quality-versus-namespace frontier
      - intrinsic weakness and reality crowding occurred in different candidates
      - next high-information pattern was creative_linguistic_parallel
    details_ref: issue-comment-5630184389
  - id: RND-063
