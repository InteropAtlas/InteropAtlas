schema_version: '0.4.0'

task:
  issue: 411
  repository: InteropAtlas/InteropAtlas
  branch: feat/adaptive-naming-skill-v0.1
  mode: Adaptive Naming Fit Test
  status: in_progress
  snapshot_version: 80
  skill_version: 0.4.0

lineage:
  preservation_note: >-
    Naming Job 未重新初始化，G0–G8 benchmark 未恢复。snapshot v79 记录 Owner 对上一批的比较反馈：Merosophy 明显领先，Coemera 仅略高于一般，其余无明显吸引力。
    本快照继续采用更大的内部生成批次，但将 intrinsic threshold 提高到“语义结构完整 + 成熟品牌感 + 非随机 SaaS 拼词”，并继续保持自造/半自造专名、跨语言发音、.com 获取和商标可拥有性后筛。

constraint_registry:
  confirmed_hard_constraints:
    - {id: HC-ORG-SCALE, statement: long-term umbrella organization scale, source_type: owner_explicit}
    - {id: HC-RECOVERABILITY, statement: avoid obvious high misread / dictation branching, source_type: owner_explicit}
    - id: HC-COM-DOMAIN
      statement: exact .com must be practically obtainable for the commercial umbrella organization; direct registration preferred, aftermarket purchase acceptable when realistic
      source_type: owner_explicit
      primary_domain: .com
    - id: HC-TM-REGISTRABILITY
      statement: finalist must have a good trademark-registration outlook for long-term commercial organization use
      source_type: owner_explicit
      priority_jurisdictions: [US, EU, CN, WIPO_Madrid]
    - {id: HC-ORG-SECONDARY, statement: .org is secondary and mainly intended for open-source/public-interest projects, source_type: owner_explicit}

owner_preferences:
  - {id: PREF-MEANING-FIRST, statement: meaningfulness and overall identity quality outrank shortness; longer names are acceptable when worthwhile, confidence: high}
  - {id: PREF-EXPRESSION-STABLE-MODERN, statement: stable, harmonious, reliable; youthfulness welcome when dependable, confidence: high}
  - {id: PREF-COMPACT-SPOKEN-RHYTHM, statement: excessive length/visual burden is a real negative; Multifinality acceptable, Transindividuality too long, confidence: high}
  - {id: PREF-UNDERSTATED-CLEVERNESS, statement: restrained second-look reward attractive; showy gimmick not, confidence: high}
  - {id: PREF-NONPERSONAL-BRAND-IDENTITY, statement: personal given-name reading is a soft negative, confidence: medium_high}
  - {id: PREF-CROSS-LANGUAGE-PRONOUNCEABILITY, statement: commercial names should be reasonably pronounceable by Chinese speakers from spelling and recoverable from hearing, confidence: high}
  - {id: PREF-BATCHED-OWNER-REVIEW, statement: expose 5-8 screened names per review turn when enough quality candidates exist, confidence: high}
  - {id: PREF-SEMANTIC-DENSITY-OVER-PHONETIC-SMOOTHNESS, statement: Merosophy beats smoother but semantically thinner coinages; semantic density and mature brand character dominate, confidence: high}

search_control:
  mode: coined_semantic_brand_divergence
  generation_isolation:
    level: best_effort_same_context
    claim_policy: sanitized positive briefs only; no literal blindness claim
  finalist_template_use: prohibited
  reality_feedback_quarantine: {enabled: true, raw_failed_strings_to_generator: prohibited}
  owner_visible_batch_target: 5_to_8
  early_creative_policy: >-
    Generate larger coined/semi-coined batches, favoring meaningful root structures and restrained conceptual depth. Reject occupied existing words, biological/scientific names, random syllable strings, and domain-driven distortions before Owner exposure.

rounds:
  - {id: RND-129, action: owner_batch_reaction_to_N131_N138, result: merosophy_remains_clear_reference_leader}
  - id: RND-130
    action: semantically_dense_coinage_expansion
    result: seven_owner_visible_survivors
    findings:
      - several first-pass candidates were rejected despite .com availability because they were existing scientific terms, existing taxonomic names, active identities, or semantically thin
      - Holomeris was excluded because it is an established trilobite genus name
      - Eidonomy was excluded because it is an established biological/taxonomic term
      - Eidovara was excluded because it is an active 2026 Windows software identity
      - Noescope was excluded because of historical exact business use
      - Varigenia and Coegenia were excluded after existing biological/company usage surfaced
      - seven coined/semi-coined names remained after semantic, pronounceability, domain and public exact-identity screening
      - exact .com and .org were directly registrable for all seven on 2026-09-11

candidates:
  - id: N130
    name: Merosophy
    role: owner_positive_reference_leader
    active: true
    domain_status: {com: available_for_registration_2026_09_11, org: available_for_registration_2026_09_11}
    owner_feedback: strongest_current_coined_candidate_usable_but_chinese_pronunciation_is_difficult
    generation_use: prohibited_as_template_or_seed
  - id: N139
    name: Veromera
    role: owner_review_batch_preliminary
    active: true
    semantic_backbone: vero/vera (truth/real) + meros (part); intended reading is truth through parts or parts forming a truthful whole
    domain_status: {com: available_for_registration_2026_09_11, org: available_for_registration_2026_09_11}
    reality_status: preliminary_low_noise
    risks: [vero_root_not_obvious_to_all_users, mild_personal_name_surface_possible]
    generation_use: prohibited_as_template_or_seed
  - id: N140
    name: Aletomera
    role: owner_review_batch_preliminary
    active: true
    semantic_backbone: aletheia-derived aleto (truth/unconcealment) + meros (part); intended reading is truth revealed through parts
    domain_status: {com: available_for_registration_2026_09_11, org: available_for_registration_2026_09_11}
    reality_status: preliminary_low_noise
    risks: [root explanation required, slightly longer five-beat reading]
    generation_use: prohibited_as_template_or_seed
  - id: N141
    name: Merolume
    role: owner_review_batch_preliminary
    active: true
    semantic_backbone: meros (part) + lumen/lume (light); intended reading is parts illuminating the whole / illumination through parts
    domain_status: {com: available_for_registration_2026_09_11, org: available_for_registration_2026_09_11}
    reality_status: preliminary_low_noise
    risks: [lume can suggest lighting/product category, meaning remains metaphorical]
    generation_use: prohibited_as_template_or_seed
  - id: N142
    name: Noemiva
    role: owner_review_batch_preliminary
    active: true
    semantic_backbone: noema/noesis (meaning/thought) + viva (living/active); intended reading is living meaning or active thought
    domain_status: {com: available_for_registration_2026_09_11, org: available_for_registration_2026_09_11}
    reality_status: preliminary_low_noise_username_only
    risks: [noe pronunciation can vary, viva construction may feel softer/name-like]
    generation_use: prohibited_as_template_or_seed
  - id: N143
    name: Merovara
    role: owner_review_batch_preliminary
    active: true
    semantic_backbone: meros (part) + varia (variation/many forms); intended reading is diverse parts / plurality of forms forming a system
    domain_status: {com: available_for_registration_2026_09_11, org: not_checked_in_this_snapshot}
    reality_status: preliminary_low_noise
    risks: [semantic center may skew toward diversity rather than knowledge/creation, mild invented-name neutrality]
    generation_use: prohibited_as_template_or_seed
  - id: N144
    name: Poimeris
    role: owner_review_batch_preliminary
    active: true
    semantic_backbone: poiesis-derived poi (making/creation) + meros (part); intended reading is creation from parts / parts becoming creation
    domain_status: {com: available_for_registration_2026_09_11, org: available_for_registration_2026_09_11}
    reality_status: preliminary_low_noise_historical_surname_noise_only
    risks: [poi pronunciation ambiguity for Chinese speakers, Greek root explanation required]
    generation_use: prohibited_as_template_or_seed
  - id: N145
    name: Formonomy
    role: owner_review_batch_preliminary
    active: true
    semantic_backbone: form + nomos/nomy (order/rule); intended reading is the ordering logic of forms or a system of forms
    domain_status: {com: available_for_registration_2026_09_11, org: available_for_registration_2026_09_11}
