  - id: N130
    name: Merosophy
    role: owner_ready_provisional_pending_formal_tm
    active: true
    morphotype: semiopaque_root_derived_proper_name
    intrinsic_case:
      - intended semantic backbone combines meros (part) with -sophy (wisdom/understanding)
      - suggests understanding through parts / relation of parts and wholes without being a literal mission phrase
      - compact, pronounceable, visually brand-like and more source-distinctive than ordinary concept words
    domain_status:
      com: available_for_registration_2026_09_11
      org: available_for_registration_2026_09_11
    reality_status: preliminary_pass_no_material_exact_identity_found
    trademark_status: preliminary_strong_ownability_signal_formal_clearance_pending
    risks:
      - not an established dictionary/philosophical term; semantic explanation is constructed from roots
      - may acquire mystical/philosophical tone due -sophy ending
      - intended root reading may not be obvious to ordinary audiences
    owner_exposure: now
    generation_use: prohibited_as_template_or_seed

