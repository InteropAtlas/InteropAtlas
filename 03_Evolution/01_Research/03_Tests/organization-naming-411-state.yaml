schema_version: '0.4.0'

task:
  issue: 411
  repository: InteropAtlas/InteropAtlas
  branch: feat/adaptive-naming-skill-v0.1
  mode: Adaptive Naming Fit Test
  status: in_progress
  snapshot_version: 44
  skill_version: 0.4.0

lineage:
  preservation_note: >-
    Naming Job 未重新初始化，G0–G8 benchmark 未恢复。snapshot v43 是 RND-066 后的 canonical baseline；
    本快照只增量加入 RND-067 white-space remap 与 RND-068 territory/phrase probe。
    历史 candidate role、reality evidence、Owner boundary 与 isolation fact 不改写；较早逐轮细节继续由 Git history 与 Issue #411 comments 保留。
  previous_snapshots:
    - {snapshot: 41, commit: d92aa17599b1460b655c236da4395e35c18cdb0a}
    - {snapshot: 42, commit: 627cfbbc5f778f80acc4a239c0c439fd7196bb56}
    - {snapshot: 43, commit: 1a693395d632586fc3a25b34eedd7652840f1897}

constraint_registry:
  confirmed_hard_constraints:
    - {id: HC-ORG-SCALE, statement: 名称必须承载 InteropAtlas 上层长期 umbrella organization，而非锁死为单一项目、协议、地图、平台或行业。, source_type: owner_explicit}
    - {id: HC-RECOVERABILITY, statement: 避免明显高误读、高听写分叉；名称需具备可接受的口语与拼写恢复性。, source_type: owner_explicit}
    - {id: HC-ORG-DOMAIN, statement: 最终 finalist 的同名普通 .org 可注册性为硬门槛；早期创意质量阶段不以此淘汰。, source_type: owner_explicit}
  owner_preferences:
    - {id: PREF-LOW-MISREAD, statement: 更偏好不容易误读的名称。}
  controller_search_variables:
    - {id: SV-WORD-COUNT, current_value: open, owner_approval_required_to_change: false}
    - {id: SV-SEMANTIC-TRANSPARENCY, current_value: adaptive, owner_approval_required_to_change: false}
    - {id: SV-NAME-LENGTH, current_value: adaptive, owner_approval_required_to_change: false}
    - {id: SV-SEARCH-CADENCE, current_value: adaptive, owner_approval_required_to_change: false}

mission_value_model:
  core_structure: Commons -> Perspective -> Creation -> Commons
  value_claims:
    - {id: V-COMMONS, statement: knowledge should remain part of a shared commons, priority: core}
    - {id: V-AGENCY, statement: individuals should retain interpretive perspective and choice, priority: core}
    - {id: V-CREATION, statement: perspective should enable creation / discovery, priority: high}
    - {id: V-RETURN, statement: creation can contribute back into shared knowledge, priority: high}
  integrity: {value_flattening_detected: false, mission_overcompression_detected: false, value_proxy_collapse_detected: false}

name_job_model:
  primary_jobs:
    - durable independently recognizable umbrella-organization identity
    - support multiple projects / research / tools / education / publishing / public knowledge work
    - acceptable spoken and written recoverability
    - enough semantic room for long-term brand meaning
  non_jobs:
    - bare name does not need to encode the complete mission loop
    - bare name does not need to enumerate future activities
  tensions: [distinctiveness_vs_recoverability, semantic_grounding_vs_ownable_identity, institutional_scale_vs_creative_energy]
  status: active

decision_criteria:
  items:
    - {id: C-SCALE, role: gate}
    - {id: C-RECOVERY, role: optimize}
    - {id: C-DISTINCT, role: optimize}
    - {id: C-VALUE, role: optimize}
    - {id: C-DOMAIN, role: gate}
    - {id: C-OWNER, role: prefer}
    - {id: C-TM, role: observe}
  integrity: {role_confusion_detected: false, role_drift_detected: false}

preference_model:
  signals:
    - {preference_id: PREF-MODEL-001, statement: low misread / low dictation branching is preferred, scope: task, confidence: high, stability: emerging}
  generation_template_use: prohibited

search_landscape:
  regions:
    - {region_id: REG-LEXICAL-EXISTING, sampling_status: sampled, quality_yield: medium_high, reality_crowding: high, information_gain: low}
    - {region_id: REG-NATURAL-COMPOUND-PAIR, sampling_status: sampled, quality_yield: medium_high, reality_crowding: high, information_gain: low_medium}
    - {region_id: REG-GROUNDED-COINAGE, sampling_status: sampled, quality_yield: medium_high, reality_crowding: high, information_gain: low}
    - {region_id: REG-SHORT-OPAQUE-COINED, sampling_status: sampled, quality_yield: mixed, reality_crowding: high, information_gain: low}
    - {region_id: REG-LONGER-PHONOTACTIC-PROPER, sampling_status: sampled, quality_yield: medium, reality_crowding: medium, information_gain: medium_low}
    - {region_id: REG-HYBRID-ANCHORED-PAIR, sampling_status: sampled_move_away, quality_yield: low_medium, reality_crowding: unknown, information_gain: low, move_or_stay_rationale: recovery improved but umbrella identity weakened into institution/event/studio character}
    - {region_id: REG-SEGMENTABLE-SEMI-OPAQUE, sampling_status: sampled_move_away, quality_yield: medium_high, reality_crowding: high_current_task, information_gain: low, move_or_stay_rationale: intrinsic benefit repeated but top slice failed on exact identity or .org gate}
    - region_id: REG-EVOCATIVE-RELATIONAL-PHRASE
      semantic_position: [evocative, relational, indirect_value_connection]
      character_position: [spoken_natural, institutional_creative_balance]
      construction_position: [two_to_three_word_phrase_identity, syntactic_relation_not_generic_descriptor_pair]
      collision_prior: unknown
      evidence_confidence: medium
      quality_yield: medium_high_current_probe
      reality_crowding: medium_unknown
      information_gain: high
      sampling_status: active_probe
      move_or_stay_rationale: RND-067 remap identified a materially different route based on whole relational propositions/imagery rather than more suffix/root/phonotactic optimization; RND-068 produced at least one reality-plus-domain survivor
  online_updates:
    - {round: RND-065, update: anchored-pair recovery benefit did not translate into independent umbrella identity; segmentable forms improved intrinsic identity but top-slice reality was crowded}
    - {round: RND-066, update: segmentable intrinsic gain repeated but progression again failed at reality/domain; move away}
    - {round: RND-067, update: remap found diminishing information in further invented-form subdivision; next useful variable is source material / relational phrase identity}
    - {round: RND-068, update: relational phrase territory produced one current promising internal survivor and several weaker/sibling forms; region remains worth bounded exploration but survivor shape is quarantined}
  integrity: {survivor_shape_feedback_detected: false, region_quality_reality_conflation_detected: false}

search_control:
  mode: exploration
  search_cadence: {mode: focused_exploitation, target_count: 3, rationale: one promising signal emerged but a single survivor is insufficient; continue region-level exploration without reusing its lexical shape, stop_condition: stop after one bounded independent phrase batch or earlier on mode collapse}
  generation_isolation:
    level: best_effort_same_context
    runtime_identity: ChatGPT current conversation runtime
    historical_context_may_have_seen_controller_only_exclusions: true
    claim_policy: sanitized logical briefs only; no claim that workers literally never saw history
  incumbent_isolation: {comparison_only_candidate_ids: [N060]}
  controller_only_exclusions:
    incumbent_candidate_ids: [N060]
    cooled_family_ids: [FAM-V34-01, FAM-RND046-01, FAM-RND051-01]
    owner_reaction_subject_ids: [N060]
    other: [N061_historical_hold_not_generation_seed, historical_reality_survivor_shapes, N096_not_a_generation_template]
  reality_feedback_quarantine: {enabled_in_exploration: true, same_batch_feedback_to_generator: prohibited}
  post_generation_filter: {enabled: true, check_cooled_families: true, check_incumbent_similarity: true, check_strategy_fidelity: true}

reality_screening:
  method_ref: reality-screening-contract-v0.3.3
  status: active
  minimum_level_for_held_or_promising: 1
  freshness_recheck_before_owner_exposure: true
  query_classes: [bare_exact, company_organization, software_product_project, naming_job_adjacent_category, public_trademark_signal, near_name_and_recovery_branch_before_promotion]

workflow_scheduler:
  policy: diagnosis_driven_pattern_portfolio
  recent_allocations: [RND-062:divergence_burst, RND-063:creative_linguistic_parallel, RND-064:white_space_mapping, RND-065:category_parallel, RND-066:online_observe_update, RND-067:white_space_mapping, RND-068:territory_expansion]
  active_patterns:
    - {pattern_id: territory_expansion, status: completed_current_trigger, last_used_round: RND-068, question_to_answer: can materially different relational/imagery material produce a recoverable organization identity without returning to generic compounds or opaque coinage}
    - {pattern_id: focused_exploitation, status: active_next, trigger_diagnosis_ids: [D-R068-01], question_to_answer: can the phrase region produce a second independent survivor without copying the first survivor's lexical family}
  diagnostics: {workflow_monoculture: false, workflow_operator_confusion: false}

method_scheduler:
  policy: adaptive_operator_portfolio
  active_strategies:
    - {strategy_id: evocative_relational_phrase_operator, family: phrase_identity, status: active_bounded}
    - {strategy_id: longer_phonotactic_proper_name, family: controlled_coinage, status: guarded_hold}
    - {strategy_id: segmentable_semi_opaque_operator, family: controlled_coinage, status: deprioritized_after_repeatability_check}
    - {strategy_id: hybrid_anchored_pair_operator, family: compositional_derived, status: deprioritized_after_probe}
    - {strategy_id: transformation_operator, family: transformation_operator, status: rescue_only}
  diagnostics: {scheduler_monoculture: false, method_underuse: false, territory_material_starvation: false}

execution:
  autonomous_microcycles: true
  module_policy: progressive_disclosure
  runtime_capability_profile:
    shared_context_only: true
    fresh_context_available: false
    isolated_subagents_available: false
    tool_rich_browser_or_shell: true
    persistent_state_io: true
    parallel_workers_available: false
  runtime_adapter:
    actual_isolation_level: best_effort_same_context
    fidelity_limitations: [logical roles share historical model context, blindness claims limited to omission/sanitized views]
  owner_interaction_gate:
    classification: search_strategy
    decision: continue_autonomously
    reversible_without_owner: true
    confirmed_constraint_ids_affected: []

