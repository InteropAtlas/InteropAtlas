schema_version: '0.4.0'

task:
  issue: 411
  repository: InteropAtlas/InteropAtlas
  branch: feat/adaptive-naming-skill-v0.1
  mode: Adaptive Naming Fit Test
  status: in_progress
  snapshot_version: 78
  skill_version: 0.4.0

lineage:
  preservation_note: >-
    Naming Job 未重新初始化，G0–G8 benchmark 未恢复。snapshot v77 将正式候选主路线切换为自造/半自造专名，并加入中文母语者跨语言发音恢复权重。
    Owner 随后要求提高每次交付的候选数量，避免每轮只看一个名字造成交互成本。本快照因此提高内部生成量与 Owner-visible batch size，
    但仍要求先做 intrinsic / pronunciation / .com / reality 快筛，避免用低质量名字凑数。

constraint_registry:
  confirmed_hard_constraints:
    - {id: HC-ORG-SCALE, statement: long-term umbrella organization scale, source_type: owner_explicit}
    - {id: HC-RECOVERABILITY, statement: avoid obvious high misread / dictation branching, source_type: owner_explicit}
    - id: HC-COM-DOMAIN
      statement: exact .com must be practically obtainable for the commercial umbrella organization; direct registration preferred, aftermarket purchase acceptable when realistic
      source_type: owner_explicit
      primary_domain: .com
    - id: HC-TM-REGISTRABILITY
      statement: finalist must have a good trademark-registration outlook for long-term commercial organization use
      source_type: owner_explicit
      priority_jurisdictions: [US, EU, CN, WIPO_Madrid]
    - {id: HC-ORG-SECONDARY, statement: .org is secondary and mainly intended for open-source/public-interest projects, source_type: owner_explicit}

owner_preferences:
  - {id: PREF-MEANING-FIRST, statement: meaningfulness and overall identity quality outrank shortness; longer names are acceptable when worthwhile, confidence: high}
  - {id: PREF-EXPRESSION-STABLE-MODERN, statement: stable, harmonious, reliable; youthfulness welcome when dependable, confidence: high}
  - {id: PREF-COMPACT-SPOKEN-RHYTHM, statement: shorter spoken effort is secondary overall, but excessive length/visual burden is a real negative; Multifinality felt acceptable while Transindividuality felt too long, confidence: high}
  - {id: PREF-UNDERSTATED-CLEVERNESS, statement: restrained second-look reward attractive; showy gimmick not, confidence: high}
  - {id: PREF-MORPHOTYPE-OPENNESS, statement: preserve broad form diversity; no single naming architecture should dominate Owner-visible exploration absent evidence of preference, confidence: high}
  - {id: PREF-NONPERSONAL-BRAND-IDENTITY, statement: personal given-name reading is a soft negative, confidence: medium_high}
  - {id: PREF-CONCEPTUAL-BRANDABILITY, statement: established concept words may still be attractive as preference evidence, but formal candidate generation should prioritize coined/semi-coined proprietary names, confidence: high}
  - id: PREF-CROSS-LANGUAGE-PRONOUNCEABILITY
    statement: Commercial names should be reasonably pronounceable by Chinese speakers from spelling and recoverable from hearing; Merosophy is acceptable overall but has noticeable Chinese-speaker pronunciation friction.
    confidence: high
  - id: PREF-BATCHED-OWNER-REVIEW
    statement: Owner prefers seeing multiple screened names per review turn rather than one-at-a-time exposure; target 5-8 meaningful screened candidates when available.
    confidence: high

search_control:
  mode: coined_semantic_brand_divergence
  generation_isolation:
    level: best_effort_same_context
    claim_policy: sanitized positive briefs only; no literal blindness claim
  finalist_template_use: prohibited
  reality_feedback_quarantine: {enabled: true, raw_failed_strings_to_generator: prohibited}
  owner_visible_batch_target: 5_to_8
  early_creative_policy: >-
    Generate larger internal coined/semi-coined batches, then screen for semantic backbone, brand shape, Chinese/English pronunciation, .com obtainability and reality collision before Owner exposure.
    Coined must not degrade into random SaaS syllable strings.

morphotype_portfolio:
  rule: no_single_form_class_should_dominate
  priority_classes:
    - semiopaque_root_derived_proper_name
    - semantically_motivated_fusion
    - coined_single_token_with_clear_morpheme_backbone
    - symbolic_or_structural_coinage
    - crosslanguage_root_fusion_with_high_pronounceability
  evaluation_policy: >-
    Promoted coinages should have coherent semantic rationale, strong recoverability, natural brand shape, and acceptable Chinese/English pronunciation burden.

rounds:
  - {id: RND-124, action: shorter_true_concept_and_semiopaque_search, result: two_materially_distinct_survivors}
  - {id: RND-125, action: owner_shifts_priority_to_proprietary_coinage, result: coined_name_route_promoted}
  - {id: RND-126, action: owner_reaction_to_merosophy, result: acceptable_with_cross_language_pronunciation_risk}
  - id: RND-127
    action: owner_requests_larger_candidate_batches
    result: owner_visible_batch_size_increased
    findings:
      - Owner says one-name-at-a-time review wastes time
      - future review turns should expose 5-8 already-screened names when enough quality candidates exist
      - batching does not relax quality or commercial gates
  - id: RND-128
    action: large_semantic_coinage_batch_with_cross_language_screen
    result: eight_owner_visible_preliminary_survivors
    findings:
      - multiple internal batches were generated; many short strings were rejected because .com was occupied or semantic backbone was too weak
      - direct-registration .com survivors selected for Owner review: Noemavia, Noetivia, Variavera, Pluravera, Coemera, Synmeros, Cohavera, Versivon
      - exact .org was also directly registrable for all eight on 2026-09-11
      - public exact-name web screening found a material issue for Relavera-like forms and Merovida/Merovon, which were excluded from Owner-visible batch
      - preliminary exact-name searches for the eight selected names found no material active exact commercial identity in current search; formal trademark database clearance remains pending

