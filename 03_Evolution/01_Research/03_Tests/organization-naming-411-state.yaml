    - {id: C-RECOVERY, role: optimize}
    - {id: C-DISTINCT, role: optimize}
    - {id: C-VALUE, role: optimize}
    - {id: C-DOMAIN, role: gate}
    - {id: C-OWNER, role: prefer}
    - {id: C-TM, role: observe}
  integrity: {role_confusion_detected: false, role_drift_detected: false}

preference_model:
