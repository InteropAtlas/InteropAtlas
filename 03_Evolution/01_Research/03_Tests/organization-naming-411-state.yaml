schema_version: '0.4.0'

task:
  issue: 411
  repository: InteropAtlas/InteropAtlas
  branch: feat/adaptive-naming-skill-v0.1
  mode: Adaptive Naming Fit Test
  status: in_progress
  snapshot_version: 71
  skill_version: 0.4.0

lineage:
  preservation_note: >-
    Naming Job 未重新初始化，G0–G8 benchmark 未恢复。snapshot v70 新增 .com 与商标初筛但仍把 .com 视为风险信号。
    Owner 现明确商业化母组织的硬门槛：exact .com 必须可注册，且名称必须具有良好的商标注册前景；母组织主要使用 .com，.org 主要服务开源/公共项目。
    因此本快照将 .com 与 trademark registrability 提升为 finalist hard gates，并重新筛查现有候选。

constraint_registry:
  confirmed_hard_constraints:
    - {id: HC-ORG-SCALE, statement: long-term umbrella organization scale, source_type: owner_explicit}
    - {id: HC-RECOVERABILITY, statement: avoid obvious high misread / dictation branching, source_type: owner_explicit}
    - id: HC-COM-DOMAIN
      statement: exact ordinary .com must be available for registration for the commercial umbrella organization; .com is the primary organization domain
      source_type: owner_explicit
    - id: HC-TM-REGISTRABILITY
      statement: finalist must have a good trademark-registration outlook for long-term commercial organization use, not merely absence of an obvious exact-name collision
      source_type: owner_explicit
      priority_jurisdictions: [US, EU, CN, WIPO_Madrid]
    - id: HC-ORG-SECONDARY
      statement: .org is secondary and mainly intended for open-source/public-interest projects; .org availability is not the primary mother-organization gate
      source_type: owner_explicit

owner_preferences:
  - {id: PREF-MEANING-FIRST, statement: meaningfulness and overall identity quality outrank shortness; longer names are acceptable when worthwhile, confidence: high}
  - {id: PREF-EXPRESSION-STABLE-MODERN, statement: stable, harmonious, reliable; youthfulness welcome when dependable, confidence: high}
  - {id: PREF-COMPACT-SPOKEN-RHYTHM, statement: shorter spoken effort is secondary preference only, confidence: high, priority: secondary}
  - {id: PREF-RHYTHMIC-SYMMETRY, statement: balanced spoken structure is optional bonus, confidence: high}
  - {id: PREF-VISUAL-SYMMETRY-CYCLE, statement: visual symmetry/cycle echo is optional bonus, confidence: high}
  - {id: PREF-UNDERSTATED-CLEVERNESS, statement: restrained second-look reward attractive; showy gimmick not, confidence: high}
  - {id: PREF-MORPHOTYPE-OPENNESS, statement: preserve broad form diversity; no single naming architecture should dominate Owner-visible exploration absent evidence of preference, confidence: high}
  - {id: PREF-NONPERSONAL-BRAND-IDENTITY, statement: personal given-name reading is a soft negative, confidence: medium_high}
  - {id: PREF-CONCEPTUAL-BRANDABILITY, statement: established concept words may still be attractive when they read as coherent standalone brands; Multifinality remains positive preference evidence only, confidence: high}

mission_value_model:
  core_structure_available_to_controller: true
  literal_value_tokens_available_to_generator: false
  generator_representation: abstract_relations_and_transformations_only

integrity_incidents:
  - {id: INC-SEMANTIC-ANCHOR-001, status: corrected_and_live_recovery_observed, classification: controller_runtime_fidelity_failure}
  - {id: INC-MORPHOTYPE-COLLAPSE-002, status: corrected_and_live_recovery_observed, classification: workflow_scheduler_fidelity_failure}

search_control:
  mode: commercial_brand_hard_gate_divergence
  generation_isolation:
    level: best_effort_same_context
    claim_policy: sanitized positive briefs only; no literal blindness claim
  finalist_template_use: prohibited
  reality_feedback_quarantine: {enabled: true, raw_failed_strings_to_generator: prohibited}
  early_creative_policy: >-
    .com and trademark gates remain finalist-stage reality constraints rather than Generator vocabulary constraints. Do not let availability patterns become naming templates.

morphotype_portfolio:
  rule: no_single_form_class_should_dominate
  parallel_classes: [lexical_single_semantic_transfer, blend_or_semantic_fusion, root_derived_or_affixal, opaque_or_semiopaque_proper_name, nonenglish_or_crosslanguage_identity, symbolic_or_structural_identity, compound_single_token, phrase_or_relational_name_minor_budget_only]
  evaluation_policy: meaning may be implicit, etymological, structural, metaphorical or brand-built; phrase-level transparency is not required

rounds:
  - {id: RND-116, action: owner_reaction_to_multifinality, result: strong_positive_brandability_signal}
  - {id: RND-117, action: multifinality_domain_and_trademark_due_diligence_extension, result: .com_unavailable}
  - id: RND-118
    action: owner_promotes_com_and_trademark_to_commercial_hard_gates
    result: candidate_pool_reclassified
    findings:
      - commercial mother organization will primarily use .com
      - exact .com registration availability is now mandatory for any finalist
      - good trademark registrability is mandatory; absence of exact collision alone is insufficient
      - .org is secondary and mainly relevant to open-source/public projects
  - id: RND-119
    action: existing_candidate_exact_com_rescreen
    result: major_pool_contraction
    findings:
      - openregard.com available on 2026-09-11
      - publicsingular.com available on 2026-09-11
      - compossibility.com available on 2026-09-11
      - seeotherwise.com unavailable on 2026-09-11
      - elseground.com unavailable on 2026-09-11
      - multifinality.com unavailable on 2026-09-11
