  source_refs:
  - VISION
  - MODEL36
  - JOBS46
  - POLICY72
  - BASE84
  primary_jobs:
  - 形成长期、可独立识别并积累信誉的母组织身份。
  - 能容纳多个独立项目、研究、工具和公共知识/创造工作，而不绑定当前项目形态。
