next_action:
  action: reconcile_remaining_search_runtime_and_screening_evidence_without_generation
  rationale: >-
    Mission/Value 与 Name Job 已作有来源的当前重建，商业域名边界保持 v84。下一步定向核对搜索/调度、实际运行及筛查证据；缺失继续记 unknown。
