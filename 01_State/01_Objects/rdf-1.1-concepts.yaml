scope_notes_zh: 固定版本主体，不代表现行 RDF 全族或 IA 采用。第 3/4 节定义图为三元组集合、数据集包含一个默认图及零个或多个命名图；抽象模型不是 Turtle/JSON-LD 等具体语法、处理算法或软件。本文档与
  RDF 1.2 保持独立身份，不据此建立替代/更新边或断言具体实现互通。
scope_notes_en: A fixed-version subject, not the entire current RDF family or IA adoption. Sections 3/4 define graphs
  as triple sets and datasets with one default and zero or more named graphs. This abstract model is not a concrete
  syntax, processing algorithm or software. It remains distinct from RDF 1.2; no update/replacement edge or implementation
  interoperability is inferred.
