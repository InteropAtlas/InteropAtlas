description_zh: Git 客户端与服务端交换仓库数据时使用的传输协议版本。InteropAtlas 使用 Git/GitHub 进行版本控制，因此该协议作为首批自举研究对象纳入，但“Git 整体”不应被简化成单一标准对象。
  本次相接的 Git 2.52.0 软件先例仅为已选 v2 的服务端 ls-refs 引用筛选/格式化与 stdout pkt-line 输出；不是网络送达、完整协议或安全/采用证明。固定 2.51/2.52 文档仅 ls-refs
  段相同，全文不同；ref-prefix 可退回广枚举，hideRefs/namespace/unborn 配置及资源/输出条件适用。源码未运行。
description_en: Version 2 of Git's wire protocol for repository data exchange. InteropAtlas uses Git/GitHub for
  version control, so this protocol is included as a bootstrap research object; Git as a whole should not be reduced
  to a single standards object. The linked Git 2.52.0 software precedent covers only v2-selected server ls-refs
  filtering/formatting and stdout pkt-line output, not network delivery, complete protocol or security/adoption
  evidence. Only the ls-refs subsections of fixed 2.51/2.52 documents match, not the full documents. ref-prefix
  can fall back to broader enumeration; hideRefs/namespace/unborn configuration and resource/output conditions apply.
  Sources were not run.
