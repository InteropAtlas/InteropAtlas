summary_zh: "W3C PROV-AQ 是 W3C Working Group Note（工作组说明），描述如何通过标准 Web 协议定位、获取和查询资源的 Provenance（溯源）记录。InteropAtlas 将其作为未来结构化溯源检索的参考先例，但当前不采用其查询服务协议，也不把它当作 W3C Recommendation。"
summary_en: "W3C PROV-AQ is a W3C Working Group Note describing mechanisms for locating, retrieving and querying provenance records using standard Web protocols. InteropAtlas records it as a future reference for structured provenance access, without adopting its query-service protocol in the current profile."
