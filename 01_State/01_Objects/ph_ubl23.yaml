name_en: ph-ubl23 UBL 2.3 Java binding library
description_zh: 独立发布的 Java/JAXB 模块，提供 UBL 2.3 文档类型模型、XML 读写及可配置的 XSD 支持；本记录固定 Maven 10.2.1，不表示完整业务文档符合性。
description_en: A separately published Java/JAXB module providing UBL 2.3 document models, XML reading/writing and
  configurable XSD support; pinned to Maven 10.2.1, not a complete business-document conformance claim.
version: 10.2.1
