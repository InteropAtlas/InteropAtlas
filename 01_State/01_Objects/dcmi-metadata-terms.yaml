description_zh: "DCMI 当前维护的元数据术语规范，包含 properties、classes、datatypes 与 vocabulary encoding schemes，并明确支持 application profile 组合使用。除类型、creator/contributor/publisher 等元数据关系外，其中 `modified` 表达资源修改日期，`provenance` 表达对真实性、完整性和解释有意义的所有权与保管历史，因此也是 InteropAtlas 生命周期和 Provenance（溯源）设计的重要成熟先例。"
description_en: "The current specification of metadata terms maintained by DCMI, including properties, classes, datatypes and vocabulary encoding schemes, designed for reuse in application profiles. In addition to resource typing and creator/contributor/publisher metadata, its `modified` and `provenance` terms provide mature precedents for lifecycle and provenance description in InteropAtlas."
