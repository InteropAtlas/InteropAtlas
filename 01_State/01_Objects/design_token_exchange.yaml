id: design_token_exchange
type: capability
name_zh: 设计令牌交换
name_en: Design Token Exchange
description_zh: 以工具和平台无关的结构表达并交换颜色、尺寸、排版等设计决策，使设计系统中的语义值可跨设计工具、代码和平台复用。
description_en: Express and exchange design decisions such as colors, dimensions, and typography in a tool- and platform-agnostic structure so semantic values can be reused across design tools, code, and platforms.
category: exchange
layers: [data_syntax, semantics, capability_service]
domains: [design_system, visual_design, information_design, interoperability]
