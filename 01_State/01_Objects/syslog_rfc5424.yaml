name_zh: Syslog 协议原始文献（RFC 5424）
name_en: Syslog Original Protocol Publication (RFC 5424)
official_name: The Syslog Protocol
description_zh: 'RFC 5424 原版定义独立于传输层的事件通知消息：头部、结构化数据（可用 NILVALUE）与可选 MSG。它不是存储格式；传输映射另行规定，但 §5.1 要求实现支持 TLS 映射，并建议支持
  UDP 映射。时间戳采用受限 RFC 3339 语法，或在无法获取系统时间时使用 NILVALUE：T/Z 大写、禁止闰秒、小数秒最多六位。协议本身不保证送达或安全，超长消息可能被截断或丢弃。固定 2009 年 3 月原始出版物；信息页列五项勘误报告，内容与处理状态未核验，不声称已整合勘误或当前完整修订语义。
  官方状态为 Proposed Standard，取代 RFC 3164。仅作协议文献记录，不表示完整日志平台、部署适用性、实现符合性或 IA 采用；observability 仅是编辑导航，无技术关系。


  English scope and limitations:


  The original RFC 5424 defines transport-independent event messages: a header, structured data (or NILVALUE), and
  optional MSG. It is not a storage format. Transport mappings are separate, but §5.1 requires TLS mapping support
  and recommends UDP mapping support. Timestamps use restricted RFC 3339 syntax or NILVALUE when system time is
  unavailable: uppercase T/Z, no leap seconds, at most six fractional digits. Delivery and security are not guaranteed;
  oversized messages may be truncated or dropped. Fixed March 2009 original publication, Proposed Standard, obsoleting
  RFC 3164. Five errata reports are indicated; their contents/status were not reviewed or incorporated. No complete
  corrected semantics, full logging platform, deployment suitability, implementation conformance or IA adoption
  is asserted. Observability membership is editorial navigation; no technical relations.'
description_en: 'The original RFC 5424 defines transport-independent event messages: a header, structured data (or
  NILVALUE), and optional MSG. It is not a storage format. Transport mappings are separate, but §5.1 requires TLS
  mapping support and recommends UDP mapping support. Timestamps use restricted RFC 3339 syntax or NILVALUE when
  system time is unavailable: uppercase T/Z, no leap seconds, at most six fractional digits. Delivery and security
  are not guaranteed; oversized messages may be truncated or dropped. Fixed March 2009 original publication, Proposed
  Standard, obsoleting RFC 3164. Five errata reports are indicated; their contents/status were not reviewed or incorporated.
  No complete corrected semantics, full logging platform, deployment suitability, implementation conformance or
  IA adoption is asserted. Observability membership is editorial navigation; no technical relations.'
