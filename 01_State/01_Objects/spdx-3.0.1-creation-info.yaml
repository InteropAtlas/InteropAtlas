summary_zh: "SPDX 3.0.1 的 CreationInfo 用结构化字段描述一个元素何时创建、由谁创建、使用什么工具创建以及采用哪个规范版本。InteropAtlas 将其作为结构化时间、身份与工具留痕的工程先例，并保持 IA 自身更轻量的字段设计。"
summary_en: "SPDX 3.0.1 CreationInfo records when an element was created, who or what created it, tooling used during creation, and the specification version. InteropAtlas uses it as an engineering precedent for structured time, identity, and tooling provenance while keeping a lighter project-specific profile."
