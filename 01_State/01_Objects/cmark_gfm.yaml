id: cmark_gfm
type: system
kind: library
name_zh: cmark-gfm GFM C 解析与渲染库
name_en: cmark-gfm GFM C parsing and rendering library
description_zh: 官方 github/cmark-gfm 的 C 库与 CLI，固定 0.29.0.gfm.13，通过显式扩展配置解析 GFM 文档并输出 AST、HTML 片段及所选 CommonMark
  表示；它不是 core cmark、GFM 规范或 GitHub 生产渲染服务。固定 README 与规范测试头连接到 GFM 0.29（2019-04-06），但源码语料与公开规范并不相同。自定义 GCC 静态构建在
  --unsafe 下对源码 670 个 active 示例逐字匹配；另两个 disabled 任务列表例按缺少 tasklist 的原配置单独运行且不匹配，不计为全规范通过。公开 677 例在五扩展全开时为 651
  匹配、26 差异；另行按章节选择扩展的诊断为 661 匹配、16 差异，不是推荐解析模式。两配置共有的 16 项包括九处嵌套 strong 结构、一处超大数字实体、两处 XMPP 自动链接、两处原始 HTML 注释，以及两处复选框属性顺序/空元素闭合序列化差异；后两项仍输出
  checked/unchecked 的 disabled 复选框，不是缺少任务列表功能。全开多出的十项是 tagfilter 与 autolink 各五处作用于核心示例的配置交互。没有规范化 HTML 来抹去差异，配置与重放计数不累加为独立覆盖。CLI
  须显式 -e table -e strikethrough -e autolink -e tagfilter -e tasklist；测试的默认 CLI、options=0 convenience API 及仅注册扩展路径不生成
  GFM 表格。API 需向 parser 附加扩展，HTML renderer 还需收到扩展列表；即使已附加，传 NULL 列表仍绕过 tagfilter。Footnotes 是额外 opt-in，不属于这五项；不能断言所有
  convenience 选项都仅有核心行为。启用删除线时默认接受一或两个波浪号，可选 double-tilde 限制为两个。任务列表只是静态禁用复选框，不提供 GitHub 交互。HTML 默认省略原始 HTML 并清空所查危险
  URL，--unsafe 放行；tagfilter 只转义九种标签开头，不是 sanitizer，所查 onclick 属性与 javascript URL 仍保留。CLI --safe 被拒绝；API 旧 SAFE
  位无效，不能撤销 UNSAFE。所查 data:image/png 例外不仅用于图片 src，也用于链接 href。非法 UTF-8 默认可透传，--validate-utf8 替换而非拒绝；NUL 即使未启用也被替换。CommonMark
  输出可保留原始节点并改变词法标记；六个另行往返观察保持结果 HTML，原字节只在一例保持，不是通用无损。43 项有限记录为一项版本、一项扩展清单与 41 项 CLI/API 观察，另行六例与规范语料不混为总覆盖；不主张完整
  GFM 符合性、所有 API/输入、浏览器/动态 ABI、上游完整套件、性能、安全、供应链认证或 IA 采用。
description_en: The official github/cmark-gfm C library and CLI, fixed to 0.29.0.gfm.13, parses configured GFM
  documents into AST, HTML fragments and selected CommonMark representations. It is distinct from core cmark,
  the GFM specification and GitHub production rendering. The pinned README and corpus header connect it to GFM
  0.29 (2019-04-06), but source and public corpora are not identical. A custom GCC static build with --unsafe
  exactly matched 670 active source examples; two disabled task-list cases were separately exercised in their
  original configuration lacking tasklist and did not match, not a whole-spec pass. Of 677 public cases, globally
  enabling all five extensions gives 651 exact matches and 26 differences; a separate section-selective diagnostic
  gives 661 matches and 16 differences, not a recommended parsing mode. The shared 16 comprise nine nested-strong
  structures, one oversized numeric entity, two XMPP autolinks, two raw HTML comments and two checkbox attribute-order/void-element
  serialization differences. The latter still emit checked/unchecked disabled checkboxes, not missing task-list
  functionality. The extra ten all-five differences are five tagfilter and five autolink interactions with core
  examples. HTML was not normalized to remove differences; profiles and replays overlap and are not accumulated
  as independent coverage. The CLI needs explicit -e table -e strikethrough -e autolink -e tagfilter -e tasklist.
  The tested default CLI, options=0 convenience API and registration-only paths do not produce GFM tables. API
  parsing requires attachment, and HTML rendering also needs the extension list; passing NULL bypasses tagfilter
  even after attachment. Footnotes are a separate opt-in, not one of these five; not every convenience-option
  behavior is core-only. Enabled strikethrough accepts one or two tildes by default, with a double-tilde option.
  Task markup is static and disabled, not GitHub interaction. HTML defaults omit raw HTML and empty checked dangerous
  URLs; --unsafe allows them. Tagfilter only escapes the start of nine named tags, is not a sanitizer, and retained
  the checked onclick attributes and javascript URLs. CLI --safe is rejected; the legacy API SAFE bit has no effect
  and cannot revoke UNSAFE. The checked data:image/png exception applies to link href as well as image src. Invalid
  UTF-8 can pass through by default; --validate-utf8 replaces rather than rejects it, while NUL is replaced without
  the flag too. CommonMark output can retain raw nodes and rewrite lexical form. Six separate roundtrips retained
  resulting HTML but only one retained source bytes, not universal losslessness. The 43 finite records are one
  version, one extension inventory and 41 CLI/API observations; six roundtrips and specification profiles remain
  separate. No full GFM conformance, all-API/input, browser/dynamic-ABI, upstream full-suite, performance, security,
  supply-chain or IA-adoption claim is made.
