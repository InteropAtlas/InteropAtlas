scope_notes_zh: 主体仅 github/cmark-gfm，固定 release 0.29.0.gfm.13，发布于 2023-07-21，tag 核验时指向 587a12bb54d95ac37241377e6ddc93ea0e45439b；不把可移动
  tag 或 release 当不可变 attestation，也不声称最新。实际 tree 19280c0fd1deb8fd05aaab1002058e845f1dfb60 有 178 条目：162 blobs、16
  trees、无 gitlinks；官方 codeload 包中 162 个文件均与 Git blob 原字节一致，没有规范化。固定 README 明示开头以外很多内容继承自上游，故不复制 blanket 性能、符合性或
  wrapper 宣称。规范版本桥接来自明确 GFM 来源与 0.29/2019-04-06 测试头，而不是 0.29.0.gfm.13 名字；公开 HTML 的 677 例与源码 672 例实际不同，按精确 Markdown
  对齐为 654 个输入/输出对相同、9 个同输入输出不同、14 个无相同源码输入。公开页面是带捕获时间与 SHA256 的观察，不保证 URL 内容永久不变；/spec.txt 与 /spec.json 的 404、connector
  tags 集合 400 以及本地 helper 正则/计数修正均保留，不是产品缺陷修复。仅 document_representation：所查表格、任务项、删除线、自动链接、层次/AST 和 HTML 片段支持结构化文档表示；不附加新的能力或其他实现边。关系追加到既有
  CommonMark-family implementation 文件只是物理实例归档，保留既有 cmark 原字节，不改变规范身份或维护机制。CMake 不可用，按固定 CMake 清单用 GCC 14.2 自定义静态构建
  27 core C + 7 extension C + main.c，共 35 文件；仅生成 config/version/static-export 头，使用已检入 scanner，没有改源、安装、生成器、CMake
  或完整上游运行器。作者另行构建/重放与研究者结果相符是作者核验，不是独立接纳。不同目录构建可嵌入绝对路径；本地 binary hash 仅绑定本地字节，不证明二进制可复现、官方发行、签名、供应链或跨平台一致性。API
  helper 是有限直接调用，不是动态 ABI/完整 API 认证；未在浏览器执行产生的 HTML，未操作 GitHub 服务或远程端点。CommonMark/XML 等输出策略不能从默认 HTML 策略外推；所选
  CommonMark 往返不代表所有扩展、标记或输入无损。COPYING 中源码、组件、文档和测试通知范围不同，省略 license_expression/open_source，不形成统一许可法律或治理结论。
scope_notes_en: 'The subject is only github/cmark-gfm release 0.29.0.gfm.13, published 2023-07-21, with the observed
  tag resolving to 587a12bb54d95ac37241377e6ddc93ea0e45439b. A movable tag/release is not immutable attestation
  or a latest-version claim. Actual tree 19280c0fd1deb8fd05aaab1002058e845f1dfb60 has 178 entries: 162 blobs,
  16 trees and no gitlinks. All 162 codeload files match raw Git blob bytes without normalization. The pinned
  README says much of its remainder is inherited upstream text, so blanket performance, conformance and wrapper
  statements are not transferred. The edition bridge is explicit GFM provenance and the 0.29/2019-04-06 corpus
  header, not the release spelling. Public HTML has 677 cases versus 672 source cases; exact-Markdown alignment
  finds 654 matching input/output pairs, nine same-input/different-output cases and 14 with no exact source input.
  The public page is a timestamped, hashed observation, not an immutable URL guarantee. Retained /spec.txt and
  /spec.json 404s, connector tags-collection 400 and local helper regex/count corrections are not product bug
  fixes. Only document_representation is proposed: checked tables, tasks, strikethrough, links, hierarchy/AST
  and HTML fragments substantiate structured-document representation. Appending to the existing CommonMark-family
  implementation file is ordinary physical storage only, preserving prior cmark bytes without changing specification
  identity or maintenance. CMake was unavailable; a custom GCC 14.2 static build follows fixed CMake lists: 27
  core C files, seven extension C files and main.c, 35 total. Only config/version/static-export headers were generated;
  checked-in scanners were used without source edits, installation, generators, CMake or the upstream full runner.
  Separate author build/replay agreeing with research is author verification, not independent acceptance. Builds
  may embed absolute paths; local binary hashes bind those bytes, not binary reproducibility, official release
  artifacts, signatures, supply-chain assurance or cross-platform parity. The finite API helper is not full API/dynamic-ABI
  certification; generated HTML was not executed in a browser and no GitHub service/remote endpoint was exercised.
  Default HTML policy does not automatically govern CommonMark/XML output; selected CommonMark roundtrips do not
  imply all-extension/source/input losslessness. COPYING scopes source, component, document and test notices differently;
  license_expression/open_source are omitted rather than inferred into a unified legal/governance conclusion.'
