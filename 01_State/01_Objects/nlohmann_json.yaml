scope_notes_zh: 主体为软件库而非 RFC 8259 或 JSON Schema 验证实现。本轮仅记录 JSON 文本解析/序列化，不把其他二进制格式或应用协议支持一并接纳。默认 parse 拒绝注释，显式 ignore_comments
  是扩展；解析错误默认抛异常，也可返回 discarded。单字节输入/存储字符串采用 UTF-8；特定宽字符迭代器可解析 UTF-16/32，dump 默认严格检查 UTF-8。默认数字使用 64 位有/无符号整数或 double，可能舍入或拒绝超范围数；赋值的
  NaN 序列化为 null。默认对象键排序，不保证原始文本、数值拼写或键顺序无损保留；不是规范化/签名方案。无完整符合性、安全认证、宿主协议实现、互通、生产推荐或最新发行版结论。
scope_notes_en: The subject is the library, not RFC 8259 or a JSON Schema validator. This slice records JSON text
  parsing/serialization, not its other binary-format or application-protocol support. Default parse rejects comments;
  explicit ignore_comments is an extension. Parse errors throw by default or can return discarded. Single-byte input
  and stored strings use UTF-8; specific wide-character iterators allow UTF-16/32 input, and dump checks UTF-8 strictly
  by default. Default numbers use signed/unsigned 64-bit integers or double and may round or reject out-of-range
  values; assigned NaN serializes as null. Default object keys are sorted, so original text, numeric spelling and
  key order are not preserved losslessly; this is not a canonicalization/signature scheme. No full-conformance,
  security certification, host-protocol implementation, interoperability, production-recommendation or latest-release
  claim.
