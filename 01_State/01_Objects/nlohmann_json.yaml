description_zh: 以 nlohmann/json 发布的仅头文件 C++11 库，提供 JSON 值、parse 解析与 dump 序列化；本记录固定到 3.12.0。
description_en: The header-only C++11 library published as nlohmann/json, providing JSON values, parse and dump
  operations; pinned here to release 3.12.0.
