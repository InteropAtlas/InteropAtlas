scope_notes_zh: 主体是软件库，而非BS.2088标准、BW64格式或EBU组织。README将ADM XML内容处理交给可配合使用的libadm；本记录不把块读写当作完整ADM语义处理，不宣称0.10.0符合后来发布的BS.2088-2，也不宣称其为最新发行版。
scope_notes_en: The subject is the software library, not the BS.2088 standard, BW64 format or EBU organization.
  The README points to libadm for ADM XML processing. Chunk I/O is not treated as full ADM semantic processing;
  no conformance of 0.10.0 to the later BS.2088-2, or latest-release status, is asserted.
