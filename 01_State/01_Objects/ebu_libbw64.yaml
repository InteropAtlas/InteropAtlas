id: ebu_libbw64
type: system
kind: library
name_zh: libbw64音频文件读写库
name_en: libbw64 Broadcast Wave 64 file library
description_zh: 用于读写BW64音频文件的仅头文件C++库，支持大于4GB的文件以及axml和chna块；本记录固定到0.10.0发行版。
description_en: A header-only C++ library for reading and writing BW64 audio files, including files larger than
  4 GB and axml/chna chunks; pinned to release 0.10.0.
version: 0.10.0
external_identifiers:
- namespace: github
