name_en: AMWA IS-04 NMOS Discovery and Registration Specification
official_name: AMWA IS-04 NMOS Discovery and Registration Specification
description_zh: AMWA 发布的 NMOS 发现与注册规范，主体是 IS-04 工作级规范而非单一发布版。本轮以固定 v1.3.3 文献核验：Registration API 用于节点注册资源，Query API
  用于查询已注册资源，Node API 用于查询节点资源并支持点对点发现；规范包含 RAML、JSON Schema 及补充规范性正文。这些是该固定文献的要求与描述，不是任何设备或软件已实现、符合或互通的证据。
description_en: The work-level AMWA IS-04 specification for NMOS discovery and registration, not one individual
  release. In the fixed v1.3.3 documentation reviewed here, the Registration API registers Node resources, the Query
  API queries registered resources, and the Node API exposes Node resources and supports peer-to-peer discovery.
  The specification includes RAML, JSON Schema and additional normative prose. These are requirements and descriptions
  in that release, not evidence of implementation, conformance or interoperability by any device or software.
