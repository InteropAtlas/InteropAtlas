scope_notes_zh: 保留既有 amwa_nmos_is04 / amwa:is-04 工作级身份及官方工作入口，不把它改为 v1.3.3 版次身份。官方 spec.yml 将 IS-04 与多个发布版分别列出；versions
  只列本轮实读的发布文献，不是完整版本史，也不表示各版语义相同。正文技术描述限于官方 tag v1.3.3 对应 commit 8e6876d9067cc56f9eca5345d44e41d9e1754444 的 Overview
  与 APIs；文献发布版 1.3.3 与接口路径中的 v<MAJOR>.<MINOR> 是不同层次。不据此作全部版本、全部条款、实现符合性、ST 2110 媒体传输、部署、安全性或 IA 采用判断；未执行 API、设备或软件测试。本轮不接纳技术关系或改写既有关系提案。
scope_notes_en: Preserves the existing work-level identity amwa_nmos_is04 / amwa:is-04 and its official work entry
  point; it does not relabel that identity as edition v1.3.3. The official spec.yml lists IS-04 separately from
  its releases. The versions array records only the publication inspected here, not a complete version history or
  semantic equivalence across editions. Technical descriptions are limited to Overview and APIs at official v1.3.3
  tag commit 8e6876d9067cc56f9eca5345d44e41d9e1754444. Publication version 1.3.3 is distinct from the v<MAJOR>.<MINOR>
  interface-path version. No all-version or exhaustive-clause review, implementation conformance, ST 2110 media
  transport, deployment, security or IA-adoption claim is made; no API, device or software test was run. This intake
  accepts no technical relation and does not rewrite existing relation proposals.
