  It neither copies payload, transfers ownership, adds NUL nor extends input lifetime. A zero-length callback can
  pass a pointer after the header with length 0, which grants no permission to dereference beyond the buffer. Truncation
  yields NEDATA, read=0 and no callback; required is the total buffer length needed from the original token start,
