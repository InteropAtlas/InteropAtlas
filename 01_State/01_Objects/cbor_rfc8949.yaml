id: cbor_rfc8949
type: standard
kind: format
name_zh: CBOR 简明二进制对象表示（RFC 8949）
name_en: Concise Binary Object Representation (RFC 8949)
description_zh: 'RFC 8949 是 CBOR 的 STD 94 互联网标准文档；它不创建格式的新版本。CBOR 数据模型是 JSON 数据模型的扩展。


  仅新增 libcbor 入边的范围附记，不改上述规范身份、语义或原接纳范围：本记录固定 libcbor 0.12.0、官方 tag v0.12.0 与 commit ae000f44e8d2a69e1f72a738f7c0b6b4b7cc4fbf，仅静态核验
  cbor_stream_decode 对 RFC8949 §§3/3.1 的有限 token 解码：major type 0 无符号整数的内嵌值及 1/2/4/8 字节大端参数，以及 major type 2/3 的 definite
  字节串/文本，后者只限长度 0..255 且长度头为内嵌长度或一个参数字节，不含 2/4/8 字节长度参数分支。调用方须提供真实可读缓冲及正确 source_size、有效回调函数指针，并在回调使用期间保持输入有效；可复制
  cbor_empty_callbacks 的有效 no-op 函数后替换所需回调，不能把空指针视为 no-op。文本正面映射以调用方先保证 payload 为有效 UTF-8 为前提，低层函数本身不验证 UTF-8。每次调用从当前
  token 起点独立解析；FINISHED 只表示恰一次回调，不表示整个缓冲或完整 CBOR 文档已解码/验证。整数回调按 wire width 选择 uint8/16/32/64，内嵌值用 uint8；对应 read
  总长为 1/2/3/5/9，required=0。非首选整数编码也可接收，例如 0x18 0x00，并无最短表示或确定性编码验证。短 definite 字串头长 h 为1或2，payload 长 n，完整时回调借用 source+h
  指针和字节长度 n，read=h+n、required=0；不复制 payload、不转移所有权、不补 NUL，也不延长输入生命周期。零长可回调头后指针与长度0，不允许据此越界解引用。截断时 NEDATA、read=0、无回调；required
  是从原 token 起点算的所需总缓冲长度，不是额外字节数。无输入时 required=1；只有0x58/0x78头时 required=2，得到长度n但 payload 不足时 required=2+n。该低层函数不保留流解析状态；调用方须保留不完整前缀，补齐后重新调用，并在成功后自行按
  read 推进。固定 data.h 无输入时 read=1 的注释与源码/测试配方不符，实际为 read=0、required=1；callbacks.h 部分 definite/indefinite 注释倒置，按实际
  dispatch 限定。上游字符串测试有仅分配头却虚报 source_size 的配方，回调只比较指针和长度，不是有效 payload、UTF-8 或内存安全证据；0x61 0xFF 配方也不是有效文本证据。截断 helper
  虽循环 available，却始终 decode(data,1)，不能称全前缀测试覆盖。完整固定源码/测试配方仅阅读，未安装、导入、构建、运行上游或其测试，未向解码器提供输入。此边不是完整 RFC 符合性或上游完整符合自述的认证；不核嵌套、映射/重复键、文档终止/尾随数据、负数、标签、浮点、不定长容器、编码器、高层
  API、大长度/size_t 溢出路径、JSON转换、跨实现互通、安全/资源/性能或 IA 采用。函数体自身无分配不代表用户回调或整个应用零分配/安全。未纳入范围不表示库没有其他能力。


  English scope of the added libcbor incoming edge only:


  This record pins libcbor 0.12.0, official tag v0.12.0 and commit ae000f44e8d2a69e1f72a738f7c0b6b4b7cc4fbf, and
  statically inspects only a limited cbor_stream_decode token-decoding slice of RFC8949 sections 3/3.1: major type
  0 unsigned integers with embedded values or 1/2/4/8-byte big-endian arguments, and major type 2/3 definite byte/text
  strings restricted to lengths 0..255 with an embedded length or a one-byte length argument, excluding 2/4/8-byte
  length-argument branches. Callers must provide a genuinely readable buffer and correct source_size, valid callback
  function pointers, and input lifetime covering callback use. They may copy the valid no-op functions in cbor_empty_callbacks
  and replace selected callbacks; null pointers are not no-ops. Positive text mapping requires the caller to ensure
  valid UTF-8 payload beforehand; this low-level function does not validate UTF-8. Each fresh call parses from the
  current token start. FINISHED means exactly one callback, not complete decoding or validation of the buffer or
  a CBOR document. Integer callbacks select uint8/16/32/64 by wire width, with uint8 for embedded values; total
  read is 1/2/3/5/9 and required=0. Nonpreferred integer encodings such as 0x18 0x00 are also accepted, without
  shortest-form or deterministic-encoding validation. For short definite strings, header size h is 1 or 2 and payload
  size is n; completion passes a borrowed source+h pointer and byte length n, with read=h+n and required=0. It neither
  copies payload, transfers ownership, adds NUL nor extends input lifetime. A zero-length callback can pass a pointer
  after the header with length 0, which grants no permission to dereference beyond the buffer. Truncation yields
  NEDATA, read=0 and no callback; required is the total buffer length needed from the original token start, not
  an additional-byte count. No input requires 1 byte; a lone 0x58/0x78 requires 2; once n is known, incomplete payload
  requires 2+n. No stream parser state is retained internally by this low-level function: callers preserve incomplete
  prefixes, append data and retry, and advance by read after success. The fixed data.h comment saying no-input read=1
  disagrees with code/test recipes: actual read=0 and required=1. Several callbacks.h definite/indefinite comments
  are reversed, so actual dispatch controls this scope. Some upstream string recipes allocate only headers but overstate
  source_size, and callbacks compare pointers/lengths only; they are not evidence of valid payload, UTF-8 or memory
  safety. The 0x61 0xFF recipe is not valid-text evidence either. The truncation helper loops over available but
  always calls decode(data,1), so it does not prove all-prefix coverage. Complete fixed source and test recipes
  were read only, with no upstream installation, import, build, execution or tests and no decoder inputs. This edge
  does not certify full RFC conformance or upstream full-conformance claims. Nesting, maps/duplicate keys, document
  termination/trailing data, negatives, tags, floats, indefinite containers, encoding, high-level APIs, large-length/size_t
  overflow paths, JSON conversion, cross-implementation interchange, security/resources/performance and IA adoption
  are unverified. No allocations in the function body does not imply allocation-free or safe callbacks/applications.
  Unexamined capabilities are not asserted absent.


  本批 TinyCBOR 新入边的独立限定（不改变既有标准事实、libcbor 限定或其他关系）：


  固定整体 TinyCBOR 的官方 release 7.1、轻量 tag v7.1 与 commit da6421f2b5b91e3468c0af7265117427ea73f19e。7.1 是发布/tag 身份；固定
  CMakeLists.txt 仍写 project VERSION 7.0，不声称已核二进制或包内版本一致。仅静态追踪 cbor_encoder_init(&encoder, buffer, 9, 0) 后恰一次 cbor_encode_uint(&encoder,
  value)，映射 RFC 8949 §§3/3.1 的 major type 0 无符号整数，而不是凭源码旧 RFC 7049 注释宣称新版整体符合性。value 为 uint64_t，范围 0..18446744073709551615（含两端）。调用方须提供相互不重叠、生命周期有效且无并发修改的可写
  CborEncoder 与真实 9 字节缓冲，buffer+9 合法；uint8_t 是 8 位 unsigned char，uint64_t 为 8 字节，编译器/平台的 cbor_htonll 路径正确产生网络字节序。would_overflow
  把指针分别转换成 ptrdiff_t，故另要求该实现转换后的 end 非零，end 与 buffer 的整数差恰为 9，后续减法均有定义且不溢出；仅提供可写空间并不能证明所有 C 平台符合这些前提。CBOR_ENCODER_WRITER_CONTROL
  为默认 0，flags 恰为 0，未启用自定义 writer；不审其他构建配置、平台移植性或指针转换。源码先把 remaining 从 2 减为 1，再构造并复制一个 major type 0 项。value 在 0..23、24..255、256..65535、65536..4294967295、4294967296..18446744073709551615
  时，依次写 1、2、3、5、9 字节：首段直接内嵌值，其余首字节为 0x18、0x19、0x1a、0x1b，后跟 1、2、4、8 字节大端值。每段选择可用的最短整数头，这是局部源码推导，不是完整确定性编码验证。该有界成功分支返回
  CborNoError，将输出指针推进实际长度；cbor_encoder_get_buffer_size 使用原 buffer 返回该长度，extra_bytes_needed 为 0。仅此前缀是编码数据；未写后缀保持原内容，不应发送整个
  9 字节缓冲。没有另加 NUL 终止符、容器、tag 或帧封装；编码本身可包含零字节。缺少空间、空指针、无效对象、复用/多次编码、writer 回调、负数、浮点、字符串/UTF-8、容器/重复键、解码、JSON转换和其他
  major type 不在正面范围，未审能力不表示不存在。十份选定完整固定仓库文件均核对 Git blob、字节数与 SHA256 后静态阅读；上游测试文件里的 unsigned 边界向量与 encodeOne 只是未执行配方，不是已跑测试或穷尽证明。没有安装、导入、构建、运行上游库、依赖、测试或生成器。没有验证发布归档、完整源树、签名、二进制包、跨实现互通、安全、性能、生产部署或
  IA 采用，不声称完整 RFC 8949 符合性。MIT 仅记录固定 LICENSE 声明，不作法律适用判断。


  English scope and limitations for the new TinyCBOR incoming edge only:


  Pins the whole TinyCBOR library''s official release 7.1, lightweight tag v7.1 and commit da6421f2b5b91e3468c0af7265117427ea73f19e.
  7.1 is the release/tag identity: fixed CMakeLists.txt still says project VERSION 7.0, so binary or package version
  consistency is not verified. Static inspection follows only cbor_encoder_init(&encoder, buffer, 9, 0) and exactly
  one cbor_encode_uint(&encoder, value), mapped to RFC 8949 sections 3/3.1 major type 0 unsigned integers; older
  RFC 7049 source comments do not establish full conformance to the newer edition. value is uint64_t in 0..18446744073709551615
  inclusive. The caller supplies distinct non-overlapping live writable CborEncoder and genuine nine-byte buffer
  objects without concurrent modification, with valid buffer+9 arithmetic. uint8_t is eight-bit unsigned char, uint64_t
  occupies eight bytes, and the selected compiler/platform cbor_htonll path correctly produces network byte order.
  would_overflow converts pointers separately to ptrdiff_t: the implementation''s converted end must be nonzero,
  its integer difference from buffer exactly nine, and the subsequent subtraction defined without overflow. Writable
  capacity alone does not establish these premises on every C platform. CBOR_ENCODER_WRITER_CONTROL has its default
  value zero, flags is exactly zero, and no custom writer is enabled; other build configurations, portability and
  pointer conversions are not verified. The source decrements remaining from two to one, then constructs and copies
  one major type 0 item. Values in 0..23, 24..255, 256..65535, 65536..4294967295 and 4294967296..18446744073709551615
  write respectively 1, 2, 3, 5 and 9 bytes. The first range embeds the value; other ranges start with 0x18, 0x19,
  0x1a or 0x1b followed by 1, 2, 4 or 8 big-endian value bytes. Each range selects the shortest available integer
  head, a local static deduction rather than complete deterministic-encoding validation. This bounded success branch
  returns CborNoError and advances the output pointer by the encoded length. cbor_encoder_get_buffer_size with the
  original buffer returns that length, and extra_bytes_needed is zero. Only that prefix is encoded data; the unwritten
  suffix retains its prior contents and the entire nine-byte buffer must not be treated as the item. No NUL terminator,
  container, tag or framing is appended; encoded data itself may contain zero bytes. Insufficient capacity, null
  pointers, invalid objects, reuse/multiple encodings, writer callbacks, negatives, floats, strings/UTF-8, containers/duplicate
  keys, decoding, JSON conversion and other major types are outside positive scope; unexamined capabilities are
  not asserted absent. Ten selected complete pinned repository files were checked against Git blobs, byte counts
  and SHA256 and read statically. Upstream unsigned boundary vectors and encodeOne are unexecuted recipes, not executed
  tests or exhaustive proof. No upstream library, dependency, test or generator was installed, imported, built or
  run. Release archives, the entire source tree, signatures, binary packages, cross-implementation interchange,
  security, performance, production deployment and IA adoption are unverified; full RFC 8949 conformance is not
  claimed. MIT records the fixed LICENSE declaration, not legal suitability.'
description_en: 'RFC 8949 is the CBOR Internet Standard document, STD 94; it does not create a new format version.
  CBOR uses an extended JSON data model.


