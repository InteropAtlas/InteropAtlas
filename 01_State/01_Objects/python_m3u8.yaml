description_zh: 'm3u8 是 Globo.com 维护的整体 Python 播放列表解析与输出库，不是单独的 parser.py 或 M3U8 类。本记录固定库发行版 6.0.0、源码 commit 49417d05602fc472b518ec61aa9b327cd00e079d；库版本不是
  HLS 协议版本，不声称最新版本或已核验 PyPI 构建产物。固定 README 明示 RFC 8216 并为相关标签链接具体章节。本批只静态检视已有字符串经 loads 调用 M3U8、由 parse 返回字典再初始化
  Media Playlist 模型、最后经 dumps 输出文本的局部路径：EXTINF duration/title、片段 URI 字符串、TARGETDURATION、MEDIA-SEQUENCE、VERSION、PLAYLIST-TYPE、ENDLIST，以及
  EXTM3U 的识别与生成。URI 仅是字符串，未读取媒体。默认 strict=False；loads 不提供 strict 参数。EXTM3U 分支只是 startswith 匹配后 pass，并非首行或完整标识验证。默认未被分支或回调识别的行没有通用保留路径；custom_tags_parser
  可先于内建处理接收 # 行，返回真值可跳过内建解析，不自动保证自定义标签输出。strict=True 会拒绝未识别行、缺逗号 EXTINF，并运行有限版本阈值检查，不能视为完整 RFC 验证器；不保证必需标签、唯一性、数值范围、片段时长限制或全部版本规则。宽松模式的
  int/float 转换仍可报错。输出从当前属性按固定顺序生成，会规范化 PLAYLIST-TYPE 大小写和数值格式，显式 MEDIA-SEQUENCE:0 可被省略；不保证未知标签、注释、空白、顺序或字节级往返保真。关系目标仍为
  2017 年 8 月 Informational Independent Submission RFC 8216（HLS 第7版），不是 IETF Standards Track；后续 HLS 扩展不纳入。不安装、导入、构建或执行上游及其测试/示例；不访问网络播放列表或媒体。不主张网络加载、主播放列表/变体选择、实时更新、片段生成、下载、解复用、解码、播放、加密/DRM、LL-HLS/SCTE35、任意输入/标签、完整客户端/服务器符合性、安全、性能、第三方互通或
  IA 采用。MIT 仅按固定 LICENSE/setup 元数据记录，不作法律适用性判断；排除范围不表示库不存在其他路径。


  English scope and limitations:


  m3u8 is the whole Python playlist parsing and serialization library maintained by Globo.com, not a separate parser.py
  or M3U8 class object. This record pins library release 6.0.0 to source commit 49417d05602fc472b518ec61aa9b327cd00e079d;
  the library version is not an HLS protocol version, and neither latest-release status nor PyPI artifact equivalence
  is claimed. The fixed README explicitly cites RFC 8216 and links the selected tags to specific sections. Static
  inspection is limited to existing strings passed by loads to M3U8, whose parse call returns a dictionary used
  to initialize a Media Playlist model, followed by dumps text output: EXTINF duration/title, segment URI strings,
  TARGETDURATION, MEDIA-SEQUENCE, VERSION, PLAYLIST-TYPE, ENDLIST, and EXTM3U recognition/generation. URIs are only
  strings here; no media was read. Default strict=False applies; loads exposes no strict parameter. The EXTM3U branch
  only uses startswith and pass, not first-line or exact-marker validation. Lines unrecognized by built-in branches
  or a callback have no generic preservation path by default. custom_tags_parser can receive # lines before built-in
  processing and skip it by returning a truthy value, without automatically guaranteeing custom-tag output. strict=True
  rejects unrecognized lines and EXTINF without a comma and runs limited version-threshold checks; it is not a full
  RFC validator and does not establish mandatory-tag, uniqueness, numeric-range, segment-duration or complete version-rule
  validation. Permissive int/float conversion can still fail. Output is generated from current attributes in a fixed
  order, normalizing PLAYLIST-TYPE case and number formatting; explicit MEDIA-SEQUENCE:0 can be omitted. Unknown
  tags, comments, whitespace, order and byte-for-byte round trips are not guaranteed. The target remains the August
  2017 Informational Independent Submission RFC 8216 (HLS version 7), not an IETF Standards Track specification;
  later HLS extensions are excluded. No upstream installation, import, build, execution, tests or examples, network
  playlists or media access was performed. No network loading, master-playlist/variant selection, live reload, segment
  generation, downloading, demuxing, decoding, playback, encryption/DRM, LL-HLS/SCTE35, arbitrary-input/tag support,
  full client/server conformance, security, performance, third-party interoperability or IA adoption is established.
  MIT is recorded only from fixed LICENSE/setup metadata, not as legal suitability advice; exclusions do not imply
  that other library paths are absent.'
