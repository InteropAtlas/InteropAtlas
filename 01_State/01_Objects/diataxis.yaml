lessons_zh:
  - "把 Tutorial、How-to、Reference、Explanation 按用户需要分离，避免一份文档同时承担教学、操作、查阅和解释。"
  - "对 Agent 上下文管理的价值在于按任务加载正确类型的文档，而不是把整个项目文档一次性塞入上下文。"
  - "InteropAtlas 采用其职责分离和按需阅读思想，不因此强制重构全部现有 docs。"
lessons_en:
  - "Separates tutorials, how-to guides, reference and explanation according to user needs."
  - "For agent context, it supports loading the right documentation view for the task instead of ingesting the entire documentation corpus at once."
