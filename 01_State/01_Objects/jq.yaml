description_zh: 'jq 是命令行 JSON 处理工具；本记录固定检查 jq-1.8.1（commit 4467af7068b1bcd7f882defff6e7ea674c5357f4），不将整个工具改名为 --seq
  组件或查询语言规范。源码中的 --seq 选项启用序列解析；普通 JSON 输出分支在每个过滤结果前写 RS（0x1E），序列化结果后通常写 LF（0x0A）。过滤器可产生零个、一个或多个结果；--stream 提供路径/值事件而非原始完整记录，--slurp
  聚合输入。普通非原始输入驱动对解析错误发出警告并继续。手册描述丢弃后续输入直至 RS；但静态源码的错误分支先设为等待 RS，随后 parser_reset 又将状态设为 NORMAL，因此不把手册的恢复描述当作已验证行为。未建立数据修复、成功恢复、完整记录回滚或送达保证。-r
  的字符串输出分支绕过 RS；-j 隐含原始输出并抑制 LF，--raw-output0 改用 NUL 终止；-R 不安装 JSON 解析器，-n 跳过自动输入但过滤器仍可显式读取输入。彩色输出可加入转义控制序列；原生 Windows
  jq.exe 文本模式会转换 LF 为 CRLF，手册提示使用 -b。通常以 UTF-8 输出非 ASCII 字符，-a 改用转义；jv_string_sized 的无效 UTF-8 字符串替换路径不证明所有无效输入均可接受或字节无损。数字截断保护也不证明所有标量的完整性验证。手册关于无
  RS 输入的表述不作为实测保证：仅静态追踪了 CLI 设置、字节馈送与等待 RS 的解析器，未运行验证。以上均为固定源码和文档阅读，不是实测；未安装、构建或运行上游程序/测试、语料测试或网络发送。不主张全部选项/输入符合
  RFC 7464、GeoJSON 校验或坐标转换、传输/应用顺序或交付保证、安全、性能、部署适用性、当前兼容性、第三方互通或 IA 采用。仅增加既有 syntax 编辑导航，不添加技术关系或能力。


  English scope and limitations:


  jq is a command-line JSON processing tool; this record inspects jq-1.8.1 at commit 4467af7068b1bcd7f882defff6e7ea674c5357f4,
  not an invented --seq component or a query-language specification. In the source, --seq enables sequence parsing;
  the ordinary JSON-output branch writes RS (0x1E) before each filter result, serializes it, and normally appends
  LF (0x0A). Filters may emit zero, one or multiple results; --stream supplies path/value events rather than intact
  original records, and --slurp aggregates inputs. The ordinary non-raw input driver warns on parse errors and continues.
  The manual describes discarding subsequent input until RS; however, the inspected error branch sets a waiting-for-RS
  state before parser_reset sets it back to NORMAL, so that recovery description is not adopted as verified behavior.
  Data repair, successful recovery, whole-record rollback and delivery guarantees are not established. The -r string-output
  branch bypasses RS; -j implies raw output and suppresses LF, while --raw-output0 substitutes NUL termination.
  -R installs no JSON parser; -n bypasses automatic input, although filters can explicitly consume input. Color
  output can add escape control sequences; native Windows jq.exe text mode converts LF to CRLF, for which the manual
  advises -b. Non-ASCII output normally uses UTF-8, with -a selecting escapes; the malformed-UTF-8 string replacement
  path in jv_string_sized proves neither acceptance of every invalid input nor lossless bytes. Numeric truncation
  guards do not establish completeness validation of every scalar. The manual statement about RS-less input is not
  adopted as an empirical guarantee: only CLI setup, byte feeding and the RS-waiting parser were statically traced,
  without runtime verification. All observations are fixed-source/document reading, not empirical execution; no
  upstream installation, build, program/test execution, corpus testing or network sending occurred. No all-option/all-input
  RFC 7464 conformance, GeoJSON validation, CRS conversion, transport/application ordering or delivery guarantee,
  security, performance, deployment suitability, current compatibility, third-party interoperability or IA adoption
  is claimed. Existing syntax membership is editorial navigation only; no technical relation or capability is added.'
