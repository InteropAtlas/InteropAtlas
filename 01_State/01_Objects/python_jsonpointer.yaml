  扩展容器及 CLI 表示/批次错误行为是实现边界，不扩大 RFC 6901。未执行安装、构建、fuzz、完整平台矩阵、网络获取、签名/attestation、安全或整个包许可适用性评估。固定来源和五份自写可重建 harness
