summary_zh: "ISO/IEC/IEEE 42010:2022 规定 Architecture Description（架构描述）的结构与表达要求，并区分 Architecture（架构）与描述架构的 Artifact（产物）。其 concern、viewpoint、view、model kind 等思想说明复杂系统不应只依赖一份巨型说明，而应提供面向不同关注点的可追溯视图。InteropAtlas 将其作为项目架构说明和 Agent 渐进式上下文视图的规范性参考，不复制受版权保护的标准正文。"
summary_en: "ISO/IEC/IEEE 42010:2022 specifies requirements for the structure and expression of architecture descriptions and distinguishes an architecture from the artifact that describes it. Its concern, viewpoint, view and model-kind concepts provide a normative precedent for organizing multiple traceable views of a complex system rather than relying on one monolithic description."
