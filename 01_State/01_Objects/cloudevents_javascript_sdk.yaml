  status: released
  url: https://github.com/cloudevents/sdk-javascript/releases/tag/v10.0.0
open_source: true
license_expression: Apache-2.0
scope_notes_zh: 主体为软件库，不是事件规范或部署服务。固定 README 明示支持 CloudEvents 1.0，HTTP 消息源码引用 1.0.1；不将其改述为发布者认证 1.0.2。wire specversion
  仍为 1.0 本身不能证明 patch 符合性，本轮不记录到既有 cloudevents_1.0.2 的 implements 关系。CloudEvent 默认补 id/time/specversion，自动 time
  不证明实际发生时间；strict=false 可跳过部分检查。validateCloudEvent 对 1.0 之外版本返回 false，构造器成功不等于有效版次或完整符合性。默认 JSON 数字解析有 JavaScript
  精度限制，可选 CE_USE_BIG_INT=true 切换大整数解析路径。该解析路径会重新赋值运行环境的 JSON 绑定；对宿主其他代码的影响未在本切片评估。二进制 data 可映射 data_base64；JSON
  数据不等于全部事件载荷。本切片不验证所有格式/绑定、网络收发、宿主进程副作用、安全性或跨实现互通；不是最新发行版或生产推荐，未推断 self_hostable 或新增 capability。
scope_notes_en: The subject is the library, not the event specification or a deployed service. The fixed README
  explicitly states CloudEvents 1.0 support; HTTP message source references 1.0.1. This is not restated as publisher
  certification of 1.0.2. An unchanged wire specversion of 1.0 is not patch-conformance evidence, so this slice
  adds no implements edge to cloudevents_1.0.2. CloudEvent supplies default id/time/specversion; an automatic timestamp
  does not prove occurrence time. strict=false skips some checks. validateCloudEvent returns false for versions
  other than 1.0; constructor success alone does not prove a valid version or full conformance. Default JSON number
  parsing has JavaScript precision limits; CE_USE_BIG_INT=true selects the optional big-integer path. That parsing
  path reassigns the runtime JSON binding; effects on other host code are not assessed in this slice. Binary data
  can map to data_base64, while JSON data is not all possible event payloads. All formats/bindings, actual network
  delivery, host-process side effects, security and cross-implementation interoperability are unverified. No latest-release
  or production recommendation, self_hostable inference or invented capability is made.
