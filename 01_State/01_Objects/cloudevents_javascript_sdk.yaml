id: cloudevents_javascript_sdk
type: system
kind: library
name_zh: CloudEvents JavaScript 事件处理开发库
name_en: CloudEvents JavaScript SDK
description_zh: 用于构造、序列化和解析 CloudEvents 事件的 JavaScript/TypeScript 开发库，含 HTTP binary/structured 消息表示转换；本记录固定到 10.0.0。
description_en: A JavaScript/TypeScript SDK for constructing, serializing and parsing CloudEvents, including HTTP
  binary/structured message representation conversion; pinned here to 10.0.0.
version: 10.0.0
external_identifiers:
- namespace: github
  value: cloudevents/sdk-javascript
official_url: https://github.com/cloudevents/sdk-javascript
versions:
