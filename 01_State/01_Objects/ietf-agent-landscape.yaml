lessons_zh:
  - 对快速变化领域，标准地图需要持续更新，而不是按多年周期静态发布。
  - 草案、工作组、BoF 和缺口也应被追踪，因为正式标准出现之前已经存在大量有价值的演化信息。
  - InteropAtlas 需要在“已发布标准”和“正在形成的标准化工作”之间建立清晰状态区分。
