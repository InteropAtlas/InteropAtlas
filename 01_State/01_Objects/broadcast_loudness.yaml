scope_notes_zh: 主体是单独发布的 broadcast-loudness Rust 库 crate 0.5.0（lib 名 broadcast_loudness），不是整个 fishloa/rust-broadcast
  工作区或其他成员。轻量标签 broadcast-loudness-v0.5.0 直接指向 commit 579ad2c08b675fc52dee6db4ecb16b3038bb19ce；归档 .cargo_vcs_info.json
  同时固定该 commit 和 broadcast-loudness 子目录。49,240 字节官方归档 SHA-256 为 1185c695e6e3cd8b4d10e8d6cf28fa1b4696c135f1ee19ea9abf6936bc86d9eb，与已捕获注册表索引
  checksum 相同；19 个非生成成员的 Git blob 哈希匹配固定树，另 3 个是生成的包元数据。注册表当时未 yanked；发布非 draft/prerelease，但可变，不声称最新版、签名认证或可复现构建。元数据声明
  Rust edition 2024、MSRV 1.95.0、MIT OR Apache-2.0；两份许可证文本位于固定仓库根而不在发布归档，不作法律审计。三个直接必需依赖范围为 broadcast-common ^10.0、libm
  ^0.2、thiserror ^2，均关闭各自默认 features；default std 向依赖转发，源码另有 no_std + alloc 路径，但未构建任一配置。包内 bounded_memory 集成测试引用
  test_alloc，归一化清单却省略工作区 path-only dev dependency；完整发布测试集不是自包含的，这是静态发现，不是执行失败或库目标不能编译的结论。只记录 LoudnessMeter::new(48000,
  ChannelLayout::Stereo) 后，等长左右声道、全部有限、由调用方按标称满刻度缩放并限于 [-1,1] 的 planar f32 PCM，经成功 push_stereo_planar_f32 调用、finish()
  后读取 integrated_lufs() 的 Annex 1 集成响度路径。库不强制该幅度范围，也不替调用方归一化。固定源码实施双级 K 加权、左右声道单位权重、完整 400 ms 门限块与 100 ms 步长以及严格大于阈值的
  -70 绝对门和相对均值低 10 的二级门；系数由公式推导、能量经过 log/pow 往返，不保证比特精确、阈值边缘行为或数值误差界。少于 19,200 帧无完整块；静音/无合格块或 finish 前读取可为负无穷，不把该
  API 哨兵当作规范对空集合定义的数值。finish 丢弃未满的最后子块；完整 400 ms 也不保证有限结果。失败批次并非原子：有效前缀可能已更新过滤器/累积器，后续非有限样本才报错，而 frame_count 仅整批成功后增加；不保证回滚、整批安全重试或错误后继续测量正确。门限块和短期历史随时长增长，不称恒定内存。整个库另有其他布局、采样率和指标，但本关系排除其他输入重载、其他布局/采样率、Annex
  2 真峰值及其余附录、LRA/瞬时/短期精度、EBU R128 V5 目标/符合性、音频解码/归一化、声压或听觉健康判断、平台/MSRV 实测、性能、安全认证、第三方互通和 IA 采用。未安装、编译、导入或执行库、上游测试、示例或音频处理；源码和规范映射不是运行验证。
scope_notes_en: 'The subject is the separately published broadcast-loudness Rust library crate 0.5.0 (lib name broadcast_loudness),
  not the whole fishloa/rust-broadcast workspace or its other members. Lightweight tag broadcast-loudness-v0.5.0
  directly targets commit 579ad2c08b675fc52dee6db4ecb16b3038bb19ce; archived .cargo_vcs_info.json names that commit
  and the broadcast-loudness subdirectory. The 49,240-byte official archive has SHA-256 1185c695e6e3cd8b4d10e8d6cf28fa1b4696c135f1ee19ea9abf6936bc86d9eb,
  matching the captured registry-index checksum; 19 non-generated members match fixed-tree Git blobs, with three
  generated packaging-metadata members. The registry record was not yanked when observed; the non-draft/non-prerelease
  release is mutable. No latest-version, signature-authentication or reproducible-build claim. Metadata declares
  Rust edition 2024, MSRV 1.95.0 and MIT OR Apache-2.0; both license texts exist at the pinned repository root but
  not in the archive, without a legal audit. Three direct required dependency ranges are broadcast-common ^10.0,
  libm ^0.2 and thiserror ^2, each default-features=false. Default std forwards to dependencies, and source also
  has a no_std + alloc path; neither configuration was built. The packaged bounded_memory integration test imports
  test_alloc although normalization omits its workspace-only path dev dependency. The full published test suite
  is not self-contained: this is a static observation, not an executed failure or proof that the library target
  cannot compile. The recorded Annex 1 path is LoudnessMeter::new(48000, ChannelLayout::Stereo), successful push_stereo_planar_f32
  calls with equal-length, entirely finite left/right f32 PCM buffers caller-scaled to nominal full scale and restricted
  to [-1,1], then finish(), then integrated_lufs(). The library neither enforces that amplitude range nor normalizes
  input for the caller. Fixed source implements two-stage K weighting, unit stereo weights, complete 400 ms gating
  blocks at 100 ms steps, and strictly-above-threshold absolute -70 and relative mean-minus10 gates. Coefficients
  are derived and energy passes through log/pow conversions; bit-exact results, threshold-edge behavior and numeric
  error bounds are not established. Fewer than 19,200 frames cannot form a full block; silence/no eligible blocks
  or querying before finish can yield negative infinity. That API sentinel is not a normative numeric definition
  for an empty selected set. finish discards an incomplete final sub-block; a full 400 ms alone does not guarantee
  a finite result. Failed batches are non-atomic: a valid prefix can change filters/accumulators before a later
  nonfinite error, while frame_count advances only after complete batch success. No rollback, safe whole-batch retry
  or correct continuation after error is promised. Gating and short-term histories grow with duration, so memory
  is not claimed constant. The whole library includes other layouts, rates and metrics, but this relation excludes
  other input overloads/layouts/rates, Annex 2 true peak and remaining annexes, LRA/momentary/short-term accuracy,
  EBU R128 V5 targets/conformance, audio decoding/normalization, sound-pressure or hearing-health assessment, tested
  platform/MSRV support, performance, security certification, third-party interoperability and IA adoption. No installation,
  compilation, import, upstream test/example execution or audio processing occurred; static source/normative correspondence
  is not runtime verification.'
