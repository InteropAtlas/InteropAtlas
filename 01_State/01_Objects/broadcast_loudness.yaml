description_zh: 独立发布的 Rust 音频响度测量库；本记录固定 0.5.0，仅以静态证据覆盖 48 kHz、调用方归一化有限平面立体声输入的 BS.1770-5 Annex 1 集成响度路径，不表示完整符合性或运行验证。
description_en: A separately published Rust loudness library; pinned to 0.5.0, with static evidence limited to BS.1770-5
  Annex 1 integrated loudness for caller-normalized finite planar stereo PCM at 48 kHz, not full conformance or
  runtime verification.
