id: dav1d
type: system
kind: library
name_zh: dav1d AV1 解码库
name_en: dav1d AV1 decoder library
description_zh: 'dav1d 是 AV1 解码库；本记录固定 1.5.0（GitHub 镜像 tag 1.5.0 解析到 commit 32cf02af50f32af108a3b281c452788dccdac648，README
  指向 VideoLAN 为规范上游），不称最新版本。公开 C API 的 dav1d_send_data 接收一个或多个开放码流单元（OBU），成功才转移输入引用所有权；EAGAIN 表示当前输入尚不能消费，应先 get_picture
  取出画面再重试。get_picture 成功时调用者取得输出引用所有权，EAGAIN 通常表示需要更多输入；流结束则反复调用它直到 EAGAIN 排空缓存。用于 seek 的 flush 清除内部状态，不替代流结束排空；之后须送入有效序列头
  OBU 才能重新开始解码。


  strict_std_compliance 默认 0，部分不影响实际解码的规范违规不会中止；src/obu.c 中 forbidden bit 和 trailing-bit 检查受此开关约束。因此解码成功不是严格规范有效性的证明，开启开关也不在此被认证为完整验证器。apply_grain
  默认 1，画面输出已应用胶片颗粒时再调用 dav1d_apply_grain 会重复应用。仅固定 1.5.0 源码与公开 API 注释检查，未构建、执行、下载测试语料或测量性能；不证明完整 AV1/Errata1 符合性、跨实现互通、容器/传输/显示色彩端到端正确性、安全、生产适用性或
  IA 采用。 image_color 仅是既有编辑导航，不是色彩管理或技术关系断言。


  English scope and limitations:


  dav1d is an AV1 decoder library. This record is fixed to 1.5.0 (GitHub mirror tag 1.5.0 resolves to commit 32cf02af50f32af108a3b281c452788dccdac648;
  README identifies VideoLAN as canonical upstream), not claimed latest. The public C API documents dav1d_send_data
  input as one or more OBUs and transfers the input reference on success; EAGAIN means the input cannot yet be consumed
  and pictures should be retrieved before retrying. Successful get_picture transfers the output reference to the
  caller; EAGAIN normally calls for more input. At end of stream, repeatedly call get_picture until EAGAIN to drain
  buffered frames. The seek-oriented flush clears decoder state rather than replacing EOS draining; decoding resumes
  only after a valid sequence-header OBU is sent.


  strict_std_compliance defaults to 0; some violations not affecting actual decoding do not abort. Forbidden-bit
  and trailing-bit checks in src/obu.c are conditional on this setting. Successful decoding is not proof of strict
  validity, and enabling the setting is not certified here as complete validation. apply_grain defaults to 1; calling
  dav1d_apply_grain on output that already received grain applies it twice. Evidence is limited to fixed source
  and public API comments: no build, execution, test-corpus download or performance measurement. No full AV1/Errata1
  conformance, cross-implementation interoperability, end-to-end container/transport/display-color correctness,
  security, production suitability or IA adoption is established. Existing image_color membership is editorial navigation,
  not a color-management or technical-relation assertion.'
