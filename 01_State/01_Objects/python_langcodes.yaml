  ABNF窄，不是完整原始语法识别器。is_valid只局部检查language/script/territory/variant以及重复variant/extension和extlang数量，不核验每个extlang登记/前缀或扩展内容语义；tag_is_valid先默认归一化，所以en_US也可返回True，不代表原串符合RFC语法。私用标签局部valid不赋予公开或跨系统一致含义。固定源码的validity文档称CLDR40，随包IANA文本File-Date为2021-08-06，不声称注册表当前完整。language_data为可选依赖；本测试环境未安装，核心路径可运行，display_name名称查询抛ModuleNotFoundError；安装该依赖后的名称/人口数据行为未测。24项可信合成内存例及10个安装源码字节比对仅补充有限证据，不证明完整RFC符合性、扩展验证、RFC4647匹配、任意输入资源安全、第三方互通或IA采用。
scope_notes_en: 'Pinned to PyPI langcodes 3.5.1 and official tag v3.5.1 at commit 4701cd34cc607c4ffcd2ed675f03b1d6529398da.
  This Python library parses RFC5646-oriented language tags into Language objects and emits tag strings, with formatting,
  legacy-code replacements and local validity checks. This slice does not detect the language of text or test language
  matching. BCP47 also includes RFC4647; the upstream README shorthand is not adopted as a full-BCP47 implementation
  conclusion. Language.get normalizes selected legacy codes by default; normalize=False preserves those codes but
  still accepts underscores as separators and reformats tags, so original lexical round trips are not guaranteed.
  standardize_tag also uses CLDR replacements, including sh→sr-Latn and optional macrolanguage folding; this is
  not equated with pure RFC5646 canonicalization or proof of validity. The parser rejects non-ASCII input, some
  out-of-order subtags and five-to-eight-letter primary language subtags; the last restriction is narrower than
  the RFC5646 ABNF, so it is not a complete recognizer of original-input syntax. is_valid checks selected language/script/territory/variant
  data, duplicate variants/extensions and extlang counts, not every extlang registration/prefix or extension-content
  semantics. tag_is_valid first normalizes by default: en_US can return True without its original spelling satisfying
  the RFC grammar. Private-use local validity does not assign public or cross-system agreed meaning. The fixed validity
  docstring names CLDR40, and the bundled IANA text has File-Date 2021-08-06; neither is a current-complete-registry
  claim. language_data is optional and absent from this test environment: core operations run, while display_name
  raises ModuleNotFoundError; name/population behavior with that dependency installed was not tested. Twenty-four
  trusted synthetic-memory examples and byte comparisons of ten installed source files are supplementary evidence
  only, not complete RFC conformance, extension validation, RFC4647 matching, arbitrary-input resource safety, third-party
  interoperability or IA adoption.'
