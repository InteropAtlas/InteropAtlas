name_zh: GeoJSON 文本序列规范（RFC 8142）
name_en: GeoJSON Text Sequences (RFC 8142)
official_name: GeoJSON Text Sequences
description_zh: 'RFC 8142（2017 年 4 月原始出版物，Proposed Standard）定义 GeoJSON 文本序列和 application/geo+json-seq。第 2 节采用 RFC
  7464 全部规则：任意数量 UTF-8 文本各以 RS 前置、LF 结尾，每个文本必须包含 RFC 7946 定义的单个 GeoJSON 对象。Geometry、Feature 和 FeatureCollection
  可混合；允许类型的沟通方式未定义。允许美化排版和紧凑文本；无内部换行的紧凑形式较适合既有非标准换行解析器，不表示 NDJSON 或 SSE 等价。仅限原始出版物，勘误内容和状态未核验。分帧不保证记录有效或修复，跳过无效文本后恢复解析也不是修复；不提供超出序列所表示记录顺序的传输或应用层顺序/恰好一次交付保证，也不提供安全、坐标转换或实现互通保证；GeoJSON
  对象约束仍由 RFC 7946 给出。


  English scope and limitations:


  RFC 8142 (April 2017 original publication, Proposed Standard) defines GeoJSON text sequences and application/geo+json-seq.
  Section 2 applies all RFC 7464 rules: any number of UTF-8 texts, RS-prefixed and LF-terminated, each containing
  one RFC 7946 GeoJSON object. Geometry, Feature and FeatureCollection may be mixed; communicating permitted-type
  policies is unspecified. Pretty printing is allowed; compact texts without internal newlines improve compatibility
  with existing non-standard newline parsers, not NDJSON or SSE equivalence. Original publication only; errata contents/status
  unreviewed. Framing does not guarantee validity or repair; skipping invalid texts to resume parsing is not repair.
  It supplies no transport/application ordering or exactly-once delivery guarantee beyond the represented sequence,
  nor security, CRS conversion or implementation-interoperability guarantees. RFC 7946 still supplies the GeoJSON
  object constraints.'
