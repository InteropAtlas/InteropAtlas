description_zh: A2A Python SDK（包名 a2a-sdk），固定官方 v1.3.0 / commit 0d9dafb92328144384eca58a6e8ab80cb8f7d445。主体是完整 SDK，本记录只检视其
  TaskStore / InMemoryTaskStore 的任务状态存取路径，不把内部类虚构成独立产品，也不把整个 SDK 称为仅内存实现。每个 InMemoryTaskStore 实例持有 owner→task ID
  的嵌套字典；save 覆盖同一 owner 的同 ID 项，get 缺项返回 None，delete 缺项无操作、删除最后项后移除空 owner 桶。源码明示进程停止会丢失数据；接口的 persisting 措辞不是此实现具备磁盘/数据库耐久性的证据。删除记录不等于取消运行任务、撤销工件或持久擦除。默认
  owner_resolver 仅取 context.user.user_name；默认 UnauthenticatedUser 的用户名为空，同一解析名称共享桶。store 自身不验证身份、不检查 is_authenticated、也不将
  tenant 自动组合入键；调用方或自定义 resolver 决定分组，非安全租户隔离证明或已实测漏洞。默认 use_copying=True 的 adapter 在 save/get/list 使用 protobuf
  CopyFrom；这不是任意 Python 对象图的 deepcopy 保证。关闭复制后保存和返回同一 Task 引用，调用方可在不再次 save 的情况下改变存储中的状态。内部 threading.RLock 只保护选定字典操作，不是多调用事务、跨进程锁或分布式一致性；复制也不等于耐久性。list
  有过滤/排序/游标路径，源码提示更新可使任务移到游标之前而被跳过，本记录不证明完整分页或快照正确性。DefaultRequestHandler 真实调用注入 store 的 get，缺项转 TaskNotFoundError；这不是已执行的服务请求，也不证明每个
  SDK 服务默认选该 store。仅静态检查固定源码与测试配方，未安装、构建、导入或执行上游/测试/agent/网络。pyproject 声明 Python >=3.10，版本由 Git 动态推导；不是当前环境或依赖兼容性承诺。README
  的协议 1.0 支持及 0.3 兼容声明未在此独立验证，不新增 implements/uses 关系。未建立完整协议符合性、长期记忆、恢复连续性、耐久工件交付、数据库/集群行为、认证授权、安全、性能、生产适用性、互通或
  IA 采用；排除范围不意味着 SDK 不含其他存储实现。Apache-2.0 只按固定 LICENSE 记录，非法律适用意见。agents 仅为既有编辑导航，原 A2A 协议身份和 IA 治理不变。
description_en: 'A2A Python SDK (package a2a-sdk), pinned to official v1.3.0 / commit 0d9dafb92328144384eca58a6e8ab80cb8f7d445.
  The subject is the whole SDK; this record inspects only its TaskStore / InMemoryTaskStore state-storage path,
  not a fictional standalone class product or a claim that the entire SDK is memory-only. Each InMemoryTaskStore
  instance holds an owner-to-task-ID nested dictionary. Save replaces the same owner/ID entry; missing get returns
  None; missing delete is a no-op and deleting the final entry removes the empty owner bucket. Source explicitly
  says process termination loses data. The interface wording persisting does not establish disk/database durability
  for this implementation. Record deletion is not running-task cancellation, artifact revocation or durable erasure.
  The default owner_resolver only returns context.user.user_name; default UnauthenticatedUser has an empty name,
  and the same resolved name shares a bucket. The store itself does not authenticate, check is_authenticated or
  automatically combine tenant into the key. Callers/custom resolvers determine grouping: no secure tenant-isolation
  proof or reproduced exploit. Default use_copying=True wraps save/get/list with protobuf CopyFrom, not an arbitrary
  Python object-graph deepcopy guarantee. Disabling copying retains and returns the same Task reference, allowing
  caller mutation to change stored state without another save. Internal threading.RLock protects selected dictionary
  operations, not multi-call transactions, cross-process locking or distributed consistency; copying is not durability.
  Listing has filter/order/cursor logic and the source notes updates can move tasks before the cursor and skip them;
  full pagination/snapshot correctness is not established. DefaultRequestHandler actually consumes the injected
  store get and maps absence to TaskNotFoundError; this is not an executed request or proof that every SDK server
  defaults to this store. Fixed source/test recipes were inspected only: no upstream installation, build, import,
  execution, tests, agents or network exercise. pyproject declares Python >=3.10 and derives version dynamically
  from Git, not tested contemporary environment/dependency compatibility. README protocol 1.0 support and 0.3 compatibility
  claims were not independently verified here; no implements/uses edge is added. No complete protocol conformance,
  long-term memory, recovery continuity, durable artifact delivery, database/cluster behavior, authentication/authorization,
  security, performance, production suitability, interoperability or IA adoption is established. Exclusion does
  not imply absence of other SDK storage implementations. Apache-2.0 is recorded from the fixed LICENSE, not legal-suitability
  advice. Existing agents membership is editorial only; the A2A protocol identity and IA governance remain unchanged.'
