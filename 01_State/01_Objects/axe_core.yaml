scope_notes_en: 'The subject is the axe-core library, not Deque as an organization, an extension, commercial platform
  or certification service. Lightweight tag v4.14.0 resolves to commit e797173108eadfa4355fe06af331791734e1757f;
  release metadata says immutable=false, so evidence is pinned to the commit, without latest-version, signature-verification
  or reproducible-build claims. axe.run checks selected rendered content, including visually hidden rendered content.
  Standard results distinguish passes, violations, incomplete and inapplicable; uncertain results need manual review,
  and no violations does not establish conformance. Context inclusion/exclusion, runOnly, rule switches, page context,
  reporters and environment alter checking or reporting scope; page-level rules are omitted for non-page contexts.
  Inactive/non-rendered hidden interaction states must be activated and checked separately. Tested iframes need
  the engine, and configuration is not automatically broadcast to frames. JSDOM support is limited, including unavailable
  color-contrast checking; publisher browser-support statements were not independently tested. The fixed catalog
  marks WCAG 2.2, AAA, experimental and deprecated rules disabled by default: target-size has wcag22aa/wcag258 tags
  but enabled=false, and enhanced contrast is also default-disabled. Explicit rule/tag selection can change defaults.
  Package engines.node>=4 is a declaration, distinct from .nvmrc=24 and the Node24+ build/test guard; neither is
  a verified runtime-compatibility result. The project declares MPL-2.0, while third-party MIT/ISC notices remain
  separate, not a licensing-suitability audit. npm distribution bytes were not verified; no package installation,
  execution, build or upstream tests occurred. This bounded automated-testing capability does not assert implementation
  of WCAG, WAI-ARIA or ACT Rules Format, complete conformance, a detection percentage, zero false positives, legal
  compliance, security, assistive-technology interoperability or IA adoption.'
