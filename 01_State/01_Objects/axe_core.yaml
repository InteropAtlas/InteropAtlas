name_en: axe-core JavaScript accessibility testing engine
description_zh: 固定 4.14.0 的 JavaScript 库，对选定呈现状态和启用规则执行自动无障碍检查；规则级结果不证明页面或网站完整符合性。
description_en: A JavaScript library pinned to 4.14.0 for automated accessibility checks of selected rendered states
  and enabled rules; rule-level results do not establish complete page or site conformance.
