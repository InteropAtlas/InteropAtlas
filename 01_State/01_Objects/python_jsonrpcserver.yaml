scope_notes_en: 'The identity is the jsonrpcserver Python library, pypi:jsonrpcserver, fixed 5.0.9 and source commit
  2c0567515d67c6b1bd85db8e7985cada472489e3. The published sdist is 14,506 bytes; independently recomputed SHA-256
  a71fb2cfa18541c80935f60987f92755d94d74141248c7438847b96eee5c4482 matches publisher metadata. All 16 runtime package
  members and 21 files with Git counterparts match byte-for-byte; eight packaging-generated files are not claimed
  as Git source. The historical explodinglabs/jsonrpcserver path redirects to bensynapse/jsonrpcserver with observed
  repository ID 45362585; this is not ownership, governance or maintenance continuity. Upstream also has async and
  batch paths, but this slice covers only bounded synchronous in-process single-request dispatch through default
  dispatch/dispatch_to_json: json.loads, shipped schema validation, default context/post-processing and json.dumps.
  Methods come from the @method global registry or an explicit methods dictionary, with non-reserved names, defined
  request members and finite JSON-compatible inputs/results. Positional arrays or named objects are bound to Python
  call signatures, not validated for semantic argument values/types. Ordinary methods return library Success/Error
  Results or raise JsonRpcError; callers ensure error code/message/data types and serializability, and arbitrary
  Python returns are not success values. Success and ordinary method-error responses copy the request id and emit
  jsonrpc=2.0 plus result/error; parse/schema failures have null error ids. Ordinary valid notifications omit id,
  are filtered after method handling and yield an empty dispatch string rather than JSON null; explicit null id
  is not omission. Silence is not universal: internal dispatcher failure may return -32000 with null id even for
  a notification, as an inspected upstream test explicitly expects. json.dumps runs outside dispatcher exception
  handling; non-serializable results or serializer failure can escape as Python exceptions. The schema does not
  enforce the rpc. reserved prefix, binding is not semantic type validation, and Python default JSON behavior does
  not establish strict handling of every JSON edge case. Upstream tests explicitly record invalid batch members
  invalidating the whole batch instead of per-member handling; batch is excluded entirely. Method names, binding
  diagnostics and exception text may reach error.data or logs; safe disclosure is not claimed. MIT is the fixed
  license/metadata declaration, not legal audit. Dependencies jsonschema<5 and oslash<1 have no lower bounds or
  lock; examples extras are not mandatory for this slice. No Requires-Python is declared; Python 3.8/3.9/3.10 classifiers
  are not tested compatibility. Archive hashing and source/test-definition inspection only, without installing/importing/executing
  the library or upstream tests. No async, client, network transport, authentication, security, complete conformance,
  third-party interoperability, MCP integration, latest/maintained status or IA adoption claim.'
