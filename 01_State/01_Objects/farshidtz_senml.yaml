description_zh: 'farshidtz/senml 是专门处理传感器测量列表（SenML）的 Go 软件库，module 为 github.com/farshidtz/senml/v2；本记录固定官方 v2.0.0（2020-03-26，commit
  320c4746a311e331e1d1b616d3dc5ad2d53e820d），保留整库身份，不另造 JSON 转换组件。静态源码显示 Pack 为 Record 列表，Record 提供测量名称、单位、时间、值和共享
  base 字段；Normalize 原地组合 base 名称、时间、单位、数值与 sum；codec 提供完整 JSON Pack 的字节编码与解码。这是专用记录模型与处理先例，不是通用 JSON 库或实测互通。EncodeJSON/DecodeJSON
  不自动调用 Validate 或 Normalize，示例中的显式调用流程也未运行。Validate 仅检查部分名称、值类型冲突及 sum 条件：空 Pack 不拒绝，负 BaseVersion 分支构造错误但不返回，空字符串值按长度计数。Normalize
  注释要求先验证；相对时间取 time.Now，BaseTime 将零与缺失合并且仅非零值更新 base，不能保证全部 base 重置、时间或版本情况正确。StringValue/DataValue 的 string 与
  omitempty 不能区分缺失和空字符串；DataValue 不作 base64url 校验；固定结构未保留未知标签或执行未知尾下划线标签的必理解检查。因此不承诺完整 RFC 8428 符合性、完整验证/规范化或无损往返。固定
  Encode/Decode dispatcher 将 application/senml+json 路由到完整 JSON Pack codec，未提供 application/sensml+json 或 EXI 分支；media_types.go
  中相应常量不是实现证据，不声称增量 SenSML 支持。XML/CBOR/custom CSV 代码存在但不扩入本次能力核验，CSV 流不等于 SenSML 流。LICENSE 为项目 MIT 文本，go.mod 声明
  Go 1.14 与 fxamacker/cbor/v2 v2.2.0，仅记录元数据，不证明依赖、许可或安全审计。未安装、构建或运行上游源码、示例或测试，不证明第三方互通、设备适用性、安全、性能或 IA 采用；不称最新版本。仅既有
  industrial/measurement 编辑导航，无技术关系或能力断言。


  English scope and limitations:


  farshidtz/senml is a dedicated Go library for Sensor Measurement Lists (SenML), with module github.com/farshidtz/senml/v2.
  This record fixes official v2.0.0 (2020-03-26, commit 320c4746a311e331e1d1b616d3dc5ad2d53e820d) as the whole library,
  not an invented JSON conversion component. Static source reading shows Pack as a list of Records with measurement
  names, units, times, values and shared base fields; Normalize combines base names, times, units, values and sums
  in place; the codec encodes and decodes complete JSON Pack bytes. This is a dedicated record-model and processing
  precedent, not a general-purpose JSON library or measured interoperability. EncodeJSON/DecodeJSON do not automatically
  call Validate or Normalize; the explicit example workflow was not executed either. Validate checks only some name,
  conflicting-value-type and sum conditions: it does not reject an empty Pack, its negative BaseVersion branch constructs
  but does not return an error, and it counts string values by nonzero length. Normalize requires prior validation
  according to its comment; relative times use time.Now, and BaseTime conflates zero with absence and updates the
  base only for nonzero values, so correct handling of all base resets, time or version cases is not established.
  StringValue/DataValue use string and omitempty, losing the distinction between absence and an empty string; DataValue
  is not base64url-validated; the fixed structure does not preserve unknown labels or enforce must-understand handling
  for unknown trailing-underscore labels. Full RFC 8428 conformance, complete validation/normalization and lossless
  round-trips are therefore not claimed. The fixed Encode/Decode dispatcher routes application/senml+json to the
  complete JSON Pack codec and has no application/sensml+json or EXI branch; corresponding media_types.go constants
  are not implementation evidence, and incremental SenSML support is not claimed. XML/CBOR/custom CSV code exists
  but is outside this capability review; CSV streaming is not SenSML streaming. LICENSE is the project MIT text
  and go.mod declares Go 1.14 and fxamacker/cbor/v2 v2.2.0; these are metadata, not a dependency, license or security
  audit. No upstream source, example or test was installed, built or executed; third-party interoperability, device
  suitability, security, performance or IA adoption is not established; no latest-version claim. Existing industrial/measurement
  memberships are editorial navigation only, with no technical relation or capability assertion.'
