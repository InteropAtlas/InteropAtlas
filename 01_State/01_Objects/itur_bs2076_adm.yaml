name_zh: ITU-R BS.2076音频定义模型
name_en: Recommendation ITU-R BS.2076 — Audio definition model
description_zh: 规定音频定义模型（ADM）的元数据结构，以XML描述音频文件的格式、内容及音轨；本记录固定到BS.2076-3（02/2025）。
description_en: Specifies the Audio Definition Model (ADM), a metadata structure using XML to describe
  audio-file formats, content and tracks; this record is pinned to BS.2076-3 (02/2025).
version: BS.2076-3 (02/2025)
