scope_notes_zh: itu:bs.2076保留为建议书的工作级标识，当前定义固定到2025-02-04批准的BS.2076-3；不将已被取代的版次等同为当前版。ADM描述音频而不承载音频，与BS.2088规定的BW64音频文件格式保持独立。本记录不包含特定产品的采用、交付profile或实现符合性结论。
scope_notes_en: itu:bs.2076 remains a work-level Recommendation identifier; the definition is pinned to
  BS.2076-3, approved on 2025-02-04. Superseded editions are not treated as the current edition. ADM describes
  audio rather than carrying it, and stays distinct from the BW64 audio file format specified by BS.2088.
  This record makes no product-adoption, delivery-profile or implementation-conformance claims.
