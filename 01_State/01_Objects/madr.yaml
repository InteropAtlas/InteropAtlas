lessons_zh:
  - "把重要决定的 Context、考虑方案、Decision Outcome 与后果持久保存，使后来的人或 Agent 不必仅靠最终 Diff 猜测当时为什么这样设计。"
  - "格式足够轻量，可以直接复用 Markdown，而不需要独立决策数据库。"
  - "InteropAtlas 可采用其决策理由留痕思想，同时继续把 Decision Artifact 放在现有 03_Evolution/03_Change 生命周期区域。"
lessons_en:
  - "Preserves decision context, considered options, outcomes and consequences so later humans or agents do not have to infer rationale from the final diff alone."
  - "Lightweight Markdown templates avoid the need for a separate decision database."
