summary_zh: "W3C PROV-CONSTRAINTS 是 2013 年的 W3C Recommendation（W3C 推荐标准），为 PROV 数据定义有效性、一致性推理和约束。它说明 Provenance（溯源）不仅要被记录，还可以被机器检查是否形成一致历史。InteropAtlas 当前只采用这一验证思想，不直接引入完整 PROV 约束系统。"
summary_en: "W3C PROV-CONSTRAINTS is a 2013 W3C Recommendation defining validity, inference and constraints for PROV data. It demonstrates that provenance can be machine-checked for a consistent history. InteropAtlas adopts this validation principle without importing the full PROV constraint system in v0.1."
