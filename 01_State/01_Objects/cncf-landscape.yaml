lessons_zh:
  - "成熟 Landscape 可以把结构化目录数据与生成网站职责分开，数据本身保持独立可维护。"
  - "CNCF Landscape 与 landscape2 generator 分离，为合同稳定后把数据与生成器拆分提供了成熟先例。"
  - "对 InteropAtlas 的启示是：当前可以单仓分层，但应保留未来按真实发布和治理需求抽离 Generator 的边界。"
lessons_en:
  - "Demonstrates that structured landscape data and site-generation responsibilities can be separated while the data remains independently maintainable."
  - "The split between CNCF Landscape data and the landscape2 generator is a mature precedent for later data/generator extraction."
  - "Supports keeping InteropAtlas layered in one repo today while preserving future extraction boundaries."
