id: geojson_rfc7946
type: artifact
kind: format
name_zh: GeoJSON 地理空间数据交换格式（RFC 7946）
name_en: The GeoJSON Format (RFC 7946)
description_zh: 2016 年 8 月发布的 IETF 标准轨文档，定义基于 JSON 的地理几何、要素与要素集合表示及其空间范围。
description_en: An IETF Standards Track document published in August 2016 defining JSON-based representations of
  geographic geometries, features, feature collections and their spatial extents.
version: RFC 7946
