scope_notes_zh: 仅固定 RFC 7946，不与 2008 年 GeoJSON 说明或任意 JSON 格式等同。第 4 节使用 WGS 84 经度/纬度与十进制度；可选第三坐标为相对 WGS 84 椭球的米制高度。第
  6/7 节允许不改变既定 GeoJSON 语义的外来成员，不允许借扩展重新定义既有类型。第 8 节将其用于地理数据交换，不把它当作完整 GIS、任意坐标系容器或实现符合性证明。核验时五项勘误均为 Reported，未把所提修正写入本版事实。
scope_notes_en: Fixed RFC 7946, not the 2008 GeoJSON specification or arbitrary JSON. Section 4 uses WGS 84 longitude/latitude
  in decimal degrees; an optional third coordinate is height in metres relative to the WGS 84 ellipsoid. Sections
  6/7 permit foreign members without changing defined GeoJSON semantics, not redefinition of existing types. Section
  8 concerns geographic data interchange; this is not a complete GIS, arbitrary-CRS container or implementation-conformance
  assertion. The five errata observed were Reported, and their proposed corrections are not incorporated as accepted
  facts.
