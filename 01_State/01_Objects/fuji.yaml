id: fuji
type: system
kind: software
name_zh: F-UJI 研究数据 FAIR 评估软件（4.0.1）
name_en: F-UJI research data FAIR assessment software (4.0.1)
description_zh: 通过配置的 FAIRsFAIR 指标使用 FAIR 原则评估研究数据的软件；核对固定 4.0.1 源码和指标集 0.8，并执行 7 个离线来源评估组件例。观察到 creator:null 或仅识别命名空间可通过、仅
  related_resources 仍失败，属于存在性启发式而非详细来源证明；汇总另有两个指定 URL 的分数覆盖。不是完整 FAIR 符合性、元数据真实性或认证，也未验证完整采集/服务。
description_en: 'Research-data assessment software using FAIR principles through configured FAIRsFAIR metrics: fixed
  4.0.1 source and metric set 0.8 inspected, with seven offline provenance-evaluator cases executed. Observed creator:null
  or a recognized namespace alone can pass, while related_resources alone fails: presence heuristics, not proof
  of detailed provenance. Summaries additionally override scores for two named URLs. Not full FAIR compliance, metadata
  truth or certification, nor a tested complete harvesting/service pipeline.'
