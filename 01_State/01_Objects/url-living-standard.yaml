summary_zh: WHATWG 的 URL 活标准，定义 URL、域名、IP 地址、URL 解析与序列化等 Web 平台行为。它与 RFC 3986 的 URI 模型存在历史和语义关系，后续需要在 InteropAtlas 中专门说明两者边界。
summary_en: The WHATWG Living Standard defining URLs, domains, IP addresses, URL parsing, serialization, and related Web-platform behavior. Its relationship with the RFC 3986 URI model requires explicit treatment in InteropAtlas.
