scope_notes_zh: "本次仅补充模型与解析边界：依据2026年10月21日读取的官方845bafca22fb0c5a42c4bf384a9bdea525a2f10d历史快照（页面日期2026年10月19日）及RFC3986第1.1.1节。RFC3986规定通用URI组件语法，方案另定具体要求；URL规范还定义Web平台的解析、序列化和API，目标明确涉及现实实现与RFC3986/3987的差异，不能据此假定规则或结果可任意互换。URL的validation error表示输入偏离有效输入，但不必终止解析，因此得到URL记录不证明原输入没有validation error。该快照明确仅供历史参考，不应作为实施或当前权威依据；当前规范仍为既有活标准地址。本切片不改变或重新核准旧alternative_to，不证明任何已收录库符合WHATWG算法或相互兼容，也不是整个对象的重新核验。"
scope_notes_en: "This update covers only model and parsing boundaries, using official historical snapshot 845bafca22fb0c5a42c4bf384a9bdea525a2f10d (dated 19 October 2026), read on 21 October 2026, and RFC3986 section 1.1.1. RFC3986 defines generic URI components with scheme-specific requirements; the URL Standard also specifies Web-platform parsing, serialization and APIs, addressing differences from RFC3986/3987. Rules or results must not be assumed interchangeable. A URL validation error need not terminate parsing: obtaining a URL record does not prove error-free input. The snapshot is historical reference only, explicitly not an implementation or current authoritative reference; the existing living-standard URL remains the current source. This slice neither re-approves the old alternative_to relation nor establishes library conformance or compatibility, and is not whole-record revalidation."
