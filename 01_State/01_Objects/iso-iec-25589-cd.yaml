summary_zh: "ISO/IEC CD 25589 是仍在制定中的委员会草案，描述人机协同的框架、概念、术语、技术特征和设计原则，并基于 ISO/IEC 5339 提供 AI 应用在人机协同中的指导。它不是已发布国际标准，InteropAtlas 必须保留这一状态差异。"
summary_en: "ISO/IEC CD 25589 is an under-development Committee Draft describing a framework, concepts, terminology, technical characteristics, and design principles for human-machine teaming, with guidance based on ISO/IEC 5339. It is not yet a published International Standard, and InteropAtlas preserves that status distinction."
