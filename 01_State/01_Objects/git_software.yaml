description_zh: 'Git 是完整的分布式版本控制软件项目，不是传输协议规范或虚构的独立 ls-refs 组件。本记录核验官方 publish-only 镜像 git/git 的 tag v2.52.0、commit
  9a2fb147f2c61d0cab52c883e7e26f5b7948e3ed；不声称最新版、签名认证或其他版次。实现固定 Git 2.52.0 与其同提交 ls-refs 文档；既有 #497 使用 Git 2.51.0
  文档，两份文档的完整 ls-refs 段逐字节相同，但全文不同。这个有限对应不等于完整版次相同，不把工作级 git_protocol_v2 标准改成 Git 软件版次。 仅据固定源码，研究已选择传输协议 v2 的 upload-pack
  服务端 ls-refs 路径：serve 调度命令，读取 peel、symrefs、ref-prefix、unborn 参数，经仓库 namespace、hideRefs 与配置条件筛选引用，格式化对象标识符/引用名及条件性符号引用目标、peeled
  对象或 unborn HEAD，再写 stdout pkt-line 并 flush。stdout 写入与刷新不证明网络传输、对端收到或可靠交付。ref-prefix 是优化而非严格授权过滤；达到 65,536 条及以上时清空前缀优化，规范允许服务端返回不匹配引用、由客户端再筛。lsrefs.unborn
  的 advertise（默认）、allow 与 ignore 分别控制公告/接受；隐藏引用处理不证明安全隔离。仓库、配置、资源与输出错误仍适用，不保证任意输入或仓库均成功；不是完整仓库清单。只检视源码和测试配方，未安装、构建或执行下载的
  Git、协议测试或网络服务；环境中用于 IA 记账的 Git 不算本源码执行。排除 fetch/packfile/clone/push、完整协商、完整 Git/v2 符合性、仓库原子一致性、认证/TLS/SSH/安全、跨实现互通、性能、当前平台兼容性及
  IA/GitHub 部署版次或采用证明；未研究功能不表示软件缺失。'
description_en: 'Git is the whole distributed version-control software project, not a wire-protocol specification
  or fictional standalone ls-refs component. This record fixes official publish-only mirror git/git tag v2.52.0,
  commit 9a2fb147f2c61d0cab52c883e7e26f5b7948e3ed, without latest-release, signature-verification or other-version
  claims. Implementation and matching ls-refs documentation are fixed to Git 2.52.0. Existing PR497 evidence uses
  Git 2.51.0 documentation: the complete ls-refs subsections are byte-identical, but the full documents differ.
  This finite correspondence is not whole-edition equality and does not relabel the work-level git_protocol_v2 standard
  as a Git software release. From fixed source only, this reviews the server ls-refs path after upload-pack has
  selected wire protocol v2: serve dispatches the command, reads peel, symrefs, ref-prefix and unborn arguments,
  filters references under repository namespace, hideRefs and configuration conditions, formats object IDs/refnames
  and conditional symref targets, peeled objects or unborn HEAD, then writes stdout pkt-lines and flushes. Writing/flushing
  stdout is not evidence of network transfer, peer receipt or reliable delivery. ref-prefix is an optimization,
  not strict authorization filtering; at 65,536 or more prefix lines the optimization is cleared, and the specification
  permits nonmatching references for clients to filter. lsrefs.unborn advertise (default), allow and ignore distinguish
  advertisement/acceptance behavior; hidden-reference processing does not establish security isolation. Repository,
  configuration, resource and output errors apply, with no every-input/repository success or complete-reference-inventory
  guarantee. Source and test recipes were inspected only: no downloaded Git installation, build, execution, protocol
  test or network service. Environment Git used for IA bookkeeping is not execution evidence for this source. Fetch/packfile/clone/push,
  complete negotiation, complete Git/v2 conformance, repository atomic consistency, authentication/TLS/SSH/security,
  cross-implementation interoperability, performance, current-platform compatibility and IA/GitHub deployed-version
  or adoption claims are excluded; unreviewed functions are not asserted absent.'
