summary_zh: "SLSA 1.2 将 Provenance（溯源）定义为可验证的信息，用于追踪软件制品从哪里、何时、如何产生。其 Build Provenance（构建溯源）进一步区分 Builder（构建者/构建平台）、Build Definition（构建定义）、Run Details（运行详情）、输入依赖和时间信息，并强调完整性、真实性和准确性。InteropAtlas 将这些作为高可靠溯源与未来机器验证的工程先例，但当前不采用软件构建专用字段。"
summary_en: "SLSA 1.2 defines provenance as verifiable information for tracing where, when and how software artifacts were produced. Its Build Provenance distinguishes builder identity, build definition, run details, dependencies and timestamps, with integrity requirements around completeness, authenticity and accuracy. InteropAtlas uses these as engineering precedents for trustworthy and machine-verifiable provenance without adopting build-specific fields in the current knowledge profile."
