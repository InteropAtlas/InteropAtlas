scope_notes_zh: 保留既有版本标识 agntcy_oasf:1.0.0，仅描述 v1.0.0 所指 commit 1d2eed1089e39a37678c4a1d9773ff618279d897 的 OASF
  record/schema 规范。带注释标签 40d58023331953055271a3a4a17fa2cad96e5ce1 指向该 commit；发布页于 2026-02-12 发布，非 draft、非 prerelease，但
  immutable 为 false。README 允许已发布 schema 版本的非破坏性修正，因此固定版本字符串不是所有未来同名内容的不可变证明，也不声称最新版。record 是 agentic 工作负载信息/元数据的描述结构；name、version、schema_version、description、authors、created_at、skills
  为 required，domains 与 modules 为 recommended，locators 与 annotations 为 optional。该要求等级支持既有 artifact/specification
  分类，而不是新造概念类 framework，也不把规范等同 server/、SDK、Directory 或整个 AGNTCY 生态。仅收录描述结构及上述要求等级，不评估单项技能/领域分类或模块符合性。record.created_at
  的规范文字要求 RFC3339 时间戳；字典将其映射到 datetime_t，但其正则允许省略时区后缀，不能证明日历/数值范围有效，且只列 T/t 分隔符而示例包含空格。RFC3339 §5.6 允许应用选择空格，故不把空格本身判为必然违反
  RFC。保留文字、正则与示例的差异，不修补来源，不推断服务器完整验证行为、时间准确性或时钟同步。record.version 仅说 MAY 采用某种版本方案，不推出强制 SemVer。通用 URL 与 locator 的引用不同、元模式与服务器生成模式的方言角色不同，均不外推为本对象的额外标准依赖。A2A/MCP
  相关提及不证明身份等同、实现或兼容关系。本次仅静态来源检视，无安装、执行、运行时验证、网络发现或部署；不声称安全、身份认证、权限、可靠发现、互通、认证或 IA 采用。
scope_notes_en: 'Preserves the existing agntcy_oasf:1.0.0 identity and describes only the OASF record/schema specification
  at v1.0.0 commit 1d2eed1089e39a37678c4a1d9773ff618279d897. Annotated tag 40d58023331953055271a3a4a17fa2cad96e5ce1
  points to that commit. The release was published on 2026-02-12, is neither draft nor prerelease, and reports immutable:false.
  The README permits nonbreaking fixes to a released schema version, so the version string does not prove that all
  future same-version content is immutable; no latest-version claim is made. The record describes agentic workload
  information/metadata. Its required attributes are name, version, schema_version, description, authors, created_at
  and skills; domains and modules are recommended, while locators and annotations are optional. These requirement
  levels support the existing artifact/specification classification, not a new concept/framework type or an identity
  covering server/, SDKs, Directory or the entire AGNTCY ecosystem. Individual skill/domain taxonomies and module
  conformance are not evaluated. The normative created_at text requires an RFC3339 timestamp. Its dictionary mapping
  uses datetime_t, whose regex permits an absent timezone suffix, does not establish calendar/range validity, and
  allows only T/t while examples include a space. RFC3339 section5.6 permits applications to choose a space, so
  a space is not categorically a violation. The text/regex/example differences are retained without source repair
  or a server-validation, timestamp-accuracy or clock-synchronization claim. record.version only MAY follow a versioning
  scheme, not mandatory SemVer. Differing generic-URL/locator references and the different roles of metaschema versus
  server-generated schema dialects do not establish additional standard dependencies here. A2A/MCP mentions do not
  prove identity, implementation or compatibility. Static source inspection only: no installation, execution, runtime
  validation, network discovery or deployment, and no security, authentication, permission, reliable-discovery,
  interoperability, certification or IA-adoption assertion.'
