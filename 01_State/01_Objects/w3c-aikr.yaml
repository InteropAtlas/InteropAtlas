description_zh: W3C 社区组围绕 AI 与智能体知识表示开展分类法、词汇表、标准清单、关系映射与缺口分析。其方法与 InteropAtlas 的“标准清单 + 关系 + 缺口”思路高度相关，但领域主要聚焦 AI/智能体。
description_en: A W3C Community Group producing taxonomies, vocabularies, standards inventories, relationship maps, and gap analyses for AI and agentic systems.
