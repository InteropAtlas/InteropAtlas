lessons_zh:
  - 将分类法、词汇表、标准清单和缺口分析相互连接，而不是只做平面目录。
  - 缺口分析应按能力或知识领域组织，并保留依据。
  - 可以提供交互式标准全景图，同时保留底层结构化资料。
