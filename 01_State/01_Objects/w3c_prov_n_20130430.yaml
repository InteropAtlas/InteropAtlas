name_zh: PROV-N 溯源记法（2013 原始推荐标准）
name_en: 'PROV-N: The Provenance Notation (2013 Original Recommendation)'
official_name: 'PROV-N: The Provenance Notation'
description_zh: 'PROV-N 是用于表达 PROV-DM 实例的人可读、紧凑函数式记法（functional notation）。固定 W3C Recommendation 提供正式语法和附加语义规则；语法正确的表达式仍可能不被模型接受。正文产生式和表格是规范性的，示例及单独汇总的便利语法文件是资料性的。仅限
  2013-04-30 原始 Recommendation；勘误未审阅或整合，不是最新纠错版。未核验任何解析器或实现，不证明完整 PROV-CONSTRAINTS 有效性、溯源事实真实性或 IA 采用。


  English scope and limitations:


  PROV-N is a compact, human-readable functional notation for expressing PROV-DM instances. This fixed W3C Recommendation
  specifies a formal grammar and additional semantic rules; syntactically correct expressions can still be unacceptable
  to the model. In-document productions and tables are normative; examples and the separate convenience grammar
  file are informative. Original 2013-04-30 Recommendation only: errata were neither reviewed nor consolidated,
  so this is not a latest corrected edition. No parser or implementation was verified. Not proof of full PROV-CONSTRAINTS
  validity, provenance truth or IA adoption.'
description_en: 'PROV-N is a compact, human-readable functional notation for expressing PROV-DM instances. This
