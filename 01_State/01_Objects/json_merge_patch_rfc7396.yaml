name_en: JSON Merge Patch Original Specification (RFC 7396)
official_name: JSON Merge Patch
description_zh: 'JSON Merge Patch 的固定 RFC 7396 原始出版物（2014 年 10 月，Proposed Standard），废止 RFC 7386。对象补丁递归合并，null 成员值删除目标同名成员；非对象补丁整体替换目标，数组不支持逐元素修改。操作不保证文本布局或超出目标实现能力的数值精度，重复成员名的结果未定义。媒体类型为
  application/merge-patch+json。仅限 2014 年 10 月原始出版物；本轮未核验勘误条目、数量或处理状态，不声称无勘误、已整合勘误、当前完整修订语义或实现符合性。 原版规范引用 RFC 7159，不替换为
  RFC 8259。本记录不表示实现、IA 采用或必须使用 HTTP；不建立 JSON Pointer、JSON Patch 或 HTTP 的无条件技术关系。


  English scope and limitations:


  Original October 2014 RFC 7396 (Proposed Standard), obsoleting RFC 7386. Object patches merge recursively; null-valued
  members remove matching target members. Non-object patches replace the target; arrays are not patched element
  by element. Preservation of text layout or precision beyond the target implementation is not guaranteed; duplicate-name
  behavior is undefined. The media type is application/merge-patch+json. Errata entries, counts and dispositions
  were not reviewed: no absence-of-errata, corrected-semantics or implementation-conformance claim. The normative
  JSON reference is RFC 7159, not RFC 8259. This document record asserts neither IA adoption nor mandatory HTTP
  use, and adds no unconditional technical relation to HTTP, JSON Pointer or JSON Patch.'
description_en: 'Original October 2014 RFC 7396 (Proposed Standard), obsoleting RFC 7386. Object patches merge recursively;
  null-valued members remove matching target members. Non-object patches replace the target; arrays are not patched
  element by element. Preservation of text layout or precision beyond the target implementation is not guaranteed;
  duplicate-name behavior is undefined. The media type is application/merge-patch+json. Errata entries, counts and
  dispositions were not reviewed: no absence-of-errata, corrected-semantics or implementation-conformance claim.
  The normative JSON reference is RFC 7159, not RFC 8259. This document record asserts neither IA adoption nor mandatory
  HTTP use, and adds no unconditional technical relation to HTTP, JSON Pointer or JSON Patch.'
