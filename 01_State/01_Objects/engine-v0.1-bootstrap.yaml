notes_zh:
  - 这是实践驱动反馈环的第一批正式自举场景之一。
  - Engine v0.1 优先建立可阅读、可导航、可反馈的最小闭环，而不是优先绑定高级图数据库或语义技术栈。
  - 实践中新增的能力需求应继续拆分为更小的 Scenario / Capability，并记录采用与未采用方案。
  - 自动构建与部署属于场景能力需求；GitHub Actions 是当前候选平台实现，不应被误建模成开放标准。
