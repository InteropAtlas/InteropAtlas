name_zh: libadm音频定义模型处理库
name_en: libadm Audio Definition Model handling library
description_zh: 'libadm 是用于解析、修改、创建和写入音频定义模型（ADM）XML 的 C++ 库；本记录固定 0.14.0 及官方 commit 1f3e87dc37736ed42104969f00b6c4cbd43221e6，不是
  BS.2076 标准、EBU 组织或最新版声明。


  固定 README 的 Current Limitations 明示：标准修订纳入可能滞后，不能保证覆盖全部用途，缺少部分 ADM 子元素，且不支持串行 ADM（S-ADM；原文 SADM，BS.2125）。固定 CHANGELOG
  的 0.14.0 条目记录若干 BS.2076-2 功能；这些上游文档声明不证明完整 BS.2076-2 或 BS.2076-3 符合性，也不代表对当前所有版本或实现源码的独立判断。


  本次只读取两份固定上游文档并核对其 Git 对象字节，把原 scope 中的限制补入可见描述；没有构建或执行 libadm、XML/音频样例、上游测试或配对实验。旧 #456 的 IA 检查和独立复核是已完成历史，不能说项目从未验证；#583
  的 libbw64 实测也不能归为 libadm 运行。既有 libbw64 → recommended_with → libadm 是文档建议关系，不是标准 implements 边或已测配对；关系和 libbw64
  的原可见限制保持不变，不声称反向页已展示全部关系条件。


  旧来源访问日期、scope、身份、创建和 intake 历史保留。旧审核包没有两文档的原始文件哈希，本次只能确认新取得字节与固定 Git 对象相符，不冒称与旧捕获逐字节相等。不推断完整验证、互通、安全、生产适用性或 IA
  采用。'
description_en: 'libadm is a C++ library for parsing, modifying, creating and writing Audio Definition Model (ADM)
  XML. This record pins release 0.14.0 and official commit 1f3e87dc37736ed42104969f00b6c4cbd43221e6; the subject
  is not the BS.2076 standard or EBU organization, and no latest-release claim is made.


  Current Limitations in the fixed README states that incorporation of standard revisions may lag, coverage of all
  use cases is not guaranteed, some ADM sub-elements are missing, and serial ADM (S-ADM; written SADM, BS.2125 in
  the source) is not supported. The fixed CHANGELOG entry for 0.14.0 lists selected BS.2076-2 features. These upstream
  documentation statements do not establish full BS.2076-2 or BS.2076-3 conformance or an independent judgment of
  every current version or implementation source.


  This supplement only reads two fixed upstream documents and verifies their Git-object bytes to make limitations
  already in scope visible. No libadm build or execution, XML/audio example, upstream test or paired-library experiment
  was performed. Original #456 IA checks and independent review remain completed history, not a claim that the project
  was never verified; #583 libbw64 execution must not be attributed to libadm. The existing libbw64 → recommended_with
  → libadm relation is a documentary recommendation, not a standard implements edge or tested pairing. That relation
  and libbw64''s existing visible limitations remain unchanged; full relation conditions are not claimed to have
  become visible on the reverse page.


  Original source access dates, scope, identity, creation and intake history remain. The old review packet contains
  no original file hashes for these two documents, so this supplement establishes equality of newly obtained bytes
  with fixed Git objects, not byte-for-byte equality with historical captures. Full validation, interoperability,
  security, production suitability and IA adoption are not inferred.'
