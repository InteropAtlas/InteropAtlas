summary_zh: "W3C PROV-O 是 2013 年发布的 W3C Recommendation（W3C 推荐标准），用 OWL2 表达 PROV 数据模型，为跨系统表示和交换 provenance（来源与过程追溯/溯源）信息提供通用语义。InteropAtlas 将其作为身份、活动、实体、来源与验证留痕设计的重要上游参考，而不是直接复制其完整模型。"
summary_en: "W3C PROV-O is a 2013 W3C Recommendation expressing the PROV Data Model in OWL2 for interoperable representation and exchange of provenance information. InteropAtlas uses it as an upstream reference for lightweight provenance and traceability design rather than adopting the entire model verbatim."
