summary_zh: "定义可访问用户界面元素的 roles、states 与 properties，使 Web 内容和应用能够向辅助技术传递结构与交互语义。WAI-ARIA 1.2 是 W3C Recommendation，并明确以提升与辅助技术以及 HTML/SVG 可访问性模型的互操作性为目标。"
summary_en: "Defines roles, states, and properties for accessible user interface elements so web content and applications can expose structure and interaction semantics to assistive technologies. WAI-ARIA 1.2 is a W3C Recommendation and explicitly targets improved interoperability with assistive technologies and the accessibility models of HTML and SVG."
