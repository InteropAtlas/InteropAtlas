scope_notes_en: 'The subject is the SPDX Python Model library, not the SPDX specification/organization, SPDX Python
  Tools or the shacl2code generator. Fixed 0.0.6 / commit 6dc821545e2e96fc8501f47f946c8fa72e579bc4; lightweight
  v0.0.6 references that commit, and the release is non-draft/non-prerelease but mutable (immutable=false). Its
  Beta classifier does not establish stability or production readiness. Released PyPI wheel/sdist bytes were downloaded
  and SHA-256 recomputed; their bindings/v3_0_1/model.py members are identical generated archive content, not committed
  repository source. Scope is only CreationInfo comment, created, createdBy, createdUsing and specVersion fields
  plus JSON-LD serialization/deserialization. Construction/loading alone does not ensure required values: assignment/decoding
  applies relevant type/pattern checks, while missing-field/cardinality checks occur during encoding; supplied Agent/Tool
  objects also undergo their own encoding checks. specVersion checks SemVer syntax, not equality to 3.0.1. Creator/tool
  references may remain unresolved strings; representing or writing them does not authenticate identities or claims.
  Normatively, created may be the element last-change time, not necessarily SPDX export time. Fractional-second
  strings are rejected; Python datetime microseconds are truncated, zero offsets normalize to UTC, and strings with
  nonzero hour/minute offsets are rejected by the field trailing-Z constraint rather than converted to UTC; datetime
  timezone-offset seconds are truncated before the UTC-Z check. Naive datetime processing depends on the host timezone.
  Unknown properties are not automatically preserved; serialization can reassign blank-node IDs and sort objects,
  so no byte-preserving or universal semantic-roundtrip guarantee follows. Top-level loading selects a recognized
  context URL, taking only the first string in a context list, not generic JSON-LD processing. A returned output-byte
  digest is not a signature or provenance-authenticity check. Python>=3.9, Apache-2.0 and Beta are project/package
  declarations, not tested runtime compatibility or legal audit. There are no mandatory runtime dependencies; development
  extras and build requirements including shacl2code==1.1.0 are separate. Versioned SPDX 3.0.1 generator-input URLs
  and permitted local overrides do not prove original build-input bytes or reproducible builds. Mutable online tutorials
  are not fixed-release evidence. No installation/import/execution, upstream tests, network identity checking, complete
  SPDX validation, timestamp reliability, tooling-history authentication, signature verification, security assessment
  or third-party interoperability testing occurred. This record does not assert IA adoption or alter IA provenance
  practices.'
