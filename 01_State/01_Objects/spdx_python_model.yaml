name_en: SPDX Python Model
description_zh: 固定 0.0.6 的 Python 库；本记录仅核实生成的 SPDX 3.0.1 CreationInfo 五字段绑定及 JSON-LD 表示/读写机制，不证明完整 SPDX 验证、来源身份真实性、可靠时间或无损往返。
description_en: A Python library pinned to 0.0.6; this record verifies only generated SPDX 3.0.1 CreationInfo five-field
  bindings and JSON-LD representation/read-write mechanisms, not complete SPDX validation, provenance identity authenticity,
  reliable timestamps or lossless roundtrips.
