summary_zh: W3C CSS Working Group 发布的 CSS 2025 状态快照，汇总构成当时 CSS 官方定义的相关模块。CSS 用于描述 HTML、XML 等结构化文档的呈现方式。该快照本身是 W3C Group Note，具体 CSS 模块具有各自的规范状态。
summary_en: A W3C CSS Working Group snapshot collecting the specifications that form the state of CSS as of 2025. CSS describes the rendering of structured documents such as HTML and XML. The snapshot itself is a W3C Group Note while individual CSS modules have their own statuses.
