name_zh: JSON Patch 原始规范文档（RFC 6902）
name_en: JSON Patch Original Specification (RFC 6902)
official_name: JavaScript Object Notation (JSON) Patch
description_zh: 'JSON Patch 的固定 RFC 6902 原始出版物（2013 年 4 月，Proposed Standard），以 JSON 数组表达依序应用的 add、remove、replace、move、copy、test
  操作；每项 path 使用 RFC 6901 JSON Pointer，媒体类型为 application/json-patch+json。固定 2013 年 4 月原始出版物；官方信息页显示六项勘误报告，但本轮未核验勘误内容或处理状态，不声称已整合勘误、当前完整修订语义或实现符合性。
  原版 JSON 规范引用为 RFC 4627，不替换为 RFC 8259。这里是文献级记录，不是库、HTTP 服务或 IA 采用；不从 HTTP PATCH 的原子性推断任意补丁库的回滚保证。


  English scope and limitations:


  The original April 2013 RFC 6902 publication (Proposed Standard) represents sequential add, remove, replace, move,
  copy and test operations as a JSON array. Each path uses RFC 6901 JSON Pointer; the media type is application/json-patch+json.
  The official information page indicates six errata reports; their contents and status were not reviewed. This
  record does not incorporate errata or assert complete corrected semantics or implementation conformance. The original
  JSON reference is RFC 4627, not RFC 8259. This is a document record, not a library, HTTP service or IA adoption
  claim; HTTP PATCH atomicity is not generalized to rollback guarantees in arbitrary patch libraries.'
description_en: The original April 2013 RFC 6902 publication (Proposed Standard) represents sequential add, remove,
