scope_notes_zh: 这是历史出版物记录，不表示新系统应采用RF64；EBU明确要求以ITU-R BS.2088作为后续规范并停止发展Tech 3306。后续应建立明确的supersession关系，而不是删除历史对象。
scope_notes_en: This is a historical publication record, not a recommendation for new adoption. EBU states that ITU-R BS.2088 should be used and that Tech 3306 will no longer be developed. A separate supersession relationship should be recorded rather than deleting the historical object.
