description_zh: Python 的 opentelemetry-api 发行包；本记录固定到 1.45.1，聚焦其 TraceContextTextMapPropagator 从文本载体提取与注入追踪上下文的实现。
description_en: The Python opentelemetry-api distribution, pinned here to 1.45.1; this record focuses on its TraceContextTextMapPropagator
  implementation for extracting and injecting tracing context in text carriers.
version: 1.45.1
