  inject returns immediately when the span context equals INVALID_SPAN_CONTEXT; otherwise it writes traceparent
  through the setter and writes tracestate only when trace_state is truthy. The implementation has no old-field
  deletion step. The text-carrier API therefore instructs callers to delete the fields listed by propagator.fields
  before reusing a carrier and calling inject; this propagator lists traceparent and tracestate. This is not a guarantee
  about arbitrary custom setters or comprehensive validation of manually constructed SpanContext values.


  This clarification is based on pinned-source inspection; the historical intake''s 22 in-memory carrier examples
