id: opentelemetry_python_api
type: system
kind: library
name_zh: OpenTelemetry Python API 上下文传播库包
name_en: OpenTelemetry Python API context propagation package
description_zh: 'Python 的 opentelemetry-api 发行包；本记录固定到 1.45.1，聚焦其 TraceContextTextMapPropagator 从文本载体提取与注入追踪上下文的实现，而非
  SDK、Exporter 或 Collector。


  上下文传播不是重置操作。固定源码中，extract 在未提供 context 时才创建新 Context；getter 返回无 traceparent、首个值未匹配格式、trace ID 或 span ID 全零、版本
  00 带额外字段、或版本 ff 时，返回原有的传入 context。这仅描述这些明确分支，不保证任意畸形载体或自定义 getter 输入都被捕获。


  inject 在 span context 等于 INVALID_SPAN_CONTEXT 时直接返回，否则通过 setter 写入 traceparent，仅在 trace_state 为真时写入 tracestate；实现没有删除旧字段的步骤。文本载体
  API 因而要求复用 carrier 前，先删除 propagator.fields 所列的字段，再调用 inject；此传播器列出 traceparent 和 tracestate。这不是对任意自定义 setter 行为或手工
  SpanContext 的全面有效性保证。


  此次澄清来自固定源码检查；历史 intake 记录的 22 个内存载体示例未在此重新执行。不据此声称完整 W3C 符合性、真实 HTTP 或跨实现互通、安全保证、生产适用性或 IA 采用；不新增能力或 implements
  关系。


  English scope and limitations:


  The Python opentelemetry-api distribution, pinned here to 1.45.1; this record focuses on its TraceContextTextMapPropagator
  implementation for extracting and injecting tracing context in text carriers, not the SDK, exporters or Collector.


  Propagation is not a reset operation. In the pinned source, extract creates a new Context only when no context
  is supplied. It returns the supplied context when the getter yields no traceparent, the first value fails the
  format match, either ID is all zeroes, version 00 has extra fields, or the version is ff. This describes those
  explicit branches, not a guarantee that arbitrary malformed carriers or custom getter inputs are caught.


  inject returns immediately when the span context equals INVALID_SPAN_CONTEXT; otherwise it writes traceparent
  through the setter and writes tracestate only when trace_state is truthy. The implementation has no old-field
  deletion step. The text-carrier API therefore instructs callers to delete the fields listed by propagator.fields
  before reusing a carrier and calling inject; this propagator lists traceparent and tracestate. This is not a guarantee
  about arbitrary custom setters or comprehensive validation of manually constructed SpanContext values.


  This clarification is based on pinned-source inspection; the historical intake''s 22 in-memory carrier examples
  were not rerun here. It establishes neither full W3C conformance, real HTTP or cross-implementation interoperability,
  security, production suitability nor IA adoption; it adds no capability or implements relation.'
