scope_notes_zh: 主体为 PyPI opentelemetry-api 包，不是整个 monorepo、SDK、Exporter 或 Collector。包包含抽象 API 和 no-op 默认实现；本切片只核对实际可执行的
  TraceContextTextMapPropagator 及相关上下文类型，不把 API 存在等同遥测采集或导出。默认 dict getter 按键直接取值，HTTP 大小写等适配须由相应 carrier/getter
  提供。缺失或无效 traceparent 的 extract 会保留传入 context；inject 原地写 carrier，不保证清除旧头部，也不是任意手工 SpanContext 的全面有效性检查器。TraceFlags
  文档链接 Trace Context 2 并支持 random-trace-id 位 0x02，因此本轮不接纳对库内 2021 Trace Context 固定端点的 implements 关系。22 个内存载体示例不证明完整
  W3C 符合性、真实 HTTP/跨实现互通、安全、生产推荐或 IA 采用。
scope_notes_en: The subject is the PyPI opentelemetry-api package, not the whole monorepo, SDK, exporters or Collector.
  It contains abstract APIs and default no-op implementations; this slice checks the executable TraceContextTextMapPropagator
  and related context types, not telemetry collection or export. The default dict getter accesses keys directly;
  HTTP casing and other adaptations need an appropriate carrier/getter. Extraction with missing or invalid traceparent
  preserves the supplied context. Injection mutates the carrier, does not guarantee removal of old headers and is
  not comprehensive validation of arbitrary manually constructed SpanContext values. TraceFlags links to Trace Context
  2 and supports random-trace-id bit 0x02, so no implements relation to the recorded 2021 Trace Context endpoint
  is accepted here. Twenty-two in-memory carrier examples do not establish full W3C conformance, real HTTP/cross-implementation
  interoperability, security, production suitability or IA adoption.
