lessons_zh:
  - "把真实用户需求、无障碍、遵循既有标准和广泛测试作为设计原则，而不是把视觉风格作为起点。"
  - "组件文档同时提供用途、UX、无障碍和实现指导；已测试组件仍要求在具体项目语境中进行页面级测试。"
  - "适合作为 IA 公共知识基础设施的组件规范与符合性文档参考实现。"
lessons_en:
  - "Treats real user needs, accessibility, existing standards, and broad testing as design principles rather than starting from visual styling."
  - "Component documentation combines usage, UX, accessibility, and implementation guidance; tested components still require project-specific page-level testing."
  - "A strong reference implementation for IA component specifications and conformance documentation as public knowledge infrastructure."
