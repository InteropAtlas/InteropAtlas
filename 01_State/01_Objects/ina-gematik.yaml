lessons_zh:
  - 标准地图可以同时容纳标准、配置文件、指南、信息模型、参考架构和软件组件，而不是只收标准。
  - 标准的推荐、强制采用和一致性评估属于治理生命周期，应与标准事实本身区分。
  - 用户可以提交标准进入平台，并经过明确标准和专家流程审核。
