description_zh: 用于描述 JSON 数据结构、验证规则和相关语义的规范。InteropAtlas 当前使用 Draft 2020-12 编写自身数据 Schema。OpenAPI 3.2.1 的使用关系仅指 Schema Object 默认方言以此词汇为基础并加入 OAS base vocabulary；不代表整个 OpenAPI 文档、所有 API 载荷或任意验证器完整符合性，资源根可另选方言。
description_en: A specification for describing JSON document structure, validation rules, and related semantics. InteropAtlas currently uses Draft 2020-12 for its own data schemas. The OpenAPI 3.2.1 use relation concerns only the Schema Object default dialect based on these vocabularies plus the OAS base vocabulary, not the entire OpenAPI document, every API payload or complete conformance of arbitrary validators; resource roots can select another dialect.
