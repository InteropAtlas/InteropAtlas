scope_notes_zh: 本记录的 OpenAPI 3.2.1 uses 入边仅表述其 Schema Object 默认方言使用 Draft 2020-12 通用元模式词汇并加入 OAS base vocabulary，不表示整个 OpenAPI 文档或所有 API 载荷都是 JSON Schema。该方言属于 OAS 3.2 的日期化 URI 系列，此入边不指定某次迭代；资源根 $schema 可覆盖文档默认值，对其他方言的工具支持可选。通用模式校验不证明 OAS 扩展语义、特定工具完整符合性、跨版本兼容或实际 HTTP API 互通；未运行上游工具。既有其他入边仍以各自版本与条件为限。
scope_notes_en: The incoming OpenAPI 3.2.1 uses edge is limited to its Schema Object default dialect using Draft 2020-12 general-purpose meta-schema vocabularies plus the OAS base vocabulary, not the whole OpenAPI document or all API payloads. That dialect belongs to the dated OAS 3.2 URI series; this edge selects no dated iteration. A resource-root $schema can override the document default, and tool support for other dialects is optional. Generic schema validation establishes neither OAS extension semantics, complete conformance of a particular tool, cross-version compatibility nor actual HTTP API interoperability. No upstream tooling was run. Other incoming edges retain their own version and scope conditions.
