summary_zh: "ISO/IEC 5339:2024 为 AI 应用提供生命周期指导，强调多利益相关方沟通，并从 make、use、impact 等视角帮助组织理解和管理 AI 应用。InteropAtlas 的 Open Collaboration Profile 将其作为人机协作和 AI 应用治理的上位参考之一。其已发布 International Standard 身份是事实；成熟度、治理开放性和供应商中立性等评价暂不由该事实自动推出。"
summary_en: "ISO/IEC 5339:2024 provides lifecycle guidance for AI applications, emphasizing multi-stakeholder communication and make, use, and impact perspectives. InteropAtlas uses it as an upstream reference for human-AI collaboration and AI application governance. Its published International Standard status is a fact; maturity, governance openness, and vendor-neutrality assessments are not inferred automatically from that status."
