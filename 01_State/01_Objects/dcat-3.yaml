description_zh: "W3C 用于促进 Web 数据目录互操作的 RDF 词汇表，提供 Catalog、Dataset、DataService、Cataloged Resource 等资源模型，并大量复用既有词汇；可直接帮助 InteropAtlas 判断数据项目、数据集、目录和服务是否应分开建模。"
description_en: "A W3C RDF vocabulary for interoperability among Web data catalogs, modeling resources such as catalogs, datasets, data services and cataloged resources while reusing existing vocabularies; relevant to distinguishing data projects, datasets, catalogs and services in InteropAtlas."
