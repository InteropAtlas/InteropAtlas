name_zh: RTP 实时传输协议（RFC 3550）
name_en: 'RTP: A Transport Protocol for Real-Time Applications (RFC 3550)'
official_name: 'RTP: A Transport Protocol for Real-Time Applications'
description_zh: 规定实时应用的数据传输协议 RTP 及控制协议 RTCP；本协议自身不保证及时交付或服务质量。 Pion RTP 1.10.6 的 implements 入边仅记录 X=false、调用方提供合法字段与一致填充大小的基础包布局编解码；源码检视不是完整
  RTP/RTCP 会话、符合性或互通测试。
description_en: Specifies RTP and RTCP for real-time applications; RTP itself does not guarantee timely delivery
  or quality of service. The Pion RTP 1.10.6 implements edge records only base packet layout encoding/decoding with
  X=false, caller-valid fields and coherent padding sizes; source inspection is not complete RTP/RTCP sessions,
  conformance or interoperability testing.
