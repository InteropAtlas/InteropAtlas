summary_zh: "建立交互系统中软件控制的信息呈现原则，覆盖视觉、听觉和触觉/触感模态，面向信息的感知与理解，并可用于分析、设计和评价；IA 用它约束页面信息层级、区分度、简洁性和一致性。"
summary_en: "Establishes ergonomic principles for software-controlled presentation of information across visual, auditory, and tactile or haptic modalities, focusing on perception and understanding; IA uses it to guide hierarchy, discriminability, conciseness, and consistency."
