name_en: OAuthLib Python authorization protocol library
description_zh: 固定 4.0.0 的 Python 库；本记录仅核实 WebApplicationClient 对 OAuth 2.0 授权码请求及响应的构造/解析机制，不执行 HTTP，也不证明完整客户端部署、身份认证或安全符合性。
description_en: A Python library pinned to 4.0.0; this record verifies only WebApplicationClient construction/parsing
  mechanics for OAuth 2.0 authorization-code requests and responses, not HTTP execution, a complete client deployment,
  identity authentication or security conformance.
