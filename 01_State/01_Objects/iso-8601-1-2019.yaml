summary_zh: "定义公历日期、24 小时时间以及基于 UTC 的时间与时间偏移等信息交换表示规则。当前版本为 ISO 8601-1:2019，2024 年确认仍有效，但 ISO 已启动下一版修订工作。"
summary_en: "Defines representations for Gregorian calendar dates, 24-hour clock times, and UTC-based times and time shifts for information interchange. ISO 8601-1:2019 remains current after confirmation in 2024, while a revision is under development."
