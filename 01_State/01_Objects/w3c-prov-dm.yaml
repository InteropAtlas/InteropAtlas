summary_zh: "W3C PROV-DM 是 W3C PROV 家族的概念数据模型，围绕 Entity（实体）、Activity（活动）、Agent（参与者）以及生成、使用、派生、归因、关联、委派等关系描述来源与过程。InteropAtlas 采用其分离对象、活动、参与者和责任关系的核心思想，用于约束轻量留痕模型的概念边界。"
summary_en: "W3C PROV-DM is the conceptual data model of the W3C PROV family. It models entities, activities, agents, generation, usage, derivation, attribution, association, delegation and related provenance concepts. InteropAtlas adopts its separation of objects, activities, actors and responsibility relations as an upstream conceptual basis for lightweight traceability."
