name_zh: URI 通用语法（RFC 3986）
name_en: URI Generic Syntax (RFC 3986)
official_name: "Uniform Resource Identifier (URI): Generic Syntax"
description_zh: 定义统一资源标识符（URI）的通用语法。InteropAtlas 在 Schema 的 $id、来源链接和未来资源标识中依赖 URI 概念。 OpenAPI 3.2.1 的 uses 入边只限定 API 描述引用的基 URI 规则，含相对 $self 和 Schema Object 的额外规则；不等于 API 端点 URL 规则、网络取回保证或互通证明。
description_en: Defines the generic syntax of Uniform Resource Identifiers (URIs). InteropAtlas relies on URI concepts for schema identifiers, source links, and future resource identification. The OpenAPI 3.2.1 uses edge is limited to base-URI rules for API-description references, including relative $self and additional Schema Object rules, not API-endpoint URL rules, guaranteed network retrieval or demonstrated interoperability.
