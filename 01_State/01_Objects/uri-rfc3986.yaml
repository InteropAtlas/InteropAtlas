scope_notes_zh: 另据 3.2.1 的描述引用规则，API 描述中的 URI 标识引用按 RFC 3986 确定基 URI；相对 $self 先按下一基址来源解析，Schema Object 还遵循其 JSON
  Schema $id 规则。标识不等于网络取回地址或 API 调用，取回支持可选，不保证可获取性、安全性或工具互通。 仅限定 OpenAPI 3.2.1 入边，其他入边仍按各自文献和条件解释。
scope_notes_en: Under the separately checked 3.2.1 description-reference rules, API-description URI identifiers
  use RFC 3986 base-URI determination; a relative $self is first resolved against the next base source, and Schema
  Objects additionally follow their JSON Schema $id rules. Identification is not network retrieval or an API call.
  Retrieval support is optional, without guarantees of accessibility, safety or tooling interoperability. This limits
  only the OpenAPI 3.2.1 incoming edge; other incoming edges retain their own documents and conditions.
