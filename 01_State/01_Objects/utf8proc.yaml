description_zh: 开源 C Unicode / UTF-8 处理库；固定 2.12.0，记录有界单码点编解码及调用方验证前置条件，不将其 Unicode 18.0 声明等同现有 Unicode 17.0 端点。
description_en: An open-source C Unicode / UTF-8 processing library, pinned to 2.12.0; records bounded single-codepoint
  encoding/decoding and caller-validation prerequisites without equating its Unicode 18.0 claim with the existing
  Unicode 17.0 endpoint.
