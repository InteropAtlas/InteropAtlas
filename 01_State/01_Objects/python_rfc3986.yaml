  可将与base同scheme的引用当相对引用，strict=True 保留该scheme。这里只核字符串处理，不进行网络解析或获取；内部沿用 is_valid 并出现弃用警告。normalize 可将scheme/host转小写、百分号十六进制转大写并移除点段，保留路径大小写；本例不解码unreserved百分号字节，也不移除http显式默认端口，不是完整的规范化或所有方案语义等价判定。24项可信合成内存例在
  python -S 和独立目标目录运行，无可选idna；未测试IRI/IDNA转换、其他扩展、全部RFC规则、WHATWG浏览器URL行为、实际网络/DNS、生产适用性、第三方互通、安全认证或IA采用。18份固定官方源指纹、13份安装源码逐字一致及官方wheel
