  对 path/query/fragment 做百分号编码，包括空格、UTF-8文本和本例的无效百分号文本；解析后字符串不是原输入逐字保留，后续检查通过也不能证明原输入严格符合 RFC ABNF。Validator 默认不要求组件存在、不启用组件有效性检查；allowlist本身不要求组件存在，需显式
  require_presence_of。允许值会规范化，但 validate 不自动规范化传入 URIReference；本例大写 scheme/host 与小写allowlist不匹配，调用者可先显式 normalize。check_validity_of
