scope_notes_en: Pinned to Python rfc3986 2.0.0, official tag 2.0.0 at commit 7a64092490c1b3c4f354b9b14d060fa758d66848;
  this PyPI release was published on 10 January 2022 and is not described as the latest. The library provides URI-reference
  component representation, relative-reference resolution, selected normalization and configurable checks. resource_identification
  here means handling resource-identifier strings, not permanence, availability, ownership or identity management.
  URIReference.from_string percent-encodes path/query/fragment, including spaces, UTF-8 text and the tested malformed
  percent text. The result is not lexical preservation of input; passing later checks does not establish strict
  RFC ABNF validity of the original input. Validator enables neither presence requirements nor component-validity
  checks by default. An allowlist alone does not require a component; require_presence_of must be configured explicitly.
  Allowed values are normalized, but validate does not automatically normalize its supplied URIReference. Uppercase
  scheme/host fail the lowercase allowlist in the example; callers can explicitly normalize first. check_validity_of
  applies a package-specific port range of 0 through 65535, not merely the generic *DIGIT syntax of RFC3986 section
  3.2.3. resolve_with requires a valid base with a scheme and normalizes that base. Default strict=False can treat
  a same-scheme reference as relative; strict=True retains that scheme. These are string operations, not network
  resolution or retrieval; the implementation internally invokes deprecated is_valid and emits its warning. normalize
  lowercases scheme/host, uppercases percent-escape hex and removes dot segments while preserving path case. The
  examples retain escaped unreserved characters and an explicit default HTTP port; this is not complete normalization
  or scheme-specific semantic equivalence. Twenty-four trusted synthetic in-memory examples run under python -S
  in a separate target directory without optional idna. IRI/IDNA conversion, other extensions, all RFC requirements,
  WHATWG browser URL behavior, actual networking/DNS, production suitability, third-party interoperability, security
  certification and IA adoption were not tested. Eighteen fixed official source fingerprints, thirteen byte-identical
  installed source files and the official wheel SHA256 are separate observations, not a full dependency security
  audit. Apache-2.0 is recorded from the fixed LICENSE, not as a legal-suitability opinion.
