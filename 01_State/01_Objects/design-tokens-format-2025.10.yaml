summary_zh: "定义在不同设计工具、开发工具和平台之间交换设计令牌的 JSON 文件格式，包括 token、group、alias 等结构。它由 W3C Design Tokens Community Group 发布为 2025.10 Final Community Group Report；规范明确指出它不是 W3C Standard，也不在 W3C Standards Track，但被发布方视为稳定、面向实现的规范。"
summary_en: "Defines a JSON file format for exchanging design tokens across design and development tools and platforms, including tokens, groups, aliases, and related structures. It is a 2025.10 Final Community Group Report from the W3C Design Tokens Community Group; the specification explicitly states that it is not a W3C Standard and is not on the W3C Standards Track, while being considered stable and intended for implementation."
