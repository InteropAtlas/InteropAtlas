scope_notes_zh: 保留既有 smpte_st12_1 / smpte:st.12-1 工作级标准身份，审阅上下文固定为 2014-02-20 批准的 ST 12-1:2014，不新建版次主体或声称最新版。§1
  定义电视及伴随音频系统的时间地址、二进制组和标志位，以及 LTC 与 VITC 的主要传输结构。VITC 调制和位置的规定仅覆盖 525/59.94 与 625/50 模拟复合或分量系统；这不把 ST 12-2 的 ATC
  封装、D-VITC 或所有数字视频传输并入本主体。此处仅核实标准身份和上述范围，并非逐项审计所有帧率、计数模式、标志位或电气要求。DPX 的另列 uses 关系仅涉及固定 2014 版电视信息头中的非核心时间码/用户位元数据，不等于
  LTC/VITC 信号传输。未运行时间码生成器、解析器或媒体工具；不证明 UTC 同步精度、设备认证、实现符合性、部署、跨系统互通或 IA 采用。
scope_notes_en: Preserves the existing work-level identity smpte_st12_1 / smpte:st.12-1, reviewed at ST 12-1:2014
  approved 2014-02-20, without a new edition subject or latest-version claim. Section 1 defines time addresses,
  binary groups and flags for television and accompanying audio, plus primary LTC and VITC transport structures.
  VITC modulation/location provisions cover only 525/59.94 and 625/50 analog composite or component systems; ST
  12-2 ATC carriage, D-VITC and every digital-video transport are not folded into this subject. This is a bounded
  identity/scope review, not an exhaustive audit of frame rates, counting modes, flags or electrical requirements.
  The separate DPX uses relation concerns non-core time-code/user-bit metadata in the fixed 2014 television header,
  not LTC/VITC signal transport. No generator, parser or media tool was executed. UTC synchronization accuracy,
  device certification, implementation conformance, deployment, cross-system interoperability and IA adoption are
  not established.
