  edition equivalence or full conformance. The caller supplies a live readable/writable LTCFrame object without
  concurrent modification and accesses named fields. Every decimal digit is valid (units 0..9), with combined frames
  00..24, seconds/minutes 00..59 and hours 00..23. A valid combined numeric range alone does not suffice if an individual
  BCD digit is invalid. fps is exactly 25, dfbit is 0, standard is LTC_TV_625_50, and flags is exactly LTC_NO_PARITY
  (enum value 8), excluding LTC_USE_DATE (1). The enum and implementation govern, not the header comment incorrectly
  saying bit 4. Each call advances only the eight time-address fields one count: frame 24 carries into seconds,
  seconds/minutes 59 carry, and 23:59:59:24 wraps to 00:00:00:00. Only that day wrap returns 1; all other valid
  inputs return 0. These are static control-flow deductions, not execution results; the date-error return -1 is
