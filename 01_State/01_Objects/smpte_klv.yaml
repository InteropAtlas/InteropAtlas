name_zh: SMPTE ST 336 键-长度-值（KLV）数据编码规范
name_en: SMPTE ST 336 — Data Encoding Protocol Using Key-Length-Value
description_zh: 定义数据项与数据组的字节级 KLV 表示以及集合/包编码的标准；本记录固定 ST 336:2017，不代表具体实现。
description_en: A standard for byte-level KLV representation of data items and groups, including sets and packs;
  reviewed at ST 336:2017, not an implementation.
version: '2017'
