scope_notes_zh: 保留 ST 336 的既有 work-level 标识，本记录固定 2017-07-21 批准的 2017 版。§1 将数据项/数据组的字节级编码结构与应用、运输方式分开；不意味着任意应用自动互通。§5.1
  描述完整 UL Key、长度及数据 Value，完整 Key 为 16 字节；组内局部 Tag 及各类组编码不应混同这一完整键形式。§5.3 的普通 KLV 长度使用 BER 短式/长式；组内成员长度可按组定义采用其他方法，应用标准可限制字段字节数或值域。无法预知长度时的
  0x80 只有在允许它的应用定义替代终止定位方式等前提下使用，不推出 MXF 允许该值。标准分别定义 Universal/Global/Local Sets、Variable-Length/Defined-Length
  Packs；Defined-Length 并不等于所有包固定常数长度。§5.5 不规定包间连续性/空隙，由相应承载规范处理。只记录标准结构与应用约束边界，不将其当作具体软件、网络运输、素材编解码或全面实现符合性证明；无实现执行、互通/安全认证或
  IA 采用判断。
scope_notes_en: Preserves the existing ST 336 work-level identifier, reviewed at the 2017 edition approved 2017-07-21.
  §1 separates byte-level data-item/group representation from application and transport, not a guarantee of arbitrary
  application interoperability. §5.1 describes the full UL Key, Length and data Value; the full key is 16 bytes,
  distinct from local tags and group-specific item encodings. Ordinary KLV lengths use BER short/long forms under
  §5.3, while group-member lengths can use group-defined methods and application standards can limit field sizes
  or ranges. The 0x80 unknown-length case requires an allowing application to define an alternative way to locate
  the Value end; it does not mean MXF permits that value. Universal/Global/Local Sets and Variable-Length/Defined-Length
  Packs are distinct constructs; Defined-Length does not mean every pack has a constant total length. Packet contiguity/gaps
  are outside §5.5 and belong to the relevant transport specification. This is a standard and its bounded structural
  description, not software, network transport, a codec or proof of complete implementation conformance. No implementation
  execution, interoperability/security certification or IA-adoption assessment.
