description_zh: "W3C 2017 Recommendation，用 shapes 描述 RDF 图的约束并产生验证结果。InteropAtlas 将其作为‘概念语义模型’与‘机器可执行验证规则’分层的成熟参考；SHACL 1.2 在 2026 年仍属于 Working Draft，不作为本对象的稳定版本。"
description_en: "The 2017 W3C Recommendation for describing and validating constraints on RDF graphs using shapes. InteropAtlas treats it as a mature reference for separating conceptual semantics from machine-executable validation; SHACL 1.2 remains a Working Draft in 2026 and is not represented here as a stable Recommendation."
