lessons_zh:
  - "要求明确 AI 生命周期中的角色、职责、风险治理与人类监督，而不是把所有责任集中在单一 AI 执行者上。"
  - "适合作为 InteropAtlas 区分 Executor、Reviewer、Maintainer、Automation 等角色以及保留 Human authorization 的治理依据。"
  - "其正式身份是 NIST Framework / guidance，而不是 ISO/IEC International Standard；Atlas 必须保留这一权威性差异。"
lessons_en:
  - "Emphasizes explicit AI lifecycle roles, responsibilities, risk governance, and human oversight rather than concentrating responsibility in a single AI executor."
  - "A strong governance reference for InteropAtlas' separation of Executor, Reviewer, Maintainer, Automation, and retained human authorization."
  - "Its authority is a NIST framework/guidance artifact, not an ISO/IEC International Standard, and Atlas must preserve that distinction."
