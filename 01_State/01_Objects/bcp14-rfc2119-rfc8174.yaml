summary_zh: "BCP 14 由 RFC 2119 与更新它的 RFC 8174 组成，为 MUST、MUST NOT、SHOULD、SHOULD NOT、MAY 等规范性关键词规定统一解释。RFC 8174 进一步澄清：只有全部大写时，这些词才具有 BCP 14 的特殊规范性含义。InteropAtlas 自产规范在使用这些大写关键词时采用 BCP 14 语义。"
summary_en: "BCP 14 consists of RFC 2119 and its update RFC 8174, defining common interpretations for normative keywords such as MUST, MUST NOT, SHOULD, SHOULD NOT, and MAY. RFC 8174 clarifies that these special meanings apply only when the keywords appear in uppercase. InteropAtlas-generated specifications adopt BCP 14 semantics when using these uppercase terms."
