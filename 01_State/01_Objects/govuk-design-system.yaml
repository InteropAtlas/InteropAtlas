lessons_zh:
  - "把 Styles、Components、Patterns 分层组织，适合 IA 学习如何把视觉基础、组件和用户任务模式分开管理。"
  - "采用 small-screen-first，并通过受控页面宽度和文本行长提高可读性；组件强调一致、可访问和可复用。"
  - "明确指出使用可访问组件并不自动使整站可访问，仍需要研究、设计、开发和测试。"
lessons_en:
  - "Separates Styles, Components, and Patterns, providing a useful model for separating visual foundations, components, and task patterns in IA."
  - "Uses small-screen-first layouts and controlled content width/line length for readability, with consistent, accessible, reusable components."
  - "Explicitly states that using accessible components does not automatically make a whole service accessible; research, design, development, and testing remain necessary."
