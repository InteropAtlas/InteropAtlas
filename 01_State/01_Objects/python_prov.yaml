id: python_prov
type: system
kind: library
name_zh: prov Python 溯源记录库（3.2.3）
name_en: prov Python provenance record library (3.2.3)
description_zh: Python 溯源记录库；固定 3.2.3，用 Entity、Activity、Agent 及所列五种关系表达调用方断言，并提供显式 PROV-JSON 内存读写。证据为固定源码与九项有界作者
  smoke，不是完整 PROV-DM/约束验证、断言真实性、自动采集或跨实现互通认证。
description_en: 'Python provenance record library pinned to 3.2.3: Entity, Activity, Agent and five specified relations
  represent caller assertions, with explicit in-memory PROV-JSON reading/writing. Evidence is fixed source and nine
  bounded author smoke cases, not full PROV-DM/constraint validation, assertion truth, automatic capture or cross-implementation
  certification.'
