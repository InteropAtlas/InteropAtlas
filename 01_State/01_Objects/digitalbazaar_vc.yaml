scope_notes_zh: 主体是 @digitalbazaar/vc JavaScript 库，不是规范、组织、上下文数据包或托管凭证服务。固定 7.3.0 / commit 08cd6f3d0c07bd62e899bd670a450ea92fe1bf59；注释标签
  v7.3.0 的 tag object 为 2d52d616476839bd6a0ada12f24030974ed5ae1c，标签/提交未签名，固定源码而非可变 main/tag 为证据。只核 createPresentation
  的 numeric version=2.0 路径：构造 @context=[https://www.w3.org/ns/credentials/v2]、type=[VerifiablePresentation] 的未签名内存对象；可选嵌入普通
  VC2-shaped credential 对象及 id/holder。上游另有发行、签名、验证和 VC1 功能，不计本次机制。此构造在安全机制之前，不生成 proof，不满足或证明 VC2 第1.3节合规文档/发行者/验证者实现及第4.13节嵌入凭证的
  securing 要求。truthy id/holder 直接复制，无类型/URL检查；调用方须自行保证合适值。verifiableCredential 可省略；[] 也会输出为空数组，因此成功不保证 present 时
  one-or-more 的规范数量要求。嵌入输入经 [].concat 包装和局部检查，内部对象引用共享，无深复制或不可变保证。检查覆盖识别的首上下文、VerifiableCredential 类型、部分 subject/issuer/typed-object/URL
  形状，但可放过空 subject 数组及 falsey 日期值，不是严格模型验证器；proof 仅局部形状检查，无签名/身份/状态真实性验证。VC2 truthy validFrom/validUntil 使用未锚定、允许省略时区的正则及
  now/maxClockSkew 时间窗口筛选，不保证全部规范日期要求或 validFrom<=validUntil；默认 now 为当时 Date、skew 为300秒，时间有效性筛选可拒绝结构有效数据，成功结果随时间变化。数值2.0与字符串"2.0"不同。VC1兼容分支不计本边、不进行迁移；EnvelopedVerifiableCredential
  不受支持，不覆盖完整表示空间。上下文映射来自声明依赖 @digitalbazaar/credentials-context ^3.2.0 中所核 v3.2.0 固定源码；其 context JSON/静态导出对象与最终
  REC B.1 的官方 context 解析结构相同、原始字节不同，仅支持所用标识/字段对应，不证明 JSON-LD 扩展/压缩/规范化或完整符合性。Node>=18、BSD-3-Clause 为固定包/许可证声明，非运行兼容性测试或法律审计；依赖范围
  ^3.2.0、jsonld ^9.0.0、jsonld-signatures ^11.6.0 不是已安装版本，未获取 npm 包字节。调用方负责完整属性/数量/上下文规范检查、合适时间策略、安全机制、状态与信任判断。固定
  README 仍展示 VC1 示例，JSDoc 声称缺少 credential 会抛错，与当前实现的可选分支不符，未据此扩大结论。只读源码和测试定义，未安装/执行上游、运行测试、生成密钥、签名/验证凭证或查询身份/状态；不作完整标准合规、安全认证、法律效力、生产就绪、第三方互通或
  IA 采用声明。
scope_notes_en: 'The identity is the @digitalbazaar/vc JavaScript library, not a specification, organization, context-data
  package or hosted credential service. Fixed 7.3.0 / commit 08cd6f3d0c07bd62e899bd670a450ea92fe1bf59; annotated
  v7.3.0 tag object 2d52d616476839bd6a0ada12f24030974ed5ae1c refers to it, with unsigned tag/commit metadata. Evidence
  is fixed source rather than mutable main/tag. Scope is only createPresentation with numeric version=2.0: an unsigned
  in-memory object with @context=[https://www.w3.org/ns/credentials/v2], type=[VerifiablePresentation], and optional
  ordinary VC2-shaped embedded objects/id/holder. Other issuance, signing, verification and VC1 functionality is
  not covered. This pre-security construction creates no proof and neither satisfies nor establishes the securing/conformance
  requirements of VC2 section1.3 or section4.13 for embedded credentials. Truthy id/holder are copied without type/URL
  validation; callers must supply appropriate values. verifiableCredential may be omitted, and [] is emitted as
  an empty array, so success does not enforce the normative one-or-more constraint when present. [].concat wraps
  inputs and local checks run, but credential-object references remain shared, without deep-copy or immutability
  guarantees. Checks cover a recognized first context, VerifiableCredential type and some subject/issuer/typed-object/URL
  shapes, yet empty subject arrays and falsey dates can pass; this is not a strict model validator. Proof checks
  concern partial shape, not signature, identity or status authenticity. Truthy VC2 validFrom/validUntil receive
  an unanchored regex check with optional timezone plus now/maxClockSkew filtering, not all normative date requirements
  or a validFrom<=validUntil constraint. Defaults are the current Date and300seconds; time-window selection can
  reject structurally valid data and makes results time-dependent. Numeric2.0 differs from string"2.0". VC1 compatibility
  is excluded and performs no migration; EnvelopedVerifiableCredential is unsupported, so the full representation
  space is not covered. Context mapping was inspected in fixed credentials-context3.2.0 within the declared ^3.2.0
  range; its JSON and statically extracted export equal the final REC B.1 official context as parsed objects, not
  as bytes. This supports the observed identifier/field correspondence, not JSON-LD expansion/compaction/canonicalization
  or complete conformance. Node>=18 and BSD-3-Clause are package/license declarations, not tested runtime compatibility
  or legal audit. Runtime ranges ^3.2.0, jsonld^9.0.0 and jsonld-signatures^11.6.0 do not prove installed versions;
  npm archive bytes were not acquired. Callers retain complete normative property/cardinality/context validation,
  time policy, securing, status and trust responsibilities. Fixed README VC1 examples and JSDoc claiming missing
  credentials throw are stale relative to the optional current branch, not evidence for broader coverage. Static
  source and test-definition inspection only: no upstream installation/execution/testing, key generation, credential
  signing/verification or identity/status lookup; no complete conformance, security certification, legal validity,
  production readiness, third-party interoperability or IA adoption claim.'
