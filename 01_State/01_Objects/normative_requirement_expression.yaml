id: normative_requirement_expression
type: capability
name_zh: 规范性要求表达
name_en: Normative Requirement Expression
description_zh: 使用具有约定强度和解释规则的规范性关键词表达实现要求、禁止项、建议项与可选项，使规范作者、实现者和测试者对要求等级形成一致理解。
description_en: Express implementation requirements, prohibitions, recommendations, and options using normative keywords with agreed strength and interpretation rules so specification authors, implementers, and testers share the same understanding of requirement levels.
category: govern
layers: [semantics, social_institutional]
domains: [standardization, specification_authoring, requirements, interoperability]
