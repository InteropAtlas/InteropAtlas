name_zh: PyLD Python JSON-LD 处理库
name_en: PyLD Python JSON-LD processor
description_zh: Python 的开源 JSON-LD 处理器；本记录固定到3.3.0，记录链接数据的JSON表示处理及图/数据集与RDF表示转换先例。
description_en: An open-source Python JSON-LD processor, pinned here to 3.3.0 as a precedent for processing JSON
  Linked Data and converting graph/dataset representations to and from RDF.
