scope_notes_zh: 主体为软件库，不是 JSON Schema 规范或 JSON Schema Project。format 校验默认不启用，需显式 FormatChecker，部分格式还依赖额外组件；regex/pattern
  使用 Python 正则而非 ECMA 262 方言。不把发布者支持说明或有限本地示例当作完整符合性、宿主协议互通、性能优势、最新发行版或 IA 采用该精确版本的证明。 若某格式所需可选依赖缺失，即使传入检查器，该格式的验证也可能不报错通过。
scope_notes_en: The subject is the library, not the JSON Schema specification or JSON Schema Project. Format checks
  require an explicit FormatChecker and some need optional dependencies; regex/pattern use Python regular expressions
  rather than ECMA 262. Publisher support statements and limited local examples do not certify complete conformance,
  host-protocol interoperability, superior performance, latest-release status or IA adoption of this exact version.
  A format with missing required optional dependencies can pass without an error even when a checker is supplied.
