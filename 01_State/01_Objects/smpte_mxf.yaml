scope_notes_zh: 保留 ST 377-1 的既有 work-level 标识，本文固定 2019 版（2019-11-28 批准）。描述依据封面身份和 §§6.3–6.3.9 的已核验 KLV 条款，不把其他
  MXF 规范、操作模式、素材容器映射、编码器或解码器当作同一主体。官方 187 页 PDF 的第 8 页 Scope 存在 /StrikeOut 批注（元数据日期 2020-01-28），其权威性及含义未知；不将被划线文字重现为干净规范内容，不推断勘误、撤销或批注无害。原始
  PDF 字节/批注保留，封面只有链接批注，引用页 9 和操作页 30/32/33 没有批注。仅据这些未受该批注覆盖的证据记录文件中的 KLV 依赖：可选 Run-In 除外，数据连续按 KLV 编码；ST 336 的一般能力须受
  MXF 的长度、键、集合/包及递归限制约束。独立复核必须明确接受此有限证据选择。没有实施文件解析、编解码或符合性测试，不保证完整标准符合性、任意 KLV/MXF 兼容、codec/profile/软件支持、安全、认证或
  IA 采用。
scope_notes_en: 'Preserves the existing ST 377-1 work-level identifier while fixing this review to the 2019 edition,
  approved 2019-11-28. The description rests on cover identity and verified KLV provisions in §§6.3–6.3.9, not on
  other MXF specifications, operational patterns, essence-container mappings or implementations. The official 187-page
  PDF contains a /StrikeOut annotation over page 8 Scope, with metadata dated 2020-01-28; its authority and meaning
  are unknown. Struck-through text is not presented as clean normative content, nor is an erratum, withdrawal or
  harmless markup inferred. Original bytes and annotations are preserved. The cover has link annotations only; reference
  page 9 and operative pages 30/32/33 have no annotations. Only this unaffected evidence supports the bounded KLV
  dependency: contiguous KLV data except optional Run-In, subject to MXF-specific length, key, set/pack and recursion
  constraints. Independent review must explicitly accept this evidence choice. No file parsing, codec or conformance
  testing; no full-standard conformance, arbitrary KLV/MXF compatibility, codec/profile/software support, security,
  certification or IA-adoption claim.'
