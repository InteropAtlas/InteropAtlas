name_en: SMPTE ST 377-1 — Material Exchange Format (MXF) — File Format Specification
description_zh: MXF 文件格式标准；本记录固定 ST 377-1:2019，仅据已核验的未受 Scope 批注覆盖的条款描述其 KLV 编码依赖。
description_en: The MXF file-format standard, reviewed at ST 377-1:2019; only verified provisions unaffected by
  the Scope annotation support the bounded KLV dependency described here.
