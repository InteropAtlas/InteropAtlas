description_zh: Kotlin 事件表示库；固定官方源码发布 0.2.0，静态核对 v1.0 事件上下文、非冲突扩展与 JSON 单事件/批量读写。需调用方提供有效字段；构造/编码不自动验证。不是完整 CloudEvents
  1.0.2 符合性、Maven 二进制、运行测试、网络绑定或投递保证。
description_en: 'Kotlin event representation SDK at official source release 0.2.0: static correspondence for v1.0
  context, non-colliding extensions and single-event/batch JSON codecs. Callers supply valid fields; construction/encoding
  does not automatically validate. Not full CloudEvents 1.0.2 conformance, a verified Maven binary, runtime test,
  network binding or delivery guarantee.'
