description_zh: OpenAPI Initiative 于 2026-09-10 发布的固定 3.2.1 规范文献，为 HTTP API 定义语言无关的描述结构，包括路径、操作、参数和内容表示；不是运行中的 API、验证器或客户端/服务端实现。
description_en: The fixed OpenAPI Initiative specification document 3.2.1, published on 2026-09-10, defining language-independent
  HTTP API description structures including paths, operations, parameters and content representations; not a running
  API, validator or client/server implementation.
