id: ffmpeg
type: system
kind: software
name_zh: FFmpeg 多媒体软件发行体
name_en: FFmpeg multimedia software distribution
description_zh: 包含用于处理音视频、字幕及相关元数据的库和工具的软件发行体；本记录固定 9.0.2，记录其原生软件 FFV1 编解码，以及 HLS 播放列表读取与未加密 MPEG-TS 片段解复用路由的有界实现证据。
  另记录在所列条件下，未加密大端 DPX 2.0 单元素 10-bit RGB method-A、encoding=0 的软件解码静态源码对应；未编译运行，不代表完整/核心符合性、写入或时间码支持。
description_en: A distribution of libraries and tools for processing audio, video, subtitles and related metadata;
  pinned to 9.0.2 here, with bounded evidence for native software FFV1 encoding/decoding and HLS playlist reading
  with unencrypted MPEG-TS segment demux routing. Also records static-source correspondence for software decoding
  of unencrypted big-endian DPX 2.0 with one 10-bit RGB method-A element and encoding 0, under the stated conditions.
  Not built or run; no full/core conformance, writing or timecode-support claim.
