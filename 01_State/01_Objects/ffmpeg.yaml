scope_notes_zh: 主体是整个软件发行体，不是社区、单一 CLI、FFV1 规范或另立的 libavcodec 对象。官方镜像的注释标签 n9.0.2（tag object ce8f11b9fac4cd7ccfb41ca7c01bc17f5cda8cc3）指向
  commit 946fcce07b6dcd0331c8cc609192aeff5e1924f8，RELEASE 为 9.0.2；不声称最新版本。FFV1 部分仅从固定公开源码检视原生 libavcodec FFV1 软件编码器和解码器，关系限定于
  RFC 9043 的版本 0、1、3 及受支持像素格式/配置；v3 编码设置 micro-version 4，排除实验性 2/4、Vulkan 与其他硬件路径。编译选项可禁用组件，原生 FFV1 选择内部 rangecoder，不等于整个发行体无外部依赖。固定
  LICENSE.md 说明主要为 LGPL-2.1-or-later，启用可选 GPL、version3 或外部库可能改变生成二进制的许可；不为所有构建赋予无条件统一许可，不作法律适用性意见。未安装、构建或运行 FFmpeg/FATE；上游测试配方仅作源码证据，不是执行通过。未验证全部
  RFC 特性、安全、任意安装包、第三方互通或 IA 采用；不把 FFV1 的无损编码属性扩展成所有 FFmpeg 像素、色彩、元数据或容器转换均无损。 2026-10-24 的局部补充仅检视同一固定版本的 libavformat
  HLS 播放列表读取及未加密 MPEG-TS 片段解复用路由；hls.c 明示 RFC 8216。EXT-X-VERSION 被跳过，非完整版本兼容性验证；不支持动态变体/质量切换，rendition 路径不支持 CLOSED-CAPTIONS。组件、协议/TLS、IO
  与子解复用器可用性等条件适用。排除加密/DRM、复用/片段生成、fMP4/CMAF、LL-HLS 和完整客户端/服务器符合性。此补充不刷新整条记录的 last_verified_at，不构成上游执行、网络互通或安全验证。
  2026-10-29 的局部补充：固定9.0.2原生libavcodec dpx软件解码路径，与ST 268-1:2014所述DPX 2.0头布局和样本打包的有界静态对应，不是上游对2014全文符合性的声明。只限格式有效、未加密、大端SDPX/V2.0、orientation=0、一个unsigned
  RGB元素(descriptor=50)、10-bit、packing=1(method A)、encoding=0；全局与首元素数据偏移一致且至少2048，行紧排为4×width字节且无额外行/图像padding，电影/电视帧率和电视timecode为未定义值。调用方提供完整文件AVPacket，尺寸及缓冲区通过库约束，组件已启用并选择软件AV_PIX_FMT_GBRP10路径。代码从32位字依次取RGB，写入GBR平面；不承诺颜色解释/变换或其他元数据保真。仅检视固定源码，未编译、运行或测试FFmpeg/FATE、媒体和第三方互通。不是完整/核心符合性验证器：多元素、其他方向/符号/位深/packing、RLE、加密、额外padding、色度/ADX、时间码、Vulkan、序列输入或写入均不纳入。编码器写V1.0，不能沿此证据声称DPX
  2.0写入。 本补充不刷新全记录 last_verified_at，不将排除范围误写为其他实现路径不存在。
scope_notes_en: 'The subject is the software distribution, not its community, the CLI alone, the FFV1 specification
  or a separately created libavcodec object. Official-mirror annotated tag n9.0.2 (tag object ce8f11b9fac4cd7ccfb41ca7c01bc17f5cda8cc3)
  points to commit 946fcce07b6dcd0331c8cc609192aeff5e1924f8; RELEASE states 9.0.2. No latest-release claim is made.
  The FFV1 fixed-source inspection covers only native libavcodec FFV1 software encoding/decoding of supported RFC
  9043 version 0/1/3 configurations; v3 encoding sets micro-version 4. Experimental versions 2/4, Vulkan and other
  hardware paths are excluded. Build options can disable components. Native FFV1 selects the internal range coder,
  which does not make the entire distribution dependency-free. The fixed LICENSE.md describes principally LGPL-2.1-or-later
  licensing; optional GPL/version3 components and external libraries can change resulting binary terms. No unconditional
  license expression for every build or legal-suitability opinion is supplied. FFmpeg and FATE were not installed,
  built or run; upstream test recipes are source evidence, not passing execution results. No exhaustive RFC conformance,
  security, arbitrary installed-build availability, third-party interoperability or IA adoption was verified. FFV1
  lossless coding does not establish lossless preservation of pixels, color, metadata or containers in all FFmpeg
  conversions. The partial 2026-10-24 supplement inspects the same fixed release’s libavformat HLS playlist reading
  and unencrypted MPEG-TS segment demux routing; hls.c explicitly cites RFC 8216. EXT-X-VERSION is skipped, not
  completely validated for version compatibility. Dynamic variant/quality switching is unsupported, and the rendition
  path does not support CLOSED-CAPTIONS. Component, protocol/TLS, IO and subdemuxer availability constraints apply.
  Encryption/DRM, muxing/segment generation, fMP4/CMAF, LL-HLS and full client/server conformance are excluded.
  This supplement does not refresh the full-record last_verified_at or establish upstream execution, network interoperability
  or security verification. Partial supplement on 2026-10-29: Bounded static correspondence of the fixed 9.0.2 native
  libavcodec dpx software decoder to ST 268-1:2014 DPX 2.0 header/sample layout, not an upstream declaration of
  full 2014 conformance. Only well-formed, unencrypted, big-endian SDPX/V2.0, orientation 0, one unsigned RGB element
  (descriptor 50), 10-bit, packing 1 (method A), encoding 0; equal global/first-element data offsets at least 2048,
  tightly packed rows of 4*width bytes with no additional line/image padding, and undefined film/TV frame-rate and
  TV timecode fields. Caller supplies a complete-file AVPacket, dimensions/buffers meet library constraints, the
  decoder is enabled and software AV_PIX_FMT_GBRP10 is selected. Code extracts RGB from each 32-bit word into GBR
  planes; color interpretation/transformation and other metadata preservation are not claimed. Fixed-source inspection
  only: no FFmpeg/FATE build, media execution or third-party interoperation. Not a full/core-conformance validator.
  Multiple elements, other orientations/signs/depths/packing, RLE, encryption, extra padding, colorimetry/ADX, timecode,
  Vulkan, sequence input and writing are excluded. The encoder emits V1.0, not evidence for DPX 2.0 writing. This
  supplement does not refresh the full-record last_verified_at; exclusions are not claims that other implementation
  paths are absent.'
