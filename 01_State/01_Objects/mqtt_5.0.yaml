kind: protocol
name_zh: MQTT 5.0 发布订阅消息协议
name_en: MQTT Version 5.0
description_zh: 定义客户端与服务器之间采用发布订阅模式的消息协议。 本记录相接的 Mosquitto 2.1.2 先例仅限已有 active MQTT5 会话中的 SUBSCRIBE 处理、条件性订阅登记和
  SUBACK 构造/入队；不是连接建立、送达或完整协议/安全/互通证明。源码未运行，ACL/插件/配置/资源条件及属性处理边界适用。
description_en: Defines a client-server messaging protocol using the publish/subscribe pattern. The linked Mosquitto
  2.1.2 precedent is limited to SUBSCRIBE handling, conditional subscription registration and SUBACK construction/queueing
  in an already-active MQTT5 session, not connection establishment, delivery or full protocol/security/interoperability
  evidence. Sources were not run; ACL/plugin/configuration/resource conditions and property-handling boundaries
  apply.
