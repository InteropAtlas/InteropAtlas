name_zh: SMPTE ST 268-1 数字运动图像交换（DPX）文件格式
name_en: SMPTE ST 268-1 — File Format for Digital Moving-Picture Exchange (DPX)
version: '2014'
external_identifiers:
- namespace: smpte
  value: st.268
official_url: https://pub.smpte.org/latest/st268-1/st0268-1-2014_stable2015.pdf
description_zh: 定义DPX 2.0栅格图像交换文件格式；单个文件表示一幅图像。
description_en: Defines the DPX 2.0 raster-image interchange file format; each file represents one image.
scope_notes_zh: 保留既有 smpte_st268_dpx / smpte:st.268 工作级身份，固定审阅 2014-11-01 批准的 DPX 标准。所读官方 PDF 含 2015-01-15 的 Table
  5B 纠正；封面说明 2017-05-22 将 ST 268:2014 重编号为 ST 268-1:2014 且内容未变，不能把这一说明泛化为所有版次等同。物理第 1 页的 Stable 封页表明仍有效、未弃用或撤销，但并非现行技术推荐、最新版本或不可修订。§1
  定义 DPX 2.0 栅格图像交换文件，每个文件是一幅图像，可含最多八个图像元素；不定义输入/输出设备或显示器特性。审阅限于身份、范围及非核心电视头字段 58/59 的时间码/用户位表示，不穷尽审计像素打包、色度、ADX
  或其他字段。未知的非核心字段值按 §4.3 填未定义值，核心读取器无须读取非核心字段；不声称每个 DPX 文件都有有效时间码或携带 LTC/VITC 信号。本批不收入 ST 268-2 扩展，也不把旧版规范引用接到现有不同版次对象。未执行图像解析器、编码器或媒体应用，不证明软件支持、完整符合性、设备认证、互通、部署或
  IA 采用。版本指定 PDF 的捕获哈希限定此次证据，不保证 latest 路径永久指向相同字节。
scope_notes_en: 'Preserves the work-level smpte_st268_dpx / smpte:st.268 identity, reviewing the DPX standard approved
  2014-11-01. The official PDF includes the 2015-01-15 Table 5B correction; its cover records the 2017-05-22 renumbering
  of ST 268:2014 to ST 268-1:2014 with unchanged content, not equivalence of all editions. Its physical-page-1 Stable
  notice says it remains in force rather than deprecated or withdrawn, not that it represents current technology,
  is latest, or cannot be revised. Section 1 defines DPX 2.0 raster-image exchange: each file is one image with
  up to eight image elements, excluding input/output-device and display characteristics. Review is bounded to identity,
  scope and non-core television-header fields 58/59 for time-code/user-bit representation, not exhaustive pixel-packing,
  colorimetry, ADX or other-field review. Section 4.3 requires undefined values for unknown non-core fields; core
  readers need not read those fields. Not every DPX file therefore has valid time code, nor does this establish
  LTC/VITC signal carriage. ST 268-2 extensions and links from older references to different accepted editions are
  excluded. No parser, encoder or media application ran; software support, full conformance, certification, interoperability,
  deployment and IA adoption are not established. Captured PDF hashes bound this evidence, not permanent bytes at
  the latest path.'
