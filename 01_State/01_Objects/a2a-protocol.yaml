summary_zh: "A2A 是面向独立 Agent 之间互操作的开放协议规范。其 Task 模型分离任务 id、contextId、status、history、artifacts 与 metadata，并明确瞬时 Message/History 不应被假定为关键结果的可靠持久层。InteropAtlas 将其作为任务连续性、Agent-to-Agent 交接和‘重要状态必须落到持久 Artifact’原则的上游先例。A2A 是项目治理的协议规范，不应误称为 ISO/W3C 国际标准。"
summary_en: "A2A is an open protocol specification for interoperability among independent agents. Its Task model separates task identity, contextId, status, history, artifacts and metadata, and its specification warns against relying on transient messages as the only durable delivery mechanism for critical information. InteropAtlas uses it as an upstream precedent for task continuity, agent handoff and durable artifacts."
