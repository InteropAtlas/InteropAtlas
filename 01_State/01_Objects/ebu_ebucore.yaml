name_zh: EBU Tech 3293 EBU核心元数据集（EBUCore）
name_en: EBU Tech 3293 — EBU Core Metadata Set (EBUCore)
description_zh: EBU发布的视听内容元数据规范，基于Dublin Core提供描述性及技术/结构元数据，用于广播资源的管理、交换和保存；本历史记录固定到v1.10（2020年4月）。
description_en: EBU metadata specification extending Dublin Core with descriptive and technical/structural
  metadata for audiovisual content, supporting the management, exchange and preservation of broadcasting
  resources; this historical record is pinned to v1.10 (April 2020).
