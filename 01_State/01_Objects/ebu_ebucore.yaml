scope_notes_zh: ebu:tech.3293保留为Tech 3293出版物的标识，本记录固定到v1.10。EBU Tech 3397 v2（2025年4月）的Scope明确取代Tech 3293，并声明该版本不向后兼容。EBUCore与EBUCorePlus保持独立身份；本记录不表示Tech
  3293仍是现行规范，不包含实现符合性或迁移结论。
scope_notes_en: ebu:tech.3293 remains the identifier for the Tech 3293 publication, pinned here to v1.10.
  The Scope of EBU Tech 3397 v2 (April 2025) explicitly replaces Tech 3293 and states that the new version
  is not backward compatible. EBUCore and EBUCorePlus retain distinct identities; this record does not
  present Tech 3293 as current or assert implementation conformance or migration conclusions.
