description_zh: 在Python datetime与时间戳字符串之间解析、生成和转换的库；固定2.1.1，记录日期时间表达先例及严格语法、精度和偏移信息保留的边界。
description_en: A library for parsing, generating and converting timestamps with Python datetime objects; pinned
  to 2.1.1 as a date/time representation precedent with explicit syntax, precision and offset-preservation limits.
