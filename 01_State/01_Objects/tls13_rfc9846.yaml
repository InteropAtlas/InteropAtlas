id: tls13_rfc9846
type: artifact
kind: protocol
name_zh: TLS 1.3 修订规范文档（RFC 9846，2026年7月）
name_en: TLS 1.3 Revised Specification Document (RFC 9846, July 2026)
official_name: The Transport Layer Security (TLS) Protocol Version 1.3
description_zh: 2026年7月发布的 IETF 流 TLS 1.3 修订规范文档，规定握手与记录协议；在 RFC 文献层面取代 RFC 8446，同时保留 TLS 1.3 协议版本号。不是 TLS 1.4，也不表示任何实现或部署已符合修订要求或安全。
description_en: The July 2026 IETF-stream revised TLS 1.3 specification document, defining handshake and record
  protocols. It obsoletes RFC 8446 at the RFC-document level while retaining the TLS 1.3 version number. It is not
  TLS 1.4 or evidence that implementations or deployments satisfy revised requirements or are secure.
