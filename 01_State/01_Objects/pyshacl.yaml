id: pyshacl
type: system
kind: library
name_zh: pySHACL Python RDF 图约束验证库
name_en: pySHACL Python RDF graph validation library
description_zh: Python 的 SHACL 验证库；本记录固定到 0.40.1，通过 validate 接口按 shapes 图检查 RDF 数据图并返回符合性结果与报告。
description_en: A Python SHACL validation library, pinned here to 0.40.1; its validate interface checks RDF data
  graphs against shapes graphs and returns a conformance result and report.
version: 0.40.1
external_identifiers:
- namespace: github
  value: RDFLib/pySHACL
official_url: https://github.com/RDFLib/pySHACL
