id: cmark
type: system
kind: library
name_zh: cmark CommonMark C 解析与渲染库
name_en: cmark CommonMark C parsing and rendering library
description_zh: 官方 cmark C 解析/渲染库及命令行程序，固定 0.31.2，将 CommonMark 文档语法连接到结构化 AST 和 HTML 片段输出。本地自定义静态构建在显式 --unsafe
  下逐字节通过公开的 CommonMark 0.31.2 全部 652 个示例，并通过 35 项有限诊断（1 项 CLI 版本核对与 34 项行为观察）；这不是完整上游套件或任意输入的符合性证明。核心 CommonMark
  不包含 GFM 表格、任务列表复选框、删除线或裸 URL 自动链接。HTML 输出默认省略原始 HTML 并过滤部分 URL scheme；--unsafe 会放行，旧 --safe 是空操作，不能撤销 --unsafe。此
  HTML 渲染器专用策略不是清理器或安全保证。未启用 --validate-utf8 时非法字节可能原样输出；该选项替换非法序列，而非拒绝输入。CommonMark 重新渲染会改变原标记形式，并可能保留原始 HTML。源码/blob
  及本地二进制哈希不证明官方发行构建、可复现构建、签名/证明验证或供应链认证。
description_en: The official cmark C parser/rendering library and CLI, fixed to 0.31.2, connects CommonMark document
  syntax to structural AST and HTML-fragment output. A custom local static build passed the 652 published CommonMark
  0.31.2 examples byte-for-byte with explicit --unsafe and 35 finite diagnostic checks (one CLI version check and
  34 behavior observations); this is not the full upstream suite or all-input conformance. Core CommonMark is not
  GFM tables, task-list checkboxes, strikethrough or bare-URL autolinking. HTML output omits raw HTML and filters
  some URL schemes by default; --unsafe permits them, while legacy --safe is a no-op and cannot revoke --unsafe.
  This HTML-renderer-specific policy is not a sanitizer or security guarantee. Without --validate-utf8 an invalid
  byte can pass through; that option replaces invalid sequences, not rejects them. CommonMark re-rendering changes
  original markup and can preserve raw HTML. Source/blob and local binary hashes do not establish an official distribution
  build, reproducible build, signature/attestation verification or supply-chain certification.
