scope_notes_en: Fixed to the 4.3.2 Python XSD validation/encoding/decoding library, using elementpath and Python
  XML facilities. Upstream declares XSD 1.0/1.1; XMLSchema defaults to XMLSchema10, while XMLSchema11 requires explicit
  selection. Strict is default; lax retains errors and may substitute None, while top-level skip decoding can retain
  invalid lexical text without reporting errors, not successful validation. Resource defaults are allow=all and
  defuse=remote, not offline operation or entity prevention for every input. Trusted-memory tests explicitly use
  allow=none and defuse=always; bundled trusted meta-schemas are read normally, with no external-resource or entity-attack
  assessment. Instance schemaLocation hints are ignored by default; an empty path selection can pass vacuously unless
  allow_empty=False is requested. Twenty-five observations distinguish instance violations, XML parse exceptions
  and schema-construction exceptions. A Decimal value survives the tested conversion, but decoding the encoded Element
  changes namespace keys and dictionary shape, not a general lossless round trip. Bundled XSD_1.0/XMLSchema.xsd
  labels itself non-normative and points to a March 2004 PER; neither that copy nor the general support claim alone
  proves full conformance to the precise October 2004 documents, so no implements edge is added. XSD 1.1 execution,
  a full W3C suite, UBL/business rules, third-party interoperability, production security and IA adoption are not
  established.
