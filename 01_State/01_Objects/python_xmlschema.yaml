  XMLSchema10，XMLSchema11 需显式选择。默认 strict；lax 保留错误并可能将不可解码值置 None，skip 顶层解码可保留非法词法文本而不报告错误，不等于验证通过。资源默认 allow=all、defuse=remote，不是默认离线或所有输入均禁实体；本轮可信内存输入显式
  allow=none、defuse=always，正常读取随包可信元模式，未测实体攻击或外部资源。默认忽略实例 schemaLocation；path 空选择默认可空泛通过，allow_empty=False 可要求报错。25例观察区分实例不符合、XML解析异常和模式构造异常；Decimal
  示例保持该值，但将编码后的 Element 再解码会改变命名空间键和字典形状，不作通用无损往返保证。随包 XSD_1.0/XMLSchema.xsd 自述非规范且文档指向2004-03 PER，不能仅凭元模式复制或总体支持声明推出2004-10精确规范全符合；本批不建
