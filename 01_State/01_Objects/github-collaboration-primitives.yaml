lessons_zh:
  - "Issue、Sub-issue 与 Dependency 可以组成公开任务图，而无需另建 Agent-only 任务数据库。"
  - "PR、Review、CODEOWNERS 与 Rulesets 可以把执行、审核、所有权路由和合并授权分离。"
  - "InteropAtlas 的租约式认领应优先 Profile 这些平台原语，只对真实缺口增加 Lease automation。"
lessons_en:
  - "Issues, sub-issues, and dependencies can form a public task graph without a separate agent-only task database."
  - "Pull requests, reviews, CODEOWNERS, and rulesets separate execution, review, ownership routing, and merge authorization."
  - "InteropAtlas should profile these platform primitives first and add lease automation only for demonstrated gaps."
