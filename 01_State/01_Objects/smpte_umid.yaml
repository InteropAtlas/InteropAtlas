id: smpte_umid
type: artifact
kind: standard
name_zh: SMPTE ST 330 唯一素材标识符（UMID）
name_en: SMPTE ST 330 — Unique Material Identifier (UMID)
description_zh: 规定视听素材实例 UMID 标识结构的标准；本次固定 ST 330:2011，区分 Basic 与 Extended 形式，不把素材标识等同于作品、权利或可信来源证明。
description_en: A standard defining UMID structures for audiovisual-material instances; reviewed at ST 330:2011,
  distinguishing Basic and Extended forms without treating material identity as proof of works, rights or trustworthy
  provenance.
version: '2011'
external_identifiers:
