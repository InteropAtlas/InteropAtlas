id: node_wot
type: system
kind: software
name_zh: Eclipse Thingweb node-wot 软件框架
name_en: Eclipse Thingweb node-wot framework
description_zh: 用于以 Node.js/TypeScript 构建 Web of Things 客户端与服务端的软件框架，以事物描述（TD）连接应用与设备接口；本记录固定到 0.9.2。
description_en: A Node.js/TypeScript framework for Web of Things clients and servers, using Thing Descriptions to
  connect applications and device interfaces; pinned here to release 0.9.2.
version: 0.9.2
external_identifiers:
- namespace: github
  value: eclipse-thingweb/node-wot
