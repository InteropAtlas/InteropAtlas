name_zh: SMPTE ST 2084 高动态范围母版制作参考显示器电光传递函数（PQ）
name_en: SMPTE ST 2084 — High Dynamic Range Electro-Optical Transfer Function of Mastering Reference Displays (PQ)
description_zh: 规定高动态范围参考显示器 EOTF 及其推导逆函数的标准；固定 ST 2084:2014（2017 再确认），保留来源系数标签不一致，不构成完整 HDR 系统或实现符合性声明。
description_en: A standard specifying a high-dynamic-range reference-display EOTF and its derived inverse; fixed
  to ST 2084:2014 (reaffirmed 2017), retaining a source coefficient-label inconsistency rather than claiming a complete
  HDR system or implementation conformance.
