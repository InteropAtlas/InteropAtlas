  final 200 responses. The caller must first establish the correct request method and legal event order in the state
  machine. Connection.receive_data only buffers bytes and returns None, not events; next_event parses one event
  and changes state, or returns NEED_DATA / PAUSED. The fixed README event-return summary and api.rst closing-section
