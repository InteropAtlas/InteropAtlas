  guarantee; the application retains I/O, backpressure and resource-limit duties. A next_event parsing or state-processing
  exception sets their_state to ERROR and later next_event calls keep failing, without rollback or recovery through
  start_next_cycle. start_next_cycle resets both sides to IDLE only when both are DONE. An early call raises LocalProtocolError
  without itself damaging the connection and may be retried when ready. Connection: close and other states prevent
  reuse; indefinite reuse is not promised. HEAD, CONNECT, Upgrade, informational responses, other status codes,
  HTTP/1.0 compatibility, complete header/extension/trailer conformance and send-side encoding acceptance are outside
  this slice. The whole library contains no I/O. Real networking, sockets/TLS/DNS, a complete client/server, routing,
