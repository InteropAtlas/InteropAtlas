lessons_zh:
  - "Material Design 3 是 Google 的开放设计系统，不是国际标准；它把视觉语言、组件、状态、Motion、自适应布局和设计令牌组织成相对工程化的体系。"
  - "Material 的长期核心思路包括通过排版、网格、空间、尺度、颜色和图像建立层级、意义与焦点，并用 Motion 提供反馈和连续性。"
  - "Material 3 强调 adaptive / responsive design；导航和布局可以随窗口尺寸与设备形态在 navigation bar、rail、drawer 或多栏布局之间变化。"
  - "M3 2026 的 Expressive 方向进一步强化 emotion-driven UX、adaptive components、flexible typography、contrasting shapes 与 motion physics，但 IA 应把这些视为可评估的产品设计方法，而不是必须照搬的品牌美学。"
  - "Material 的 token 化和组件状态体系对 IA 建立机器可读 Visual System、跨亮暗主题和未来多前端实现尤其有参考价值。"
lessons_en:
  - "Material Design 3 is Google's open design system, not an international standard. It organizes visual language, components, states, motion, adaptive layout, and design tokens into an implementation-oriented system."
  - "Material uses typography, grids, space, scale, color, and imagery to establish hierarchy, meaning, and focus, while motion provides feedback and continuity."
  - "Material 3 emphasizes adaptive and responsive design, allowing navigation and layout patterns to change across window sizes and form factors."
  - "The 2026 M3 Expressive direction adds emotion-driven UX, adaptive components, flexible typography, contrasting shapes, and motion physics; IA should treat these as product-design prior art rather than mandatory brand aesthetics."
  - "Material's token and component-state architecture is particularly relevant to IA's machine-readable visual system and multi-theme/multi-frontend future."
