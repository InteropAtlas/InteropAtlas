scope_notes_zh: 独立于第 2 部分数据类型的固定文档主体，第二版汇入更正而非新版本，不以后来版次替代。第 2.1 节的评估包含局部验证、后代结果与信息集扩充；模式构造错误与实例验证结果在第 5 节分开。既有
  schema_validation 能力仅指这些规范化约束，不表示某个验证器、完整 UBL 符合性或具体业务规则已经通过。
scope_notes_en: 'A fixed document distinct from Part 2: Datatypes; the second edition incorporates corrections rather
  than introducing a new version and is not replaced here by a later edition. Section 2.1 assessment combines local
  validation, descendant outcomes and infoset augmentation. Section 5 distinguishes schema-construction errors from
  instance-validation outcomes. The existing schema_validation capability refers only to these specified constraints,
  not a tested validator, complete UBL conformance or business-rule compliance.'
