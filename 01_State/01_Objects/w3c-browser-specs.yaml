lessons_zh:
  - "把规范目录建成机器可读的独立数据合同，同时保留稳定标识、版本系列、组织、来源和测试仓库等元数据。"
  - "Data、Schema、生成逻辑和测试可以在同一仓库共同演化，并通过发布包和生成索引向外提供稳定消费界面。"
  - "适合作为 InteropAtlas Canonical Data + Schema + Tooling + Test 分层单仓的成熟先例。"
lessons_en:
  - "Models a curated specification catalog as machine-readable data with identifiers, series, organizations, provenance, and test metadata."
  - "Shows that data, schemas, generation logic, and tests can co-evolve in one repository while published packages and generated indexes serve consumers."
  - "A mature precedent for InteropAtlas' layered monorepo approach to canonical data, contracts, tooling, and tests."
