summary_zh: "指导软件控制的视觉信息呈现，包括信息组织与视觉编码，并考虑人的感知和记忆能力；可用于设计规范和启发式评价。它不覆盖具体图表或信息可视化细节。"
summary_en: "Provides guidance for software-controlled visual presentation of information, including organization and visual coding while accounting for human perception and memory; it can support design specifications and heuristic evaluation, but does not cover detailed chart or information-visualization techniques."
