id: opc_ua_family
type: artifact
kind: specification
name_zh: OPC UA 多部分规范系列
name_en: OPC UA — multi-part specification family
description_zh: OPC Foundation 的 OPC Unified Architecture 多部分规范系列（OPC 10000 系列）的家族级记录，组织信息模型、服务、映射与配置等架构内容；各部分及其发布版本保持独立身份，不是具有单一统一版本的规范文件。
description_en: A family-level record for the OPC Foundation OPC Unified Architecture multi-part specification series
  (OPC 10000), organizing architectural material including information models, services, mappings and profiles.
  Individual parts and releases retain distinct identities; this is not one document with one uniform version.
external_identifiers:
- namespace: opc
  value: ua-family
official_url: https://reference.opcfoundation.org/
scope_notes_zh: 原有 opc:ua-family 是 IA 遗留构造的家族级标记，保留原字节用于连续识别；未发现 OPC Foundation 正式分配该字串为规范编号的证据。官方 Part 1 的系列结构说明确认
  OPC UA 是多部分系列，称各部分为 OPC 10000-n；整个 reference.opcfoundation.org 目录还含其他编号的 Companion Specifications，不能将其全部等同本家族。本次选读
  OPC 10000-1 v1.05.06（2025-10-22）§1 与 §3，只支持总体范围和分部分结构，不代表其他部分全文已审。官方目录中 Part 4 为 1.05.07、Part 7 为 1.05.02，故不把
  1.05 或任何 patch 版赋给全套；模型命名空间版本、NodeSet／Schema 包标签与各 part 文献版本也不能互换。官方网页说明下载的官方版本在与在线参考冲突时优先；本次未取得并逐字核对该下载版。没有将
  OPC 10000 与 IEC 62541、某一 Companion Specification、Profile、SDK 或产品作身份合并或等价声明，也未建立 parts／implements／uses 等关系，不证明完整协议实现、互通、认证或安全性。
scope_notes_en: 'The unchanged opc:ua-family value is an IA legacy constructed family-level marker, not a demonstrated
  OPC Foundation-assigned specification number. Part 1 identifies a multi-part OPC 10000 series; the broader reference
  directory also includes separately numbered companion specifications and is not coextensive with this subject.
  Sections 1 and 3 of OPC 10000-1 v1.05.06 (2025-10-22) support the inspected scope and series structure, not inspection
  of every part. Published part releases differ: for example Part 4 is 1.05.07 and Part 7 is 1.05.02. No uniform
  family version is assigned; document versions, namespace-model versions and supplementary package tags are distinct.
  The reference site states that its official downloadable specification prevails in case of differences; that download
  was not obtained and compared. No identity equivalence with IEC 62541, companion specifications, profiles, SDKs
  or products, or technical relations, conformance, interoperability, certification or security results are asserted.'
