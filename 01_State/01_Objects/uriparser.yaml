  percent encoding under RFC3986 sections 2.1/2.3, with caller responsibilities constrained by sections 2.2/2.4.
  Positive scope is the char API on an ASCII-compatible platform, bytes 0x01..0x7F, with both spaceToPlus and normalizeBreaks
  set to URI_FALSE. The caller supplies a valid readable range [inFirst,inAfterLast) with ordered pointers into
  the same object; if inAfterLast is NULL, input must be a valid NUL-terminated string. Output must be a disjoint
  writable buffer with valid lifetime and capacity at least 3 × n + 1, where n is the input-range length or characters
  before NUL, using overflow-safe capacity arithmetic. The API has no output-capacity argument and performs no capacity
  check. It rejects equal starting input/output pointers only, not general overlap. Processing stops at the explicit
