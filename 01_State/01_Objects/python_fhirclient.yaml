scope_notes_zh: 固定4.4.0。上游是含SMART/FHIR网络客户端与生成数据模型的Python库；此前运行观察只核模型的Python对象/JSON字典映射，不执行网络或鉴权。README版本表列出4.2.0对应FHIR4.0.1，当前固定Patient/Observation等源码标头明确生成自FHIR
  4.0.1-9346c8cc45，不能仅由客户端4.x推断FHIR版次。模型构造默认strict=True；局部类型、声明必填字段和未知键检查可抛FHIRValidationError，strict=False构造捕获该类错误、记warning并可留下部分已赋值数据，但不吞掉前置resourceType不匹配异常，后续as_json仍可能报错。省略resourceType可由输出补入，null可选字段和空可选列表会被省略。不是完整FHIR验证：术语代码、choice排他性和后续primitive列表项类型等不被全面检查；_birthDate这类primitive元数据虽被识别却不保留于输出，不能无损往返。FHIRDate.as_json保持未修改的原始部分日期字符串，而date/isostring转为补齐后的Python视图；修改date会清除原词法值。Quantity.value模型使用float并接受int，不接受Decimal对象，不保证任意精度或小数词法精度保留。21项可信合成内存观察仅覆盖有限模型与上述行为；未测全资源/Profile/不变量、术语服务、远程引用、SMART/OAuth、FHIR服务器、临床适用性、安全/隐私合规、第三方互通或IA采用。另于2026-10-31只读核查同一4.4.0固定提交的源码：read以resource_type/id构造路径，经read_from调用server.request_json；request_json经_get拼接base_uri与路径并调用session.get、检查状态、解码JSON，返回值用于cls模型构造并设置origin_server。仅确认此源码调用链存在，未执行该链或重跑旧21项观察，不证明响应符合FHIR、实际HTTP交换、SMART鉴权、服务器兼容、内容协商、完整REST方法或安全性。
scope_notes_en: 'Fixed to 4.4.0. Upstream combines a SMART/FHIR network client and generated Python data models;
  the prior runtime observations check only Python-object/JSON-dictionary mapping, without network or authorization operations. The
  README version table maps client 4.2.0 to FHIR 4.0.1, while the fixed Patient/Observation and related source headers
  explicitly identify generation from FHIR 4.0.1-9346c8cc45; client 4.x alone is not version evidence. Constructors
  default to strict=True. Local type, declared-required-field and unknown-key checks can raise FHIRValidationError.
  A strict=False constructor catches that error class, warns and can retain partially assigned data, but does not
  swallow the preceding resourceType-mismatch exception; later as_json can still fail. Output can fill an omitted
  resourceType and omit null optional fields or empty optional lists. This is not complete FHIR validation: terminology
  codes, choice exclusivity and later primitive-list element types are not comprehensively checked. Primitive metadata
  such as _birthDate is recognized but not retained in output, so round trips are not lossless. FHIRDate.as_json
  preserves the unmodified original partial-date string, while date/isostring expose a completed Python view; assigning
  date clears the original lexical value. Quantity.value is modeled as float and also accepts int, not Decimal objects;
  arbitrary precision and lexical decimal scale are not guaranteed. Twenty-one trusted synthetic-memory observations
  cover only selected models and these behaviors. Full resources/profiles/invariants, terminology services, remote
  references, SMART/OAuth, FHIR servers, clinical suitability, security/privacy compliance, third-party interoperability
  and IA adoption were not established. Separately, on 2026-10-31 a read-only inspection of the same fixed 4.4.0 commit identifies read building a resource_type/id path and read_from calling server.request_json; request_json uses _get to join base_uri with the path, call session.get, check status and decode JSON, then the returned value feeds cls model construction with origin_server set. This establishes only the source-code call chain, which was not executed; the prior 21 observations were not rerun. It does not establish FHIR-valid responses, actual HTTP exchange, SMART authorization, server compatibility, content negotiation, complete REST methods or security.'
