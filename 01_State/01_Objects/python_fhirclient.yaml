id: python_fhirclient
type: system
kind: library
name_zh: fhirclient Python FHIR模型与客户端库
name_en: fhirclient Python FHIR model and client library
description_zh: >-
  含FHIR生成模型和SMART/FHIR客户端的开源Python库，固定4.4.0。既有21项可信合成内存观察仅覆盖FHIR 4.0.1的有限模型表示及局部校验、有损映射限制；另以固定源码只读确认read → GET → JSON → 模型构造路径。后者未经执行，不证明HTTP请求、SMART鉴权、FHIR服务器兼容或远程互通成功；既有implements关系仍仅覆盖模型切片。

  An open-source Python library with generated FHIR models and a SMART/FHIR client, pinned to 4.4.0. The existing 21 trusted synthetic in-memory observations cover only a bounded FHIR 4.0.1 model-representation path with partial-validation and lossy-mapping limits. A separate read-only inspection identifies the fixed read → GET → JSON → model-construction code path. That path was not executed and does not establish successful HTTP exchange, SMART authorization, FHIR-server compatibility or remote interoperability; the existing implements relation remains limited to the model slice.
description_en: >-
  An open-source Python library with generated FHIR models and a SMART/FHIR client, pinned to 4.4.0. The existing 21 trusted synthetic in-memory observations cover only a bounded FHIR 4.0.1 model-representation path with partial-validation and lossy-mapping limits. A separate read-only inspection identifies the fixed read → GET → JSON → model-construction code path. That path was not executed and does not establish successful HTTP exchange, SMART authorization, FHIR-server compatibility or remote interoperability; the existing implements relation remains limited to the model slice.
