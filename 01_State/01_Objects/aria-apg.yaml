lessons_zh:
  - "把常见可访问组件拆成设计模式、键盘交互、ARIA roles/states/properties 与可运行示例，适合作为 IA 组件交互规范的直接 Prior Art。"
  - "优先使用原生 HTML 语义；只有原生语义不足时才使用 ARIA，并完整实现对应的键盘与状态合同。"
  - "Breadcrumb、Disclosure、Tabs、Tree View 等组件不应由 IA 自行发明基础交互语义，应先检查 APG 是否已有成熟 Pattern。"
lessons_en:
  - "Breaks accessible widgets into design patterns, keyboard interaction, ARIA roles/states/properties, and functional examples, making it direct prior art for IA component interaction specifications."
  - "Prefer native HTML semantics; use ARIA only when native semantics are insufficient and implement the corresponding keyboard and state contracts completely."
  - "IA should check APG patterns before inventing base interaction semantics for components such as Breadcrumb, Disclosure, Tabs, and Tree View."
