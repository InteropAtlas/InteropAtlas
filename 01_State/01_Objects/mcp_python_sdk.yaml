name_zh: MCP Python 客户端与服务端开发库
name_en: MCP Python client and server SDK
description_zh: 用于构建模型上下文协议客户端与服务端的 Python SDK，提供资源、工具、提示和会话接口；本记录固定到 1.26.0。
description_en: A Python SDK for building Model Context Protocol clients and servers, with resource, tool, prompt
  and session interfaces; pinned here to release 1.26.0.
version: 1.26.0
