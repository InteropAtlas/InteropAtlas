scope_notes_zh: 主体是软件库，不是协议规范或已部署 Agent 产品。固定源码的最新协议常量为 2025-11-25，支持列表另含 2024-11-05、2025-03-26、2025-06-18；连接仍需初始化版本与能力协商。README
  描述 stdio、SSE 与 Streamable HTTP 接口，这不是本轮对全部传输的互通验证。Tasks 在该版文档中明确为实验功能，跟踪草案，API 可不经通知变化；不把它提升为稳定承诺。包元数据要求 Python
  >=3.10。本轮只核客户端/服务端会话及工具、资源、提示实现证据；不证明所有可选能力、授权部署、安全性、完整符合性、跨实现互通或最新发行版地位，不据此推荐生产部署。未推断 self_hostable，也不新增或强配能力概念。
scope_notes_en: The subject is a software library, not the protocol specification or a deployed Agent product. The
  fixed source sets its latest protocol constant to 2025-11-25 and also lists 2024-11-05, 2025-03-26 and 2025-06-18;
  connections still require initialization and version/capability negotiation. README documents stdio, SSE and Streamable
  HTTP interfaces, which is not a verification of all transports in this slice. Its Tasks documentation explicitly
  labels the feature experimental, tracking the draft specification, with APIs subject to change without notice;
  no stable commitment is inferred. Package metadata requires Python >=3.10. This slice verifies evidence for client/server
  sessions and tools, resources and prompts, not every optional capability, authorized deployment, security, full
  conformance, cross-implementation interoperability or latest-release status. It is not a production recommendation.
  self_hostable is not inferred, and no capability concept is invented or forced onto the library.
