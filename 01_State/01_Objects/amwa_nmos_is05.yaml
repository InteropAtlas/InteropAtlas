id: amwa_nmos_is05
type: artifact
kind: specification
name_zh: AMWA IS-05 NMOS 设备连接管理规范
name_en: AMWA IS-05 NMOS Device Connection Management Specification
official_name: AMWA IS-05 NMOS Device Connection Management Specification
description_zh: AMWA 发布的 NMOS 设备连接管理规范，主体是 IS-05 工作级规范而非单一发布版。本轮以固定 v1.2.0 文献核验：Connection API 管理逻辑 Sender 与 Receiver
  的连接参数，区分约束、暂存配置与生效配置，提供单项和批量操作，以及立即或定时生效机制；规范包含 RAML、JSON Schema 及补充规范性正文。这些是该固定文献的要求与描述，不是任何设备或软件已实现、符合或互通的证据。
description_en: The work-level AMWA IS-05 specification for NMOS device connection management, not one individual
  release. In the fixed v1.2.0 documentation reviewed here, the Connection API manages connection parameters for
  logical Senders and Receivers, distinguishes constraints, staged settings and active settings, and provides single
  and bulk operations with immediate or scheduled activation. The specification includes RAML, JSON Schema and additional
  normative prose. These are requirements and descriptions in that release, not evidence of implementation, conformance
  or interoperability by any device or software.
