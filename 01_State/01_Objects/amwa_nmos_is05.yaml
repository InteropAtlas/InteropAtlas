scope_notes_zh: 保留既有 amwa_nmos_is05 / amwa:is-05 工作级身份及官方工作入口，不把它改为 v1.2.0 版次身份。官方 spec.yml 将 IS-05 与多个发布版分别列出；versions
  只列本轮实读的发布文献，不是完整版本史，也不表示各版语义相同。正文技术描述限于官方 tag v1.2.0 对应 commit 354c183f7f36554412f69c4a7152fec672a21e01 的 Overview
  与 APIs；文献发布版 1.2.0 与接口路径中的 v<MAJOR>.<MINOR> 是不同层次。该版允许通过独立 Transports register 扩展传输类型，不能把某次注册表状态或任意设备支持当作整个工作级规范的固定事实。未穷尽审查所有传输映射、API
  条款或跨版本组合；不作 ST 2110 媒体传输、实现符合性、部署、安全性或 IA 采用判断，未执行 API、设备或软件测试。与 IS-04 的共同使用有版本及行为条件，本轮不接纳该关系，也不将旧提案自动重定向或升级为兼容性保证。
scope_notes_en: Preserves the existing work-level identity amwa_nmos_is05 / amwa:is-05 and its official work entry
  point; it does not relabel that identity as edition v1.2.0. The official spec.yml lists IS-05 separately from
  its releases. The versions array records only the publication inspected here, not a complete version history or
  semantic equivalence across editions. Technical descriptions are limited to Overview and APIs at official v1.2.0
  tag commit 354c183f7f36554412f69c4a7152fec672a21e01. Publication version 1.2.0 is distinct from the v<MAJOR>.<MINOR>
  interface-path version. This edition permits transport extensions through a separate Transports register; a register
  snapshot or arbitrary device support is not an invariant of the whole work. Not all transport mappings, API clauses
  or cross-version combinations were reviewed. No ST 2110 media transport, implementation conformance, deployment,
  security or IA-adoption claim is made, and no API, device or software test was run. Joint use with IS-04 has version
  and behaviour conditions. This intake accepts no such relation and does not automatically retarget the old proposal
  or turn it into an interoperability guarantee.
