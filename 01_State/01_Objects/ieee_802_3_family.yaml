name_zh: IEEE 802.3 以太网标准家族
name_en: IEEE 802.3 — Ethernet standards family
description_zh: IEEE 802.3 以太网标准的工作／家族级记录，涉及有线以太网的介质访问控制（MAC）及物理层规范，由 IEEE 802.3 以太网工作组维护；不指某一整合版、修订件或更正文本。
description_en: A work/family-level record for the IEEE 802.3 Ethernet standards, covering wired Ethernet MAC and
  physical-layer specifications maintained by the IEEE 802.3 Ethernet Working Group; not a particular consolidated
  edition, amendment or correction text.
external_identifiers:
- namespace: ieee
  value: 802.3-family
official_url: https://www.ieee802.org/3/
scope_notes_zh: 原有 ieee:802.3-family 是 IA 遗留构造的家族级标记，保留原字节用于连续识别；未发现 IEEE 将该字串正式分配为标准编号的证据，不把它说成发布者标识。本对象不是工作组组织，也不代表整个
  IEEE 802 家族。官方工作组及历史目录区分整合修订版、amendment 与维护更正；年度出版物、修订件、corrigendum 和 errata 不能互换。IEEE 802.3.1、802.3.2 等另有编号的文件也不因来自同一工作组而变成
  IEEE 802.3 的同一出版物。本记录不设全家族统一版本、发布日期或规范状态，不列全体成员，不将拟议 P 项目称为已发布标准。核验范围仅为官方家族说明、工作组入口及历史目录，未审读全部标准正文或核对完整更正清单；不证明实现符合性、特定设备互通、专利许可或任意固定版的当前完整性。
scope_notes_en: The unchanged ieee:802.3-family value is an IA legacy constructed family-level marker, not a demonstrated
  IEEE-assigned standard number. This subject is neither the working-group organization nor the entire IEEE 802
  family. The official working-group entry and archive distinguish consolidated revisions, amendments and maintenance
  corrections; editions, amendments, corrigenda and errata are not interchangeable. Separately numbered 802.3.1
  and 802.3.2 documents are not the same IEEE 802.3 publication merely because the working group maintains them.
  No uniform family version, publication date, publication status or exhaustive member list is asserted; proposed
  P projects do not become published standards through directory inclusion. Inspection covers official family descriptions,
  the working-group entry and archive only, not every standard text or a complete corrections inventory, implementation
  conformance, device interoperability, patent licensing or completeness of a fixed edition.
