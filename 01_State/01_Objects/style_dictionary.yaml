  value token未出现在输出，不能承诺混合格式保留。number类型配非数字字符串也可继续处理，成功不证明类型符合。固定内置转换支持本例的duration毫秒/秒转换和$root命名；CSS默认输出解析后的值，outputReferences=true可保留CSS变量引用，不保证任意输出格式无损往返。缺失/循环引用在本例明确brokenReferences=throw时抛错，当前源码默认亦为throw；值转换异常时wrapper读取传入token当前的value/$value字段作为fallback并汇总错误；未保存调用前快照，不保证恢复转换调用已修改的值，warnings=error才将该类汇总变为异常，日志设置/输出成功不能替代输入验证。19项可信合成例仅使用内存token、显式普通对象配置、空source/include与内置转换/格式化，一个CSS文件写入新临时目录；未加载用户配置或外部扩展，未测ZIP、全部平台输出、真实视觉/UI、任意输入安全、全DTCG符合性、第三方互通或IA采用。16份固定源指纹、12份安装文件逐字一致，以及仅VERSION占位符按官方发布脚本替换的一个文件分别留痕；npm
  tarball integrity核对不等于签名/证明或完整依赖供应链审计。Apache-2.0按官方包元数据与LICENSE记录，不作为法律适用性意见。
scope_notes_en: Pinned to npm style-dictionary 5.7.0 and official tag v5.7.0 at commit 745264a62d01037581c6654fb4ac66bb3d245f07.
  This design-token build tool requires Node.js >=22 and offers a CLI and programmatic API; it uses the existing
  system/software identity, not a new tool kind. Fixed documentation explicitly says DTCG2025.10 is not fully supported.
  This slice records the existing design_token_exchange capability and processing precedent without an implements
  relation. detectDtcgSyntax only looks for $value/$type keys, not valid structure or values. convertToDTCG clones
  input and renames value/type/description keys, optionally hoisting a common $type to groups by default; applyTypesToGroup=false
  keeps per-token types. It does not translate legacy type names such as size into DTCG types or provide complete
  migration/validation. Runtime group types can be delegated to tokens with child overrides. In the tested mixed
  legacy/DTCG input, automatic DTCG selection left legacy value tokens out of the output; mixed-format preservation
  is not promised. A number token with a nonnumeric string can also continue processing, so success does not prove
  type validity. Built-in transforms handle the tested duration milliseconds/seconds and $root names. CSS defaults
  to resolved values, while outputReferences=true can preserve CSS variable references; arbitrary-format lossless
  round trips are not established. Missing/circular references throw with the probe’s explicit brokenReferences=throw
  setting, also the current source default. On a value-transform exception, the wrapper reads the passed token's
  current value/$value field as fallback and collects diagnostics; no pre-call snapshot is saved and values mutated
  by the transform are not guaranteed to be restored; warnings=error makes that class of collected error throw.
  Logging/output success is not input validation. Nineteen trusted synthetic examples use only inline tokens, explicit
  plain-object config, empty source/include and built-in transforms/formats, writing one CSS file to a fresh temporary
  directory. User config, external extensions, ZIP, every platform output, actual visual/UI behavior, arbitrary-input
  safety, full DTCG conformance, third-party interoperability and IA adoption were not tested. Sixteen fixed source
  fingerprints, twelve byte-identical installed files and one documented release-script VERSION substitution are
  recorded separately. npm tarball integrity matching is not a signature/attestation or whole-dependency supply-chain
  audit. Apache-2.0 is recorded from official package metadata and LICENSE, not as a legal-suitability opinion.
