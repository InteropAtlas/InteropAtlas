description_zh: 提供编辑时间线内存数据模型、操作及序列化功能的 C++ 核心库、官方 Python 绑定和随发行体提供的工具；固定 0.18.1，官方发行页标为 Beta 18.1 / Pre-release。
description_en: The C++ core library, official Python binding and bundled tools for editorial timeline data-model
  manipulation and serialization. Pinned to 0.18.1, officially labeled Beta 18.1 / Pre-release.
scope_notes_zh: 主体是软件发行体，固定官方 v0.18.1 → commit 44236713c1db295a6ffc66189ae98dbdfd0cb9c4；release 于 2025-11-09 发布且
  prerelease=true，不把 README 对 API 稳定性的表述升级为稳定发行认证。数据模型记录剪辑顺序、时长和外部媒体引用；它本身不是媒体容器。v0.16 之后的 PyPI 主包只含核心库和原生格式；外部
  EDL/AAF/FCPXML 等适配器已移到独立仓库/Plugins 包，不视为本记录固定发行的全部内置能力。固定版本中的 File Format Specification 仍标注描述 Beta 13 的 DRAFT，且明确无顶层文件格式版本，各类型由
  OTIO_SCHEMA 单独版本化；0.18.1 不能作为格式统一版号。仅核软件身份和文档边界，未安装、构建、运行、校验实际序列化结果、读取媒体或测试适配器；不保证往返无损、外部资源可用、所有适配器特性支持、安全、符合性、性能、跨应用互通或
  IA 采用。旧 aswf_otio 保持 identity_risk，不将其改为本软件对象，不添加 implements 或其他技术边。
scope_notes_en: A software distribution fixed to official tag v0.18.1 and commit 44236713c1db295a6ffc66189ae98dbdfd0cb9c4.
  The release was published 2025-11-09 with prerelease=true; the documented stable API is not a stable-release designation.
  Its model represents editorial timing and external media references, not media essence. After v0.16, separately
  distributed adapter plugins are not all included in the core package. The pinned format document remains a Beta-13
  draft and specifies per-type OTIO_SCHEMA versions, not a top-level format version. No installation, build, execution,
  media access, serialization validation or adapter tests were performed. No universal lossless interchange, media
  availability, complete feature support, conformance, safety, performance or adoption claim is made. The legacy
  aswf_otio identity remains unresolved; no technical edges are proposed.
