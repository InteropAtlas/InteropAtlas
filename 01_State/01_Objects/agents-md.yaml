  - "Supports nested AGENTS.md files so large monorepos can provide scoped agent instructions."
  - "Adopted across many agent tools and open-source repositories and stewarded by the Linux Foundation's Agentic AI Foundation, making it a mature precedent for cross-agent repository instructions."
