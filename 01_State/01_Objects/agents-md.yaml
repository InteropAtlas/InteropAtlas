lessons_zh:
  - "为不同 Coding Agent 提供一个可预测的仓库级指令入口，同时保持 README 面向人类和项目说明的职责。"
  - "支持嵌套 AGENTS.md，使大型仓库可以按目录范围覆盖更具体的 Agent 指令；更深目录的指令可以覆盖更宽范围规则。"
  - "根 AGENTS.md 更适合作为短小的 Bootstrap / Router，保存 Agent 无法从通用知识推断的项目约束，并把详细上下文导向其他 Repository Artifacts。"
  - "已被 Codex、GitHub Copilot 等多个 Agent 工具支持，并由 Linux Foundation 的 Agentic AI Foundation 托管，适合作为 InteropAtlas 跨 Agent 仓库指令的主要成熟先例。"
lessons_en:
  - "Provides a predictable repository-level instruction entry point across coding agents while keeping README focused on project and human-facing documentation."
  - "Supports nested AGENTS.md files so large repositories can provide scoped instructions with more specific rules closer to the edited files."
  - "The root file is best used as a compact bootstrap/router for project-specific constraints and links into durable repository context."
  - "Supported by multiple agent tools including Codex and GitHub Copilot and stewarded by the Linux Foundation's Agentic AI Foundation."
