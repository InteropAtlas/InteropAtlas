scope_notes_zh: 版次固定为 UBL 2.3 明确引用的 2000 第二版；文档说明该版汇入勘误而非新的 XML 版本，不代表现行 XML 全族。第 2.1/2.8/5.1 节区分良构、基于 DTD 的有效性和验证/非验证处理器；这些不是
  XSD 验证或业务符合性。第 4.3.3 节要求 XML 处理器支持 UTF-8 和 UTF-16，不意味着所有 XML 必须采用 UTF-8；未核任何处理库、外部实体加载策略或部署安全。
scope_notes_en: Fixed to the 2000 second edition explicitly cited by UBL 2.3; it incorporates errata rather than
  defining a new XML version and does not represent the current XML family. Sections 2.1/2.8/5.1 distinguish well-formedness,
  DTD validity and validating/non-validating processors, not XSD validation or business conformance. Section 4.3.3
  requires processor support for UTF-8 and UTF-16, not exclusive UTF-8 use. No library, external-entity loading
  policy or deployment security is assessed.
