name_en: ETSI EN 300 743 — Digital Video Broadcasting (DVB); Subtitling systems
description_zh: 规定在DVB码流中编码和传送字幕、标志及其他图形元素的方法，使用颜色查找表并以MPEG-2传输流承载；本记录固定到 V1.6.1（2018-10）。
description_en: Specifies how subtitles, logos and other graphics are encoded and carried in DVB bitstreams, using
  colour lookup tables and MPEG-2 Transport Stream carriage; pinned to V1.6.1 (2018-10).
