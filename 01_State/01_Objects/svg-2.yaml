summary_zh: W3C SVG 2 规范定义二维矢量及混合矢量/栅格图形的特性和语法，可独立显示或嵌入 HTML，并支持样式和脚本交互。当前应明确记录其规范状态，而不是把 SVG 2 简化为已经完成的 Recommendation。
summary_en: The W3C SVG 2 specification defines features and syntax for two-dimensional vector and mixed vector/raster graphics, usable standalone or embedded in HTML with styling and scripting. Its current specification status should be recorded explicitly rather than treating SVG 2 as a completed Recommendation.
