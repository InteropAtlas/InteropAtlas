scope_notes_zh: 这是历史 Informational 文档，不是 IETF 标准轨或现行 JSON 定义；RFC Editor 标为已被 RFC 7159 废止。第 2 节 JSON text 顶层限对象或数组，不把后来允许任意
  JSON 值作顶层的规则写回本版。第 3/6 节描述 Unicode 编码、UTF-8 默认及 UTF-16/32；第 4 节允许解析器扩展与实现限制，第 5 节要求生成文本严格遵循语法。保留历史引用不代表推荐旧版、接受旧安全建议、与
  RFC 8259 完全等价或实现互通；本轮不建立替代/更新语义边。
scope_notes_en: A historical Informational document, not an IETF Standards Track RFC or the current JSON definition;
  RFC Editor lists it as obsoleted by RFC 7159. Section 2 restricts a top-level JSON text to an object or array;
  later allowance for any JSON value is not backported here. Sections 3/6 describe Unicode encoding, UTF-8 by default
  and UTF-16/32; section 4 allows parser extensions and implementation limits, while section 5 requires generated
  text to follow the grammar strictly. Preserving a historical citation does not recommend the old version or its
  security advice, assert full equivalence to RFC 8259 or implementation interoperability. No update/obsolescence
  relation is introduced in this slice.
