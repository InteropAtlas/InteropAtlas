id: w3c_webrtc
type: artifact
kind: specification
name_zh: WebRTC 浏览器实时通信规范
name_en: 'WebRTC: Real-Time Communication in Browsers'
description_zh: 定义一组基于 WebIDL 的 ECMAScript API，使媒体与通用应用数据可在实现相应实时协议的浏览器或设备之间发送与接收。
description_en: Defines WebIDL-based ECMAScript APIs for sending and receiving media and generic application data between browsers or devices implementing the appropriate real-time protocols.
version: '2025-03-13'
external_identifiers: [{namespace: w3c, value: webrtc}]
official_url: https://www.w3.org/TR/webrtc/
versions: [{version: '2025-03-13', status: recommendation, url: 'https://www.w3.org/TR/2025/REC-webrtc-20250313/'}]
scope_notes_zh: 保留工作级 /TR/webrtc/ 入口，以 2025-03-13 Recommendation 支持当前最小定义；不把 IETF RTCWEB 协议族、媒体采集 API 或任意浏览器实现合并为同一主体。
scope_notes_en: Retains the work-level /TR/webrtc/ entry and uses the 2025-03-13 Recommendation for the current minimum definition; IETF RTCWEB protocols, media-capture APIs and browser implementations remain distinct subjects.
