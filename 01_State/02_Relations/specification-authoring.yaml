  conditions_zh: 限定为在采用 BCP 14 约定的规范文本中表达要求等级；特殊含义仅适用于全部大写的关键词，普通大小写用法保留通常英语含义。规范性文本不必使用这些关键词，不能仅据大小写判断整段文本是否规范性。SHOULD
    允许在理解并权衡完整影响后有理由地偏离，不能等同 MUST；RFC 2119 还要求谨慎、节制地使用这些词。此边不证明具体规范、实现或测试符合要求，也不重新核验原对象的 IA 采用声明。
  conditions_en: Limited to expressing requirement levels in specifications using the BCP 14 convention. The
    special meanings apply only to all-uppercase keywords; other capitalization retains ordinary English meaning.
    Normative text need not use these keywords, so capitalization alone does not determine whether text is
    normative. SHOULD permits justified departures after understanding and weighing the implications, rather
    than meaning MUST; RFC 2119 also calls for careful, sparing use. This edge does not prove specification,
    implementation or test conformance, or reverify the existing object's IA-adoption statement.
