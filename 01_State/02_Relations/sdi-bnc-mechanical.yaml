id: smpte_st292_uses_iec_61169_8_2007_annex_a
type: relation
name_zh: ST 292-1 使用 IEC 61169-8 附录 A 定义所需 75 Ω BNC 接口
name_en: ST 292-1 uses IEC 61169-8 Annex A for its required 75 Ω BNC interface
source: smpte_st292
relation: uses
target: iec_61169_8_2007
context:
  version_context:
    source: SMPTE ST 292-1:2018
    target: IEC 61169-8:2007, Edition 1.0, normative Annex A (75 Ω interface dimensions)
  conditions_zh: 第 8.2.1 节（第 8 页）要求公母连接器采用附录 A 定义的 75 Ω BNC；本边仅记录该接口机械依据。第 8.2.2–3 节的电缆响应及终接线路回波损耗要求仍独立适用，不指定某种电缆不等于任意电缆可用。不把
    50 Ω 标题当作 75 Ω SDI 条件，也不证明跨速率、任意线缆、距离、载荷或设备互通。
  conditions_en: Clause 8.2.1 (page 8) requires male and female 75 Ω BNC connectors defined by Annex A; this edge
    records that mechanical-interface basis only. Cable-response and terminated-line return-loss requirements in
    8.2.2–3 still apply; absence of a named cable type does not permit arbitrary cables. The 50 Ω title does not
    establish 75 Ω SDI suitability. No cross-rate, arbitrary-cable, distance, payload or device interoperability
    is asserted.
