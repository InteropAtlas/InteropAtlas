id: smpte_st424_uses_iec_61169_8_2007_annex_a
type: relation
name_zh: ST 424 使用 IEC 61169-8 附录 A 作为优选 75 Ω BNC 的机械依据
name_en: ST 424 uses IEC 61169-8 Annex A for preferred 75 Ω BNC mechanics
source: smpte_st424
relation: uses
target: iec_61169_8_2007
context:
  version_context:
    source: SMPTE ST 424:2012
    target: IEC 61169-8:2007, Edition 1.0, normative Annex A (75 Ω interface dimensions)
  conditions_zh: 第 7.3.1–2 节（第 8 页）将附录 A 用作优选 75 Ω BNC 的机械依据；超过 3 GHz 可用性及 3 GHz 回波损耗条件来自 ST 424，不能由机械吻合推出。满足相应电气条件的应用专用替代连接器获准使用，不主张所有实现必须选用
    BNC。不把 50 Ω 标题当作 75 Ω SDI 条件，也不证明跨速率、任意线缆、距离、载荷或设备互通。
  conditions_en: Clauses 7.3.1–2 (page 8) use Annex A for preferred 75 Ω BNC mechanics. Usability above 3 GHz and
    the 3 GHz return-loss requirement come from ST 424, not mechanical fit alone. Electrically qualified application-specific
    alternatives are permitted; BNC is not asserted to be the only connector allowed. The 50 Ω title does not establish
    75 Ω SDI suitability. No cross-rate, arbitrary-cable, distance, payload or device interoperability is asserted.
