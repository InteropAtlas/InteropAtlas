id: smpte_st2082_uses_iec_61169_8_2007_annex_a
type: relation
name_zh: ST 2082-1 使用 IEC 61169-8 附录 A 作为优选 75 Ω BNC 的机械依据
name_en: ST 2082-1 uses IEC 61169-8 Annex A for preferred 75 Ω BNC mechanics
source: smpte_st2082
relation: uses
target: iec_61169_8_2007
context:
  version_context:
    source: SMPTE ST 2082-1:2023
    target: IEC 61169-8:2007, Edition 1.0, normative Annex A (75 Ω interface dimensions)
  conditions_zh: 第 7.1 节（第 11 页）仅以 IEC 引用提供优选 75 Ω BNC 的机械接口尺寸；超过 12 GHz 可用性、12 GHz 回波损耗及以第 7.2 节电缆损耗为参照的插入损耗条件来自
    ST 2082-1。满足本标准电气要求的应用专用替代连接器获准使用，不主张 BNC 是唯一选择。不把 50 Ω 标题当作 75 Ω SDI 条件，也不证明跨速率、任意线缆、距离、载荷或设备互通。
  conditions_en: Clause 7.1 (page 11) cites IEC for preferred 75 Ω BNC mechanical dimensions only. Usability above
    12 GHz, 12 GHz return loss and cable-referenced insertion loss under 7.2 remain ST 2082-1 requirements. Electrically
    compliant application-specific alternatives are permitted; BNC is not asserted to be the only choice. The 50
    Ω title does not establish 75 Ω SDI suitability. No cross-rate, arbitrary-cable, distance, payload or device
    interoperability is asserted.
