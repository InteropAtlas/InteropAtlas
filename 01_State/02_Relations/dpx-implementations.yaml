id: ffmpeg_implements_smpte_st268_dpx
type: relation
name_zh: FFmpeg 9.0.2有界实现DPX 2.0的10-bit RGB method-A软件解码
name_en: FFmpeg 9.0.2 implements bounded DPX 2.0 10-bit RGB method-A software decoding
source: ffmpeg
relation: implements
target: smpte_st268_dpx
context:
  version_context:
    source: FFmpeg 9.0.2, annotated tag n9.0.2, commit 946fcce07b6dcd0331c8cc609192aeff5e1924f8; native libavcodec
      dpx software decoder
    target: SMPTE ST 268-1:2014, same 2015-corrected/2017-renumbered official PDF already accepted; DPX 2.0 subset
      only
  conditions_zh: 固定9.0.2原生libavcodec dpx软件解码路径，与ST 268-1:2014所述DPX 2.0头布局和样本打包的有界静态对应，不是上游对2014全文符合性的声明。只限格式有效、未加密、大端SDPX/V2.0、orientation=0、一个unsigned
    RGB元素(descriptor=50)、10-bit、packing=1(method A)、encoding=0；全局与首元素数据偏移一致且至少2048，行紧排为4×width字节且无额外行/图像padding，电影/电视帧率和电视timecode为未定义值。调用方提供完整文件AVPacket，尺寸及缓冲区通过库约束，组件已启用并选择软件AV_PIX_FMT_GBRP10路径。代码从32位字依次取RGB，写入GBR平面；不承诺颜色解释/变换或其他元数据保真。仅检视固定源码，未编译、运行或测试FFmpeg/FATE、媒体和第三方互通。不是完整/核心符合性验证器：多元素、其他方向/符号/位深/packing、RLE、加密、额外padding、色度/ADX、时间码、Vulkan、序列输入或写入均不纳入。编码器写V1.0，不能沿此证据声称DPX
    2.0写入。
  conditions_en: 'Bounded static correspondence of the fixed 9.0.2 native libavcodec dpx software decoder to ST
    268-1:2014 DPX 2.0 header/sample layout, not an upstream declaration of full 2014 conformance. Only well-formed,
    unencrypted, big-endian SDPX/V2.0, orientation 0, one unsigned RGB element (descriptor 50), 10-bit, packing
    1 (method A), encoding 0; equal global/first-element data offsets at least 2048, tightly packed rows of 4*width
    bytes with no additional line/image padding, and undefined film/TV frame-rate and TV timecode fields. Caller
    supplies a complete-file AVPacket, dimensions/buffers meet library constraints, the decoder is enabled and software
    AV_PIX_FMT_GBRP10 is selected. Code extracts RGB from each 32-bit word into GBR planes; color interpretation/transformation
    and other metadata preservation are not claimed. Fixed-source inspection only: no FFmpeg/FATE build, media execution
    or third-party interoperation. Not a full/core-conformance validator. Multiple elements, other orientations/signs/depths/packing,
    RLE, encryption, extra padding, colorimetry/ADX, timecode, Vulkan, sequence input and writing are excluded.
    The encoder emits V1.0, not evidence for DPX 2.0 writing.'
