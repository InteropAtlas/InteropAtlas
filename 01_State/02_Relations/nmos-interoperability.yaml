  conditions_zh: '仅记录固定 IS-05 v1.2.0 的 Interoperability: IS-04 章节所述配合使用设计与有条件建议：Connection API 与 IS-04 共享数据模型，设计为配合使用；当二者共同部署时，IS-04
    APIs SHOULD 运行在 1.3 或更高版本。这里的 1.3 是 API 版本要求，不是 IS-04 发布版 1.3.3 的精确引用。共同使用还受该章行为条款约束，包括控制端点发现、Sender/Receiver
    UUID 一致、修改生效参数或重新激活时递增相应 IS-04 资源的 version，以及用 master_enable 与 sender_id/receiver_id 填充 subscription。该章对 subscription
    行为的链接明确指向 IS-04 v1.3.2 Behaviour: Nodes，不改写为 v1.3.3，也不表示两版行为等同。本文献建议不是必须共同部署的要求，不证明任意设备实现、跨版本组合或实际部署已互通；1.3
    或更高的文字不是对未来版本兼容性的独立保证。旧 Node API /target 方法被取代，不等于整个 IS-04 被 IS-05 取代。本关系不作完整符合性、互操作认证、安全性或 IA 采用结论，未运行设备、API
    或软件测试。'
  conditions_en: 'Records only the co-use design and conditional recommendation in the fixed IS-05 v1.2.0 Interoperability:
    IS-04 chapter: the Connection API shares a data model with IS-04 and is designed to be used alongside it; when
    co-deployed, the IS-04 APIs SHOULD operate at version 1.3 or greater. This is an API-version recommendation,
    not an exact citation of IS-04 publication v1.3.3. Joint use remains subject to the chapter''s behaviour requirements,
    including control-endpoint discovery, matching Sender/Receiver UUIDs, incrementing the corresponding IS-04 resource
    version when active parameters change or are re-activated, and populating subscription using master_enable and
    sender_id/receiver_id. The chapter''s subscription-behaviour link explicitly names IS-04 v1.3.2 Behaviour: Nodes;
    it is not rewritten as v1.3.3 and does not establish equivalence between those editions. The documentation does
    not require joint deployment or prove interoperability of arbitrary implementations, version combinations or
    deployments; its phrase 1.3 or greater is not an independent guarantee of future-version compatibility. Supersession
    of the legacy Node API /target method does not mean IS-05 supersedes IS-04 as a whole. No complete conformance,
    interoperability certification, security or IA-adoption claim is made, and no device, API or software tests
    were run.'
