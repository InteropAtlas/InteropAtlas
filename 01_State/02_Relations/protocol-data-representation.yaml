id: wot_td_1.1_uses_json_ld
type: relation
name_zh: WoT 事物描述 1.1 使用 JSON-LD 1.1 语法
name_en: WoT Thing Description 1.1 uses JSON-LD 1.1 syntax
source: wot_td_1.1
relation: uses
target: json_ld_1.1
context:
  version_context:
    source: WoT Thing Description 1.1, W3C Recommendation 2023-12-05
    target: JSON-LD 1.1, W3C Recommendation 2020-07-16
  conditions_zh: 仅表述固定事物描述 1.1 的 JSON 表示与 JSON-LD 1.1 语法对齐，以支持上下文扩展和语义处理；第 6 节允许按原始 JSON 或用 JSON-LD 1.1 处理器处理，不要求每个实现执行 JSON-LD
    展开或远程上下文获取。该关系不推定设备互通、安全性或 IA 已采用 JSON-LD。
  conditions_en: Limited to the fixed TD 1.1 JSON representation using JSON-LD 1.1 syntax for context extensions and semantic
    processing. Section 6 permits raw JSON or JSON-LD 1.1 processing; this does not require every implementation to expand
    JSON-LD or fetch remote contexts, certify interoperability/security, or assert IA adoption.
