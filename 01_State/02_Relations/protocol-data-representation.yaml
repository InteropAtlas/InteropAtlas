id: cloudevents_1.0.2_uses_json
type: relation
name_zh: CloudEvents 1.0.2 使用 RFC 8259 JSON 事件格式
name_en: CloudEvents 1.0.2 uses the RFC 8259 JSON event format
source: cloudevents_1.0.2
relation: uses
target: json_rfc8259
context:
  version_context:
    source: CloudEvents Core and JSON Event Format 1.0.2
    target: RFC 8259
  conditions_zh: 仅表述核心规范要求实现支持的 1.0.2 JSON 事件格式使用 RFC 8259 表示事件。不是每次传输或 data 载荷都必须为 JSON；该格式允许二进制 data 通过 data_base64 封装，其他事件格式和协议绑定仍各自适用。不把核心类型系统中的历史
    RFC 7159 引用重写为 RFC 8259。
  conditions_en: 'Limited to the JSON Event Format 1.0.2 that core implementations must support, using RFC 8259 to represent
    events. Not every transfer or data payload must be JSON: binary data can use data_base64, and other formats/bindings remain
    separate. This does not rewrite the core type system historical RFC 7159 reference.'
evidence:
