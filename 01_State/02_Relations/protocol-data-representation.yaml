id: agntcy_oasf_1_0_0_uses_rfc3339
type: relation
name_zh: OASF 1.0.0 记录的必需 created_at 属性要求 RFC3339 时间戳
name_en: OASF 1.0.0 requires RFC3339 timestamps for record.created_at
source: agntcy_oasf_1_0_0
relation: uses
target: rfc3339
context:
  version_context:
    source: OASF 1.0.0 record/schema at commit 1d2eed1089e39a37678c4a1d9773ff618279d897
    target: RFC 3339, July 2002
  conditions_zh: 仅表述固定 record.json 中必需 created_at 属性的 RFC3339 MUST 文字要求，不是实现符合性保证。datetime_t 正则允许省略时区后缀，且不足以验证日历/数值范围；其
    T/t 分隔符与空格示例有差异，RFC3339 §5.6 允许应用选择空格，故不把空格一律判为违规。保留来源差异，不证明服务器完整验证、运行行为、时间准确性、时钟同步或互通，也不自动包含 RFC9557 扩展。
  conditions_en: Limited to the RFC3339 MUST statement for required created_at in the fixed record.json, not implementation
    conformance. The datetime_t regex permits an absent timezone suffix and does not validate all calendar/range
    constraints. Its T/t separator differs from space examples; RFC3339 section5.6 permits application selection
    of a space, so spaces are not categorically violations. Source differences are retained without proving complete
    server validation, runtime behavior, timestamp accuracy, clock synchronization or interoperability. RFC9557
    extensions are not automatically included.
