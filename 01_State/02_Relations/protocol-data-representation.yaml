  conditions_zh: 仅限使用相关特性时的规范规则：§5.3.3.1 中 body 安全信息位置的 name 是相对于每个交互输入 DataSchema 根的 JSON Pointer；§9.3.2 的 tm:ref
    以 URI、# 与 JSON Pointer 定位模型子定义（URI 可为空以引用同一文档）；§9.3.4 的 tm:optional 指针须解析到完整交互可供性 Map。三者不可混为同一根位置；不要求所有 TD 含指针，不推出任意实现的
    JSON Pointer 支持、完整符合性或安全保证。
  conditions_en: 'Feature-conditional rules only: body-security name points from each interaction input DataSchema
    root (5.3.3.1); tm:ref combines a possibly empty URI, # and JSON Pointer to locate a model subdefinition (9.3.2);
