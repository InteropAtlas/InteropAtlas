id: cloudevents_1.0.2_uses_rfc3339
type: relation
name_zh: CloudEvents 1.0.2 使用 RFC 3339 时间戳表达
name_en: CloudEvents 1.0.2 uses RFC 3339 timestamp expressions
source: cloudevents_1.0.2
relation: uses
target: rfc3339
context:
  version_context:
    source: CloudEvents Core Specification 1.0.2
    target: RFC 3339
  conditions_zh: 仅表述 Timestamp 类型的规范字符串编码及可选 time 属性：time 存在时须符合 RFC 3339；绑定和运行时也可使用可转换的原生类型，不要求每次传输都使用字符串。time 仍可省略；关系不保证时钟同步、时间精度或所填值必然是真实发生时刻，也不自动接纳
    RFC 9557 扩展。
  conditions_en: Limited to canonical Timestamp string encoding and the optional time attribute, which follows RFC 3339 when
    present. Convertible native representations remain possible. Time can be omitted; this does not guarantee clock synchronization,
    accuracy or actual occurrence time, or automatically include RFC 9557 extensions.
evidence:
