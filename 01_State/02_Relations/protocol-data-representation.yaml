id: vc_data_model_2.0_uses_json_ld
type: relation
name_zh: 可验证凭证数据模型 2.0 使用 JSON-LD 1.1 序列化
name_en: Verifiable Credentials Data Model 2.0 uses JSON-LD 1.1 serialization
source: vc_data_model_2.0
relation: uses
target: json_ld_1.1
context:
  version_context:
    source: VC Data Model 2.0, W3C Recommendation 2025-05-15
    target: JSON-LD 1.1, W3C Recommendation 2020-07-16
  conditions_zh: 仅表述固定凭证数据模型 2.0 的 JSON-LD 1.1 序列化；application/vc 与 application/vp 表示须使用 compacted document form。第 6.3 节的资料性说明允许符合文档条件的类型特定处理，不要求每个消费者使用通用
    JSON-LD 库；上下文与文档符合性要求仍保留。不推定某签名套件、发行者可信度、法律效力或 IA 采用。
  conditions_en: Limited to the fixed VC2.0 JSON-LD1.1 serialization, using compacted document form for application/vc and
    application/vp. Informative section6.3 describes type-specific processing of conforming documents without a general JSON-LD
    library; context and conformance requirements remain. No signing-suite, issuer-trust, legal-validity or IA-adoption claim.
evidence:
- url: https://www.w3.org/TR/2025/REC-vc-data-model-2.0-20250515/
  title: VC Data Model 2.0 — Section 6.1 JSON-LD, Section 6.3 informative processing guidance and normative JSON-LD11 reference
  language: en
  accessed: '2026-10-21'
