id: wot_td_1.1_uses_json
type: relation
name_zh: WoT 事物描述 1.1 使用 RFC 8259 JSON 表示
name_en: WoT Thing Description 1.1 uses RFC 8259 JSON representation
source: wot_td_1.1
relation: uses
target: json_rfc8259
context:
  version_context:
    source: WoT Thing Description 1.1, W3C Recommendation 2023-12-05
    target: RFC 8259
  conditions_zh: 仅表述固定 2023-12-05 推荐标准中事物描述（TD）实例的 JSON 序列化；第 6 节明确引用 RFC 8259 第 8.1 节的开放生态编码要求，包括 UTF-8 和不得添加 BOM。该表示关系不证明被描述设备的能力、传输绑定或任意实现之间的互通。
  conditions_en: Limited to TD instance JSON serialization in the fixed 2023-12-05 Recommendation. Section 6 invokes RFC 8259
    section 8.1 for open-ecosystem encoding, including UTF-8 and no added BOM. This representation relation does not certify
    device capabilities, transport bindings or implementation interoperability.
evidence:
