id: cloudevents_1.0.2_uses_uri
type: relation
name_zh: CloudEvents 1.0.2 使用 RFC 3986 URI 引用
name_en: CloudEvents 1.0.2 uses RFC 3986 URI references
source: cloudevents_1.0.2
relation: uses
target: uri_rfc3986
context:
  version_context:
    source: CloudEvents Core Specification 1.0.2
    target: RFC 3986
  conditions_zh: 仅表述固定核心规范的 URI/URI-reference 类型及 source 属性使用 RFC 3986 语法：source 必填且为非空 URI-reference，绝对 URI 是建议而非强制。生产者定义标识内容的具体语义；本关系不表示该标识必须是可抓取
    URL，也不证明生产者身份可信。
  conditions_en: Limited to the fixed core URI/URI-reference types and source attribute using RFC 3986 syntax. Source is required
    and nonempty; an absolute URI is recommended, not mandatory. Producer-defined identifier semantics do not imply dereferenceability
    or trusted producer identity.
evidence:
