id: mcp_uses_json_schema_2020_12
type: relation
name_zh: MCP 2025-11-25 使用 JSON Schema 2020-12 默认方言
name_en: MCP 2025-11-25 uses JSON Schema 2020-12 as its default dialect
source: mcp_2025_11_25
relation: uses
target: json_schema_2020_12
context:
  version_context:
    source: MCP 2025-11-25
    target: JSON Schema Draft 2020-12
  conditions_zh: 仅表述 MCP 2025-11-25 中 Schema 的默认方言和最低支持要求：缺少 $schema 时按 2020-12 解释，客户端与服务端须支持此方言；显式 $schema 可指定其他方言，须依声明或默认方言验证并适当报告不支持的方言。不是所有
    MCP Schema 都只能使用 2020-12，也不证明具体实现符合 MCP 或覆盖全部协议要求。
  conditions_en: 'Limited to the dated MCP schema default and minimum support: absent $schema means 2020-12, which clients
    and servers must support. An explicit $schema may select another dialect; validation follows the declared or default dialect,
    with unsupported dialects reported appropriately. This is not an exclusive-dialect rule or implementation conformance
    claim.'
evidence:
- url: https://modelcontextprotocol.io/specification/2025-11-25/basic#json-schema-usage
  title: MCP 2025-11-25 — JSON Schema Usage, Schema Dialect and Implementation Requirements
  language: en
  accessed: '2026-10-21'
- url: https://json-schema.org/draft/2020-12
  title: JSON Schema Draft 2020-12 — target specification identity
  language: en
  accessed: '2026-10-21'
