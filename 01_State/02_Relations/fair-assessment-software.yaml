context:
  version_context:
    source: F-UJI4.0.1 source7bc65525efdca9aaaaef3bc9f96dd27a5101bb0a, selected default FAIRsFAIR metric configuration0.8
    target: FAIR Guiding Principles2016 publication, DOI10.1038/sdata.2016.18; guidance, not a software conformance
      specification
  conditions_zh: 软件把 FAIR 作为方法输入，经可配置 FAIRsFAIR 指标、evaluator 与按原则/类别汇总辅助研究数据评估。源码架构与作者论文共同支持实际 uses，不是把 7 个合成例泛化成全程序证明。17
    个默认指标项不是全部原则覆盖，A2 被注释，领域/元数据/外部服务/配置影响结果。来源组件 creator:null 或识别命名空间可通过、related-only 失败，score 不证明详细来源或真实性；两个指定
    URL 的汇总特例见对象 scope。仅 7 个离线组件例实际执行，无完整采集/服务/汇总/上游套件运行。FAIR 是原则非规范；不主张 implements、完整 FAIR/认证、客观统一度量、安全/合法性/质量、PROV-O
    图符合性、自动修复或 IA 采用。
  conditions_en: F-UJI takes FAIR as methodological input through configured FAIRsFAIR metrics, evaluators and principle/category
    summaries. Source architecture and authors' paper support this use, not extrapolation of seven synthetic cases
    to all-program correctness. Seventeen entries are not complete coverage; A2 is commented out and domain/metadata/external-service/configuration
    affect results. creator:null or a recognized namespace can pass while related-only fails, so scores do not prove
    detailed provenance/truth; object scope records two named-URL summary overrides. Only seven offline component
    cases executed, not complete harvesting/service/summary/upstream suite. No implements/fullFAIR/certification,
    universal objective measurement, security/legal/quality, PROV-O graph validity, automated repair or IA-adoption
    claim.
