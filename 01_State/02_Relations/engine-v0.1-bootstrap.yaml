name_zh: JSON Pointer（RFC 6901）明确引用 RFC 4627 JSON 格式
name_en: JSON Pointer (RFC 6901) explicitly uses the RFC 4627 JSON format
context:
  version_context:
    source: RFC 6901, April 2013, original published text
    target: RFC 4627, July 2006, historical Informational RFC
  conditions_zh: 仅记录 RFC 6901 第 1/3/5/10.1 节对 RFC 4627 的明确规范性引用，不把历史引用自动升级为 RFC 8259。此为固定出版物间的格式引用，不是推荐旧版、完整等价或实际实现符合性判断；也不表示
    JSON Pointer 不能用于遵循后续 JSON 规范的数据。uses 不作传递性推论。
  conditions_en: Records the explicit RFC 4627 reference in RFC 6901 sections 1/3/5/10.1 without upgrading it to
    RFC 8259. This fixed-publication format reference is not an old-version recommendation, full-equivalence or
    implementation-conformance claim, nor does it assert that JSON Pointer cannot be used with data following later
    JSON specifications. No transitive uses inference is made.
evidence:
