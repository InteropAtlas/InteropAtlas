  version_context:
    source: npm whatwg-url 17.3.0 / jsdom/whatwg-url at 6a0e2ad72245ec3b7dfb122709c9f5762313b928
    target: Existing URL Living Standard; release README declares implementation baseline fde3f74f063341a28d437216f75735b8b40128f5,
      not an edition or assurance against later changes
  conditions_zh: 仅固定 npm whatwg-url 17.3.0 / jsdom 源 commit 6a0e2ad72245ec3b7dfb122709c9f5762313b928 的有界 URL/URLSearchParams
    解析、序列化、live query 与所查低层算法。README 实现基线为 URL spec fde3f74f063341a28d437216f75735b8b40128f5，不新建标准版本，不重新核准历史845bafca或旧
    alternative_to。解析成功、非致命 validationErrors 与 grammar isValidURLString 不等价；允许的 grammar/诊断分歧没有实测见证。WebIDL 转换可先抛错；setter
    可先改 host 后遇端口失败，不保证原子性；词法归一化、重复有序 query/form重写及空标记丢失、低层记录不一致和 file origin 实现选择均适用。仅使用既有 resource_identification
    的标识语法/记录处理含义，不推断网络获取、安全、永久身份、RFC3986互换、完整或当前符合性。全部操作边界在对象中英可见描述中保留，不靠隐藏 context 才成立。
  conditions_en: 'Bounded parsing/serialization, URL/URLSearchParams live queries and inspected low-level algorithms
    of npm whatwg-url 17.3.0 at source 6a0e2ad72245ec3b7dfb122709c9f5762313b928. The README''s declared URL-spec
    baseline is fde3f74f063341a28d437216f75735b8b40128f5: no new standard edition or reapproval of historical
    845bafca/old alternative_to. Parse success, nonfatal validationErrors and grammar isValidURLString are not
    equivalent; no actual grammar/diagnostic-disagreement witness was found. WebIDL conversion may throw first;
    setters can mutate host before port failure without universal atomicity. Lexical normalization, ordered duplicate
    query/form rewriting, empty-marker loss, inconsistent low-level records and file-origin implementation choice
    remain limits. Existing resource_identification concerns identifier syntax/record processing, not fetching,
    security, permanent identity, RFC3986 interchangeability or full/current conformance. Complete operative Chinese
    and English limits remain in the object''s visible description, not only hidden context.'
