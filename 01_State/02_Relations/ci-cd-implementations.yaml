conditions_zh: >-
  两者都可用于仓库工作流自动化与 CI/CD。Forgejo Actions 有意保持与 GitHub Actions 相似的使用模型，
  许多工作流可以少量修改后迁移，但 Forgejo 官方明确表示并不追求完全兼容，因此这里不使用 compatible_with。
conditions_en: >-
  Both can provide repository workflow automation and CI/CD. Forgejo Actions intentionally uses a familiar
  model and many workflows can migrate with small changes, but Forgejo explicitly does not target full
  compatibility, so this relation is not modeled as compatible_with.
confidence: 0.95
context:
  version_context:
    source: Existing work-level Forgejo Actions system identity, not a fixed older release. Added evidence
      is restricted to Forgejo documentation under /docs/v17.0/, observed 2026-10-29; versioned documentation
      is not asserted to be immutable or an installed/tested software build.
    target: Existing work-level GitHub Actions system identity; GitHub.com OIDC documentation observed 2026-10-29,
      not a claim about every GitHub Enterprise Server release.
    comparison_boundary: Preserves the existing repository-workflow/CI/CD alternative scope and original bilingual
      conditions. The new concrete example concerns documented OIDC enablement settings, workflow/job precedence
      and the Forgejo fork pull_request restriction. It is not a general permissions mapping, a compatibility
      guarantee for actions or workflows, a measured migration-success rate, or proof of provider trust/token
      exchange, deployed runner behavior or IA adoption. The v17.0-specific behavior is not projected onto
      earlier or later Forgejo versions.
