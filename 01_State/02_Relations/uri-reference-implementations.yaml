  version_context:
    source: PyPI rfc3986 2.0.0; official tag 2.0.0 commit 7a64092490c1b3c4f354b9b14d060fa758d66848
    target: RFC3986 / STD66, January 2005
  conditions_zh: 仅固定库官方RFC3986声明对应的URIReference组件表示及源码§5导向的相对引用字符串处理，不是完整RFC3986符合性。from_string会转义部分原输入，不是严格原输入ABNF判定；resolve_with需要有scheme的有效base并先规范化base，strict=False默认同scheme处理与strict=True有别。Validator需显式配置存在性和组件检查，端口还有库级范围；通用normalize不实现所有百分号/方案规范化，不能将其成功打包为全validity或语义等价证明。此关系不覆盖IRI/IDNA、全部方案、浏览器URL行为、真实网络获取、资源永久性/所有权、访问控制或安全认证，不从URI处理传递为HTTP客户端/服务器实现、第三方互通或IA采用。
  conditions_en: Only the fixed library’s official RFC3986 claim as evidenced by URIReference component representation
    and source section-5-oriented relative-reference string processing, not complete RFC3986 conformance. from_string
    escapes some input rather than strictly validating the original ABNF. resolve_with requires a valid base with
    a scheme, normalizes it and distinguishes default strict=False same-scheme handling from strict=True. Validator
    requires explicit presence/component configuration and adds a package port range; generic normalize does not
    implement every percent-encoding/scheme normalization. Their success is not bundled into full validity or semantic-equivalence
    proof. This relation does not cover IRI/IDNA, all schemes, browser URL behavior, actual retrieval, resource
    permanence/ownership, access control or security certification, and does not transitively imply HTTP client/server
    implementation, third-party interoperability or IA adoption.
