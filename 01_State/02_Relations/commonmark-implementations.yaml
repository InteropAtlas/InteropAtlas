context:
  capabilities:
  - document_representation
  version_context:
    source: github/cmark-gfm 0.29.0.gfm.13 / 587a12bb54d95ac37241377e6ddc93ea0e45439b
    target: GFM 0.29-gfm dated 2019-04-06; existing gfm_0_29 identity, not exact source/public corpus equivalence
  conditions_zh: 仅固定 github/cmark-gfm 0.29.0.gfm.13，在显式选择的 GFM 扩展配置下的文档解析、AST 和 HTML 片段输出及所选 CommonMark 重渲染。五扩展须分别启用；API
    还需 parser attachment 与 renderer extension list，NULL 列表会绕过 tagfilter。Footnotes 额外 opt-in，不把默认或 registration-only
    路径当完整 GFM。明确 GFM 来源及 0.29 测试头支持这个有界版本关联，但源码/公开语料不等同：--unsafe 下源码 670 active 精确匹配、2 disabled 单独不匹配；公开 677 例
    all-five 为 651 匹配/26 差异，section-selective 另为 661/16，两者不是完整符合性或可累加覆盖。共有 16 差异为 9 strong、1 数字实体、2 XMPP、2 注释和
    2 任务框序列化；额外 10 是 tagfilter/autolink 核心示例交互。任务框静态 disabled；不保证 GitHub 交互或生产渲染相同。Tagfilter 只处理九标签，不清理所查事件属性/危险
    URL；CLI --safe 拒绝，API SAFE 无效，UNSAFE 可放行。data:image/png 例外也作用于链接 href。UTF-8 可透传或替换而非拒绝，NUL 替换；CommonMark 输出与所选往返改变原标记，不保证字节无损、规范化或安全。手工静态构建、43
    有限记录和另行 6 往返不证明任意输入、全部 API/平台、上游完整套件、资源/性能、安全/供应链认证或 IA 采用。
  conditions_en: 'Only fixed github/cmark-gfm 0.29.0.gfm.13 parsing/AST/HTML-fragment output and selected CommonMark
    re-rendering under explicit GFM extension configuration. Enable the five extensions separately; direct API
    use needs parser attachment and the renderer extension list, with NULL bypassing tagfilter. Footnotes are
    additional opt-in; default/registration-only paths are not all GFM. Explicit GFM provenance and the 0.29 header
    support this bounded edition link, not corpus equality: with --unsafe, 670 active source cases match and two
    disabled cases are separately nonmatching. Public 677 cases give 651 matches/26 differences with all five
    and separately 661/16 section-selectively, not full conformance or additive coverage. Shared differences are
    nine strong, one numeric entity, two XMPP, two comment and two task-checkbox serialization cases; the extra
    ten are tagfilter/autolink interactions with core examples. Task checkboxes are static/disabled, not GitHub
    interaction or production parity. Nine-tag filtering is not sanitization and retains checked event attributes/dangerous
    URLs. CLI --safe is rejected, API SAFE has no effect, and UNSAFE permits content. The data:image/png exception
    also reaches link href. UTF-8 can pass through or be replaced, not rejected, and NUL is replaced. CommonMark
    output and selected roundtrips rewrite lexical form, without byte-losslessness, canonicalization or safety
    guarantees. Custom static build, 43 finite records and six separate roundtrips are not all-input/API/platform/upstream-full-suite/resource/performance/security/supply-chain
    certification or IA adoption.'
