  conditions_zh: 限定为 Unicode 标量值与 UTF-8、UTF-16、UTF-32 码元序列之间的编码基础；代理码点不属于 Unicode 标量值。实际字节交换还依赖所选编码方案，以及该方案适用的字节序和字节顺序标记规则。解释声称采用
