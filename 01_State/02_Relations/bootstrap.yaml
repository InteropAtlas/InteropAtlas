conditions_zh: 这里描述的是 Git 技术体系中的网络传输部分，不代表该协议单独实现完整版本控制。
conditions_en: This describes the network transport portion of Git and does not imply that the wire protocol alone implements complete version control.
confidence: 0.9
context:
  version_context:
    source: Git wire protocol v2 as documented in Git v2.51.0, fixed commit c44beea485f0f2feaf460e2ac87fdd5608d63cf0;
      not a claim about the latest Git release
    target: Existing IA capability version_control
  conditions_zh: 仅支持 Git 版本控制体系的仓库数据交换部分，不单独实现记录、比较、分支或合并。客户端请求 version=2 后仍须依据服务端的版本响应与能力通告选择命令；ls-refs 请求引用信息，fetch
    取回 packfile，可选特性须按其通告使用。agent 字符串只作统计和调试，不能用来推断功能支持。本次不核验 IA 的实际协议协商、传输安全或任意客户端与服务端互通。
  conditions_en: Only the repository-data exchange part of Git version control, not recording, comparing, branching
    or merging by itself. After requesting version=2, clients still depend on the server version response and
    advertised capabilities. ls-refs requests references; fetch retrieves packfiles, with optional features
    used as advertised. Agent strings are informational, not proof of feature support. IA protocol negotiation,
    transport security and arbitrary client/server interoperability are not verified.
