  conditions_zh: 仅表述 JSON Schema 2020-12 Core 使用 RFC 8259 的 JSON 术语和数据模型，Schema 自身为对象或布尔值。可按该数据模型处理的文档或内存结构也可作为实例；第
    4.2.3 节允许扩展数据模型。不是所有宿主协议消息必须采用 JSON 文本的要求，也不证明词汇表、验证器或应用互通。该 Core 文档保留其 Internet-Draft 身份。
