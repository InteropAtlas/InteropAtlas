    source: RFC 8259, December 2017
    target: Existing IA capability data_serialization
  conditions_zh: 限定为 RFC 8259 中结构化值的 JSON 文本表示，可用于存储、交换与重新解析；这是语法层序列化能力，不包含数据结构规则或业务语义验证。对象成员名称宜唯一；数字范围和精度可受实现限制；非封闭生态系统间交换须使用
    UTF-8。不保证任意宿主类型无损往返、唯一字节表示或宿主协议互通。
  conditions_en: Limited to RFC 8259 JSON text representation of structured values for storage, exchange and parsing,
    not schema or application-semantic validation. Object names should be unique, number range/precision can be
    implementation-limited, and exchange outside closed ecosystems requires UTF-8. This does not guarantee lossless
    round trips for arbitrary host types, a unique byte representation, or host-protocol interoperability.
