  conditions_zh: 限定为 RFC 3986 通用语法配合各方案规范以统一标识和引用资源的基础；资源不必能通过网络访问。标识本身既不保证访问，也不定义访问操作；RFC 3986 不要求同一 URI 永久标识同一资源。因此这里不把既有能力描述中的稳定标识理解为所有
