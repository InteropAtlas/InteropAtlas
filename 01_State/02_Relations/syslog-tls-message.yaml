  conditions_zh: 文献级使用：RFC 5425 §4.3 直接将 RFC 5424 的 SYSLOG-MSG 纳入按字节计数的分帧；§9.1 确定其 2009 年 3 月规范引用身份。只记录原始出版物之间的使用，不表示部署、实现符合性、安全保证或
    IA 采用。RFC 9662 后续更新未合并；不是当前完整安全或部署指南。保护逐跳，认证对端不一定是 HOSTNAME；无应用层确认或远端应用送达保证。两端勘误内容与状态均未核验。
  conditions_en: 'Publication-level use: RFC 5425 section 4.3 directly imports RFC 5424 SYSLOG-MSG into octet-counted
    framing; section 9.1 identifies the March 2009 normative reference. Original publications only, not deployment,
    implementation conformance, security assurance or IA adoption. RFC 9662 updates are not consolidated; not current
    complete security or deployment guidance. Protection is hop-by-hop, authenticated peer need not match HOSTNAME,
    and there are no application acknowledgments or remote-application receipt guarantees. Errata contents/status
    for both endpoints remain unreviewed.'
