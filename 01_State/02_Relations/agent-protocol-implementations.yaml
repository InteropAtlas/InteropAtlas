    implements 结论。
  conditions_en: Limited to client/server sessions, initialization negotiation and tool, resource and prompt interfaces
    documented in the fixed official source. Its LATEST_PROTOCOL_VERSION is 2025-11-25, not a claim about the latest
    version today. Supporting older dated versions does not remove session negotiation; actual features depend on
    declared peer capabilities and configuration. Tasks remain experimental APIs. This relation does not certify
    every optional feature or transport, secure authorization configuration or third-party interoperability. Thirteen
    in-memory examples are supplementary verification, not protocol certification, and JSON Schema/JSON-RPC/JSON
    reference paths are not promoted transitively into additional implements claims.
