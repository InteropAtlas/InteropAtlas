id: paho_mqtt_python_implements_mqtt_5.0
type: relation
name_zh: Paho Python 2.1.0 有界实现 MQTT 5.0 客户端
name_en: Paho Python 2.1.0 implements a bounded MQTT 5.0 client
source: paho_mqtt_python
relation: implements
target: mqtt_5.0
context:
  version_context:
    source: Paho MQTT Python Client 2.1.0; tag v2.1.0, commit af64a4365c6ac5a7a4d339e7b00f44df91353b35
    target: MQTT Version 5.0, OASIS Standard, 07 March 2019
  conditions_zh: 依据固定 README 的 MQTT 5.0 实现声明及 Client 的 connect/publish/subscribe API，仅记录显式选择 protocol=MQTTv5、连接消息代理并运行网络循环时的客户端发布订阅路径。默认
    MQTT 3.1.1 不自动建立此路径；MQTT 5 的 clean_start/properties 不等同于 MQTT 3.x 的 clean_session。调用方须处理协议结果、回调与会话配置；README
    的 clean_session 限制不转写为已验证的 MQTT 5 缺陷。上游库及代理互通未运行测试；不声称穷尽符合性、所有 QoS/会话语义、恰好一次、重启持久性、代理实现、部署安全、任意代理互通或 IA 采用。
  conditions_en: Based on the fixed README’s MQTT 5.0 implementation claim and Client connect/publish/subscribe
    APIs, limited to the client publish/subscribe path with explicit protocol=MQTTv5, a broker connection and a
    running network loop. Default MQTT 3.1.1 does not automatically establish that path; MQTT 5 clean_start/properties
    are not MQTT 3.x clean_session. Callers handle protocol results, callbacks and session configuration. README
    clean_session limitations are not restated as verified MQTT 5 defects. No upstream runtime or broker-interoperability
    test was performed. This is not exhaustive conformance, all-QoS/session-semantics, exactly-once, restart-durability,
    broker-implementation, deployment-security, arbitrary-broker-interoperability or IA-adoption evidence.
