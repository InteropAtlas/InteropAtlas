notes_zh:
  - 两者共同提供 version_expression 能力，但优化目标不同。
  - SemVer 主要表达兼容性变化；CalVer 主要表达时间和发布节奏。
  - 该关系不表示二者完全等价，也不表示必须二选一；实际项目可以组合使用日历信息与其他版本语义。
context:
  version_context:
    source: Semantic Versioning 2.0.0
    target: Calendar Versioning convention; official documentation snapshot 134affaa7110f0019683f41f31b34b5f82d52f0a
      (overview dated 2026-09-11), not a single mandatory CalVer scheme
  conditions_zh: 沿用既有条件性选择判断：当版本表达重点转向发布时间、发布周期或时间敏感性时，CalVer 可作为 SemVer 的替代路线。SemVer 2.0.0 要求声明公共 API，并以版本递增表达相应兼容性变化（0.y.z
    初始开发和预发行规则仍适用）；CalVer 是多种日历方案的约定，不由日历数字本身保证 API 兼容性。此边不表示规则或版本号完全可互换，也不要求二选一；实际方案可结合日历信息与其他版本语义，但不因此自动符合 SemVer
    的兼容性增号规则。不据此替任何项目选型，亦不表示 IA 采用。
  conditions_en: 'Preserves the existing conditional choice: CalVer can be an alternative when version-expression
    goals emphasize release dates, cadence or time sensitivity. SemVer 2.0.0 requires a declared public API and
    version increments communicating the corresponding compatibility changes, subject to its initial-development
    and prerelease rules; CalVer is a convention covering multiple calendar schemes, whose date numbers do not themselves
    guarantee API compatibility. This does not make the rules or version identifiers interchangeable or require
    an exclusive choice; a scheme may combine calendar information with other version semantics without thereby
    satisfying SemVer compatibility-increment rules. No project-specific choice or IA adoption is asserted.'
