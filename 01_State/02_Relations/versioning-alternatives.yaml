id: semver_alternative_calver
source:
  type: standard
  id: semantic_versioning_2_0_0
relation: alternative_to
target:
  type: standard
  id: calendar_versioning
conditions:
  - 当版本表达的主要目标从 API 兼容性语义转向发布时间、发布周期或时间敏感性时，CalVer 可作为 SemVer 的替代路线。
notes_zh:
  - 两者共同提供 version_expression 能力，但优化目标不同。
  - SemVer 主要表达兼容性变化；CalVer 主要表达时间和发布节奏。
  - 该关系不表示二者完全等价，也不表示必须二选一；实际项目可以组合使用日历信息与其他版本语义。
