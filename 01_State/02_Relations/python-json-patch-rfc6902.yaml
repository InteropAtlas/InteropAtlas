  conditions_zh: 仅限固定 README 明示 RFC 6902 目标、源码登记的六种内建操作及 apply_patch → JsonPatch.apply 顺序应用路径；静态证据不是运行验证或完整 conforms_to。限定普通
    JSON 形状 dict/list 数据，不为任意输入、重复名称、自定义操作或容器担保。默认复制、非原子就地应用、opt-in atomic 的普通 dict/list 恢复限制和根替换返回值均按对象描述适用。不从
    HTTP PATCH 推导库原子性，不核验六项勘误，不修改标准对象，不新增 JSON Merge Patch、JSON Pointer 依赖版本或 IA 采用声明。
  conditions_en: Limited to the fixed README RFC 6902 purpose, the six registered built-in operations and the sequential
    apply_patch → JsonPatch.apply path. Static evidence is not runtime validation or full conforms_to. Scope is
    plain JSON-shaped dict/list data, not arbitrary-input, duplicate-name, custom-operation or custom-container
    guarantees. Default copying, non-atomic in-place application, opt-in atomic restoration limits and root-return
    requirements apply as described on the object. No HTTP PATCH atomicity inference, errata verification, target
    change, JSON Merge Patch claim, version-specific JSON Pointer dependency relation or IA adoption.
