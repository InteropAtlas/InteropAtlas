  conditions_zh: 仅记录固定 README 对 TD 1.1 的明确引用、核心 1.1 上下文常量与描述解析/序列化、consume/produce 实现。parseTD 默认补全与归一化、面向 ExposedThingInit
    放宽的校验 schema 和缺 security 时的 nosec 序列化行为均保留，成功返回不代表完整 TD 符合性或安全性。网络操作依赖具体绑定及其角色支持；generic discover 未实现。本关系不证明完整
    WoT Scripting API、JSON-LD 处理、所有传输、联网设备能力或第三方互通，也不沿 uses 关系传递为 JSON/JSON-LD implements。15 个无网络本地示例只补充源码证据，不是符合性认证。
  conditions_en: Records only the fixed README reference to TD 1.1, the core 1.1 context constant, and description
    parsing/serialization and consume/produce implementation. parseTD defaults/normalization, the schema relaxed
    for ExposedThingInit, and nosec serialization when security is absent remain explicit; success is not full TD
    conformance or security assurance. Network operations depend on particular bindings and role support; generic
    discover is unimplemented. This does not certify the complete WoT Scripting API, JSON-LD processing, all transports,
    connected-device capabilities or third-party interoperability, nor infer JSON/JSON-LD implements transitively
    through uses. Fifteen non-network local examples supplement source evidence, not conformance certification.
