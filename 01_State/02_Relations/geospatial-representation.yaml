id: ogc_features_core_1_0_1_uses_rfc3339
type: relation
name_zh: OGC API Features Core 1.0.1 使用 RFC 3339 日期时间语法
name_en: OGC API Features Core 1.0.1 uses RFC 3339 date/time syntax
source: ogc_api_features_17_069r4
relation: uses
target: rfc3339
context:
  version_context:
    source: 'OGC API - Features - Part 1: Core corrigendum, 17-069r4 / 1.0.1'
    target: RFC 3339 (July 2002)
  conditions_zh: 仅表述固定 Core 文档中日期/时间戳及 datetime 查询参数的 date-time 语法：第 7.1 节列出依赖，第 7.11 节限定文档所述日期与时间戳，第 7.15.4 节的
    /req/core/fc-time-response E 指向 RFC 3339 §5.6。区间组合、斜杠与开放端点由 OGC 自身规则补充，不声称 RFC 3339 定义整个区间语法；要素属性仍可使用其他格式或时间参考系，不把推荐升级为普遍强制，也不证明实现互通。
  conditions_en: 'Limited to dates/timestamps and the date-time component of the datetime query parameter in the
    fixed Core document: section 7.1 lists the dependency, section 7.11 addresses dates/timestamps discussed by
    the document, and section 7.15.4 /req/core/fc-time-response E cites RFC 3339 section 5.6. OGC supplies interval
    composition, slash and open-endpoint rules; RFC 3339 does not define the whole interval syntax. Feature properties
    may use other formats or temporal reference systems. This does not turn a recommendation into a universal mandate
    or prove implementation interoperability.'
evidence:
- url: https://docs.ogc.org/is/17-069r4/17-069r4.html
