id: ogc_features_core_1_0_1_uses_geojson_rfc7946
type: relation
name_zh: OGC API Features 1.0.1 的 GeoJSON 编码类使用 RFC 7946
name_en: OGC API Features 1.0.1 GeoJSON encoding class uses RFC 7946
source: ogc_api_features_17_069r4
relation: uses
target: geojson_rfc7946
context:
  version_context:
    source: 'OGC API - Features - Part 1: Core corrigendum, 17-069r4 / 1.0.1'
    target: RFC 7946 (August 2016)
  conditions_zh: 仅限采用第 8.3 节 GeoJSON requirements class 的情形：依赖 RFC 7946；/req/geojson/definition 要求服务器的 200 响应对要素内容支持
    application/geo+json，对其他资源支持 application/json。当 200 响应的媒体类型实际为 application/geo+json 时，/req/geojson/content 要求按资源返回
    FeatureCollection 或 Feature。这不排除同时支持其他编码或通过内容协商返回其他表示。第 8.1 节明确这些编码类均非 Core 强制，Core 实现可采用其他编码；不声明所有 Core 实现使用
    GeoJSON、不认证具体实现，也不把可选类扩成整套 Features 的要求。
  conditions_en: 'Only when the section 8.3 GeoJSON requirements class is adopted: it depends on RFC 7946; /req/geojson/definition
    requires the server''s 200 responses to support application/geo+json for feature-content resources and application/json
    for other resources. When a 200 response actually has media type application/geo+json, /req/geojson/content
    requires a FeatureCollection or Feature according to the resource. This does not exclude supporting other encodings
    simultaneously or returning other representations through content negotiation. Section 8.1 explicitly makes
    these encoding classes non-mandatory for Core, which may use other encodings. This neither says all Core implementations
    use GeoJSON nor certifies an implementation or extends the optional class to all Features parts.'
evidence:
- url: https://docs.ogc.org/is/17-069r4/17-069r4.html
