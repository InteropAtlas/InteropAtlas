id: geojson_rfc7946_uses_json_rfc7159
type: relation
name_zh: GeoJSON RFC 7946 使用 RFC 7159 JSON 定义
name_en: GeoJSON RFC 7946 uses RFC 7159 JSON definitions
source: geojson_rfc7946
relation: uses
target: json_rfc7159
context:
  version_context:
    source: RFC 7946, original August 2016 publication
    target: RFC 7159, original March 2014 publication; obsoleted by RFC 8259
  conditions_zh: 文献级定义使用：RFC 7946 §1.2 依据 RFC 7159 将对象成员顺序视为无关，§1.4 采用其 JSON 定义并保留数组顺序，§13.1 将该文档列为规范引用。地理类型、坐标与坐标参考系要求仍由 RFC 7946 规定；任意 JSON 不等于 GeoJSON。仅限两份原始出版物，未核验或整合勘误，不以 RFC 8259 替换历史引用，也不推荐使用已废止文档。不声称实现符合性、完整验证、无损转换、坐标转换、单位换算或 IA 采用。
  conditions_en: 'Publication-level definition use: RFC 7946 section 1.2 treats object-member ordering as irrelevant by reference to RFC 7159; section 1.4 adopts its JSON definitions and preserves array ordering; section 13.1 lists the document normatively. Geographic types, coordinates and CRS requirements remain specific to RFC 7946; arbitrary JSON is not GeoJSON. Only the two original publications are covered; errata were not reviewed or consolidated. RFC 8259 does not replace this historical reference, which is not a recommendation to use the obsolete document. No implementation conformance, complete validation, lossless conversion, coordinate transformation, unit conversion or IA adoption is asserted.'
evidence:
- url: https://www.rfc-editor.org/rfc/rfc7946.txt
  title: RFC 7946 original August 2016 publication — sections 1.2, 1.4 and 13.1
  language: en
  accessed: '2026-10-31'
- url: https://www.rfc-editor.org/rfc/rfc7159.txt
  title: RFC 7159 original March 2014 publication — JSON definitions and sections 2, 4 and 5
  language: en
  accessed: '2026-10-31'
- url: https://www.rfc-editor.org/info/rfc7159/
  title: RFC Editor information — RFC 7159 obsolete by RFC 8259; status only
  language: en
  accessed: '2026-10-31'
