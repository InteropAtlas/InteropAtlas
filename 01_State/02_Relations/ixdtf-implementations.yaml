id: unicode_ixdtf_implements_rfc9557
type: relation
name_zh: ixdtf 0.6.7 源快照有界实现 IXDTF 注释解析与显式 Z 偏移助手
name_en: ixdtf 0.6.7 source snapshot implements bounded IXDTF annotation parsing and explicit Z-offset helper
source: unicode_ixdtf
relation: implements
target: rfc9557
context:
  version_context:
    source: ixdtf0.6.7 in official ICU4X2.4.0 source snapshot031d9e89f6a3fd26a14491e090729d46094328fd; published
      crate archive not verified
    target: RFC9557, April2024; annotation syntax and bounded default-key handling, explicit Z helper only
  conditions_zh: 只据固定源码对 RFC 9557 §§2、3.1、3.3、4.1 与 §5 所涉注释字段建立有限实现对应；不是完整规范、所有 critical 义务或严格 grammar 符合性。默认 UTF-8
    from_str(...).parse()，新建 parser，输入子集与源对象范围一致（四位年/有秒/显式偏移，最多9位小数，至多一个elective时区和一个elective u-ca，无实验key/重复历法）。返回注释原始字段而不证明时区/历法值有效或一致；未知普通elective
    key忽略，未知普通critical key拒绝。Z需调用方显式resolve_rfc_9557才转负零offset；其他数值offset不变。关键时区/历法应用语义、数据库查询、完整历法处理、无效输入全量拒绝、Temporal扩展、自定义handler、duration/UTF-16/写入均不在该关系中。静态源码对应及测试文本不等于实际运行、完整符合性、互通、安全、部署或IA采用；全部既有RFC对象与日期不改。
  conditions_en: 'Limited fixed-source implementation correspondence for annotation fields in RFC9557 sections2,3.1,3.3,4.1
    and5, not the whole specification, every critical-tag obligation or strict grammar conformance. A fresh UTF-8
    from_str(...).parse() uses the default handler on the source record''s input subset: four-digit year, seconds,
    explicit offset, at most9 fractional digits, at most one elective zone and one elective u-ca, no experimental
    keys or duplicate calendars. Returned raw fields do not prove valid or consistent zone/calendar values. Unknown
    ordinary elective keys are ignored; unknown ordinary critical keys are rejected. Z requires explicit caller
    use of resolve_rfc_9557 to become negative-zero offset; other numeric offsets are unchanged. Critical-zone/calendar
    application semantics, databases, complete calendar processing, exhaustive invalid-input rejection, Temporal
    extensions, custom handlers, duration/UTF-16/writing are excluded. Static source correspondence and test text
    are not execution, full conformance, interoperability, security, deployment or IA adoption. Existing RFC records/dates
    remain unchanged.'
