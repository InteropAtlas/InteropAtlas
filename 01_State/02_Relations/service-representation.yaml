id: problem_details_rfc9457_uses_json_rfc8259
type: relation
name_zh: RFC 9457 问题详情的 JSON 模型与表示使用 RFC 8259
name_en: RFC 9457 problem-details JSON model and representation use RFC 8259
source: problem_details_rfc9457
relation: uses
target: json_rfc8259
context:
  version_context:
    source: RFC 9457 (July 2023)
    target: STD 90 / RFC 8259 (December 2017)
  conditions_zh: 固定 RFC 9457 的问题详情模型是 JSON 对象；序列化为 JSON 时使用 application/problem+json。XML 等表示仍可用，不要求所有 HTTP API 错误采用此格式，也不把任意
    JSON 视为合法问题详情。status 成员若存在，仅供参考，生成者仍须在实际 HTTP 响应使用同一状态码，不重定义 HTTP 语义。附录 A 的 JSON Schema 是非规范性辅助；JSON 解析或通用校验不证明完整问题类型语义、服务符合性或实际互通。
  conditions_en: The fixed RFC 9457 problem-details model is a JSON object; JSON serialization uses application/problem+json.
    XML and other representations remain possible. Not every HTTP API error must use this format, and arbitrary
    JSON is not necessarily valid problem details. The status member, if present, is advisory; generators must still
    use the same status code in the actual HTTP response, without redefining HTTP semantics. Appendix A’s JSON Schema
    is non-normative assistance. JSON parsing or generic validation does not prove complete problem-type semantics,
    service conformance or actual interoperability.
