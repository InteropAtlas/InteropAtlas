id: openapi_3_1_1_uses_json_pointer_rfc6901
type: relation
name_zh: OpenAPI 3.1.1 在指定描述片段与消息体选择器中使用 JSON Pointer
name_en: OpenAPI 3.1.1 uses JSON Pointer for specified description fragments and body selectors
source: openapi_3.1.1
relation: uses
target: json_pointer_rfc6901
context:
  version_context:
    source: OpenAPI Specification 3.1.1 (24 October 2024)
    target: RFC 6901, April 2013
  conditions_zh: 仅限使用相关特性时：§4.8.20.4 为 Link/Callback 的请求或响应 body 选择器采用 RFC 6901 语法，指针部分可省略；§4.8.18.2 说明 Callback
    的消息体定位。§4.6 对引用 JSON/YAML 文档的 URI 片段使用 JSON Pointer 是 SHOULD，不提升为 MUST。本关系不把 header/query/path 表达式也当作指针，不要求每个引用、消息体或
    OpenAPI 文档含指针，也不证明运行时求值成功或工具符合性。
  conditions_en: 'Feature-conditional: Link/Callback request or response body selectors adopt RFC 6901 grammar (4.8.20.4;
    Callback context in 4.8.18.2), with the pointer portion optional. Interpreting JSON/YAML document URI fragments
    as JSON Pointer is SHOULD, not MUST (4.6). This does not cover header/query/path expressions or require pointers
    in every reference, payload or OpenAPI description, nor guarantee runtime evaluation or tooling conformance.'
evidence:
- url: https://spec.openapis.org/oas/v3.1.1.html#runtime-expressions
  title: OpenAPI 3.1.1 — section 4.8.20.4 runtime expression body-selector grammar
  language: en
