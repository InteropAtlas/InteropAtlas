id: problem_details_rfc9457_uses_uri_rfc3986
type: relation
name_zh: RFC 9457 问题详情使用 RFC 3986 URI 引用标识类型与发生实例
name_en: RFC 9457 problem details use RFC 3986 URI references for types and occurrences
source: problem_details_rfc9457
relation: uses
target: uri_rfc3986
context:
  version_context:
    source: RFC 9457 (July 2023)
    target: RFC 3986 / STD 66, January 2005
  conditions_zh: 仅表述 §3.1.1/3.1.5 的 type 与可选 instance URI 引用；相对引用按 RFC 3986 §5 以文档基址解析。解析后的 type 是问题类型主标识，省略时默认
    about:blank。绝对 URI 只是 RECOMMENDED，非必须；不可解引用的标识仍允许。消费者 SHOULD NOT 自动解引用 type，向开发者提供信息的工具除外。这不是强制抓取、端点可用性、身份可信性、安全性或
    API 符合性保证；不从虚构扩展示例推导 JSON Pointer 依赖。
  conditions_en: Limited to type and optional instance URI references (3.1.1/3.1.5), resolving relative references
    against the document base per RFC 3986 section 5. Resolved type is the primary problem-type identifier, defaulting
    to about:blank when absent. Absolute URIs are RECOMMENDED, not required; non-dereferenceable identifiers remain
    allowed. Consumers SHOULD NOT automatically dereference type except for developer-information tooling. No mandatory
    fetching, availability, trusted identity, security, API conformance or example-derived JSON Pointer dependency
    is asserted.
evidence:
- url: https://www.rfc-editor.org/rfc/rfc9457.html#section-3.1.1
  title: RFC 9457 — type URI identity, default, relative resolution and dereferencing limits
  language: en
  accessed: '2026-10-24'
- url: https://www.rfc-editor.org/rfc/rfc9457.html#section-3.1.5
  title: RFC 9457 — optional instance occurrence URI and relative resolution
  language: en
  accessed: '2026-10-24'
- url: https://www.rfc-editor.org/rfc/rfc9457.html#section-7.1
  title: RFC 9457 — normative URI reference identifies RFC 3986
  language: en
  accessed: '2026-10-24'
- url: https://www.rfc-editor.org/rfc/rfc3986.txt
  title: RFC 3986 / STD 66 — section 4.1 URI-reference and section 5 resolution
  language: en
  accessed: '2026-10-24'
