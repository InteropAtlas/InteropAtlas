id: openapi_3_1_1_uses_json_schema_2020_12
type: relation
name_zh: OpenAPI 3.1.1 Schema Object 使用 JSON Schema 2020-12
name_en: OpenAPI 3.1.1 Schema Object uses JSON Schema 2020-12
source: openapi_3.1.1
relation: uses
target: json_schema_2020_12
context:
  version_context:
    source: OpenAPI Specification 3.1.1 (24 October 2024)
    target: JSON Schema Draft 2020-12
  conditions_zh: 仅表述固定 OAS 3.1.1 Schema Object 的默认方言基础：2020-12 词汇加 OAS base vocabulary，不等同于整个 OpenAPI 文档或线上载荷都是
    JSON Schema。根 Schema Object 的 $schema 覆盖 jsonSchemaDialect 默认值；工具必须支持 OAS 方言，但其他方言支持是可选。普通 JSON Schema 实现可把
    OAS base vocabulary 关键词视为未知关键词；通用校验通过不证明完整 OAS 语义、工具支持或 HTTP API 互通。
  conditions_en: 'Limited to the default dialect foundation of the fixed OAS 3.1.1 Schema Object: Draft 2020-12
    vocabularies plus the OAS base vocabulary, not the entire OpenAPI document or every wire payload. A root Schema
    Object’s $schema overrides the jsonSchemaDialect default. Tooling must support the OAS dialect; other dialect
    support is optional. General JSON Schema implementations may treat OAS base-vocabulary keywords as unknown.
    Generic validation does not establish full OAS semantics, tool support or HTTP API interoperability.'
