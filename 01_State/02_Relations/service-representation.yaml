id: openapi_3_2_1_uses_json_schema_2020_12
type: relation
name_zh: OpenAPI 3.2.1 Schema Object 默认方言使用 JSON Schema 2020-12
name_en: OpenAPI 3.2.1 Schema Object default dialect uses JSON Schema 2020-12
source: openapi_3.2.1
relation: uses
target: json_schema_2020_12
context:
  version_context:
    source: OpenAPI Specification 3.2.1 (10 September 2026), authoritative versioned HTML
    target: JSON Schema Draft 2020-12 general-purpose meta-schema vocabularies
  conditions_zh: 仅表述固定 3.2.1 Schema Object 默认方言的基础：2020-12 通用元模式词汇加 OAS base vocabulary。不是整个 OpenAPI 文档或所有
    API 载荷都采用 JSON Schema；也不指定某次日期化 3.2/dialect/YYYY-MM-DD 迭代。资源根 $schema 覆盖 jsonSchemaDialect 默认值；工具必须支持 OAS
    方言，对其他方言支持可选。通用实现可将 OAS base vocabulary 关键词作为未知关键词；format 默认不作验证，类型专用关键词不隐含 type 约束。此文献使用关系不证明完整 OAS 语义、特定验证器符合性、跨版本兼容或
    HTTP API 互通；未运行上游工具。
  conditions_en: 'Limited to the default dialect foundation of the fixed 3.2.1 Schema Object: Draft 2020-12
    general-purpose meta-schema vocabularies plus the OAS base vocabulary. Not the entire OpenAPI document
    or all API payloads; no dated 3.2/dialect/YYYY-MM-DD iteration is selected. A resource-root $schema overrides
    jsonSchemaDialect. Tooling must support the OAS dialect; other dialect support is optional. General implementations
    may treat OAS base-vocabulary keywords as unknown. format is non-validating by default, and type-specific
    keywords imply no type constraint. This document-use relation establishes neither complete OAS semantics,
    specific validator conformance, cross-version compatibility nor HTTP API interoperability. No upstream
    tooling was run.'
