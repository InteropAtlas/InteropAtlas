id: openapi_3_1_1_uses_uri_rfc3986
type: relation
name_zh: OpenAPI 3.1.1 使用 RFC 3986 标识与解析描述引用
name_en: OpenAPI 3.1.1 uses RFC 3986 for description reference identification and resolution
source: openapi_3.1.1
relation: uses
target: uri_rfc3986
context:
  version_context:
    source: OpenAPI Specification 3.1.1 (24 October 2024)
    target: RFC 3986 / STD 66, January 2005
  conditions_zh: 仅限固定 OAS 3.1.1 的描述引用：§4.8.23 Reference Object 的 $ref 使用 URI 标识目标；§4.6 在未另行规定时允许相对 URI，并要求使用引用文档的基址解析。Schema
    Object 中的相对引用优先采用最近父模式的 $id；不存在该 $id 才使用文档基址，不能与 Reference Object 混同。API 端点 URL 另循 §4.7 的 Server Object 基址规则。本关系不保证可解引用、获取安全或实现互通，也不把描述引用当成
    API 调用。
  conditions_en: 'Limited to fixed OAS 3.1.1 description references: Reference Object $ref identifies a target by
    URI (4.8.23); relative URIs are permitted unless otherwise specified and use the referring-document base (4.6).
    Schema Object references instead use the nearest parent $id when present, otherwise the document base. API endpoint
    URLs have separate Server Object base rules (4.7). No dereferenceability, fetch safety or implementation interoperability
    is guaranteed; description references are not API calls.'
