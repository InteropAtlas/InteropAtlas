id: smpte_st2022_6_uses_rtp_rfc3550
type: relation
name_zh: SMPTE ST 2022-6:2012 的传输封装使用 RFC 3550 RTP 包头
name_en: SMPTE ST 2022-6:2012 transport encapsulation uses RFC 3550 RTP headers
source: smpte_st2022_6
relation: uses
target: rtp_rfc3550
context:
  version_context:
    source: SMPTE ST 2022-6:2012
    target: RFC 3550 (July 2003)
  conditions_zh: >-
    仅限固定 2012 版第 6.3 节的传输封装与包头要求：使用 IP/UDP/RTP 以及 RFC 3550 RTP 包头。
    资料性引言说明，设备无需支持 RTCP 或 SDP，是否采用由实现者决定。
    不据此断言完整 RFC 3550 符合性、强制 RTCP、与 ST 2110 等价或替代，也不证明具体设备互通或部署表现。
  conditions_en: >-
    Limited to the transport encapsulation and header requirements of section 6.3 in the fixed 2012 edition:
    IP/UDP/RTP and the RFC 3550 RTP header are required. The informative introduction leaves RTCP and SDP support
    to implementers rather than requiring them. This does not establish full RFC 3550 conformance, mandatory RTCP,
    equivalence to or replacement of ST 2110, device interoperability, or deployment performance.
evidence:
- url: https://pub.smpte.org/latest/st2022-6/st2022-6-2012.pdf#page=6
  title: SMPTE ST 2022-6:2012 — section 6.3, page 6; required IP/UDP/RTP and RFC 3550 header
  language: en
  accessed: '2026-10-22'
- url: https://pub.smpte.org/latest/st2022-6/st2022-6-2012.pdf#page=2
  title: SMPTE ST 2022-6:2012 — informative Introduction, page 2; optional RTCP and SDP support
  language: en
  accessed: '2026-10-22'
