id: w3c_webrtc_uses_rtp_rfc3550
type: relation
name_zh: WebRTC 指定的 RTP/RTCP 媒体 API 行为使用 RFC 3550
name_en: Specified WebRTC RTP/RTCP media API behavior uses RFC 3550
source: w3c_webrtc
relation: uses
target: rtp_rfc3550
context:
  version_context:
    source: W3C WebRTC Recommendation (13 March 2025)
    target: RFC 3550 (July 2003)
  conditions_zh: >-
    仅限固定 Recommendation 明确规定的媒体 API 行为：只读参数 RTCRtcpParameters.reducedSize 为 false 时，
    表示配置了 RFC 3550 复合 RTCP；为 true 时表示 RFC 5506 精简 RTCP，而非所有会话都采用复合 RTCP。
    RTCRtpTransceiver 停止发送与接收算法的第 3 步要求停止媒体发送，并按 RFC 3550 为此前发送的各 RTP 流发送 RTCP BYE。
    不扩展为数据通道使用 RTP，不把整个 IETF RTCWEB 协议族视为该 W3C API 规范，也不推定明文媒体传输、浏览器符合性或实际互通。
  conditions_en: >-
    Limited to media API behavior explicitly specified by the fixed Recommendation. The read-only
    RTCRtcpParameters.reducedSize parameter indicates RFC 3550 compound RTCP when false and RFC 5506 reduced-size
    RTCP when true; compound RTCP is not asserted for every session. Step 3 of the RTCRtpTransceiver stop-sending-and-receiving
    algorithm stops media sending and sends an RFC 3550 RTCP BYE for each RTP stream that the sender was sending.
    This does not extend RTP use to data channels, equate the IETF RTCWEB protocol suite with this W3C API specification,
    or imply plaintext media transport, browser conformance, or actual interoperability.
evidence:
- url: https://www.w3.org/TR/2025/REC-webrtc-20250313/#dom-rtcrtcpparameters-reducedsize
  title: WebRTC Recommendation 2025-03-13 — section 5.2.6; read-only reducedSize and RFC 3550 compound RTCP
  language: en
  accessed: '2026-10-22'
- url: https://www.w3.org/TR/2025/REC-webrtc-20250313/#dfn-stop-sending-and-receiving
  title: WebRTC Recommendation 2025-03-13 — section 5.4; stop sending and receiving, step 3, RFC 3550 RTCP BYE
  language: en
  accessed: '2026-10-22'
