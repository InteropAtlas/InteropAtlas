id: srtp_rfc3711_secures_rtp_rfc3550
type: relation
name_zh: RFC 3711 为 RFC 3550 的 RTP 与 RTCP 定义安全机制
name_en: RFC 3711 defines security mechanisms for RFC 3550 RTP and RTCP
source: srtp_rfc3711
relation: secures
target: rtp_rfc3550
context:
  version_context:
    source: RFC 3711 (March 2004)
    target: RFC 3550 (July 2003)
  conditions_zh: >-
    仅表述固定规范的安全机制关系：SRTP/SRTCP 为 RTP/RTCP 提供载荷保密、包完整性及重放防护机制。
    这些服务可选且相互独立，但 SRTCP 完整性保护是强制要求；主密钥及其他密码上下文参数由 SRTP 外部的密钥管理机制提供。
    不推定所有流量均已加密，不证明具体实现、配置或部署安全，也不概括后续版本。
  conditions_en: >-
    Specification-level protection of RTP/RTCP through SRTP/SRTCP payload confidentiality, packet integrity and replay protection.
    These services are optional and independent except for mandatory SRTCP integrity protection. Master keys and other cryptographic-context
    parameters come from key management external to SRTP. This does not imply universal encryption, implementation or deployment security,
    or coverage of later versions.
evidence:
- url: https://www.rfc-editor.org/rfc/rfc3711.html#section-2
  title: RFC 3711 — Goals and Features; optional services and mandatory SRTCP integrity
  language: en
  accessed: '2026-10-22'
- url: https://www.rfc-editor.org/rfc/rfc3711.html#section-3
  title: RFC 3711 — SRTP Framework; explicit RFC 3550 endpoint and RTP/RTCP protection
  language: en
  accessed: '2026-10-22'
- url: https://www.rfc-editor.org/rfc/rfc3711.html#section-3.2
  title: RFC 3711 — SRTP Cryptographic Contexts; external key management
  language: en
  accessed: '2026-10-22'
