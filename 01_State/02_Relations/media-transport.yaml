id: rtsp_rfc7826_uses_rtp_rfc3550
type: relation
name_zh: RTSP 2.0 选择 RTP 媒体传输时使用 RFC 3550
name_en: RTSP 2.0 uses RFC 3550 when RTP media transport is selected
source: rtsp_rfc7826
relation: uses
target: rtp_rfc3550
context:
  version_context:
    source: RFC 7826 (December 2016)
    target: RFC 3550 (July 2003)
  conditions_zh: >-
    仅限 RFC 7826 中选择 RTP 媒体传输的会话：RTSP 负责建立和控制，RTP 负责媒体传输；处理 RTP 的 RTSP 实体（RTSP agent）须支持 RTCP。
    本关系不是所有 RTSP 会话都依赖 RTP 的断言，不等同于 RTSP 控制消息使用 RTP 传送，也不证明实际互通或服务质量。
  conditions_en: >-
    Limited to RFC 7826 sessions selecting RTP media transport. RTSP establishes and controls delivery; RTP carries media.
    An RTSP agent handling RTP must support RTCP. This is not a universal RTP dependency for every RTSP session, does not
    mean RTSP control messages travel over RTP, and does not establish actual interoperability or quality of service.
evidence:
- url: https://www.rfc-editor.org/rfc/rfc7826.html#section-1
  title: RFC 7826 — Introduction; media delivery control
  language: en
  accessed: '2026-10-22'
- url: https://www.rfc-editor.org/rfc/rfc7826.html#section-22.13.1
  title: RFC 7826 — Transport Protocol Identifier; registered RTP media transports
  language: en
  accessed: '2026-10-22'
- url: https://www.rfc-editor.org/rfc/rfc7826.html#appendix-C.1
  title: RFC 7826 — RTP interaction and media-transport signaling
  language: en
  accessed: '2026-10-22'
- url: https://www.rfc-editor.org/rfc/rfc7826.html#appendix-C.1.6
  title: RFC 7826 — RTCP Usage with RTSP
  language: en
  accessed: '2026-10-22'
