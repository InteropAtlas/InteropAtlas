id: rtsp_rfc7826_uses_srtp_rfc3711
type: relation
name_zh: RTSP 2.0 选择 RTP/SAVP/UDP 媒体传输时使用 RFC 3711
name_en: RTSP 2.0 uses RFC 3711 when RTP/SAVP/UDP media transport is selected
source: rtsp_rfc7826
relation: uses
target: srtp_rfc3711
context:
  version_context:
    source: RFC 7826 (December 2016)
    target: RFC 3711 (March 2004)
  conditions_zh: >-
    仅限 RFC 7826 第 22.13.1 节与附录 C.1.4 定义的 RTP/SAVP（等同 RTP/SAVP/UDP）媒体传输选择。
    SAVP 在使用 RTP 的 RTSP 会话中是可选项；使用时须建立安全上下文，除非另行信令指定，默认采用 MIKEY RSA-R 密钥管理。
    不表示所有 RTSP 会话都启用 SRTP，不把媒体保护等同于 RTSP 控制通道保护，也不证明部署安全。
  conditions_en: >-
    Limited to the RTP/SAVP (equivalently RTP/SAVP/UDP) media-transport choice in RFC 7826 section 22.13.1 and Appendix C.1.4.
    SAVP is optional in RTP-based RTSP sessions. Its use requires a security context, with MIKEY RSA-R key management by default
    unless otherwise signaled. This neither requires SRTP for every RTSP session nor equates media protection with RTSP control-channel
    protection or proven deployment security.
evidence:
- url: https://www.rfc-editor.org/rfc/rfc7826.html#section-22.13.1
  title: RFC 7826 — Transport Protocol Identifier; RTP/SAVP explicitly references RFC 3711
  language: en
  accessed: '2026-10-22'
- url: https://www.rfc-editor.org/rfc/rfc7826.html#appendix-C.1.4
  title: RFC 7826 — SAVP/UDP; optional SRTP profile and security-context establishment
  language: en
  accessed: '2026-10-22'
