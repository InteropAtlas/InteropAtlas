id: digitalbazaar_vc_implements_vc2_presentation_construction
type: relation
source: digitalbazaar_vc
relation: implements
target: vc_data_model_2.0
name_zh: Digital Bazaar VC 7.3.0 实现有界、未签名 VC2 presentation 对象构造
name_en: Digital Bazaar VC 7.3.0 implements bounded unsigned VC2 presentation-object construction
context:
  version_context:
    source: '@digitalbazaar/vc7.3.0; fixed commit 08cd6f3d0c07bd62e899bd670a450ea92fe1bf59; reviewed context mapping
      at credentials-context3.2.0 commit c9a34570440baaf3b0ecf439250d58a67fc13a51, not an installed dependency claim'
    target: Verifiable Credentials Data Model v2.0, W3C Recommendation2025-05-15, sections4.3/4.13 representation
      subset only
  scope:
    entry_point: createPresentation({version:2.0,...})
    positive_mechanism: Unsigned/pre-security in-memory presentation-object construction, not validation or secured-document
      production
    excluded:
    - VC1 compatibility/migration
    - EnvelopedVerifiableCredential and full representation coverage
    - Complete model/JSON-LD validation, signature/status/identity authentication
    - Conforming document or issuer/verifier implementation assurance
  conditions_zh: 仅 numeric version=2.0、已核 credentials-context3.2.0 的 v2 标识映射，以及调用方提供结构适当的普通 VC2-shaped 嵌入对象；不计 VC1、enveloped
    或全部表示分支。正面范围只是设置首 @context、VerifiablePresentation type，并可选择包装/附加 credential、id、holder 的未签名内存对象构造，位于安全机制之前；不是第1.3节
    conforming document/issuer/verifier 或第4.13节 securing 要求的实现证明。id/holder 真值直接复制，无类型/URL校验；调用方须保证合适值。省略 credential
    合法进入可选分支，但输入 [] 也返回空数组，不验证 present 时 one-or-more 数量要求。嵌入对象共享原引用，无深复制；局部检查不要求 proof、不认证 issuer/holder、签名或 status。空
    subject 数组、falsey 日期、未完整校验的 context/扩展字段等限制保留。truthy validFrom/validUntil 的正则未锚定且允许缺时区，无总体 validFrom<=validUntil
    校验；默认 now=当前Date、maxClockSkew=300秒的窗口筛选不等于模型结构验证，可拒绝结构有效输入，调用方须选时间策略。普通输入通过 VerifiableCredential type 检查，不覆盖
    EnvelopedVerifiableCredential；VC1可接受分支不代表迁移或本边覆盖。构造函数体不调用 loader、签名、验证或状态获取，不推为全部模块初始化无网络保证。调用方负责完整规范检查、任何所需安全机制、身份/状态/信任判断。最终REC字段/context对应由固定源码与官方context解析相等支持，不是完整JSON-LD处理、测试通过或符合性证书。依赖版本范围不是安装证据，Git源码未与npm归档比对；未执行上游、密钥/凭证操作或网络身份查询，不作安全、互通、法律效力、生产就绪或IA采用声明。
  conditions_en: Limited to numeric version=2.0, the reviewed credentials-context3.2.0 v2 identifier mapping, and
    caller-supplied appropriately structured ordinary VC2-shaped embedded objects; VC1, enveloped and complete representation-space
    coverage are excluded. The positive mechanism only sets the first @context and VerifiablePresentation type and
    optionally wraps/attaches credential/id/holder in an unsigned in-memory object before securing. It is not evidence
    of section1.3 conforming documents/issuer/verifier implementations or section4.13 securing requirements. Truthy
    id/holder are copied without type/URL validation; callers must ensure appropriate values. Credentials may be
    omitted, but [] also returns an empty array without enforcing the normative one-or-more requirement when present.
    Embedded objects share input references without deep-copy. Local checks require no proof and authenticate neither
    issuer/holder, signatures nor status. Empty subject arrays, falsey dates and incomplete context/extension checking
    remain limitations. Truthy validFrom/validUntil use an unanchored optional-timezone regex and no overall validFrom<=validUntil
    constraint; default current-Date now and300-second maxClockSkew filtering can reject structurally valid input
    and are not model-structure validation. Callers choose time policy. VerifiableCredential-type checks do not
    cover EnvelopedVerifiableCredential; separately accepted VC1 inputs imply neither migration nor this edge coverage.
    The scoped function body invokes no loader, signing, verification or status retrieval, not a guarantee about
    all transitive module initialization. Callers retain complete normative checks, required securing, identity/status
    and trust decisions. Fixed source and parsed official-context equality establish bounded final-REC field/context
    correspondence, not complete JSON-LD processing, passed tests or conformance certification. Dependency ranges
    are not installed-version evidence and Git source was not compared with npm archives. No upstream execution,
    key/credential operations, network identity checks, security/interop/legal-validity/production-readiness or
    IA-adoption claim.
