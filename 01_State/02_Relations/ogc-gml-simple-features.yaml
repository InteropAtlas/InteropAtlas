  conditions_zh: 仅固定 Core 第 8.4 节 GML-SF0 与第 8.5 节 GML-SF2 两个可选编码类的直接文献依赖，分别使用 Level 0 与 Level 2；第 8.1 节明确均非 Core
    强制，也允许其他编码。对应 profile 参数 URI 为 http://www.opengis.net/def/profile/ogc/2.0/gml-sf0 和 http://www.opengis.net/def/profile/ogc/2.0/gml-sf2。Core
    对这两个类的二维线性几何限制不是整个 Profile 的限制。不是所有 Core 部署均使用 GML，不证明实现支持、符合性、互通或 IA 采用；不拆分 SF0/SF2 假对象，不推导传递关系。
  conditions_en: Direct documentary dependency only for the optional Core section 8.4 GML-SF0 and section 8.5 GML-SF2
    encoding classes, using Level 0 and Level 2 respectively. Section 8.1 makes both non-mandatory for Core and
    allows other encodings. Their profile parameter URIs are http://www.opengis.net/def/profile/ogc/2.0/gml-sf0
    and http://www.opengis.net/def/profile/ogc/2.0/gml-sf2. Core two-dimensional linear-geometry constraints for
    those classes do not define the entire Profile. Not all Core deployments use GML; no implementation support,
    conformance, interoperability or IA adoption is established. No invented SF0/SF2 objects or transitive inference.
