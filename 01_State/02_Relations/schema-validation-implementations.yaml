  conditions_zh: 依据固定发行版文档的 Draft202012Validator 支持，限定为结构化实例验证。format 检查须显式启用且某些格式需要可选依赖；正则表达式采用 Python 方言。本关系不宣称完整符合性认证、任意词汇表扩展支持、MCP/WoT/CloudEvents
