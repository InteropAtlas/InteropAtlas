  conditions_en: Based on the fixed release documented Draft202012Validator support, limited to structured-instance
    validation. Format checks are opt-in and some require optional dependencies; regular expressions use the Python
    dialect. This is not a complete conformance certification, arbitrary-vocabulary support claim, full MCP/WoT/CloudEvents
    implementation or application-interoperability assertion. A format with missing required optional dependencies
    can pass without an error; that result is not a format-validity guarantee.
