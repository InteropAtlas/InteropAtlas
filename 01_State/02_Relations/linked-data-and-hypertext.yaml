id: dcat_3_uses_dcmi_metadata_terms
type: relation
name_zh: DCAT 3 复用 DCMI Terms 的目录描述术语
name_en: DCAT 3 reuses DCMI Terms for catalog description
source: dcat_3
relation: uses
target: dcmi_metadata_terms
context:
  version_context:
    source: DCAT 3, W3C Recommendation 2024-08-22
    target: DCMI Metadata Terms, DCMI Recommendation 2020-01-20; existing work-level dcmi_metadata_terms endpoint
  conditions_zh: 仅表述固定 DCAT 3 中 dcterms:description、dcterms:title 的复用及 dcat:resource 对 dcterms:hasPart 的子属性关系，限定
    http://purl.org/dc/terms/，不混同 /elements/1.1/。外部术语的权威定义属于其原始规范；现有工作级端点以所列日期限定本断言，不推广至所有版本。词汇复用不表示每项属性必填、完整实现或符合性、IA
    采用，也不推导传递依赖。
  conditions_en: Limited to the fixed DCAT 3 reuse of dcterms:description and dcterms:title, and dcat:resource as
    a subproperty of dcterms:hasPart. The namespace is http://purl.org/dc/terms/, not /elements/1.1/. External definitions
    remain authoritative in their originating specification. The dated context bounds this work-level endpoint assertion,
    not every edition. No universal mandatory-property, full implementation/conformance, IA-adoption or transitive-dependency
    claim.
