id: rdflib_implements_sparql11_query_2013
type: relation
name_zh: RDFLib 7.6.0 有界实现 SPARQL 1.1 查询语言
name_en: RDFLib 7.6.0 implements bounded SPARQL 1.1 Query Language paths
source: rdflib
relation: implements
target: sparql11_query_2013
context:
  version_context:
    source: RDFLib 7.6.0; tag 7.6.0, commit 8b32146a0f9cb748c2068662e50d02b42fc86dfd
    target: W3C SPARQL 1.1 Query Language, Recommendation 2013-03-21
  conditions_zh: 限内置 SPARQLProcessor、可信查询及预加载本地图；Graph.query 使用 use_store_provided=False 绕过 store.query，且不覆盖处理器注册/evaluator/函数。覆盖
    SELECT、ASK、CONSTRUCT、DESCRIBE、基本图模式及源码/测试支持的部分聚合和子查询；DESCRIBE 采用 CBD，输出范围由处理器决定。此参数不是离线或沙箱开关，SERVICE、FROM/FROM
    NAMED、插件及间接加载可能访问网络/文件，本边排除这些外部路径和不可信输入。固定 W3C harness 存在 AVG、聚合/分组、pp37 与语法负例 xfail 及 SERVICE skip，不声称完整符合性、全测试通过或安全。上游测试仅审阅未执行；不扩展至
    Update、Protocol、结果格式、Federated Query、entailment、RDF 1.2 或 IA 采用。
  conditions_en: 'Limited to built-in SPARQLProcessor, trusted queries and preloaded local graph data; Graph.query
    uses use_store_provided=False to bypass store.query, without processor-registration/evaluator/function overrides.
    Covers SELECT, ASK, CONSTRUCT, DESCRIBE, basic graph patterns and only source/test-supported aggregate and subquery
    paths. DESCRIBE uses CBD with processor-determined scope. The option is not an offline/sandbox switch: SERVICE,
    FROM/FROM NAMED, plugins and indirect loading can access network/files; these external paths and untrusted input
    are excluded. The fixed W3C harness has AVG, aggregate/grouping, pp37 and negative-syntax xfails plus SERVICE
    skips; no full conformance, all-tests-pass or security claim. Upstream tests were inspected, not run. Update,
    Protocol, result formats, Federated Query, entailment, RDF 1.2 and IA adoption are outside scope.'
