id: dcat_3_uses_skos_reference
type: relation
name_zh: DCAT 3 在 SKOS 分类路径中复用概念与概念方案
name_en: DCAT 3 reuses concepts and concept schemes for SKOS-based classification
source: dcat_3
relation: uses
target: skos_reference
context:
  version_context:
    source: DCAT 3, W3C Recommendation 2024-08-22
    target: SKOS Reference, W3C Recommendation 2009-08-18; existing work-level skos_reference endpoint
  conditions_zh: 限定采用 SKOS 的目录分类路径中对 skos:ConceptScheme 与 skos:Concept 的复用。目录也可使用 skos:Collection、owl:Ontology 或类似组织方式；不是所有目录都必须采用
    SKOS。DCAT 3 的 dcat:theme 没有自动将值推断为 skos:Concept 的 range。外部术语定义以 SKOS 规范为准；所列日期限定现有工作级端点的本断言。不声称全部属性必填、完整 SKOS
    实现或符合性、IA 分类体系采用、跨版等价或传递依赖。
  conditions_en: Limited to reuse of skos:ConceptScheme and skos:Concept in SKOS-based catalog classification. skos:Collection,
    owl:Ontology or similar alternatives remain available; SKOS is not mandatory for every catalog. DCAT 3 gives
    dcat:theme no range that automatically infers skos:Concept values. SKOS controls its term definitions; the dated
    context bounds this work-level assertion. No universal mandatory-property, full SKOS implementation/conformance,
    IA-taxonomy adoption, cross-edition equivalence or transitive-dependency claim.
