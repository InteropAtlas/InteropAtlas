id: pyshacl_depends_on_rdflib
type: relation
name_zh: pySHACL 0.40.1 声明 RDFLib 必需依赖
name_en: pySHACL 0.40.1 declares a mandatory RDFLib dependency
source: pyshacl
relation: depends_on
target: rdflib
context:
  version_context:
    source: pySHACL 0.40.1, commit 469cca7a22a078b36c167c1e8dadecf5e5ec6c75
    target: RDFLib declared range >=7.3.0,<8.0 with html extra; lock pins 7.6.0, object evidence commit 8b32146a0f9cb748c2068662e50d02b42fc86dfd
  conditions_zh: 仅陈述固定 pyproject 的必需包依赖 rdflib[html]>=7.3.0,<8.0，以及同一源码 poetry.lock 中 main 组、optional=false 的 7.6.0
    锁定事实；html extra 是该声明的一部分，不称为纯 RDFLib 普通查询的通用必需项。SPARQL 约束路径调用 target_graph.query，但未强制 use_store_provided=False，不能保证始终使用本地内置处理器。声明范围、仓库锁定和实际安装是不同事实；不声称实机已安装
    7.6.0、所有范围版本兼容或测试通过，不传递为 pySHACL 的完整 SPARQL/SHACL 符合性、离线或安全保证。
  conditions_en: States only the fixed pyproject mandatory rdflib[html]>=7.3.0,<8.0 dependency and the same source
    tree poetry.lock entry for 7.6.0, main group, optional=false. The html extra belongs to this declaration, not
    to a universal prerequisite for plain RDFLib queries. The SPARQL-constraint path calls target_graph.query without
    forcing use_store_provided=False, so built-in local processing is not guaranteed. Declared range, repository
    lock and actual installation are distinct. No actual installation of 7.6.0, compatibility across the full range
    or executed-test success is asserted, and no full SPARQL/SHACL conformance, offline or security guarantee is
    inherited.
