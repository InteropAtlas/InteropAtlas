    information prevent direct standard RDF 1.1 interpretation of every JSON-LD document. A graph-source consumer
    uses only the default graph; normative conversion algorithms are in the separate API specification. No lossless
    round-trip, RDF 1.2 mapping or library interoperability is established. The old RDF 1.2 edge is neither verified
    nor rewritten here.
