context:
  version_context:
    source: SHACL, W3C Recommendation 2017-07-20
    target: Existing IA capability schema_validation
  conditions_zh: 以 data graph 与 shapes graph 为输入，按 shapes 约束产生验证报告；不是原始 JSON 语法检查、事实真实性或业务正确性保证。区分 SHACL Core 与
    SHACL-SPARQL；递归 shapes 的验证行为在该版未定义，验证也可能发生实现相关 failure。此能力归属不证明任一处理器全符合性或 IA 采用。
  conditions_en: Given data and shapes graphs, SHACL checks shape constraints and produces a validation report;
    this is not raw JSON syntax checking or assurance of truth or application correctness. SHACL Core and SHACL-SPARQL
    remain distinct. This version leaves recursive-shape validation undefined, and validation can report implementation-specific
    failures. Capability attribution does not certify any processor or imply IA adoption.
