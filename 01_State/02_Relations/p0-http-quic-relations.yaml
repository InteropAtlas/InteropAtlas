id: aioquic_implements_quic_rfc9000
type: relation
name_zh: aioquic 1.7.0 有界实现 QUIC v1 连接与流处理
name_en: aioquic 1.7.0 implements bounded QUIC v1 connection and stream handling
source: aioquic
relation: implements
target: quic_rfc9000
context:
  version_context:
    source: aioquic 1.7.0; tag 1.7.0, commit 8c5c6b49ee8c0d19b310c9b9e6a3b6301360dbb0
    target: RFC 9000, QUIC v1 (May 2021)
  conditions_zh: 仅记录 QUIC v1 客户端/服务器连接状态机、数据报处理及流传输 API，不将同库 v2 归入 RFC 9000。Sans-I/O 调用方或 asyncio 层须驱动网络、定时器和发送，并逐数据报使用
    datagrams_to_send 返回的目的地址，不能始终固定为 connect 地址。源码明确承认远端 PATH_CHALLENGE 排队上限偏离 RFC 9000；证书名称/验证模式及信任配置也由集成方正确设置。不声称全条款/全可选功能符合性、外部互通认证或部署安全。上游测试定义仅审阅未运行；不增加
    RFC 9001 或扩展关系。
  conditions_en: Limited to QUIC v1 client/server connection state, datagram handling and stream-transfer APIs;
    same-library v2 is not attributed to RFC 9000. Sans-I/O callers or the asyncio layer drive network I/O, timers
    and sends, honoring every destination returned by datagrams_to_send rather than fixing it to connect. Source
    explicitly acknowledges the remote PATH_CHALLENGE queue bound as an RFC 9000 deviation. Integrators configure
    appropriate certificate names, verification mode and trust. No all-clause/all-option conformance, external interoperability
    certification or deployment security is asserted. Upstream tests were inspected, not run; RFC 9001 and extension
    relationships are not added.
