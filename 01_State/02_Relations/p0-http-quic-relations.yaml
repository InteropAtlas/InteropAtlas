id: quic_tls_version
type: relation
name_zh: RFC 9001 使用 RFC 8446 定义的 TLS 1.3 机制
name_en: RFC 9001 uses TLS 1.3 mechanisms defined in RFC 8446
source: quic_tls_rfc9001
relation: uses
target: tls13_rfc8446
context:
  version_context:
    source: RFC 9001 (May 2021)
    target: RFC 8446 (August 2018; explicit TLS13 normative reference)
  conditions_zh: 仅表述固定 RFC 9001 使用其第 11.1 节 [TLS13] 明确指向 RFC 8446 的握手与密钥派生机制。QUIC 不承载 TLS 记录，而自行承担包保护和记录层职责；第 4.2 节也允许保留所需
    TLS 1.3 功能且双方支持的更高 TLS 版本。本关系不把历史文档引用改成最新版本推荐，不推定部署安全或所有未来版本兼容。
  conditions_en: Limited to RFC 9001 use of handshake and key-derivation mechanisms whose TLS13 normative reference in section
    11.1 explicitly identifies RFC 8446. QUIC does not carry TLS records; it handles packet protection and record-layer responsibilities.
    Section 4.2 permits later TLS versions only when both endpoints support the required features. This historical citation
    is not a latest-version recommendation, deployment-security assertion or blanket future compatibility claim.
