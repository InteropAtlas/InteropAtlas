id: aioquic_implements_http3_rfc9114
type: relation
name_zh: aioquic 1.7.0 有界实现 HTTP/3 帧、事件与 SETTINGS
name_en: aioquic 1.7.0 implements bounded HTTP/3 frames, events and SETTINGS
source: aioquic
relation: implements
target: http3_rfc9114
context:
  version_context:
    source: aioquic 1.7.0; tag 1.7.0, commit 8c5c6b49ee8c0d19b310c9b9e6a3b6301360dbb0
    target: RFC 9114, HTTP/3 (June 2022)
  conditions_zh: 仅记录 H3Connection 基于 QUIC 的请求/响应 HEADERS、DATA、HTTP 事件及控制流 SETTINGS 处理；QPACK 编解码依赖 pylsqpack，调用方须把
    QUIC 事件交给 HTTP/3 并驱动底层 I/O、定时器与发送。控制流解析器丢弃未使用的 GOAWAY 载荷，因此不声称完整 GOAWAY/优雅关闭。WebTransport 等扩展和独立 QPACK 标准边不在本切片。源码及内存交换测试定义审阅不等于执行结果、外部网络互通认证、安全保证或全部
    RFC 9114 符合性。
  conditions_en: Limited to H3Connection request/response HEADERS, DATA, HTTP events and control-stream SETTINGS
    over QUIC. QPACK encoding/decoding depends on pylsqpack; callers feed QUIC events to HTTP/3 and drive underlying
    I/O, timers and sends. The control parser discards unused GOAWAY payload, so complete GOAWAY/graceful shutdown
    is not claimed. WebTransport and other extensions, and a separate QPACK-standard edge, are outside this slice.
    Source and in-memory-exchange test definitions were inspected, not executed; this does not establish external
    network interoperability certification, security or complete RFC 9114 conformance.
evidence:
