  conditions_zh: 限固定版本的JSON-LD 1.1展开、压缩、扁平化及RDF转换实现先例；官方目标声明不是全符合性认证。处理模式、上下文/加载器及RDF方向选项影响结果，未映射字段可被丢弃。此关系不把独立API/Framing/Canonicalization规范全套纳入本端点，不证明任意JSON无损转换、远程加载安全、SHACL管道、RDF1.2或跨实现互通。
  conditions_en: Limited to the fixed version as a JSON-LD 1.1 expansion, compaction, flattening and RDF-conversion
    implementation precedent, not certification from an upstream conformance aim. Processing mode, contexts/loaders
    and RDF direction options affect results; unmapped fields can be dropped. This edge does not fold the separate
    API, Framing or Canonicalization specifications into this endpoint or prove arbitrary lossless JSON conversion,
    remote-loading security, a SHACL pipeline, RDF 1.2 or cross-implementation interoperability.
