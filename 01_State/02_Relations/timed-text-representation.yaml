      the 2018-11-08 Recommendation
  conditions_zh: 仅表述第 3、5、6.4.1、7 节对 TTML2 机制的复用。M.1 的日期/状态指向 2020-01-28 第二版 Candidate Recommendation；既有工作级端点以 2018
    文本支持的定义不使两份文本等同，也不把 CR 升格为 Recommendation。Text 与 Image 各自受约束，不要求处理器同时实现两者；不声称全部特性、具体实现符合性或跨格式兼容。
  conditions_en: Limited to TTML2 mechanism reuse in sections 3, 5, 6.4.1 and 7. The date/status in M.1 identifies
    the 2020-01-28 Second Edition Candidate Recommendation. The existing work-level endpoint, whose definition is
    supported by the 2018 text, neither equates those texts nor promotes the CR to Recommendation. Text and Image
    are separately constrained, without requiring processors to implement both. No all-feature support, implementation
    conformance or cross-format compatibility is asserted.
