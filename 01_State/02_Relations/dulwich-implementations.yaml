name_zh: Dulwich 提供本地对象、引用与历史版本控制子功能（不含合并或网络验证）
name_en: Dulwich provides local object, reference and history version-control subfunctions, excluding merge
  or network validation
source: dulwich
relation: provides
target: version_control
context:
  capabilities:
  - version_control
  version_context:
    source: Dulwich 1.2.15 at b84b2ad43a5754054d812fa035b5fdcc68df4c29
    target: Existing active version_control; partial local provision, not an endpoint redefinition
  conditions_zh: 仅 Dulwich 1.2.15 固定纯 Python 路径的本地 Git 对象、提交、引用 / 分支、比较与历史子功能；不含 merge、冲突、网络 wire、任意仓库兼容或完整
    version_control。仅新合成 SHA-1 仓库，隔离配置、清空 hooks，禁用 auto-GC 与签名，而 remotes / filters 未配置；默认 hooks 与外部副作用仍存在，no_verify
    不跳过 post-commit。散列 / 构造不等于验证；Tree.check 与 refs 旧名接受有明确限度。82 个非测试 runtime 文件相同不是整包等同；Rust / merge3 缺席且 SHA-256
    未测。63 / 26 / 24 条有限检查重叠，不相加。原 402-test subset 为 FAIL，含 59 个 guard errors，未启动 hook；另一 184-test subset 有
    2 个 native skips，非原选集修复或完整 suite。无安全、性能、生产、合规、法律、签名或 IA 采用结论。
  conditions_en: Only local Git object, commit, reference/branch, comparison and history subfunctions of fixed
    Dulwich 1.2.15 pure-Python paths, excluding merge/conflicts, network wire, arbitrary-repository compatibility
    and complete version_control. Only new synthetic SHA-1 repositories were used, with isolated configuration,
    cleared hooks and disabled auto-GC/signing and no configured remotes or filters; default hooks/external
    effects still exist, and no_verify does not skip post-commit. Hashing/construction is not validation; Tree.check
    and legacy-reference acceptance remain bounded. The 82 matching non-test runtime files do not establish
    whole-package equality. Rust and merge3 were absent; SHA-256 was untested. The 63 / 26 / 24 finite cases
    overlap and are not additive. The original 402-test subset remains FAIL with 59 guard errors and no hook
    spawning; the different 184-test subset has 2 native skips and is not a repair or full suite. No security,
    performance, production, compliance, legal, signature or IA-adoption conclusion.
