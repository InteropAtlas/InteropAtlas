name_zh: SPDX Python Model 实现有界 CreationInfo 字段与 JSON-LD 表示机制
name_en: SPDX Python Model implements bounded CreationInfo field and JSON-LD representation mechanisms
context:
  version_context:
    source: spdx-python-model 0.0.6; fixed commit 6dc821545e2e96fc8501f47f946c8fa72e579bc4; verified wheel/sdist
      generated v3_0_1/model.py
    target: SPDX Specification 3.0.1 Core CreationInfo, not another edition or full SPDX
  scope:
    fields:
    - comment
    - created
    - createdBy
    - createdUsing
    - specVersion
    generated_class_iri: https://spdx.org/rdf/3.0.1/terms/Core/CreationInfo
    mechanisms: Generated field bindings and JSON-LD encoding/decoding; static source and released-archive inspection
      only
    excluded: Full SPDX validation, generic JSON-LD conformance, creator/tool authentication, trusted timestamps,
      signatures and universal roundtrip guarantees
  conditions_zh: 仅核生成的 CreationInfo 五字段：comment 可选单值字符串，created 必需单值时间，createdBy 至少一个 Agent 引用，createdUsing 可选 Tool
    引用，specVersion 必需单值 SemVer 形状字符串；类型和属性 IRI 对应 SPDX 3.0.1。赋值/解码会检查类型和模式，但缺少必填值/数量约束由编码阶段检查，构造或加载成功不等于合规。specVersion
    语法合法不保证值为 3.0.1。Agent/Tool 可以是未解析字符串，写出这些引用不认证身份、创建事实或工具历史；实际对象仍受自身编码要求约束。created 可指元素最后变更而非导出时间；小数秒字符串被拒绝，datetime
    微秒截去，零偏移可归一至 UTC，非零时分偏移字符串被 Z 模式拒绝而非转换，datetime 时区偏移秒会先截去再作 UTC-Z 检查，无时区 datetime 依赖主机时区。未知属性不自动保留，空白节点 ID 和对象顺序可能改变，不承诺任意文档无损往返。JSON-LD
    读写及按已识别上下文选择绑定是有限机制，不代表通用 JSON-LD/完整 SPDX 处理；输出摘要不是签名或真实性验证。生成代码证据来自重算哈希的发布归档成员，非虚构 GitHub 源文件；生成器的版本化输入 URL/本地覆盖不证明原始构建输入内容。Python>=3.9、Beta
    和 Apache-2.0 为声明；无必需运行时依赖，shacl2code==1.1.0 是构建依赖。未安装、导入、执行或测试库，未网络查询身份，未作生产就绪、完整标准符合性、第三方互通或 IA 采用判断，不改变 IA
    来源规则。
  conditions_en: 'Only the generated five-field CreationInfo mapping is covered: optional scalar comment, required
    scalar created, one or more Agent references in createdBy, optional Tool references in createdUsing, and required
    scalar SemVer-shaped specVersion; type/property IRIs correspond to SPDX 3.0.1. Assignment/decoding checks applicable
    types/patterns, but missing-value/cardinality checks occur at encoding, so successful construction/loading is
    not conformance. Valid specVersion syntax does not require value 3.0.1. Agent/Tool references may remain unresolved
    strings; writing them authenticates neither identities, creation facts nor tooling history, while supplied objects
    remain subject to their own encoding requirements. Normatively created can mean element last-change time rather
    than export time. Fractional-second strings are rejected; datetime microseconds truncate; zero offsets can normalize
    to UTC, strings with nonzero hour/minute offsets fail the Z pattern rather than converting; datetime timezone-offset
    seconds are truncated before the UTC-Z check, and naive datetime behavior depends on host timezone. Unknown
    properties are not automatically preserved; blank-node IDs and object ordering can change, so no universal lossless
    roundtrip is asserted. JSON-LD reading/writing and recognized-context binding selection are limited mechanisms,
    not generic JSON-LD or complete SPDX processing; output digests are not signatures or authenticity checks. Generated-code
    evidence is a rehashed released archive member, not an invented GitHub source path; versioned generator-input
    URLs/local overrides do not prove original build inputs. Python>=3.9, Beta and Apache-2.0 are declarations;
    no mandatory runtime dependencies, and shacl2code==1.1.0 is build-only. No library installation/import/execution/testing,
    network identity lookup, production-readiness judgment, full conformance, third-party interoperability or IA
    adoption is established; IA provenance rules are unchanged.'
