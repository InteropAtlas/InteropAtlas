    JSON structure. This Community Group interchange specification is not a W3C Recommendation and is not on
    the W3C Standards Track. Token types follow explicit-type, reference-resolution or group-inheritance rules,
    not guesses from values; references must be resolved when actual values are needed, and cycles are forbidden.
    Processing tools must retain unknown extension data, but retention does not mean understanding its semantics.
    Only format-level exchange capability is reviewed, not arbitrary tool compatibility, equal visual results,
    the legacy visual_information_presentation context, or IA adoption.
