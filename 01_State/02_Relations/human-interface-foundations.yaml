    target: Existing IA capability human_system_interaction
  conditions_zh: 限定为可访问交互的界面语义与焦点信息，不是完整交互实现。规范列出的复合容器角色要求作者管理焦点；aria-activedescendant 将活动后代的焦点信息传给辅助技术时，实际
    DOM 焦点仍可在容器或控制输入上。aria-keyshortcuts 仅公开快捷键信息，不得使用户代理自动改变键盘行为，脚本键盘事件须由作者处理。不证明可用性评价或具体页面符合性。
  conditions_en: Limited to semantics and focus information for accessible interaction, not a complete interaction
    implementation. Authors must manage focus for the listed composite-container roles. With aria-activedescendant,
    assistive technology receives active-descendant focus information while DOM focus can remain on the container
    or controlling input. aria-keyshortcuts exposes shortcuts without automatically changing user-agent keyboard
    behavior; authors must handle scripted keyboard events. This does not establish usability evaluation or
    page conformance.
