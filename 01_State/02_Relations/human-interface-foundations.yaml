  conditions_zh: 仅在编写针对 WCAG 2.2 要求的人工或自动测试规则时，记录 ACT Rules Format 1.1 与 WCAG 2.2 的配合用途：ACT 提供规则描述、适用性、预期及要求/结果映射结构，WCAG
    提供被测试的无障碍要求。须区别 Conformance Requirement 与 Secondary 映射。对前者，任一 failed 表示该测试对象未满足所映射要求；全部 passed 或 inapplicable
    通常仍可能需要进一步测试。只有具体 satisfying test 的全部结果均为 passed，才据该映射判定该测试对象满足对应要求；不能将这点扩大到未测要求或完整页面。Secondary 须按具体映射解释。ACT
    规则结果不是 WCAG 成功准则自身的 passed/failed 标签，也不是完整 WCAG2.2符合性证明；页面符合性仍须满足 WCAG §5.2 的全部要求，包括完整页面、完整流程等边界。该边不是要求必须使用
    ACT、完整测试覆盖、工具准确性/互通或 IA 页面符合性/采用声明。源文档将 WCAG22 列为资料性参考，不改成规范性依赖。
  conditions_en: 'Limited to the existing complementary use when authoring manual or automated test rules for
    WCAG 2.2 requirements: ACT Rules Format 1.1 structures rule descriptions, applicability, expectations and
    requirement/outcome mappings; WCAG supplies the accessibility requirements being tested. Conformance Requirement
    and Secondary mappings must be distinguished. For a Conformance Requirement, any failed outcome means that
    the mapped requirement is not satisfied for that test subject; all passed or inapplicable outcomes may
    still need further testing. Only all-passed outcomes of a specific satisfying test establish satisfaction
    of its mapped requirement for that test subject, not untested requirements or an entire page. Secondary
    results require their particular mapping. ACT outcomes are not WCAG success-criterion passed/failed labels
    or proof of complete WCAG 2.2 conformance; page conformance still needs all WCAG section 5.2 requirements,
    including full-page and complete-process boundaries. This does not require use of ACT or establish complete
    test coverage, tool accuracy/interoperability, or IA-page conformance/adoption. The source lists WCAG22
    as an informative reference, not a normative dependency.'
