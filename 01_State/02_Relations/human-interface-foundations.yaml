    target: Existing IA capability visual_information_presentation
  conditions_zh: 沿用旧边的有限范围：通过具名的设计决策值及其类型，支持视觉呈现决策在设计、转换和文档工具之间复用。格式定义值的交换表示，不负责选择合适的视觉层级、排版或可用性规则；具体呈现仍依赖消费这些值的工具和实现。它是面向实现的社区组格式报告，而非
    W3C Recommendation；不证明任意工具已兼容、输出视觉一致或 IA 已采用。
  conditions_en: Within the existing edge’s limited scope, named design-decision values and their types support
    reuse of visual-presentation decisions across design, translation and documentation tools. The format represents
    values for exchange; it does not choose appropriate visual hierarchy, typography or usability rules. Actual
    presentation depends on consuming tools and implementations. This is a Community Group format report intended
    for implementation, not a W3C Recommendation; arbitrary-tool compatibility, visually identical output and
    IA adoption are not established.
