  conditions_zh: 文献级模型使用：§1.1 以人可读函数式记法表达 PROV-DM 实例，§3 将模型构件映射到语法并规定附加语义规则；C.1 明确规范引用同日 PROV-DM Recommendation。不是软件依赖、解析器实现或验证结果，不推导完整
    Constraints 有效性、溯源真实性或 IA 采用。两端均仅限所列原始出版物，未审阅或整合勘误；不改既有 DM 身份和历史采用说明。
  conditions_en: 'Publication-level model use: section 1.1 expresses PROV-DM instances in human-readable functional
    notation; section 3 maps model constructs to syntax and specifies additional semantic rules. C.1 normatively
    references the same-date PROV-DM Recommendation. Not a software dependency, parser implementation or validation
    result; no full Constraints validity, provenance truth or IA adoption follows. Both endpoints refer only to
    the named original publications; errata were not reviewed or consolidated. Existing DM identity and historical
    adoption text remain unchanged.'
