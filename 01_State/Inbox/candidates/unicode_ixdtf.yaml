  源码证据限定新建 UTF-8 IxdtfParser::from_str(...).parse() 的默认 Some handler，以及调用方显式调用 UtcOffsetRecordOrZ::resolve_rfc_9557()。正面输入子集为有效
  RFC 式四位年 YYYY-MM-DD、T、HH:MM:SS（秒 00–59）、可选 1–9 位点分小数、Z 或 ±HH:MM；可选一个放在前面的非关键时区注释及一个非关键 u-ca，名称/值和相互一致性由调用方约束。记录返回日期/时间/偏移、时区原始名称或数值偏移、首个历法原始值；未知普通非关键
  key 被忽略，未知普通关键 key 返回 UnrecognizedCritical。Z 保留为单独枚举，只有显式 helper 才映射为负零偏移，已有正/负数值偏移原样返回；不是自动计算瞬时值或保留原字符串的序列化保证。
  parser 同时接受日期单独、基本/扩展年、缺偏移和其他 Temporal 形式，成功不等于严格 RFC 验证。时区 critical 标志只捕获不处理，时区名无需在数据库存在，offset/zone 一致性留给应用；历法不查询
  CLDR/转换，u-ca 结果不保留其 critical 标志。不声明处理关键时区或关键历法的应用语义。重复历法全部排除在正面范围外：代码与首项比较，两个值不同且首项/当前项关键时会报错，但相同重复关键项不会更新首项状态，不能推广成任意重复组合的正确关键语义。下划线实验
  key、全部注册 key、无效输入穷尽验证、其他时间精度/闰秒、自定义 handler、UTF-16、duration、写入、时区/历法解析和规则查询均未纳入。只静态阅读源码与上游测试文本，代表性输入是源路径推演而非 Rust
  运行；未安装、构建、执行测试或互通、安全、生产适用性、时钟同步/精度、IA 采用验证。 实验下划线key在默认路径并不作RFC§3.2专门拒绝；时区.、..或slash后数字等词法外输入也不能作为严格拒绝保证。代码消费超过9位的小数，最多累计前18位且位数饱和255；正面≤9是本次证据范围，不是声称其他精度被拒绝。raw
  from_utf8和UTF-16均不在此from_str子集中。
