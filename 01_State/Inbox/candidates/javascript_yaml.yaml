- 'The npm yaml package from eemeli/yaml, fixed to 2.9.1, parses and emits YAML text using JavaScript values.
  Its YAML 1.2 support is related to specification revision 1.2.2, which defines the same 1.2 language without
  normative changes; this is a bounded implementation link, not full conformance. The version:''1.2'' default
  does not force every document to 1.2: explicit or inherited YAML 1.1 stream contexts are outside this link.
  Default Core leaves yes/no/on/off as strings, interprets 012 as decimal 12, and accepts nonfinite numbers; it
  is not automatic JSON compatibility. schema:''json'' selects YAML''s JSON-compatible schema, not JSON Schema/Draft
  validation. Default JavaScript Number can lose integer precision; intAsBigInt:true preserves integers, not arbitrary-precision
  floats, and reparsing emitted BigInt needs the option again. Object keys stringify: numeric 1 and string "1"
  can collide, complex keys warn, and null becomes an empty key. mapAsMap:true retains the checked numeric/string
  distinction but uses JavaScript Map identity, not universal YAML key equivalence. Default uniqueKeys rejects
  the checked repeated scalar key, but scalar === comparison also misses repeated NaN and does not deep-compare
  alias or collection keys: equal sequence keys can remain distinct Map keys, while aliases can collapse without
  DUPLICATE_KEY. With uniqueKeys:false the checked duplicate is last-wins. parseDocument can retain errors while
  toJS returns partial values and Document.toString refuses that error-bearing document; on the checked duplicate
  input, parse with logLevel:''silent'' also returned last-wins data. Callers must inspect errors and warnings,
  including individual stream documents. Aliases can share references or create cycles, not just JSON trees; small
  alias-limit checks do not establish resource safety. Core''s default resolveKnownTags:true also resolves explicit
  YAML 1.1 tags, including timestamp to Date and binary to Buffer; disabling known tags or encountering an unknown
  tag can warn and return a string rather than reject. Application custom-tag callbacks and optional merge keys
  are extensions, not core interoperability guarantees. Document preserved selected comments but changed lexical
  form; parse/stringify lost comments and style, and trailing-comment association is not fully stable. The checked
  native Date became a string after default stringify/parse; data roundtrip is not universal native-value preservation,
  lossless cross-language, canonical or signature-normalized output. Published npm CommonJS bytes were exercised
  in 47 finite diagnostics (one version and 46 behavior records) plus a separate three-record key supplement;
  no upstream full suite, source build, browser parity, all-API, fuzz, security or supply-chain certification
  is claimed.'
