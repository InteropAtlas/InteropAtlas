unknowns:
- 主体是 PyPI prov 的独立 Python 库，不是 W3C PROV-DM/PROV-O 文献、整个 PROV 家族或 ProvStore 服务。官方发布 3.2.3/tag 指向 f9fe0198f8ec5d06ea2e7aac20a1fcb85f8769cf；manifest、__version__
  与固定版 PyPI 元数据一致，MIT 仅据固定 manifest/LICENSE。核验官方 wheel prov-3.2.3-py3-none-any.whl（1014147 字节，SHA256 bc392921d2cc7e02e03312b2d00da6c7cfdaaee261f76a56f7c57d01f988164e）等于发布
  digest，1653 条 RECORD digest 与十五份已捕获代码/测试文件的 wheel/source 字节一致。仅此 wheel/文件对照，不推广到 sdist、所有发布文件、其他版本或未来可用性，也不是安全审计。
  正面范围为调用方提供角色正确的限定名、namespace 与适当属性时，以 ProvDocument/ProvBundle 工厂建立 Entity、Activity、Agent，以及 generation(entity,
  activity)、usage(activity, entity)、derivation(generatedEntity, usedEntity, activity, generation, usage)、attribution(entity,
  agent)、association(activity, agent) 记录；保存于文档并按类型或标识查询。额外属性与角色引用是来源断言，不证明现实事件或责任真实。仅显式 format="json" 的 PROV-JSON
  内存字符串编解码；这是库的交换设施，不另建 JSON 或 PROV-JSON 格式符合性边。Agent 子类型须用实际 QualifiedName 的 prov:type 值，不把普通 prefixed-name 字符串自动当作等价
  QName；Plan 独立工厂不在范围。 作者于 2026-10-29 用 Python 3.12.14 -I -S 从上述 wheel 直接 import，未安装依赖；九项内存 smoke 包含一个九记录图、独立手写
  JSON fixture、限定 string/int/bool/QualifiedName 回读以及三个宽松行为 characterization。未执行 upstream 完整测试套件、跨实现互通、时间/所有数据类型与任意输入
  roundtrip。默认 serializer registry 初始化会导入其他无依赖 codec 模块，但只调用 json codec；未安装或调用 RDF/XML 等可选依赖，未执行网络/写文件/子进程路径，Python
  audit guard 未观察这些尝试，不冒充 OS 隔离或安全认证。 3.2.3 不在 assertion time 强制完整结构约束：generation(None) 仍生成记录，多个 prov:value 接受；不证明完整
  PROV-DM 结构/语义或 PROV-CONSTRAINTS、时间先后、推理/unified()、因果有效性、权限或真实性。JSON 重复键发出未来拒绝警告并保留最后值，部分畸形/旧式输入仍接受；无严格 parser
  或安全保证。正面范围排除非法/缺项输入、完整 datatype/时间语法、nested bundle、Bundle-as-entity、PROV-Dictionary、PROV-O/RDF/XML/JSON-LD/PROV-N、图像渲染、NetworkX、服务托管、自动工作流采集、密码验证与
  IA 采用。既有 prov_o 与 w3c_prov_o 身份问题不处理也不连边。
