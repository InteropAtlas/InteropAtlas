- The official github/cmark-gfm C library and CLI, fixed to 0.29.0.gfm.13, parses configured GFM documents into
  AST, HTML fragments and selected CommonMark representations. It is distinct from core cmark, the GFM specification
  and GitHub production rendering. The pinned README and corpus header connect it to GFM 0.29 (2019-04-06), but
  source and public corpora are not identical. A custom GCC static build with --unsafe exactly matched 670 active
  source examples; two disabled task-list cases were separately exercised in their original configuration lacking
  tasklist and did not match, not a whole-spec pass. Of 677 public cases, globally enabling all five extensions
  gives 651 exact matches and 26 differences; a separate section-selective diagnostic gives 661 matches and 16
  differences, not a recommended parsing mode. The shared 16 comprise nine nested-strong structures, one oversized
  numeric entity, two XMPP autolinks, two raw HTML comments and two checkbox attribute-order/void-element serialization
  differences. The latter still emit checked/unchecked disabled checkboxes, not missing task-list functionality.
  The extra ten all-five differences are five tagfilter and five autolink interactions with core examples. HTML
  was not normalized to remove differences; profiles and replays overlap and are not accumulated as independent
  coverage. The CLI needs explicit -e table -e strikethrough -e autolink -e tagfilter -e tasklist. The tested
  default CLI, options=0 convenience API and registration-only paths do not produce GFM tables. API parsing requires
  attachment, and HTML rendering also needs the extension list; passing NULL bypasses tagfilter even after attachment.
  Footnotes are a separate opt-in, not one of these five; not every convenience-option behavior is core-only.
  Enabled strikethrough accepts one or two tildes by default, with a double-tilde option. Task markup is static
  and disabled, not GitHub interaction. HTML defaults omit raw HTML and empty checked dangerous URLs; --unsafe
  allows them. Tagfilter only escapes the start of nine named tags, is not a sanitizer, and retained the checked
  onclick attributes and javascript URLs. CLI --safe is rejected; the legacy API SAFE bit has no effect and cannot
  revoke UNSAFE. The checked data:image/png exception applies to link href as well as image src. Invalid UTF-8
  can pass through by default; --validate-utf8 replaces rather than rejects it, while NUL is replaced without
  the flag too. CommonMark output can retain raw nodes and rewrite lexical form. Six separate roundtrips retained
  resulting HTML but only one retained source bytes, not universal losslessness. The 43 finite records are one
  version, one extension inventory and 41 CLI/API observations; six roundtrips and specification profiles remain
  separate. No full GFM conformance, all-API/input, browser/dynamic-ABI, upstream full-suite, performance, security,
  supply-chain or IA-adoption claim is made.
