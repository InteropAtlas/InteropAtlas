- 'From fixed source only, this reviews the server ls-refs path after upload-pack has selected wire protocol v2:
  serve dispatches the command, reads peel, symrefs, ref-prefix and unborn arguments, filters references under repository
  namespace, hideRefs and configuration conditions, formats object IDs/refnames and conditional symref targets,
  peeled objects or unborn HEAD, then writes stdout pkt-lines and flushes. Writing/flushing stdout is not evidence
  of network transfer, peer receipt or reliable delivery. ref-prefix is an optimization, not strict authorization
  filtering; at 65,536 or more prefix lines the optimization is cleared, and the specification permits nonmatching
  references for clients to filter. lsrefs.unborn advertise (default), allow and ignore distinguish advertisement/acceptance
  behavior; hidden-reference processing does not establish security isolation. Repository, configuration, resource
  and output errors apply, with no every-input/repository success or complete-reference-inventory guarantee. Source
  and test recipes were inspected only: no downloaded Git installation, build, execution, protocol test or network
  service. Environment Git used for IA bookkeeping is not execution evidence for this source. Fetch/packfile/clone/push,
  complete negotiation, complete Git/v2 conformance, repository atomic consistency, authentication/TLS/SSH/security,
  cross-implementation interoperability, performance, current-platform compatibility and IA/GitHub deployed-version
  or adoption claims are excluded; unreviewed functions are not asserted absent.'
