unknowns:
- 官方 URL 是可变文档；1.10只表示本次审阅的显式 DTD 上下文，不表示最新版本、独立不可变发布包或已核实所有版本。发布时间及1.10的应用最低兼容版本未建立；不得从版权年或采集时间推定。
- 'root 元素说明称 resources 是唯一必需子元素，但所捕获1.10 DTD 声明 resources?；保留不一致，不选择优先来源或修复。version 的 #FIXED 声明不是 #REQUIRED。'
- 符合 DTD 不保证导入成功；媒体可访问性、读权限、应用数据/语义及实际导入导出行为未测试。未安装或运行 Final Cut Pro、转换器或验证样例，不保证完整或无损往返。
- 通用参考中的 Final Cut Pro10.4.9 最低版本及部分项目说明明确针对 FCPXML1.9，不外推为1.10兼容性结论。
- 有理数时间的位宽是 CDATA 属性旁注释而非 DTD 数值约束；颜色注释原文 ISO/IEC230001-8 不静默纠正，也不据此推断依赖。
- 不把格式等同于原生项目/资源库、FCPXML bundle、Final Cut Pro 应用、FCP7/xmeml、AAF或OTIO；这些身份、实现、采用、认证、安全及任何技术关系均不在本批接纳范围。
