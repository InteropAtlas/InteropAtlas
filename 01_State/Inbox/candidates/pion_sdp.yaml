unknowns:
- Pion SDP is the whole Pion Go library for session-description text parsing and serialization, module github.com/pion/sdp/v3,
  not Pion WebRTC, Pion RTP or a fictional standalone parser component. This record pins official tag v3.0.20 to
  source commit 8921edc83d51945017b2e1a987733a23bb9a9004; no latest-release or other-build equivalence is claimed.
  Static inspection covers caller-provided SDP strings/bytes through SessionDescription.UnmarshalString/Unmarshal
  into structured fields and Marshal back to text bytes. Each parse uses a fresh zero-valued SessionDescription;
  callers supply complete, valid supported inputs and non-nil media pointers. The represented fields are session
  v/o/s/i/u/e/p/c/b/t/r/z/k/a and media m/i/c/b/k/a, not a claim to interpret every extension. Parsing mutates the
  receiver directly, can leave partial state on error, and does not reset every existing field. It checks v=0 without
  assigning Version; receiver reuse is not a full-replacement operation. The state machine rejects unknown line
  types and fields disallowed in the current state, but EOF while reading the next line type can end successfully
  without proving mandatory-field completeness; this does not mean every truncated input succeeds. For camera compatibility,
  missing origin address type defaults to IP4/0.0.0.0; an explicit IP6 type with missing address defaults to ::.
  Some non-spec media-field orders are accepted. Partial type, IN/IP4/IP6 and base-port 0..65535 checks exist, but
  digit-by-digit uint64 accumulation lacks overflow checks; this is not a complete syntax, semantic or numeric-range
  validator. Session/media a= attributes have no known-name whitelist and normally split at the first non-leading
  colon into generic key/value, retaining unknown names without validating extension semantics. Empty values lose
  their colon when serialized. Marshal emits current fields in fixed order with CRLF without complete validity checking;
  LF, blank lines, field order and repeat-time shorthand can be normalized, so arbitrary byte-for-byte round trips
  are not guaranteed. The README only says SDP; Unmarshal/Marshal comments explicitly cite RFC4566 section 5 and
  the former also cites draft-ietf-rtcweb-jsep-24. This cannot establish an implementation of the existing RFC8866
  object. This batch accepts only the library, adds no technical relation or old RFC endpoint to force one, and
  leaves sdp_rfc8866 unchanged. Fixed source and test recipes were read only; no upstream installation, import,
  build, execution, tests or examples were performed. No network negotiation, offer/answer, ICE/DTLS/RTP interoperability,
  media transport, complete SDP/RFC conformance, security certification, performance or IA adoption is claimed.
  Unexamined library paths are not asserted absent. MIT is recorded only from the fixed LICENSE, not as legal suitability
  advice.
