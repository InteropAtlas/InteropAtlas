- 'The subject is commonmark/cmark, not commonmark.js, cmark-gfm, a language wrapper, GitHub production rendering,
  or the CommonMark standard itself. Release 0.31.2 was published on 2026-02-14; its lightweight tag points to eec0eeba6d31189fd828314576494566d539b1e3.
  The fixed test/spec.txt identifies spec 0.31.2 dated 2024-01-28, and its body after metadata is byte-identical
  to the published versioned specification. Only document_representation is proposed: headings, emphasis, lists,
  links, code and XML AST observations support structured document content/hierarchy/navigation. The 35 diagnostic
  checks comprise one version check and 34 behavior checks; the corpus uses a self-authored exact-byte harness,
  not the upstream test runner. UTF-8 diagnostics retain input/expected/observed hex. NUL and line endings can be
  normalized. The URL filter allows selected image data URLs; no blanket prohibition is claimed. Default HTML policy
  does not remove raw nodes from CommonMark/XML representations. The selected CommonMark roundtrip preserved resulting
  HTML, not source bytes. The build uses unchanged fixed source and its CMake-derived C file list with locally generated
  version/export headers because CMake was unavailable; it is not an upstream CMake build. No dynamic-library ABI
  or AST-mutation API exercise, groff/LaTeX output, fuzz/pathological/resource testing, browser execution, third-party
  interoperability, performance, security or IA adoption is claimed. COPYING includes separate source-component
  and documentation/test notices; license_expression and open_source are deliberately omitted rather than reducing
  those scopes to a legal conclusion.'
