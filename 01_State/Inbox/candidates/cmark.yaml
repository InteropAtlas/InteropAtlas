- The official cmark C parser/rendering library and CLI, fixed to 0.31.2, connects CommonMark document syntax to
  structural AST and HTML-fragment output. A custom local static build passed the 652 published CommonMark 0.31.2
  examples byte-for-byte with explicit --unsafe and 35 finite diagnostic checks (one CLI version check and 34 behavior
  observations); this is not the full upstream suite or all-input conformance. Core CommonMark is not GFM tables,
  task-list checkboxes, strikethrough or bare-URL autolinking. HTML output omits raw HTML and filters some URL schemes
  by default; --unsafe permits them, while legacy --safe is a no-op and cannot revoke --unsafe. This HTML-renderer-specific
  policy is not a sanitizer or security guarantee. Without --validate-utf8 an invalid byte can pass through; that
  option replaces invalid sequences, not rejects them. CommonMark re-rendering changes original markup and can preserve
  raw HTML. Source/blob and local binary hashes do not establish an official distribution build, reproducible build,
  signature/attestation verification or supply-chain certification.
