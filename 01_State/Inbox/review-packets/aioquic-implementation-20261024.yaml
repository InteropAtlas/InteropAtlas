    official_url: https://github.com/aiortc/aioquic
    description_zh: 面向 Python 客户端与服务器集成的开源 QUIC 与 HTTP/3 库。固定核验 1.7.0 的 Sans-I/O 协议核心与调用边界，仅接纳 QUIC v1 连接/数据报/流处理及
      HTTP/3 HEADERS、DATA、事件、SETTINGS 的有界实现。
    description_en: An open-source QUIC and HTTP/3 library for integration into Python clients and servers. This
      record fixes 1.7.0 and its Sans-I/O integration boundaries, covering bounded QUIC v1 connection/datagram/stream
      handling and HTTP/3 HEADERS, DATA, events and SETTINGS.
    open_source: true
    license_expression: BSD-3-Clause
    scope_notes_zh: '按既有 system/library 模式收录 aioquic 软件库，固定版本 1.7.0、annotated tag 1.7.0、commit 8c5c6b49ee8c0d19b310c9b9e6a3b6301360dbb0；GitHub
      为 aiortc/aioquic，包与导入名为 aioquic。tag 对象明确指向该 commit，版本文件与 PyPI 1.7.0 相符；不存在可核验的同名 GitHub Release 记录，不编造 release
      URL 或宣称最新版本。库不是 aiortc、RFC 文献、组织或另一个发行版主体。


      协议核心遵循 Sans-I/O：QuicConnection 由 API 调用、receive_datagram 及 get_timer/handle_timer 驱动，输出待发送数据报和事件；网络 I/O、定时器调度和持续发送由调用方或
      asyncio 适配层承担。1.7.0 会采用服务器 preferred address；每个 datagrams_to_send 返回值的目的地址都必须被使用，不能固定为初始 connect 地址，固定目标的
      connected UDP socket/隧道不能直接等同于完整集成。


      QUIC 关系只限定 RFC 9000 的 v1 客户端/服务器连接状态机、数据报处理与流传输路径；同库的 v2 不是 RFC 9000 范围。源码明确限制排队的远端 PATH_CHALLENGE 数量，并承认该资源限制偏离
      RFC 9000；这不是完整条款或所有可选功能符合性证明，也不据此保证安全或抗资源耗尽效果。


      HTTP/3 的 H3Connection 消费 QUIC 事件并生成 HTTP 事件，经 QUIC 流发送 HEADERS/DATA，处理控制流 SETTINGS，QPACK 编解码依赖 pylsqpack。调用方须传入
      QUIC 事件并驱动底层发送。该版本控制流解析器丢弃未使用的 GOAWAY 载荷，不把这些 API 称为完整 GOAWAY/优雅关闭实现；enable_webtransport 默认 False，扩展参数与功能不等于普遍默认可用。


      证书名称校验取决于 server_name 及 verification mode：低层配置的 server_name 默认 None，校验函数仅在其不是 None 时进行名称/IP 匹配；asyncio 客户端
      connect 会把未设置值补为 host。TLS context 客户端默认 CERT_REQUIRED、服务端默认 CERT_NONE，但显式配置可以覆盖。调用方仍需正确配置名称、信任锚及服务器证书；这些源码事实不是部署安全审计或通用安全保证。


      固定元数据声明 Python >=3.11、BSD-3-Clause；运行时依赖 certifi、cryptography>=43.0.0、pylsqpack>=1.0.0,<2.0.0、pyopenssl>=24、service-identity>=24.1.0。setup.py
      构建 aioquic._buffer C 扩展，不称为全栈纯 Python。上游 Development Status 5 - Production/Stable 分类只是其元数据声明，不代表 IA 稳定性认证、生产推荐或适用性评估。


      仅核验固定官方源码、测试定义、tag/PyPI 元数据及 IA 提案投影，未安装、构建或运行上游库/测试，未连接外部服务或执行网络/浏览器互通测试。README 的采用与互通测试说法未独立核验，不证明 IA 实际采用、外部互通、性能或完整
      RFC 符合性。不新增 capability，也不附带 RFC 9001、QUIC v2、QPACK、WebTransport、WebSocket 或 Datagram 扩展关系。'
    scope_notes_en: 'The aioquic software library follows the existing system/library pattern, fixed at version
      1.7.0, annotated tag 1.7.0, commit 8c5c6b49ee8c0d19b310c9b9e6a3b6301360dbb0; GitHub aiortc/aioquic and package/import
      name aioquic. The annotated tag resolves to this commit and the version file agrees with PyPI 1.7.0. No matching
      GitHub Release record was available; no release URL or latest-version claim is invented. The subject is not
      aiortc, an RFC document, an organization or a separate release subject.


      The protocol cores are Sans-I/O: API calls, receive_datagram and get_timer/handle_timer drive QuicConnection,
      which supplies outgoing datagrams and events. Callers or the asyncio adapter perform network I/O, timer scheduling
      and transmission. Version 1.7.0 can use the server preferred address; each destination returned by datagrams_to_send
      must be honored rather than fixed to the initial connect address. A connected UDP socket or single-destination
      tunnel is not automatically a complete integration.


      The QUIC relationship is limited to RFC 9000 v1 client/server connection state, datagram processing and stream
      transfer. Same-library QUIC v2 is outside RFC 9000. Source explicitly bounds queued remote PATH_CHALLENGE
      values and acknowledges a deviation from RFC 9000. This is not all-clause/all-option conformance evidence
      and does not establish security or resource-exhaustion resistance.


      H3Connection consumes QUIC events, emits HTTP events, sends HEADERS/DATA over QUIC streams and processes control-stream
      SETTINGS; QPACK encoding/decoding uses pylsqpack. The caller supplies QUIC events and drives transmission.
      Its control parser discards unused GOAWAY payload, so complete GOAWAY/graceful-shutdown behavior is excluded.
      enable_webtransport defaults to False, and extension settings do not establish universal default feature availability.


      Certificate-name checking depends on server_name and verification mode. Bare configuration defaults server_name
      to None; certificate verification performs name/IP matching only when it is not None. asyncio client connect
      fills an unset value from host. The TLS context defaults to CERT_REQUIRED for clients and CERT_NONE for servers,
      subject to explicit override. Callers still configure appropriate names, trust anchors and server certificates.
      These source facts are not a deployment-security audit or blanket security guarantee.


      Fixed metadata declares Python >=3.11, BSD-3-Clause, and runtime dependencies certifi, cryptography>=43.0.0,
      pylsqpack>=1.0.0,<2.0.0, pyopenssl>=24 and service-identity>=24.1.0. setup.py builds the aioquic._buffer C
      extension, so the stack is not entirely pure Python. The upstream Development Status 5 - Production/Stable
      classifier is a metadata declaration, not IA stability certification, a production recommendation or a suitability
      assessment.


      Only fixed official source, test definitions, tag/PyPI metadata and IA proposal projections were checked.
      No upstream install, build or test execution, external-service connection or network/browser interoperability
      test was performed. README adoption/interoperability statements were not independently verified; no IA adoption,
      external interoperability, performance or complete RFC conformance is asserted. No capability or RFC 9001,
      QUIC v2, QPACK, WebTransport, WebSocket or Datagram-extension relation is added.'
