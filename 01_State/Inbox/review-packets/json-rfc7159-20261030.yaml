    official_name: The JavaScript Object Notation (JSON) Data Interchange Format
    description_zh: 'JSON 的固定 RFC 7159 历史规范文档，2014 年 3 月以 Proposed Standard 发布，废止 RFC 4627 和 RFC 7158，后被 RFC 8259
      废止。第 2 节允许任意 JSON 值作顶层文本，第 4 节要求对象成员名 SHOULD 唯一（不是 MUST），第 8.1 节允许 UTF-8/16/32 且默认 UTF-8。仅限 2014 年 3 月原始出版物；官方信息页显示九项勘误报告，本轮未核验内容或处理状态，不声称已整合勘误、当前完整修订语义或实现符合性。
      保留历史引用不代表推荐旧版、与 RFC 8259 完全等价、实现互通或 IA 采用。


      English scope and limitations:


      Historical RFC 7159, published March 2014 as a Proposed Standard, obsoleting RFC 4627 and RFC 7158; later
      obsoleted by RFC 8259. Section 2 permits any JSON value at the top level; section 4 says member names SHOULD
      be unique, not MUST; section 8.1 permits UTF-8/16/32 with UTF-8 as default. Original publication only. The
      information page indicates nine errata reports; contents and status were not reviewed. No integrated errata,
      complete corrected semantics, implementation conformance, equivalence to RFC 8259, interoperability or IA
      adoption is claimed. Historical preservation is not a recommendation to use the obsolete document.'
    description_en: Historical RFC 7159, published March 2014 as a Proposed Standard, obsoleting RFC 4627 and RFC
      7158; later obsoleted by RFC 8259. Section 2 permits any JSON value at the top level; section 4 says member
      names SHOULD be unique, not MUST; section 8.1 permits UTF-8/16/32 with UTF-8 as default. Original publication
