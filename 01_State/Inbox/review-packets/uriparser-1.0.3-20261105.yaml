      use RFC 3986 base-URI determination; a relative $self is first resolved against the next base source, and
      Schema Objects additionally follow their JSON Schema $id rules. Identification is not network retrieval or
      an API call. Retrieval support is optional, without guarantees of accessibility, safety or tooling interoperability.
      This limits only the OpenAPI 3.2.1 incoming edge; other incoming edges retain their own documents and conditions.
