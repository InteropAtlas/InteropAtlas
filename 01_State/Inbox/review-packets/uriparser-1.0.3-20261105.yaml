      spaceToPlus and normalizeBreaks set to URI_FALSE. The caller supplies a valid readable range [inFirst,inAfterLast)
      with ordered pointers into the same object; if inAfterLast is NULL, input must be a valid NUL-terminated string.
      Output must be a disjoint writable buffer with valid lifetime and capacity at least 3 × n + 1, where n is
      the input-range length or characters before NUL, using overflow-safe capacity arithmetic. The API has no output-capacity
      argument and performs no capacity check. It rejects equal starting input/output pointers only, not general
