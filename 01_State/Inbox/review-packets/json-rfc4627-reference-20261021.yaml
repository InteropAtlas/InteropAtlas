      conditions_zh: 仅记录 JSON-RPC 2.0 官方规范第 1/2 节对 RFC 4627 数据格式和类型系统的明确引用；不把该引用升级为 RFC 8259，也不据此断言 MCP 消息直接以 RFC
        8259 为版本目标。RFC 4627 顶层对象/数组、编码及解析/生成规则按历史版本保留，JSON-RPC 请求、响应、通知与批处理另有协议约束。uses 不作传递性或实际实现符合性证明；JSON-RPC
        可有批处理不等于其宿主协议允许批处理。
      conditions_en: Records only the explicit RFC 4627 data-format and type-system reference in sections 1/2 of
        the official JSON-RPC 2.0 specification. It does not upgrade that reference to RFC 8259 or establish a direct
        RFC 8259 version requirement for MCP messages. The historical RFC 4627 top-level object/array, encoding
        and parsing/generation rules are preserved; JSON-RPC requests, responses, notifications and batches have
        additional protocol constraints. uses is not treated as transitive or as implementation-conformance proof;
        JSON-RPC batch support does not imply that a host protocol allows batches.
