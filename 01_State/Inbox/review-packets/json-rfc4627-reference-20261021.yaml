    name_zh: RFC 4627 JSON 历史格式说明
    name_en: Historical JSON format description (RFC 4627)
    official_name: The application/json Media Type for JavaScript Object Notation (JSON)
    description_zh: 2006 年 7 月发布的 Informational RFC，描述 JSON 数据格式与 application/json 媒体类型；本记录保留 JSON-RPC 2.0 明确引用的历史文档身份。
    description_en: An Informational RFC published in July 2006, describing JSON and the application/json media
      type; this record preserves the historical document explicitly cited by JSON-RPC 2.0.
    version: RFC 4627
    external_identifiers:
    - namespace: rfc
      value: '4627'
    official_url: https://www.rfc-editor.org/rfc/rfc4627.txt
    versions:
    - version: RFC 4627
      status: obsoleted
      url: https://www.rfc-editor.org/info/rfc4627/
    capabilities:
    - data_serialization
    scope_notes_zh: 这是历史 Informational 文档，不是 IETF 标准轨或现行 JSON 定义；RFC Editor 标为已被 RFC 7159 废止。第 2 节 JSON text 顶层限对象或数组，不把后来允许任意
      JSON 值作顶层的规则写回本版。第 3/6 节描述 Unicode 编码、UTF-8 默认及 UTF-16/32；第 4 节允许解析器扩展与实现限制，第 5 节要求生成文本严格遵循语法。保留历史引用不代表推荐旧版、接受旧安全建议、与
      RFC 8259 完全等价或实现互通；本轮不建立替代/更新语义边。
    scope_notes_en: A historical Informational document, not an IETF Standards Track RFC or the current JSON definition;
      RFC Editor lists it as obsoleted by RFC 7159. Section 2 restricts a top-level JSON text to an object or array;
      later allowance for any JSON value is not backported here. Sections 3/6 describe Unicode encoding, UTF-8 by
      default and UTF-16/32; section 4 allows parser extensions and implementation limits, while section 5 requires
      generated text to follow the grammar strictly. Preserving a historical citation does not recommend the old
      version or its security advice, assert full equivalence to RFC 8259 or implementation interoperability. No
      update/obsolescence relation is introduced in this slice.
