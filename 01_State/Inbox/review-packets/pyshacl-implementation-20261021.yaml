      conditions_zh: 依据固定源码和文档所述 2017 Recommendation 目标，限定 RDF 图的 Core/SPARQL 约束检查和验证报告。推理/附加特性、focus/shape 选择及
        severity 容许选项会影响结果；ValidationFailure 或异常不是普通不符合报告。19 个本地可信图示例仅为补充，不是完整符合性认证，不延伸到 SHACL 1.2/全部扩展、任意宿主协议或跨实现互通，也不是
        IA 采用该标准或库的决定。
      conditions_en: Based on the fixed source and documented 2017 Recommendation target, limited to RDF graph Core/SPARQL
        constraint checks and validation reports. Inference/additional features, focus/shape selection and severity
        allowances affect results; ValidationFailure or exceptions differ from ordinary non-conformance reports.
        Nineteen local trusted-graph examples supplement review, not full certification. No SHACL 1.2/all-extension
        support, arbitrary host protocol or cross-implementation interoperability, or IA adoption decision follows.
