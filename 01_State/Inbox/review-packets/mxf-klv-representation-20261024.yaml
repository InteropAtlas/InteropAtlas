    scope_notes_zh: 保留 ST 377-1 的既有 work-level 标识，本文固定 2019 版（2019-11-28 批准）。描述依据封面身份和 §§6.3–6.3.9 的已核验 KLV 条款，不把其他
      MXF 规范、操作模式、素材容器映射、编码器或解码器当作同一主体。官方 187 页 PDF 的第 8 页 Scope 存在 /StrikeOut 批注（元数据日期 2020-01-28），其权威性及含义未知；不将被划线文字重现为干净规范内容，不推断勘误、撤销或批注无害。原始
      PDF 字节/批注保留，封面只有链接批注，引用页 9 和操作页 30/32/33 没有批注。仅据这些未受该批注覆盖的证据记录文件中的 KLV 依赖：可选 Run-In 除外，数据连续按 KLV 编码；ST 336
      的一般能力须受 MXF 的长度、键、集合/包及递归限制约束。独立复核必须明确接受此有限证据选择。没有实施文件解析、编解码或符合性测试，不保证完整标准符合性、任意 KLV/MXF 兼容、codec/profile/软件支持、安全、认证或
      IA 采用。
    scope_notes_en: 'Preserves the existing ST 377-1 work-level identifier while fixing this review to the 2019
      edition, approved 2019-11-28. The description rests on cover identity and verified KLV provisions in §§6.3–6.3.9,
