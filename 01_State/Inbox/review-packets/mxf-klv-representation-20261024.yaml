    - url: https://pub.smpte.org/latest/st377-1/st377-1-2019.pdf#page=30
      title: ST 377-1 §§6.3–6.3.1 — operative KLV reliance, optional Run-In exception
      language: en
      accessed: '2026-10-24'
    - url: https://pub.smpte.org/latest/st377-1/st377-1-2019.pdf#page=32
      title: ST 377-1 §§6.3.4–6.3.7 — narrower length/set/pack rules and SHOULD distinction
      language: en
      accessed: '2026-10-24'
    - url: https://pub.smpte.org/latest/st377-1/st377-1-2019.pdf#page=33
      title: ST 377-1 §§6.3.7–6.3.9 — defined-length packs, key size and recursion constraints
      language: en
      accessed: '2026-10-24'
    - url: https://pub.smpte.org/pub/st336/st0336-2017.pdf#page=6
      title: ST 336 §5.1 — KLV structure
      language: en
      accessed: '2026-10-24'
    - url: https://pub.smpte.org/pub/st336/st0336-2017.pdf#page=12
      title: ST 336 §5.3 — general length rules allow narrower application restrictions
