      official 187-page PDF contains a /StrikeOut annotation over page 8 Scope, with metadata dated 2020-01-28;
      its authority and meaning are unknown. Struck-through text is not presented as clean normative content, nor
      is an erratum, withdrawal or harmless markup inferred. Original bytes and annotations are preserved. The cover
      has link annotations only; reference page 9 and operative pages 30/32/33 have no annotations. Only this unaffected
      evidence supports the bounded KLV dependency: contiguous KLV data except optional Run-In, subject to MXF-specific
      length, key, set/pack and recursion constraints. Independent review must explicitly accept this evidence choice.
      No file parsing, codec or conformance testing; no full-standard conformance, arbitrary KLV/MXF compatibility,
      codec/profile/software support, security, certification or IA-adoption claim.'
