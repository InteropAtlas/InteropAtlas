relations:
- proposal_id: smpte_st292_uses_iec_61169_8_2007_annex_a
  proposed_record:
    id: smpte_st292_uses_iec_61169_8_2007_annex_a
    type: relation
    name_zh: ST 292-1 使用 IEC 61169-8 附录 A 定义所需 75 Ω BNC 接口
    name_en: ST 292-1 uses IEC 61169-8 Annex A for its required 75 Ω BNC interface
    source: smpte_st292
    relation: uses
    target: iec_61169_8_2007
    context:
      version_context:
        source: SMPTE ST 292-1:2018
        target: IEC 61169-8:2007, Edition 1.0, normative Annex A (75 Ω interface dimensions)
      conditions_zh: 第 8.2.1 节（第 8 页）要求公母连接器采用附录 A 定义的 75 Ω BNC；本边仅记录该接口机械依据。第 8.2.2–3 节的电缆响应及终接线路回波损耗要求仍独立适用，不指定某种电缆不等于任意电缆可用。不把
        50 Ω 标题当作 75 Ω SDI 条件，也不证明跨速率、任意线缆、距离、载荷或设备互通。
      conditions_en: Clause 8.2.1 (page 8) requires male and female 75 Ω BNC connectors defined by Annex A; this
        edge records that mechanical-interface basis only. Cable-response and terminated-line return-loss requirements
        in 8.2.2–3 still apply; absence of a named cable type does not permit arbitrary cables. The 50 Ω title does
        not establish 75 Ω SDI suitability. No cross-rate, arbitrary-cable, distance, payload or device interoperability
        is asserted.
    evidence:
    - url: https://pub.smpte.org/pub/st292-1/st292-1-2018.pdf
      title: SMPTE ST 292-1:2018 — sections 3 and 8.2.1–3, pages 4 and 8–9
      language: en
      accessed: '2026-10-24'
    - url: https://webstore.iec.ch/en/iec_catalog/product/preview/?id=L3B1Yi9wZGYvcHJldmlldy9pbmZvX2llYzYxMTY5LTh7ZWQxLjB9ZW4ucGRm
      title: IEC 61169-8:2007 public preview — normative Annex A title identifies 75 Ω interface dimensions
      language: en
      accessed: '2026-10-24'
    last_verified_at: '2026-10-24T10:46:48.177157+00:00'
    last_verified_by: Agent — OpenAI / dot, public IEC and SMPTE source evidence executor
- proposal_id: smpte_st424_uses_iec_61169_8_2007_annex_a
  proposed_record:
    id: smpte_st424_uses_iec_61169_8_2007_annex_a
    type: relation
    name_zh: ST 424 使用 IEC 61169-8 附录 A 作为优选 75 Ω BNC 的机械依据
    name_en: ST 424 uses IEC 61169-8 Annex A for preferred 75 Ω BNC mechanics
    source: smpte_st424
    relation: uses
    target: iec_61169_8_2007
    context:
      version_context:
        source: SMPTE ST 424:2012
        target: IEC 61169-8:2007, Edition 1.0, normative Annex A (75 Ω interface dimensions)
      conditions_zh: 第 7.3.1–2 节（第 8 页）将附录 A 用作优选 75 Ω BNC 的机械依据；超过 3 GHz 可用性及 3 GHz 回波损耗条件来自 ST 424，不能由机械吻合推出。满足相应电气条件的应用专用替代连接器获准使用，不主张所有实现必须选用
        BNC。不把 50 Ω 标题当作 75 Ω SDI 条件，也不证明跨速率、任意线缆、距离、载荷或设备互通。
      conditions_en: Clauses 7.3.1–2 (page 8) use Annex A for preferred 75 Ω BNC mechanics. Usability above 3 GHz
        and the 3 GHz return-loss requirement come from ST 424, not mechanical fit alone. Electrically qualified
        application-specific alternatives are permitted; BNC is not asserted to be the only connector allowed. The
        50 Ω title does not establish 75 Ω SDI suitability. No cross-rate, arbitrary-cable, distance, payload or
        device interoperability is asserted.
    evidence:
    - url: https://pub.smpte.org/pub/st424/st0424-2012.pdf
      title: SMPTE ST 424:2012 — sections 3 and 7.3.1–3, pages 3–4 and 8
      language: en
      accessed: '2026-10-24'
    - url: https://webstore.iec.ch/en/iec_catalog/product/preview/?id=L3B1Yi9wZGYvcHJldmlldy9pbmZvX2llYzYxMTY5LTh7ZWQxLjB9ZW4ucGRm
      title: IEC 61169-8:2007 public preview — normative Annex A title identifies 75 Ω interface dimensions
      language: en
      accessed: '2026-10-24'
