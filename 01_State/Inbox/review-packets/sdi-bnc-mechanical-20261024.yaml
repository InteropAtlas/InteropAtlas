    scope_notes_zh: 固定到 2007-02-16 发布的第一版整体，不把附录 A 单列为另一标准，也不代表全系列、后续版本或产品。正式标题中的 50 Ω 不能替代 SDI 所引用的附录 A 的 75 Ω
      接口。本记录依据官方目录和公开预览；未读取付费全文的具体尺寸表，不提供未知尺寸或声称完成电气性能、产品或设计符合性验证。
