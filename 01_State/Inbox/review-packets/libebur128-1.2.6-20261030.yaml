      English scope and limitations:


      libebur128 is a distinct C programme-loudness measurement library, pinned to v1.2.6 (official release
      published 2021-02-14), lightweight tag commit 67b33abe1558160ed76ada1322329b0e9e058b02 and tree 66cbb166495a71a284777669b5cb81730589201c.
      The fixed official codeload archive is 25,912 bytes with SHA-256 1b5c0793ba89c495cb9dae885a74361ddb878de77acead17ec7f4cf199c2f131;
      all 19 members match fixed Git-blob bytes. This adds only existing editorial measurement navigation,
      no capability or technical relation. IA already has a bounded static broadcast_loudness Rust 0.5.0 record;
      this distinct C implementation''s actual builds and finite runtime evidence add input/API/evidence diversity,
      not a previously zero-implementation gap or reapproval of the Rust record. Upstream broadly references
      EBU R128 and header/README BS.1770-4, whereas IA''s current itur_bs1770 means BS.1770-5 and ebu_r128
      means v5. No current-edition implements/compatibility/adoption relation or complete conformance is inferred.


      The library measures caller-supplied PCM; it is not an audio decoder, gain-applying loudness normalizer,
      media-delivery-profile compliance checker or player. short/int/float/double APIs use interleaved channels;
      frames means frames, not total sample count. Correct buffer length, channel layout, finite samples and
      nominal full-scale scaling are caller obligations. Principal finite signals are mathematically generated
      48 kHz, 1 kHz sines, never official EBU vectors. Fixed-source initialization accepts 1..64 channels and
      16..2,822,400 Hz with M present; a named extra unknown mode bit was still accepted, not strict enum validation;
      README''s all-samplerates claim is not accuracy evidence at every accepted value. Only named parameter
      examples were observed, not all channels/rates/types. Actual NaN double input can return SUCCESS and
      propagate NaN loudness; finite out-of-unit-range amplitudes such as 1.25/1.5 can be accepted without
      peak clipping. API success does not imply input validation, normalization, arbitrary-input safety or
      numerical accuracy.


      M reads the last 400 ms and S the last 3 s; I, LRA and sample/true-peak APIs have mode requirements.
      Empty, silent, under-gate or incomplete integrated blocks can yield a negative-infinity sentinel. In
      the named 48 kHz signal, 19,199 frames lacked a complete 400 ms block and 19,200 yielded a finite I value;
      this does not make every 19,200-frame input eligible. M/S can already be finite before their full window,
      using initially zero-filled data, not a readiness guard. Silence examples of relative threshold=-70 and
      LRA=0 are API observations, not universal normative empty-set values. Finite gain/chunk/multi-state examples
      establish no all-stream equivalence, threshold-edge behavior, absolute error bound or physical calibration.
      Multi-state I pools implementation energy/gating data, not arithmetic mean LUFS or proof that arbitrary
      file concatenation and differing measurement setups are interchangeable.


      The header''s general default mapping is not uniform across channel counts: fixed source special-cases
      four channels as L/R/Ls/Rs and five as L/R/C/Ls/Rs; in the usual six-channel layout index 3 is EBUR128_UNUSED
      for loudness (for example LFE). A loudness-excluded channel can still have a sample peak. Callers must
      confirm the map; DUAL_MONO is restricted to mono. A named set_channel test with unknown enum value 12345
      still returned SUCCESS; no audio was processed afterward, so this establishes neither enum validity nor
      safe use. The researcher''s first header-based four-channel/index-3-unused assumption failed one of 74
      assertions; original probe/results remain retained. Correcting that self-authored expectation against
      source and adding four/six-channel comparisons produced 75/75 without modifying upstream. The author
      separately checks four/five/six-channel examples; none covers every enum, sound-field layout or multichannel
      normative requirement.


      State/resource operations are not unconditional resets or constant-memory guarantees. A zero-frame add
      still clears previous sample/true peaks but retains accumulated peaks. A samplerate change clears filters/audio
      window while retaining I/LRA histories and same-channel accumulated peaks, unlike a fresh state. Changing
      channel count resets mapping; unfinished blocks can be lost. max_history limits history only outside
      histogram mode; default queues may grow with eligible-data duration, and discrete histogram results need
      not bit-match queue results. A query window must remain within the configured window; callers must check
      mode/allocation error codes rather than assume atomic rollback. At source level, growing set_max_window
      computes allocation from samplerate*window while init/change_parameters divide by 1000; initialization''s
      millisecond allocation estimate therefore cannot be assumed for growth. No large-growth allocation, OOM
      or resource stress test was performed; this is not a vulnerability finding, disabled-query-bound claim
      or assertion all window calls fail. loudness_window retains its upper-window guard.


      True peak is the fixed version''s implementation-defined custom polyphase FIR result, explicitly not
      promised comparable across versions: 4x below 96 kHz, 2x at 96..<192 kHz, and no interpolation at >=192
      kHz, where tested values equal sample peak. Finite peak witnesses do not certify maximum reconstruction
      peaks for every signal, BS.1770 Annex 2 or complete normative/platform conformance. Actual research/author
      environment is Linux x86_64, GCC 14.2.0, CMake 3.31.10 and libc/libm. Official CMake Release core builds
      succeeded separately as shared/system queue and static/internal queue with unmodified source, ENABLE_TESTS=OFF
      and ENABLE_FUZZER=OFF. Recorded tool versions are not an entirely hash-pinned supply chain. Other platforms/compilers,
      ANSI-C portability, performance, thread safety, sanitizers and reproducible binaries are not established.


      The author independently reacquired public Git and the fixed codeload archive, verified all 19 raw members
      and personally replayed final researcher v4: the same 75 finite output assertions with fail-closed success-return
      checks passed each CMake configuration, not 150 unique checks. The author separately wrote final v3 with
      26 finite assertions, passing those two libraries and direct GNU11/source, not 78 unique checks. Earlier
      author versions/results remain: v2 strengthened getter return checking, and v3 narrowed one overbroad
      S-mode label to actual initial I/400ms-buffer shortterm rejection. Independent preflight has 20 finite
      checks; participants/configurations overlap and counts are not summed. CMake compatibility/deprecation
      diagnostics and the direct GNU11 upstream set-but-unused warning are retained, not warning-free. Original
      source and earlier failures remain preserved; success means only these named builds/probes, not the upstream
      suite below. Independent review found three still-unchecked successful getters in research v3; its previous
      complete fail-closed wording was too broad. V4 fixes those three and immediately checks seven assigned-success
      paths, retaining old evidence without library edits. Independent preflight''s original 20 likewise had
      three output-only getters; separately retained v2 strengthens return checking and initializes values,
      with the same 20 output rows, not 40. The author replays that explicitly reviewer-authored test code
      without relabeling author execution independent review.


      The upstream conformance suite is explicitly NOT RUN: actual ENABLE_TESTS configuration failed because
      libsndfile was unavailable. A development-package acquisition was denied/unavailable, with no retry or
      alternative bypass. EBU audio terms require acceptance on download and internal-R&D usage; no EBU audio
      vectors were materialized locally or used, and no terms were accepted on the user''s behalf. An earlier
      research web-tool ZIP read returned unsupported-type, not an acquired corpus or passed test; the tool
      error cannot prove no underlying network request occurred. No further acquisition followed reading the
      terms. Synthetic signals are not official vectors. Fixed test/tests.c ends with unconditional return
      0; PASSED/FAILED macros only print and missing-file paths can return 0.0/NaN. Process exit 0 cannot establish
      upstream test success. A successful core build is not an executed official suite, and blocked test dependencies
      do not mean the core library cannot compile.


      README/COPYING describe the main library as MIT, while bundled ebur128/queue/sys/queue.h and doc/license/queue.txt
      separately contain UC Berkeley three-clause redistribution/non-endorsement terms, with doc/license/R128Scan.txt
      also present. Bare MIT is not generalized into a legal judgment for every tree member; no license_expression
      licensing property or IA-license change is synthesized. This is not physical sound-pressure calibration,
      hearing-health assessment, safe-listening advice, legal advice, regulatory/broadcast certification, security/production
      recommendation, IA adoption, signature authentication or a future guarantee. The lightweight tag is not
      signed proof; no latest-version claim. Full limits remain visible in existing HTML, Markdown and search,
      not hidden-field-only context.'
