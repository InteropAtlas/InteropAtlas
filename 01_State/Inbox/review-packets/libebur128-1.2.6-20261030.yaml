    id: libebur128
    type: system
    kind: library
    name_zh: libebur128 C 节目响度测量库
    name_en: libebur128 C programme-loudness measurement library
    description_zh: 'libebur128 是独立的 C 节目响度测量库；本记录固定 v1.2.6（官方 release 发布于 2021-02-14）、轻量 tag 所指 commit 67b33abe1558160ed76ada1322329b0e9e058b02
      / tree 66cbb166495a71a284777669b5cb81730589201c。官方固定 codeload 归档 25,912 字节，SHA-256 1b5c0793ba89c495cb9dae885a74361ddb878de77acead17ec7f4cf199c2f131，19
      个成员与固定 Git blob 原字节逐一相等。这里只增加既有 measurement 编者导航，不新增 capability 或技术关系。IA 已有 broadcast_loudness Rust 0.5.0
      的有界静态记录；本次不同 C 库的实际构建与有限运行证据补充输入/API/证据多样性，不是“此前零响度实现”，也不改变或重新核准 Rust 对象。上游宽泛声称 EBU R128，header/README
      涉及 BS.1770-4，而 IA 的 itur_bs1770 是 BS.1770-5、ebu_r128 是 v5；不据此建立当前版本 implements/兼容/采用关系或完整符合性结论。


      库计算调用方提供的 PCM，不是音频解码器、自动施加增益的响度归一器、媒体交付 profile 检查器或播放器。short/int/float/double API 使用交错通道（interleaved）；frames
      是帧数而不是总 samples 数，缓冲区长度、通道布局、样本有限性与标称满刻度缩放由调用方负责。有限测试的主信号是数学生成的 48 kHz、1 kHz 正弦，绝非 EBU 官方向量。固定源初始化允许
      1..64 通道、16..2,822,400 Hz，并要求包含 M；未识别的额外 mode bit 在命名测试仍被接受，不是严格枚举验证；README 的“所有采样率”不能扩大为每个参数值都准确。只在若干命名参数点观察，不覆盖全部声道/采样率/类型。非有限
      double NaN 输入实际可返回 SUCCESS 并传播到响度 NaN；1.25/1.5 这类有限超单位幅度可被接收且峰值不削波。API 成功不是自动验证、归一化、任意输入安全或数值准确保证。


      M 表示最后 400 ms、S 最后 3 s；I、LRA、sample/true peak 等读取受各自 mode flags 限制。空/静音/门下或未积足完整门限块时，I 可为负无穷哨兵；48 kHz
      的命名测试 19,199 帧仍无完整 400 ms 块，19,200 帧才产生有限结果，这不保证任意 19,200 帧均合格。M/S 则可在不足其窗口时，依初始零填充读出有限值，不是“已准备完整窗口”的
      guard。静音示例的 relative threshold=-70、LRA=0 仅为该 API 观察，不把空集合哨兵当规范普遍定义。有限相对增益、分块与多实例观察不证明所有完整流等价、阈值边缘、绝对误差界或物理标定。多实例
      I 按库的能量/门限数据合并，不是各 LUFS 的算术平均，也不证明任意文件拼接或测量设置可以互换。


      不能把 header 的常规默认列表照套全部布局：固定源码对 4 通道使用 L/R/Ls/Rs、5 通道使用 L/R/C/Ls/Rs；通常 6 通道的 index 3 才是 EBUR128_UNUSED（不计响度，例如
      LFE）。被排除响度的通道仍可有 sample peak。调用方须显式确认映射；DUAL_MONO 仅允许单通道。set_channel 对未知 enum 数值 12345 的命名测试仍返回 SUCCESS，此后未处理音频；这不是
      enum 合法性或安全使用证明。研究首版据 header 假设 4 通道 index 3 未使用，出现 1/74 断言失败；保留旧探针和结果，随后按源码更正自写断言并增加 4/6 通道对照为 75/75，未修改上游。作者另做
      4/5/6 对照；这些有限测试不等于覆盖所有 enum、声场布局或多通道规范。


      状态和资源并非无条件重置或恒定：零帧 add 调用仍将 previous sample/true peak 清零，但保留累计 peak；change_parameters 的采样率改变会清过滤器/音频窗口，却可保留
      I/LRA 历史和同通道累计 peak，并不等于新建状态。改变通道数会重置 map；未完成块可丢失。max_history 只在非 histogram 路径限制历史，默认队列可随合格数据时长增长；histogram
      的离散结果不保证与队列比特相同。读取窗口须不超过所设窗口，模式和资源错误要检查返回码，不能假定所有错误原子回滚。源码层面，set_max_window 的增长分配先按 samplerate*window
      计算，而 init/change_parameters 有 /1000；因此不能按初始化的毫秒换算估计增长分配量。此处未做增长大分配、OOM 或压力测试，不声称漏洞、查询上限失效或所有窗口调用失败；loudness_window
      的上限 guard 仍存在。


      true peak 是固定版本定义的 custom polyphase FIR 插值结果，header 明确不应跨版本直接比较：<96 kHz 使用 4x、96..<192 kHz 使用 2x，>=192
      kHz 路径不插值，所测返回 sample-peak 值。有限峰值例不证明任意信号重建最大峰、BS.1770 Annex 2 或全部规范/平台符合性。实际研究/作者构建环境为 Linux x86_64、GCC
      14.2.0、CMake 3.31.10、libc/libm；官方 CMake Release 核心 shared/system queue 与 static/internal queue 分开成功，原源不改，ENABLE_TESTS=OFF、ENABLE_FUZZER=OFF。工具版本记录不是全供应链
      hash-pin，不声称其他平台、编译器、ANSI C 可移植性、性能、线程安全、sanitizer 或二进制可复现构建。


      作者从公开 Git 与固定 codeload 独立重取并核 19 个原字节成员，亲自执行最终研究 v4：同 75 条有限输出断言加成功返回码 fail-closed 检查，在两个 CMake 配置各通过，不是
      150 条独特覆盖。作者另写最终 v3 的 26 条有限断言，在这两个库及 direct GNU11/source 三配置各通过，不是 78 条独特覆盖；早期版本/结果保留，v2 加强 getter 返回码，v3
      把一个过宽 S-mode 标签改为实际初始 I/400ms buffer 的 shortterm 拒绝。独立预审另有 20 条有限检查，三方及各配置大量重叠，不相加覆盖。CMake 兼容/弃用提示及 direct
      GNU11 原源的 set-but-unused 警告原样保留，不声称零警告。最终原源和所有先前失败均保留，成功只指这些命名构建与探针，不是下述上游 suite。 研究 v3 后被独审发现仍有三个成功
      getter 未核返回码，旧“完整 fail-closed”措辞过强；v4 修复三漏项并立即检查七条已赋值成功路径，保留旧文件/结果，未改库。独立预审原 20 例亦有三个 getter 仅看输出，另存
