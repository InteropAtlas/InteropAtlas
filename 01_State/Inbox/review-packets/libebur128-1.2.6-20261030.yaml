    semantic_findings:
    - topic: measurement is not normalization
      facts: APIs consume caller-owned interleaved PCM frame buffers and report metrics. frames is frame count,
        not samples. No file decoding or audio gain-normalization pipeline in core. short/int scaled by max
        absolute type range; float/double scaling factor1.0. Caller must provide correctly sized buffers, intended
        channel map and finite nominal-full-scale data; finite float magnitude1.5 is accepted and not clipped.
      source: header add_frames docs and source EBUR128_FILTER
      runtime: Equivalent exactly representable short/int/float/double samples give equal I in these fixtures;
        double1.5 yields peak1.5.
    - topic: initialization limits not accuracy promises
      facts: Source accepts channel counts1..64 and sample rates16..2822400, else initNULL. Mode must contain
        M as defined by composite enum; HISTOGRAM alone fails. Extra unknown mode bits are not rejected. These
        are input checks, not accurate-algorithm guarantees at every accepted rate.
      runtime: Boundaries0/65channels,15/2822401Hz rejected; min16/max2822400Hz and64channels init-only checked,
        no extreme-rate audio measurement.
    - topic: mode and channel validation is not total
      facts: I/LRA/peak/threshold getters require applicable flags; shortterm delegates to available audio-window
        length (tested defaultM rejects). set_channel checks index and dual-mono restriction, not all enum
        values. Do not treat successful call as generic configuration validation.
      runtime: Unknown channel value12345 accepted but not used to process any audio; stereo DUAL_MONO/index2
        rejected; mono DUAL_MONO gives twice energy on measured sample.
    - topic: default channel-map source/header distinction
      facts: Header lists generic L,R,C,UNUSED,Ls,Rs map, but actual source special-cases4ch as L,R,Ls,Rs and5ch
        as L,R,C,Ls,Rs. Generic6ch index3UNUSED and channels beyond6UNUSED; explicit caller mapping is necessary
        for intended layout.
      runtime: 4ch index3-only tone is counted as surround;6ch index3-only tone gives I negative infinity but
        its sample peak still measured. Peak scans include channels excluded from loudness.
    - topic: timing and startup
      facts: Samples per100ms rounded as(rate+5)/10. First I gating block needs4 such blocks; subsequent steps1.
        M/S read zero-initialized ring before full window; they are not ready-state validators.
      runtime: '48kHz stereo I at19199frames is negative infinity;19200frames finite. M at19199frames -23.091653482754822,
        S -31.842266116671823: finite before nominal400ms/3s. This is startup behavior, not qualified short-window
        accuracy.'
    - topic: empty and silent sentinels
      facts: No eligible integrated blocks gives negative infinity; relative threshold defaults-70; LRA gives0
        with no selected short-term blocks. Zero is not proof of sufficient duration or valid programme dynamics.
      runtime: Empty and silence probes confirm sentinels; peak zero. No normative assertion that standards
        define empty-set values this way.
    - topic: gating, histogram and history
      facts: Source uses >= absolute energy boundary corresponding to-70 and >= relative gate (mean energy
        times10^-1). Non-histogram integration stores block energies and default history ULONG_MAX, so memory
        may grow with duration. Histogram uses1000 bins and can differ numerically; changing bounded history
        affects retained evidence.
      runtime: 4s stereo synthetic1kHz amplitude.07 I=-23.091342903642303; histogram=-23.05; chunked feed equals
        whole in same fixed build; constant-tone relative threshold10below I. No general error bound or bit-exact
        crossplatform guarantee.
    - topic: lifecycle / reset
      facts: Changing sample rate resets filter/audio buffer and unfinished current window but does not erase
        all historic I blocks. Same channel count preserves previous aggregate peak arrays. Destroy/reinitialize
        is distinct from change_parameters. An invalid channels/rate returns ERROR_NOMEM by source validation;
        not a dedicated invalid-parameter code. Header cautions that allocation failure leaves state invalid
        requiring destruction.
      runtime: 48k->44.1k retains measured I and maxsamplepeak, while M becomes negative infinity before new
