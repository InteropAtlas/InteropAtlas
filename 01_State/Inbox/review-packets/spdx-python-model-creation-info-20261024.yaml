      conditions_en: 'Only the generated five-field CreationInfo mapping is covered: optional scalar comment, required
        scalar created, one or more Agent references in createdBy, optional Tool references in createdUsing, and
        required scalar SemVer-shaped specVersion; type/property IRIs correspond to SPDX 3.0.1. Assignment/decoding
        checks applicable types/patterns, but missing-value/cardinality checks occur at encoding, so successful
        construction/loading is not conformance. Valid specVersion syntax does not require value 3.0.1. Agent/Tool
        references may remain unresolved strings; writing them authenticates neither identities, creation facts
        nor tooling history, while supplied objects remain subject to their own encoding requirements. Normatively
        created can mean element last-change time rather than export time. Fractional-second strings are rejected;
        datetime microseconds truncate; zero offsets can normalize to UTC, strings with nonzero hour/minute offsets
        fail the Z pattern rather than converting; datetime timezone-offset seconds are truncated before the UTC-Z
        check, and naive datetime behavior depends on host timezone. Unknown properties are not automatically preserved;
        blank-node IDs and object ordering can change, so no universal lossless roundtrip is asserted. JSON-LD reading/writing
        and recognized-context binding selection are limited mechanisms, not generic JSON-LD or complete SPDX processing;
        output digests are not signatures or authenticity checks. Generated-code evidence is a rehashed released
        archive member, not an invented GitHub source path; versioned generator-input URLs/local overrides do not
        prove original build inputs. Python>=3.9, Beta and Apache-2.0 are declarations; no mandatory runtime dependencies,
        and shacl2code==1.1.0 is build-only. No library installation/import/execution/testing, network identity
        lookup, production-readiness judgment, full conformance, third-party interoperability or IA adoption is
