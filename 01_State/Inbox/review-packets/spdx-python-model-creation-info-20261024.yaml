      conditions_zh: 仅核生成的 CreationInfo 五字段：comment 可选单值字符串，created 必需单值时间，createdBy 至少一个 Agent 引用，createdUsing
        可选 Tool 引用，specVersion 必需单值 SemVer 形状字符串；类型和属性 IRI 对应 SPDX 3.0.1。赋值/解码会检查类型和模式，但缺少必填值/数量约束由编码阶段检查，构造或加载成功不等于合规。specVersion
