    description_zh: 'python-json-patch 是 Python JSON Patch 库，发行包名为 jsonpatch；本记录固定 v1.42 的源码 commit 004f8cb832cb1fbb3141a5f06ab00440ca7c91b9，不声称已核验
      PyPI 构建产物。README 明确以 RFC 6902 为应用目标，源码登记 add、remove、replace、move、copy、test 六种内建操作，apply_patch 调用 JsonPatch.apply
      依序应用。此处是静态源码与文档先例，不是执行实例或完整符合性认证。对普通 JSON 形状的 dict/list 数据及内建操作，默认 in_place=False 深复制输入，失败停止并不把已完成的复制件修改写回原件；in_place=True、atomic=False
      默认不回滚已发生修改。另行设置 atomic=True 与 in_place=True 时，内建操作通过日志撤销失败前的修改，文档将精确恢复保证限定于普通 dict/list；defaultdict 等读取即变更的容器不在保证内。自定义操作可能走复制恢复，嵌套容器会被副本替换，任意额外状态不保证恢复。根替换返回新值而不能重新绑定调用方变量，即使
      in_place=True 也必须使用返回值；原容器成员此前可能已改变。只建立到现有 RFC 6902 原始出版物的有界 implements 关系，不改变其 2013 年 4 月、RFC 4627 引用与六项勘误未核边界。没有安装、导入或执行上游、doctest、测试、CLI、网络或服务；不主张任意输入/重复名称校验、补丁生成正确性、完整
      RFC 符合性、HTTP PATCH 原子性、安全、性能、第三方互通或 IA 采用。BSD-3-Clause 仅按固定源码和 LICENSE 记录。


      English scope and limitations:


      python-json-patch is a Python JSON Patch library distributed under the name jsonpatch, pinned here to v1.42
      source commit 004f8cb832cb1fbb3141a5f06ab00440ca7c91b9; no PyPI build artifact equivalence was checked. The
      README identifies RFC 6902 application as its purpose. The source registers six built-in operations (add,
      remove, replace, move, copy, test), and apply_patch delegates sequential application to JsonPatch.apply. This
      is a static source/documentation precedent, not an executed example or full conformance certification. For
      plain JSON-shaped dict/list data and built-in operations, default in_place=False deep-copies the input; a
      failure stops application without copying partial changes back to the original. Default in_place=True, atomic=False
      does not roll back changes already made. Opting into atomic=True with in_place=True journals built-in mutations
      for rollback; the documented exact-restoration guarantee is limited to plain dict/list containers, excluding
      read-mutating containers such as defaultdict. Custom operations can use copy-based restoration, replacing
      nested containers with copies and not necessarily restoring arbitrary extra state. Root replacement returns
      a new value rather than rebinding the caller variable, so callers must use the result even with in_place=True;
      earlier member changes to the original may remain. Only a bounded implements relation to the existing April
      2013 RFC 6902 publication is asserted; its original RFC 4627 reference and six unreviewed errata remain unchanged.
      No upstream installation, import, execution, doctests, tests, CLI, network or service was performed. No arbitrary-input/duplicate-name
      validation, diff-generation correctness, full RFC conformance, HTTP PATCH atomicity, security, performance,
      third-party interoperability or IA adoption is established. BSD-3-Clause is recorded from fixed source and
      LICENSE only.'
