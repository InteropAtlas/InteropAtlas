  research_report_original_utf8: "# libopus 1.6.1：既有 Opus 标准节点之后的有界 C 实现证据\n\n状态：**研究完成；未独立审核、未形成 Candidate / acceptance\
    \ packet，未写 IA 仓库或 GitHub。**\n\n执行者：Agent — OpenAI / dot / research_next_coverage_gap。观察窗口：2026-10-30 12:29\
    \ UTC 起。研究问题是：IA 已有的 RFC 6716 / RFC 8251 规范身份之外，能否补充一个准确区分原始音频包、API、容器与符合性边界的独立实现记录？本目录只回答该问题，不授权后续物化或发布。\n\n\
    ## 结论与实际增益\n\n**可以交给独立复核考虑 libopus 1.6.1 的普通既有设计实现收录。**这不是“音频领域没有实现”或全生态缺口：IA 已有广义 FFmpeg 软件发行体，以及其他不同作用的媒体库。具体缺口是当前地图没有\
    \ libopus 本身的实现身份及其有限可执行证据，而已有 Opus RFC 对象不能代替实现。\n\n- 当前 main 与本地只读底库均为 `f864f1cf2d49a12b67577eaef4708176caae208d`。对象和候选\
    \ identity 字段中的 Opus 命中只对应 RFC 6716、RFC 8251 及保留的已接纳候选；Canonical relation 文本没有 Opus 命中。详细证据见 `ia-gap-audit.json`。\n\
    - 观察时 open PR 仍只有 held #498 / #439 / #416；两页 157 个分支名未见 Opus，all-state Opus PR 检索只找到已有规范/覆盖历史而非 libopus intake。它们是当时快照，不代替未来\
    \ author 前的冲突复查。\n- 既有导航把 Opus 规范放在 `image_color`（原类别名称包含 coding）；若后来收录，可沿该**既有编辑导航**讨论，不新增分类、能力或导航模型。本研究不冻结技术关系提案；不能由本地通过直接得到完整\
    \ `implements` 或 RFC 8251 安全修复认证。\n- 最小知识收益是明确：这是输入 PCM 与原始 Opus packets 之间的编解码 C 库；不是 Ogg `.opus` 文件工具、RTP\
    \ 实现、播放器、格式识别器或完整符合性认证器。Opus 规范的规范性解码器、此后的 libopus 软件版本和相关容器/工具保持独立身份。\n\n## 固定身份、一手来源与 freshness\n\n| 项目 |\
    \ 证据 |\n|---|---|\n| 研究版本 | libopus 1.6.1 |\n| 上游公开镜像 | `xiph/opus`；[官方 development 页](https://opus-codec.org/development/)明确从主\
    \ GitLab 指向 GitHub mirror |\n| annotated tag object | `a5d6c1b6f4e582df97390f9ac5c6e7c51cbffffe` (`v1.6.1`)\
    \ |\n| fixed commit | [`22244de5a79bd1d6d623c32e72bf1954b56235be`](https://github.com/xiph/opus/tree/22244de5a79bd1d6d623c32e72bf1954b56235be)\
    \ |\n| fixed tree | `a5e21b6751d8f187b83ad9d5f3a57aab801cf722` |\n| 公布日期 | [官方 1.6.1 release 页](https://opus-codec.org/release/stable/2026/01/14/libopus-1_6_1.html)为\
    \ 2026-01-14 |\n| 观察时版本选择 | [官方 downloads 页](https://opus-codec.org/downloads/)列 stable libopus 1.6.1；GitHub\
    \ `releases/latest` 仍返回 1.5.2，因此没有把该 API 误当作最新版依据 |\n\n固定 tag/commit 由支持的 GitHub connector 读取，另以正常公开 Git clone\
    \ 取得。GitHub metadata 对 tag 和 commit 报 `verified:true`，但这里没有独立认证签名密钥，不把它包装为作者身份/供应链安全保证。\n\n755 个 checkout 文件逐项核了\
    \ Git blob 身份/实际字节。**753 个原字节相等；两个 Windows `.bat` 文件不相等**：`autogen.bat`、`dnn/download_model.bat` 被上游 `.gitattributes\
    \ eol=crlf` 转为 CRLF；对这两项分别核 raw Git object、原长度/hash、checkout 长度/hash及精确 CRLF→LF 对应。它们未执行，不属于本次编译输入。`source-audit.json`\
    \ 不声称全 checkout 原字节相等。9 个 connector 固定文本另核实际 UTF-8 bytes 与对应 Git blob 一致。\n\n官方 release tarball 公布 SHA-256 为\
    \ `6ffcb593207be92584df15b32466ed64bbec99109f007c82205f0194572411a1`；**未下载此 tarball**，此值只是发布者元数据，不是本地文件校验，也不声称\
    \ Git checkout 与发行包所有成员相等。\n\n## 标准、API 与范围\n\n- [RFC 6716](https://www.rfc-editor.org/rfc/rfc6716.html)的规范性部分是\
    \ Appendix A 的解码器；不以编码器输出与同库解码器吻合代替它的符合性程序。[RFC 8251](https://www.rfc-editor.org/rfc/rfc8251.html)是单独的更新文档，修改规范性解码器并包含新的测试向量要求；这里不改\
    \ IA 既有 RFC 身份、不创作替代关系。\n- 固定 [`README`](https://github.com/xiph/opus/blob/22244de5a79bd1d6d623c32e72bf1954b56235be/README)把本包定义为\
    \ raw Opus 编解码库，并将 RTP、Ogg 封装与 opus-tools 分开。`opus_demo` 的调试封装不是分发用 `.opus` 文件；本研究没有运行它或验证容器/网络互通。\n- 固定 [`include/opus.h`](https://github.com/xiph/opus/blob/22244de5a79bd1d6d623c32e72bf1954b56235be/include/opus.h)区分编码返回的字节数与解码返回的**每声道\
    \ sample 数**；stereo PCM 为 interleaved。浮点 API 正常输入范围为 ±1；24-bit API 使用 `opus_int32` 承载24位值。本研究没有测试非有限样本、异常指针/错误缓冲长度或所有超范围值的安全性。\n\
    - 自写矩阵覆盖 8000/12000/16000/24000/48000 Hz × 1/2声道 × 2.5/5/10/20/40/60 ms 的60个具体组合。**不是 API 只允许这些时长的声明**：固定 `frame_size_select`\
    \ 还包含80/100/120 ms，未在自写矩阵覆盖。源码的可选 `ENABLE_QEXT` 分支可包含96 kHz；该分支未在本次 CMake flags 启用，所以96000拒绝只描述此构建，不写成所有 libopus\
    \ 配置永远不支持。\n- 解码缓冲不足、错误采样率、single-stream声道0/3、application -99、500sample帧、零输出容量、complexity11、截断code3包等各有命名返回码观察，不推导任意非法输入都被严格验证。单流1/2声道限制不否定另有\
    \ multistream API。\n- 本例 `OPUS_GET_LOOKAHEAD` 为312 samples/channel；不当作各模式/采样率的常数或外部时钟同步保证。NULL/零长度包的20 ms PLC返回960\
    \ samples只证明请求时长的输出，不证明丢失音频恢复质量。未独立验证FEC、DTX、seek、音质/延迟/速率性能或流级跨厂商互通。\n- 两个相同 TOC 的20 ms包被 repacketizer 合为40\
    \ ms、可抽取其中一帧；pad/unpad保留本例解析时长和可解码计数，不主张任意包可拼接、无损还原PCM、原始packet逐字节还原或容器语义。\n\n## 实际构建与执行\n\n环境：Linux 6.18.57\
    \ x86_64、GCC 14.2.0、CMake/CTest 3.31.10、系统 libc/libm。复用已有本地 CMake工具环境，没有另取依赖、系统安装或 network service。工具版本记录不是整个编译供应链的hash锁定。\n\
    \n本次仅一个明确构建 profile：Release static library、floating-point core / float API、scalar（`OPUS_DISABLE_INTRINSICS=ON`）；DRED、OSCE、DEEP_PLC、custom\
    \ modes、encoder FUZZING、programs关闭，正常 hardening 保留。`build/CMakeFiles/opus.dir/flags.make`是实际编译选项。没有声称 native\
    \ SIMD、fixed-point、DNN模型、Android/Apple/Windows、所有构建系统或线程配置通过。\n\n1. 原上游CMake configure/build成功，源码未修改。**保留2处\
    \ GCC `-Wstringop-overflow` 警告**，都在 `silk/decode_indices.c`（74、133行）。没有将其静默抹除、断言为误报或据此宣布安全漏洞/零警告。\n2. **五个本配置启用的\
    \ CTest binaries 均通过**：`test_opus_decode`、`test_opus_padding`、`test_opus_api`、`test_opus_encode`、`test_opus_extensions`；`SEED=12345`，`TEST_OPUS_NOFUZZ`明确未设置，未改上游guard，83.81秒。标准CMake\
    \ wrapper对非零结果失败，上游 `_test_failed` 会 abort。随机种子只是一个，不代表遍历所有状态。\n3. 自写 `probe.c` 成功运行81个命名组：60个矩阵组合及21个API/包边界组。每个成功路径的相关返回码和数值前置条件均\
    \ fail-closed；结果在 `probe-results.jsonl`。这不是81项标准要求、81个独立实现或完整符合性覆盖。它与上游suite大量重叠，不相加为覆盖率。\n4. `replay.py`在**新输出目录**离线重核固定checkout/探针hash后，已实际重新构建并通过同五个CTest（87.88秒）和同81组；两次探针JSON观察逐项相等。`replay/REPLAY_RESULT.json`只在全部阶段成功后生成。重复执行不增加独特覆盖，也不是独立Reviewer或bit-reproducible\
    \ build声明。\n\n**明确未运行**：官方 RFC 8251 test vectors（未取得）；RFC6716规范内向量；Autotools `make check` 全体目标、其余CELT单元测试、projection/custom/DRED\
    \ tests、外部FATE/其他实现或媒体语料、sanitizer、benchmark、网络协议、生产负载和漏洞验证。五个CTest通过不能称为整个上游所有测试通过。上游padding测试自身包含约16.9 MB的固定回归输入；这是被实际执行的测试，不冒称本次所有输入都很小。\n\
    \n## 许可证与来源边界\n\n固定 [`COPYING`](https://github.com/xiph/opus/blob/22244de5a79bd1d6d623c32e72bf1954b56235be/COPYING)给出三条款BSD文本和专利声明链接；固定\
    \ `LICENSE_PLEASE_READ.txt`同时提及2/3-clause BSD和Clear BSD贡献条款，实际文件头也不同（例如 CELT两条款、SILK三条款）。因此不把一个裸 SPDX字符串泛化为整个源码树所有材料的法律判定。保留上游版权/许可证原文件，不改变IA许可证。\n\
    \n官方 [license页](https://opus-codec.org/license/)描述版权与专利声明；这里仅记录来源，未替用户接受点击式条款、未做专利可实施性/第三方权利担保，不提供生产、安全或法律适用性建议。未取得模型、官方外部音频向量或进行训练。\n\
    \n## 保留失败与未发生操作\n\n- 第一版自写 `probe-v1.c` 因一行for后同排record触发 `-Werror=misleading-indentation`，**未运行**；原文件/compile\
    \ log/exit保留，最终只加括号与换行，上游不改。\n- `audit_inputs-v1.py` 先有语法括号错误，**未执行读取**；修正后 `v2` 的“所有checkout原字节相等”断言在 `autogen.bat`真实失败。保留两版与日志，最终不是删掉检查：先查明确上游eol规则，再只允许两个精确路径/精确转换并核raw对象，其他差异仍失败。\n\
    - RFC Editor `/info/rfc8251` 的web读取返回429；随后从独立规范正文URL读取成功，未把429当作规范不存在。没有重试本任务被禁止的本地浏览器、direct GitHub API403、#276写入或任何发布拒绝。\n\
    - 无 Candidate、packet、IA代码/Canonical/关系/分类文件、commit、branch、PR、comment、Pages、search或renderer变更；Tomli待批准操作以及#498/#439/#416/identity\
    \ holds不动。\n\n## 如何复现 / 交接\n\n依赖一个未修改的固定 `xiph/opus` checkout，先按上面的commit/tag核对；本研究已经提供 `source/`。用已有 CMake/CTest\
    \ 与C编译器：\n\n```sh\npython replay.py --source ./source --output ./new-replay \\\n  --cmake /path/to/cmake --ctest\
    \ /path/to/ctest --cc gcc\n```\n\nreplay只写新输出目录；已有输出目录会拒绝覆盖。它不下载、不安装、不修改上游源码。审查时先核 `MANIFEST.json`、`source-audit.json`、原始日志及固定来源，再判断本对象是否可进入普通既有设计intake。**本研究作者的判断不是独立审核或接受授权。**\n\
    \n停止条件已满足：明确了一个真实地图缺口、准确实现身份、主要固定源码、可重放有限证据、保留失败和不能外推的边界。没有继续准备多个待审候选；技术关系如何限界、最终可见字段如何表达、是否接受均留给下一步独立preflight，不在本研究偷做决定。\n"
  research_erratum_zh: 原封存研究中 pad/unpad 的可解码计数措辞过宽。probe 对 padded packet 直接解码；unpad 后与 extracted second frame 仅核解析时长。repacketizer
    是同一个20 ms包添加两次，不是两个独立音频片段。此 packet 与拟议可见中英描述已准确窄化；原研究保持不变。 另一个明确勘误：原研究、预审及作者v2中“没有取得神经模型/神经模型未运行”的宽泛表述不成立。固定src/mlp_data.c含随源码取得的Keras生成权重，实际编译了src/mlp.c/mlp_data.c/analysis.c，普通analysis路径包含dense/GRU计算。准确边界是未另行下载外部模型，未测可选DRED/OSCE/DEEP_PLC增强配置，不是无神经网络或无神经计算。原封存研究和预审不改；本v3可见双语描述、Candidate与packet明确修正。
