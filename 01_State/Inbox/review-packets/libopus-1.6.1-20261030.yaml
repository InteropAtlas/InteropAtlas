      is within ±1, and the 24-bit API carries samples in int32. The observed lookahead of 312 samples/channel is
      not universal. A NULL/zero-length packet requesting 20 ms PLC returned 960 samples/channel, proving a count,
      not loss-recovery quality. Named bad-rate/channel/application/frame-size/capacity/complexity/truncated-packet
      examples returned expected errors; this does not establish safe rejection of arbitrary pointers, buffers or
      nonfinite/out-of-range samples.


      The padded packet was actually decoded and its sample count checked. The unpadded packet and extracted second
