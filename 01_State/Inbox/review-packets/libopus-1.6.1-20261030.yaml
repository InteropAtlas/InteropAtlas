    utf8: "# libopus 1.6.1 独立研究预审：有条件 GO（不是接纳）\n\nReviewer：**Agent — OpenAI / dot / /root/review_opus_implementation_scope**。本\
      \ Reviewer 未参与被审研究、未编写其 probe/replay，也不是研究执行者 `research_next_coverage_gap`。审查起点：2026-10-30 12:42:00 UTC；结论窗口截至\
      \ 12:47 UTC。实际机器/connector 观察时间另外保存在 JSON 与日志中。GitHub 连接的实际平台账号是 `ff6962757`（ID 48049644）；它不是本 Reviewer，也不是本次独立审查的\
      \ Human 执行者。本次未调用任何 GitHub 写工具。\n\n## 1. 决定与必须落实的窄化\n\n**有条件 GO：可进入普通既有设计的单个 libopus 实现 intake 编写；不代表 Candidate\
      \ 接纳、F/H 审核、提交、PR、合并、IA 采用或符合性认证。**固定研究的来源身份、可重放性、实际知识增益及主要限制均可成立。没有发现必须扩大本体、治理、维护模型或新建 capability 才能容纳它的理由。\n\
      \n下游作者必须落实以下边界，随后对实际形成的工件另作独立审查：\n\n1. **修正原研究的一处运行措辞**：原 `probe.c` 对 padded packet 有直接解码计数检查；对 unpadded packet\
      \ 与 extracted second frame 仅检查解析时长，未直接调用解码器。不能把原报告“pad/unpad 保留…可解码计数”传播为两者均完成解码。保留已封存研究，不覆盖历史；在后续文字或明确标识的勘误中写准此区别即可，不要求补跑额外测试。\n\
      2. repacketizer 例确切是**把同一个 20 ms packet 添加两次**，合成 40 ms 并解码，随后抽出第二帧并检查时长；不是两段独立音频的跨实现互通或任意 packet 可拼接证明。\n\
      3. 只使用现有 `type: system`、`kind: library`；能力字段留空/省略，技术关系为零；只沿既有 `image_color` 编者导航。必须保留全部证据限制在既有可见字段，不能靠隐藏 scope\
      \ 字段补救过宽公开描述。\n\n这些是进入后续作者工作的条件，不是冻结的 Candidate 文稿或接纳合同。本预审不形成任何 Candidate / acceptance packet / F / PR。\n\
      \n## 2. 精确审查对象与完整性\n\n原研究目录：`/workspace/shared/ia-opus-research-20261030-1231`。\n\n| 工件 | SHA-256 |\n|---|---|\n\
      | `RESEARCH.md` | `c611ecbe4865b4d95f4d5ba5baec8f32184c9cabeeba47e57d3e19950617596b` |\n| `MANIFEST.json`\
      \ | `ef4f4068b5219668eab3797df26e87a1f36fae09db9741344d4c255b719656aa` |\n| 原研究 `probe.c` | `bc8efc30005e1493eacee99f0a8abda3037a8a15e9ff6bac68e12c8db8599a1f`\
      \ |\n\n我亲自用独立脚本核了原 manifest 中全部 **96 个文件**的长度和 SHA-256。原研究及其来源目录未修改；末次复核两个输入 hash 不变。\n\n从已提供的固定 source 复制到本\
      \ Reviewer 专用目录 `source/`；不是独立网络下载，不能描述为重新从上游取得整树。独立脚本不依赖研究者逐文件表，直接枚举固定 `git ls-tree`，读取 Git blobs、重算 Git\
      \ blob identity 与原字节/checkout SHA-256。755 个源文件：753 原字节相等；仅 `autogen.bat` 和 `dnn/download_model.bat` 精确对应 LF→CRLF。上游\
      \ `.gitattributes` 明示 `*.bat eol=crlf`；两项没有执行，不属于实际编译输入。无其他工作树差异或 ignored 附加文件；非 `.git` 普通文件数也为755。详见 `INDEPENDENT_AUDIT.json`，而不是声称755个checkout均逐字节等于Git对象。\n\
      \n## 3. 实时 IA 地图、身份与重复工作\n\n支持的 GitHub connector 返回 main `f864f1cf2d49a12b67577eaef4708176caae208d`、tree `3003dffade33f71c714f2f363207b98c63f2f9ff`。只读底库\
      \ `/workspace/shared/ia-dulwich-main-20261030-1046` 的 HEAD/tree相同、工作树干净。已读 AGENTS、README、PROJECT_STATE、CONTRIBUTING、贡献身份指引与相关身份/schema/registry；未更改这些文件，也没有新增维护规则。\n\
      \n独立遍历261个Canonical YAML文档及252个Candidate YAML文档的身份字段；这是扫描文档数，不是全球覆盖率。Opus身份只命中两个规范：`opus_rfc6716`、`opus_updates_rfc8251`，以及它们的保留候选。没有\
      \ libopus 实现身份或 libopus 候选；Canonical关系文本无Opus命中。已有 FFmpeg 多媒体发行体与 libebur128 等媒体库，所以真实增益是**这个特定 C 编解码库的实现身份及有限运行证据**，不是“音频领域从无实现”。\n\
      \n实时 open PR结果只有held **#498、#439、#416**；all-state `opus` PR搜索只有既有规范/覆盖历史。完整两页分支名100+57=157，无Opus命名分支。额外all-state\
      \ `libopus is:issue`查询返回0且 `incomplete_results=false`。这些是可见接口的当时冲突扫描，不是对所有隐藏/私人工作或未来状态的保证；实际写入前仍须重查main与相关工作。\n\
      \n实际导航位置是 `01_State/Inbox/relations/intake-coverage-20260913.yaml`，`semantics: editorial_navigation_only`；现有\
      \ `image_color` 名称是“图像、色彩与编码 / Image, color and coding”，已经指向 RFC6716及RFC8251候选。本次无需“修正”类别名称或新建audio分类。`intake-coverage-map.yaml`自身是旧的RFC\
      \ pinned地图，不应把它误当作 `image_color` 的定义位置。\n\n`object-kind.vocabulary.json`中 `library` 已是 active、family=`system`、profile=`implementation`；普通记录应沿该当前模型，而不是旧\
      \ `type: implementation` 或把软件误作规范性 `reference_implementation`。全部29个既有 capability 已列于独立audit；无准确的音频编解码能力。`text_encoding`是字符编码、`data_serialization`是结构化数据语义，不能为填字段勉强挂接。**建议不合成\
      \ capabilities，不建 implements/compatible_with/uses 等技术关系。**有公开RFC背景来源不等于已经取得特定规范版本的完整实现证明。\n\n## 4. 上游身份、发布时间、来源与许可证\n\
      \nconnector独立读取的 annotated tag `v1.6.1`对象为 `a5d6c1b6f4e582df97390f9ac5c6e7c51cbffffe`，所指commit为 `22244de5a79bd1d6d623c32e72bf1954b56235be`、tree为\
      \ `a5e21b6751d8f187b83ad9d5f3a57aab801cf722`，与本地Git对象相同。GitHub提供verified metadata不等于我独立验证了签名者密钥或供应链安全。\n\n\
      [官方 development 页面](https://opus-codec.org/development/)明确主仓在Xiph GitLab、GitHub为镜像。[官方 downloads](https://opus-codec.org/downloads/)当时列stable\
      \ libopus 1.6.1，[1.6.1 release 页面](https://opus-codec.org/release/stable/2026/01/14/libopus-1_6_1.html)给出2026-01-14；而connector的GitHub\
      \ `releases/latest`仍为v1.5.2。因此选择1.6.1可成立，但公开文字应使用固定版本及观察时说明，不能把GitHub latest误作当前官方稳定版依据。发布页tarball SHA-256只是发布者元数据：本Reviewer也未取得该tarball，不声明已本地验包或tarball与Git树全成员相等。\n\
      \n亲自阅读固定README、COPYING、LICENSE_PLEASE_READ以及CELT/SILK相关文件头。COPYING三条款BSD与其他文件头/贡献条款须区分；官方[license页面](https://opus-codec.org/license/)是版权/专利来源，不是本Reviewer法律结论。保持版权原文件；不合成一个覆盖全树材料的无条件\
      \ `license_expression`，不修改IA许可证、不作专利可实施性、生产适用性或第三方权利保证。\n\n## 5. 独立源码/探针检查及实际重放\n\n亲自检查原始 `probe.c`/`replay.py`、固定README/API\
      \ header、编码/解码创建参数guard、`frame_size_select`、repacketizer、上游CMake目标与 `cmake/RunTest.cmake`、`tests/test_opus_common.h`\
      \ 和encoder fuzz guard。自写require退出非零，成功路径相关API状态码、边界长度/样本数和range getters均有检查；命名计数与总结均由实际输出验证。未发现通过禁用guard或改库制造绿色结果的做法。\n\
      \n实际执行：\n\n```text\npython /workspace/shared/ia-opus-research-20261030-1231/replay.py\n  --source /workspace/shared/ia-opus-independent-preflight-20261030-1242/source\n\
      \  --output /workspace/shared/ia-opus-independent-preflight-20261030-1242/replay\n  --cmake /workspace/shared/ia-libebur128-research-20261030-0757/tools-venv/bin/cmake\n\
      \  --ctest /workspace/shared/ia-libebur128-research-20261030-0757/tools-venv/bin/ctest\n  --cc gcc\n```\n\n\
      全阶段通过。Linux6.18.57 x86_64、GCC14.2.0、CMake/CTest3.31.10、glibc2.41；配置和编译在新输出目录。Release static、floating-point、float\
      \ API、scalar，DRED/OSCE/DEEP_PLC/custom/programs/encoder-FUZZING关闭；hardening保留，additional OPUS_ASSERTIONS关闭。实际编译flags没有SIMD/DNN启用宏。未下载安装依赖、模型或运行网络服务；工具版本不是整个供应链hash锁定。\n\
      \n**本配置5/5 CTest通过**：decode、padding、api、encode、extensions。CTest报告总时间80.26秒（驱动包围调用80.396秒）。`SEED=12345`；`TEST_OPUS_NOFUZZ`未设，日志确有encoder\
      \ fuzz-settings执行。`RunTest.cmake`对非零失败，`_test_failed`调用abort，因此不是靠无条件exit0假装断言通过。注意padding目标有约16.9MB固定输入，不能称全部输入很小。\n\
      \n同一研究者探针的**81个命名组**通过，runtime准确为 `libopus 1.6.1`，全部JSON观察与研究原结果相等。我执行了它，但未把其代码改称Reviewer原创。60个PCM16矩阵组合（五采样率×单/双声道×六时长）加21组API/包边界，只是局部回放；与上游测试、研究者重复运行高度重叠，**不能相加覆盖率、算作81个规范要求或跨实现互通**。\n\
      \n有界解释：\n\n- 输入PCM、输出raw Opus packets；不是Ogg .opus 文件工具、RTP协议栈、播放器或格式识别器。\n- encode返回字节数，decode返回每声道samples；stereo\
      \ PCM交错。24-bit API以int32承载；float正常范围±1。矩阵/range一致性不是音质、原PCM无损还原或外部实现兼容性。\n- 原研究矩阵未测80/100/120ms；源码确有相关frame-size分支。96000拒绝限此构建，`ENABLE_QEXT`可改变接受条件；1/2声道是single-stream，不能否定multistream\
      \ API。\n- lookahead312只限该实例；NULL/0长度20ms PLC返回960不证明真实丢包恢复质量。未证FEC/DTX/seek/性能/同步。\n- padded包直接解码；unpad和extract只有解析时长检查。重复同包repacketize不是任意包组合、容器语义或音频恢复证明。\n\
      \n**NOT RUN**：RFC8251官方外部test vectors、RFC6716规范向量、Autotools完整make check、额外CELT单元目标/projection/custom/DRED测试、其他seed/配置/平台、SIMD、fixed-point、DNN模型、sanitizer、benchmark、外部FATE/独立编解码实现、网络/生产负载/漏洞验证。[RFC8251\
      \ §11](https://www.rfc-editor.org/rfc/rfc8251.html#section-11)有其独立向量要求；五CTest不能替代这一程序或完整规范性解码器符合性。\n\n## 6.\
      \ 失败、警告与未触碰的授权边界\n\n独立重编同样出现 `silk/decode_indices.c`74及133行两个 `-Wstringop-overflow`警告；日志保留，既不静默移除，也不宣告误报、漏洞或零警告。原probe-v1的编译失败、audit-v1语法失败、audit-v2真实CRLF身份断言失败均逐字保留于封存研究，独立observations另外保存原exit/log文本。\n\
      \n本Review的一次只读临时能力枚举因YAML日期无法直接JSON序列化中止，随后用显式日期转换完成全遍历；未据失败输出宣称扫描完毕。一次GitHub只读issue搜索缺少类型限定返回422 INVALID_ARGUMENT，原错误保存；补正确\
      \ `is:issue` 参数后成功。这些不是权限拒绝，也没有转移执行器规避权限。\n\n无IA写入、候选、acceptance packet、F、commit、branch、PR、review/comment、Pages/search/renderer改动。**#276明确禁止的body/comment写入未请求、未重试；#498/#439/#416及identity\
      \ holds不动。Tomli发布审批 `manager:13028553b81e4e01b74d2c5328ab8296:1` 仍是已知待用户决定事项，本Reviewer未请求/重试/绕过，也没有用本Opus预审为Tomli放行。**\n\
      \n本次可执行预审已经完成；无被阻断的预审动作。需要下一轮作者落实的是上面的有限措辞条件及实际工件审核，而非新增用户授权、被审材料堆积或扩展治理。报告和证据独立封存；最终文件hash由同目录manifest与交接返回，之后不修改此版本。\n"
