        def sha(b): return hashlib.sha256(b).hexdigest()\np=argparse.ArgumentParser(); p.add_argument('--source',type=pathlib.Path,required=True)\n\
        p.add_argument('--output',type=pathlib.Path,required=True); p.add_argument('--cmake',required=True)\np.add_argument('--ctest',required=True);\
        \ p.add_argument('--cc',default='gcc'); a=p.parse_args()\nsrc=a.source.resolve(); out=a.output.resolve();\
        \ out.mkdir(parents=True,exist_ok=False)\nenv=dict(os.environ)\nremoved=['TEST_OPUS_NOFUZZ','CFLAGS','CPPFLAGS','CXXFLAGS','LDFLAGS','MAKEFLAGS']\n\
        for name in removed: env.pop(name,None)\nenv['SEED']='12345'\ndef git(*args): return subprocess.check_output(['git','-C',str(src),*args]).decode().strip()\n\
        assert git('rev-parse','HEAD')==COMMIT\nassert git('rev-parse','HEAD^{tree}')==TREE\nassert git('status','--porcelain')==''\n\
        audit=json.loads((ROOT/'source-audit.json').read_text())\nassert audit['commit']==COMMIT and audit['tree']==TREE\n\
        for item in audit['files']:\n    f=src/item['path']; data=str(f.readlink()).encode() if item['mode']=='120000'\
        \ else f.read_bytes()\n    assert sha(data)==item['checkout_sha256'], str(f)\nassert sha((ROOT/'probe.c').read_bytes())==PROBE_SHA\n\
        (out/'input-verification.json').write_text(json.dumps({'commit':COMMIT,'tree':TREE,'verified_files':len(audit['files']),\n\
        \ 'normalizations':audit['checkout_normalizations'],'probe_sha256':PROBE_SHA,'SEED':'12345','unset_environment_keys':removed},indent=2)+'\\\
        n')\ndef run(name,cmd,timeout=900):\n    start=time.monotonic()\n    with (out/(name+'.log')).open('w')\
        \ as f:\n        f.write('$ '+json.dumps(list(map(str,cmd)))+'\\n'); f.flush()\n        try: r=subprocess.run(list(map(str,cmd)),cwd=out,env=env,stdout=f,stderr=subprocess.STDOUT,timeout=timeout)\n\
        \        except subprocess.TimeoutExpired:\n            (out/(name+'.result.json')).write_text(json.dumps({'status':'timeout','timeout_seconds':timeout})+'\\\
        n'); raise\n    (out/(name+'.result.json')).write_text(json.dumps({'exit':r.returncode,'elapsed_seconds':time.monotonic()-start})+'\\\
        n')\n    if r.returncode: raise SystemExit(f'{name} failed; see {out}')\nfor name,cmd in [('cmake-version',[a.cmake,'--version']),('ctest-version',[a.ctest,'--version']),('cc-version',[a.cc,'--version'])]:\
        \ run(name,cmd)\nbuild=out/'build'\nrun('configure',[a.cmake,'-S',src,'-B',build,'-DCMAKE_BUILD_TYPE=Release',\n\
