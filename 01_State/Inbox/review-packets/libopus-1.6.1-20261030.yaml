      utf8: '#!/usr/bin/env python3

        """Portable entrypoint for extracted original scripts, not an IA validator.

        Requires existing Python 3, Git, GCC, CMake and CTest; installs nothing.

        """

        import argparse,hashlib,json,pathlib,subprocess,sys

        ROOT=pathlib.Path(__file__).resolve().parent

        p=argparse.ArgumentParser();p.add_argument(''--source'',type=pathlib.Path);p.add_argument(''--output'',type=pathlib.Path,required=True);p.add_argument(''--cmake'',default=''cmake'');p.add_argument(''--ctest'',default=''ctest'');p.add_argument(''--cc'',default=''gcc'');a=p.parse_args()

        assert not a.output.exists(),''Output must be new''

        source=a.source.resolve() if a.source else ROOT/''source''

        cmd=[sys.executable,str(ROOT/''acquire_verify.py''),''--source'',str(source),''--output'',str(ROOT/''source-audit.json'')]

        if not a.source:cmd.append(''--clone'')

        subprocess.run(cmd,check=True)

        subprocess.run([sys.executable,str(ROOT/''replay.py''),''--source'',str(source),''--output'',str(a.output),''--cmake'',a.cmake,''--ctest'',a.ctest,''--cc'',a.cc],check=True)

        actual=[json.loads(s) for s in (a.output/''probe.log'').read_text().splitlines() if s.startswith(''{'')]

        expected=json.loads((ROOT/''expected-observations.json'').read_text())

        assert actual==expected,''Observed values differ from the recorded scalar Linux profile; inspect, do not
        silently relabel''

        ctest=(a.output/''ctest.log'').read_text()

        assert ''100% tests passed, 0 tests failed out of 5'' in ctest

        assert len(actual)==83 and actual[-1][''completed_groups'']==81

        (a.output/''PACKET_REPLAY_RESULT.json'').write_text(json.dumps({''all_stages_succeeded'':True,''expected_observation_records'':83,''actual_observation_records'':len(actual),''expected_equal_actual'':True,''scope'':''Same
        fixed scalar floating-point build, 5 CTests and overlapping 81 researcher-authored named groups; not independent
        semantic review or conformance'',''source_commit'':''22244de5a79bd1d6d623c32e72bf1954b56235be'',''expected_observations_sha256'':hashlib.sha256((ROOT/''expected-observations.json'').read_bytes()).hexdigest()},indent=2)+''\n'')

