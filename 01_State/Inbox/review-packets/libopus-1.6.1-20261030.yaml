  proposed_utf8: "id: libopus\ntype: system\nkind: library\nname_zh: libopus C 音频编解码库\nname_en: libopus C audio\
    \ codec library\ndescription_zh: 'libopus 是在 PCM 音频与原始 Opus 包之间编码、解码的 C 库；本记录的可执行证据固定于 1.6.1（官方发布日 2026-01-14），源码为\
    \ xiph/opus 镜像 commit\n  22244de5a79bd1d6d623c32e72bf1954b56235be。它是独立的软件实现身份，不是 RFC 6716 的规范性解码器文档、RFC 8251\
    \ 更新规范、Ogg .opus 文件工具、RTP 协议栈、播放器或格式识别器；Opus\n  的容器、传输及 opus-tools/opusfile/libopusenc 属于其他对象。这里仅沿既有 image_color\
    \ 编辑导航，不据本地测试声明完整 RFC implements 或其他技术关系。\n\n\n  实际验证限于 Linux x86_64、GCC 14.2.0、CMake/CTest 3.31.10 的 Release\
    \ 静态库：floating-point core 与 float API，scalar（OPUS_DISABLE_INTRINSICS=ON），DRED、OSCE、DEEP_PLC、custom\n  modes、programs\
    \ 和 encoder FUZZING 关闭；正常 hardening 保留、additional assertions 关闭。构建使用系统 libc/libm 和既有构建工具，未另行下载外部神经模型或取得额外媒体依赖；普通编码分析路径的\n\
    \  Keras 生成权重已随 src/mlp_data.c 源码取得，src/mlp.c、src/mlp_data.c 与 src/analysis.c 实际参与编译，后者包含 dense/GRU 计算。这不是无神经网络构建或无神经计算的声明；工具版本记录不是完整供应链或二进制可复现保证。源树755文件中753个\n\
    \  checkout 原字节等于 Git blob，两个未执行的 Windows .bat 文件仅按上游 eol=crlf 规则转换。两处 silk/decode_indices.c 的 GCC -Wstringop-overflow\n\
    \  警告保留，不称零警告、误报或已确认漏洞。\n\n\n  本配置启用的五个 CTest（decode、padding、api、encode、extensions）在 SEED=12345、TEST_OPUS_NOFUZZ\
    \ 未设置时通过；不是所有上游测试通过。研究者自写探针的81个命名组也被作者重放：60个\n  PCM16 组合为 8000/12000/16000/24000/48000 Hz × 单/双声道 × 2.5/5/10/20/40/60\
    \ ms，另21组是有限 API/包边界。重复执行、同库编码解码与上游测试重叠，不能相加覆盖率或称跨实现互通；同库\n  final-range 一致不证明完整符合性或原 PCM 无损还原。80/100/120 ms\
    \ 未在自写矩阵覆盖；96000 Hz 拒绝仅限此构建，不否定未启用的 QEXT 配置；单流1/2声道限制不否定 multistream\n  API。\n\n\n  编码返回字节数，解码返回每声道 sample 数；双声道\
    \ PCM 为交错排列，float 正常输入范围为 ±1，24-bit API 使用 int32 承载。本例 lookahead=312 samples/channel\n  不是所有模式常数；NULL/零长度包请求20\
    \ ms PLC得到960 samples/channel 只证明计数，不证明丢包恢复质量。命名的错误采样率、声道、application、帧长、输出容量、complexity\n  与截断包例返回预期错误，不是任意错误指针、缓冲区、非有限/超范围样本均安全拒绝的结论。\n\
    \n\n  包操作的实际边界：padding 后的包确实被解码并检查计数；unpad 后与抽出的第二帧仅检查解析时长，未直接解码。repacketizer 把同一个20 ms包添加两次，合成40 ms包并解码，随后抽取第二帧；不是两个独立音频片段、任意包均可拼接、原始字节恢复或容器语义证明。未独立验证\n\
    \  FEC、DTX、seek、音质、延迟、性能或外部时钟同步。\n\n\n  未运行 RFC 8251 官方外部向量、RFC 6716 规范向量、完整 Autotools make check、额外 CELT/projection/custom/DRED\
    \ 目标、其他seed/平台、SIMD、fixed-point、可选\n  DRED/OSCE/DEEP_PLC 增强配置及另行下载的模型、sanitizer、benchmark、外部 FATE/独立编解码器、网络/生产负载或漏洞验证；五个\
    \ CTest 不替代规范符合性程序。保留探针初版编译失败及两版审计失败，最终探针只修正括号/换行，未修改上游或测试失败守卫。COPYING\n  的三条款 BSD、不同文件头的两/三条款 BSD 与贡献约定中的 Clear\
    \ BSD 应分别查阅；不合成覆盖整树的许可证表达式，不保证专利可实施性、第三方权利、安全、生产适用性或 IA 采用。\n\n\n  English scope and limitations:\n\n\n  libopus\
    \ is a C library for encoding and decoding between PCM audio and raw Opus packets. Executable evidence here\n\
    \  is fixed to 1.6.1 (official release date 2026-01-14), from the xiph/opus mirror at commit 22244de5a79bd1d6d623c32e72bf1954b56235be.\n\
