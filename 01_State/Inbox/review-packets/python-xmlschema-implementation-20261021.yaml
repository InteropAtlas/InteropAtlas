    name_zh: xmlschema Python XSD 库
    name_en: xmlschema Python XSD library
    description_zh: 用于 XML Schema 验证及 XML 数据编解码的开源 Python 库；本记录固定到4.3.2，保留验证模式、资源策略和版次证据边界。
    description_en: An open-source Python library for XML Schema validation and XML data encoding/decoding, pinned
      here to 4.3.2 with validation-mode, resource-policy and edition-evidence boundaries.
    version: 4.3.2
    external_identifiers:
    - namespace: github
      value: sissaschool/xmlschema
    - namespace: pypi
      value: xmlschema
    official_url: https://github.com/sissaschool/xmlschema
    versions:
    - version: 4.3.2
      status: released
      url: https://github.com/sissaschool/xmlschema/releases/tag/v4.3.2
    domains:
    - schema
    - validation
    - structured_data
    capabilities:
    - schema_validation
    open_source: true
    license_expression: MIT
    scope_notes_zh: 固定 4.3.2 的 Python XSD 验证/编解码库，依赖 elementpath 和 Python XML 处理设施；官方声明 XSD 1.0/1.1，默认 XMLSchema
      指向 XMLSchema10，XMLSchema11 需显式选择。默认 strict；lax 保留错误并可能将不可解码值置 None，skip 顶层解码可保留非法词法文本而不报告错误，不等于验证通过。资源默认 allow=all、defuse=remote，不是默认离线或所有输入均禁实体；本轮可信内存输入显式
      allow=none、defuse=always，正常读取随包可信元模式，未测实体攻击或外部资源。默认忽略实例 schemaLocation；path 空选择默认可空泛通过，allow_empty=False 可要求报错。25例观察区分实例不符合、XML解析异常和模式构造异常；Decimal
      示例保持该值，但将编码后的 Element 再解码会改变命名空间键和字典形状，不作通用无损往返保证。随包 XSD_1.0/XMLSchema.xsd 自述非规范且文档指向2004-03 PER，不能仅凭元模式复制或总体支持声明推出2004-10精确规范全符合；本批不建
      implements。未跑 XSD1.1、W3C全套测试、UBL实例/业务规则、第三方互通或生产安全评估，不表示IA采用。
    scope_notes_en: Fixed to the 4.3.2 Python XSD validation/encoding/decoding library, using elementpath and Python
      XML facilities. Upstream declares XSD 1.0/1.1; XMLSchema defaults to XMLSchema10, while XMLSchema11 requires
      explicit selection. Strict is default; lax retains errors and may substitute None, while top-level skip decoding
      can retain invalid lexical text without reporting errors, not successful validation. Resource defaults are
      allow=all and defuse=remote, not offline operation or entity prevention for every input. Trusted-memory tests
      explicitly use allow=none and defuse=always; bundled trusted meta-schemas are read normally, with no external-resource
      or entity-attack assessment. Instance schemaLocation hints are ignored by default; an empty path selection
      can pass vacuously unless allow_empty=False is requested. Twenty-five observations distinguish instance violations,
      XML parse exceptions and schema-construction exceptions. A Decimal value survives the tested conversion, but
      decoding the encoded Element changes namespace keys and dictionary shape, not a general lossless round trip.
      Bundled XSD_1.0/XMLSchema.xsd labels itself non-normative and points to a March 2004 PER; neither that copy
      nor the general support claim alone proves full conformance to the precise October 2004 documents, so no implements
      edge is added. XSD 1.1 execution, a full W3C suite, UBL/business rules, third-party interoperability, production
      security and IA adoption are not established.
