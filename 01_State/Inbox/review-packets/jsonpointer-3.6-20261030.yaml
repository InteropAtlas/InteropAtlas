        dict 已丢失重复名称信息，不能据此证明原 JSON 合规。精确 Unicode、不做百分号解码、数组索引/错误/default/verbose 等条件适用。set/create 和 Python ducktype
        为库扩展；内置有限失败不改原件不推广为任意自定义 setter 原子性。CLI -f 文本换行转换及去尾 CR/LF 可选择另一合法成员，部分 stdout/继续标志不代表整批成功。只赋予既有 resource_identification
        的文档内值定位含义，不推断 JSON Patch、JSONPath、HTTP 获取、数据序列化、身份所有权、安全、互通或 IA 采用。
      conditions_en: 'Limited to the fixed 3.6 documented RFC 6901 string-pointer token representation and finite
        existing-value resolution in already parsed Python data with unique string object names. Caller JSON-string/URI-fragment
        conversion remains separate and the existing RFC 4627 publication reference is unchanged. Not full conforms_to:
        array - produces API EndOfList rather than an existing value, and ordinary dicts have lost duplicate-name
        information. Exact Unicode, literal percent sequences, index/error/default/verbose conditions apply. set/create
        and ducktypes are library extensions; tested built-in non-mutation is not arbitrary custom-setter atomicity.
        CLI -f text-mode newline conversion and terminal CRLF trimming may select another member; partial stdout/continuation
        is not batch success. Existing resource_identification means within-document value identification only,
        not JSON Patch/JSONPath/HTTP retrieval/serialization/ownership/security/interoperability or IA adoption.'
