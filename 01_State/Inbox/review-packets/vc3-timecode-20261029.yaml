      language: en
      accessed: '2026-10-29'
    - url: https://pub.smpte.org/doc/st2019-1/20220928-am1-pub/st2019-1-amd1-2023.pdf#page=2
      title: Separate Amendment 1:2023 §1 — HD-profile alpha extension, excluded from base review
