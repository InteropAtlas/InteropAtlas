review_scope_zh:
- 连续处理四个既有专业媒体候选：SMPTE ST 292-1、ST 424、ST 2082-1、ST 2022-6；不新建候选身份。
- 四项均固定为各自独立标准文档，不把 SDI 家族、映射标准、ST 2110 或实现产品合并为同一主体。
- 作者仅使用 SMPTE 官方公开出版元数据/可公开读取文本核对标题、版次和最小范围；不复制受版权保护正文。
- Reviewer 需核对完整 Canonical、原候选 blob 和本包有限一手材料，对每项给出 acceptable_for_ordinary_acceptance / deferred / rejected，并明确整个 proposed_record 是否允许原样复制。
- CI、代码无发现或点赞不构成语义接纳；关系、实现兼容性、行业普及度、替代/取代关系均不在本轮授权范围。
