      API 当成对任意输入都返回统一诊断、严格符合性或授权结果的总验证器。


      渲染与别名归一不保留原始词法形式。AND / OR / WITH 与括号按实现规则构造表达式；WITH 是 license-plus-exception 原子项。dedup 去重与 simplify 不同：所测
