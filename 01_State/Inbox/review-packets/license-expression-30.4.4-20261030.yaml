      SPDX License List 的验证器。已登记 vendor LicenseRef（例如 LicenseRef-scancode-3com-microcode）可通过 strict=True、validate=True；未登记的
      LicenseRef-local / DocumentRef-doc:LicenseRef-local 则可先解析、后被键校验拒绝。默认 parse(validate=False, strict=False)
      允许未知名称，先进分词器还接受含空格或非 ASCII 的一般符号；simple=True 改变分词方式。这些接受行为不证明规范标识符语法或外部文档引用已解析。已知别名/大小写可归一：GPL-2.0→GPL-2.0-only、GPL-2.0+→GPL-2.0-or-later；但未登记
      MIT+ 被 stock validate 拒绝，+ 不是普遍版本范围求值器。未知 LicenseRef-A 与 LicenseRef-a 的解析对象在所测上下文并不相等，而已注册的自定义符号可被大小写不敏感地识别；不是统一的自定义引用语义规范化。deprecated
      标记也不自动导致拒绝。


      validate=True 检查配置表中的已知键；strict=True 主要检查 WITH 两侧 license/exception 角色及独立 exception 使用，不判断该 exception
      在法律上是否适用于许可证。两标志同时开启仍接受混合大小写 AnD / WiTh，与固定 SPDX 3.0.1 的全大写或全小写运算符语法不同。任意 AdditionRef 在默认解析中可成为未知 token；未标记
      exception 的 AdditionRef 用作 WITH 右侧会被 stock strict 拒绝，调用方自行登记 is_exception=True 的符号则可通过；这是配置行为，不证明 AdditionRef
      的完整标准实现。换行可被当作空白归一，与 SPDX tag:value 上下文的单行要求不同，不把这一约束扩大到所有表示格式。


