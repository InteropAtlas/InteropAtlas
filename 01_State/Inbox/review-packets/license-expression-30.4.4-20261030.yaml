      English scope and limitations:


      license-expression is AboutCode''s Python expression utility library, pinned here to PyPI 30.4.4 (artifact
      upload date 2025-07-22) and source commit a3c00c09986bcca1240afd5b1844b56de3f581c1, declaring Python
      >=3.9 and boolean.py >=4.0. Existing license_expression records a technical precedent for parsing, registry
      checking, normalization and Boolean-expression operations, with existing syntax navigation and no new
      technical relations. The fixed README references SPDX 2.3 expressions, while IA''s existing normative
      object is SPDX License Expressions 3.0.1. These APIs do not demonstrate full implementation/conformance
      to that 3.0.1 grammar or establish REUSE, IA-adoption, dependency or compatibility edges.


      Licensing() has no known-symbol registry by default. get_spdx_licensing() and get_scancode_licensing()
      load different keys/aliases from the fixed ScanCode-derived table, not an official-SPDX-License-List-only
      validator. Registered vendor LicenseRefs such as LicenseRef-scancode-3com-microcode can pass strict=True
      and validate=True, while absent LicenseRef-local / DocumentRef-doc:LicenseRef-local can parse and then
      fail known-key validation. Default parse(validate=False, strict=False) permits unknown names; the advanced
      tokenizer also accepts space-bearing or non-ASCII generic symbols, while simple=True changes tokenization.
      Acceptance does not establish normative identifier grammar or resolve external document references. Known
      aliases/case can normalize: GPL-2.0 to GPL-2.0-only and GPL-2.0+ to GPL-2.0-or-later; unregistered MIT+
      fails stock validation, and + is not a general version-range evaluator. Parsed unknown LicenseRef-A and
      LicenseRef-a are unequal in the tested context, whereas registered custom symbols can be recognized case-insensitively:
      this is not uniform custom-reference semantic normalization. A deprecated flag does not automatically
      reject a symbol.


      validate=True checks configured known keys. strict=True primarily checks license/exception roles around
      WITH and standalone exception use, not whether an exception legally applies to a license. Even both flags
      accept mixed-case AnD/WiTh, unlike the fixed SPDX 3.0.1 all-upper/all-lower operator grammar. Arbitrary
      AdditionRef text can be an unknown token in default parsing; an untyped AdditionRef on the right of WITH
      fails stock strict checking, whereas caller-registered is_exception=True symbols can pass. This configuration
      behavior does not demonstrate full normative AdditionRef implementation. Newlines may normalize as whitespace,
      unlike the SPDX tag:value context''s single-line requirement; that requirement is not generalized to
      every representation format.


      The already-constructed-object fast path returns an existing LicenseExpression AST unchanged before strict/validate
      checks, without revalidation under newly supplied flags. A previously tolerant-parsed MIT WITH Apache-2.0
      AST therefore does not repeat exception-role checking, and validate(that AST) can report no errors when
      both keys are known; the corresponding string is rejected with strict=True. An unknown-key AST likewise
      is not rechecked by parse(validate=True), although validate(AST) still reports unknown keys. parse(None/blank)
      returns None; validate(None/blank) can return errors=[] and normalized_expression equal to the string
      "None", not a valid-license conclusion. Tested integer and bytes inputs raise ExpressionError through
      parse, while validate can leak AttributeError from its error handling. Neither API is a total arbitrary-input
      validator promising uniform diagnostics, strict conformance or authorization.


      Rendering and alias normalization do not preserve original lexical form. AND/OR/WITH and parentheses
      build expressions according to implementation rules; WITH is an atomic license-plus-exception term. dedup
      differs from simplify: tested MIT OR (MIT AND Apache-2.0) simplifies by Boolean absorption to MIT while
      dedup preserves that structure. is_equivalent recognizes tested commutative forms but returns false for
      a pair differing only by distributive expansion, so it is not a complete Boolean-equivalence procedure.
      contains(''MIT OR Apache-2.0'',''MIT'') returning true is library subexpression containment, not logical
      implication, required obligations, license compatibility or permission. Unknown-key results for NONE/NOASSERTION
      describe this registry only, not their legality across all SPDX fields.


      Source discrepancies remain explicit: the fixed README says SPDX License List 3.26 / ScanCode 32.3.1,
      while the packaged .ABOUT, tag and CHANGELOG say License List 3.27. The .ABOUT pins index.json at ScanCode
      commit 1dfa89ae348338b23a359c4c6b23e39c128a41e5; the packaged JSON is raw-byte-identical to that source.
      License List versions are not expression specification 3.0.1. The CHANGELOG 30.4.4 heading says 2025-01-10,
      unlike tag/PyPI artifact timing on 2025-07-22. This record uses the observed PyPI upload date without
      silently correcting upstream files or claiming latest status. All 71 library-source blobs and 23 boolean.py
      5.0 source blobs were checked. Only six license_expression package files (including data/notices) and
      three boolean files (including a packaged test) match source/wheel/sdist bytes, not whole-distribution
      equality or reproducible builds. Vendored modified pure-Python Aho-Corasick code does not establish C-extension
      equivalence or performance.


      Actual execution uses fixed CPython 3.12.14 and boolean.py 5.0, one allowed dependency combination rather
      than all >=4.0 versions or a Python/platform matrix. The author freshly reconstructed public artifacts
      and replayed the researcher''s 79 finite records in source/wheel modes, each 79/79, plus 50 separately
      authored assertions in source and safely extracted-wheel -I -S modes. Unmodified upstream configuration
      reports 188 source passes; wheel execution splits 176 tests and 12 packaged doctests covering the same
      scope, not additional unique coverage. boolean.py source/wheel each report 86 passes and four retained
      upstream xfails. Independent preflight''s 40 observations and registry checks overlap researcher/author/upstream
      cases and are never added as coverage. The runner explicitly checks source/wheel import paths without
      test-source patches, test adapters or injected skips. Test dependencies are version-locked only; four
      release archives separately have verified SHA-256, not an entirely hash-pinned dependency chain. Runtime
      uses fixed wheels without building these libraries; tag signatures were not verified. Initial missing-setuptools
      collection failure and existing-venv SameFileError remain recorded, not passes; the author''s first public
      acquisition stopped on upstream HTTP 503 before tests and remains recorded; the subsequent fresh-directory
      replay actually succeeded.


      This record does not interpret legal effect or determine actual artifacts'' license applicability, rights,
      obligations, compatibility, compliance or security policy. It does not scan license texts, prove complete
      SBOM/SPDX conformance, recommend production use, assert IA adoption, authenticate signatures/supply chains
      or guarantee future compatibility. IA licensing properties, existing SPDX/REUSE records, capability meaning
      and previous uses relations are not reapproved by this tool entry.'
    description_en: 'license-expression is AboutCode''s Python expression utility library, pinned here to PyPI
      30.4.4 (artifact upload date 2025-07-22) and source commit a3c00c09986bcca1240afd5b1844b56de3f581c1,
      declaring Python >=3.9 and boolean.py >=4.0. Existing license_expression records a technical precedent
      for parsing, registry checking, normalization and Boolean-expression operations, with existing syntax
      navigation and no new technical relations. The fixed README references SPDX 2.3 expressions, while IA''s
      existing normative object is SPDX License Expressions 3.0.1. These APIs do not demonstrate full implementation/conformance
      to that 3.0.1 grammar or establish REUSE, IA-adoption, dependency or compatibility edges.


      Licensing() has no known-symbol registry by default. get_spdx_licensing() and get_scancode_licensing()
      load different keys/aliases from the fixed ScanCode-derived table, not an official-SPDX-License-List-only
      validator. Registered vendor LicenseRefs such as LicenseRef-scancode-3com-microcode can pass strict=True
      and validate=True, while absent LicenseRef-local / DocumentRef-doc:LicenseRef-local can parse and then
      fail known-key validation. Default parse(validate=False, strict=False) permits unknown names; the advanced
      tokenizer also accepts space-bearing or non-ASCII generic symbols, while simple=True changes tokenization.
      Acceptance does not establish normative identifier grammar or resolve external document references. Known
      aliases/case can normalize: GPL-2.0 to GPL-2.0-only and GPL-2.0+ to GPL-2.0-or-later; unregistered MIT+
      fails stock validation, and + is not a general version-range evaluator. Parsed unknown LicenseRef-A and
      LicenseRef-a are unequal in the tested context, whereas registered custom symbols can be recognized case-insensitively:
      this is not uniform custom-reference semantic normalization. A deprecated flag does not automatically
      reject a symbol.


      validate=True checks configured known keys. strict=True primarily checks license/exception roles around
      WITH and standalone exception use, not whether an exception legally applies to a license. Even both flags
      accept mixed-case AnD/WiTh, unlike the fixed SPDX 3.0.1 all-upper/all-lower operator grammar. Arbitrary
      AdditionRef text can be an unknown token in default parsing; an untyped AdditionRef on the right of WITH
      fails stock strict checking, whereas caller-registered is_exception=True symbols can pass. This configuration
      behavior does not demonstrate full normative AdditionRef implementation. Newlines may normalize as whitespace,
      unlike the SPDX tag:value context''s single-line requirement; that requirement is not generalized to
      every representation format.


      The already-constructed-object fast path returns an existing LicenseExpression AST unchanged before strict/validate
      checks, without revalidation under newly supplied flags. A previously tolerant-parsed MIT WITH Apache-2.0
      AST therefore does not repeat exception-role checking, and validate(that AST) can report no errors when
      both keys are known; the corresponding string is rejected with strict=True. An unknown-key AST likewise
      is not rechecked by parse(validate=True), although validate(AST) still reports unknown keys. parse(None/blank)
      returns None; validate(None/blank) can return errors=[] and normalized_expression equal to the string
      "None", not a valid-license conclusion. Tested integer and bytes inputs raise ExpressionError through
      parse, while validate can leak AttributeError from its error handling. Neither API is a total arbitrary-input
      validator promising uniform diagnostics, strict conformance or authorization.


      Rendering and alias normalization do not preserve original lexical form. AND/OR/WITH and parentheses
      build expressions according to implementation rules; WITH is an atomic license-plus-exception term. dedup
      differs from simplify: tested MIT OR (MIT AND Apache-2.0) simplifies by Boolean absorption to MIT while
      dedup preserves that structure. is_equivalent recognizes tested commutative forms but returns false for
      a pair differing only by distributive expansion, so it is not a complete Boolean-equivalence procedure.
      contains(''MIT OR Apache-2.0'',''MIT'') returning true is library subexpression containment, not logical
      implication, required obligations, license compatibility or permission. Unknown-key results for NONE/NOASSERTION
      describe this registry only, not their legality across all SPDX fields.


      Source discrepancies remain explicit: the fixed README says SPDX License List 3.26 / ScanCode 32.3.1,
      while the packaged .ABOUT, tag and CHANGELOG say License List 3.27. The .ABOUT pins index.json at ScanCode
      commit 1dfa89ae348338b23a359c4c6b23e39c128a41e5; the packaged JSON is raw-byte-identical to that source.
      License List versions are not expression specification 3.0.1. The CHANGELOG 30.4.4 heading says 2025-01-10,
      unlike tag/PyPI artifact timing on 2025-07-22. This record uses the observed PyPI upload date without
      silently correcting upstream files or claiming latest status. All 71 library-source blobs and 23 boolean.py
      5.0 source blobs were checked. Only six license_expression package files (including data/notices) and
      three boolean files (including a packaged test) match source/wheel/sdist bytes, not whole-distribution
      equality or reproducible builds. Vendored modified pure-Python Aho-Corasick code does not establish C-extension
      equivalence or performance.


      Actual execution uses fixed CPython 3.12.14 and boolean.py 5.0, one allowed dependency combination rather
      than all >=4.0 versions or a Python/platform matrix. The author freshly reconstructed public artifacts
      and replayed the researcher''s 79 finite records in source/wheel modes, each 79/79, plus 50 separately
      authored assertions in source and safely extracted-wheel -I -S modes. Unmodified upstream configuration
      reports 188 source passes; wheel execution splits 176 tests and 12 packaged doctests covering the same
      scope, not additional unique coverage. boolean.py source/wheel each report 86 passes and four retained
      upstream xfails. Independent preflight''s 40 observations and registry checks overlap researcher/author/upstream
      cases and are never added as coverage. The runner explicitly checks source/wheel import paths without
      test-source patches, test adapters or injected skips. Test dependencies are version-locked only; four
      release archives separately have verified SHA-256, not an entirely hash-pinned dependency chain. Runtime
      uses fixed wheels without building these libraries; tag signatures were not verified. Initial missing-setuptools
      collection failure and existing-venv SameFileError remain recorded, not passes; the author''s first public
      acquisition stopped on upstream HTTP 503 before tests and remains recorded; the subsequent fresh-directory
      replay actually succeeded.


      This record does not interpret legal effect or determine actual artifacts'' license applicability, rights,
      obligations, compatibility, compliance or security policy. It does not scan license texts, prove complete
      SBOM/SPDX conformance, recommend production use, assert IA adoption, authenticate signatures/supply chains
      or guarantee future compatibility. IA licensing properties, existing SPDX/REUSE records, capability meaning
      and previous uses relations are not reapproved by this tool entry.'
