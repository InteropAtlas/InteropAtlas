    name_zh: Eclipse Thingweb node-wot 软件框架
    name_en: Eclipse Thingweb node-wot framework
    description_zh: 用于以 Node.js/TypeScript 构建 Web of Things 客户端与服务端的软件框架，以事物描述（TD）连接应用与设备接口；本记录固定到 0.9.2。
    description_en: A Node.js/TypeScript framework for Web of Things clients and servers, using Thing Descriptions
      to connect applications and device interfaces; pinned here to release 0.9.2.
    version: 0.9.2
    external_identifiers:
    - namespace: github
      value: eclipse-thingweb/node-wot
    official_url: https://github.com/eclipse-thingweb/node-wot
    versions:
    - version: 0.9.2
      status: released
      url: https://github.com/eclipse-thingweb/node-wot/releases/tag/v0.9.2
    open_source: true
    license_expression: EPL-2.0 OR W3C-20150513
    scope_notes_zh: 主体是包含 core 与协议绑定等包的软件框架，不是 TD 规范、设备或组织；沿用既有 software kind，不新增 framework 类型。本切片限固定 core 的 TD
      1.1 表示、解析/序列化与 consume/produce 路径。parseTD 会补默认上下文/字段并可归一化相对 form URI；它不是完整 TD 校验器。isThingDescription 复用为 ExposedThingInit
      放宽 required 字段的 schema，不能把返回成功当完整 TD 符合性证明。serializeTD 在缺安全配置时可补 nosec 描述，这不是安全部署保证。generic discover 明确未实现，produce
      拒绝 ThingModel 声明。通信需相应绑定；README 中各绑定的客户端/服务端支持范围不同，不推断全部网络协议互通。未验证完整 JSON-LD 处理、所有可选特性、安全性、生产适用性或最新版本，未推断
      self_hostable，未新增或强配 capability。
    scope_notes_en: The subject is the software framework and its core/binding packages, not the TD specification,
      a device or an organization; the existing software kind is used, with no new framework kind. This slice covers
      fixed-core TD 1.1 representation, parsing/serialization and consume/produce paths. parseTD adds default contexts/fields
      and may normalize relative form URIs; it is not a complete TD validator. isThingDescription reuses a schema
      whose required fields were relaxed for ExposedThingInit, so success is not full TD-conformance proof. serializeTD
      can supply a nosec description when security is missing; this is not a secure-deployment guarantee. Generic
      discover is explicitly unimplemented and produce rejects ThingModel declarations. Communication requires suitable
      bindings; documented client/server support differs by binding, not universal protocol interoperability. Full
      JSON-LD processing, every optional feature, security, production suitability and latest-release status are
      not verified. self_hostable is not inferred and no capability is invented or forced onto the framework.
