review_scope_zh:
- 六个既有候选的确切身份、双语名称、最小摘要、kind及明确文档版本。不是新建六个候选。
- 拟入库字段只限各项 proposed_record；classification_rationale 与 excluded_claims 是审查说明，不作为外部事实自动入库。
- 原候选 family/kind 是未审标签。FAIR按原DOI识别论文，Scrum按原2020-11标识识别指南，Double Diamond按原工作级标识识别框架概念；须明确判断这是否为身份保持的分类纠正。若不能确认，暂缓该项，不自动拆分或合并。
- 本包提供作者取得的有限来源摘录。FAIR是发布者索引文本的选段转录，详见固定Git证据文件；不是成功打开DOI或发布者HTTP页面。Reviewer不得声称自己直连官网、检查全文或证明抓取真实性。
- 逐项给出 acceptable_for_ordinary_acceptance / deferred / rejected，并指出具体支持或不足的字段。CI成功、无代码问题或点赞不是接纳判断。
- 先检查基线与当前库的标识和名称重复；仅同名不自动合并。检查当前受控类型表，不发明kind或更改Schema。
- 本轮不提交技术关系或可视化地图；类别归属沿用已存在的引用。
