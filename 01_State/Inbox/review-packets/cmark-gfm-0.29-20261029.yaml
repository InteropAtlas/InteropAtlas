      text: "\"\"\"Reconstruct the finite API probe after build_static.py in a fresh directory.\"\"\"\nfrom pathlib\
        \ import Path\nimport datetime, hashlib, json, subprocess\n\nR = Path(__file__).resolve().parent\nS, B\
        \ = R / 'source', R / 'runtime/build'\nsha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()\nmanifest\
        \ = json.loads((R / 'archive-manifest.json').read_text())\nfor item in manifest:\n    assert sha(S / item['path'])\
        \ == item['sha256']\nbuild = json.loads((R / 'build-report.json').read_text())\nassert build['exit_code']\
        \ == 0\nassert not (B / 'api-probe').exists(), 'refuse to overwrite API probe'\nfor item in build['generated_headers']:\n\
        \    assert sha(B / item['path']) == item['sha256']\nfiles = [S / folder / name for folder, names in build['source_lists'].items()\
        \ for name in names]\nassert len(files) == 34\nhelper = R / 'runtime/api_probe.c'\ncmd = ['gcc', '-std=c99',\
        \ '-O2', '-DCMARK_GFM_STATIC_DEFINE',\n       '-DCMARK_GFM_EXTENSIONS_STATIC_DEFINE', '-I' + str(B), '-I'\
        \ + str(S / 'src'),\n       '-I' + str(S / 'extensions'), *map(str, files), str(helper), '-o', str(B /\
        \ 'api-probe')]\nstarted = datetime.datetime.now(datetime.timezone.utc).isoformat()\np = subprocess.run(cmd,\
        \ capture_output=True)\n(R / 'runtime/api-compile.stdout').write_bytes(p.stdout)\n(R / 'runtime/api-compile.stderr').write_bytes(p.stderr)\n\
        report = dict(command=cmd, exit_code=p.returncode, started_at=started,\n              finished_at=datetime.datetime.now(datetime.timezone.utc).isoformat(),\n\
        \              harness_sha256=sha(helper), source_manifest_sha256=sha(R / 'archive-manifest.json'),\n\
        \              boundary='Self-authored finite API helper against the same 34 unchanged library C files;\
        \ not upstream API/full-suite coverage.')\nif p.returncode == 0:\n    report['binary_sha256'] = sha(B\
        \ / 'api-probe')\n(R / 'runtime/api-build-report.json').write_text(json.dumps(report, indent=2) + '\\\
        n')\nassert p.returncode == 0, p.stderr.decode(errors='replace')\nfor item in manifest:\n    assert sha(S\
        \ / item['path']) == item['sha256']\nprint(json.dumps({k: v for k, v in report.items() if k != 'command'},\
        \ indent=2))\n"
