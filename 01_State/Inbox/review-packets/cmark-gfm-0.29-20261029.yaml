      text: "from pathlib import Path\nfrom html.parser import HTMLParser\nimport subprocess,json,datetime,collections,hashlib,re\n\
        R=Path(__file__).resolve().parent;BIN=R/'runtime/build/cmark-gfm';sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()\n\
        class Sections(HTMLParser):\n def __init__(self):super().__init__();self.section='';self.text=None;self.map={}\n\
        \ def handle_starttag(self,t,a):\n  a=dict(a)\n  if t in ['h1','h2','h3']:self.text=''\n  if t=='div'\
        \ and a.get('class')=='example':self.map[int(a['id'].split('-')[1])]=self.section\n def handle_data(self,s):\n\
        \  if self.text is not None:self.text+=s\n def handle_endtag(self,t):\n  if t in ['h1','h2','h3'] and\
        \ self.text is not None:self.section=re.sub(r'^\\s*[0-9.]+\\s*','',self.text).strip();self.text=None\n\
        p=Sections();p.feed((R/'official-gfm.html').read_text())\nofficial=json.loads((R/'official-examples.json').read_text());source=json.loads((R/'source-spec-examples.json').read_text())\n\
        all_ext=['table','strikethrough','autolink','tagfilter','tasklist'];extmap={'Tables (extension)':['table'],'Task\
        \ list items (extension)':['tasklist'],'Strikethrough (extension)':['strikethrough'],'Autolinks (extension)':['autolink'],'Disallowed\
        \ Raw HTML (extension)':['tagfilter']}\ndef run_profile(name,cases,which):\n results=[];started=datetime.datetime.now(datetime.timezone.utc).isoformat()\n\
        \ for x in cases:\n  ext=which(x);cmd=[str(BIN),'--unsafe']+[v for e in ext for v in ['-e',e]];p=subprocess.run(cmd,input=x['markdown'].encode(),capture_output=True,timeout=10);expected=x['html'].encode();sec=x.get('section')\
        \ or globals()['p'].map[x['example']]\n  results.append(dict(example=x['example'],section=sec,extensions=ext,source_disabled='disabled'\
        \ in x.get('extensions',[]),input_hex=x['markdown'].encode().hex(),expected_hex=expected.hex(),output_hex=p.stdout.hex(),stderr_hex=p.stderr.hex(),exit_code=p.returncode,pass_exact=p.returncode==0\
        \ and p.stdout==expected))\n summary=dict(profile=name,started_at=started,finished_at=datetime.datetime.now(datetime.timezone.utc).isoformat(),binary_sha256=sha(BIN),examples=len(results),passed=sum(x['pass_exact']\
        \ for x in results),failed=sum(not x['pass_exact'] for x in results),source_disabled=sum(x['source_disabled']\
        \ for x in results),non_disabled_pass=sum(x['pass_exact'] and not x['source_disabled'] for x in results),by_section={s:dict(total=sum(x['section']==s\
        \ for x in results),passed=sum(x['section']==s and x['pass_exact'] for x in results)) for s in sorted({x['section']\
        \ for x in results})},failing_examples=[x['example'] for x in results if not x['pass_exact']],boundary='Self-authored\
        \ exact output-byte comparison; explicit --unsafe, no HTML normalization, no newline normalization, no\
        \ upstream runner/full API/fuzz/complexity/security certification. Repeated profiles overlap and are not\
        \ summed as distinct tests.')\n (R/'runtime'/(name+'.json')).write_text(json.dumps(dict(summary=summary,cases=results),ensure_ascii=False,indent=2)+'\\\
        n');print(json.dumps(summary,ensure_ascii=False),flush=True);return summary\nout=[]\nout.append(run_profile('fixed-source-per-example',source,lambda\
        \ x:[e for e in x['extensions'] if e!='disabled']))\nout.append(run_profile('official-all-five',official,lambda\
        \ x:all_ext))\nout.append(run_profile('official-section-selective',official,lambda x:extmap.get(p.map[x['example']],[])))\n\
        (R/'corpus-summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\\n')\n"
