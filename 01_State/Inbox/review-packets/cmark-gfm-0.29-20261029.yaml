      text: "from pathlib import Path\nimport json,subprocess,datetime,hashlib\nR=Path(__file__).resolve().parent;B=R/'runtime/build/cmark-gfm';args=['-e','table','-e','strikethrough','-e','autolink','-e','tagfilter','-e','tasklist'];cases=[('table','A\
