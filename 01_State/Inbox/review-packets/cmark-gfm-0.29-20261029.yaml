      attestation or a latest-version claim. Actual tree 19280c0fd1deb8fd05aaab1002058e845f1dfb60 has 178 entries:
      162 blobs, 16 trees and no gitlinks. All 162 codeload files match raw Git blob bytes without normalization.
      The pinned README says much of its remainder is inherited upstream text, so blanket performance, conformance
      and wrapper statements are not transferred. The edition bridge is explicit GFM provenance and the 0.29/2019-04-06
      corpus header, not the release spelling. Public HTML has 677 cases versus 672 source cases; exact-Markdown
      alignment finds 654 matching input/output pairs, nine same-input/different-output cases and 14 with no exact
      source input. The public page is a timestamped, hashed observation, not an immutable URL guarantee. Retained
      /spec.txt and /spec.json 404s, connector tags-collection 400 and local helper regex/count corrections are
      not product bug fixes. Only document_representation is proposed: checked tables, tasks, strikethrough, links,
      hierarchy/AST and HTML fragments substantiate structured-document representation. Appending to the existing
      CommonMark-family implementation file is ordinary physical storage only, preserving prior cmark bytes without
      changing specification identity or maintenance. CMake was unavailable; a custom GCC 14.2 static build follows
      fixed CMake lists: 27 core C files, seven extension C files and main.c, 35 total. Only config/version/static-export
      headers were generated; checked-in scanners were used without source edits, installation, generators, CMake
      or the upstream full runner. Separate author build/replay agreeing with research is author verification,
      not independent acceptance. Builds may embed absolute paths; local binary hashes bind those bytes, not binary
      reproducibility, official release artifacts, signatures, supply-chain assurance or cross-platform parity.
      The finite API helper is not full API/dynamic-ABI certification; generated HTML was not executed in a browser
