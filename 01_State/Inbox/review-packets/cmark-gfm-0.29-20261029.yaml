    - filename: runtime/api_probe.c
      sha256: c6624faa91b19725f1dd300cd9f984f02a8d9a7f2c328bb18248201ae47eacac
      text: "#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include \"cmark-gfm.h\"\n#include\
        \ \"cmark-gfm-extension_api.h\"\n#include \"cmark-gfm-core-extensions.h\"\nint main(int argc,char **argv)\
        \ {\n  char input[4096]; size_t n=fread(input,1,sizeof(input),stdin);\n  if(argc!=2 || n==sizeof(input)\
        \ || ferror(stdin)) return 2;\n  const char *mode=argv[1]; int unsafe=strstr(mode,\"unsafe\")!=NULL;\n\
        \  int options=unsafe?CMARK_OPT_UNSAFE:0;\n  if(strstr(mode,\"safe_bit\")) options|=CMARK_OPT_SAFE;\n\
        \  char *out=NULL;\n  if(strcmp(mode,\"convenience\")==0) out=cmark_markdown_to_html(input,n,options);\n\
        \  else {\n    cmark_gfm_core_extensions_ensure_registered();\n    cmark_parser *parser=cmark_parser_new(options);\n\
        \    if(strncmp(mode,\"attached\",8)==0) {\n      const char *exts[]={\"table\",\"strikethrough\",\"autolink\"\
        ,\"tagfilter\",\"tasklist\",NULL};\n      for(int i=0;exts[i];i++) {\n        cmark_syntax_extension *e=cmark_find_syntax_extension(exts[i]);\n\
        \        if(!e || !cmark_parser_attach_syntax_extension(parser,e)) return 3;\n      }\n    }\n    cmark_parser_feed(parser,input,n);\n\
        \    cmark_node *doc=cmark_parser_finish(parser);\n    cmark_llist *render_extensions=strstr(mode,\"no_render_extensions\"\
        )?NULL:cmark_parser_get_syntax_extensions(parser);\n    out=cmark_render_html(doc,options,render_extensions);\n\
        \    cmark_node_free(doc);cmark_parser_free(parser);\n  }\n  if(!out)return 4; fputs(out,stdout);free(out);return\
        \ 0;\n}\n"
