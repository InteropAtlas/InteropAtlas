  corrections_and_limits:
    research_preparation_notes_text: '# Preparation and access outcomes


      - Research only; no InteropAtlas content, ref, PR, issue, comment, review or deployment was changed. Prior
      YAML evidence/checkouts were read only.

      - The GitHub connector rejected the unsupported `/tags?per_page=15` collection URL with HTTP 400 / INVALID_ARGUMENT.
      The original response is retained in `connector/tags.json`; that URL was not retried. The chosen release''s
      specific tag was read with the supported Git data ref endpoint. This was not a direct GitHub API shell request
      or a permission bypass.

      - The first orchestration tried JSON.parse on that error response''s absent content and stopped. Successful
      repo/release response envelopes had already been retained. No mutation was involved.

      - A tree query using the commit SHA returned a misleading top-level sha equal to the supplied commit, so
      the actual tree SHA was read from the commit object and queried directly. `connector/actual-tree.json` binds
      real tree `19280c0fd1deb8fd05aaab1002058e845f1dfb60`; the earlier response remains as `connector/tree.json`.

      - Official `https://github.github.com/gfm/spec.txt` and `/spec.json` returned 404. Their response bytes
      and status metadata are retained. Neither URL was retried. The public HTML returned 200 and its code examples
      were parsed, preserving original bytes; two independently coded extractors agreed on all 677 records.

      - The initial local CMake source-list helper expected 26 core files and excluded hyphens, omitting `core-extensions.c`.
      Its own assertion stopped before invoking GCC. The initial script and generated-header-only directory are
      retained. Correcting the parser to allow hyphens derives 27 core + 7 extension C files, plus main.c (35
      files). No upstream source file was changed.

      - CMake is absent. The custom static build generated only config/version/static export headers, used GCC
      14.2 and the unchanged checked-in scanners, and did not run install, source generation, lifecycle scripts
      or the full upstream runner. No binary is characterized as official, reproducible across hosts, signed or
      attested.

      - Source corpus failures are not hidden: 672 records exist, two marked `disabled`; the source harness would
      skip those, while our diagnostic deliberately included them and observed two non-matches. Official corpus
      failures are retained separately. No HTML/newline normalization was used.

      - No local Chromium was attempted, no browser executed the output HTML, and the prior denied direct API
      operation was not retried or routed around. #276 publication denial and #498/#439/#416/identity holds remain
      untouched.

      - Fresh-directory reproduction initially specified a working directory before creating it; the process did
      not start. The corrected command created the new directory from an existing working directory before entering
      it.

      - The saved secondary extraction reconstruction initially counted trailing prose code blocks between examples
      as part of each example. Its assertion stopped before writing a report. The initial helper is retained;
      the corrected helper selects each example''s leading Markdown/HTML pair, agrees exactly with all 677 primary-extracted
      records and the already retained exact-input alignment report. This is a helper reconstruction correction,
      not a changed source/corpus/runtime result.

      - The fresh-reproduction comparison initially asserted binary hash equality and stopped before producing
      its report. Both rebuilt binaries have different hashes and visibly contain the different absolute build
      paths. The corrected report retains both hashes and asserts equality only of the full actual case records
      and extracted datasets, not binary reproducibility. Every finite, roundtrip and corpus case record reproduced
      exactly; no failure result was normalized away.

      '
