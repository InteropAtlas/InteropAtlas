        n'),('tagfilter_unsafe','<script>x</script>\\n')];out=[]\nfor name,source in cases:\n inp=source.encode();first=subprocess.run([str(B),'--unsafe',*args],input=inp,capture_output=True);mark=subprocess.run([str(B),'--unsafe',*args,'-t','commonmark'],input=inp,capture_output=True);second=subprocess.run([str(B),'--unsafe',*args],input=mark.stdout,capture_output=True)\n\
        \ out.append(dict(name=name,input_hex=inp.hex(),args=args,initial_html_hex=first.stdout.hex(),commonmark_hex=mark.stdout.hex(),reparsed_html_hex=second.stdout.hex(),returncodes=[first.returncode,mark.returncode,second.returncode],stderr_hex=[first.stderr.hex(),mark.stderr.hex(),second.stderr.hex()],lexical_bytes_equal=inp==mark.stdout,html_bytes_equal=first.stdout==second.stdout))\n\
        report=dict(at=datetime.datetime.now(datetime.timezone.utc).isoformat(),binary_sha256=hashlib.sha256(B.read_bytes()).hexdigest(),records=len(out),successful_processes=all(all(v==0\
