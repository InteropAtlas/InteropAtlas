      Markdown 对齐为 654 个输入/输出对相同、9 个同输入输出不同、14 个无相同源码输入。公开页面是带捕获时间与 SHA256 的观察，不保证 URL 内容永久不变；/spec.txt 与 /spec.json
      的 404、connector tags 集合 400 以及本地 helper 正则/计数修正均保留，不是产品缺陷修复。仅 document_representation：所查表格、任务项、删除线、自动链接、层次/AST
      和 HTML 片段支持结构化文档表示；不附加新的能力或其他实现边。关系追加到既有 CommonMark-family implementation 文件只是物理实例归档，保留既有 cmark 原字节，不改变规范身份或维护机制。CMake
      不可用，按固定 CMake 清单用 GCC 14.2 自定义静态构建 27 core C + 7 extension C + main.c，共 35 文件；仅生成 config/version/static-export
      头，使用已检入 scanner，没有改源、安装、生成器、CMake 或完整上游运行器。作者另行构建/重放与研究者结果相符是作者核验，不是独立接纳。不同目录构建可嵌入绝对路径；本地 binary hash 仅绑定本地字节，不证明二进制可复现、官方发行、签名、供应链或跨平台一致性。API
      helper 是有限直接调用，不是动态 ABI/完整 API 认证；未在浏览器执行产生的 HTML，未操作 GitHub 服务或远程端点。CommonMark/XML 等输出策略不能从默认 HTML 策略外推；所选
      CommonMark 往返不代表所有扩展、标记或输入无损。COPYING 中源码、组件、文档和测试通知范围不同，省略 license_expression/open_source，不形成统一许可法律或治理结论。
    scope_notes_en: 'The subject is only github/cmark-gfm release 0.29.0.gfm.13, published 2023-07-21, with the
