    - filename: crosscheck_alignment.py
      sha256: 20e66b3cee22ddf876bb28b9a5866c9f8725e5866747cd45f77722ee975b4e1f
      text: "\"\"\"Reconstruct the independently coded raw-code extraction and exact-input alignment.\"\"\"\n\
        from pathlib import Path\nimport collections, html, json, re\nR = Path(__file__).resolve().parent\nraw\
        \ = (R / 'official-gfm.html').read_bytes()\nassert b'\\r' not in raw\nsource = json.loads((R / 'source-spec-examples.json').read_text())\n\
        primary = json.loads((R / 'official-examples.json').read_text())\nsecondary = []\npieces = re.split(r'<div\
        \ class=\"example\" id=\"example-(\\d+)\">', raw.decode())\nfor i in range(1, len(pieces), 2):\n    fields\
        \ = re.findall(r'<code class=\"language-(markdown|html)\">(.*?)</code>', pieces[i + 1], re.S)\n    # The\
        \ split extends through following prose; only the example's leading pair belongs to it.\n    assert len(fields)\
        \ >= 2 and [x[0] for x in fields[:2]] == ['markdown', 'html']\n    fields = fields[:2]\n    row = {'example':\
        \ int(pieces[i])}\n    for key, body in fields:\n        row[key] = html.unescape(re.sub(r'</?span(?:\\\
        s+[^>]*)?>', '', body)).replace('→', '\\t')\n    secondary.append(row)\nassert secondary == primary\n\
        by_input = collections.defaultdict(list)\nfor item in source:\n    by_input[item['markdown']].append(item)\n\
        counts = collections.Counter()\ndiffs = []\nfor item in secondary:\n    matches = by_input[item['markdown']]\n\
        \    if any(x['html'] == item['html'] for x in matches):\n        counts['exact_input_output_pair'] +=\
        \ 1\n    else:\n        kind = 'same_input_different_output' if matches else 'no_exact_source_input'\n\
        \        counts[kind] += 1\n        diff = {'official_example': item['example']}\n        if matches:\n\
        \            diff['source_examples'] = [x['example'] for x in matches]\n        diff['kind'] = kind\n\
        \        diffs.append(diff)\nout = dict(secondary_raw_html_extractor_equals_primary=True, official_examples=len(primary),\n\
        \           comparison_by_exact_markdown=dict(counts), nonmatching_pairs=diffs,\n           boundary='Corpus\
        \ alignment, NOT runtime results; later ordinal shifts not counted as independent semantic mismatches.\
        \ No HTML output normalization.')\nprior = R / 'corpus-alignment-crosscheck.json'\nif prior.exists():\n\
        \    assert out == json.loads(prior.read_text()), 'existing crosscheck mismatch; do not overwrite'\nelse:\n\
        \    prior.write_text(json.dumps(out, indent=2) + '\\n')\nprint(json.dumps({k: v for k, v in out.items()\
        \ if k != 'nonmatching_pairs'}, indent=2))\n"
