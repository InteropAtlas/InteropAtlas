    official_url: https://github.com/unicode-rs/unicode-normalization
    description_zh: '主体是 unicode-rs/unicode-normalization 整体 Rust 库，不是内部 NFD/NFC 模块、utf8proc 或 Unicode 标准。本记录固定真实
      crates.io 发行 0.1.25（2025-10-30），docs.rs 发布元数据 .cargo_vcs_info 与官方 PR115 绑定 commit 5a69b3bafb625caccdec7871a42bed0d9a6604d1；该版没有
      v0.1.25 Git tag 或 GitHub Release，不虚构 tag 链接，也不声称最新版。Cargo 版本为 0.1.25，表与生成器声明 Unicode 17.0.0；未重跑生成器或逐项校对整个
      UCD。19 份固定完整仓库文件的字节、Git blob 与 SHA256 已核，但不是完整 checkout、下载的 .crate 归档、签名或供应链认证；registry checksum 仅为元数据，未验证发布包字节。Cargo
      的 MIT OR Apache-2.0 仅记该版上游声明，不扩大为全部生成数据的法律判断，不套用 0.1.26 许可或 Unicode18 表。


      此条 implements 仅静态描述有效 Rust &str 经 UnicodeNormalization.nfd()/nfc() 的 char 迭代路径，对应 Unicode17 第3章 §§3.11/3.12
      与 UAX15 revision57：规范分解使用预展开的 canonical_fully_decomposed 表，ASCII 和无映射标量直通，Hangul 使用算法；随后按规范组合类（CCC）稳定排序非starter片段，同类保持输入次序，CCC=0
      为starter边界，不能以 General_Category=Mark 替代。NFC 先规范分解再按组合表和阻塞规则重组，待组合 starter 与当前字符之间已有的未组合字符 CCC 大于等于当前 CCC 会阻塞，不是任意邻接可组合字符都合并；生成器依
      Full_Composition_Exclusion 排除项建立组合表，但未逐项验证表值。Hangul 实际音节范围 U+AC00..U+D7A3，小于 D7A4，不采用源码注释的 D7AF；L+V 与 LV+T
      组合不把 U+11A7 作为有效尾辅音。源码存在局部 unsafe，不是全 safe Rust 或安全认证。


      输入前提是有效 Rust str/char，不接收任意非法 UTF-8 或 surrogate，不是畸形字节修复器。输出是 Unicode 标量，不是字节、字素簇、原位置索引或已分配字符验证。规范化可能改变标量数量、次序及
      UTF-8 字节，不承诺原字节、语言语义或字体显示保真。一次完整输入使用同一迭代器；分别规范化各 chunk 再拼接不保证等价，也无跨独立 chunk 状态传承保证。迭代器为惰性，next 可消费多个输入；待处理非starter片段可能缓存至下一starter或EOF，NFC还存待组合字符与未组合项，TinyVec
      inline容量4不是总内存限额；不证明固定资源、零分配、恒定延迟或恶意输入安全。


      有限证据仅为固定上游源码断言配方：U+1E0B U+0323 的 NFD 预期 U+0064 U+0323 U+0307，NFC 预期 U+1E0D U+0307；U+D4DB 的 NFD 预期 U+1111 U+1171
      U+11B6，NFC保留该音节；U+2026 在 NFD/NFC 保留，NFKD/NFKC 三句点例只用于区分形式。NFKD/NFKC、quick check、CJK variants及其他API不纳入正面范围；quick
      check 不转换文本且可返回 Maybe。stream_safe() 是单独选择的处理，plain nfd()/nfc() 不自动插入 U+034F 或限制为30个非starter。本次未安装、导入、构建、运行上游、依赖、样例、测试或生成器，未下载大
      testdata；Cargo 排除 tests/* 下的 suite 配方；本次只读固定仓库源码，未核发布包所含测试，也未通过官方 NormalizationTest/UCD 全覆盖。src/lib.rs 的0.1.20依赖示例不作为本版身份。此边不是完整
      Unicode 符合性、编码转码、大小写折叠、字素分割、排序、IDNA/PRECIS、同形字符安全、跨实现互通、生产适用或 IA 采用保证；不核实的其他能力不表示不存在。


      English scope and limitations:


      This record pins the real crates.io release 0.1.25 (2025-10-30). The published .cargo_vcs_info on docs.rs
      and official PR115 bind commit 5a69b3bafb625caccdec7871a42bed0d9a6604d1. No v0.1.25 Git tag or GitHub Release
      exists; no tag URL or latest-version claim is invented. Cargo says 0.1.25, while tables and generator declare
      Unicode 17.0.0; the generator was not rerun and the entire UCD was not checked entry by entry. Bytes, Git
      blobs and SHA256 of 19 complete fixed repository files were checked, not a full checkout, downloaded .crate
      archive, signature or supply-chain certification. Registry checksum is metadata only, not verification of
      package bytes. Cargo MIT OR Apache-2.0 is recorded solely as this version''s upstream declaration, not a legal
      finding covering all generated data; neither the 0.1.26 license nor Unicode18 tables is substituted.


      This implements edge describes only a static char-iterator slice of UnicodeNormalization.nfd()/nfc() on valid
      Rust &str, corresponding to Unicode17 chapter 3 sections 3.11/3.12 and UAX15 revision57. Canonical decomposition
      uses pre-expanded canonical_fully_decomposed tables, passes ASCII and unmapped scalars through, and handles
      Hangul algorithmically. Nonstarter segments are stably ordered by canonical combining class (CCC), preserving
      equal-class order, with CCC=0 starter boundaries; General_Category=Mark is not a substitute. NFC decomposes
      canonically before table-based and algorithmic recomposition with blocking: an intervening uncomposed character
      after the composee whose CCC is greater than or equal to the current CCC blocks composition, rather than merging
      every composable adjacent pair. The generator excludes Full_Composition_Exclusion entries when constructing
      the composition table; individual table values were not exhaustively validated. Actual Hangul syllables are
      U+AC00..U+D7A3, below D7A4, not the D7AF source comment. L+V and LV+T composition excludes U+11A7 as a valid
      trailing consonant. Local unsafe blocks exist, so this is not entirely safe Rust or security certification.


      Inputs must already be valid Rust str/char, not arbitrary invalid UTF-8 or surrogates; this is not malformed-byte
      repair. Outputs are Unicode scalars, not bytes, grapheme clusters, original-position indices or assigned-character
      validation. Normalization may change scalar count/order and UTF-8 bytes without guaranteeing original-byte,
      language-semantic or font-rendering fidelity. One complete input is processed through one iterator: independently
      normalizing chunks then concatenating is not guaranteed equivalent, and no state continuity across independent
      chunks is promised. Iterators are lazy, but next may consume multiple inputs. Pending nonstarter segments
      may buffer until the next starter or EOF; NFC also retains a composee and uncombined characters. TinyVec inline
      capacity 4 is not a total memory bound. Fixed resources, zero allocation, constant latency and hostile-input
      safety are unproven.


      Finite evidence consists only of fixed upstream source assertion recipes: U+1E0B U+0323 expects NFD U+0064
      U+0323 U+0307 and NFC U+1E0D U+0307; U+D4DB expects NFD U+1111 U+1171 U+11B6 and unchanged NFC; U+2026 remains
      unchanged under NFD/NFC, with the NFKD/NFKC three-period recipe used only to distinguish forms. NFKD/NFKC,
      quick check, CJK variants and other APIs are outside the positive slice. Quick check does not transform text
      and may return Maybe. stream_safe() is separate opt-in processing: plain nfd()/nfc() does not automatically
      insert U+034F or impose a 30-nonstarter limit. No upstream/dependency installation, import, build, execution,
      examples, tests or generator run occurred, and large testdata was not downloaded. Cargo excludes suite recipes
      under tests/*; only fixed repository source was inspected, with no package-test-content verification or passed
      official NormalizationTest/UCD coverage run. The src/lib.rs 0.1.20 dependency example is not this release''s
      identity. This edge does not guarantee full Unicode conformance, transcoding, case folding, grapheme segmentation,
      collation, IDNA/PRECIS, confusable security, cross-implementation interoperability, production suitability
      or IA adoption. Unexamined capabilities are not asserted absent.'
