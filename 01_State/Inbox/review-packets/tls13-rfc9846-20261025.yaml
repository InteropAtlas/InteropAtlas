    official_name: The Transport Layer Security (TLS) Protocol Version 1.3
    description_zh: 2026年7月发布的 IETF 流 TLS 1.3 修订规范文档，规定握手与记录协议；在 RFC 文献层面取代 RFC 8446，同时保留 TLS 1.3 协议版本号。不是 TLS 1.4，也不表示任何实现或部署已符合修订要求或安全。
    description_en: The July 2026 IETF-stream revised TLS 1.3 specification document, defining handshake and record
      protocols. It obsoletes RFC 8446 at the RFC-document level while retaining the TLS 1.3 version number. It
      is not TLS 1.4 or evidence that implementations or deployments satisfy revised requirements or are secure.
    version: RFC 9846
    external_identifiers:
    - namespace: rfc
      value: '9846'
    official_url: https://www.rfc-editor.org/info/rfc9846/
    versions:
    - version: RFC 9846
      status: proposed_standard
      url: https://www.rfc-editor.org/info/rfc9846/
    scope_notes_zh: 身份为固定 RFC9846 文献，而非 TLS 协议家族、软件或部署。Proposed Standard 是标准成熟等级，不是完成互通认证或部署安全结论；发布月为2026年7月，不由页面更新时间推造具体发布日期。第1.2节保留
      TLS1.3 版本号并说明收紧与澄清部分要求；这里仅接纳文献及对 RFC8446 的正式取代关系，不作穷尽变更、勘误或任意实现兼容性结论。既有 RFC8446 身份、历史引用和 QUIC RFC9001→RFC8446
      的 uses 边保持不变；不自动迁移为使用 RFC9846。未运行实现、审计配置、给出密码建议或证明 IA 采用。
    scope_notes_en: Identity is the fixed RFC9846 document, not a TLS family, software product or deployment. Proposed
      Standard is maturity, not interoperability certification or deployment-security evidence; publication is July2026,
      with no exact day inferred from page updates. Section1.2 retains the TLS1.3 version number and tightens or
      clarifies some requirements. This intake covers the document and formal succession to RFC8446 only, not an
      exhaustive change/errata audit or arbitrary implementation compatibility. RFC8446 identity, historical references
      and QUIC RFC9001 uses RFC8446 remain unchanged and do not automatically migrate to RFC9846. No implementation
      execution, configuration audit, cryptographic advice or IA adoption is established.
    sources:
    - &id001
      url: https://www.rfc-editor.org/info/rfc9846/
      title: RFC 9846 — title, Proposed Standard, July 2026, IETF stream, DOI and Obsoletes metadata
      language: en
