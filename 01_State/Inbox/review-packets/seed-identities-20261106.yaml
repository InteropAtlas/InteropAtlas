    description_en: An edition-level record for the ninth edition of the BIPM SI Brochure, which explains the definition
      and use of the International System of Units. The edition began in 2019 and includes subsequent revisions
      and official French and English texts within that edition, without treating those texts as one byte-identical
      file.
    external_identifiers:
    - namespace: bipm
      value: si-brochure-9
    official_url: https://www.bipm.org/en/si-brochure-9
    scope_notes_zh: 原有 bipm:si-brochure-9 保留为与 BIPM 官方第九版条目 slug 对应的 IA locator-derived 版次级标记，不声称它是 BIPM 正式分配的出版物编号。主体是第九版，不是
      SI 这一单位体系本身、BIPM 组织、单一 2019 年初始文本或固定语言的最新版文件。官方第九版条目列出 1.01–1.08、2.01、3.01、3.02 与 4.01；本次查阅的英文文本为 V4.01（June
      2026），作为所核证据而非全记录统一 revision。官方 DOI 10.59161/AUEZ1291 用于第九版条目及当前法／英／合订文本，不能独自区分 revision、language 或文件字节；PDF
      URL 的资产 version=7.0 也不是正文 V4.01。英文 PDF 第 120 页说明需要权威引用或解释有疑义时应使用法文。正文含附录 1 和 4，在线附录 2、3 单独提供，不能把仅核主 PDF 说成核验所有在线附录。本次核对目录、封面、版权页、目录、修订前言与语言说明，非逐条审查全部计量内容或历次文本，不声明某个实现、测量结果或法定合规。
    scope_notes_en: The unchanged bipm:si-brochure-9 value is an IA locator-derived edition-level marker corresponding
