    description_en: A family-level record for the OPC Foundation OPC Unified Architecture multi-part specification
      series (OPC 10000), organizing architectural material including information models, services, mappings and
      profiles. Individual parts and releases retain distinct identities; this is not one document with one uniform
      version.
