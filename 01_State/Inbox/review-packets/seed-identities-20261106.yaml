scope_zh:
- 优先核定原五种子主体，保留原 ID、外部标记字节与主类别；不将工作/家族指派给单版或单一部分，不制定 namespace 或版本政策。
- 两个独立软件发行体及原有 ST 2065-1 标准候选按明确独立主体另行接纳，不消费、重指或拆分 OpenEXR/ACES/OTIO 原混合种子。
- 只新增所列对象和三个现有编辑导航成员；零技术关系，不改变既有 IS05/IS04 提案、类别定义、治理、runtime、页面、维护方式或历史覆盖快照。
- 候选 proposal 状态不是接受；只有真实冻结后的适用检查、独立语义审核及接纳事件通过，才物化 Canonical。
