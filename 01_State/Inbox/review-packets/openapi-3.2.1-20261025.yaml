      url: https://spec.openapis.org/oas/v3.2.1.html
    scope_notes_zh: 主体是固定 OpenAPI Specification 3.2.1 文献，而非 OpenAPI 家族、组织、资讯性 JSON Schema 制品或某个 API 实现。版本化官方 HTML
      为该文献指定的权威文本；原始捕获哈希限定此次证据，不宣称 URL 永久不可变或当前最新版。发布日期来自标题和 Appendix A，不使用 HTTP Last-Modified 2026-10-22。符合规范的
      OpenAPI 文档是可用 JSON 或 YAML 表示的 JSON 对象；这不要求被描述 API 的请求/响应内容也使用这两种格式。openapi 字段标识规范版本，与 info.version 描述的文档版本及被描述
      API 的版本不同。资讯性 JSON Schema 若与规范正文有差异，以正文为准；本记录不证明模式验证器覆盖所有规范要求。major/minor 特征集与 patch 文本修订的区分不构成任意实现或跨版本兼容性保证，索引的
      previous revisions obsolete 仅针对日期化 schema 迭代，不用于判定规范文献取代。本批零技术关系：不将既有 3.1.1 的三条 uses 边复制或重定向，不从版次顺序推断 supersedes/extends/compatible_with，旧文献、来源与历史保持原样。仅核实文献身份和上述描述范围，未穷尽审计功能、勘误或安全要求，未执行页面脚本、上游工具、API
      或验证器；不证明实现符合性、认证、安全性、部署、运行时互通或 IA 采用。
    scope_notes_en: 'The subject is the fixed OpenAPI Specification 3.2.1 document, not the OpenAPI family, organization,
      informational JSON Schema artifact or an API implementation. The designated versioned HTML is authoritative
      for this document; captured hashes bound this review, not permanent byte immutability or latest-version status.
      The header and Appendix A supply the publication date, not HTTP Last-Modified 2026-10-22. A conforming OpenAPI
      document is a JSON object representable as JSON or YAML; described API request/response content need not use
      either format. The openapi field identifies the specification version, distinct from the document version
      in info.version and the described API version. Specification text prevails over a differing informational
      JSON Schema; validator coverage of all requirements is not established. Major/minor feature sets and patch
      text revisions do not guarantee arbitrary implementation or cross-version compatibility. The index calls previous
      date-stamped schema iterations obsolete, not specification editions. This slice adds zero technical relations:
      no copying or retargeting the three existing 3.1.1 uses edges, and no supersedes/extends/compatible_with inference
      from version order. Existing documents, sources and history remain unchanged. Only document identity and this
      description scope are reviewed, not exhaustive features, errata or security requirements. No page scripts,
      upstream tools, APIs or validators were executed; implementation conformance, certification, security, deployment,
      runtime interoperability and IA adoption are not established.'
