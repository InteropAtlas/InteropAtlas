static_boundary_observations:
- receive_data returns None; next_event mutates and emits one event or NEED_DATA/PAUSED.
- Incoming ordinary GET/POST and matching200 only, correct request method state required; supported chunked precedes
  valid CL; no headers request zero, response EOF.
- Strict >16384 check only on NEED_DATA after extraction; complete events and PAUSED bypass that check; not a total/body/header
  hard cap.
- Premature EOF during CL/chunked/incomplete headers is an error; EOF-framed response EOF ends body, not a socket
  operation.
- Parser errors set ERROR, no rollback/recovery; early start_next_cycle rejection is distinct, both DONE required.
excluded_scope:
- No HEAD/CONNECT/Upgrade/informational/other status acceptance, no HTTP1.0 conformance or sender-path evidence.
- No I/O or network execution, complete client/server, security/performance/interoperability/full RFC/IA-adoption
  claim.
- All previous holds/refusals/unknown writes preserved. No formal APPROVE/resolve/dismiss. Unsupported h11 tags
  collection is not retried.
