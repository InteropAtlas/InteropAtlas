      conditions_zh: 仅固定库中RFC5646导向的标签解析、Language对象表示和字符串输出先例，不是全部BCP47或严格语法/完整validity/规范化符合性声明。下划线兼容输入和5–8字母主语言拒绝意味着接受集不等同RFC
        ABNF；normalize=False也不保证逐字往返。默认及standardize_tag归一化含CLDR扩展替换；标准化成功或tag_is_valid=True都不证明原始输入符合RFC。extlang登记/前缀、扩展语义与当前完整注册表未验证；私用标签含义依赖使用方约定。CLDR40文档及随包2021-08-06注册表时点限制保留。本地例在无language_data的环境只用合成标签；不推断安装可选数据后的行为、自动语言检测、语言匹配、生产适用性、安全认证、第三方互通或IA采用。
      conditions_en: Only the fixed library’s RFC5646-oriented parsing, Language-object representation and tag-string
        output precedent, not conformance to all BCP47 or a strict grammar/full-validity/canonicalization implementation.
        Underscore-compatible input and rejection of five-to-eight-letter primary languages mean its accepted set
        is not the RFC ABNF; normalize=False is not lexical-round-trip preservation. Default/standardize_tag normalization
        includes CLDR-specific replacements; success or tag_is_valid=True does not establish RFC conformance of
        the original input. Extlang registration/prefixes, extension semantics and the current complete registry
        are not verified; private-use meaning requires agreement among users. The documented CLDR40 and bundled 2021-08-06
        registry limits remain. Local examples use synthetic tags without language_data; optional-data behavior,
        automatic language detection, language matching, production suitability, security certification, third-party
        interoperability and IA adoption are not established.
