    name_zh: Langcodes Python语言标签库
    name_en: Langcodes Python language-tag library
    description_zh: 处理IETF语言标签的开源Python库；固定3.5.1，记录标签对象表示、归一化和局部validity先例及非严格输入语法、旧数据与可选依赖限制。
    description_en: An open-source Python library for IETF language tags, pinned to 3.5.1; records tag-object representation,
      normalization and local-validity precedents with non-strict input grammar, dated-data and optional-dependency
      limits.
    version: 3.5.1
    external_identifiers:
    - namespace: github
      value: georgkrause/langcodes
    - namespace: pypi
      value: langcodes
    official_url: https://github.com/georgkrause/langcodes
    versions:
    - version: 3.5.1
      status: released
      url: https://pypi.org/project/langcodes/3.5.1/
    domains:
