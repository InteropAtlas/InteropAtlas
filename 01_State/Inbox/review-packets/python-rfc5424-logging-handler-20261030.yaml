    description_zh: 'Python logging 的 Syslog handler 库，固定 1.4.3（commit 8426fd9d143accbfccd1db43553729a53b3f08e9）。本记录以单向消息格式化为研究范围，并不将整个库重命名为仅格式化组件。Rfc5424SysLogHandler.build_msg(LogRecord)
      由级别和 facility 构造 PRI，写入版本 1、来自 record.created 的时间戳、头部、结构化数据及可选 MSG，返回 bytes；emit 另行交给 transport.transmit。时间戳默认使用本地时区，utc_timestamp=True
      转 UTC；非空 MSG 默认 UTF-8 加 BOM，msg_as_utf8=False 不加 BOM，None/空消息省略 MSG。结构化数据值转义反斜杠、双引号和右方括号，头部过滤为可打印 ASCII 并截长。但过滤可令头部或
      SD 参数名变为空；registered SD-ID 缺少 enterprise_id 时可到达 len(None)。这些是源码静态观察，非已复现实测；不是严格验证器或完整 RFC5424 实现证明。构造器会初始化传输，默认
      UDP localhost:514；TLS 选择还需 SOCK_STREAM，流默认非透明分帧，不能由此推出 RFC5425 符合性、安全或送达保证。setup.py 的 tzlocal/pytz 依赖未设版本界限，分类列出历史
      Python 2.7/3.4–3.7，不证明当前兼容性或维护状态。仅检查固定 1.4.3 源码；未安装、构建、运行库或测试、发送日志或执行互通测试。当前 Python / 依赖兼容性、维护和安全状态未建立。 不主张解析、全部输入有效、安全审计、性能或部署推荐、第三方互通或
      IA 采用；BSD-3-Clause 仅按固定 LICENSE 记录，不作法律适用性判断。只添加既有 observability 编辑导航，不添加 implements 关系，避免裸关系把有界格式化解释为完整协议实现。


      English scope and limitations:


      Python logging Syslog handler library, pinned to 1.4.3 at commit 8426fd9d143accbfccd1db43553729a53b3f08e9.
      This record researches one-way message formatting; it does not rename the whole library into a formatting-only
      component. Rfc5424SysLogHandler.build_msg(LogRecord) constructs PRI from level/facility, version 1, a timestamp
      from record.created, header, structured data and optional MSG, returning bytes; emit separately calls transport.transmit.
      Timestamps use the local timezone by default or UTC with utc_timestamp=True. Nonempty MSG is UTF-8 with BOM
      by default; msg_as_utf8=False omits BOM; None/empty message omits MSG. Structured-data values escape backslash,
      quote and closing bracket; headers are filtered to printable ASCII and truncated. Filtering can leave empty
      headers or SD parameter names; a registered SD-ID without enterprise_id can reach len(None). These are static
      source observations, not reproduced tests: neither strict validation nor complete RFC5424 conformance is established.
      Construction initializes transport, defaulting to UDP localhost:514; TLS selection also requires SOCK_STREAM
      and default stream framing is nontransparent. These defaults do not establish RFC5425 conformance, security
      or delivery guarantees. setup.py leaves tzlocal/pytz unbounded and lists historical Python 2.7/3.4–3.7 classifiers,
      not contemporary compatibility or maintenance evidence. No upstream installation, build, runtime/test execution,
      log sending or corpus/interoperability testing was performed. No parsing, all-input validity, security audit,
      performance/deployment recommendation or IA adoption claim. BSD-3-Clause is recorded from the fixed LICENSE,
      not legal-suitability advice. Existing observability membership is editorial navigation only; no implements
      relation is added, avoiding a bare edge that overstates bounded formatting as complete protocol implementation.'
