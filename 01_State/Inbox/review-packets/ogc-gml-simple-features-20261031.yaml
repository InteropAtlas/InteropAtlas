    name_en: GML Simple Features Profile (OGC 10-100r3 corrigendum)
    official_name: Geography Markup Language (GML) simple features profile (with Corrigendum)
    description_zh: '固定 OGC 10-100r3《Geography Markup Language (GML) simple features profile (with Corrigendum)》（2012-04-05
      勘误出版物），限定 GML 3.2 与 XML Schema 的要素编码规则，含 SF0、SF1、SF2 三个符合级别。封面 Version 2.0 与外部标识 http://www.opengis.net/spec/gmlsf/2.0.1
      同时保留，不将二者默默统一，也不代表整个 GML 或单独的编码类对象。该 Profile 不解决未知应用模式的领域语义；SF2 对非空间属性的放宽不等于任意几何或实现支持。固定 OGC API Features
      Core 17-069r4 / 1.0.1 第 8.4 节的可选 GML-SF0 类及第 8.5 节的可选 GML-SF2 类在文献中引用本 Profile；第 8.1 节明确这些编码类不是 Core 强制，可采用其他编码。Core
      对这两个类另加的二维线性几何限制不是整个 Profile 的范围。此为规范文献依赖，不证明任何实现采用、符合性或互通。仅按该勘误出版物记录；文档保留 technical-note 修订标记，未逐条审计符合性或核验所有后续勘误，不声称最新版本。


      English scope and limitations:


      Fixed OGC 10-100r3, Geography Markup Language (GML) simple features profile (with Corrigendum), published
      2012-04-05. It constrains feature encoding using GML 3.2 and XML Schema and includes compliance levels SF0,
      SF1 and SF2. Cover Version 2.0 and external identifier http://www.opengis.net/spec/gmlsf/2.0.1 are both preserved,
      not silently unified. This is neither all GML nor an invented individual encoding-class object. It does not
      resolve domain semantics of unknown application schemas; SF2 relaxation of non-spatial properties does not
      imply arbitrary geometry or implementation support. Fixed OGC API Features Core 17-069r4 / 1.0.1 cites this
      Profile for its optional section 8.4 GML-SF0 and section 8.5 GML-SF2 classes; section 8.1 makes these encoding
      classes non-mandatory for Core and allows other encodings. Core adds two-dimensional linear-geometry constraints
      for those classes; these are not the scope of the entire Profile. This is documentary specification use, not
      evidence of implementation adoption, conformance or interoperability. Limited to this corrigendum publication,
      which retains technical-note revision marks; no clause-by-clause conformance audit or review of all later
      corrigenda, and no latest-version claim.'
    description_en: Fixed OGC 10-100r3, Geography Markup Language (GML) simple features profile (with Corrigendum),
      published 2012-04-05. It constrains feature encoding using GML 3.2 and XML Schema and includes compliance
      levels SF0, SF1 and SF2. Cover Version 2.0 and external identifier http://www.opengis.net/spec/gmlsf/2.0.1
      are both preserved, not silently unified. This is neither all GML nor an invented individual encoding-class
