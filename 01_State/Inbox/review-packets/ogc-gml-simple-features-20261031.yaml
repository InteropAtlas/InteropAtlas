      makes these encoding classes non-mandatory for Core and allows other encodings. Core adds two-dimensional
      linear-geometry constraints for those classes; these are not the scope of the entire Profile. This is documentary
      specification use, not evidence of implementation adoption, conformance or interoperability. Limited to this
      corrigendum publication, which retains technical-note revision marks; no clause-by-clause conformance audit
      or review of all later corrigenda, and no latest-version claim.
