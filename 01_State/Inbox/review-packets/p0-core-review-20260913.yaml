    type: standard
    kind: protocol
    status: superseded
    name_zh: TLS 1.3 原始规范（RFC 8446，已被取代）
    name_en: TLS 1.3 Original Specification (RFC 8446, obsoleted)
    description_zh: TLS 1.3 的原始规范，定义握手与记录协议。保留为历史引用目标；RFC Editor 和 IETF Datatracker 均记录它已被 RFC 9846 取代。
    description_en: The original TLS 1.3 specification for handshake and record protocol, retained as a historical reference. RFC Editor and IETF Datatracker record it as obsoleted by RFC 9846.
    organization: ietf
    domains: [security, networking]
    layers: [network_transport]
    capabilities: []
    external_identifiers: [{namespace: rfc, value: '8446'}]
    official_url: https://www.rfc-editor.org/rfc/rfc8446.html
