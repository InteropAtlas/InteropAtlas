  proposed_record:
    id: smpte_umid
    type: artifact
    kind: standard
    name_zh: SMPTE ST 330 唯一素材标识符（UMID）
    name_en: SMPTE ST 330 — Unique Material Identifier (UMID)
    description_zh: 规定视听素材实例 UMID 标识结构的标准；本次固定 ST 330:2011，区分 Basic 与 Extended 形式，不把素材标识等同于作品、权利或可信来源证明。
    description_en: A standard defining UMID structures for audiovisual-material instances; reviewed at ST 330:2011,
      distinguishing Basic and Extended forms without treating material identity as proof of works, rights or trustworthy
      provenance.
    version: '2011'
    external_identifiers:
    - namespace: smpte
      value: st.330
    official_url: https://pub.smpte.org/doc/st330/20110823-pub/st0330-2011.pdf
    versions:
    - version: '2011'
      status: standard
      url: https://pub.smpte.org/doc/st330/20110823-pub/st0330-2011.pdf
    scope_notes_zh: 保留既有 smpte_umid / smpte:st.330 工作级标准身份，审阅上下文固定为 2011-08-23 批准的 SMPTE ST 330:2011；不新建 2011 版次主体。官方
      2022 版封面明确其修订 2011 版，因此本记录不声称 2011 最新、所有版次等同或 2022 已完整审阅。§1 将 UMID 用于视听素材实例的标识及关联元数据，不用于识别作品、节目内容、版权或权利所有权。§5
      与 §6.1.1 定义 32 字节 Basic UMID：按顺序包含 12 字节通用标签、1 字节长度、3 字节实例号和 16 字节素材号；64 字节 Extended UMID 在 Basic 后附加 32 字节
      source pack，二者不能互换。此处只记录标准身份、标识目的和基本结构，不详尽复核所有生成方法或 source pack 字段语义。标准的全局唯一性目标及所定义的生成方法不等于任意实现实际无碰撞，更不是实体认证、版权/权利管理、可信来源、完整素材历史或安全保证。未执行
      UMID 生成器、文件解析器、媒体应用、符合性或互通测试。与 MXF 的具体用途由另一个有版次上下文的关系单独限定：ST 377-1:2019 Package ID 仅允许 32 字节 Basic UMID，并保留终止
      source-reference chain 的全零特殊值；不将该值当作普通生成的唯一素材标识。该关系不扩大为任意 MXF/Extended UMID 用途或软件符合性。本次不从 ST 330:2011 对 ST
      336:2007 的引用推断对既有 ST 336:2017 对象的依赖；不增加 UUID、时间码、国家码或地理编码等其他关系。不声称完整符合性、第三方互通、认证、部署、推荐、实现采用或 IA 采用。
    scope_notes_en: Preserves the existing work-level standard identity smpte_umid / smpte:st.330, reviewed specifically
      at SMPTE ST 330:2011 approved 2011-08-23, without creating a separate 2011-edition subject. The official 2022
      cover expressly identifies a revision of the 2011 edition; this record does not call 2011 latest, equate editions
      or claim a full 2022 review. Section 1 concerns identifying instances of audiovisual material and associating
      metadata, not identifying works, program content, copyright or ownership of rights. Sections 5 and 6.1.1 define
      a 32-byte Basic UMID containing, in order, a 12-byte universal label, one-byte length, three-byte instance
      number and 16-byte material number. A 64-byte Extended UMID appends a 32-byte source pack to the Basic form;
      the forms are not interchangeable. This is a bounded account of standard identity, identification purpose
      and basic structure, not an exhaustive review of every generation method or source-pack field. The standard's
      global-uniqueness objective and specified generation methods do not prove collision-free behavior in arbitrary
      implementations, entity authentication, copyright/rights management, trustworthy provenance, complete material
      history or security. No UMID generator, file parser, media application, conformance or interoperability test
      was executed. The separately qualified MXF relation records the ST 377-1:2019 Package ID use of 32-byte Basic
      UMID and the all-zero source-reference-chain termination sentinel; that sentinel is not an ordinary generated
      unique material identifier. It does not expand to arbitrary MXF/Extended UMID uses or actual software compliance.
      The ST 330:2011 reference to ST 336:2007 is not turned into a dependency on the accepted ST 336:2017 object.
      UUID, timecode, country-code and geospatial references are outside this slice. No full conformance, third-party
      interoperability, certification, deployment, recommendation, implementation adoption or IA adoption is established.
    sources:
    - url: https://pub.smpte.org/doc/st330/20110823-pub/st0330-2011.pdf#page=1
      title: ST 330:2011 cover — standard identity, edition and approval date
      language: en
      accessed: '2026-10-24'
    - url: https://pub.smpte.org/doc/st330/20110823-pub/st0330-2011.pdf#page=3
      title: ST 330:2011 §1 — audiovisual-material instances and explicit works/rights exclusions
      language: en
      accessed: '2026-10-24'
    - url: https://pub.smpte.org/doc/st330/20110823-pub/st0330-2011.pdf#page=5
      title: ST 330:2011 §5 and Figure 1 — Basic and Extended structures
      language: en
      accessed: '2026-10-24'
    - url: https://pub.smpte.org/doc/st330/20110823-pub/st0330-2011.pdf#page=6
      title: ST 330:2011 §6.1.1 — ordered 32-byte Basic UMID structure
      language: en
      accessed: '2026-10-24'
    - url: https://pub.smpte.org/pub/st330/st330-2022.pdf#page=1
      title: ST 330:2022 cover — later revision exists; not the reviewed endpoint edition
      language: en
      accessed: '2026-10-24'
    - url: https://smpte-ra.org/umid-information
      title: SMPTE Registration Authority UMID information — supplemental standard identity
      language: en
      accessed: '2026-10-24'
    last_verified_at: '2026-10-24T21:38:00.917872+00:00'
    last_verified_by: Agent — OpenAI / dot, bounded ST 330:2011 public-source evidence executor
relations:
- proposal_id: smpte_mxf_uses_smpte_umid
  proposed_path: 01_State/02_Relations/mxf-package-identification.yaml
  proposed_record:
    id: smpte_mxf_uses_smpte_umid
    type: relation
    name_zh: MXF 包标识使用 Basic UMID，并保留引用链终止例外
    name_en: MXF package identifiers use Basic UMID with a reference-chain termination exception
    source: smpte_mxf
    relation: uses
    target: smpte_umid
    context:
      version_context:
        source: SMPTE ST 377-1:2019, approved 2019-11-28; existing work-level smpte:st.377-1 identity
        target: SMPTE ST 330:2011, approved 2011-08-23; exact dated normative reference within existing work-level
          smpte:st.330 identity, not 2022
      conditions_zh: 固定源端 ST 377-1:2019、目标端 ST 330:2011，均保持既有工作级身份；MXF §3 第 8 页明确该日期版本，而不是以 2022 修订代替。§4.2 第 18
        页要求 UMID 用作 Package ID 时仅使用 32 字节 Basic UMID。规范性 Annex B.1 第 118 页将 Generic Package 定义为抽象类，其 Package UID
        是必需的 32 字节 PackageID，表示不可变的包标识 UMID。Annex B.10 第 123 页在 Source Clip 存在时要求其 32 字节 SourcePackageID（PackageRef）标识所引用包；终止
        source-reference chain 时明确使用 32 个零字节。这是上下文中的终止哨兵，不是普通生成的唯一 UMID，也不表示每个 MXF 文件必有 Source Clip。64 字节 Extended
        UMID 不允许用于这里的 Package ID；第 18 页关于其他 MXF 规范可能使用 Extended 的注释不放宽此规则。原始官方 MXF 第 8 页 Scope 的 StrikeOut 批注权威/含义未知；未删除批注或将划线
        Scope 当作干净规范依据。下方 ST 330:2011 引用不受批注覆盖，第 18/118/123 页无批注；不声称第 8 页整体无批注。本关系只表示这些规范性包身份条款的 uses，保持既有 MXF/KLV
        对象、描述和完整记录验证时间不变；不是两标准等同、一般兼容性、生成器唯一性/真实性、版权/权利/可信来源保证、完整文件或软件符合性、跨实现互通、安全认证或 IA 采用。
      conditions_en: Fixed source ST 377-1:2019 and target ST 330:2011 retain their work-level identities. MXF section
        3 on page 8 names that exact edition, not the later 2022 revision. Section 4.2 on page 18 requires only
        the 32-byte Basic UMID when UMID is used as Package ID. Normative Annex B.1 on page 118 defines Generic
        Package as an abstract class with a required 32-byte Package UID of type PackageID, representing the immutable
        package identifier as a UMID. Annex B.10 on page 123 requires a 32-byte SourcePackageID of type PackageRef
        when a Source Clip is present; it identifies the referenced package, with 32 zero-valued bytes explicitly
        terminating the source-reference chain. This is a contextual termination sentinel, not an ordinary generated
        unique UMID, and does not mean every MXF file contains a Source Clip. The 64-byte Extended UMID is excluded
        from this Package ID use; the note about other MXF specifications possibly using Extended UMID does not
        relax that rule. The original official MXF page 8 Scope StrikeOut annotation has unknown authority/meaning.
        No annotation was removed and no struck-through Scope prose is treated as clean normative evidence. The
        lower-page ST 330:2011 reference is outside the annotation; pages 18, 118 and 123 have no annotations. Page
        8 is not claimed wholly annotation-free. This uses relation is limited to these normative package-identity
        provisions, preserving existing MXF/KLV objects, descriptions and full-record verification timestamps. It
        does not establish equivalence, general compatibility, generator uniqueness/authenticity, copyright/rights/trustworthy
        provenance, complete file or software compliance, cross-implementation interoperability, security certification
        or IA adoption.
    evidence:
    - url: https://pub.smpte.org/latest/st377-1/st377-1-2019.pdf#page=8
      title: ST 377-1:2019 §3 — exact ST 330:2011 reference below, outside Scope StrikeOut
      language: en
      accessed: '2026-10-24'
    - url: https://pub.smpte.org/latest/st377-1/st377-1-2019.pdf#page=18
      title: ST 377-1:2019 §4.2 — Basic-only Package ID and zero-byte terminator definition
      language: en
      accessed: '2026-10-24'
    - url: https://pub.smpte.org/latest/st377-1/st377-1-2019.pdf#page=118
      title: ST 377-1:2019 normative Annex B.1 — required immutable 32-byte Package UID
      language: en
      accessed: '2026-10-24'
    - url: https://pub.smpte.org/latest/st377-1/st377-1-2019.pdf#page=123
      title: ST 377-1:2019 normative Annex B.10 — SourcePackageID and zero-valued termination sentinel
      language: en
      accessed: '2026-10-24'
    - url: https://pub.smpte.org/doc/st330/20110823-pub/st0330-2011.pdf#page=5
      title: ST 330:2011 §5 — distinct 32-byte Basic and 64-byte Extended UMID forms
      language: en
      accessed: '2026-10-24'
    - url: https://pub.smpte.org/doc/st330/20110823-pub/st0330-2011.pdf#page=6
      title: ST 330:2011 §6.1.1 — normative Basic UMID structure
      language: en
      accessed: '2026-10-24'
    last_verified_at: '2026-10-24T21:38:00.917872+00:00'
