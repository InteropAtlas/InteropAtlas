    scope_notes_en: The subject is a software library, not the protocol specification or a deployed Agent product.
      The fixed source sets its latest protocol constant to 2025-11-25 and also lists 2024-11-05, 2025-03-26 and
      2025-06-18; connections still require initialization and version/capability negotiation. README documents
      stdio, SSE and Streamable HTTP interfaces, which is not a verification of all transports in this slice. Its
      Tasks documentation explicitly labels the feature experimental, tracking the draft specification, with APIs
      subject to change without notice; no stable commitment is inferred. Package metadata requires Python >=3.10.
      This slice verifies evidence for client/server sessions and tools, resources and prompts, not every optional
      capability, authorized deployment, security, full conformance, cross-implementation interoperability or latest-release
      status. It is not a production recommendation. self_hostable is not inferred, and no capability concept is
      invented or forced onto the library.
