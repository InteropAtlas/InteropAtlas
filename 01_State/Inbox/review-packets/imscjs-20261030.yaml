    name_en: imscJS timed-text rendering library
    description_zh: 'imscJS 是将 IMSC 定时文本呈现为 HTML 片段的 JavaScript 库；本记录固定 2.0.0（tag 解析到 commit 110fce8825f95fd0f0f1e87f482a6744baaab49f），不称最新版本。fromXML
      把 XML 转为不透明 TT 对象，generateISD 按指定时刻生成中间表示，renderHTML 将其呈现到已附着于 DOM 的元素。默认 XML 解析器基于 DOMParser；没有 DOMParser
      时调用方须提供符合 parser.js 合同的解析器。HTML 呈现需要浏览器；解析和 ISD 生成不要求浏览器。输出尺寸由显式参数或父元素尺寸决定，图像资源须由调用方解析器（imgResolver）映射；不保证资源可得、字体等价或跨浏览器像素一致。


      ISD 以 [begin, end) 时间区间筛选内容并按关联区域裁剪，一个时刻的 ISD 不是完整创作文档，不是无损往返格式。warn/error 回调返回真值才中止，fatal 即使无回调也抛出；缺失或重复
      id 的 region 可在报错后被忽略，畸形时间值可警告后回退，非 media timeBase 致命失败。继续处理或成功显示不证明文档有效或完全符合规范。固定 README 明列不支持 tts:disparity、tts:luminanceGain
      与嵌入字体；主要在 Firefox/Chrome 开发，Safari 可能能力受限。仅检查固定 2.0.0 源码与文档，未构建、执行、浏览器验证或下载测试语料；不证明完整 IMSC/TTML 符合性、严格有效性验证、无损往返、跨浏览器像素等价、安全、生产适用性或
      IA 采用。 README 的广义 IMSC 描述和版本关键词不构成精确 IMSC 1.2 implements 证据；editing 仅是既有编辑导航，不是技术关系。


      English scope and limitations:


      imscJS is a JavaScript library rendering IMSC timed text to HTML fragments. This record is fixed to 2.0.0
      (tag resolves to commit 110fce8825f95fd0f0f1e87f482a6744baaab49f), not claimed latest. fromXML parses XML
      into an opaque TT object; generateISD derives an intermediate representation for a selected instant; renderHTML
      renders it into an element attached to the DOM. XML parsing defaults to DOMParser; when unavailable, the caller
      must supply a parser meeting parser.js. HTML rendering requires a browser, whereas parsing and ISD generation
      do not. Output dimensions depend on explicit parameters or the parent element; image resources require caller
      imgResolver mapping. Resource availability, font equivalence and cross-browser pixel equality are not guaranteed.


      ISD generation filters content by [begin, end) intervals and prunes by associated region: one instant ISD
      is not the complete authored document or a lossless round-trip format. warn/error abort only on a truthy callback
      return; fatal always throws even without a callback. Regions with missing/duplicate ids may be ignored after
      an error, malformed timing may warn and fall back, and non-media timeBase is fatal. Continued processing or
      successful display is not proof of validity or full conformance. The pinned README explicitly excludes tts:disparity,
      tts:luminanceGain and embedded fonts; development primarily uses Firefox/Chrome, with potentially reduced
      Safari capabilities. Evidence is fixed source/documentation inspection only: no build, execution, browser
      validation or test-corpus download. No full IMSC/TTML conformance, strict validation, lossless round trip,
      cross-browser pixel equivalence, security, production suitability or IA adoption is established. Generic IMSC
      descriptions and version keywords do not establish an exact IMSC 1.2 implements relation. Existing editing
      membership is editorial navigation, not a technical relation.'
