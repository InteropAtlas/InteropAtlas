    scope_notes_zh: 主体是 @digitalbazaar/vc JavaScript 库，不是规范、组织、上下文数据包或托管凭证服务。固定 7.3.0 / commit 08cd6f3d0c07bd62e899bd670a450ea92fe1bf59；注释标签
      v7.3.0 的 tag object 为 2d52d616476839bd6a0ada12f24030974ed5ae1c，标签/提交未签名，固定源码而非可变 main/tag 为证据。只核 createPresentation
      的 numeric version=2.0 路径：构造 @context=[https://www.w3.org/ns/credentials/v2]、type=[VerifiablePresentation]
      的未签名内存对象；可选嵌入普通 VC2-shaped credential 对象及 id/holder。上游另有发行、签名、验证和 VC1 功能，不计本次机制。此构造在安全机制之前，不生成 proof，不满足或证明
      VC2 第1.3节合规文档/发行者/验证者实现及第4.13节嵌入凭证的 securing 要求。truthy id/holder 直接复制，无类型/URL检查；调用方须自行保证合适值。verifiableCredential
      可省略；[] 也会输出为空数组，因此成功不保证 present 时 one-or-more 的规范数量要求。嵌入输入经 [].concat 包装和局部检查，内部对象引用共享，无深复制或不可变保证。检查覆盖识别的首上下文、VerifiableCredential
      类型、部分 subject/issuer/typed-object/URL 形状，但可放过空 subject 数组及 falsey 日期值，不是严格模型验证器；proof 仅局部形状检查，无签名/身份/状态真实性验证。VC2
      truthy validFrom/validUntil 使用未锚定、允许省略时区的正则及 now/maxClockSkew 时间窗口筛选，不保证全部规范日期要求或 validFrom<=validUntil；默认
      now 为当时 Date、skew 为300秒，时间有效性筛选可拒绝结构有效数据，成功结果随时间变化。数值2.0与字符串"2.0"不同。VC1兼容分支不计本边、不进行迁移；EnvelopedVerifiableCredential
      不受支持，不覆盖完整表示空间。上下文映射来自声明依赖 @digitalbazaar/credentials-context ^3.2.0 中所核 v3.2.0 固定源码；其 context JSON/静态导出对象与最终
