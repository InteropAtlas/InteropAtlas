      ^3.2.0、jsonld ^9.0.0、jsonld-signatures ^11.6.0 不是已安装版本，未获取 npm 包字节。调用方负责完整属性/数量/上下文规范检查、合适时间策略、安全机制、状态与信任判断。固定
      README 仍展示 VC1 示例，JSDoc 声称缺少 credential 会抛错，与当前实现的可选分支不符，未据此扩大结论。只读源码和测试定义，未安装/执行上游、运行测试、生成密钥、签名/验证凭证或查询身份/状态；不作完整标准合规、安全认证、法律效力、生产就绪、第三方互通或
      IA 采用声明。
    scope_notes_en: 'The identity is the @digitalbazaar/vc JavaScript library, not a specification, organization,
      context-data package or hosted credential service. Fixed 7.3.0 / commit 08cd6f3d0c07bd62e899bd670a450ea92fe1bf59;
      annotated v7.3.0 tag object 2d52d616476839bd6a0ada12f24030974ed5ae1c refers to it, with unsigned tag/commit
      metadata. Evidence is fixed source rather than mutable main/tag. Scope is only createPresentation with numeric
      version=2.0: an unsigned in-memory object with @context=[https://www.w3.org/ns/credentials/v2], type=[VerifiablePresentation],
      and optional ordinary VC2-shaped embedded objects/id/holder. Other issuance, signing, verification and VC1
      functionality is not covered. This pre-security construction creates no proof and neither satisfies nor establishes
      the securing/conformance requirements of VC2 section1.3 or section4.13 for embedded credentials. Truthy id/holder
      are copied without type/URL validation; callers must supply appropriate values. verifiableCredential may be
      omitted, and [] is emitted as an empty array, so success does not enforce the normative one-or-more constraint
      when present. [].concat wraps inputs and local checks run, but credential-object references remain shared,
      without deep-copy or immutability guarantees. Checks cover a recognized first context, VerifiableCredential
      type and some subject/issuer/typed-object/URL shapes, yet empty subject arrays and falsey dates can pass;
      this is not a strict model validator. Proof checks concern partial shape, not signature, identity or status
      authenticity. Truthy VC2 validFrom/validUntil receive an unanchored regex check with optional timezone plus
      now/maxClockSkew filtering, not all normative date requirements or a validFrom<=validUntil constraint. Defaults
      are the current Date and300seconds; time-window selection can reject structurally valid data and makes results
      time-dependent. Numeric2.0 differs from string"2.0". VC1 compatibility is excluded and performs no migration;
      EnvelopedVerifiableCredential is unsupported, so the full representation space is not covered. Context mapping
      was inspected in fixed credentials-context3.2.0 within the declared ^3.2.0 range; its JSON and statically
      extracted export equal the final REC B.1 official context as parsed objects, not as bytes. This supports the
      observed identifier/field correspondence, not JSON-LD expansion/compaction/canonicalization or complete conformance.
      Node>=18 and BSD-3-Clause are package/license declarations, not tested runtime compatibility or legal audit.
      Runtime ranges ^3.2.0, jsonld^9.0.0 and jsonld-signatures^11.6.0 do not prove installed versions; npm archive
      bytes were not acquired. Callers retain complete normative property/cardinality/context validation, time policy,
      securing, status and trust responsibilities. Fixed README VC1 examples and JSDoc claiming missing credentials
      throw are stale relative to the optional current branch, not evidence for broader coverage. Static source
      and test-definition inspection only: no upstream installation/execution/testing, key generation, credential
      signing/verification or identity/status lookup; no complete conformance, security certification, legal validity,
      production readiness, third-party interoperability or IA adoption claim.'
