inspection_boundary: Static fixed-source and final-REC/context data only; no upstream installation/import/execution/tests,
  network identity/status retrieval, keys or credential signing/verification. Atlas repository checks are separate.
  No local browser launch/bypass, package execution or new framework.
excluded_scope:
- Full VC2 validator or conforming issuer/verifier/document, secured-document generation, complete JSON-LD processing
- VC1 migration, enveloped credentials, other versions/algorithms/suites, added dependency/capability relations
- Cryptographic security, authentication, trust/legal validity, production-readiness, interoperability certification
  or IA adoption
- Held C2PA/PROV-O/other identity resolution, history rewrite, taxonomy/schema/runtime/page/governance changes
materialization_boundary_zh: 仅本地候选/packet先独立语义复核及全量适用检查。之后须 root 发布门槛；获准才真实远端冻结并正常 fetch 实际SHA，按既有合同物化精确对象/边、一个
  trust 成员和来源回执/事件，不猜SHA或squash。 若复核认为名称和条件仍不足以区分构造器与完整合规实现，则停止该关系及本批，不退成只为数量的零关系对象。
