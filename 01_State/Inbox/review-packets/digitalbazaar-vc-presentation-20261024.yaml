- case: No embedded proof / typed but unauthenticated proof
  result: No signature or status authentication in this function.
- case: Empty credentialSubject array / falsey dates
  result: Can pass branch/local checks; no strict schema guarantee.
- case: Otherwise structured input outside now/skew window
  result: Rejected due time selection rather than necessarily invalid model structure.
- case: Later mutation of supplied credential
  result: Object references shared; checked data not made immutable.
- case: EnvelopedVerifiableCredential
  result: Not covered; required VerifiableCredential type check rejects envelope-only type.
- case: VC1 input accepted by a separate compatibility path
  result: No VC1-to-VC2 conversion or cross-version conformance implied.
