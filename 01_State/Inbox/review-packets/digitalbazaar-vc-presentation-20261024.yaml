normative_correspondence:
- section: 4.3 Contexts
  fragment: contexts
  mechanism: Numeric2.0 maps to the reviewed v2 URI, emitted first and alone in @context. No generic JSON-LD processing
    claim.
- section: 4.13 Verifiable Presentations
  fragment: verifiable-presentations
  mechanism: type includes VerifiablePresentation; optional credential/id/holder mapping. Securing and one-or-more/type/URL
    constraints are not guaranteed by this constructor.
- section: 1.3 Conformance
  fragment: conformance
  mechanism: Full normative MUST and securing/issuer/verifier duties excluded; the return is a pre-security object,
    not certified conforming document.
- section: B.1 Base Context
  fragment: base-context
  mechanism: Official10131-byte digest matches finalREC; dependency serialization differs but parsed JSON/export
    data equal. Not executed JSON-LD validation.
