review_scope_zh:
- 连续批次A，四项既有候选；只审核proposed_record字段，不新建候选身份。
- 作者实际通过web读取下列官方页面，提供有限短摘录及定位。独立Reviewer可直接读取本包，不要求无权限的外网或artifact下载；须如实限定为独立解释所提供材料，未独立验证抓取真实性或全文。
- 先在完整基线及当前库核对ID、外部标识和名称；同名不能直接合并。MCP须检查已有工作级及版本对象，不因名字不同就认定新主体。
- RFC9700指向具体BCP文档，原artifact/guideline搭配不在受控kind表，拟改artifact/guidance_document；请判断为保持文档主体的分类纠正还是应暂缓。
- 逐项明确acceptable_for_ordinary_acceptance、deferred或rejected；指出获准的proposed_record字段，不以CI或代码无发现代替语义审核。未知专利、认证、合规、实现兼容性、当前最新版本均不在本包断言范围。
