    description_zh: OpenSSL 是包含 libssl、libcrypto 与 openssl 命令行工具的完整软件项目；本记录固定 3.6.0 / commit 7b371d80d959ec9ab4139d09d78e83c090de9779，只检视普通、版本可变
      TLS 客户端的版本上下界配置及 ClientHello 构造源码路径，不虚构独立 bounds 组件。SSL_CTX/SSL 的 min/max API 宏经 ctrl 调用检查和字段设置；0 表示自动选择支持的最低/最高版本，不是线上的版本号
      0。预检查区分 TLS/DTLS 并考虑编译排除，但不是保证 min<=max 或非空可用范围的通用验证器；这是静态代码观察，不是矛盾配置的运行测试。非零界限在固定版本 method 上可被忽略而仍返回成功；本片限定调用方选用版本可变
      TLS method。getter 返回配置字段，不是对端已协商的版本。连接创建时，method 版本匹配才复制 context 的上下界；不能据此声称之后修改 context 会更新现有连接。context 字段先置零，但创建随后应用系统默认配置并可能失败，故不声称最终默认均为无约束
      0/0。实际客户端范围选择枚举编译后的 method 表，结合上下界、禁用版本选项、安全策略与 Suite-B 限制处理可用区间和空洞；无剩余方法则返回 no-protocols-available。配置成功不是密码套件/provider、证书、身份认证或安全等级已满足的证明。ClientHello
      真实构造入口消费该范围，TLS1.3 的 legacy_version 字段仍用 TLS1.2；该字段本身不能判定最终协商版本。扩展表/dispatcher 将调用导向 supported_versions 构造器：最大版本低于
      TLS1.3 时省略该扩展，否则按选定范围写入内存 WPACKET，并有错误分支。构造数据不是网络写入、对端接收、成功握手或认证连接。服务器选择、QUIC、DTLS 及其他实现路径不在此片；排除范围不等于软件缺少这些功能。仅静态检查固定源码和测试配方；未安装、构建、导入、运行上游或其测试，未握手、联网、操作证书或改变
      TLS/provider/安全配置。README 提及 TLS1.3 / RFC8446 只是该版本上游说明，不证明完整 RFC8446，更不自动成为 RFC9846 符合性；零技术关系，旧编号文献及取代边不变。未建立完整协议符合性、密码学或部署安全审计、第三方互通、性能、当前平台/依赖兼容性、生产适用性或
      IA 采用。VERSION.dat 记录发布日 2025-10-01，不称最新版；GitHub tag 的 unknown_key 状态不是本次已验签或遭入侵结论，未本地验证签名。Apache-2.0 仅按固定
      LICENSE.txt 记录，不作法律适用或专利清理判断。trust 仅为既有编辑导航。
    description_en: 'OpenSSL is the whole software project containing libssl, libcrypto and the openssl command-line
      utility. This record pins 3.6.0 / commit 7b371d80d959ec9ab4139d09d78e83c090de9779 and inspects only ordinary
      version-flexible TLS client version-bound configuration and ClientHello construction, not a fictional standalone
      bounds component. SSL_CTX/SSL min/max API macros dispatch through ctrl checks and field updates. Zero means
      automatically selecting the lowest/highest supported version, not wire version zero. Preliminary checks distinguish
      TLS/DTLS and compile-time exclusions, but are not a general validator guaranteeing min<=max or a nonempty
      usable range; this is static observation, not a runtime test of contradictory settings. Nonzero bounds may
      be ignored on version-inflexible methods while returning success; this slice assumes caller-selected version-flexible
      TLS methods. Getters return configured fields, not an established peer-negotiated version. Connection creation
      copies context bounds only when method versions match; this does not show that later context changes update
      existing connections. Context fields initialize to zero, but creation subsequently applies system-default
      configuration and can fail, so unconstrained final 0/0 defaults are not asserted. Actual client range selection
      enumerates compiled method entries and combines bounds, disabled-version options, security policy and Suite-B
      restrictions while handling enabled ranges and holes; If no enabled method remains, selection returns no-protocols-available.
      Configuration success does not establish available ciphers/providers, certificates, peer authentication or
      satisfied security levels. Actual ClientHello construction consumes this range; TLS1.3 still uses TLS1.2 in
      legacy_version, which alone does not identify the eventual negotiated version. The extension table/dispatcher
      reaches the supported_versions constructor: it omits that extension below TLS1.3, otherwise writes the selected
      range into an in-memory WPACKET with error paths. Constructing data is not network output, peer receipt, successful
      handshake or authenticated connection evidence. Server selection, QUIC, DTLS and other paths are outside this
      slice, not claimed absent from the software. Fixed source and test recipes were inspected only: no upstream
      installation, build, import, execution or tests; no handshake, network, certificate operation or TLS/provider/security-setting
      change. README TLS1.3/RFC8446 wording is an upstream description of this release, not complete RFC8446 conformance
      and not an automatic RFC9846 claim. Zero technical relations are added; existing numbered documents and succession
      edge remain unchanged. No complete protocol conformance, cryptographic/deployment-security audit, third-party
      interoperability, performance, current platform/dependency compatibility, production suitability or IA adoption
      is established. VERSION.dat records 2025-10-01 as release date, not a latest-version claim. GitHub tag unknown_key
      metadata is neither local signature verification nor a compromise conclusion; no local signature audit was
      performed. Apache-2.0 is recorded from fixed LICENSE.txt only, not legal-suitability or patent-clearance advice.
      Existing trust membership is editorial navigation only.'
