review_scope_zh:
- 连续批次C，四项既有行业数据/媒体文档；只审核proposed_record字段，不扩充候选身份。
- 下列有限短摘录及定位来自本轮作者实际web读取的一手页面。Reviewer可离线独立解释材料，但不得宣称自己直连官网、全文核验或独立验证抓取真实性。
- 按完整底库检查ID、名称、外部标识重复；逐项明确acceptable_for_ordinary_acceptance、deferred或rejected及允许字段，不以CI或代码无发现代替。
- FHIR保持4.0.1固定版且承认混合成熟度；OGC固定17-069r4/1.0.1/Core；UBL仅2.3；RFC8251不与6716合并，不擅自新增updates关系词表。
- 新版本可另行发现但不覆盖旧身份。专利、法律合规、行业部署兼容性、资源级符合性、完整编码/解码正确性均不在本轮范围。
