    name_zh: html5lib Python HTML解析与序列化库
    name_en: html5lib Python HTML parsing and serialization library
    description_zh: 将HTML文档或片段解析为内存树并序列化的Python库；固定1.1，仅记录有界文档表示先例及容错、上下文、编码和输出默认行为。
    description_en: A Python library for parsing HTML documents/fragments into in-memory trees and serializing them;
      pinned to 1.1 with bounded document-representation precedents and recovery, context, encoding and output-default
      limits.
    version: '1.1'
    external_identifiers:
    - namespace: github
      value: html5lib/html5lib-python
    official_url: https://github.com/html5lib/html5lib-python
    versions:
    - version: '1.1'
      status: released
      url: https://pypi.org/project/html5lib/1.1/
    domains:
    - documentation
    - web
    capabilities:
    - document_representation
    open_source: true
    license_expression: MIT
    scope_notes_zh: 固定html5lib 1.1及官方tag 1.1 commit f87487a4ada2d6cf223bdd182774a01ba3c84618，PyPI该版发布于2020年6月；不宣称最新。库将HTML文档或片段解析为内存树并可序列化，默认使用标准库etree且HTML元素带命名空间；本切片仅收录document_representation能力，不将旧README面向WHATWG
      HTML的设计目标当作当前HTML Living Standard精确符合性，relations为空。默认strict=False会记录解析错误并尝试恢复/补树；strict=True在该解析器记录parse error时抛ParseError，不是完整作者文档符合性验证。片段container上下文影响构造结果，同一tr/td输入在table与默认div得到不同树。scripting只控制noscript的解析模式，不执行JavaScript；脚本文本可留在树中。固定实际字节API使用override_encoding、transport_encoding等参数；BOM优先于override，再依次考虑transport、meta等，不能照抄旧文档中笼统encoding参数或覆盖BOM说法；源码meta预扫描为1024字节，不是旧说明的512。所有字节测试显式useChardet=False；缺编码信息时本例回退windows-1252，指定UTF-8遇无效字节以替换字符解码，不等于严格字节有效性验证。默认序列化可省略可选标签及属性引号；显式encoding返回bytes，并默认可注入charset
      meta；不承诺源码逐字往返或任意树格式无损转换。默认sanitize=False，本切片不测试或推荐安全过滤。20项可信小型合成内存例仅使用标准库etree；未测可选chardet猜测、lxml/genshi后端、全部HTML规则、外部文档获取、浏览器布局/导航/脚本执行、第三方互通、认证或IA采用。14份固定官方源指纹、10份安装源码逐字一致及官方wheel
      SHA256匹配分别留痕；不是完整依赖安全审计或符合性认证。MIT仅据固定LICENSE记录，不作法律适用性判断。
    scope_notes_en: 'Pinned to html5lib 1.1 and official tag 1.1 at commit f87487a4ada2d6cf223bdd182774a01ba3c84618;
      this PyPI release was published in June 2020 and is not described as the latest. The library parses HTML documents/fragments
      into in-memory trees and serializes them, defaulting to the standard-library etree backend with namespaced
      HTML elements. This slice records document_representation only. The old README goal of conforming to WHATWG
      HTML does not establish exact conformance to the current HTML Living Standard; no implements relation is recorded.
      Default strict=False records parse errors and attempts recovery/tree construction. strict=True raises ParseError
      when this parser records an error, not a complete authoring-conformance assessment. Fragment container context
      changes the tree: identical tr/td input differs under table and default div. scripting selects noscript parsing
      behavior, not JavaScript execution; script text can remain in the tree. The fixed bytes-input API uses override_encoding
      and transport_encoding, among other parameters. A BOM takes precedence over override, then transport, meta
      and further sources are considered. Older documentation describing a generic encoding parameter overriding
      a BOM is not followed; source meta prescanning is 1024 bytes rather than its older 512-byte wording. Every
      bytes probe explicitly sets useChardet=False. With no encoding information the tested fallback is windows-1252;
      invalid bytes under explicit UTF-8 decode to a replacement character rather than proving strict byte validity.
      Default serialization may omit optional tags and attribute quotes. Explicit encoding returns bytes and can
      inject charset metadata by default. Source-text identity and lossless conversion across arbitrary tree formats
      are not promised. sanitize=False by default; security filtering is neither tested nor recommended here. Twenty
      small trusted synthetic in-memory examples use only the standard-library etree backend. Optional chardet guessing,
      lxml/genshi backends, all HTML rules, external-document retrieval, browser layout/navigation/script execution,
      third-party interoperability, certification and IA adoption were not tested. Fourteen fixed official source
      fingerprints, ten byte-identical installed source files and official wheel SHA256 matching are separate observations,
      not a full dependency security audit or conformance certification. MIT is recorded from the fixed LICENSE,
      not as a legal-suitability opinion.'
