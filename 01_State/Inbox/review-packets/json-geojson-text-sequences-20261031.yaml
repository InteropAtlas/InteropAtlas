    name_en: JavaScript Object Notation (JSON) Text Sequences (RFC 7464)
    official_name: JavaScript Object Notation (JSON) Text Sequences
    description_zh: 'RFC 7464（2015 年 2 月原始出版物，Proposed Standard）定义 JSON 文本序列和 application/json-seq。编码使用 UTF-8，以
      RS（0x1E）前置、LF（0x0A）结尾；JSON 文本定义引用 RFC 7159，可含任意顶层 JSON 值，序列本身不是单个 JSON 文本。解析语法与编码语法不同：对无效元素建议跳至后续 RS 继续解析（不是修复无效数据），但应用可终止；连续
      RS 不表示空元素，未定义结束标记或可靠的第 n 项定位。数字、true、false、null 等非自定界值须检查尾随 JSON 空白，否则丢弃可能截断的元素；这依赖编码器接收完整文本，不保证发现任意截断。仅限原始出版物，勘误内容和状态未核验；不保证每条有效、修复或成功恢复；不提供超出序列所表示记录顺序的传输或应用层顺序/交付保证，也不证明安全或实现互通，不等同
      NDJSON 或 SSE，也不将历史引用改为 RFC 8259。


      English scope and limitations:


      RFC 7464 (February 2015 original publication, Proposed Standard) defines JSON text sequences and application/json-seq.
      Encoding uses UTF-8 with RS (0x1E) before each text and LF (0x0A) after it. RFC 7159 supplies JSON-text syntax,
      including any top-level JSON value; a sequence is not itself one JSON text. Parsing grammar differs: skipping
      malformed elements to resume at a later RS is recommended, not repair of invalid data; applications may terminate.
      Consecutive RS do not denote empty elements; no end marker or reliable nth-element identification is defined.
      Non-self-delimited numbers, true, false and null require trailing JSON whitespace checks, with possibly truncated
      elements dropped; detection depends on complete encoder input, not arbitrary-corruption detection. Original
      publication only; errata contents/status unreviewed. No record-validity, repair or successful-recovery guarantee;
      no transport/application ordering or delivery guarantee beyond the represented record sequence, nor assurance
      of security or implementation interoperability; not NDJSON or SSE, and the historical reference is not replaced
      by RFC 8259.'
    description_en: 'RFC 7464 (February 2015 original publication, Proposed Standard) defines JSON text sequences
      and application/json-seq. Encoding uses UTF-8 with RS (0x1E) before each text and LF (0x0A) after it. RFC
      7159 supplies JSON-text syntax, including any top-level JSON value; a sequence is not itself one JSON text.
      Parsing grammar differs: skipping malformed elements to resume at a later RS is recommended, not repair of
      invalid data; applications may terminate. Consecutive RS do not denote empty elements; no end marker or reliable
      nth-element identification is defined. Non-self-delimited numbers, true, false and null require trailing JSON
      whitespace checks, with possibly truncated elements dropped; detection depends on complete encoder input,
      not arbitrary-corruption detection. Original publication only; errata contents/status unreviewed. No record-validity,
      repair or successful-recovery guarantee; no transport/application ordering or delivery guarantee beyond the
      represented record sequence, nor assurance of security or implementation interoperability; not NDJSON or SSE,
      and the historical reference is not replaced by RFC 8259.'
