review_scope_zh:
- 连续处理四个既有 Web 媒体候选：MSE、EME、WebRTC、WebVTT；不新建候选身份。
- 先核对完整 Canonical 的 ID、名称和外部标识。作者已读取 W3C 官方当前页面/出版历史；Reviewer 只独立解释本包有限材料，不冒充独立网络抓取或全文核验。
- MSE 与 EME 的旧候选标签把工作级 /TR/ 入口和某一历史出版状态混在一起；本轮先做身份诊断，不自动把 2016/2017 Recommendation 或 2026 Draft 当作同一固定文档。
- WebRTC 的当前 /TR/webrtc/ 明确为 2025-03-13 Recommendation；WebVTT 当前 /TR/webvtt1/ 为 2026-05-20 Candidate Recommendation Draft。两项拟以工作级文档入口 + 固定举证版本进行普通接纳。
- 对 WebRTC、WebVTT 分别给出 acceptable_for_ordinary_acceptance / deferred / rejected，并说明 proposed_record 是否可原样复制。对 MSE、EME 分别判断 proposed_decision=deferred、proposed_state=identity_risk 是否合理。
- 不用 CI、代码无发现或点赞代替语义结论；不批准包外关系、实现兼容、DRM 法律/许可结论、浏览器覆盖率或“最新版本”泛化。
