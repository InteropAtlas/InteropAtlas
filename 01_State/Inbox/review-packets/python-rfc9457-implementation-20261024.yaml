  upstream_runtime_tests_performed: false
  http_or_framework_test_performed: false
  boundary_zh: 仅审阅固定官方源码及测试定义，并做静态 AST/结构投影；不以未执行测试定义冒充运行成功或规范认证。
materialization_boundary_zh: 候选与完整提案先接受独立语义复核；尚未发布或接受。通过后把两文件冻结为正常 Git 祖先提交，核验实际远端 SHA/blob，再追加 acceptance 与 intake_provenance。物化必须保持被审字段不变，仅增加生命周期/贡献/溯源元数据；当前
  packet 改为 reference-only receipt，最终六文件另作独立结构复核。不得使用猜测的本地 SHA 或 squash 掉已审祖先。
