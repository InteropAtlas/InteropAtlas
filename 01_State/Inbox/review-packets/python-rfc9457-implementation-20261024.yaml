  proposed_record:
    id: python_rfc9457
    type: system
    kind: library
    name_zh: Python rfc9457 问题详情库
    name_en: rfc9457 Python problem-details library
    official_name: rfc9457
    version: 0.4.1
    external_identifiers:
    - namespace: github
      value: NRWLDev/rfc9457
    - namespace: pypi
      value: rfc9457
    official_url: https://github.com/NRWLDev/rfc9457
    description_zh: 用于构造异常形式问题对象及 Python 字典表示的开源库。本记录固定核验 0.4.1 的 Problem 与 marshal() 路径，不把字典构造称为 JSON 字节序列化或 HTTP
      响应处理。
    description_en: An open-source Python library for exception-backed problem objects and dictionary representations.
      This record verifies the 0.4.1 Problem and marshal() path, not JSON byte serialization or HTTP response handling.
    open_source: true
    license_expression: Apache-2.0
    scope_notes_zh: '软件库主体按既有 system/library 模式收录，固定版本 0.4.1、tag v0.4.1、commit b7bd8868f714ccc808343331c2dd08c8369c753f；包与导入名为
      rfc9457。它不是 RFC 文献、组织、Web 框架或新的发行版主体。核心模块首行 RFC9547 是笔误；同一模块链接、README 与包元数据指向 RFC 9457，不据此创建其他标准身份。


      Problem 继承 Exception，接收 title、type_、detail、默认 500 的 status、headers 和扩展关键字。marshal() 返回含 type/title/status、真值
      detail 及扩展的 Python dict，而非 JSON 文本/字节；instance 可以作为扩展传入但未验证。headers 单独保存，不写入该字典。输入成员类型、状态码范围、扩展语义及 JSON 可序列化性由调用方负责。


      未提供真值 type_ 时，默认 type 从异常类名派生；未提供真值 uri 时，非 strict 模式用 {type}。uri 参数通过 Python str.format 代入 type/status/title/扩展，不是
      URI 解析、相对解析、编码、解引用或 RFC 6570 引擎。strict=True 首先要求真值 uri，仍先进行格式替换，随后若显式 type_ 为假值才把结果改为 about:blank；格式错误仍可抛出异常。该开关不是完整
      RFC 校验器，也不会自动把 title 改成相应 HTTP reason phrase。


      构造时只拒绝名为 type 或空白的扩展键；不能将其称为全面保留字段保护。extras 可变，之后注入 type/title/status 等键可能造成重复格式参数错误；不据此保证任意输入有效或安全。状态、header、redirect
      辅助类及 openapi.py 中的描述字典不扩大本切片的实现关系。README 的 Starlette/FastAPI 使用说法未独立核验，不当作集成、采用或符合性证据。


      固定 pyproject.toml 声明 Python >=3.10、唯一运行时依赖 multidict >=6.0.5、Apache-2.0 和 Development Status 4 - Beta；开发 extras
      与构建工具不混为运行时依赖。官方发布非 prerelease 版本不等于稳定、最新或生产适用。


      仅做固定官方源码、测试源码和元数据审阅及 IA 提案投影，未安装、构建或运行上游代码，未起 HTTP 服务或执行网络/框架互通测试。实际 HTTP 响应的状态一致性、内容类型、JSON 编码、协商与传输由调用方/框架负责；不声称完整
      RFC 9457 符合性、OpenAPI 符合性、部署安全或 IA 实际采用，不添加 capability。'
    scope_notes_en: 'The library follows the existing system/library pattern, fixed at version 0.4.1, tag v0.4.1,
      commit b7bd8868f714ccc808343331c2dd08c8369c753f; package/import name rfc9457. It is not an RFC publication,
      organization, web framework or separate release subject. The core docstring typo RFC9547 does not override
      its RFC 9457 link, README and package identity.


      Problem subclasses Exception and accepts title, type_, detail, status defaulting to 500, headers and extension
      keywords. marshal() returns a Python dict with type/title/status, truthy detail and extensions, not JSON text/bytes.
      instance can be supplied as an unvalidated extension. Headers are stored separately, outside that dict. Callers
      remain responsible for member types, status range, extension semantics and JSON-serializable values.


      With no truthy type_, the default type is derived from the exception class name; non-strict mode uses {type}
      when uri is falsey. The uri argument uses Python str.format with type/status/title/extensions, not URI parsing,
      relative resolution, encoding, dereferencing or an RFC 6570 engine. strict=True first requires a truthy uri
      and still performs interpolation before replacing the result with about:blank when explicit type_ is falsey.
      Formatting can fail. This switch is not a complete RFC validator and does not automatically choose the HTTP
      reason-phrase title.


      Construction rejects only extension key type and blank/whitespace keys, not all reserved-member risks. extras
      is mutable; later type/title/status mutations can produce duplicate format-keyword errors. No arbitrary-input
      validity or safety is promised. Status/header/redirect helpers and openapi.py description dictionaries do
      not extend this accepted claim. README Starlette/FastAPI use statements were not independently verified as
      integration, adoption or conformance evidence.


      Fixed metadata declares Python >=3.10, the sole runtime dependency multidict >=6.0.5, Apache-2.0 and Development
      Status 4 - Beta. Development extras and build tools are not runtime dependencies. A published non-prerelease
      version is not therefore stable, latest or production-ready.


      Only fixed official source, test-source and metadata review plus IA proposal projection were performed; upstream
      code was not installed, built or executed and no HTTP server, network or framework interoperability test ran.
      Actual response-status consistency, media type, JSON encoding, negotiation and transport remain caller/framework
      responsibilities. Complete RFC 9457 conformance, OpenAPI conformance, deployment security and IA adoption
      are not asserted; no capability is added.'
