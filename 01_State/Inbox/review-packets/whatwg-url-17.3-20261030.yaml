      No installer, lifecycle, local wrapper generator, downloader, signature/attestation validation or source
      symlink execution.
    - python NEW_DEST/harnesses/run_replay.py NEW_DEST NEW_DEST/harnesses. This runs audited finite40, separate
      instrumented4, separate author-boundary6, unchanged selected upstream Node/WPT runner, captures raw stdout/stderr/load
