        const root=path.resolve(process.argv[2]);const attempted=[];

        function deny(name){return function(){attempted.push(name);throw Error(''offline:''+name);};}

        globalThis.fetch=deny(''fetch'');for(const m of [''node:http'',''node:https''])for(const n of [''get'',''request''])require(m)[n]=deny(m+''.''+n);

        for(const [m,n]of [[''node:net'',''connect''],[''node:net'',''createConnection''],[''node:tls'',''connect''],[''node:dgram'',''createSocket''],[''node:dns'',''lookup''],[''node:dns'',''resolve'']])require(m)[n]=deny(m+''.''+n);

        require(''node:net'').Socket.prototype.connect=deny(''Socket.connect'');

        const tr46=require(path.join(root,''../node_modules/tr46''));const original=tr46.toASCII;let calls=[];

        tr46.toASCII=function(domain,options){const result=original.call(this,domain,options);calls.push({domain,options,result});return
        result;};

        const W=require(root),records=[];

        function observe(id,input,fn,check){calls=[];const value=fn();const row={id,input,value,calls};check(row);records.push(row);}

        observe(''ordinary-ascii-relaxed-skips-strict-call'',''https://_dmarc.example.test/'',()=>{const u=W.parseURL(''https://_dmarc.example.test/'');return
        {isNull:u===null,serialized:u&&W.serializeURL(u)};},r=>{assert.equal(r.calls.length,0);assert.equal(r.value.serialized,r.input);});

        observe(''diagnostics-ascii-strict-failure-nonfatal'',''https://_dmarc.example.test/'',()=>{const u=W.parseURLWithValidationErrors(''https://_dmarc.example.test/'');return
        {isNull:u.url===null,serialized:u.url&&W.serializeURL(u.url),validationErrors:u.validationErrors};},r=>{assert.equal(r.calls.length,1);assert.equal(r.calls[0].options.checkHyphens,true);assert.equal(r.calls[0].result,null);assert.deepEqual(r.value.validationErrors,[''domain-to-ASCII'']);assert.equal(r.value.serialized,r.input);});

        observe(''writing-validity-uses-strict-domain-result'',''https://_dmarc.example.test/'',()=>W.isValidURLString(''https://_dmarc.example.test/''),r=>{assert.equal(r.value,false);assert.equal(r.calls.length,1);assert.equal(r.calls[0].options.verifyDNSLength,true);});

        observe(''ordinary-nonascii-still-uses-relaxed-idna'',''https://faß.de/'',()=>W.serializeURL(W.parseURL(''https://faß.de/'')),r=>{assert.equal(r.value,''https://xn--fa-hia.de/'');assert.equal(r.calls.length,1);assert.equal(r.calls[0].options.checkHyphens,false);assert.equal(r.calls[0].options.checkBidi,true);assert.equal(r.calls[0].options.checkJoiners,true);assert.equal(r.calls[0].options.transitionalProcessing,false);});

        tr46.toASCII=original;assert.deepEqual(attempted,[]);

        console.log(JSON.stringify({role:''research-author supplemental self-authored runtime observations'',node:process.version,packageVersion:JSON.parse(fs.readFileSync(path.join(root,''package.json''))).version,records,recordCount:records.length,assertions:''PASS'',networkAttempts:attempted,method:''In-memory
        tr46.toASCII wrapper records and delegates unchanged args/return; no disk modifications. Not a performance
        timing test.'',limits:''No exhaustive grammar/diagnostic equivalence test. README expressly treats grammar
