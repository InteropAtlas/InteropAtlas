      content: "'use strict';\n// Supplementary file-load audit: observes Node's synchronous loader without altering\
        \ source.\n// Must run before probes.cjs. Only writes the explicitly supplied audit path at process exit.\n\
        const fs = require('node:fs');\nconst crypto = require('node:crypto');\nconst path = require('node:path');\n\
        const { fileURLToPath } = require('node:url');\nconst { registerHooks } = require('node:module');\nconst\
        \ output = process.env.FINITE_PROBE_LOAD_AUDIT;\nif (!output) throw new Error('FINITE_PROBE_LOAD_AUDIT\
        \ output path is required');\nconst loads = [];\nregisterHooks({ load(url, context, nextLoad) {\n  const\
        \ result = nextLoad(url, context);\n  const event = { url, format: result.format };\n  if (url.startsWith('file:'))\
        \ {\n    const pathname = fileURLToPath(url);\n    const raw = fs.readFileSync(pathname);\n    event.fileBytes\
        \ = raw.length;\n    event.fileSha256 = crypto.createHash('sha256').update(raw).digest('hex');\n    //\
        \ Source is not changed or synthesized by this hook.\n    event.sourceProvidedByNextLoad = result.source\
        \ !== null && result.source !== undefined;\n    if (event.sourceProvidedByNextLoad) {\n      const bytes\
        \ = typeof result.source === 'string' ? Buffer.from(result.source) : Buffer.from(result.source);\n   \
        \   event.loadedSourceBytes = bytes.length;\n      event.loadedSourceSha256 = crypto.createHash('sha256').update(bytes).digest('hex');\n\
        \    }\n  }\n  loads.push(event);\n  return result;\n}});\nprocess.on('exit', () => fs.writeFileSync(path.resolve(output),\
        \ JSON.stringify({\n  method: 'Node v24 synchronous module.registerHooks load hook, installed by preload\
        \ before harness; delegate nextLoad unchanged then record file bytes and returned source if present',\n\
        \  scope: 'Observed loader events after hook registration. Built-ins listed by URL only; this is not native-code\
        \ or all OS resource tracing. The preload and its pre-registration built-in imports are not events.',\n\
        \  node: process.version,\n  loads\n}, null, 2) + '\\n'));\n"
