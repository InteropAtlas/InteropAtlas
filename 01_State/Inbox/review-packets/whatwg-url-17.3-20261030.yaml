    - Extract the complete source_evidence.reconstructible_runtime_evidence value from the pending review packet
      as components.json (or use this JSON directly); write materializer.content exactly as UTF-8 materialize.py
      and verify its bytes/SHA256 before inspection/execution.
    - Inspect embedded code and fixed input inventory. Default materialization uses a manually populated SHA256-addressed
      regular-file cache. Fetch the exact 5 official npm artifacts and 36 fixed raw Git inputs using allowed public
      source access; save each response as cache/<sha256>. Every input is verified by byte count/SHA256, additionally
      SRI/SHA1 for tarballs and Git blob IDs for source/WPT inputs.
    - python materialize.py components.json /absolute/NEW_DEST --cache /absolute/CACHE. Optional --fetch explicitly
      requests the same official fixed URLs, with no fallback/current version. It was NOT used by the author.
      Respect environment permissions; do not route around a denied acquisition.
