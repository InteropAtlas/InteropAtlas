      English scope and limitations:


      whatwg-url is the JavaScript URL library published as jsdom/whatwg-url / npm whatwg-url, pinned here to
      17.3.0 (2026-10-14), source commit 6a0e2ad72245ec3b7dfb122709c9f5762313b928. Its README declares URL-spec
      commit fde3f74f063341a28d437216f75735b8b40128f5 as an implementation baseline, not a new edition of the
      living standard, verification of later changes, or reapproval of IA''s older 845bafca historical snapshot.
      One bounded implements edge covers the inspected URL/URLSearchParams, parsing/serialization and finite low-level
      algorithms. Existing resource_identification means URL identifier syntax and record processing, not resource
      retrieval or permanent identity.


      Parsing success, diagnostic collection and grammar validity are distinct. parseURLWithValidationErrors()
      returns an object containing url and validationErrors; a non-null record can carry nonfatal errors, while
      isValidURLString() is a separate grammar-based checker. The README allows grammar/diagnostic disagreement,
      but these finite observations found no disagreement witness: neither equivalence nor a fabricated counterexample
      is claimed. https://a.test/%s parses and canParse is true, yet reports invalid-URL-unit and grammar false.
      https://a.test:99999 is rejected across the relevant paths: parse/diagnostic url null, canParse/grammar
      false and port-out-of-range; it is not a grammar/diagnostic disagreement. WebIDL conversion for URL.parse()/URL.canParse()
      can throw for Symbol or throwing toString before the usual invalid-string null/false path. Low-level record
      APIs do not share that conversion contract.


      Constructor, href and component setters differ; there is no universal rejection, rollback or atomicity.
      Setting host=new.test:99999 on https://old.test:81/a changes it to https://new.test:81/a. A low-level host
      stateOverride can mutate the supplied record''s host before returning null. Tested host/port setters consume
      the numeric prefix 12 from 12abc while the constructor rejects it. Tested invalid href assignment throws
      and preserves the old record; this is not generalized to all setters. Parsing loses lexical details such
      as case, default ports, dot segments, selected IPv4 spellings and percent representations; equal results
      do not prove equal original input.


      URLSearchParams is a live ordered list of repeated-name pairs, not a unique-key map. append/set/delete and
      stable sort have their own mutation rules; stable sorting preserves same-name value order. Form reserialization
      can change %20 to +, ~ to %7E and escape case; an empty query marker ? can disappear. It is not arbitrary
      lexical round-trip preservation. The 17.3 search setter strips tab/LF/CR and synchronizes the parsed query
      into the same live searchParams object. Arbitrary low-level URL-record mutation can produce inconsistency,
      and serializeURL is not validation: a manually assigned port=99999 serializes but fails reparsing. Serializing
      file: origin to the string "null" is an implementation choice, not resource/identity equivalence. Low-level
      legacy query encoding also differs from wrapper UTF-8 behavior.


      Ordinary nondiagnostic relaxed ToASCII processing differs from the additional strict diagnostic check. For
      tested _dmarc.example.test, the ordinary path makes no ToASCII call; the diagnostic path performs a strict
      check and reports domain-to-ASCII but returns the same URL, with grammar false. Ordinary parsing of faß.de
      uses relaxed IDNA. Four instrumented observations record delegated calls/options, not timing, performance
      superiority, security, or grammar/diagnostic-disagreement evidence.


      The fixed source contains 39 Git blobs: 38 regular files and one mode120000 symlink whose target text alone
      was verified. The npm artifact contains 19 files: 14 common files are raw-byte-identical, five generated
      wrappers exist only in the distribution, and 25 blobs are source-only. Execution uses published wrappers,
      not locally regenerated build output, and does not claim whole-package/source parity. All five tarballs''
      advertised SHA512 SRI/SHA1 digests were checked. Exact release-lock dependencies are @exodus/bytes 1.16.0,
      tr46 7.0.0, webidl-conversions 8.0.1 and punycode 2.3.1. The author replays the runtime collaborator''s
      40 finite records and the researcher''s separate four instrumented records, plus six separately authored
      boundary observations for port/record/WebIDL behavior, from retained artifacts on Node 24.22.1, satisfying
      declared ^22.14.0 || >=24.0.0 but not a tested version matrix. Researcher, runtime collaborator, independent
      preflight''s 15 observations and author replay retain distinct roles. Cases and replays overlap and are
      never added as coverage.


      The unchanged selected fixed-source Node/WPT runner, using those published wrappers and exact dependencies,
      reports 5633 tests: 5632 pass, one explicit FormData skip, zero fail, 29 suites. Its promise_test adapter
      is a no-op, and three manually recreated groups still cite older sync 06c4589623bf8f8c92fda5afabe44059a01465dc;
      the other fixed WPT pin is cfb4a4b0bb480522d095557b16d86a15d6897e35 with 29 verified fixtures. This is not
      full WPT, browser coverage, all-input/API coverage or full/current living-standard conformance. Artifact
      reconstruction restores 114 runtime files and 150 upstream input files; CJS/ESM auditing of the finite40
      harness observes 46 runtime files loaded, not an upstream-runner or all-executions load count. Raw absolute
      stack-path differences between reconstruction directories are retained; structured equality after excluding
      those paths is not raw-byte equality. No install, lifecycle scripts, generator, source lint/coverage, browser
      or signature/attestation verification. No fetch/DNS/resource-availability/object-URL-registry/security-sanitizer/permanent-global-identity/RFC3986-interchangeability/supply-chain-certification/production-recommendation/IA-adoption/future-compatibility/full-conformance
      claim. Existing URL/RFC3986 records, old alternative_to, python_rfc3986 and the JSON Pointer/RFC4627 publication
      reference remain unchanged.'
