      content: "#!/usr/bin/env python3\n\"\"\"Author self-check of a fresh reconstructed runtime; captures raw\
        \ outputs without rewriting.\"\"\"\nfrom pathlib import Path\nimport datetime,hashlib,json,os,re,subprocess,sys\n\
        d=Path(sys.argv[1]).resolve();h=Path(sys.argv[2]).resolve();logs=d/'logs';logs.mkdir()\nreceipts=[]\n\
        def run(name,args,cwd=None,extra=None):\n    start=datetime.datetime.now(datetime.timezone.utc).isoformat();env=dict(os.environ)\n\
        \    # NO_UPDATE would cause the upstream required module to exit before exports/tests.\n    env.pop('NO_UPDATE',None)\n\
        \    if extra:env.update(extra)\n    with (logs/(name+'.stdout')).open('wb') as out,(logs/(name+'.stderr')).open('wb')\
        \ as err:\n        proc=subprocess.run(args,cwd=cwd or d,env=env,stdout=out,stderr=err)\n    row=dict(name=name,command=args,cwd=str(cwd\
        \ or d),started_at=start,finished_at=datetime.datetime.now(datetime.timezone.utc).isoformat(),exit_code=proc.returncode,environment_overrides=extra\
        \ or {})\n    for field,suffix in [('stdout','.stdout'),('stderr','.stderr')]:\n        raw=(logs/(name+suffix)).read_bytes();row[field]=dict(path=name+suffix,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest())\n\
        \    receipts.append(row);(logs/'commands.json').write_text(json.dumps(receipts,indent=2)+'\\n')\n   \
        \ if proc.returncode:raise SystemExit('Replay failed: '+name)\nrun('finite',['node','--require',str(h/'load-audit.cjs'),str(h/'probes.cjs'),str(d/'runtime/package')],extra={'FINITE_PROBE_LOAD_AUDIT':str(logs/'load-audit.json')})\n\
        run('supplement',['node',str(h/'diagnostic-supplement.cjs'),str(d/'runtime/package')])\nrun('author-boundary',['node','--require',str(h/'upstream-offline-guard.cjs'),str(h/'author-boundary-supplement.cjs'),str(d/'runtime/package')],extra={'IA_NETWORK_LOG_DIR':str(logs)})\n\
        run('upstream',['node','--require',str(h/'upstream-offline-guard.cjs'),'--test',*[str(p.relative_to(d/'upstream/package'))\
        \ for p in sorted((d/'upstream/package/test').glob('*.js'))]],cwd=d/'upstream/package',extra={'IA_NETWORK_LOG_DIR':str(logs)})\n\
        f=json.loads((logs/'finite.stdout').read_text());s=json.loads((logs/'supplement.stdout').read_text());u=(logs/'upstream.stdout').read_text()\n\
        counts={k:int(v) for k,v in re.findall(r'^\\u2139 (tests|suites|pass|fail|cancelled|skipped|todo) (\\\
        d+)$',u,re.M)}\nif not counts:counts={k:int(v) for k,v in re.findall(r'^# (tests|suites|pass|fail|cancelled|skipped|todo)\
        \ (\\d+)$',u,re.M)}\nassert f['recordCount']==40 and not f['assertionFailures'] and not f['networkGuard']['attempts']\n\
        b=json.loads((logs/'author-boundary.stdout').read_text());assert b['recordCount']==6 and all(x['assertions']=='PASS'\
        \ for x in b['records'])\nassert s['recordCount']==4 and s['assertions']=='PASS' and not s['networkAttempts']\n\
        assert counts=={'tests':5633,'suites':29,'pass':5632,'fail':0,'cancelled':0,'skipped':1,'todo':0},counts\n\
        assert not list(logs.glob('network-attempt-*'))\nassert all(x['stderr']['bytes']==0 for x in receipts)\n\
        audit=json.loads((logs/'load-audit.json').read_text());files={x['url']:x for x in audit['loads'] if x['url'].startswith('file:')};runtime=[x\
        \ for url,x in files.items() if url.startswith((d/'runtime').as_uri()+'/')]\nassert len(runtime)==46\n\
        summary=dict(role='Author self-check by /root/resume_jsonpointer_delivery/whatwg_url_author/author_runtime;\
        \ not independent semantic review',node=f['runtime']['node'],finite_records=40,finite_failures=0,supplement_records=4,author_boundary_records=6,upstream_reported=counts,load_audit=dict(events=len(audit['loads']),unique_file_urls=len(files),runtime_files=len(runtime)),guarded_network_attempts=0,stderr_empty=True,limits=['Finite,\
        \ supplement, upstream and replays overlap; not additive coverage.','Unchanged selected fixed-source Node/WPT\
        \ runner uses published generated npm wrappers and fixed release-lock dependencies.','One explicit FormData\
        \ skip; promise_test adapter is a no-op; three manually recreated groups cite older sync 06c4589623bf8f8c92fda5afabe44059a01465dc.','Not\
        \ full WPT/browser/standard conformance, installation/build/lifecycle, source lint/coverage, security\
        \ or signature/attestation validation.','Four instrumented delegated ToASCII call observations are not\
        \ timing/performance evidence.','Network guard observes selected JavaScript entrypoints, not OS-wide network\
        \ tracing.','Raw outputs retain absolute stack paths; no raw equality inferred from typed comparisons.'])\n\
        (logs/'summary.json').write_text(json.dumps(summary,indent=2)+'\\n');print(json.dumps(summary,indent=2))\n"
