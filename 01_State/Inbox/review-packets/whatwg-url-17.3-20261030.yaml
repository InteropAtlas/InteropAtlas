      bytes: 19892
      sha256: 9fe4d0bf5a75a44a4ba175d60dc32b29abdf235e514656e8cbd463830e703c79
      content: "'use strict';\n// Research-authored finite offline observations, not independent intake acceptance\
        \ or full conformance.\n// Reconstruct: node probes.cjs /absolute/path/to/the/extracted/whatwg-url/package\
        \ > results.json\nconst fs = require('node:fs');\nconst path = require('node:path');\nconst crypto = require('node:crypto');\n\
        const assert = require('node:assert/strict');\nconst packageRoot = path.resolve(process.argv[2] || '');\n\
        if (!process.argv[2]) throw Error('Provide exact extracted whatwg-url package directory');\nconst attemptedNetwork\
        \ = [];\nfunction deny(name) { return function (...args) { attemptedNetwork.push({ name, argumentTypes:\
        \ args.map(x => typeof x) }); throw Error('NETWORK_DISABLED: ' + name); }; }\nglobalThis.fetch = deny('global.fetch');\n\
        for (const name of ['node:http', 'node:https']) { const m = require(name); m.request = deny(name + '.request');\
        \ m.get = deny(name + '.get'); }\nconst net = require('node:net'); net.connect = deny('net.connect');\
        \ net.createConnection = deny('net.createConnection'); net.Socket.prototype.connect = deny('net.Socket.connect');\n\
        require('node:tls').connect = deny('tls.connect'); require('node:dgram').createSocket = deny('dgram.createSocket');\n\
        const dns = require('node:dns'); for (const name of Object.keys(dns)) if (name === 'lookup' || name.startsWith('resolve'))\
        \ dns[name] = deny('dns.' + name);\nconst nativeURL = globalThis.URL;\nconst W = require(packageRoot);\n\
        const { URL, URLSearchParams } = W;\nconst records = [];\nfunction error(e) { return { name: e.name, message:\
        \ e.message, stack: e.stack }; }\nfunction capture(f) { try { return { outcome: 'returned', value: f()\
        \ }; } catch (e) { return { outcome: 'threw', error: error(e) }; } }\nfunction typed(v) {\n  if (v ===\
        \ undefined) return { type: 'undefined' };\n  if (v === null) return { type: 'null' };\n  if (Array.isArray(v))\
        \ return { type: 'array', values: v.map(typed) };\n  if (typeof v === 'object') return { type: 'object',\
        \ properties: Object.fromEntries(Object.entries(v).map(([k, x]) => [k, typed(x)])) };\n  if (typeof v\
        \ === 'number' && !Number.isFinite(v)) return { type: 'number', value: String(v) };\n  return { type:\
        \ typeof v, value: v };\n}\nfunction add(id, input, source, operation, check) {\n  const observation =\
        \ capture(operation); let assertion;\n  try { check(observation); assertion = { passed: true }; } catch\
        \ (e) { assertion = { passed: false, error: error(e) }; }\n  records.push({ id, input: typed(input), source,\
        \ observation: typed(observation), assertion });\n}\nfunction value(r) { assert.equal(r.outcome, 'returned');\
        \ return r.value; }\nfunction errorName(r, name) { assert.equal(r.outcome, 'threw'); assert.equal(r.error.name,\
        \ name); }\nfunction parse(input, options) { const r = W.parseURLWithValidationErrors(input, options);\
        \ return { serialized: r.url && W.serializeURL(r.url), record: r.url, validationErrors: r.validationErrors,\
        \ grammarValid: W.isValidURLString(input, options) }; }\nconst USM = 'lib/url-state-machine.js'; const\
        \ UI = 'lib/URL-impl.js'; const QI = 'lib/URLSearchParams-impl.js'; const UV = 'lib/url-string-validator.js';\n\
        add('normalization-not-lexical-roundtrip', 'HTTP://Example.TEST:80/a/./b/../c?x=%7e#F', USM, () => parse('HTTP://Example.TEST:80/a/./b/../c?x=%7e#F'),\
        \ r => { const v = value(r); assert.equal(v.serialized, 'http://example.test/a/c?x=%7e#F'); assert.equal(v.grammarValid,\
        \ true); });\nadd('encoded-slash-remains-in-path', 'https://example.test/a%2Fb', USM, () => new URL('https://example.test/a%2Fb').pathname,\
        \ r => assert.equal(value(r), '/a%2Fb'));\nadd('relative-base-record-versus-wrapper-string', { relative:\
        \ '../d?x=1#f', base: 'https://example.test/a/b' }, USM, () => ({ low: W.serializeURL(W.parseURL('../d?x=1#f',\
        \ { baseURL: W.parseURL('https://example.test/a/b') })), wrapper: new URL('../d?x=1#f', 'https://example.test/a/b').href\
        \ }), r => assert.deepEqual(value(r), { low: 'https://example.test/d?x=1#f', wrapper: 'https://example.test/d?x=1#f'\
        \ }));\nadd('relative-without-base-failure-surfaces', 'relative', UI, () => ({ low: W.parseURL('relative'),\
        \ parse: URL.parse('relative'), canParse: URL.canParse('relative'), constructor: capture(() => new URL('relative'))\
        \ }), r => { const v = value(r); assert.equal(v.low, null); assert.equal(v.parse, null); assert.equal(v.canParse,\
        \ false); errorName(v.constructor, 'TypeError'); });\nadd('special-backslash-repair-with-errors', 'http:\\\
        \\EXAMPLE.test\\\\a', USM, () => parse('http:\\\\EXAMPLE.test\\\\a'), r => { const v = value(r); assert.equal(v.serialized,\
        \ 'http://example.test/a'); assert.equal(v.grammarValid, false); assert.ok(v.validationErrors.includes('invalid-reverse-solidus'));\
        \ });\nadd('non-special-opaque-host-case-and-port', 'foo://EXAMPLE.test:80/a', USM, () => ({ parsed: parse('foo://EXAMPLE.test:80/a'),\
        \ origin: new URL('foo://EXAMPLE.test:80/a').origin }), r => { const v = value(r); assert.equal(v.parsed.serialized,\
        \ 'foo://EXAMPLE.test:80/a'); assert.equal(v.origin, 'null'); });\nadd('opaque-base-fragment-only-relative',\
        \ { base: 'mailto:user@example.test', fragment: '#f', path: 'other' }, USM, () => ({ fragment: URL.parse('#f',\
        \ 'mailto:user@example.test')?.href, path: URL.parse('other', 'mailto:user@example.test'), origin: new\
        \ URL('mailto:user@example.test').origin }), r => assert.deepEqual(value(r), { fragment: 'mailto:user@example.test#f',\
        \ path: null, origin: 'null' }));\nadd('file-drive-and-localhost-normalization', 'file://localhost/C|/a',\
        \ USM, () => ({ parsed: parse('file://localhost/C|/a'), origin: new URL('file://localhost/C|/a').origin\
        \ }), r => { const v = value(r); assert.equal(v.parsed.serialized, 'file:///C:/a'); assert.equal(v.parsed.grammarValid,\
        \ false); assert.equal(v.origin, 'null'); });\nadd('ipv4-nondecimal-repair-not-valid-input', 'http://0x7f.1/',\
        \ USM, () => parse('http://0x7f.1/'), r => { const v = value(r); assert.equal(v.serialized, 'http://127.0.0.1/');\
        \ assert.equal(v.grammarValid, false); assert.deepEqual(v.validationErrors, ['IPv4-too-few-parts', 'IPv4-non-decimal-part']);\
        \ });\nadd('ipv6-canonical-serialization', 'https://[2001:0db8:0:0:0:0:0:1]:443/', USM, () => parse('https://[2001:0db8:0:0:0:0:0:1]:443/'),\
        \ r => assert.equal(value(r).serialized, 'https://[2001:db8::1]/'));\nadd('idna-nontransitional-selected-label',\
        \ 'https://faß.de/', 'lib/url-miscellaneous.js + tr46@7.0.0', () => parse('https://faß.de/'), r => { const\
        \ v = value(r); assert.equal(v.serialized, 'https://xn--fa-hia.de/'); assert.equal(v.grammarValid, true);\
        \ });\nadd('idna-joiner-selected-rejection', 'https://\\u200D.example/', 'lib/url-miscellaneous.js + tr46@7.0.0',\
        \ () => parse('https://\\u200D.example/'), r => { const v = value(r); assert.equal(v.serialized, null);\
        \ assert.equal(v.grammarValid, false); assert.ok(v.validationErrors.includes('domain-to-ASCII')); });\n\
        add('nonfatal-percent-validation-error', 'https://example.test/%s', USM + ' + ' + UV, () => parse('https://example.test/%s'),\
        \ r => { const v = value(r); assert.equal(v.serialized, 'https://example.test/%s'); assert.equal(v.grammarValid,\
        \ false); assert.deepEqual(v.validationErrors, ['invalid-URL-unit']); });\nadd('fatal-host-validation-error',\
        \ 'https://exa mple.test/', USM + ' + ' + UV, () => parse('https://exa mple.test/'), r => { const v =\
        \ value(r); assert.equal(v.serialized, null); assert.equal(v.grammarValid, false); assert.ok(v.validationErrors.includes('domain-to-ASCII'));\
        \ });\nadd('credentials-parse-but-invalid-grammar', 'https://user:pass@example.test/', USM + ' + ' + UV,\
        \ () => parse('https://user:pass@example.test/'), r => { const v = value(r); assert.equal(v.serialized,\
        \ 'https://user:pass@example.test/'); assert.equal(v.record.password, 'pass'); assert.equal(v.grammarValid,\
        \ false); assert.ok(v.validationErrors.includes('invalid-credentials')); });\nadd('ascii-control-trimming-visible-errors',\
        \ ' \\tHTTPS://EXAMPLE.test/a\\n?x=1\\r#f ', USM, () => parse(' \\tHTTPS://EXAMPLE.test/a\\n?x=1\\r#f\
        \ '), r => { const v = value(r); assert.equal(v.serialized, 'https://example.test/a?x=1#f'); assert.equal(v.grammarValid,\
        \ false); assert.ok(v.validationErrors.length >= 1); });\nadd('usvstring-surrogate-and-lowlevel-diagnostics',\
        \ 'https://example.test/\\uD800', 'lib/URL.webidl + published lib/URL.js + ' + USM, () => ({ wrapper:\
        \ new URL('https://example.test/\\uD800').href, low: parse('https://example.test/\\uD800') }), r => {\
        \ const v = value(r); assert.equal(v.wrapper, 'https://example.test/%EF%BF%BD'); assert.equal(v.low.serialized,\
