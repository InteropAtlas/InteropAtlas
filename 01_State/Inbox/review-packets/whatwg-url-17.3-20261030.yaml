      content: "#!/usr/bin/env python3\n\"\"\"Materialize reviewed packet data, never install/build or run acquired\
        \ code.\nUsage: python materialize.py components.json NEW_DEST --cache SHA256_BLOB_DIRECTORY\nOr explicitly\
        \ permit official fixed-URL acquisition with --fetch (no implicit fallback).\nCache mode reads digest-addressed\
        \ regular files only and performs no network access.\nPublic URL mode is for an authorized environment;\
        \ a denial is not permission to bypass.\n\"\"\"\nfrom pathlib import Path, PurePosixPath\nimport argparse,\
        \ base64, hashlib, io, json, shutil, tarfile, urllib.request\n\np = argparse.ArgumentParser()\np.add_argument('components');\
        \ p.add_argument('destination')\nmode = p.add_mutually_exclusive_group(required=True)\nmode.add_argument('--cache');\
        \ mode.add_argument('--fetch', action='store_true')\na = p.parse_args()\ndata = json.loads(Path(a.components).read_text())\n\
        d = Path(a.destination).resolve()\nif d.exists(): raise ValueError('New destination required; do not overwrite\
        \ a previous run')\nd.mkdir(parents=True)\n\ndef relpath(s):\n    q = PurePosixPath(s)\n    if q.is_absolute()\
        \ or '..' in q.parts or not q.parts: raise ValueError('Unsafe path')\n    return Path(*q.parts)\n\ndef\
        \ sha(raw): return hashlib.sha256(raw).hexdigest()\ndef verify(raw, row):\n    if len(raw) != row['bytes']\
        \ or sha(raw) != row['sha256']: raise ValueError('Byte/digest mismatch: '+row.get('url', row.get('path',\
        \ '?')))\n    if 'git_blob' in row:\n        actual = hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\\\
        0'+raw).hexdigest()\n        if actual != row['git_blob']: raise ValueError('Git blob mismatch')\n   \
        \ if 'shasum' in row and hashlib.sha1(raw).hexdigest() != row['shasum']: raise ValueError('SHA1 mismatch')\n\
        \    if 'integrity' in row:\n        algorithm, expected = row['integrity'].split('-',1)\n        if algorithm\
        \ != 'sha512' or base64.b64encode(hashlib.sha512(raw).digest()).decode() != expected: raise ValueError('SRI\
        \ mismatch')\n    return raw\n\ndef obtain(row):\n    if a.cache:\n        f = Path(a.cache)/row['sha256']\n\
        \        if f.is_symlink() or not f.is_file(): raise ValueError('Missing regular cache blob: '+str(f))\n\
        \        raw = f.read_bytes()\n    else:\n        # Only packet-enumerated HTTPS official locations, no\
        \ guessed/current version or fallback URL.\n        url = row['url']\n        if not url.startswith(('https://registry.npmjs.org/',\
        \ 'https://raw.githubusercontent.com/jsdom/whatwg-url/', 'https://raw.githubusercontent.com/web-platform-tests/wpt/')):\
        \ raise ValueError('Unexpected acquisition host')\n        with urllib.request.urlopen(url, timeout=60)\
        \ as response:\n            if response.geturl() != url: raise ValueError('Unexpected redirect; inspect\
        \ separately')\n            raw = response.read()\n    return verify(raw,row)\n\ndef inventory(root):\n\
        \    return sorted([dict(path=str(f.relative_to(root)), bytes=f.stat().st_size, sha256=sha(f.read_bytes()))\
        \ for f in root.rglob('*') if f.is_file()],key=lambda x:x['path'])\n\nfor row in data['artifacts']:\n\
        \    raw = obtain(row)\n    root = d/'runtime'/relpath(row['destination'])\n    root.mkdir(parents=True)\n\
        \    with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as archive:\n        for member in archive.getmembers():\n\
        \            q = PurePosixPath(member.name)\n            if q.is_absolute() or '..' in q.parts or not\
        \ q.parts or q.parts[0] != 'package' or member.issym() or member.islnk(): raise ValueError('Unsafe archive\
        \ member')\n            if member.isdir(): continue\n            if not member.isfile() or len(q.parts)<2:\
        \ raise ValueError('Unexpected archive member')\n            out = root/Path(*q.parts[1:])\n         \
        \   if out.exists(): raise ValueError('Duplicate archive member')\n            out.parent.mkdir(parents=True,\
        \ exist_ok=True)\n            out.write_bytes(archive.extractfile(member).read())\n    actual = inventory(root)\n\
        \    expected = sorted([dict(path=str(PurePosixPath(x['path']).relative_to(row['destination'])),bytes=x['bytes'],sha256=x['sha256'])\
        \ for x in row['manifest']],key=lambda x:x['path'])\n    if actual != expected: raise ValueError('Unpacked\
        \ manifest mismatch')\n\nif inventory(d/'runtime') != data['runtime_manifest']: raise ValueError('Runtime\
        \ inventory mismatch')\nshutil.copytree(d/'runtime',d/'upstream')\nfor row in data['runner_inputs']:\n\
        \    out=d/'upstream'/relpath(row['destination'])\n    if out.exists(): raise ValueError('Duplicate runner\
        \ input')\n    out.parent.mkdir(parents=True,exist_ok=True);out.write_bytes(obtain(row))\nif inventory(d/'upstream')\
        \ != data['upstream_manifest']: raise ValueError('Upstream inventory mismatch')\nfor row in data['self_authored_scripts']:\n\
        \    raw=row['content'].encode('utf-8');verify(raw,row)\n    out=d/'harnesses'/relpath(row['filename']);out.parent.mkdir(parents=True,exist_ok=True)\n\
        \    if out.exists(): raise ValueError('Duplicate harness')\n    out.write_bytes(raw)\nreceipt=dict(role='Author\
        \ self-check packet materialization, not independent review',destination=str(d),mode='verified cache,\
        \ no network' if a.cache else 'explicit public acquisition',artifacts=len(data['artifacts']),runtime_files=len(inventory(d/'runtime')),runner_inputs=len(data['runner_inputs']),upstream_input_files=len(inventory(d/'upstream')),harnesses=len(data['self_authored_scripts']),all_manifest_bytes_match=True,install_lifecycle_generator_executed=False,source_symlinks_dereferenced=False)\n\
