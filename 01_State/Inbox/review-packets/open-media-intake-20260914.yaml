review_scope_zh:
- 连续处理四个既有开放媒体候选：AV1、C2PA、SRT、RIST；不新增候选身份。
- AV1拟普通接纳；C2PA、SRT、RIST先做身份诊断。Reviewer须先核对完整Canonical、原候选blob、名称和外部标识，不靠同名/不同名自动判定。
- 作者已读取官方一手来源。独立Reviewer仅解释本包有限材料，未独立验证网络抓取真实性或全文；不得把CI、代码无发现或点赞当作语义接受。
- AV1旧候选的aom:av1标识作为既有工作级/项目内标识保留，不声称其是外部注册机构的正式版次标识；固定举证文本明确为Version 1.0.0 with Errata 1。
- C2PA旧候选把通用c2pa:c2pa-spec标识与固定2.1 locator混合，而官方同一系列现有2.1、2.2、2.3、2.4等版本；本轮不自动决定工作级主体还是2.1固定出版物。
- SRT候选同时指向协议、开源实现仓库和仍处Internet-Draft工作区的协议文档；RIST候选把TR-06系列与一个具体TR-06-2历史版本locator混在一起。两项均先诊断，不自动拆分或合并。
