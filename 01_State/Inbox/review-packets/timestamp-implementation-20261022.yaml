    id: python_pyrfc3339
    type: system
    kind: library
    name_zh: pyRFC3339 Python 时间戳转换库
    name_en: pyRFC3339 Python timestamp conversion library
    description_zh: 在Python datetime与时间戳字符串之间解析、生成和转换的库；固定2.1.1，记录日期时间表达先例及严格语法、精度和偏移信息保留的边界。
    description_en: A library for parsing, generating and converting timestamps with Python datetime objects; pinned
      to 2.1.1 as a date/time representation precedent with explicit syntax, precision and offset-preservation limits.
    version: 2.1.1
    external_identifiers:
    - namespace: github
      value: kurtraschke/pyRFC3339
    - namespace: pypi
      value: pyRFC3339
    official_url: https://github.com/kurtraschke/pyRFC3339
    versions:
    - version: 2.1.1
      status: released
      url: https://pypi.org/project/pyRFC3339/2.1.1/
    domains:
    - time
    - information_interchange
    capabilities:
    - date_time_representation
    open_source: true
    license_expression: MIT
    scope_notes_zh: 固定 pyRFC3339 2.1.1（官方 tag v2.1.1，commit cc6ffe260f63c4e37c2789813894516c089e5cb6；PyPI 于2026年10月11日发布，Python>=3.11），不宣称最新。仅记录
      Python datetime 与时间戳字符串之间的有界转换，不是时钟同步、测量精度或实际事件时间证明。parse 委托 datetime.fromisoformat；Python3.12.14实测除带偏移时间戳及小写t/z外，也接受无偏移、仅日期、周日期、基本格式、缺秒、逗号小数、任意单字符分隔及含秒/小数秒的偏移；接受不等于RFC3339严格有效。闰秒60被拒绝，九位小数截为微秒；本例拒绝RFC9557时区注释，不能称完整RFC3339或IXDTF实现。parse默认保留所解析的数值偏移，utc=True转UTC；但无偏移输入配utc=True按宿主本地时区解释，控制TZ为UTC和UTC+8时得到不同瞬时值。generate默认转UTC并截去小数秒（不四舍五入），microseconds=True输出微秒，utc=False保留数值偏移；含非整分钟偏移的datetime可输出RFC3339语法之外的秒/小数秒偏移，调用者须约束输入。generate默认拒绝naive，accept_naive=True且utc=True把它当UTC，区别于parse对naive的宿主解释；accept_naive=True与utc=False组合拒绝naive。Z、+00:00、-00:00在本例解析后合并，重新生成均为Z，未保留原拼写，亦未保留+00:00（首选UTC）与-00:00（本地偏移未知）的语义区别；RFC9557已更新RFC3339中Z的解释，使其表示本地偏移未知，不能把Z一概等同于首选UTC。produce_naive=True仅允许零偏移结果，先utc=True可转UTC后去tzinfo；原输入无偏移而produce_naive=True触发AssertionError。40项可信合成内存例、8份固定官方源指纹及4份安装源码逐字匹配用于边界核验，不是全规范/跨Python版本/第三方互通/安全审计/生产适用性或IA采用证明；MIT仅据固定许可证记录。
    scope_notes_en: Pinned to pyRFC3339 2.1.1, official tag v2.1.1 at cc6ffe260f63c4e37c2789813894516c089e5cb6,
      published on PyPI on 11 October 2026 and requiring Python >=3.11; not described as the latest. This is bounded
      conversion between Python datetime objects and timestamp strings, not clock synchronization, measurement accuracy
      or proof of event time. parse delegates to datetime.fromisoformat. On Python 3.12.14, besides offset timestamps
      and lowercase t/z, it accepts missing offsets, date-only and week/basic forms, missing seconds, comma fractions,
      arbitrary single-character separators, and second/fractional-second offsets. Acceptance is not strict RFC3339
      validity. Leap second 60 is rejected; nine fractional digits truncate to microseconds. The tested RFC9557
      timezone annotation is rejected; neither full RFC3339 nor IXDTF conformance is claimed. parse preserves the
      parsed numerical offset by default; utc=True normalizes to UTC, but a naive input is interpreted using the
      host local timezone and yields different instants under controlled UTC versus UTC+8 settings. generate defaults
      to UTC and truncates fractional seconds without rounding; microseconds=True emits microseconds and utc=False
      retains the numerical offset. Sub-minute datetime offsets can produce second/fractional-second offsets outside
      RFC3339 grammar, so callers must constrain inputs. generate rejects naive input by default; accept_naive=True
      with utc=True assumes UTC, unlike the naive-parser host interpretation; accept_naive=True with utc=False rejects
      it. Z, +00:00 and -00:00 collapse during parsing in these examples and all regenerate as Z, losing original
      spelling and the semantic distinction between +00:00 (preferred UTC) and -00:00 (unknown local offset). RFC9557
      updates Z in RFC3339 to express unknown local offset; Z must not be treated unconditionally as preferred UTC.
      produce_naive=True permits only a zero-offset result, optionally after utc=True normalization; an originally
      naive input with produce_naive=True raises AssertionError. Forty trusted synthetic in-memory examples, eight
      fixed official source fingerprints and four byte-identical installed source files check these boundaries,
      not all requirements, all Python versions, third-party interoperability, security, production suitability
      or IA adoption. MIT is recorded from the fixed license only.
