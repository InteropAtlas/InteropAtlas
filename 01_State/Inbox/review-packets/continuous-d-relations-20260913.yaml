source_evidence:
- evidence_id: mcp_jsonrpc_requirement
  url: https://modelcontextprotocol.io/specification/2025-11-25/basic
  accessed: '2026-09-13'
  observed_via: author_web_retrieval
  locator: Base Protocol / Messages
  excerpt: All messages between MCP clients and servers MUST follow the JSON-RPC 2.0 specification.
  observation_zh: 正文JSON-RPC 2.0超链接直接指向https://www.jsonrpc.org/specification，支持固定MCP版本到既有JSON-RPC2.0规范的uses关系。这里只收消息规范关系，不等同于全部授权、生命周期或传输规范。
- evidence_id: quic_explicit_tls_reference
  url: https://www.rfc-editor.org/rfc/rfc9001.html
  accessed: '2026-09-13'
  observed_via: author_web_retrieval
  locator: Sections 3, 4.2 and 11.1 Normative References / TLS13
  excerpts:
  - QUIC uses the TLS handshake
  - The Transport Layer Security (TLS) Protocol Version 1.3
  - TLS record protection is not used by QUIC.
  observed_reference:
    section: '11.1'
    reference_label: TLS13
    rfc_number: '8446'
    doi: 10.17487/RFC8446
    url: https://www.rfc-editor.org/info/rfc8446
  observation_zh: 第11.1节是Normative References，TLS13明确列RFC8446及DOI，不是只从TLS版本号推断。第3节说明QUIC使用TLS握手而自行承担记录层职责，第4.2节允许具备所需特性的更新TLS版本；因此本关系限于固定RFC9001对RFC8446规范的使用，不宣称只能使用1.3或承载TLS记录。
