      API 的真实兼容性、发布内容不可变或版本递增决策符合规范，也不改变 SemVer / CalVer 或 IA 的版本策略。规范对 0.y.z 初始开发和先行版本兼容性的不确定性仍适用。


      默认 Version.parse 要求 MAJOR.MINOR.PATCH、ASCII 标识符、核心数字及数字型先行标识符无多余前导零；构建标识符可有前导零。optional_minor_and_patch=True
      是补零扩展，不是规范的完整版本语法。构造器、replace 和集合比较走 int() / str() 转换而非同一语法验证，bool、浮点数和数字字符串可被转换；任意 prerelease/build
      可造成非 SemVer 值。实际观察 Version(1,2,3,''01'') 与 Version(1,2,3,''1'') 比较相等，却具有不同 hash，并在所测 set 中保留两个元素；这是无效构造值的反例，不是严格解析有效版本的反例。字符串形式再交给严格解析会拒绝
      ''01''。


      有效版本的 build 元数据被保存在表示中，但比较、相等和 hash 不使用 build：1.2.3+a 与 1.2.3+b 同优先级且同 hash，原字符串并不相同。有限规范顺序示例通过不代表任意输入可比较：在本次
      CPython 3.12.14 默认 4300 位整数转换限制下，超限核心数字解析抛 ValueError，而超限数字型先行标识符可先解析成功、在比较转 int 时再抛 ValueError。支持超过
