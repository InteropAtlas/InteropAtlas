      English scope and limitations:


      Python semver is the Python library published as python-semver/python-semver / PyPI semver, pinned here
      to 3.1.0 (PyPI artifacts published 2026-09-12), source commit 642d1bc8949d38cca7922df478d0f2c06513f99d,
      declaring Python >=3.10. One bounded implements edge covers default strict parsing and precedence comparison
      of valid SemVer strings within host integer-processing limits, against the existing Semantic Versioning
      2.0.0 object. Existing version_expression means version syntax and order, not proof of actual public-API
      compatibility, immutable released contents or correct version-increment decisions. No SemVer/CalVer or
      IA versioning-policy change; SemVer''s initial-development and prerelease compatibility uncertainty remains.


      Default Version.parse requires MAJOR.MINOR.PATCH, ASCII identifiers and no extra leading zeros in core
      numbers or numeric prerelease identifiers; build identifiers may have leading zeros. optional_minor_and_patch=True
      is a zero-filling extension, not the complete normative version grammar. Constructor, replace and collection
      comparisons use int()/str() conversion rather than that same grammar validation: bools, floats and numeric
      strings may be coerced, and arbitrary prerelease/build fields may create non-SemVer values. Observed
      Version(1,2,3,''01'') and Version(1,2,3,''1'') compare equal but have different hashes and retain two
      elements in the tested set. This concerns invalid constructed values, not valid strictly parsed versions;
      strict reparsing rejects the ''01'' string.


      For valid versions, build metadata is retained in representation but ignored in precedence, equality
      and hashing: 1.2.3+a and 1.2.3+b compare equally and hash equally without lexical identity. Passing finite
      specification-order examples does not make every input comparable. Under this CPython 3.12.14 run''s
      default 4300-digit integer-conversion limit, oversized core numbers fail parsing with ValueError; an
      oversized numeric prerelease can parse successfully but fail later comparison during int conversion.
      Finite support beyond 64 bits is not unlimited-length support. parse accepts str and UTF-8 bytes; invalid
      UTF-8 can raise UnicodeDecodeError. is_valid catches only ValueError (including that UnicodeDecodeError),
      while unsupported input types can propagate TypeError: it is not a total boolean validator for arbitrary
      values.


      match supports six single operators <, >, <=, >=, == and != plus bare complete-version equality. Single
      =, caret, tilde, wildcard and compound npm ranges are unsupported. It is not a PEP 440 processor, dependency
      solver or npm-range implementation. is_compatible is a directional field heuristic, not actual API testing:
      for positive major versions it checks equal major, other.minor >= self.minor and identical prerelease
      while ignoring patch/build; valid 0.y.z versions must have identical first four parts, still ignoring
      build. A lower patch can therefore return true for positive-major versions without proving compatibility,
      upgrade safety or dependency availability.


      The optional fast_semver_rs_backend may be imported automatically when installed. Only default strict
      parse delegates; optional_minor_and_patch parsing does not. ValueError during delegated parsing/construction
      falls back to Python, not arbitrary exceptions. Actual source and wheel executions here did not install
      or execute that native backend. Five replacement-function instrumentation records observe only Python
      delegation/fallback control flow, not Rust-backend equivalence, performance or security; no native, multi-Python
      or platform-matrix assurance.


      The fixed source has 114 Git blobs, including two symlinks whose target text and resolved in-repository
      file contents were checked. The 18783-byte wheel and 304162-byte sdist match PyPI-advertised SHA-256.
      Only eight runtime package files are raw-byte-equal across source/wheel/sdist, not the whole packages,
      a reproducible build, a signature or supply-chain authentication. Fresh researcher execution records
      87 cases (82 finite and five substitute-function control-flow observations), personally replayed by the
      author from reconstructed inputs; the author also wrote 47 finite assertions and one invalid-constructor
      hash/set observation. Independent preflight''s 33 observations overlap these and upstream tests and are
      never added as coverage. Fixed upstream tests/docs in source and wheel modes each report 416 pass and
      one native skip on Python 3.12.14. Source mode keeps .pytest.ini; wheel mode changes only pytest pythonpath
      to tests to import the installed wheel, without test adapter or test-source patch. Displayed coverage
      excludes the native pragma-no-cover path and is not full standard conformance. The test environment uses
      the fixed wheel and test dependencies without building semver; separate probes use -I -S and direct wheel
      access with stdlib only.


      Only this fixed implementation slice is recorded. No full SemVer conformance, production recommendation,
      IA adoption, actual API compatibility, dependency resolution, native equivalence/performance, security,
      signature or future-compatibility claim. Existing standard/capability records, engine_v0_1_uses_semver
      and semver_alternative_calver are not reapproved by this addition.'
