      content: '#!/usr/bin/env python3

        """Run the unmodified fixed upstream pytest suite against source or installed wheel.

        The wheel mode changes only pytest pythonpath from ''src tests'' to ''tests'', so imports

        resolve the wheel. Both modes retain upstream doctests and the rest of .pytest.ini.

        No test adapter, skip injection, native substitution or source patch is used here.

        """

        import argparse,json,os,subprocess,sys

        from pathlib import Path

        p=argparse.ArgumentParser();p.add_argument(''--root'',required=True);p.add_argument(''--python'',required=True);p.add_argument(''--mode'',choices=[''source'',''wheel''],required=True);a=p.parse_args()

        root=Path(a.root).resolve();python=os.path.abspath(a.python);stem=root/(''upstream-''+a.mode)

        command=[python,''-m'',''pytest'',''-q'',''--junitxml=''+str(stem)+''.xml'']

        if a.mode==''wheel'':command += [''-o'',''pythonpath=tests'']

        env=os.environ.copy();env.pop(''PYTHONPATH'',None);env[''PYTHONHASHSEED'']=''0''

        result=subprocess.run(command,cwd=root/''source'',env=env,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)

        Path(str(stem)+''.log'').write_text(result.stdout);Path(str(stem)+''.exit'').write_text(str(result.returncode)+''\n'');Path(str(stem)+''.command.json'').write_text(json.dumps({''command'':command,''cwd'':str(root/''source''),''PYTHONPATH'':''unset'',''PYTHONHASHSEED'':''0'',''adapter'':''none'',''source_modified'':False},indent=2)+''\n'')

        print(result.stdout);raise SystemExit(result.returncode)

        '
