    description_en: 'Kotlin event representation SDK at official source release 0.2.0: static correspondence for
      v1.0 context, non-colliding extensions and single-event/batch JSON codecs. Callers supply valid fields; construction/encoding
      does not automatically validate. Not full CloudEvents 1.0.2 conformance, a verified Maven binary, runtime
      test, network binding or delivery guarantee.'
    version: 0.2.0
    versions:
    - version: 0.2.0
      status: released
      url: https://github.com/cloudevents/sdk-kotlin/releases/tag/v0.2.0
    external_identifiers:
    - namespace: github
      value: cloudevents/sdk-kotlin
