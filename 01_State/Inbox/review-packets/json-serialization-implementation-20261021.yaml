      conditions_zh: 限定为固定版本文档明确按 RFC 8259 描述的 JSON 文本数据处理。默认 JSON 路径不启用注释扩展，字符串和错误行为按 parse/dump 参数；不将库内二进制值或可选扩展当作
        RFC 8259 语法。默认 int64/uint64/double 数值限制、浮点舍入与对象键排序适用，不保证任意精度或词法无损往返，NaN 赋值序列化为 null。本关系不证明完整符合性认证、JSON Schema
        验证、MCP/WoT/CloudEvents 整体实现、规范化签名或跨应用互通。
      conditions_en: Limited to the fixed-release JSON text operations documented with RFC 8259. The default JSON
        path does not enable comment extensions; string/error behavior follows parse/dump parameters. Internal binary
        values or optional extensions are not treated as RFC 8259 syntax. Default int64/uint64/double range limits,
        floating-point rounding and sorted object keys apply; arbitrary precision or lexical-lossless round trips
        are not guaranteed, and assigned NaN serializes as null. This does not certify full conformance, JSON Schema
        validation, full MCP/WoT/CloudEvents implementation, canonical signatures or cross-application interoperability.
