    id: javascript_yaml
    type: system
    kind: library
    name_zh: yaml JavaScript YAML 解析与序列化库
    name_en: yaml JavaScript YAML parsing and serialization library
    description_zh: npm 的 yaml 包，来自 eemeli/yaml，固定为 2.9.1，使用 JavaScript 值解析和输出 YAML 文本。其 YAML 1.2 支持连接到规范修订 1.2.2，后者定义同一
      1.2 语言且没有规范性变更；这是有界实现关系，不是完整符合性声明。version:'1.2' 默认值不强制所有文档采用 1.2：显式或流中继承的 YAML 1.1 上下文不在该关系范围内。默认 Core 将
      yes/no/on/off 保留为字符串，将 012 解释为十进制 12，并接受非有限数；并不自动兼容 JSON。schema:'json' 选择 YAML 的 JSON 兼容 schema，不是 JSON
      Schema/Draft 验证。默认 JavaScript Number 可能丢失整数精度；intAsBigInt:true 仅保留整数，不提供任意精度浮点，重解析输出的 BigInt 仍需此选项。Object
      键会转成字符串：数字 1 与字符串 "1" 可能碰撞，复杂键产生警告，null 变成空键。mapAsMap:true 保留已检查的数字/字符串区别，但使用 JavaScript Map 身份，不保证任意 YAML
      键等价。默认 uniqueKeys 拒绝已检查的重复标量键，但标量 === 比较也遗漏重复 NaN，且不深比较别名或集合键：相等序列可保持为不同 Map 键，而别名可在没有 DUPLICATE_KEY 的情况下合并。uniqueKeys:false
      下所查重复键以后值为准。parseDocument 可保留错误而 toJS 仍返回部分值，而 Document.toString 拒绝该带错误文档；所查重复输入在 parse 的 logLevel:'silent'
      下也返回后值。调用者须检查错误和警告，包括流中的各个文档。别名可共享引用或形成循环，不只是 JSON 树；小型别名限额检查不证明资源安全。Core 默认 resolveKnownTags:true 也解析显式
      YAML 1.1 标签，包括 timestamp→Date、binary→Buffer；禁用已知标签或遇到未知标签时可仅警告并返回字符串，而非拒绝。应用自定义标签回调与可选 merge 键属于扩展，不是核心互通保证。Document
      保留了所选注释但改变词法形式；parse/stringify 丢失注释与样式，尾随注释归属也不完全稳定。所查原生 Date 经默认 stringify/parse 变成字符串；数据往返不是原生值的普遍保留、通用无损、跨语言、规范化或签名归一化输出。发布的
      npm CommonJS 字节通过 47 项有限诊断（1 项版本、46 项行为记录）及单独 3 项键补充；不宣称完整上游套件、源码构建、浏览器一致性、全部 API、模糊、安全或供应链认证。
    description_en: 'The npm yaml package from eemeli/yaml, fixed to 2.9.1, parses and emits YAML text using JavaScript
      values. Its YAML 1.2 support is related to specification revision 1.2.2, which defines the same 1.2 language
      without normative changes; this is a bounded implementation link, not full conformance. The version:''1.2''
      default does not force every document to 1.2: explicit or inherited YAML 1.1 stream contexts are outside
      this link. Default Core leaves yes/no/on/off as strings, interprets 012 as decimal 12, and accepts nonfinite
      numbers; it is not automatic JSON compatibility. schema:''json'' selects YAML''s JSON-compatible schema,
      not JSON Schema/Draft validation. Default JavaScript Number can lose integer precision; intAsBigInt:true
      preserves integers, not arbitrary-precision floats, and reparsing emitted BigInt needs the option again.
      Object keys stringify: numeric 1 and string "1" can collide, complex keys warn, and null becomes an empty
      key. mapAsMap:true retains the checked numeric/string distinction but uses JavaScript Map identity, not
      universal YAML key equivalence. Default uniqueKeys rejects the checked repeated scalar key, but scalar ===
      comparison also misses repeated NaN and does not deep-compare alias or collection keys: equal sequence keys
      can remain distinct Map keys, while aliases can collapse without DUPLICATE_KEY. With uniqueKeys:false the
      checked duplicate is last-wins. parseDocument can retain errors while toJS returns partial values and Document.toString
      refuses that error-bearing document; on the checked duplicate input, parse with logLevel:''silent'' also
      returned last-wins data. Callers must inspect errors and warnings, including individual stream documents.
      Aliases can share references or create cycles, not just JSON trees; small alias-limit checks do not establish
      resource safety. Core''s default resolveKnownTags:true also resolves explicit YAML 1.1 tags, including timestamp
      to Date and binary to Buffer; disabling known tags or encountering an unknown tag can warn and return a
      string rather than reject. Application custom-tag callbacks and optional merge keys are extensions, not
      core interoperability guarantees. Document preserved selected comments but changed lexical form; parse/stringify
      lost comments and style, and trailing-comment association is not fully stable. The checked native Date became
      a string after default stringify/parse; data roundtrip is not universal native-value preservation, lossless
      cross-language, canonical or signature-normalized output. Published npm CommonJS bytes were exercised in
      47 finite diagnostics (one version and 46 behavior records) plus a separate three-record key supplement;
      no upstream full suite, source build, browser parity, all-API, fuzz, security or supply-chain certification
      is claimed.'
    version: 2.9.1
