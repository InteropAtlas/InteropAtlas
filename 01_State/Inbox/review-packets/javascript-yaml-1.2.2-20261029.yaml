      与 registry 元数据一致，README/LICENSE/package.json 与选定源码字节一致；不证明源码构建等价或签名/证明验证。运行使用 Node v24.22.1/Linux x64 的发布
      CommonJS 分发，未执行 npm install、生命周期脚本、构建或运行时网络；包元数据确有构建/生命周期命令，只是未执行。诊断为自写有限样例，不是上游套件。初始 45 项中 44 项通过，失败源于作者误以为后续文档会重置继承的
      YAML 1.1；依据固定 directives 源码纠正预期，保留原失败报告并补充显式 1.2/混合流样例。最终 47 项与单独 3 项键补充由本作者另行重放，类型化预期/实际记录一致；这是作者核验，不是独立语义复核。仅建议
      data_serialization：已查映射、序列、标量及文本输出支持结构化数据表示、存储、交换和重解析。所查默认普通时间戳保留为字符串；Core 显式已知标签兼容包括 YAML 1.1 类型，1.2 默认禁用
      merge。%YAML 1.2.2 不是语言指令（所查为 BAD_DIRECTIVE）；语言指令为 %YAML 1.2。不建立其他运行时、CLI、浏览器、任意输入、上游套件/gitlink 测试、性能、跨实现互通、清理器、安全性、IA
      采用或许可/治理结论。 另行 4 项作者补充确认 NaN 键在 Map 中合并、带错误 Document.toString 拒绝输出、intAsBigInt 不避免浮点精度损失及原生 Date 往返变为字符串；不改写历史
      47 项或 3 项计数。
    scope_notes_en: 'Identity is npm:yaml / github:eemeli/yaml, not js-yaml, PyYAML, ruamel.yaml, or the YAML
      standard. Release v2.9.1 was published 2026-09-11; lightweight tag and npm gitHead identify 1440ecd3d1bff41e4ac399f8f6839e810328bd16.
      Its actual tree a17f0d114d69218d5059ca4bfcb20923b349b2cc has 181 entries: 155 blobs, 22 trees and four gitlinks.
      Only 25 selected fixed-source files were retained/blob-verified, not a complete source or submodule archive.
      The published npm artifact contains 233 regular files; SHA1/SHA512 match registry metadata and README/LICENSE/package.json
      match selected source bytes. This is not a source-build equivalence or signature/attestation proof. Runtime
      used the published CommonJS distribution under Node v24.22.1/Linux x64 without npm install, lifecycle scripts,
      build or runtime network; package metadata does contain build/lifecycle commands, which were not executed.
      Finite diagnostics are self-authored, not the upstream test suite. The initial 45-record run had 44 passes
      because its author incorrectly expected a following document to reset inherited YAML 1.1: that expectation
      was corrected using fixed directives source, with the failed historical report retained and explicit 1.2/mixed-stream
      cases added. The final 47-record report and separate three-key supplement were independently replayed by
      this author with equal typed expected/observed records; this is author verification, not independent semantic
      review. Only data_serialization is proposed: checked mappings, sequences, scalars and selected text emission
      support representing/storing/exchanging/reparsing structured data. Plain timestamps remain strings in the
      checked default; Core''s explicit known-tag compatibility includes YAML 1.1 types, and merge is disabled
      by default in 1.2. %YAML 1.2.2 is not a language directive (checked BAD_DIRECTIVE); %YAML 1.2 is the language
      directive. Other runtime engines, CLI, browser, arbitrary inputs, upstream suite/gitlink tests, performance,
      cross-implementation interoperability, sanitizer status, security, IA adoption, and licensing/governance
      conclusions are not established. Four additional author probes separately confirmed NaN-key Map collapse,
      error-bearing Document.toString refusal, float precision loss despite intAsBigInt, and native Date-to-string
      roundtrip; these are not added to the historical 47 or three-record counts.'
