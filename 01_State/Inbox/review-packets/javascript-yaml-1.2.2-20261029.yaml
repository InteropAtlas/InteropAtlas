    scope_notes_zh: 身份为 npm:yaml / github:eemeli/yaml，不是 js-yaml、PyYAML、ruamel.yaml 或 YAML 规范。v2.9.1 发布于 2026-09-11；轻量
      tag 与 npm gitHead 均指向 1440ecd3d1bff41e4ac399f8f6839e810328bd16。实际树 a17f0d114d69218d5059ca4bfcb20923b349b2cc
