      title: IPTC Video Metadata Hub work identity and official edition links
      language: en
      accessed: '2026-10-24'
    - url: https://iptc.org/std/videometadatahub/recommendation/IPTC-VideoMetadataHub-props-Rec_1.7.html
      title: 'Recommendation1.7 Properties: approval/revision2025-10-16, property definitions and unresolved optional/mandatory
        conflict'
      language: en
      accessed: '2026-10-24'
    - url: https://iptc.org/news/video-metadata-hub-v1-7-released/
      title: 'Announcement2025-11-10: distinct from approval; AI-prompt metadata is not reproducibility proof'
      language: en
      accessed: '2026-10-24'
    - url: https://iptc.org/std/videometadatahub/recommendation/IPTC-VideoMetadataHub-mapping-Rec_1.7.html
      title: 'Recommendation1.7 mapping table: observed header/cell alignment anomaly, not verified mappings'
      language: en
      accessed: '2026-10-24'
