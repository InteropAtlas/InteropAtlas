- evidence_id: hls
  url: https://www.rfc-editor.org/info/rfc8216/
  accessed: '2026-09-13'
  observed_via: author_web_retrieval
  locator: Header, Abstract, Status of This Memo
  excerpt: not an Internet Standards Track specification
  version_excerpt: version 7
  observed_fields: {rfc: '8216', title: HTTP Live Streaming, status: Informational, stream: Independent Submission}
  observation_zh: 摘要描述多媒体流传输、文件格式及收发端动作。旧候选所称IETF标准是错误断言；这是独立投稿的信息类RFC，描述协议版本7，不代表所有后续HLS扩展。
- evidence_id: srtp
  url: https://www.rfc-editor.org/info/rfc3711/
  accessed: '2026-09-13'
  observed_via: author_web_retrieval
  locator: Header, current status and Abstract
  excerpt: confidentiality, message authentication, and replay protection
  observed_fields: {rfc: '3711', status: Proposed Standard, title: The Secure Real-time Transport Protocol (SRTP)}
  observation_zh: 摘要将SRTP定义为RTP的profile，面向RTP与RTCP流量提供所列安全机制；页面列出后续更新，不据此保证具体部署安全。
- evidence_id: imsc
  url: https://www.w3.org/TR/2020/REC-ttml-imsc1.2-20200804/
  accessed: '2026-09-13'
  observed_via: author_web_retrieval
  locator: Heading and Abstract
  excerpt: a text-only profile and an image-only profile
  observed_fields: {version: '1.2', status: W3C Recommendation, publication_date: '2020-08-04', basis: TTML2}
  observation_zh: 原候选locator的This version链接直接指向本固定文本。摘要定义面向字幕交付的两种TTML2 profile；不证明任意渲染器、格式转换均无损兼容。
- evidence_id: ttml2
  url: https://www.w3.org/TR/2018/REC-ttml2-20181108/
  accessed: '2026-09-13'
  observed_via: author_web_retrieval
  locator: Heading, Abstract and Status of This Document
  excerpt: interchange among authoring systems
  observed_fields: {title: Timed Text Markup Language 2 (TTML2), status: W3C Recommendation, publication_date: '2018-11-08'}
  observation_zh: 原候选/TR/ttml2/入口的This version指向本推荐文本；摘要规定第2版的词汇和语义，支持带时间信息文本的交换。本轮不沿用旧候选关于SMPTE-TT起源的未核实断言。
- evidence_id: flac_identity
  url: https://www.rfc-editor.org/info/rfc9639/
  accessed: '2026-09-13'
  observed_via: author_web_retrieval
  locator: Header and Abstract
  observed_fields: {rfc: '9639', status: Proposed Standard, title: Free Lossless Audio Codec (FLAC)}
  observation_zh: 页面定义FLAC格式及其可流式处理子集，RFC号对应该具体规范文档。旧候选另列xiph:flac及项目入口，尚未声明工作级标识与文档标识的不同角色。
- evidence_id: matroska_identity
  url: https://datatracker.ietf.org/doc/rfc9559/
  accessed: '2026-09-13'
  observed_via: author_web_retrieval
  locator: Document metadata and Abstract
  observed_fields: {rfc: '9559', status: Proposed Standard, title: Matroska Media Container Format Specification}
  observation_zh: 实际读取的是IETF Datatracker，不把此前RFC Editor info页的访问错误写成成功。RFC9559定义容器结构；旧候选同时列matroska:matroska工作级别名，身份范围需明确后再接纳。
