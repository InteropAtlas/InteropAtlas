      conditions_zh: 固定官方 C 参考实现的核心 CommonMark 解析、AST 结构与 HTML 片段/部分 CommonMark 重渲染。自定义静态构建在 --unsafe 下逐字节通过公开的
        652 个规范示例，加 35 项有限诊断；不等于完整上游套件或任意输入符合性。HTML 默认省略原始 HTML 并过滤部分 URL；--safe 是空操作，不能撤销 --unsafe。此输出策略不是清理器；CommonMark/XML
        可保留原始节点。非法 UTF-8 默认可透传，显式验证替换而非拒绝；不保证源标记或字节无损。范围不含 GFM 扩展、GitHub 渲染服务、安全/供应链认证、第三方互通或 IA 采用。
      conditions_en: Core parsing, AST structure, HTML-fragment output and selected CommonMark re-rendering of the
        fixed official C reference implementation. A custom static build passed 652 published specification examples
        byte-for-byte with --unsafe plus 35 finite diagnostic checks, not the full upstream suite or all-input conformance.
        HTML defaults omit raw HTML and filter some URLs; legacy --safe is a no-op and cannot revoke --unsafe. This
        output policy is not sanitization; CommonMark/XML may retain raw nodes. Invalid UTF-8 can pass through by
        default, while explicit validation replaces rather than rejects it; markup/byte preservation is not promised.
        Excludes GFM extensions, GitHub rendering service, security/supply-chain certification, third-party interoperability
        and IA adoption.
