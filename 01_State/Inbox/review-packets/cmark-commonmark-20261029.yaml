    scope_notes_zh: 主体是 commonmark/cmark，不与 commonmark.js、cmark-gfm、语言封装、GitHub 生产渲染器或 CommonMark 规范本身合并。0.31.2
      发布于 2026-02-14，轻量 tag 固定到 eec0eeba6d31189fd828314576494566d539b1e3。固定 test/spec.txt 标明 2024-01-28 的规范 0.31.2，去除元数据后的正文与公开版本逐字节一致。仅建议
      document_representation：标题、强调、列表、链接、代码和 XML AST 观察支持结构化文档内容、层次及可导航元素。35 项诊断由 1 项版本核对和 34 项行为检查组成；652 个示例使用自写逐字节比较脚本，不是上游测试运行器。UTF-8
      诊断保留输入、预期、实际输出十六进制；NUL 和换行符可能被规范化。URL 过滤允许部分图片 data URL，不宣称拒绝所有 data URL。HTML 默认策略不删除 CommonMark/XML 表示中的原始节点；所选
      CommonMark 往返保留渲染后的 HTML，而非源字节。因缺少 CMake，本地编译采用不改动的固定源码、由 CMake 清单导出的 C 文件列表及本地生成的版本/导出头，不是上游 CMake 构建。未覆盖动态库
      ABI、AST 修改 API、groff/LaTeX、模糊/病理/资源测试、浏览器执行、第三方互通、性能、安全性或 IA 采用。COPYING 区分源码组件、文档及测试通知；不填写 license_expression
      和 open_source，避免将不同范围简化为法律判断。
    scope_notes_en: 'The subject is commonmark/cmark, not commonmark.js, cmark-gfm, a language wrapper, GitHub production
      rendering, or the CommonMark standard itself. Release 0.31.2 was published on 2026-02-14; its lightweight
      tag points to eec0eeba6d31189fd828314576494566d539b1e3. The fixed test/spec.txt identifies spec 0.31.2 dated
      2024-01-28, and its body after metadata is byte-identical to the published versioned specification. Only document_representation
      is proposed: headings, emphasis, lists, links, code and XML AST observations support structured document content/hierarchy/navigation.
      The 35 diagnostic checks comprise one version check and 34 behavior checks; the corpus uses a self-authored
      exact-byte harness, not the upstream test runner. UTF-8 diagnostics retain input/expected/observed hex. NUL
      and line endings can be normalized. The URL filter allows selected image data URLs; no blanket prohibition
      is claimed. Default HTML policy does not remove raw nodes from CommonMark/XML representations. The selected
      CommonMark roundtrip preserved resulting HTML, not source bytes. The build uses unchanged fixed source and
      its CMake-derived C file list with locally generated version/export headers because CMake was unavailable;
      it is not an upstream CMake build. No dynamic-library ABI or AST-mutation API exercise, groff/LaTeX output,
      fuzz/pathological/resource testing, browser execution, third-party interoperability, performance, security
      or IA adoption is claimed. COPYING includes separate source-component and documentation/test notices; license_expression
      and open_source are deliberately omitted rather than reducing those scopes to a legal conclusion.'
