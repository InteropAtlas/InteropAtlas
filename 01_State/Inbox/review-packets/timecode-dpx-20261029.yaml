  proposed_record:
    id: smpte_st12_1
    type: artifact
    kind: standard
    name_zh: SMPTE ST 12-1 时间与控制码
    name_en: SMPTE ST 12-1 — Time and Control Code
    version: '2014'
    external_identifiers:
    - namespace: smpte
      value: st.12-1
    official_url: https://pub.smpte.org/pub/st12-1/st0012-1-2014.pdf
    description_zh: 规定电视及伴随音频系统时间与控制码的标准；本次审阅固定 ST 12-1:2014 的时间地址、二进制组、标志位与 LTC/VITC 传输范围。
    description_en: A television and accompanying-audio time-and-control-code standard; this review fixes ST 12-1:2014
      and its time-address, binary-group, flag and LTC/VITC transport scope.
    scope_notes_zh: 保留既有 smpte_st12_1 / smpte:st.12-1 工作级标准身份，审阅上下文固定为 2014-02-20 批准的 ST 12-1:2014，不新建版次主体或声称最新版。§1
      定义电视及伴随音频系统的时间地址、二进制组和标志位，以及 LTC 与 VITC 的主要传输结构。VITC 调制和位置的规定仅覆盖 525/59.94 与 625/50 模拟复合或分量系统；这不把 ST 12-2
      的 ATC 封装、D-VITC 或所有数字视频传输并入本主体。此处仅核实标准身份和上述范围，并非逐项审计所有帧率、计数模式、标志位或电气要求。DPX 的另列 uses 关系仅涉及固定 2014 版电视信息头中的非核心时间码/用户位元数据，不等于
      LTC/VITC 信号传输。未运行时间码生成器、解析器或媒体工具；不证明 UTC 同步精度、设备认证、实现符合性、部署、跨系统互通或 IA 采用。
    scope_notes_en: Preserves the existing work-level identity smpte_st12_1 / smpte:st.12-1, reviewed at ST 12-1:2014
      approved 2014-02-20, without a new edition subject or latest-version claim. Section 1 defines time addresses,
      binary groups and flags for television and accompanying audio, plus primary LTC and VITC transport structures.
      VITC modulation/location provisions cover only 525/59.94 and 625/50 analog composite or component systems;
      ST 12-2 ATC carriage, D-VITC and every digital-video transport are not folded into this subject. This is a
      bounded identity/scope review, not an exhaustive audit of frame rates, counting modes, flags or electrical
      requirements. The separate DPX uses relation concerns non-core time-code/user-bit metadata in the fixed 2014
      television header, not LTC/VITC signal transport. No generator, parser or media tool was executed. UTC synchronization
      accuracy, device certification, implementation conformance, deployment, cross-system interoperability and
      IA adoption are not established.
    sources:
    - url: https://pub.smpte.org/pub/st12-1/st0012-1-2014.pdf#page=1
      title: ST 12-1:2014 cover — identity and approval 2014-02-20
      language: en
      accessed: '2026-10-29'
    - url: https://pub.smpte.org/pub/st12-1/st0012-1-2014.pdf#page=6
      title: ST 12-1:2014 §1 — scope and analog VITC limits
      language: en
      accessed: '2026-10-29'
    - url: https://pub.smpte.org/pub/st12-1/st0012-1-2014.pdf#page=7
      title: ST 12-1:2014 §4.1–4.2 — time/control code and LTC definitions
      language: en
      accessed: '2026-10-29'
    - url: https://pub.smpte.org/pub/st12-1/st0012-1-2014.pdf#page=8
      title: ST 12-1:2014 §4.3–4.4 — VITC and separate ATC carriage
      language: en
      accessed: '2026-10-29'
    versions:
    - version: '2014'
      date: '2014-02-20'
      status: standard
      url: https://pub.smpte.org/pub/st12-1/st0012-1-2014.pdf
