        K 加权、左右单位权重、完整 400 ms 块/100 ms 步长、严格大于 -70 的绝对门和绝对门后能量均值低 10 的相对门；只比对公式与实现路径，不给数值容差、比特精确或阈值边缘保证。最后不完整子块被丢弃；少于
        19,200 帧、静音或无合格块可返回负无穷，finish 前缓存也为负无穷，完整块不保证有限结果。错误批次非原子，有效前缀可先改变状态，frame_count 却仅整批成功后增加；不保证回滚、安全重试或错误后继续。系数推导和
        log/pow 往返未实测，门限/短期历史随时长增长。排除其他采样率、布局和输入重载、真峰值/Annex 2 及其余附录、LRA/瞬时/短期精度、EBU R128 V5 符合性或目标、完整 Recommendation
        符合性、认证、安全、第三方互通和 IA 采用。未编译或运行 Rust 库、音频、示例或上游测试；测试定义及独立标量算术不是库运行结果。
      conditions_en: 'Static correspondence only to BS.1770-5 (11/2023) Annex 1: LoudnessMeter::new(48000, ChannelLayout::Stereo),
        equal-length planar left/right f32 PCM with every sample finite and caller-scaled to nominal full scale
        within [-1,1], all push_stereo_planar_f32 calls successful, then finish(), then integrated_lufs(). The library
        does not enforce that amplitude range or normalize audio. Covers two-stage K weighting, unit stereo weights,
        complete 400 ms blocks at 100 ms steps, a strict above -70 absolute gate and a relative gate 10 below the
        energy mean after absolute gating. Formula/source-path comparison provides no numerical tolerance, bit-exact
        or threshold-edge guarantee. Incomplete final sub-blocks are discarded; fewer than 19,200 frames, silence
        or no eligible blocks can produce negative infinity, as does the initialized cache before finish; complete
        blocks alone do not guarantee a finite answer. Failed batches are non-atomic: a valid prefix can change
        state while frame_count advances only after whole-batch success; no rollback, safe retry or continuation
        guarantee. Derived coefficients and log/pow round trips were not runtime-tested; gating/short-term histories
        grow with duration. Excludes other rates/layouts/input overloads, true peak/Annex 2 and remaining annexes,
        LRA/momentary/short-term accuracy, EBU R128 V5 targets/conformance, complete Recommendation conformance,
        certification, security, third-party interoperability and IA adoption. No Rust-library, audio, example or
        upstream-test compilation/execution occurred; test definitions and independent scalar arithmetic are not
        library runtime results.'
