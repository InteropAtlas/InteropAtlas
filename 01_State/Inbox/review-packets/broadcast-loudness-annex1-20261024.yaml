semantic_correspondence:
- normative: Annex 1 Figure 3, Tables 1–2
  source: filter.rs 74–86/112–152 and per-channel filter composition
  boundary: Derived coefficients; no Rust libm run or numerical/output tolerance claim.
- normative: Annex 1 Table 3 and equations 1–2/4–5
  source: Stereo unit weights and filtered weighted squared energy; mean_of_lkfs averages via energy
  boundary: Caller-normalized finite planar f32 only; log/pow rounding not bounded.
- normative: Annex 1 equation 3 and incomplete-block exclusion
  source: At 48 kHz, complete 4800-frame sub-blocks form 19200-frame windows every 4800 frames; finish discards partial
    tail
  boundary: No other sample-rate or duration-independent memory claim.
- normative: Annex 1 equations 6–7
  source: Strict absolute and relative selection after successful pushes then finish
  boundary: Negative-infinity sentinel for no eligible blocks is library behavior, not normative empty-set numeric
    definition.
required_counterexamples:
- 'EXTENT: whole library has other metrics; only scoped integrated result is recorded.'
- 'NON-ATOMIC: valid prefix may alter state before NaN/Inf error; frame_count increments only at successful batch
  end. No rollback/retry/continuation promise.'
- 'NOT LIVE: integrated cache starts negative infinity; finish is required. Less than 19200 frames, silence or no
  eligible blocks can stay negative infinity.'
- 'FINAL TAIL: incomplete last sub-block is discarded for integrated calculation; not generalized to other metrics.'
- RATE: 48002 Hz source uses 19200 rather than nearest-sample 19201 frames; excluded by the 48 kHz scope.
- 'MEMORY: gating/short-term histories grow; no constant-duration-memory assertion.'
- 'NUMERIC: independent scalar arithmetic was not target execution, gate-edge/tolerance/bit-exactness not asserted.'
