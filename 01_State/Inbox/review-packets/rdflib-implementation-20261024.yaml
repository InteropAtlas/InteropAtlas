      title: API / Query Contract：Agent 与 Workspace 共用语义查询层
      issue_number: 221
      body: 'Status: Blocked

        为什么现在做不了：需要 selection/projection 语义和 production Canonical schema 定型。否则查询契约没有共同底座。

        Task Authority: T2

        Review Class: high-impact


        Objective: 定义 backend-agnostic query contract，让 Human Workspace renderer 与 Agent structured access 使用相同
        identity/relation/evidence/selection semantics。API 技术形式后定。


        Must support: get by stable ID/external ID resolution；search；typed relations/participants；evidence/assertions；version/lifecycle；selection/filter/scope；unknown/conflict；projection
        metadata/recoverability。


        Why still open: this shared semantic query layer is a definite architectural capability, but should be specified
        against validated production semantics rather than prematurely binding GraphQL/SPARQL/Cypher or frontend
        endpoints.


        Acceptance: same query semantics usable across Human and Agent surfaces；backend replaceable。'
