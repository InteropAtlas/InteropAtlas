    description_zh: 'Pion SDP 是 Pion 项目的整体 Go 会话描述文本解析与序列化库，模块为 github.com/pion/sdp/v3，不是 Pion WebRTC、Pion RTP 或虚构的独立解析组件。本记录固定官方
      v3.0.20 tag、源码 commit 8921edc83d51945017b2e1a987733a23bb9a9004，不声称最新版本或其他构建产物等价。静态证据切片为调用方已有 SDP 字符串/字节经 SessionDescription.UnmarshalString/Unmarshal
      读入结构，再由 Marshal 输出字节文本；每次解析使用新的零值 SessionDescription，调用方负责完整、合法且受支持的输入及非 nil 媒体指针。涵盖 session 的 v/o/s/i/u/e/p/c/b/t/r/z/k/a
      与 media 的 m/i/c/b/k/a 字段表示，不是所有扩展语义的支持声明。解析直接修改接收者，错误可留下部分状态，已有字段不全部重置；v=0 被检查但不会写入 Version 字段，不能把复用接收者视为全量替换。状态机会拒绝未知行类型及当前状态不允许的字段，但读取下一行类型时的
      EOF 可直接成功结束，不保证必需字段完整，也不是所有截断输入都成功。origin 缺地址类型时为相机兼容补 IP4/0.0.0.0，已指定 IP6 而缺地址时补 ::；媒体部分接受某些非规范字段次序。虽有部分类型、IN/IP4/IP6
      和基础端口 0..65535 检查，uint64 逐位累积不检查溢出，并非完整语法、语义或数值范围验证器。session/media 的 a= 不使用属性名白名单，通常按第一个非首位冒号拆为通用 key/value，保留未知属性名但不验证扩展语义；空值在序列化时省去冒号。Marshal
      从当前字段按固定顺序及 CRLF 输出，不另作完整合法性验证；LF、空行、字段次序和重复时间缩写可被规范化，不保证任意输入逐字节往返。README 只泛称 SDP；Unmarshal/Marshal 注释明确引用
      RFC4566 §5，前者另引 draft-ietf-rtcweb-jsep-24，不能升格为现有 RFC8866 对象的实现证据。本批只接纳软件库，不建技术关系，也不新增旧 RFC 来强造边，不修改 sdp_rfc8866。仅阅读固定源码和测试配方，未安装、导入、构建或运行上游及其测试/示例。没有网络协商、offer/answer、ICE/DTLS/RTP
      互通、媒体传输、完整 SDP/RFC 符合性、安全认证、性能或 IA 采用主张；未纳入的其他库路径不表示不存在。MIT 仅按固定 LICENSE 记录，不作法律适用性判断。


      English scope and limitations:


      Pion SDP is the whole Pion Go library for session-description text parsing and serialization, module github.com/pion/sdp/v3,
      not Pion WebRTC, Pion RTP or a fictional standalone parser component. This record pins official tag v3.0.20
      to source commit 8921edc83d51945017b2e1a987733a23bb9a9004; no latest-release or other-build equivalence is
      claimed. Static inspection covers caller-provided SDP strings/bytes through SessionDescription.UnmarshalString/Unmarshal
      into structured fields and Marshal back to text bytes. Each parse uses a fresh zero-valued SessionDescription;
      callers supply complete, valid supported inputs and non-nil media pointers. The represented fields are session
      v/o/s/i/u/e/p/c/b/t/r/z/k/a and media m/i/c/b/k/a, not a claim to interpret every extension. Parsing mutates
      the receiver directly, can leave partial state on error, and does not reset every existing field. It checks
      v=0 without assigning Version; receiver reuse is not a full-replacement operation. The state machine rejects
      unknown line types and fields disallowed in the current state, but EOF while reading the next line type can
      end successfully without proving mandatory-field completeness; this does not mean every truncated input succeeds.
      For camera compatibility, missing origin address type defaults to IP4/0.0.0.0; an explicit IP6 type with missing
      address defaults to ::. Some non-spec media-field orders are accepted. Partial type, IN/IP4/IP6 and base-port
      0..65535 checks exist, but digit-by-digit uint64 accumulation lacks overflow checks; this is not a complete
      syntax, semantic or numeric-range validator. Session/media a= attributes have no known-name whitelist and
      normally split at the first non-leading colon into generic key/value, retaining unknown names without validating
      extension semantics. Empty values lose their colon when serialized. Marshal emits current fields in fixed
      order with CRLF without complete validity checking; LF, blank lines, field order and repeat-time shorthand
      can be normalized, so arbitrary byte-for-byte round trips are not guaranteed. The README only says SDP; Unmarshal/Marshal
      comments explicitly cite RFC4566 section 5 and the former also cites draft-ietf-rtcweb-jsep-24. This cannot
      establish an implementation of the existing RFC8866 object. This batch accepts only the library, adds no technical
      relation or old RFC endpoint to force one, and leaves sdp_rfc8866 unchanged. Fixed source and test recipes
      were read only; no upstream installation, import, build, execution, tests or examples were performed. No network
      negotiation, offer/answer, ICE/DTLS/RTP interoperability, media transport, complete SDP/RFC conformance, security
      certification, performance or IA adoption is claimed. Unexamined library paths are not asserted absent. MIT
      is recorded only from the fixed LICENSE, not as legal suitability advice.'
