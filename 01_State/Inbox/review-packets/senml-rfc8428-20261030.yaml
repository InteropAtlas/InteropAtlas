    name_zh: 传感器测量列表原始规范（SenML，RFC 8428）
    name_en: Sensor Measurement Lists Original Specification (SenML, RFC 8428)
    official_name: Sensor Measurement Lists (SenML)
    description_zh: 'RFC 8428 原版定义简单传感器测量与设备参数的数据表示：记录包可携带名称、单位、时间和值，共享数据模型有 JSON、CBOR、XML、EXI 表达，但不要求每个实现支持全部表达。它不是传输协议或完整设备信息模型；数据保护依赖外层机制。原版
      CBOR 规范引用为 RFC 7049，不替换为 RFC 8949。固定 2018 年 8 月原始出版物；RFC 9100 后续更新版本机制与特性，未合并到本记录；信息页显示一项勘误；内容与处理状态未核验，不声称当前完整修订语义。
      RFC 9100 将版本号解释为特性位图，而非简单线性版本顺序。仅作文献级收录，不证明实现符合性或 IA 采用；industrial 与 measurement 为可重叠编辑导航，无技术关系。


      English scope and limitations:


      The August 2018 original RFC 8428 specifies simple sensor measurement and device-parameter representations.
      Packs contain records that can carry names, units, times and values. JSON, CBOR, XML and EXI share a data
      model; supporting every representation is not mandatory. This is not a transport protocol or complete device
      model; protection relies on outer mechanisms. The original CBOR reference is RFC 7049, not RFC 8949. Proposed
      Standard, later updated by RFC 9100: its feature-bitmap version mechanism is not consolidated here. The information
      page indicates one erratum; its contents and status are unreviewed. No current consolidated semantics, implementation
      conformance or IA adoption is claimed. Industrial and measurement memberships are overlapping editorial navigation
      only; no technical relations.'
    description_en: 'The August 2018 original RFC 8428 specifies simple sensor measurement and device-parameter
