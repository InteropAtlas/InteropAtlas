      language: en
      accessed: '2026-10-24'
    - url: https://pub.smpte.org/doc/st2084/20140816-pub/st2084-2014.pdf#page=7
      title: 'Section4.3: absolute-luminance calibration; no numerical implementation claim'
      language: en
      accessed: '2026-10-24'
    - url: https://pub.smpte.org/doc/st2084/20140816-pub/st2084-2014.pdf#page=8
      title: 'Sections 5.1–5.3: derived inverse; coefficient-label contrast with page 6, not an erratum'
      language: en
      accessed: '2026-10-24'
    - url: https://journal.smpte.org/periodicals/SMPTE%20Motion%20Imaging%20Journal/130/8/32/
      title: 'Public abstract only: PQ alias for ST 2084:2014; protected article not accessed'
      language: en
      accessed: '2026-10-24'
