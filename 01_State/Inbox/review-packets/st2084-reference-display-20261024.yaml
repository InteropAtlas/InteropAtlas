    name_zh: SMPTE ST 2084 高动态范围母版制作参考显示器电光传递函数（PQ）
    name_en: SMPTE ST 2084 — High Dynamic Range Electro-Optical Transfer Function of Mastering Reference Displays
      (PQ)
    description_zh: 规定高动态范围参考显示器 EOTF 及其推导逆函数的标准；固定 ST 2084:2014（2017 再确认），保留来源系数标签不一致，不构成完整 HDR 系统或实现符合性声明。
    description_en: A standard specifying a high-dynamic-range reference-display EOTF and its derived inverse; fixed
      to ST 2084:2014 (reaffirmed 2017), retaining a source coefficient-label inconsistency rather than claiming
      a complete HDR system or implementation conformance.
    version: '2014'
    external_identifiers:
    - namespace: smpte
      value: st.2084
    official_url: https://pub.smpte.org/doc/st2084/20140816-pub/
    versions:
    - version: '2014'
      status: standard
      url: https://pub.smpte.org/doc/st2084/20140816-pub/st2084-2014.pdf
    scope_notes_zh: 保留既有工作级主体 smpte:st.2084，评估固定 ST 2084:2014，封面批准日为 2014-08-16，标注 2017 再确认；再确认及 PDF 后续生成元数据都不构成另一个标准版次。官方版本页本次观察列出
      2014-08-16 publication，并标为 stabilized；这是出版者目录状态，不是 IA 稳定性晋级。§1 规定主要用于非广播内容母版制作的高动态范围参考显示器电光传递函数（EOTF），以及从该
      EOTF 推导的逆函数。§§4.1–4.3 涉及非线性颜色值的线性化与绝对亮度标定，§§5.1–5.3 涉及光输出值的归一化与非线性编码；不把逆 EOTF 当作相机 OETF，也不据此声称完整 HDR 系统、codec
      或色调映射器。按 §2，Introduction、明确标为 informative 的部分及 Note 段落不作规范要求；附录 A–C 和 Bibliography 为资料性内容。SMPTE 公开期刊摘要仅用于支持
      PQ（perceptual quantizer）别称，未访问受保护的全文。原始 PDF 第 6 页末项系数定义标作 c2，而第 8 页对应项标作 c3；这是肉眼可见的表观标签不一致，不仅是文字抽取问题。保留原始字节与不确定性，不抄录或修正公式、不推断出版者勘误、不作数值计算、实现正确性或完整符合性判断。固定与
      latest 入口的已捕获 PDF 字节一致，15 页，仅发现链接批注。未核实原候选 HDR10、Dolby Vision、HDR10+ 采用断言，故不把它们带入 Canonical 事实。BT.2100 与 ARIB
      HLG 保持独立主体；相似数学形式不作为对某一固定标准的具名规范依赖，本批不增加任何技术关系。仅文献检视；无显示设备、软件、编码/解码、互通或安全测试，不声称 HLG、认证或 IA 采用。
    scope_notes_en: 'Preserves the existing work identity smpte:st.2084, reviewed at ST 2084:2014, approved 2014-08-16
      and reaffirmed in 2017. Reaffirmation and later PDF-generation metadata do not establish a different edition.
      The publisher version page observed here lists the 2014-08-16 publication and labels it stabilized; that catalog
      state is not an InteropAtlas stable-promotion decision. Section 1 specifies a high-dynamic-range reference-display
      EOTF, primarily for non-broadcast mastering, and its derived inverse. Sections 4.1–4.3 cover nonlinear color-value
      linearization and absolute-luminance calibration; sections 5.1–5.3 cover optical-output normalization and nonlinear
      encoding. The inverse is not treated as a camera OETF, nor as a complete HDR system, codec or tone mapper.
      Under section 2, the Introduction, explicitly informative material and Note paragraphs are not normative requirements;
      Annexes A–C and the Bibliography are informative. Only the public SMPTE journal abstract supports the PQ (perceptual
      quantizer) alias; the protected full article was not accessed. The final coefficient definition on PDF page 6
      is labeled c2 while the corresponding definition on page 8 is labeled c3. This apparent labeling inconsistency
      is visible on the original rendering, not merely text-extraction corruption. Original bytes and uncertainty
      are preserved: no formula is reproduced or repaired, no publisher erratum is inferred, and no numerical computation,
      implementation-correctness or full-conformance conclusion is made. The captured fixed and latest PDFs are
      byte-identical, 15 pages, with Link annotations only. The original candidate’s HDR10, Dolby Vision and HDR10+
      adoption assertions are unverified here and are not carried into Canonical facts. BT.2100 and ARIB HLG remain
      distinct; similar mathematics does not establish named normative reliance on a fixed standard, and this batch
      adds no technical relation. Document inspection only, without display-device/software/codec execution or interoperability/security
      tests; no HLG, certification or IA-adoption claim.'
    sources:
    - url: https://pub.smpte.org/doc/st2084/20140816-pub/st2084-2014.pdf#page=1
      title: 'ST 2084:2014 cover: approval 2014-08-16 and reaffirmation 2017, not a new edition'
