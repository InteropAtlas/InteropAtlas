    description_zh: W3C 固定 2014 推荐文档，定义 RDF 1.1 图、三元组、数据集和相关术语的抽象数据模型。
    description_en: The fixed 2014 W3C Recommendation defining the RDF 1.1 abstract data model of graphs, triples,
      datasets and associated terminology.
    version: '1.1'
    external_identifiers:
    - namespace: w3c
