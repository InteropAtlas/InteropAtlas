    context:
      version_context:
        source: JSON-LD 1.1, W3C Recommendation 2020-07-16
        target: RDF 1.1 Concepts and Abstract Syntax, W3C Recommendation 2014-02-25
      conditions_zh: 仅固定第 8/10 节与 RDF 1.1 的对应；JSON-LD 可表达图/数据集，但广义数据集和方向信息等扩展不都能直接解释为标准 RDF 1.1。作为 graph source
        使用时只取默认图并忽略命名图；规范转换算法另见独立 API 文档。不是无损往返、RDF 1.2 映射或库间兼容性证明。旧指向 RDF 1.2 的关系未由本次复核认可或改写。
      conditions_en: Limited to the RDF 1.1 correspondence in fixed sections 8/10. Generalized datasets and direction
        information prevent direct standard RDF 1.1 interpretation of every JSON-LD document. A graph-source consumer
        uses only the default graph; normative conversion algorithms are in the separate API specification. No lossless
        round-trip, RDF 1.2 mapping or library interoperability is established. The old RDF 1.2 edge is neither
        verified nor rewritten here.
    evidence:
