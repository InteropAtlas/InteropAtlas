      conditions_zh: 本记录固定 libcbor 0.12.0、官方 tag v0.12.0 与 commit ae000f44e8d2a69e1f72a738f7c0b6b4b7cc4fbf，仅静态核验
        cbor_stream_decode 对 RFC8949 §§3/3.1 的有限 token 解码：major type 0 无符号整数的内嵌值及 1/2/4/8 字节大端参数，以及 major type 2/3
        的 definite 字节串/文本，后者只限长度 0..255 且长度头为内嵌长度或一个参数字节，不含 2/4/8 字节长度参数分支。调用方须提供真实可读缓冲及正确 source_size、有效回调函数指针，并在回调使用期间保持输入有效；可复制
        cbor_empty_callbacks 的有效 no-op 函数后替换所需回调，不能把空指针视为 no-op。文本正面映射以调用方先保证 payload 为有效 UTF-8 为前提，低层函数本身不验证 UTF-8。每次调用从当前
        token 起点独立解析；FINISHED 只表示恰一次回调，不表示整个缓冲或完整 CBOR 文档已解码/验证。整数回调按 wire width 选择 uint8/16/32/64，内嵌值用 uint8；对应
        read 总长为 1/2/3/5/9，required=0。非首选整数编码也可接收，例如 0x18 0x00，并无最短表示或确定性编码验证。短 definite 字串头长 h 为1或2，payload 长 n，完整时回调借用
        source+h 指针和字节长度 n，read=h+n、required=0；不复制 payload、不转移所有权、不补 NUL，也不延长输入生命周期。零长可回调头后指针与长度0，不允许据此越界解引用。截断时
        NEDATA、read=0、无回调；required 是从原 token 起点算的所需总缓冲长度，不是额外字节数。无输入时 required=1；只有0x58/0x78头时 required=2，得到长度n但
        payload 不足时 required=2+n。库不保留流解析状态；调用方须保留不完整前缀，补齐后重新调用，并在成功后自行按 read 推进。固定 data.h 无输入时 read=1 的注释与源码/测试配方不符，实际为
        read=0、required=1；callbacks.h 部分 definite/indefinite 注释倒置，按实际 dispatch 限定。上游字符串测试有仅分配头却虚报 source_size 的配方，回调只比较指针和长度，不是有效
        payload、UTF-8 或内存安全证据；0x61 0xFF 配方也不是有效文本证据。截断 helper 虽循环 available，却始终 decode(data,1)，不能称全前缀测试覆盖。完整固定源码/测试配方仅阅读，未安装、导入、构建、运行上游或其测试，未向解码器提供输入。此边不是完整
        RFC 符合性或上游完整符合自述的认证；不核嵌套、映射/重复键、文档终止/尾随数据、负数、标签、浮点、不定长容器、编码器、高层 API、大长度/size_t 溢出路径、JSON转换、跨实现互通、安全/资源/性能或
