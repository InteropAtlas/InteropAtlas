  proposed_path: 01_State/01_Objects/scte35.yaml
  proposed_record:
    id: scte35
    type: artifact
    kind: standard
    name_zh: ANSI/SCTE 35 数字节目插播提示消息（2014 历史版）
    name_en: ANSI/SCTE 35 — Digital Program Insertion Cueing Message for Cable (2014 historical edition)
    version: '2014'
    external_identifiers:
    - namespace: scte
      value: scte-35
    official_url: https://webstore.ansi.org/standards/scte/ANSISCTE352014
    description_zh: 为 MPEG-2 传输流中的节目拼接与插播机会提供带内提示消息的标准；本记录仅核实 2014 历史版的身份与公开预览所示范围，不保证实际无缝拼接。
    description_en: A standard for in-stream cueing of program splicing and insertion opportunities in MPEG-2 transport
      streams; this record verifies only the 2014 historical identity and publicly previewed scope, not seamless-splicing
      outcomes.
    scope_notes_zh: 保留既有 scte35 / scte:scte-35 工作级身份，限定为 ANSI/SCTE 35 2014；RFC 8216 §11.1 的规范性参考文献明确标为 2014 年 8
      月，ANSI 版次目录标记 Historical，不声称最新版或现行推荐。标准对象的身份与范围证据仅为 ANSI 公开七页预览的封面及 §1（物理第 7 页、印刷第 6 页），不是完整标准；未取得、审阅或验证后续语法、命令、描述符、约束或符合性条款。该范围说明在
      MPEG-2 传输流内提示拼接、插播及相关事件，并假定传输流本身符合 MPEG-2；不保证无缝拼接，不规定拼接方法、被拼接流的额外约束或拼接设备约束。另列 HLS uses 关系只据完整 RFC 8216 的可选
      EXT-X-DATERANGE / SCTE35-CMD 表示：MAY 表示源媒体中的拼接信息，四种指定命令的完整 section SHOULD 作大端二进制十六进制属性值；保留 DateRange 的日期和标识要求，不把
      MAY/SHOULD 改成所有 HLS 播放列表的强制依赖。RFC 是 Informational Independent Submission，非 IETF Standards Track；本记录不扩充既有 HLS
      对象的版本、来源或核验日期。SCTE 发布方完整 2014 PDF 与当前 35-1 目录返回 HTTP 403，未重试或绕过；ANSI 合法公开预览不被冒充全文。后来 35-1/35-2 命名、等价及身份关系未经核实，本批不创建别名、合并、版次主体或额外规范关系。没有执行
      §8.10 示例、解析器、媒体流、广告系统或上游代码，不证明软件/设备支持、完整符合性、安全性、部署、端到端插播、互通或 IA 采用。
    scope_notes_en: 'Preserves the existing work-level scte35 / scte:scte-35 identity, bounded to ANSI/SCTE 35 2014.
      RFC 8216 section 11.1 explicitly dates its normative reference August 2014; the ANSI edition catalog marks
      it Historical, not latest or a current recommendation. Object identity/scope evidence is limited to the seven-page
      public ANSI preview, cover and section 1 (physical page 7, printed page 6), not the full standard. Later syntax,
      commands, descriptors, constraints and conformance clauses were neither obtained nor reviewed. The scope describes
      in-stream cueing of splicing, insertion and related events in MPEG-2 transport streams, assuming the streams
      already comply with MPEG-2; it does not guarantee seamless splicing or prescribe a splice method, additional
      constraints on spliced streams, or splicing-device constraints. The separate HLS uses relation relies on the
      complete RFC 8216 optional EXT-X-DATERANGE / SCTE35-CMD representation: source-media splice information MAY
      be mapped, and whole sections containing four named commands SHOULD be expressed as big-endian binary hexadecimal
      values. DateRange date/identifier requirements remain applicable; MAY/SHOULD is not a universal HLS dependency.
      RFC 8216 is an Informational Independent Submission, not IETF Standards Track; the existing HLS record, sources
      and verification dates are unchanged. Publisher full-2014-PDF and current35-1-catalog requests returned HTTP403
      and were not retried or bypassed; the public ANSI preview is not presented as full text. Later35-1/35-2 naming,
      equivalence and identity remain unverified: no aliases, merges, edition subjects or extra normative-reference
      edges are created. No section8.10 example, parser, stream, ad system or upstream code ran. Software/device
      support, complete conformance, security, deployment, end-to-end insertion, interoperability and IA adoption
      are not established.'
    sources:
    - url: https://webstore.ansi.org/standards/scte/ANSISCTE352014
      title: ANSI catalog — exact 2014 identity and Historical status
      language: en
      accessed: '2026-10-29'
    - url: https://webstore.ansi.org/preview-pages/SCTE/preview_ANSI%2BSCTE%2B35%2B2014.pdf#page=1
      title: Public ANSI/SCTE 35 2014 preview — edition cover
