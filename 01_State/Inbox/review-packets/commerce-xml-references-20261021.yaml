  proposed_record:
    id: xml_1.0_second_edition
    type: artifact
    kind: specification
    name_zh: XML 1.0（第二版）
    name_en: Extensible Markup Language (XML) 1.0 (Second Edition)
    description_zh: W3C 固定 2000 推荐文档，规定 XML 1.0 标记语法、良构约束及处理器要求。
    description_en: The fixed 2000 W3C Recommendation specifying XML 1.0 markup syntax, well-formedness constraints
      and processor requirements.
    version: 1.0 (Second Edition)
    external_identifiers:
    - namespace: w3c
      value: REC-xml-20001006
    official_url: https://www.w3.org/TR/2000/REC-xml-20001006
    versions:
    - version: 1.0 (Second Edition)
      status: recommendation
      date: '2000-10-06'
      url: https://www.w3.org/TR/2000/REC-xml-20001006
    domains:
    - data
    - structured_data
    capabilities:
    - data_serialization
    scope_notes_zh: 版次固定为 UBL 2.3 明确引用的 2000 第二版；文档说明该版汇入勘误而非新的 XML 版本，不代表现行 XML 全族。第 2.1/2.8/5.1 节区分良构、基于 DTD 的有效性和验证/非验证处理器；这些不是
      XSD 验证或业务符合性。第 4.3.3 节要求 XML 处理器支持 UTF-8 和 UTF-16，不意味着所有 XML 必须采用 UTF-8；未核任何处理库、外部实体加载策略或部署安全。
    scope_notes_en: Fixed to the 2000 second edition explicitly cited by UBL 2.3; it incorporates errata rather
      than defining a new XML version and does not represent the current XML family. Sections 2.1/2.8/5.1 distinguish
      well-formedness, DTD validity and validating/non-validating processors, not XSD validation or business conformance.
      Section 4.3.3 requires processor support for UTF-8 and UTF-16, not exclusive UTF-8 use. No library, external-entity
      loading policy or deployment security is assessed.
    sources:
    - url: https://www.w3.org/TR/2000/REC-xml-20001006
      title: Extensible Markup Language (XML) 1.0 (Second Edition) — fixed W3C Recommendation 2000-10-06
      language: en
      accessed: '2026-10-21'
    last_verified_at: '2026-10-21T06:29:37.653787+00:00'
    last_verified_by: Agent — OpenAI / dot，fixed XML/XSD reference evidence executor
