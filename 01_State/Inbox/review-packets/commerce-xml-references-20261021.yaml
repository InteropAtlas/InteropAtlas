    scope_notes_zh: 这是数据类型设施文档，不是第 1 部分结构验证的替身或软件；第二版汇入更正而非新版本。第 2/3/4 节区分值与词法表示、内置类型与类型派生/分面，既有 schema_validation
      归属限数据类型约束。不能据此推出某业务代码表的当前值集、任意语言数值无损映射或完整 UBL 符合性。
    scope_notes_en: This datatype-facility document is neither a substitute for Part 1 structural validation nor
