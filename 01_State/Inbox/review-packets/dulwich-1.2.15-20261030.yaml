      use SHA-1 only. Matching object hashes do not establish collision resistance, security, signatures or
      semantic validity.


      The researcher''s same 63 finite assertions passed on fixed source, official pure wheel and locally built
      pure wheel: not 189 unique tests. Fresh synthetic SHA-1 repositories covered untracked/staged/unstaged
      distinctions, three explicit add/modify/delete commits, index and retained old blobs, branch-reference
      creation/deletion, expected-old compare-and-swap failure with unchanged state and successful update,
      linear history and differences. Eight raw objects matched explicitly invoked /usr/local/bin/git 2.52.0
      cat-file/hash-object bytes and independently computed type-length-NUL framing hashes; that finite repository
      also had matching HEAD/history and successful strict fsck. Git is the explicitly listed independent oracle,
      not a claimed core Dulwich runtime dependency. These observations do not certify arbitrary repositories,
      packs/deltas or complete Git conformance.


      The author independently reacquired public Git and five fixed distribution/dependency artifacts, checked
      tree/package boundaries and built the sdist; the author replayed the same 63 checks in all three configurations
      and the narrower upstream subset below. An additional author-written 26-case low-level synthetic probe
      passed each of those three configurations, not 78 unique checks: two commits/six raw objects, reference
      add/update/delete CAS, history/tree differences, named invalid inputs and explicit Tree.check, with /usr/local/bin/git
      2.52.0 raw-byte/fsck readback. Independent preflight separately ran 24 source-direct checks using /usr/bin/git
      2.47.3. Its initial low-level environment lacked urllib3; successful selected imports do not mean a complete
      dependency-satisfying installation. The author separately replayed that attributed reviewer-owned script,
      without relabeling author execution independent review or treating 24+24 as new coverage. The 63/26/24
      sets overlap substantially.


      The execution envelope is essential, not a default safety promise: only fresh disposable synthetic repositories,
      isolated HOME/XDG/system/global/repository configuration and explicit identities/times. The finite porcelain
      probe clears the new Repo hook mapping and disables auto-GC and signing; those new repositories have
      no configured remotes or filters. An audit guard rejects networking and library-spawned subprocesses
      while allowing only the explicit Git oracle; no guard events is not general sandbox certification. Configuration,
      hooks, filters and auto-GC remain real external-effect surfaces. WorkTree.commit no_verify skips pre-commit/commit-msg,
      not post-commit, and still reaches auto-GC. ShellHook.execute attempts a subprocess even for a nonexistent
      hook, normally catching FileNotFoundError afterward; a generic never-spawns-processes statement would
      be false. Worktree/index/object/ref/reflog writes are normal effects, and this controlled envelope must
      not be generalized to arbitrary or user repositories.


      The upstream failure and selection boundary remain visible. The first broader objects/refs/repository
      selection, after excluding four explicit shell-hook cases, actually ran 402 tests: 341 success, two native-absence
      skips and 59 errors, therefore FAIL. All 59 errors were the researcher''s strict no-library-subprocess
      guard rejecting hook paths before process creation. No hook process started; these were not 59 upstream
      assertion failures and do not make the 402-test selection passing. Original runner/report/log are retained,
      no guard was weakened and no library source changed; the author did not repeat that known failing selection.
      A different, explicitly narrower selection—tests.test_objects plus ten non-disk-ref helper/in-memory
      classes—ran 184 tests: 182 success, two native-absence skips and zero failures/errors; author replay
      obtained the same outcome. It overlaps the earlier run, is not a repair of its 59 errors or 184 additional
      unique tests, and is not the full upstream suite, which was not run.


      Construction, storage, hashing and validation are separate. Tree.add accepts a slash-containing entry
      name until explicit Tree.check rejects it. A named check also confirms that Tree.check allows mode 100664
      (a fixed-source TODO), so even check() is not a universal strict C Git validator. Reference handling
      warns and accepts/normalizes certain legacy double-slash names; named ../ references are rejected, but
      finite rejection examples do not establish a generic sanitizer or security guarantee. CAS observations
      concern one single-process synthetic state, not concurrency, crash recovery, durability or all-filesystem
      atomicity. Network clients/servers, wire v2, arbitrary repositories, signatures, merge conflicts, GC,
      SHA-256, native extensions, broad platforms, performance, production fitness, security and IA adoption
      remain outside the tested scope.


      README/pyproject declare Apache-2.0 OR GPL-2.0-or-later. This is attributed project metadata only: this
      record does not newly reconcile COPYING''s introductory wording with SPDX/project metadata, choose a
      license for the user, guarantee whole-tree legal compliance or change IA licensing.'
