proposals:
- id: quic_tls_version
  source: {surface: candidate, id: quic_tls_rfc9001}
  proposed_relation: uses
  target: {surface: candidate, id: tls13_rfc8446}
  status: review_required
  evidence: ['https://www.rfc-editor.org/rfc/rfc9001.html#section-1']
  conditions_zh: 须保留 QUIC 对 TLS 集成方式的限制。PR422 独立审查暂缓此边；需补充 RFC9001 对 RFC8446 的特定文档规范性引用证据，不从 TLS 版本约束推导文档引用。
- id: mcp_jsonrpc
  source: {surface: candidate, id: mcp_2025_11_25}
  proposed_relation: uses
  target: {surface: candidate, id: json_rpc_2.0}
  status: review_required
  evidence: ['https://modelcontextprotocol.io/specification/2025-11-25/basic']
  conditions_zh: 固定 MCP 日期版本的消息层要求，不等同于其全部生命周期和授权要求。
- id: is05_is04
  source: {surface: candidate, id: amwa_nmos_is05}
  proposed_relation: recommended_with
  target: {surface: candidate, id: amwa_nmos_is04}
  status: review_required
  evidence: ['https://specs.amwa.tv/is-05/']
  conditions_zh: 按 IS-05 的 IS-04 互操作章节逐版审查；不是无条件兼容或必须共同部署的声明。
- id: opus_update
  source: {surface: candidate, id: opus_updates_rfc8251}
  proposed_relation: updates
  target: {surface: canonical, id: opus_rfc6716}
  status: review_required
  evidence: ['https://www.rfc-editor.org/info/rfc8251/']
  conditions_zh: updates 为 RFC 文档关系候选；现有正式关系词表没有该词，不擅自增加词表或替换成 supersedes。
