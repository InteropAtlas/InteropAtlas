notes_zh: [本分类是 IA 本轮收录视角，可重叠、可扩充，不是公认的世界知识分类或互斥目录。, 没有收录不等于现实中没有标准；这里的空缺只表示 IA 的发现/收录工作未覆盖。, 只存类别定义和对象引用；候选、验收和正式记录的状态由现有载体读取，不复制状态。, 类别成员关系只用于导航；技术关系 proposals 仍待独立审查，不进入正式关系索引。, 范围是本轮种子，不是全库所有对象的分类完成证明，也不提供没有分母的全球覆盖率。]
categories:
- {id: physical, name_zh: 物理接口与链路, name_en: Physical interfaces and links, priority: P1, rationale_zh: 补足数字系统的物理基础。}
- {id: measurement, name_zh: 测量、单位与时间, name_en: 'Measurement, units and time', priority: P1, rationale_zh: 避免跨设备、跨学科的数值失配。}
- {id: transport, name_zh: 网络与传输, name_en: Networking and transport, priority: P0, rationale_zh: 提高跨域复用并连接媒体与 Web。}
- {id: trust, name_zh: 安全、授权与凭证, name_en: 'Security, authorization and credentials', priority: P0, rationale_zh: 将技术连接与信任边界分别建模。}
- {id: syntax, name_zh: 数据表示与序列化, name_en: Data representation and serialization, priority: P0, rationale_zh: 连接文本、二进制与消息表示。}
- {id: semantics, name_zh: 知识表示、本体与查询, name_en: 'Knowledge representation, ontologies and query', priority: P0, rationale_zh: 让 IA 的对象关系可解释、可检索。}
- {id: services, name_zh: 服务接口与事件, name_en: Service interfaces and events, priority: P0, rationale_zh: 描述服务合同、失败语义和事件交换。}
- {id: agents, name_zh: Agent 与工具互操作, name_en: Agent and tool interoperability, priority: P0, rationale_zh: 区分工具连接、任务协作与身份权限。}
- {id: industrial, name_zh: 设备、工业与物联网, name_en: 'Devices, industry and IoT', priority: P1, rationale_zh: 建立物理设备到信息模型和服务的桥接入口。}
- {id: media_network, name_zh: 媒体网络与设备控制, name_en: Media networking and device control, priority: P0, rationale_zh: 落实已有影视候选而不是持续堆积。}
- {id: image_color, name_zh: 图像、色彩与编码, name_en: 'Image, color and coding', priority: P1, rationale_zh: 区分格式、色彩系统、组件和实现。}
- {id: editing, name_zh: 制作、编辑与交付, name_en: 'Production, editorial and delivery', priority: P1, rationale_zh: 围绕实际生产流程建立可组合能力。}
- {id: metadata, name_zh: 元数据、来源与复用, name_en: 'Metadata, provenance and reuse', priority: P1, rationale_zh: 追踪知识和数据能否被理解与复用。}
- {id: observability, name_zh: 可观测性与运行诊断, name_en: Observability and diagnostics, priority: P1, rationale_zh: 补充系统运行后的跨服务诊断关系。}
- {id: research, name_zh: 研究方法与可复现性, name_en: Research methods and reproducibility, priority: P1, rationale_zh: 方法有适用条件和证据边界，不能只收名称。}
- {id: design, name_zh: 设计方法与人因, name_en: Design methods and human factors, priority: P1, rationale_zh: 把人类问题理解纳入系统设计。}
- {id: collaboration, name_zh: 组织协作与改进, name_en: Organizational collaboration and improvement, priority: P1, rationale_zh: 扩展到社会层协调方法。}
- {id: geospatial, name_zh: 地理空间与环境数据, name_en: Geospatial and environmental data, priority: P1, rationale_zh: 用空间要素交换打开地理域。}
- {id: health, name_zh: 健康医疗数据交换, name_en: Healthcare data exchange, priority: P1, rationale_zh: 以明确版本和资源成熟度进入医疗域。}
- {id: commerce, name_zh: 商业单据与组织交换, name_en: Business documents and organizational exchange, priority: P1, rationale_zh: 补充跨组织结构化业务信息。}
