summary_zh: "REUSE Specification 3.3 定义了一种标准化方法，用于为软件项目声明逐文件版权和许可证信息，目标是使这些信息完整、无歧义，并同时适合人类和机器读取。InteropAtlas 在 Repository Structure Profile 中参考其根级 LICENSES/ 与机器可读许可信息组织方式。公开可访问的规范文本是事实；成熟度、治理开放性和供应商中立性等评价不由此自动推出。"
summary_en: "REUSE Specification 3.3 defines a standardized method for declaring per-file copyright and licensing information in software projects, with the goal of making that information comprehensive, unambiguous, and human- and machine-readable. InteropAtlas references its LICENSES/ layout and machine-readable licensing approach in the Repository Structure Profile. Public specification access is recorded as fact; maturity, governance openness, and vendor-neutrality assessments are not inferred automatically."
