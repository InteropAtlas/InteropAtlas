official_name: RDF 1.2 Turtle
kind: format
description_zh: >
  W3C RDF 1.2 的紧凑文本语法，用于完整表示 RDF 图。RDF 1.2 Turtle 新增 triple terms、reifying triples 和 annotation syntax，
  可直接表达“对关系本身附加元数据”的模式。InteropAtlas 将其作为 Relation 元数据映射实验的主要 RDF 1.2 具体语法。
description_en: >
  A compact textual syntax for RDF 1.2 graphs. RDF 1.2 Turtle adds triple terms, reifying triples, and annotation syntax,
  making it suitable for testing InteropAtlas relationship metadata mappings.
