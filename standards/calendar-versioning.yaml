summary_zh: 一类以项目发布时间或发布日历为核心语义的版本命名约定。CalVer 不规定唯一格式，而是定义并总结 YYYY、YY、MM、DD 等日历段的常见组合方式，适合时间敏感、按周期发布或外部变化驱动的软件、数据集和服务。
summary_en: A family of versioning conventions that encode release calendar information into version identifiers. CalVer does not prescribe a single scheme; it documents common calendar-based segments such as YYYY, YY, MM, and DD for projects where time or release cadence is meaningful.
notes_zh:
  - CalVer 与 SemVer 的标准化性质不同：它更接近公开约定与方法体系，而不是单一严格规范。
  - 常见形式包括 YYYY.MM、YY.MM、YYYY.MM.DD，也可以与传统递增版本段组合。
  - 适用于时间敏感、固定发布节奏、支持周期明确或外部变化驱动的项目。
