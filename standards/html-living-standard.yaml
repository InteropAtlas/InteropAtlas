id: html_living_standard
type: standard
name_zh: HTML Living Standard
name_en: HTML Living Standard
standard_name: HTML Living Standard
kind: specification
description_zh: >
  WHATWG 维护的 HTML Living Standard。HTML 是 Web 的核心标记语言，定义文档结构、超链接、导航及大量 Web 平台语义。
  对 InteropAtlas 的当前意义主要是未来生成可点击 Linked View（链接视图）和人类浏览界面。
description_en: >
  The WHATWG HTML Living Standard. HTML is the Web's core markup language and defines document structure, hyperlinks,
  navigation, and a broad set of Web-platform semantics. For InteropAtlas it is primarily relevant to generated linked human-facing views.
organization: whatwg
domains: [web, hypertext, documentation]
layers: [data_syntax, semantics]
system_roles: [communicate]
capabilities: [hypertext_navigation, document_representation]
maturity: mature
openness:
  specification_access: open
  governance: open
  patent_terms: unknown
  open_source_implementations: multiple
  certification: not_required
  vendor_neutrality: high
official_url: https://html.spec.whatwg.org/
versions:
  - version: living
    status: living_standard
sources:
  - url: https://html.spec.whatwg.org/
    title: HTML Standard
    language: en
    accessed: 2026-08-30
