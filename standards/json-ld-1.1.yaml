id: json_ld_1.1
type: standard
name_zh: JSON-LD 1.1 链接数据 JSON 序列化
name_en: JSON-LD 1.1
standard_name: JSON-LD 1.1
kind: specification
description_zh: >
  W3C Recommendation。JSON-LD 是一种基于 JSON 的 Linked Data（链接数据）序列化格式，
  通过 @context、IRI、@id、@type 等机制为 JSON 数据增加可解析的语义与实体链接，
  并可与 RDF 数据模型互相转换。InteropAtlas 将其作为结构化事实向语义图/Linked Data 导出的重点候选。
description_en: >
  A W3C Recommendation defining a JSON-based serialization for Linked Data. JSON-LD adds resolvable semantics and entity links
  to JSON through contexts, IRIs, node identifiers, and types, and supports conversion to and from RDF.
organization: w3c
