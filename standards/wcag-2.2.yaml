summary_zh: "定义使 Web 内容对更广泛残障用户可访问的可测试要求，并采用 A、AA、AAA 符合性等级。WCAG 2.2 是 W3C Recommendation；其内容也被 ISO/IEC 40500:2025 采用为国际标准。IA Human-readable Web 暂定以 Level AA 作为目标基线。"
summary_en: "Defines testable requirements for making web content more accessible, with A, AA, and AAA conformance levels. WCAG 2.2 is a W3C Recommendation and has also been adopted as ISO/IEC 40500:2025. IA currently targets Level AA as its human-readable web baseline."
