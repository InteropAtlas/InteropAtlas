id: git_protocol_v2
type: standard
kind: protocol
name_zh: Git 传输协议 v2
name_en: Git Wire Protocol Version 2
official_name: Git Wire Protocol, Version 2
description_zh: Git 客户端与服务端交换仓库数据时使用的传输协议版本。InteropAtlas 使用 Git/GitHub 进行版本控制，因此该协议作为首批自举研究对象纳入，但“Git 整体”不应被简化成单一标准对象。
description_en: Version 2 of Git's wire protocol for repository data exchange. InteropAtlas uses Git/GitHub for version control, so this protocol is included as a bootstrap research object; Git as a whole should not be reduced to a single standards object.
domains:
