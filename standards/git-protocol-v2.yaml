  - govern
capabilities:
  - version_control
communication_models:
  - request_response
  - client_server
maturity: mature
openness:
  specification_access: open
  governance: unknown
  patent_terms: unknown
  certification: not_required
official_url: https://git-scm.com/docs/gitprotocol-v2
