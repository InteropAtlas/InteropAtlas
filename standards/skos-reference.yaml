id: skos_reference
type: standard
name_zh: SKOS 简单知识组织系统
name_en: SKOS Simple Knowledge Organization System Reference
official_name: SKOS Simple Knowledge Organization System Reference
kind: specification
description_zh: W3C 用于表达概念、概念方案以及 broader、narrower、related 等知识组织关系的规范。InteropAtlas 当前将其作为分类与概念关系设计的重要参考，而不是直接作为全部对象的唯一数据模型。
description_en: The W3C specification for representing concepts, concept schemes, and knowledge-organization relations such as broader, narrower, and related. InteropAtlas currently treats it as a key reference for classification and concept relations rather than as the sole model for all objects.
organization: w3c
domains: [knowledge_organization, semantics, knowledge_graph]
