id: ai_application_lifecycle_governance
type: capability
name_zh: AI 应用生命周期治理
name_en: AI Application Lifecycle Governance
description_zh: "描述围绕 AI 应用从构想到使用与影响阶段进行多利益相关方沟通、责任分配、治理和持续管理的能力。"
description_en: "The capability to govern AI applications across their lifecycle, including stakeholder communication, responsibility allocation, and ongoing management."
category: govern
layers: [social_institutional]
domains: [ai, governance, lifecycle]
constraints:
  - stakeholder engagement
  - accountability
  - lifecycle traceability
  - risk management
sources:
