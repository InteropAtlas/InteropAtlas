id: human_machine_teaming
type: capability
name_zh: 人机协同编组
name_en: Human-Machine Teaming
description_zh: "描述人类与具备机器智能能力的系统如何形成协同关系、分配角色、共享上下文、完成任务并接受监督的能力。"
description_en: "The capability for humans and machine-intelligence systems to form coordinated teams, allocate roles, share context, complete tasks, and support oversight."
category: coordinate
layers: [agent_coordination, social_institutional]
domains: [ai, collaboration, governance]
constraints:
  - role clarity
  - oversight
  - handoff continuity
  - accountability
sources:
  - url: https://www.iso.org/standard/90831.html
    title: ISO/IEC CD 25589 - Framework for human-machine teaming
    language: en
    accessed: 2026-09-01
